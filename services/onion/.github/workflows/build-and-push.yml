name: Build and Deploy

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "README.md"
  workflow_dispatch:

# Cancel any in-flight run for the same branch so a rapid push doesn't
# queue three full Docker builds behind each other. Never cancel main
# (its runs deploy — let them finish).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

env:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: 101533649486.dkr.ecr.eu-west-1.amazonaws.com

jobs:
  version:
    name: Compute Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Bump version
        id: bump
        run: |
          LATEST=$(git tag --list | sed -n 's/^v\?\([0-9]\+\.[0-9]\+\.[0-9]\+\)$/\1/p' | sort -V | tail -1)

          if [ -z "$LATEST" ]; then
            NEW_VERSION="0.1.1"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            if [ "$PATCH" -ge 99 ]; then
              PATCH=0
              if [ "$MINOR" -ge 99 ]; then MINOR=0; MAJOR=$((MAJOR + 1)); else MINOR=$((MINOR + 1)); fi
            else
              PATCH=$((PATCH + 1))
            fi
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Version: $NEW_VERSION"

  build-push-deploy:
    name: Build, Push, Deploy (${{ matrix.name }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile
            repository: voxire/onion
            cluster: voxire-prod
            service: api
            desired_count: 1
          - name: worker
            dockerfile: Dockerfile.worker
            repository: voxire/onion-worker
            cluster: voxire-prod
            service: worker
            desired_count: 1
          - name: upload
            dockerfile: Dockerfile.upload
            repository: voxire/onion-upload
            cluster: voxire-prod
            service: upload
            desired_count: 1
          - name: license
            dockerfile: Dockerfile.license
            repository: voxire/onion-license
            cluster: voxire-prod
            service: license
            desired_count: 1
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION \
            | docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Build and push Docker image
        run: |
          VERSION=${{ needs.version.outputs.new_version }}
          IMAGE_URI=$ECR_REGISTRY/${{ matrix.repository }}

          docker buildx build \
            --cache-from type=gha,scope=${{ matrix.name }} \
            --cache-to   type=gha,scope=${{ matrix.name }},mode=max \
            -f ${{ matrix.dockerfile }} \
            --build-arg VERSION=$VERSION \
            --build-arg COMMIT=${GITHUB_SHA::7} \
            --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t $IMAGE_URI:$VERSION \
            -t $IMAGE_URI:latest \
            --push \
            .

          echo "Pushed $IMAGE_URI:$VERSION"

      - name: Deploy to ECS
        timeout-minutes: 15
        run: |
          set -euo pipefail

          echo "Service before deploy"
          aws ecs describe-services \
            --cluster ${{ matrix.cluster }} \
            --services ${{ matrix.service }} \
            --region $AWS_REGION \
            --query 'services[0].{desired:desiredCount,running:runningCount,pending:pendingCount,taskDefinition:taskDefinition,deployments:deployments[].{status:status,desired:desiredCount,running:runningCount,pending:pendingCount,rolloutState:rolloutState,reason:rolloutStateReason}}' \
            --output table

          aws ecs update-service \
            --cluster ${{ matrix.cluster }} \
            --service ${{ matrix.service }} \
            --desired-count ${{ matrix.desired_count }} \
            --force-new-deployment \
            --deployment-configuration "deploymentCircuitBreaker={enable=true,rollback=true},maximumPercent=200,minimumHealthyPercent=100" \
            --region $AWS_REGION \
            --query 'service.{desired:desiredCount,running:runningCount,pending:pendingCount,deployments:deployments[].{status:status,desired:desiredCount,running:runningCount,pending:pendingCount,rolloutState:rolloutState,reason:rolloutStateReason}}' \
            --output table

          aws ecs wait services-stable \
            --cluster ${{ matrix.cluster }} \
            --services ${{ matrix.service }} \
            --region $AWS_REGION

          if [ "${{ matrix.name }}" = "api" ]; then
            for attempt in $(seq 1 60); do
              if curl -fsS --max-time 8 https://api.voxire.com/health | grep -q '"status":"ok"'; then
                echo "Public API health check passed"
                exit 0
              fi
              echo "Public API health check failed, retrying ($attempt/60)"
              sleep 5
            done

            echo "Public API health check failed after ECS became stable"
            aws ecs describe-services \
              --cluster ${{ matrix.cluster }} \
              --services ${{ matrix.service }} \
              --region $AWS_REGION \
              --query 'services[0].{desired:desiredCount,running:runningCount,pending:pendingCount,events:events[0:5].message,deployments:deployments[].{status:status,desired:desiredCount,running:runningCount,pending:pendingCount,rolloutState:rolloutState,reason:rolloutStateReason}}' \
              --output table
            exit 1
          fi

  notify:
    name: Notify Slack
    needs: [version, build-push-deploy]
    if: ${{ always() && needs.build-push-deploy.result == 'success' }}
    uses: tryrtylr/pipelines/.github/workflows/notify-slack.yml@main
    with:
      message: ':rocket: *onion (API)* — deployed to production'
    secrets: inherit
