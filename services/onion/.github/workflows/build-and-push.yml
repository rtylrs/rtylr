name: Build and Tag

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "README.md"
  workflow_dispatch:

jobs:
  version:
    name: Compute Version
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Bump version and create tag
        id: bump
        run: |
          # Get all version tags, normalize to strip v prefix, sort, take highest
          LATEST=$(git tag --list | sed -n 's/^v\?\([0-9]\+\.[0-9]\+\.[0-9]\+\)$/\1/p' | sort -V | tail -1)

          if [ -z "$LATEST" ]; then
            NEW_VERSION="0.1.1"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            if [ "$PATCH" -ge 99 ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          # Create and push tag BEFORE building — this is the source of truth
          git tag -a "$NEW_VERSION" -m "Release ${NEW_VERSION}"
          git push origin "$NEW_VERSION"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Created tag $NEW_VERSION"

  build:
    name: Build
    needs: version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          VERSION=${{ needs.version.outputs.new_version }}

          docker build \
            -t voxire/onion:latest \
            -t voxire/onion:$VERSION \
            .

          echo "Built voxire/onion:$VERSION"
