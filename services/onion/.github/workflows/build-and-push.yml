name: Build and Deploy

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

env:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: 101533649486.dkr.ecr.eu-west-1.amazonaws.com
  ECR_REPOSITORY: voxire/onion
  ECS_CLUSTER: voxire-prod
  ECS_SERVICE: api

jobs:
  test:
    name: Build, Migrate, Fixtures, Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: onion_test
          MYSQL_USER: onion
          MYSQL_PASSWORD: onionpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: onion
      DB_PASSWORD: onionpw
      DB_NAME: onion_test
      JWT_SECRET: test-jwt-secret-at-least-32-characters-long
      APP_ENV: test
      REDIS_ENABLED: "false"
      INMEMORY_CACHE_MAX_SIZE_MB: "32"
      CI: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Install MySQL client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mysql-client

      - name: Wait for MySQL to be ready
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping --host=127.0.0.1 --port=3306 --user=root --password=rootpw --silent; then
              echo "MySQL is up"
              break
            fi
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done

      - name: Install sqlc
        run: |
          curl -sSL https://github.com/sqlc-dev/sqlc/releases/download/v1.29.0/sqlc_1.29.0_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin sqlc
          sqlc version

      - name: Generate sqlc code
        run: |
          chmod +x scripts/generate_sqlc.sh
          ./scripts/generate_sqlc.sh

      - name: Apply schema migrations
        run: |
          chmod +x scripts/migrate.sh
          ./scripts/migrate.sh

      - name: Load test fixtures
        run: |
          if ls scripts/fixtures/*.sql >/dev/null 2>&1; then
            for f in scripts/fixtures/*.sql; do
              echo "  → loading $(basename "$f")"
              mysql --host=127.0.0.1 --port=3306 --user=onion --password=onionpw onion_test < "$f"
            done
          else
            echo "No fixtures found in scripts/fixtures/"
          fi

      - name: go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -count=1 -timeout=10m

      - name: Tear down database
        if: always()
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=root --password=rootpw \
            -e "DROP DATABASE IF EXISTS onion_test; CREATE DATABASE onion_test;" || true

  version:
    name: Compute Version
    needs: test
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Bump version
        id: bump
        run: |
          LATEST=$(git tag --list | sed -n 's/^v\?\([0-9]\+\.[0-9]\+\.[0-9]\+\)$/\1/p' | sort -V | tail -1)

          if [ -z "$LATEST" ]; then
            NEW_VERSION="0.1.1"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"
            if [ "$PATCH" -ge 99 ]; then
              PATCH=0
              if [ "$MINOR" -ge 99 ]; then MINOR=0; MAJOR=$((MAJOR + 1)); else MINOR=$((MINOR + 1)); fi
            else
              PATCH=$((PATCH + 1))
            fi
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Version: $NEW_VERSION"

  build-push-deploy:
    name: Build, Push, Deploy
    needs: version
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION \
            | docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Build and push Docker image
        run: |
          VERSION=${{ needs.version.outputs.new_version }}
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY

          docker build \
            -t $IMAGE_URI:$VERSION \
            -t $IMAGE_URI:latest \
            .

          docker push $IMAGE_URI:$VERSION
          docker push $IMAGE_URI:latest

          echo "Pushed $IMAGE_URI:$VERSION"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION \
            --query 'service.deployments[0].{status:status,desiredCount:desiredCount}' \
            --output table

