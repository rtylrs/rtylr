name: Version

# A push to main creates a backend release/tag only. Image builds and ECS
# deployments happen when an onion service version is promoted in
# tryrtylr/deploy.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Compute version
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          latest="$(git tag --list | sed -n 's/^v\?\([0-9]\+\.[0-9]\+\.[0-9]\+\)$/\1/p' | sort -V | tail -1)"

          if [ -z "$latest" ]; then
            version='0.1.1'
          else
            IFS='.' read -r major minor patch <<< "$latest"
            if [ "$patch" -ge 99 ]; then
              patch=0
              if [ "$minor" -ge 99 ]; then
                minor=0
                major=$((major + 1))
              else
                minor=$((minor + 1))
              fi
            else
              patch=$((patch + 1))
            fi
            version="$major.$minor.$patch"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Creating source version $version"

  release:
    name: Create backend release
    needs: version
    uses: tryrtylr/pipelines/.github/workflows/create-release.yml@main
    with:
      release_tag: ${{ needs.version.outputs.version }}
      release_name: onion ${{ needs.version.outputs.version }}
      version: ${{ needs.version.outputs.version }}
      notes: "Source version for onion at ${{ github.sha }}. Build and deployment are controlled by tryrtylr/deploy."
