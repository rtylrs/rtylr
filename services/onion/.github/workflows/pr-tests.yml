name: PR Tests

on:
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"

# This workflow never touches a database. Schema changes are applied to the
# production DB manually by an operator — CI does not create, migrate, or
# connect to any database. Integration tests that need a DB skip themselves
# unless DB_HOST is set (see internal/testutil.OpenDB).
jobs:
  test:
    name: Build, Vet & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      JWT_SECRET: test-jwt-secret-at-least-32-characters-long
      APP_ENV: test
      REDIS_ENABLED: "false"
      INMEMORY_CACHE_MAX_SIZE_MB: "32"
      CI: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Install sqlc
        run: |
          curl -sSL https://github.com/sqlc-dev/sqlc/releases/download/v1.29.0/sqlc_1.29.0_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin sqlc
          sqlc version

      - name: Install contract generators
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.65.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11

      # sqlc only parses the .sql files against the schema files to generate Go
      # code (the generated package is gitignored). It does not connect to any
      # database.
      - name: Generate sqlc code
        run: |
          chmod +x scripts/generate_sqlc.sh
          ./scripts/generate_sqlc.sh

      - name: Generate Voxie contracts
        run: |
          chmod +x scripts/generate_contracts.sh
          ./scripts/generate_contracts.sh

      - name: go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -count=1 -timeout=10m
