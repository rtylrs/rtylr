name: Manual Tests

# Run the full Go test suite manually to conserve private-repository Actions
# minutes. Main-branch deploys still build the production images.
on:
  workflow_dispatch:

# The `test` job never touches a database. Schema changes are applied to the
# production DB manually by an operator: CI does not create, migrate, or
# connect to any production database. Integration tests that need a DB skip
# themselves unless DB_HOST is set (see internal/testutil.OpenDB).
jobs:
  test:
    name: Build, Vet & Test
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25

    env:
      JWT_SECRET: test-jwt-secret-at-least-32-characters-long
      APP_ENV: test
      REDIS_ENABLED: "false"
      INMEMORY_CACHE_MAX_SIZE_MB: "32"
      CI: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - name: Verify Voxie contract ref
        run: ./scripts/check-voxie-ref.sh

      - name: SQL keyword case
        run: ./scripts/check_sql_case.sh

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Install sqlc
        run: |
          GOBIN="$RUNNER_TEMP/bin"
          mkdir -p "$GOBIN"
          GOBIN="$GOBIN" go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0
          echo "$GOBIN" >> "$GITHUB_PATH"
          "$GOBIN/sqlc" version

      # sqlc only parses the .sql files against the schema files to generate Go
      # code (the generated package is gitignored). It does not connect to any
      # database.
      - name: Generate sqlc code
        run: |
          chmod +x scripts/generate_sqlc.sh
          ./scripts/generate_sqlc.sh

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11

      - name: go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -count=1 -timeout=10m
