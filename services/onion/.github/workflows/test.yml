name: Test

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Generate, lint, and test
    # Must be the Blacksmith runner, not ubuntu-latest. GitHub-hosted runners
    # cannot start on this account: its Actions spending limit is blocked, which
    # is why #741 could never go green and #742 removed it. Blacksmith is billed
    # separately and does run - build-and-push, publish-images and deploy-release
    # all use it. Changing this line back to a GitHub-hosted runner will put an
    # unavoidable red check on every pull request.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned sqlc
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate SQLC code
        run: ./scripts/generate_sqlc.sh

      # Most sqlc output is gitignored, but a few models.go files are tracked.
      # Those committed copies used to drift silently: generate runs before the
      # tests, so a stale file was always overwritten before anything read it,
      # and a fresh clone plus generate left an unexplained dirty tree. This
      # only inspects tracked files, so newly generated ignored files are fine.
      - name: Check tracked sqlc output is committed
        run: |
          if ! git diff --exit-code; then
            echo "::error::Tracked sqlc output is stale. Run ./scripts/generate_sqlc.sh with sqlc v1.29.0 and commit the result."
            exit 1
          fi

      - name: Check SQL keyword casing
        run: ./scripts/check_sql_case.sh

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...
