name: Test

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Generate, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned sqlc
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate SQLC code
        run: ./scripts/generate_sqlc.sh

      - name: Check SQL keyword casing
        run: ./scripts/check_sql_case.sh

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...
