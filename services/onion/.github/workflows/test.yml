name: Test

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-authorization:
    name: Direct authorization evidence
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install SQLC
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          set -euo pipefail
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Generate database access code
        run: make generate

      - name: Check SQL case
        run: make sql-check

      - name: Check Flow and HR route contracts
        run: make route-contract-check

      - name: Start MySQL
        run: docker compose -p onion-env -f local-env/docker-compose.yml up -d --wait db

      - name: Run direct authorization evidence
        run: make direct-authorization-evidence

      - name: Run role access rollback check
        run: make role-access-control-v2-rollback-check

      - name: Tear down MySQL
        if: always()
        run: docker compose -p onion-env -f local-env/docker-compose.yml down --volumes
