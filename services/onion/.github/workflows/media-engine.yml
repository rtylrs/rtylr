name: Media Engine

# Builds and tests the C++/libvips media-engine. Scoped to media-engine/** so it
# only runs when that subtree changes. This is the only CI that compiles the
# native engine — the Go workflows don't touch it.
on:
  push:
    branches: [main, master]
    paths:
      - "media-engine/**"
      - ".github/workflows/media-engine.yml"

jobs:
  build-test:
    name: Build & Test (libvips)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config libvips-dev
          # Debian splits the C++ binding into libvips-cpp-dev; Ubuntu bundles it
          # into libvips-dev, where the package doesn't exist — hence best-effort.
          sudo apt-get install -y --no-install-recommends libvips-cpp-dev || true
          # The CMake build hard-requires the vips-cpp pkg-config — fail loudly
          # now if it's missing rather than with a confusing CMake error.
          pkg-config --exists vips-cpp || { echo "vips-cpp pkg-config not found"; exit 1; }

      - name: Configure
        run: cmake -S media-engine -B media-engine/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build media-engine/build -j"$(nproc)"

      - name: Test
        working-directory: media-engine/build
        run: ctest --output-on-failure
