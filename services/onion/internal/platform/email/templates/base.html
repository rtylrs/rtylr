<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="x-apple-disable-message-reformatting" />
  <meta name="color-scheme" content="light dark" />
  <meta name="supported-color-schemes" content="light dark" />
  <title>{{.Subject}}</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* rtylr.com's look: flat white card on a soft grey page, hairline border,
       ink (#131313) type and a black button. Structural styles are also
       inlined below so the layout survives clients that strip <style>; the
       body templates emit bare h1/p/ul, so their typography lives here. */
    body { margin: 0 !important; padding: 0 !important; width: 100% !important; background: #f4f4f4; }
    table { border-collapse: collapse; }
    img { border: 0; line-height: 100%; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
    a { color: #131313; }
    .content h1 { margin: 0 0 14px; font-size: 24px; line-height: 1.25; font-weight: 700; color: #131313; letter-spacing: -0.4px; }
    .content p { margin: 0 0 14px; font-size: 15px; line-height: 1.6; color: #3d3d3d; }
    .content ul { margin: 0 0 16px; padding-left: 20px; }
    .content li { margin: 0 0 8px; font-size: 15px; line-height: 1.6; color: #3d3d3d; }
    .content strong { color: #131313; font-weight: 600; }
    .content .muted { margin: 24px 0 0; font-size: 13px; line-height: 1.6; color: #8a8a8a; }
    .content .fallback { margin: 18px 0 0; font-size: 12px; line-height: 1.6; color: #8a8a8a; word-break: break-all; }
    .content .fallback a { color: #6b6b6b; }
    .logo-dark { display: none; }
    @media only screen and (max-width: 600px) {
      .card { width: 100% !important; }
      .gutter { padding-left: 24px !important; padding-right: 24px !important; }
      .content h1 { font-size: 22px !important; }
    }
    /* Apple Mail and iOS honour this; other clients pick their own colours. */
    @media (prefers-color-scheme: dark) {
      body, .page { background: #0a0a0a !important; }
      .card-surface { background: #161616 !important; border-color: #2a2a2a !important; }
      .content h1, .content strong { color: #f0f0ee !important; }
      .content p, .content li { color: #c9c9c6 !important; }
      .content .muted, .content .fallback, .content .fallback a { color: #8a8a8a !important; }
      .logo-light { display: none !important; }
      .logo-dark { display: block !important; }
      .btn-cell, .btn { background: #f0f0ee !important; color: #131313 !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;width:100%;background:#f4f4f4;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" class="page" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;">
    <tr>
      <td align="center" style="padding:40px 16px 32px;">

        <!-- card -->
        <table role="presentation" class="card card-surface" width="560" cellpadding="0" cellspacing="0" style="width:560px;max-width:560px;background:#ffffff;border:1px solid #e6e6e6;border-radius:16px;border-collapse:separate;">
          <!-- logo -->
          <tr>
            <td class="gutter" style="padding:32px 40px 0;">
              <a href="{{appURL "landing"}}" style="text-decoration:none;">
                <img class="logo-light" src="{{appURL "landing"}}/logo.png" alt="rtylr" width="68" style="display:block;width:68px;height:auto;" />
                <!--[if !mso]><!-->
                <img class="logo-dark" src="{{appURL "landing"}}/logo-light.png" alt="" width="68" style="display:none;width:68px;height:auto;" />
                <!--<![endif]-->
              </a>
            </td>
          </tr>
          <!-- body -->
          <tr>
            <td class="content gutter" style="padding:28px 40px 36px;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
              {{template "body" .}}
            </td>
          </tr>
        </table>

        <!-- footer -->
        <table role="presentation" class="card" width="560" cellpadding="0" cellspacing="0" style="width:560px;max-width:560px;">
          <tr>
            <td class="gutter" style="padding:20px 40px 0;text-align:center;font-size:12px;line-height:1.7;color:#8a8a8a;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
              rtylr &middot; The all-in-one business platform<br />
              <a href="{{appURL "landing"}}" style="color:#8a8a8a;text-decoration:underline;">rtylr.com</a>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>
{{define "button"}}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0 4px;">
  <tr>
    <td class="btn-cell" bgcolor="#131313" style="border-radius:10px;background:#131313;">
      <a href="{{.URL}}" class="btn" target="_blank" style="display:inline-block;padding:13px 24px;border-radius:10px;background:#131313;color:#ffffff;font-size:15px;font-weight:600;line-height:20px;text-decoration:none;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">{{.Label}}</a>
    </td>
  </tr>
</table>
{{end}}
