<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="x-apple-disable-message-reformatting" />
  <title>{{.Subject}}</title>
  <style>
    /* Progressive enhancement. Structural styles are also inlined below so the
       layout survives clients that strip <style>. The body templates emit bare
       h1/p/ul/a.btn, so their typography lives here (Gmail honours it). */
    body { margin: 0 !important; padding: 0 !important; width: 100% !important; background: #eef0f4; }
    table { border-collapse: collapse; }
    img { border: 0; line-height: 100%; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
    a { color: #2563eb; }
    .content h1 { margin: 0 0 16px; font-size: 22px; line-height: 1.3; font-weight: 700; color: #111827; letter-spacing: -0.2px; }
    .content p { margin: 0 0 14px; font-size: 15px; line-height: 1.65; color: #3f4754; }
    .content ul { margin: 0 0 16px; padding-left: 20px; }
    .content li { margin: 0 0 8px; font-size: 15px; line-height: 1.6; color: #3f4754; }
    .content strong { color: #111827; }
    .content a.btn { display: inline-block; margin-top: 8px; padding: 13px 26px; border-radius: 8px; background: #2563eb; color: #ffffff !important; font-size: 15px; font-weight: 600; text-decoration: none; }
    .content .muted { margin-top: 28px; font-size: 13px; line-height: 1.6; color: #98a1b0; }
    @media only screen and (max-width: 600px) {
      .card { width: 100% !important; border-radius: 0 !important; }
      .gutter { padding-left: 24px !important; padding-right: 24px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;width:100%;background:#eef0f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef0f4;">
    <tr>
      <td align="center" style="padding:32px 16px;">

        <!-- card -->
        <table role="presentation" class="card" width="560" cellpadding="0" cellspacing="0" style="width:560px;max-width:560px;background:#ffffff;border:1px solid #e6e9ef;border-radius:14px;overflow:hidden;">
          <!-- header (dark, so the light logo reads) -->
          <tr>
            <td class="gutter" style="background:#111827;padding:22px 40px;">
              <img src="{{appURL "landing"}}/logo.png" alt="rtylr" width="100" height="37" style="display:block;width:100px;height:auto;" />
            </td>
          </tr>
          <!-- body -->
          <tr>
            <td class="content gutter" style="padding:34px 40px 38px;">
              {{template "body" .}}
            </td>
          </tr>
        </table>

        <!-- footer -->
        <table role="presentation" class="card" width="560" cellpadding="0" cellspacing="0" style="width:560px;max-width:560px;">
          <tr>
            <td class="gutter" style="padding:20px 40px;text-align:center;font-size:12px;line-height:1.6;color:#98a1b0;">
              rtylr &mdash; All-in-one business platform &bull;
              <a href="{{appURL "landing"}}" style="color:#98a1b0;text-decoration:underline;">rtylr.com</a>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>
