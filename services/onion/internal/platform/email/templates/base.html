<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{.Subject}}</title>
  <style>
    body { margin: 0; padding: 0; background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .wrapper { max-width: 560px; margin: 40px auto; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .header { padding: 28px 40px 20px; border-bottom: 1px solid #f0f0f0; }
    .logo { font-size: 18px; font-weight: 700; color: #111; letter-spacing: -0.3px; }
    .body { padding: 32px 40px; color: #333; font-size: 15px; line-height: 1.7; }
    .body h1 { font-size: 22px; font-weight: 700; color: #111; margin: 0 0 16px 0; }
    .body p { margin: 0 0 14px 0; color: #444; }
    .body ul { padding-left: 20px; margin: 0 0 14px 0; }
    .body ul li { margin-bottom: 6px; color: #444; }
    .btn { display: inline-block; background: #4583C4; color: #ffffff !important; padding: 13px 28px; border-radius: 8px; text-decoration: none; font-size: 15px; font-weight: 600; margin-top: 8px; }
    .muted { font-size: 13px; color: #999; margin-top: 28px; }
    .footer { padding: 20px 40px 28px; border-top: 1px solid #f0f0f0; font-size: 12px; color: #aaa; line-height: 1.6; }
    .footer a { color: #aaa; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <span class="logo">rtylr</span>
    </div>
    <div class="body">
      {{template "body" .}}
    </div>
    <div class="footer">
      rtylr &mdash; All-in-one business platform &bull;
      <a href="https://rtylr.com">rtylr.com</a>
    </div>
  </div>
</body>
</html>
