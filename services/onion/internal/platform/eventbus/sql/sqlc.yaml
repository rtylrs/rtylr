version: "2"
sql:
  - engine: "mysql"
    queries: "queries"
    schema:
      - "../../../../internal/platform/database/schemas/shared/zz_platform_event_delivery.sql"
      # Read to decide who an event fans out to. The dispatcher never writes
      # either table.
      - "../../../../internal/platform/database/schemas/hub/hub_webhooks.sql"
      - "../../../../internal/platform/database/schemas/crm/crm_automations.sql"
    gen:
      go:
        package: "sqlc"
        out: "../internal/infrastructure/persistence/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_db_tags: true
