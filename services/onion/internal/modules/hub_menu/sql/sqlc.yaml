version: "2"
sql:
  - engine: "mysql"
    queries: "queries"
    schema:
      - "schema/hub/hub_menu_banners.sql"
      - "schema/hub/hub_navigation_menus.sql"
    gen:
      go:
        package: "sqlc"
        out: "../internal/infrastructure/persistence/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_db_tags: true
