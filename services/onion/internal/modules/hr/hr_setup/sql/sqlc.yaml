version: "2"
sql:
  - engine: "mysql"
    queries: "queries"
    schema:
      - "../../sql/schema/hr_setup/schema.sql"
      - "../../sql/schema/hr_core/schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "../internal/infrastructure/persistence/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_db_tags: true
