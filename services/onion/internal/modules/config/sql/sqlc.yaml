version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema:
      - "../../../../internal/platform/database/schemas/shared"
    gen:
      go:
        package: "sqlc"
        out: "../internal/infrastructure/persistence/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
