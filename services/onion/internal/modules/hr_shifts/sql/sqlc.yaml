version: "2"
sql:
  - engine: "mysql"
    queries: "queries"
    schema:
      - "../../../../internal/platform/database/schemas/shared"
      - "../../../../internal/platform/database/schemas/hr_shifts"
    gen:
      go:
        package: "sqlc"
        out: "../internal/infrastructure/persistence/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_db_tags: true
        # sqlc maps MySQL TIME to time.Time, but the driver always hands TIME
        # back as []byte, so scanning into time.Time fails at runtime with
        # "unsupported Scan". These columns are read as strings instead; MySQL
        # coerces an "HH:MM:SS" string on the way back in.
        overrides:
          - column: "hr_shifts.start_time"
            go_type: "string"
          - column: "hr_shifts.end_time"
            go_type: "string"
          - column: "hr_staff_availability.start_time"
            go_type: "string"
          - column: "hr_staff_availability.end_time"
            go_type: "string"
