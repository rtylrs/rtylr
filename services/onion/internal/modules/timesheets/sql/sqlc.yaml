version: "2"
sql:
  - engine: "mysql"
    queries: "queries"
    schema:
      - "../../../../internal/platform/database/schemas/shared"
      - "../../../../internal/platform/database/schemas/hr"
      # hr_shifts lives in its own schema directory; this module reads it.
      - "../../../../internal/platform/database/schemas/hr_shifts"
    gen:
      go:
        package: "sqlc"
        out: "../internal/infrastructure/persistence/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_db_tags: true
