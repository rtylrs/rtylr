version: "2"
sql:
  - engine: "mysql"
    queries: "queries"
    schema:
      - "schema/shared/dead_delivery_notices.sql"
      - "schema/shared/webhook_deliveries.sql"
      - "schema/hub/hub_webhooks.sql"
    gen:
      go:
        package: "sqlc"
        out: "../internal/infrastructure/persistence/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_db_tags: true
