version: "2"
sql:
  - engine: "mysql"
    queries: "queries"
    schema:
      - "../../../../internal/platform/database/schemas/shared/config.sql"
      - "../../../../internal/platform/database/schemas/shared/user_apps.sql"
      - "schema/businesses.sql"
      - "schema/user_business_access.sql"
      - "../../../../internal/platform/database/schemas/hr_core/schema.sql"
    gen:
      go:
        package: "sqlc"
        out: "../internal/infrastructure/persistence/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_db_tags: true
