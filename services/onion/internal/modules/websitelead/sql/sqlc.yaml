version: "2"
sql:
  - engine: "mysql"
    queries: "queries"
    schema:
      - "schema/voxire/faq.sql"
      - "schema/voxire/newsletter_subscribers.sql"
      - "schema/voxire/website_leads.sql"
    gen:
      go:
        package: "sqlc"
        out: "../internal/infrastructure/persistence/sqlc"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_db_tags: true
