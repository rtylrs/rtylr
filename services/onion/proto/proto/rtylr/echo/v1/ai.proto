syntax = "proto3";

package rtylr.echo.v1;

// AIType categorizes the kind of AI operation.
enum AIType {
  AI_TYPE_UNSPECIFIED = 0;
  AI_TYPE_CHAT = 1;
  AI_TYPE_TRANSLATION = 2;
  AI_TYPE_SUMMARIZATION = 3;
  AI_TYPE_ANALYSIS = 4;
}

// AIProvider identifies the AI backend.
enum AIProvider {
  AI_PROVIDER_UNSPECIFIED = 0;
  AI_PROVIDER_OPENAI = 1;
  AI_PROVIDER_GEMINI = 2;
  AI_PROVIDER_ANTHROPIC = 3;
  AI_PROVIDER_LOCAL = 4;
}

// ChatRequest sends a message to the AI chat service.
message ChatRequest {
  string message = 1;
  string session_id = 2;
  int64 user_id = 3;
  AIType ai_type = 4;
  AIProvider provider = 5;
}

// ChatResponse contains the AI's response and state.
message ChatResponse {
  string response = 1;
  bool is_complete = 2;
  string session_id = 3;
}

// GetProviderStatusRequest queries the AI provider status.
message GetProviderStatusRequest {}

// GetProviderStatusResponse returns provider availability information.
message GetProviderStatusResponse {
  bool available = 1;
  string primary_provider = 2;
  map<string, bool> providers = 3;
}

// GenerateTextStreamRequest requests streamed text generation.
message GenerateTextStreamRequest {
  string prompt = 1;
  string session_id = 2;
  int64 user_id = 3;
}

// GenerateTextStreamResponse contains streamed text tokens.
message GenerateTextStreamResponse {
  string response = 1;
  bool is_complete = 2;
  string session_id = 3;
}
