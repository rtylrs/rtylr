syntax = "proto3";

package rtylr.memory.v1;

import "google/protobuf/timestamp.proto";
import "proto/common/v1/common.proto";

// GetChatHistoryRequest requests a user's chat history.
message GetChatHistoryRequest {
  int64 user_id = 1;
  string session_id = 2;
  int32 limit = 3;
  int32 offset = 4;
}

// GetChatHistoryResponse returns chat messages and counts.
message GetChatHistoryResponse {
  repeated ChatMessage messages = 1;
  int32 total_count = 2;
}

// ChatMessage represents a single stored chat message.
message ChatMessage {
  int64 id = 1;
  int64 user_id = 2;
  string session_id = 3;
  string role = 4;
  string content = 5;
  google.protobuf.Timestamp created_at = 6;
}

// GetContextRequest requests conversation context for a session.
message GetContextRequest {
  int64 user_id = 1;
  string session_id = 2;
}

// GetContextResponse returns context messages and token usage.
message GetContextResponse {
  repeated string context_messages = 1;
  int32 token_count = 2;
}

// SearchRequest searches across a user's chat data.
message SearchRequest {
  int64 user_id = 1;
  string query = 2;
  int32 limit = 3;
}

// SearchResponse returns search results.
message SearchResponse {
  repeated SearchResult results = 1;
}

// SearchResult describes a single search match.
message SearchResult {
  int64 message_id = 1;
  string session_id = 2;
  string content = 3;
  float relevance_score = 4;
  google.protobuf.Timestamp created_at = 5;
}

// GetStatsRequest requests usage statistics for a user.
message GetStatsRequest {
  int64 user_id = 1;
}

// GetStatsResponse returns usage statistics and pagination.
message GetStatsResponse {
  int32 total_conversations = 1;
  int32 total_messages = 2;
  int64 total_tokens = 3;
  google.protobuf.Timestamp first_conversation = 4;
  google.protobuf.Timestamp last_conversation = 5;
  common.v1.PaginationResponse pagination = 6;
}

// SummarizeRequest requests a summary for a session.
message SummarizeRequest {
  int64 user_id = 1;
  string session_id = 2;
}

// SummarizeResponse returns a summary and token counts.
message SummarizeResponse {
  string summary = 1;
  int32 message_count = 2;
  int32 token_count = 3;
}
