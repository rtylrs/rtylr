syntax = "proto3";

package zontriq.automations.v1;

import "proto/common/v1/common.proto";

// Automation describes a scheduled content generation rule.
message Automation {
  int64 id = 1;
  int64 series_id = 2;
  string series_name = 3;
  string name = 4;
  string frequency = 5;
  string state = 6;
  string next_run = 7;
  string last_run = 8;
  int32 videos_generated = 9;
  repeated AutomationChannel channels = 10;
  int32 status = 11;
  string created_at = 12;
  string updated_at = 13;
}

// AutomationChannel links an automation to a target channel.
message AutomationChannel {
  int64 id = 1;
  int64 channel_id = 2;
  string channel_name = 3;
  string platform = 4;
}

// ListAutomationsRequest fetches automations for the authenticated user.
message ListAutomationsRequest {
  string state = 1;
  common.v1.PaginationRequest pagination = 2;
}

// ListAutomationsResponse returns the user automations.
message ListAutomationsResponse {
  repeated Automation automations = 1;
  common.v1.PaginationResponse pagination = 2;
}

// GetAutomationRequest fetches a single automation by ID.
message GetAutomationRequest {
  int64 id = 1;
}

// GetAutomationResponse returns an automation.
message GetAutomationResponse {
  Automation automation = 1;
}

// CreateAutomationRequest creates a new automation.
message CreateAutomationRequest {
  int64 series_id = 1;
  string name = 2;
  string frequency = 3;
  repeated int64 channel_ids = 4;
}

// CreateAutomationResponse returns the created automation.
message CreateAutomationResponse {
  Automation automation = 1;
}

// UpdateAutomationRequest updates an existing automation.
message UpdateAutomationRequest {
  int64 id = 1;
  string name = 2;
  string frequency = 3;
  string state = 4;
  repeated int64 channel_ids = 5;
}

// UpdateAutomationResponse returns the updated automation.
message UpdateAutomationResponse {
  Automation automation = 1;
}

// DeleteAutomationRequest soft-deletes an automation.
message DeleteAutomationRequest {
  int64 id = 1;
}

// DeleteAutomationResponse confirms deletion.
message DeleteAutomationResponse {}
