syntax = "proto3";

package zontriq.users.v1;

// Preferences describes user notification and default settings.
message Preferences {
  string default_voice = 1;
  string default_niche = 2;
  bool notify_video_ready = 3;
  bool notify_publish_success = 4;
  bool notify_publish_failure = 5;
  bool notify_quota_warning = 6;
  bool notify_weekly_report = 7;
}

// UpdatePreferencesRequest updates user preferences.
message UpdatePreferencesRequest {
  Preferences preferences = 1;
}

// UpdatePreferencesResponse returns updated preferences.
message UpdatePreferencesResponse {
  Preferences preferences = 1;
}
