syntax = "proto3";

package zontriq.audio.v1;

import "proto/common/v1/common.proto";

// AudioClip describes a generated audio file.
message AudioClip {
  int64 id = 1;
  string title = 2;
  string script = 3;
  string voice_id = 4;
  string voice_name = 5;
  string provider = 6;
  string audio_url = 7;
  int32 duration_seconds = 8;
  string state = 9;
  string error_message = 10;
  int32 status = 11;
  string created_at = 12;
  string updated_at = 13;
}

// GenerateAudioRequest creates and generates an audio clip from text.
message GenerateAudioRequest {
  string title = 1;
  string script = 2;
  string voice_id = 3;
  string provider = 4;
}

// GenerateAudioResponse returns the created audio clip.
message GenerateAudioResponse {
  AudioClip audio = 1;
}

// ListAudioRequest fetches audio clips for the authenticated user.
message ListAudioRequest {
  common.v1.PaginationRequest pagination = 1;
}

// ListAudioResponse returns the user's audio clips.
message ListAudioResponse {
  repeated AudioClip clips = 1;
  common.v1.PaginationResponse pagination = 2;
}

// GetAudioRequest fetches a single audio clip by ID.
message GetAudioRequest {
  int64 id = 1;
}

// GetAudioResponse returns an audio clip.
message GetAudioResponse {
  AudioClip audio = 1;
}

// DeleteAudioRequest soft-deletes an audio clip.
message DeleteAudioRequest {
  int64 id = 1;
}

// DeleteAudioResponse confirms deletion.
message DeleteAudioResponse {}
