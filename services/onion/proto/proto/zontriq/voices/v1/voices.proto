syntax = "proto3";

package zontriq.voices.v1;

// Voice describes a TTS voice option.
message Voice {
  string id = 1;
  string name = 2;
  string description = 3;
  string provider = 4;
  string preview_url = 5;
  string gender = 6;
  string accent = 7;
}

// ListVoicesRequest fetches available voices.
message ListVoicesRequest {
  string provider = 1;
}

// ListVoicesResponse returns available voices.
message ListVoicesResponse {
  repeated Voice voices = 1;
}
