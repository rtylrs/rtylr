syntax = "proto3";

package voxire.careers.v1;

// GetActiveCareersRequest requests the list of active careers.
message GetActiveCareersRequest {}

// GetActiveCareersResponse returns active careers.
message GetActiveCareersResponse {
  repeated Career careers = 1;
}

// Career describes a single career listing.
message Career {
  int64 id = 1;
  string title = 2;
  string department = 3;
  string location = 4;
  string employment_type = 5;
  string work_mode = 6;
  string seniority = 7;
  string details = 8;
  bool is_active = 9;
}
