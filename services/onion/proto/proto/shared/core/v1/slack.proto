syntax = "proto3";

package shared.core.v1;

// SlackErrorLogRequest describes an error payload to send to Slack.
message SlackErrorLogRequest {
  string source = 1;
  string level = 2;
  string message = 3;
  string stack = 4;
  string component_stack = 5;
  string url = 6;
  repeated string args = 7;
  string meta_json = 8;
  string formatted = 9;
}

// SlackErrorLogResponse reports the status of the Slack send.
message SlackErrorLogResponse {
  string status = 1;
  bool sent = 2;
  string message = 3;
}
