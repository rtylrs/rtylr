syntax = "proto3";

package shared.account.v1;

// LoginRequest contains credentials for user authentication.
message LoginRequest {
  string email = 1;
  string password = 2;
}

// LoginResponse returns the issued token and basic user info.
message LoginResponse {
  string token = 1;
  string message = 2;
  int64 user_id = 3;
  string email = 4;
  string name = 5;
}
