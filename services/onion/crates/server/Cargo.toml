[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
auth = { path = "../auth" }
onion-core = { package = "onion-core", path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
