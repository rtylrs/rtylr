[package]
name = "contracts"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
async-stream = "0.3"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
http = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = "0.5"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
validator = "0.20"
