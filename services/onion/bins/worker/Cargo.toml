[package]
name = "worker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "worker"
path = "src/main.rs"

[dependencies]
axum = "0.8"
db = { path = "../../crates/db" }
onion-core = { package = "onion-core", path = "../../crates/core" }
server = { path = "../../crates/server" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
