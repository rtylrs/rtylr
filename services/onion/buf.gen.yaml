version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/voxire/onion/internal/platform/models/proto/generated
plugins:
  - plugin: go
    out: internal/platform/models/proto/generated
    opt: paths=source_relative
  - plugin: go-grpc
    out: internal/platform/models/proto/generated
    opt: paths=source_relative
