# Cloud Build pipeline for onion → Cloud Run. (re-trigger: v4)
#
# Triggered on push to `main`. Three steps:
#
#   1. Initialise the `voxie` git submodule.
#      - Default Cloud Build clones the single repo only; it does not
#        recurse into submodules. The Dockerfile COPYs `voxie/` into
#        the build context, so without this step the Docker build
#        errors out in ~10s with a missing-path failure.
#      - Uses the generic `gcr.io/cloud-builders/git` builder with
#        the build's own GitHub App credentials. `voxie` lives under
#        the same `voxire` org as `onion`, so the same installation
#        token works — no extra secret needed. If the voxie repo is
#        made private-outside-org later, swap the init command for
#        `gcloud secrets versions access` + `git config` to inject a
#        PAT from Secret Manager.
#
#   2. Build the Docker image. The Dockerfile itself handles sqlc
#      codegen (gitignored, regenerated on every build) and the Go
#      compile. We pass `--no-cache` to match the previous trigger
#      setting; drop once we trust the layer cache.
#
#   3. Push the image to Artifact Registry (replaces step 2 of the
#      old auto-generated pipeline).
#
#   4. Deploy the new revision to Cloud Run. `update` rather than
#      `create` so the service-level config (env vars, min-instances,
#      concurrency, VPC connector, service-account) set via the
#      console is preserved. We only swap the image tag.
#
# Substitutions expected at trigger time:
#   _REGION         — e.g. us-central1
#   _REPO           — Artifact Registry repo, e.g. cloud-run-source-deploy
#   _SERVICE        — Cloud Run service name, e.g. onion-backend
#
# If the trigger was created from the Cloud Run "deploy from source"
# flow, those three are auto-populated. Verify them on the trigger
# edit page if the build fails with a missing-substitution error.

substitutions:
  _REGION: us-central1
  _REPO: cloud-run-source-deploy
  _SERVICE: onion-backend

steps:
  - id: 'Init voxie submodule'
    name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    secretEnv: ['GITHUB_PAT']
    args:
      - '-c'
      - |
        set -euo pipefail
        # Cloud Build's auto-clone uses the GitHub App token to pull
        # `onion`, but does not plumb that token into subsequent
        # `git submodule` subprocesses. So we rewrite HTTPS GitHub
        # URLs to use a PAT stored in Secret Manager (Classic PAT
        # with `repo` scope on voxie; see README for provisioning).
        #
        # NOTE: Cloud Build eats single `$` sequences at YAML-parse
        # time. We use `$$` so bash receives a literal `$` at run
        # time — without it you get "GITHUB_PAT is not a valid
        # built-in substitution" before the step even starts.
        git config --global \
          url."https://x-access-token:$${GITHUB_PAT}@github.com/".insteadOf \
          "https://github.com/"
        git submodule sync --recursive
        git submodule update --init --recursive
        if [ ! -f ./voxie/go.mod ]; then
          git clone --depth 1 https://github.com/tryrtylr/voxie.git ./voxie
        fi
        if [ ! -f ./internal/platform/database/schemas/hr_core/schema.sql ]; then
          git clone --depth 1 https://github.com/tryrtylr/schemas.git ./internal/platform/database/schemas
        fi
        if [ ! -d ./internal/platform/email/templates ]; then
          git clone --depth 1 https://github.com/tryrtylr/email-templates.git ./internal/platform/email/templates
        fi
        # Scrub the URL rewrite so nothing leaks downstream.
        git config --global --unset-all url."https://x-access-token:$${GITHUB_PAT}@github.com/".insteadOf || true

  - id: 'Build'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--no-cache'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest'
      - '.'

  - id: 'Push'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}'

  - id: 'Deploy'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update'
      - '${_SERVICE}'
      - '--region=${_REGION}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:$COMMIT_SHA'
      - '--quiet'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}'

options:
  logging: CLOUD_LOGGING_ONLY
  # Bump machine if the Go build time gets tight. Default is N1 1vCPU.
  # machineType: 'E2_HIGHCPU_8'

timeout: '1200s'

# Secret Manager injection for the voxie submodule clone. One-time
# setup (see `git log` for the commit that added this — the three
# gcloud commands needed are in the commit body). The secret name
# below must match what you created; update if you chose differently.
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/github-voxie-pat/versions/latest
      env: 'GITHUB_PAT'
