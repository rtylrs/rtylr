# One workspace for the whole product: the shared library layer and every
# product workspace (apps/rtylr, apps/landing, ...). A single install is what
# keeps one copy of each dependency, and type identity across packages needs
# that: a linked package type-checked inside a consumer's program must resolve
# the same files, not merely the same versions.
packages:
  - 'packages/*'
  - 'voxie'
  - 'apps/rtylr'
  - 'apps/rtylr/apps/*'
  - 'apps/landing'
  - 'apps/pos'
  - 'apps/docs'
  - 'apps/mcp'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - protobufjs

overrides:
  postcss: '>=8.5.23'
  protobufjs: '>=8.2.0'
  '@protobufjs/utf8': '>=1.1.1'
  undici: '>=6.28.0 <8.0.0'
  react: 19.2.5
  react-dom: 19.2.5
  '@remix-run/router': '>=1.23.2'
  follow-redirects: '>=1.16.0'
  'brace-expansion@>=1.0.0 <2.0.0': '>=1.1.18 <2.0.0'
  brace-expansion@>=5.0.0: '>=5.0.9 <6.0.0'
  'immutable': '>=5.1.8 <6.0.0'
  'js-yaml': '>=4.3.1 <5.0.0'
  'nanoid@>=3.0.0 <4.0.0': '>=3.3.18 <4.0.0'
  ws@>=8.0.0: ">=8.20.1"
  happy-dom: 20.9.0
