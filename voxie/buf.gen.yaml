version: v2
plugins:
  # Go code generation
  - local: protoc-gen-go
    out: gen/go
    opt:
      - paths=source_relative

  # TypeScript - pure interfaces only (no protobuf runtime)
  - local: protoc-gen-ts_proto
    out: gen/ts
    opt:
      - esModuleInterop=true
      - outputServices=false
      - env=browser
      - useExactTypes=false
      - exportCommonSymbols=false
      - onlyTypes=true
