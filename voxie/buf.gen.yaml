version: v2
plugins:
  # Go code generation
  - local: protoc-gen-go
    out: gen/go
    opt:
      - paths=source_relative

  # TypeScript code generation
  - local: protoc-gen-ts_proto
    out: gen/ts
    opt:
      - esModuleInterop=true
      - outputServices=false
      - env=browser
      - useExactTypes=false
      - exportCommonSymbols=false
