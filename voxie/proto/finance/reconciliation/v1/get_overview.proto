syntax = "proto3";

package finance.reconciliation.v1;

import "finance/reconciliation/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/reconciliation/v1";

message GetOverviewRequest {}

message GetOverviewResponse {
  repeated UnmatchedBankTransaction unmatched_bank_txns = 1;
  repeated UnmatchedInvoice unmatched_invoices = 2;
  repeated MatchSuggestion suggestions = 3;
}
