syntax = "proto3";

package finance.expenses.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/expenses/v1";

message UpdateExpenseRequest {
  // id is the unique identifier for the expense.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // category_id is the category id value for this contract.
  optional int64 category_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING, (onekit.http.nullable) = true];
  // amount is the amount value for this contract.
  double amount = 3 [(buf.validate.field).double.gte = 0];
  // currency is the currency value for this contract.
  string currency = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // description is the description value for this contract.
  string description = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // vendor is the vendor value for this contract.
  string vendor = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // receipt_url is the receipt url value for this contract.
  string receipt_url = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // expense_date is the expense date value for this contract.
  string expense_date = 8 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message UpdateExpenseResponse {
  // message is a human-readable result message.
  string message = 1;
}
