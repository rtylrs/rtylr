syntax = "proto3";

package finance.expenses.v1;

import "finance/expenses/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/expenses/v1";

message ListExpensesRequest {}

message ListExpensesResponse {
  // expenses is the expenses value for this contract.
  repeated Expense expenses = 1;
}
