syntax = "proto3";

package finance.bank_account.v1;

import "buf/validate/validate.proto";
import "finance/bank_account/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/bank_account/v1";

message CreateBankAccountRequest {
  // name is the name value for this contract.
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // bank_name is the bank name value for this contract.
  string bank_name = 2 [(buf.validate.field).string.min_len = 1];
  // account_type is the account type value for this contract.
  string account_type = 3 [(buf.validate.field).string.min_len = 1];
  // last_four is the last four value for this contract.
  string last_four = 4 [(buf.validate.field).string.min_len = 1];
  // balance is the balance value for this contract.
  double balance = 5;
  // currency is the currency value for this contract.
  string currency = 6 [(buf.validate.field).string.min_len = 1];
  // is_primary is the is primary value for this contract.
  bool is_primary = 7;
}

message CreateBankAccountResponse {
  // account is the account value for this contract.
  BankAccount account = 1;
}
