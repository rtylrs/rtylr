syntax = "proto3";

package finance.bank_account.v1;

import "common/pagination/v1/pagination.proto";
import "finance/bank_account/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/bank_account/v1";

message ListBankAccountsRequest {
  // pagination is the pagination value for this contract.
  common.pagination.v1.PaginationRequest pagination = 1 [(onekit.http.flatten) = true];
}

message ListBankAccountsResponse {
  // accounts is the accounts value for this contract.
  repeated BankAccount accounts = 1;
  // pagination is the pagination value for this contract.
  common.pagination.v1.PaginationResponse pagination = 2;
}
