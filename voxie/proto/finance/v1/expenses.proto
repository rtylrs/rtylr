syntax = "proto3";

package finance.v1;

option go_package = "github.com/voxire/voxie/gen/go/finance/v1";

// ── Expenses ────────────────────────────────────────────────────────

message Expense {
  int64 id = 1;
  int64 owner_id = 2;
  optional int64 category_id = 3;
  double amount = 4;
  string currency = 5;
  string description = 6;
  string vendor = 7;
  string receipt_url = 8;
  string expense_date = 9;
  string status = 10;
  string created_at = 11;
  string updated_at = 12;
}

message ListExpensesRequest {}

message ListExpensesResponse {
  repeated Expense expenses = 1;
}

message CreateExpenseRequest {
  optional int64 category_id = 1;
  double amount = 2;
  string currency = 3;
  string description = 4;
  string vendor = 5;
  string receipt_url = 6;
  string expense_date = 7;
}

message CreateExpenseResponse {
  int64 expense_id = 1;
  string message = 2;
}

message UpdateExpenseRequest {
  optional int64 category_id = 1;
  double amount = 2;
  string currency = 3;
  string description = 4;
  string vendor = 5;
  string receipt_url = 6;
  string expense_date = 7;
}

message UpdateExpenseResponse {
  string message = 1;
}

message DeleteExpenseRequest {
}

message DeleteExpenseResponse {
  string message = 1;
}

// ── Expense Categories ─────────────────────────────────────────────

message ExpenseCategory {
  int64 id = 1;
  int64 owner_id = 2;
  string name = 3;
  string color = 4;
  string created_at = 5;
}

message ListExpenseCategoriesRequest {}

message ListExpenseCategoriesResponse {
  repeated ExpenseCategory categories = 1;
}
