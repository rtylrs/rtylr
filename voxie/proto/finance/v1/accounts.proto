syntax = "proto3";

package finance;

option go_package = "github.com/voxire/voxie/gen/go/finance/v1";

// ── Accounts ───────────────────────────────────────────────────────

message Account {
  int64 id = 1;
  int64 owner_id = 2;
  string name = 3;
  string type = 4;
  string currency = 5;
  double balance = 6;
  bool is_active = 7;
  string created_at = 8;
}

message ListAccountsRequest {}

message ListAccountsResponse {
  repeated Account accounts = 1;
}

message CreateAccountRequest {
  string name = 1;
  string type = 2;
  string currency = 3;
  double balance = 4;
  bool is_active = 5;
}

message CreateAccountResponse {
  int64 id = 1;
  string message = 2;
}
