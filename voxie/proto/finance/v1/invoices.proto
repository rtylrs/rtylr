syntax = "proto3";

package finance;

option go_package = "github.com/voxire/voxie/gen/go/finance/v1";

import "common/v1/pagination.proto";

// ── Invoices ────────────────────────────────────────────────────────

message Invoice {
  int64 id = 1;
  string number = 2;
  int64 customer_id = 3;
  string customer_name = 4;
  string status = 5; // draft, sent, paid, overdue, cancelled
  repeated InvoiceLine lines = 6;
  double subtotal = 7;
  double tax = 8;
  double discount = 9;
  double total = 10;
  double amount_paid = 11;
  double balance_due = 12;
  string currency = 13;
  string issue_date = 14;
  string due_date = 15;
  string paid_at = 16;
  string notes = 17;
  string created_at = 18;
  string updated_at = 19;
}

message InvoiceLine {
  string description = 1;
  int32 quantity = 2;
  double unit_price = 3;
  double tax_rate = 4;
  double total = 5;
}

message ListInvoicesRequest {
  common.PaginationRequest pagination = 1;
  string status = 2;
  int64 customer_id = 3;
  string from_date = 4;
  string to_date = 5;
}

message ListInvoicesResponse {
  repeated Invoice invoices = 1;
  common.PaginationResponse pagination = 2;
}

message GetInvoiceRequest {
  int64 id = 1;
}

message GetInvoiceResponse {
  Invoice invoice = 1;
}

message CreateInvoiceRequest {
  int64 customer_id = 1;
  repeated InvoiceLine lines = 2;
  string due_date = 3;
  double discount = 4;
  string notes = 5;
  string currency = 6;
}

message CreateInvoiceResponse {
  Invoice invoice = 1;
}

message UpdateInvoiceRequest {
  int64 id = 1;
  int64 customer_id = 2;
  repeated InvoiceLine lines = 3;
  string due_date = 4;
  double discount = 5;
  string notes = 6;
}

message UpdateInvoiceResponse {
  Invoice invoice = 1;
}

message DeleteInvoiceRequest {
  int64 id = 1;
}

message DeleteInvoiceResponse {
  bool success = 1;
}

message SendInvoiceRequest {
  int64 id = 1;
  string recipient_email = 2;
}

message SendInvoiceResponse {
  bool success = 1;
}

message RecordPaymentRequest {
  int64 invoice_id = 1;
  double amount = 2;
  string method = 3; // cash, card, bank_transfer, check
  string reference = 4;
  string paid_at = 5;
}

message RecordPaymentResponse {
  Invoice invoice = 1;
}

message UpdateInvoiceStatusRequest {
  int64 id = 1;
  string status = 2;
}

message UpdateInvoiceStatusResponse {
  Invoice invoice = 1;
}
