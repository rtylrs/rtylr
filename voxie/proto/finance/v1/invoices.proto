syntax = "proto3";

package finance;

option go_package = "github.com/voxire/voxie/gen/go/finance/v1";

// ── Invoices ────────────────────────────────────────────────────────

message InvoiceItem {
  string description = 1;
  double quantity = 2;
  string unit = 3;
  double unit_price = 4;
  double tax_rate = 5;
  double discount_pct = 6;
  int64 sort_order = 7;
  double total = 8;
}

message InvoiceSummary {
  int64 id = 1;
  string invoice_number = 2;
  string client_name = 3;
  string status = 4;
  string issue_date = 5;
  string due_date = 6;
  string paid_date = 7;
  string currency = 8;
  double total = 9;
  double amount_paid = 10;
  double amount_due = 11;
  string created_at = 12;
}

message InvoiceDetail {
  int64 id = 1;
  int64 owner_id = 2;
  string invoice_number = 3;
  string client_name = 4;
  string client_email = 5;
  string client_address = 6;
  string client_tax_id = 7;
  string status = 8;
  string issue_date = 9;
  string due_date = 10;
  string paid_date = 11;
  string currency = 12;
  double subtotal = 13;
  string discount_type = 14;
  double discount_value = 15;
  double discount_amount = 16;
  double tax_rate = 17;
  double tax_amount = 18;
  double total = 19;
  double amount_paid = 20;
  double amount_due = 21;
  string notes = 22;
  string terms = 23;
  string created_at = 24;
  string updated_at = 25;
  repeated InvoiceItem items = 26;
}

message ListInvoicesRequest {
  string status = 1;
  string search = 2;
  string date_from = 3;
  string date_to = 4;
}

message ListInvoicesResponse {
  repeated InvoiceSummary invoices = 1;
}

message GetInvoiceRequest {
  int64 id = 1;
}

message Payment {
  int64 id = 1;
  double amount = 2;
  string currency = 3;
  string payment_date = 4;
  string method = 5;
  string reference = 6;
  string notes = 7;
}

message GetInvoiceResponse {
  InvoiceDetail invoice = 1;
  repeated Payment payments = 2;
}

message CreateInvoiceRequest {
  string client_name = 1;
  string client_email = 2;
  string client_address = 3;
  string client_tax_id = 4;
  string issue_date = 5;
  string due_date = 6;
  string currency = 7;
  string discount_type = 8;
  double discount_value = 9;
  double tax_rate = 10;
  string notes = 11;
  string terms = 12;
  repeated InvoiceItem items = 13;
}

message CreateInvoiceResponse {
  InvoiceDetail invoice = 1;
}

message UpdateInvoiceRequest {
  int64 id = 1;
  string client_name = 2;
  string client_email = 3;
  string client_address = 4;
  string client_tax_id = 5;
  string issue_date = 6;
  string due_date = 7;
  string currency = 8;
  string discount_type = 9;
  double discount_value = 10;
  double tax_rate = 11;
  string notes = 12;
  string terms = 13;
  repeated InvoiceItem items = 14;
}

message UpdateInvoiceResponse {
  InvoiceDetail invoice = 1;
}

message UpdateInvoiceStatusRequest {
  int64 id = 1;
  string status = 2;
}

message UpdateInvoiceStatusResponse {
  string message = 1;
}

message DeleteInvoiceRequest {
  int64 id = 1;
}

message DeleteInvoiceResponse {
  string message = 1;
}

message RecordPaymentRequest {
  int64 invoice_id = 1;
  double amount = 2;
  string currency = 3;
  string payment_date = 4;
  string method = 5;
  string reference = 6;
  string notes = 7;
}

message RecordPaymentResponsePayload {
  int64 id = 1;
  int64 invoice_id = 2;
  double amount = 3;
  string currency = 4;
  string payment_date = 5;
  string method = 6;
  string reference = 7;
  string notes = 8;
}

message RecordPaymentResponse {
  RecordPaymentResponsePayload payment = 1;
  string message = 2;
}
