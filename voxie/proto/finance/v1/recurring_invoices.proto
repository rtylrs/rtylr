syntax = "proto3";

package finance;

option go_package = "github.com/voxire/voxie/gen/go/finance/v1";

import "common/v1/pagination.proto";

// ── Recurring Invoices ──────────────────────────────────────────────

message RecurringInvoice {
  int64 id = 1;
  int64 customer_id = 2;
  string customer_name = 3;
  string frequency = 4; // weekly, monthly, quarterly, yearly
  repeated RecurringInvoiceLine lines = 5;
  double subtotal = 6;
  double tax = 7;
  double total = 8;
  string next_date = 9;
  string last_generated_at = 10;
  bool is_active = 11;
  string notes = 12;
  string created_at = 13;
}

message RecurringInvoiceLine {
  string description = 1;
  int32 quantity = 2;
  double unit_price = 3;
  double tax_rate = 4;
  double total = 5;
}

message ListRecurringInvoicesRequest {
  common.PaginationRequest pagination = 1;
  bool active_only = 2;
}

message ListRecurringInvoicesResponse {
  repeated RecurringInvoice invoices = 1;
  common.PaginationResponse pagination = 2;
}

message GetRecurringInvoiceRequest {
  int64 id = 1;
}

message GetRecurringInvoiceResponse {
  RecurringInvoice invoice = 1;
}

message CreateRecurringInvoiceRequest {
  int64 customer_id = 1;
  string frequency = 2;
  repeated RecurringInvoiceLine lines = 3;
  string start_date = 4;
  string notes = 5;
}

message CreateRecurringInvoiceResponse {
  RecurringInvoice invoice = 1;
}
