syntax = "proto3";

package finance;

option go_package = "github.com/voxire/voxie/gen/go/finance/v1";

// ── Financial Reports ───────────────────────────────────────────────

// -- P&L Report --

message GetPLReportRequest {
  string period = 1;
  string date = 2;
}

message GetPLReportResponse {
  string period = 1;
  double revenue = 2;
  double cogs = 3;
  double gross_profit = 4;
  double operating_expenses = 5;
  double net_profit = 6;
  double margin_pct = 7;
}

// -- Tax Config --

message TaxConfig {
  int64 id = 1;
  int64 owner_id = 2;
  string name = 3;
  double rate = 4;
  string type = 5;
  bool is_default = 6;
  bool is_active = 7;
  string created_at = 8;
}

message ListTaxConfigRequest {}

message ListTaxConfigResponse {
  repeated TaxConfig configs = 1;
}

message CreateTaxConfigRequest {
  string name = 1;
  double rate = 2;
  string type = 3;
  bool is_default = 4;
}

message CreateTaxConfigResponse {
  TaxConfig config = 1;
}

// -- Tax Report --

message GetTaxReportRequest {
  string period = 1;
  string date = 2;
}

message GetTaxReportResponse {
  string period = 1;
  double tax_collected = 2;
  double tax_owed = 3;
}

// -- Expense Categories (from invoices module) --

message ExpenseCategoryDetail {
  int64 id = 1;
  int64 owner_id = 2;
  string name = 3;
  string color = 4;
  string icon = 5;
  string created_at = 6;
}

message ListExpenseCategoryDetailsRequest {}

message ListExpenseCategoryDetailsResponse {
  repeated ExpenseCategoryDetail categories = 1;
}

message CreateExpenseCategoryDetailRequest {
  string name = 1;
  string color = 2;
  string icon = 3;
}

message CreateExpenseCategoryDetailResponse {
  ExpenseCategoryDetail category = 1;
}
