syntax = "proto3";

package finance;

option go_package = "github.com/voxire/voxie/gen/go/finance/v1";

// ── Bills ───────────────────────────────────────────────────────────

message Bill {
  int64 id = 1;
  int64 owner_id = 2;
  int64 supplier_id = 3;
  double amount = 4;
  string currency = 5;
  string due_date = 6;
  string status = 7;
  string description = 8;
  string created_at = 9;
  string updated_at = 10;
}

message ListBillsRequest {}

message ListBillsResponse {
  repeated Bill bills = 1;
}

message CreateBillRequest {
  int64 supplier_id = 1;
  double amount = 2;
  string currency = 3;
  string due_date = 4;
  string status = 5;
  string description = 6;
}

message CreateBillResponse {
  int64 id = 1;
  string message = 2;
}

message UpdateBillRequest {
  int64 id = 1;
  int64 supplier_id = 2;
  double amount = 3;
  string currency = 4;
  string due_date = 5;
  string status = 6;
  string description = 7;
}

message UpdateBillResponse {
  string message = 1;
}
