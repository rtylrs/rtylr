syntax = "proto3";

package finance.v1;

option go_package = "github.com/voxire/voxie/gen/go/finance/v1";

import "common/v1/pagination.proto";

// ── Bank Accounts ───────────────────────────────────────────────────

message BankAccount {
  int64 id = 1;
  string name = 2;
  string bank_name = 3;
  string account_type = 4; // checking, savings
  string last_four = 5;
  double balance = 6;
  string currency = 7;
  bool is_primary = 8;
  string created_at = 9;
}

message ListBankAccountsRequest {
  common.v1.PaginationRequest pagination = 1;
}

message ListBankAccountsResponse {
  repeated BankAccount accounts = 1;
  common.v1.PaginationResponse pagination = 2;
}

message GetBankAccountRequest {
  int64 id = 1;
}

message GetBankAccountResponse {
  BankAccount account = 1;
}

message CreateBankAccountRequest {
  string name = 1;
  string bank_name = 2;
  string account_type = 3;
  string last_four = 4;
  double balance = 5;
  string currency = 6;
  bool is_primary = 7;
}

message CreateBankAccountResponse {
  BankAccount account = 1;
}
