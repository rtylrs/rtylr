syntax = "proto3";

package finance;

option go_package = "github.com/voxire/voxie/gen/go/finance/v1";

// ── Finance Dashboard ───────────────────────────────────────────────

message GetFinanceDashboardRequest {}

message GetFinanceDashboardResponse {
  double total_receivable = 1;
  double overdue_amount = 2;
  double total_expenses_mtd = 3;
  double net_profit_mtd = 4;
}
