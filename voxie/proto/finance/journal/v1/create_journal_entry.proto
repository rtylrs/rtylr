syntax = "proto3";

package finance.journal.v1;

import "finance/journal/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/journal/v1";

message CreateJournalEntryRequest {
  // date is the date value for this contract.
  string date = 1;
  // description is the description value for this contract.
  string description = 2;
  // lines is the lines value for this contract.
  repeated JournalLine lines = 3;
}

message CreateJournalEntryResponse {
  // entry is the entry value for this contract.
  JournalEntry entry = 1;
}
