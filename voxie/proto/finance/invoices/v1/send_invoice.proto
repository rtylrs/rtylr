syntax = "proto3";

package finance.invoices.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/invoices/v1";

message SendInvoiceRequest {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}

message SendInvoiceResponse {
  // message is a human-readable result message.
  string message = 1;
}
