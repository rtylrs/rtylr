syntax = "proto3";

package finance.invoices.v1;

import "finance/invoices/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/invoices/v1";

message GetInvoiceRequest {
  // id is the unique identifier for the resource.
  int64 id = 1;
}

message GetInvoiceResponse {
  // invoice is the invoice value for this contract.
  InvoiceDetail invoice = 1;
  // payments is the payments value for this contract.
  repeated Payment payments = 2;
}
