syntax = "proto3";

package finance.invoices.v1;

import "buf/validate/validate.proto";
import "finance/invoices/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/invoices/v1";

message CreateInvoiceRequest {
  // client_name is the client name value for this contract.
  string client_name = 1 [(buf.validate.field).string.min_len = 1];
  // client_email is the client email value for this contract.
  string client_email = 2 [(buf.validate.field).string = {
    min_len: 1
    email: true
  }];
  // client_address is the client address value for this contract.
  string client_address = 3;
  // client_tax_id is the client tax id value for this contract.
  string client_tax_id = 4;
  // issue_date is the issue date value for this contract.
  string issue_date = 5 [(buf.validate.field).string.min_len = 1];
  // due_date is the due date value for this contract.
  string due_date = 6 [(buf.validate.field).string.min_len = 1];
  // currency is the currency value for this contract.
  string currency = 7 [(buf.validate.field).string.min_len = 1];
  // discount_type is the discount type value for this contract.
  string discount_type = 8 [(buf.validate.field).string.min_len = 1];
  // discount_value is the discount value value for this contract.
  double discount_value = 9 [(buf.validate.field).double.gte = 0];
  // tax_rate is the tax rate value for this contract.
  double tax_rate = 10 [(buf.validate.field).double.gte = 0];
  // notes is the notes value for this contract.
  string notes = 11;
  // terms is the terms value for this contract.
  string terms = 12;
  // items is the items value for this contract.
  repeated InvoiceItem items = 13 [(buf.validate.field).repeated.min_items = 1];
}

message CreateInvoiceResponse {
  // invoice is the invoice value for this contract.
  InvoiceDetail invoice = 1;
}
