syntax = "proto3";

package finance.invoices.v1;

import "finance/invoices/v1/create_invoice.proto";
import "finance/invoices/v1/delete_invoice.proto";
import "finance/invoices/v1/get_invoice.proto";
import "finance/invoices/v1/list_invoices.proto";
import "finance/invoices/v1/update_invoice.proto";
import "finance/invoices/v1/update_invoice_status.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/invoices/v1";

// InvoicesService defines finance invoice endpoints.
service InvoicesService {
  option (onekit.http.service_config) = {base_path: "/api/finance/invoices/v1"};

  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse) {
    option (onekit.http.config) = {
      path: "/invoices"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateInvoice(CreateInvoiceRequest) returns (CreateInvoiceResponse) {
    option (onekit.http.config) = {
      path: "/invoices"
      method: HTTP_METHOD_POST
    };
  }

  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse) {
    option (onekit.http.config) = {
      path: "/invoices/{id}"
      method: HTTP_METHOD_GET
    };
  }

  rpc UpdateInvoice(UpdateInvoiceRequest) returns (UpdateInvoiceResponse) {
    option (onekit.http.config) = {
      path: "/invoices/{id}"
      method: HTTP_METHOD_PUT
      body: "body"
    };
  }

  rpc UpdateInvoiceStatus(UpdateInvoiceStatusRequest) returns (UpdateInvoiceStatusResponse) {
    option (onekit.http.config) = {
      path: "/invoices/{id}/status"
      method: HTTP_METHOD_PATCH
      body: "body"
    };
  }

  rpc DeleteInvoice(DeleteInvoiceRequest) returns (DeleteInvoiceResponse) {
    option (onekit.http.config) = {
      path: "/invoices/{id}"
      method: HTTP_METHOD_DELETE
    };
  }
}
