syntax = "proto3";

package finance.quote.v1;

import "finance/quote/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/quote/v1";

message ListQuotesRequest {
  // page is the one-based page number to return.
  int64 page = 1 [
    (onekit.http.query).name = "page",
    (onekit.http.int64_encoding) = INT64_ENCODING_NUMBER
  ];
  // page_size is the maximum number of quotes to return.
  int64 page_size = 2 [
    (onekit.http.query).name = "page_size",
    (onekit.http.int64_encoding) = INT64_ENCODING_NUMBER
  ];
}

message ListQuotesResponse {
  // quotes is the quotes value for this contract.
  repeated Quote quotes = 1;
  // page is the current result page.
  int64 page = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_NUMBER];
  // page_size is the number of records requested per page.
  int64 page_size = 3 [(onekit.http.int64_encoding) = INT64_ENCODING_NUMBER];
  // has_more indicates whether additional pages are available.
  bool has_more = 4;
}
