syntax = "proto3";

package finance.quote.v1;

import "buf/validate/validate.proto";
import "finance/quote/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/quote/v1";

message CreateQuoteRequest {
  // customer_name is the customer name value for this contract.
  string customer_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // customer_email is the customer email value for this contract.
  string customer_email = 2;
  // status is the initial lifecycle state - defaults to "draft" if empty.
  string status = 3;
  // lines is the lines value for this contract.
  repeated QuoteLine lines = 4 [(buf.validate.field).repeated.min_items = 1];
  // subtotal is the subtotal value for this contract.
  double subtotal = 5 [(buf.validate.field).double.gte = 0];
  // tax is the tax value for this contract.
  double tax = 6 [(buf.validate.field).double.gte = 0];
  // valid_until is the valid until value for this contract.
  string valid_until = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // discount is the discount value for this contract.
  double discount = 8 [
    (buf.validate.field).required = true,
    (buf.validate.field).double.gte = 0
  ];
  // total is the total number of matching records.
  double total = 9 [(buf.validate.field).double.gte = 0];
  // notes is the notes value for this contract.
  string notes = 10;
}

message CreateQuoteResponse {
  // quote is the quote value for this contract.
  Quote quote = 1;
}
