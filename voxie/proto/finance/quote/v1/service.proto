syntax = "proto3";

package finance.quote.v1;

import "finance/quote/v1/create_quote.proto";
import "finance/quote/v1/get_quote.proto";
import "finance/quote/v1/list_quotes.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/quote/v1";

// QuoteService defines sales quote endpoints.
service QuoteService {
  option (onekit.http.service_config) = {base_path: "/api/finance/quote/v1"};

  rpc ListQuotes(ListQuotesRequest) returns (ListQuotesResponse) {
    option (onekit.http.config) = {
      path: "/quotes"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateQuote(CreateQuoteRequest) returns (CreateQuoteResponse) {
    option (onekit.http.config) = {
      path: "/quotes"
      method: HTTP_METHOD_POST
    };
  }

  rpc GetQuote(GetQuoteRequest) returns (GetQuoteResponse) {
    option (onekit.http.config) = {
      path: "/quotes/{id}"
      method: HTTP_METHOD_GET
    };
  }
}
