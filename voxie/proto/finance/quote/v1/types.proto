syntax = "proto3";

package finance.quote.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/quote/v1";

// ── Quotes ──────────────────────────────────────────────────────────

message Quote {
  // id is the unique identifier for the resource.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // number is the number value for this contract.
  string number = 2;
  // customer_id is the customer id value for this contract.
  int64 customer_id = 3 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // customer_name is the customer name value for this contract.
  string customer_name = 4;
  // status is the current lifecycle state.
  // draft, sent, accepted, rejected, expired
  string status = 5;
  // lines is the lines value for this contract.
  repeated QuoteLine lines = 6;
  // subtotal is the subtotal value for this contract.
  double subtotal = 7;
  // tax is the tax value for this contract.
  double tax = 8;
  // discount is the discount value for this contract.
  double discount = 9;
  // total is the total number of matching records.
  double total = 10;
  // valid_until is the valid until value for this contract.
  string valid_until = 11;
  // notes is the notes value for this contract.
  string notes = 12;
  // created_at is when the record was created.
  string created_at = 13;
  // updated_at is when the record was last updated.
  string updated_at = 14;
}

message QuoteLine {
  // description is the description value for this contract.
  string description = 1;
  // quantity is the quantity value for this contract.
  int32 quantity = 2;
  // unit_price is the unit price value for this contract.
  double unit_price = 3;
  // tax_rate is the tax rate value for this contract.
  double tax_rate = 4;
  // total is the total number of matching records.
  double total = 5;
}
