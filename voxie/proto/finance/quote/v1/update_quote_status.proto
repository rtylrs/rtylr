syntax = "proto3";

package finance.quote.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/quote/v1";

message UpdateQuoteStatusBody {
  // status is the current lifecycle state.
  string status = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message UpdateQuoteStatusRequest {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // body carries status update fields bound from the HTTP payload.
  UpdateQuoteStatusBody body = 2;
}

message UpdateQuoteStatusResponse {
  // message is a human-readable result message.
  string message = 1;
}
