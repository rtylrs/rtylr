syntax = "proto3";

package finance.tax.v1;

import "finance/tax/v1/get_pl_report.proto";
import "finance/tax/v1/get_tax_config.proto";
import "finance/tax/v1/update_tax_config.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/tax/v1";

service TaxService {
  option (onekit.http.service_config) = {base_path: "/api/finance/tax/v1"};

  rpc GetTaxConfig(GetTaxConfigRequest) returns (GetTaxConfigResponse) {
    option (onekit.http.config) = {
      path: "/tax"
      method: HTTP_METHOD_GET
    };
  }

  rpc UpdateTaxConfig(UpdateTaxConfigRequest) returns (UpdateTaxConfigResponse) {
    option (onekit.http.config) = {
      path: "/tax"
      method: HTTP_METHOD_PUT
      body: "*"
    };
  }

  rpc GetPLReport(GetPLReportRequest) returns (GetPLReportResponse) {
    option (onekit.http.config) = {
      path: "/pl"
      method: HTTP_METHOD_GET
    };
  }
}
