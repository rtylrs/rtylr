syntax = "proto3";

package finance.tax.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/tax/v1";

message UpdateTaxConfigRequest {
  string tax_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  double tax_rate = 2 [(buf.validate.field).double.gte = 0];
  bool is_inclusive = 3;
  bool is_active = 4;
}

message UpdateTaxConfigResponse {
  string message = 1;
}
