syntax = "proto3";

package finance.report.v1;

import "buf/validate/validate.proto";
import "finance/report/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/report/v1";

message CreateTaxConfigRequest {
  // name is the name value for this contract.
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // rate is the rate value for this contract.
  double rate = 2 [(buf.validate.field).double.gte = 0];
  // type is the type value for this contract.
  string type = 3 [(buf.validate.field).string.min_len = 1];
  // is_default is the is default value for this contract.
  bool is_default = 4;
}

message CreateTaxConfigResponse {
  // config is the config value for this contract.
  TaxConfig config = 1;
}
