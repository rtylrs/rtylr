syntax = "proto3";

package finance.report.v1;

import "finance/report/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/report/v1";

message CreateExpenseCategoryDetailRequest {
  // name is the name value for this contract.
  string name = 1;
  // color is the color value for this contract.
  string color = 2;
  // icon is the icon value for this contract.
  string icon = 3;
}

message CreateExpenseCategoryDetailResponse {
  // category is the category value for this contract.
  ExpenseCategoryDetail category = 1;
}
