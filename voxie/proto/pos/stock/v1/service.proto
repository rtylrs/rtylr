syntax = "proto3";

package pos.stock.v1;

import "onekit/http/annotations.proto";
import "pos/stock/v1/adjust_stock.proto";
import "pos/stock/v1/list_inventory.proto";
import "pos/stock/v1/list_stock_movements.proto";
import "pos/stock/v1/low_stock.proto";
import "pos/stock/v1/receive_stock.proto";
import "pos/stock/v1/transfer_stock.proto";
import "pos/stock/v1/waste_stock.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/stock/v1";

service StockService {
  option (onekit.http.service_config) = {base_path: "/pos/stock"};

  rpc ListStockMovements(ListStockMovementsRequest) returns (ListStockMovementsResponse) {
    option (onekit.http.config) = {
      path: "/movements"
      method: HTTP_METHOD_GET
    };
  }

  rpc ReceiveStock(ReceiveStockRequest) returns (ReceiveStockResponse) {
    option (onekit.http.config) = {
      path: "/receive"
      method: HTTP_METHOD_POST
    };
  }

  rpc AdjustStock(AdjustStockRequest) returns (AdjustStockResponse) {
    option (onekit.http.config) = {
      path: "/adjust"
      method: HTTP_METHOD_POST
    };
  }

  rpc WasteStock(WasteStockRequest) returns (WasteStockResponse) {
    option (onekit.http.config) = {
      path: "/waste"
      method: HTTP_METHOD_POST
    };
  }

  rpc TransferStock(TransferStockRequest) returns (TransferStockResponse) {
    option (onekit.http.config) = {
      path: "/transfer"
      method: HTTP_METHOD_POST
    };
  }

  rpc ListInventory(ListInventoryRequest) returns (ListInventoryResponse) {
    option (onekit.http.config) = {
      path: "/inventory"
      method: HTTP_METHOD_GET
    };
  }

  rpc LowStock(LowStockRequest) returns (LowStockResponse) {
    option (onekit.http.config) = {
      path: "/low-stock"
      method: HTTP_METHOD_GET
    };
  }
}
