syntax = "proto3";

package pos.stock.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/stock/v1";

// ── Transfer Stock ────────────────────────────────────────────────

message TransferStockRequest {
  // from_branch_id is the from branch id value for this contract.
  int64 from_branch_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  // to_branch_id is the to branch id value for this contract.
  int64 to_branch_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  // product_id is the product id value for this contract.
  int64 product_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  // quantity is the quantity value for this contract.
  double quantity = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).double.gt = 0
  ];
  // note is the note value for this contract.
  string note = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // employee_id is the employee id value for this contract.
  int64 employee_id = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
}

message TransferStockResponse {
  // movement_id is the movement id value for this contract.
  int64 movement_id = 1;
  // message is a human-readable result message.
  string message = 2;
}
