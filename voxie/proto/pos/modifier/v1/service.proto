syntax = "proto3";

package pos.modifier.v1;

import "onekit/http/annotations.proto";
import "pos/modifier/v1/create_modifier.proto";
import "pos/modifier/v1/delete_modifier.proto";
import "pos/modifier/v1/list_modifiers.proto";
import "pos/modifier/v1/update_modifier.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/modifier/v1";

service ModifierService {
  option (onekit.http.service_config) = {base_path: "/pos/menu"};

  rpc ListModifiers(ListModifiersRequest) returns (ListModifiersResponse) {
    option (onekit.http.config) = {
      path: "/modifiers"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateModifier(CreateModifierRequest) returns (CreateModifierResponse) {
    option (onekit.http.config) = {
      path: "/modifiers"
      method: HTTP_METHOD_POST
    };
  }

  rpc UpdateModifier(UpdateModifierRequest) returns (UpdateModifierResponse) {
    option (onekit.http.config) = {
      path: "/modifiers/{id}"
      method: HTTP_METHOD_PUT
    };
  }

  rpc DeleteModifier(DeleteModifierRequest) returns (DeleteModifierResponse) {
    option (onekit.http.config) = {
      path: "/modifiers/{id}"
      method: HTTP_METHOD_DELETE
    };
  }
}
