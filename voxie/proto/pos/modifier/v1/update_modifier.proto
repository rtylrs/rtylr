syntax = "proto3";

package pos.modifier.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/modifier/v1";

// ── Update ────────────────────────────────────────────────────────

message UpdateModifierBody {
  // name is the name value for this contract.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // price_delta is the price delta value for this contract.
  double price_delta = 2 [(buf.validate.field).double.gte = 0];
  // group_name is the group name value for this contract.
  string group_name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // is_required is the is required value for this contract.
  bool is_required = 4;
}

message UpdateModifierRequest {
  // id is the unique identifier for the modifier.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // body carries updatable modifier fields bound from the HTTP payload.
  UpdateModifierBody body = 2;
}

message UpdateModifierResponse {
  // message is a human-readable result message.
  string message = 1;
}
