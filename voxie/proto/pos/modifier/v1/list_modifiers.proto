syntax = "proto3";

package pos.modifier.v1;

import "pos/modifier/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/modifier/v1";

// ── List ──────────────────────────────────────────────────────────

message ListModifiersRequest {}

message ListModifiersResponse {
  // modifiers is the modifiers value for this contract.
  repeated Modifier modifiers = 1;
}
