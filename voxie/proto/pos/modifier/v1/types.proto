syntax = "proto3";

package pos.modifier.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/modifier/v1";

// ── Modifier ──────────────────────────────────────────────────────

message Modifier {
  // id is the unique identifier for the resource.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // owner_id identifies the tenant that owns the resource.
  int64 owner_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // name is the name value for this contract.
  string name = 3;
  // price_delta is the price delta value for this contract.
  double price_delta = 4;
  // group_name is the group name value for this contract.
  string group_name = 5;
  // is_required is the is required value for this contract.
  bool is_required = 6;
  // created_at is when the record was created.
  string created_at = 7;
  // updated_at is when the record was last updated.
  string updated_at = 8;
}
