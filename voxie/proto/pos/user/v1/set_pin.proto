syntax = "proto3";

package pos.user.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/user/v1";

// ── Set PIN ───────────────────────────────────────────────────────

message SetPINRequest {
  // user_id is the user id value for this contract.
  int64 user_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // location_id is the location id value for this contract.
  int64 location_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // name is the name value for this contract.
  string name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // pin is the pin value for this contract. Sensitive: do not log this field.
  string pin = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message SetPINResponse {
  // success indicates whether the operation completed.
  bool success = 1;
}
