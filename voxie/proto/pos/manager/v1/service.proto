syntax = "proto3";

package pos.manager.v1;

import "onekit/http/annotations.proto";
import "pos/manager/v1/verify_pin.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/manager/v1";

service ManagerService {
  option (onekit.http.service_config) = {base_path: "/pos/manager"};

  rpc VerifyPIN(VerifyPINRequest) returns (VerifyPINResponse) {
    option (onekit.http.config) = {
      path: "/verify"
      method: HTTP_METHOD_POST
    };
  }
}
