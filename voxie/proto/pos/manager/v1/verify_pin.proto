syntax = "proto3";

package pos.manager.v1;

option go_package = "github.com/voxire/voxie/gen/go/pos/manager/v1";

// ── Manager ───────────────────────────────────────────────────────

message VerifyPINRequest {
  // pin is the pin value for this contract.
  string pin = 1;
}

message VerifyPINResponse {
  // valid is the valid value for this contract.
  bool valid = 1;
  // staff_id is the staff id value for this contract.
  int64 staff_id = 2;
  // message is a human-readable result message.
  string message = 3;
}
