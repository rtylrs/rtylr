syntax = "proto3";

package pos.terminal.v1;

import "onekit/http/annotations.proto";
import "pos/terminal/v1/create_terminal.proto";
import "pos/terminal/v1/heartbeat_terminal.proto";
import "pos/terminal/v1/list_terminals.proto";
import "pos/terminal/v1/update_terminal.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/terminal/v1";

service TerminalService {
  option (onekit.http.service_config) = {base_path: "/pos"};

  rpc ListTerminals(ListTerminalsRequest) returns (ListTerminalsResponse) {
    option (onekit.http.config) = {
      path: "/terminals"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateTerminal(CreateTerminalRequest) returns (CreateTerminalResponse) {
    option (onekit.http.config) = {
      path: "/terminals"
      method: HTTP_METHOD_POST
    };
  }

  rpc UpdateTerminal(UpdateTerminalRequest) returns (UpdateTerminalResponse) {
    option (onekit.http.config) = {
      path: "/terminals/{id}"
      method: HTTP_METHOD_PUT
    };
  }

  rpc HeartbeatTerminal(HeartbeatTerminalRequest) returns (HeartbeatTerminalResponse) {
    option (onekit.http.config) = {
      path: "/terminals/heartbeat"
      method: HTTP_METHOD_POST
    };
  }
}
