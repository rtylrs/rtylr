syntax = "proto3";

package pos.access.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/access/v1";

// ── Assign ────────────────────────────────────────────────────────

message AssignLocationRequest {
  // user_id identifies the user associated with this request.
  int64 user_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  , (onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // location_id is the location id value for this contract.
  int64 location_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  , (onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // can_manage_pos_users is the can manage pos users value for this contract.
  bool can_manage_pos_users = 3;
  // can_manage_terminals is the can manage terminals value for this contract.
  bool can_manage_terminals = 4;
  // can_view_reports is the can view reports value for this contract.
  bool can_view_reports = 5;
}

message AssignLocationResponse {
  // id is the unique identifier for the resource.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
}
