syntax = "proto3";

package pos.access.v1;

import "pos/access/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/access/v1";

// ── Get My Locations ──────────────────────────────────────────────

message GetMyLocationsRequest {}

message GetMyLocationsResponse {
  // locations is the locations value for this contract.
  repeated MyLocation locations = 1;
}
