syntax = "proto3";

package pos.access.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/access/v1";

// ── MyLocation ────────────────────────────────────────────────────

message MyLocation {
  // location_id is the location id value for this contract.
  int64 location_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // name is the name value for this contract.
  string name = 2;
  // address is the address value for this contract.
  string address = 3;
  // phone is the phone value for this contract.
  string phone = 4;
}

message RosterEntry {
  // user_id identifies the staff member.
  int64 user_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // name is the staff display name.
  string name = 2;
  // has_pin tells the terminal whether the staff member can sign in with a PIN.
  bool has_pin = 3;
  // is_manager tells whether this staff member can manage POS access.
  bool is_manager = 4;
  // pos_role is the POS-specific role label.
  string pos_role = 5;
}

message MemberLocationEntry {
  // id is the unique assignment identifier.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // location_id identifies the assigned location.
  int64 location_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // can_manage_pos_users controls POS staff management.
  bool can_manage_pos_users = 3;
  // can_manage_terminals controls terminal management.
  bool can_manage_terminals = 4;
  // can_view_reports controls POS reporting access.
  bool can_view_reports = 5;
}
