syntax = "proto3";

package pos.access.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/access/v1";

// ── MyLocation ────────────────────────────────────────────────────

message MyLocation {
  // location_id is the location id value for this contract.
  int64 location_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // name is the name value for this contract.
  string name = 2;
  // address is the address value for this contract.
  string address = 3;
  // phone is the phone value for this contract.
  string phone = 4;
}
