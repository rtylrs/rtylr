syntax = "proto3";

package pos.kds.v1;

import "pos/kds/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/kds/v1";

// ── List ──────────────────────────────────────────────────────────

message ListKDSOrdersRequest {}

message ListKDSOrdersResponse {
  // orders is the orders value for this contract.
  repeated KDSOrder orders = 1;
}
