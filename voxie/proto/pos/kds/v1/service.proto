syntax = "proto3";

package pos.kds.v1;

import "onekit/http/annotations.proto";
import "pos/kds/v1/list_kds_orders.proto";
import "pos/kds/v1/update_kds_item_status.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/kds/v1";

service KDSService {
  option (onekit.http.service_config) = {base_path: "/api/pos/kds/v1"};

  rpc ListKDSOrders(ListKDSOrdersRequest) returns (ListKDSOrdersResponse) {
    option (onekit.http.config) = {
      path: "/orders"
      method: HTTP_METHOD_GET
    };
  }

  rpc UpdateKDSItemStatus(UpdateKDSItemStatusRequest) returns (UpdateKDSItemStatusResponse) {
    option (onekit.http.config) = {
      path: "/{order_id}/items/{item_id}"
      method: HTTP_METHOD_PUT
      body: "body"
    };
  }
}
