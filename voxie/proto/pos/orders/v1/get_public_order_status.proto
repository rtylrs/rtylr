syntax = "proto3";

package pos.orders.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/orders/v1";

message GetPublicOrderStatusRequest {
  int64 order_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // business_id scopes the lookup to the business the order belongs to,
  // preventing cross-tenant order enumeration on this anonymous endpoint.
  int64 business_id = 2 [
    (onekit.http.query).name = "business_id",
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}

message GetPublicOrderStatusResponse {
  int64 order_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  string order_number = 2;
  string status = 3;
}
