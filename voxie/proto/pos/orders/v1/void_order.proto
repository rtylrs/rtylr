syntax = "proto3";

package pos.orders.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/orders/v1";

// ── Void Order ────────────────────────────────────────────────────

message VoidOrderRequest {
  // order_id is the order id value for this contract.
  int64 order_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  , (onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // reason is the reason value for this contract.
  string reason = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message VoidOrderResponse {
  // message is a human-readable result message.
  string message = 1;
}
