syntax = "proto3";

package pos.orders.v1;

import "onekit/http/annotations.proto";
import "pos/orders/v1/create_order.proto";
import "pos/orders/v1/get_order_detail.proto";
import "pos/orders/v1/list_orders.proto";
import "pos/orders/v1/send_to_kitchen.proto";
import "pos/orders/v1/transfer_table.proto";
import "pos/orders/v1/update_order_status.proto";
import "pos/orders/v1/void_order.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/orders/v1";

// OrderService defines the POS order endpoints.
service OrderService {
  option (onekit.http.service_config) = {base_path: "/api/pos/orders/v1"};

  // ListOrders returns POS orders for the active business and filters.
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse) {
    option (onekit.http.config) = {
      path: "/orders"
      method: HTTP_METHOD_GET
    };
  }

  // CreateOrder creates a POS order.
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse) {
    option (onekit.http.config) = {
      path: "/orders"
      method: HTTP_METHOD_POST
    };
  }

  // GetOrderDetail returns an order and its purchased items.
  rpc GetOrderDetail(GetOrderDetailRequest) returns (GetOrderDetailResponse) {
    option (onekit.http.config) = {
      path: "/orders/{order_id}"
      method: HTTP_METHOD_GET
    };
  }

  // UpdateOrderStatus changes the order lifecycle status.
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (UpdateOrderStatusResponse) {
    option (onekit.http.config) = {
      path: "/orders/{order_id}/status"
      method: HTTP_METHOD_PUT
      body: "body"
    };
  }

  // VoidOrder voids an existing order.
  rpc VoidOrder(VoidOrderRequest) returns (VoidOrderResponse) {
    option (onekit.http.config) = {
      path: "/orders/{order_id}/void"
      method: HTTP_METHOD_POST
    };
  }

  // SendToKitchen dispatches an order to the kitchen display.
  rpc SendToKitchen(SendToKitchenRequest) returns (SendToKitchenResponse) {
    option (onekit.http.config) = {
      path: "/orders/{order_id}/send-to-kitchen"
      method: HTTP_METHOD_POST
    };
  }

  // TransferTable moves an open order to a different table.
  rpc TransferTable(TransferTableRequest) returns (TransferTableResponse) {
    option (onekit.http.config) = {
      path: "/orders/{order_id}/transfer-table"
      method: HTTP_METHOD_POST
    };
  }
}
