syntax = "proto3";

package pos.orders.v1;

import "buf/validate/validate.proto";
import "pos/orders/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/orders/v1";

// ── Get Order Detail ──────────────────────────────────────────────

message GetOrderDetailRequest {
  // order_id is the order id value for this contract.
  int64 order_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetOrderDetailResponse {
  // order is the order value for this contract.
  Order order = 1;
}
