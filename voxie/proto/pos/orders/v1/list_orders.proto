syntax = "proto3";

package pos.orders.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";
import "pos/orders/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/orders/v1";

// ── List Orders ───────────────────────────────────────────────────

message ListOrdersRequest {
  // session_id is the session id value for this contract.
  int64 session_id = 1 [
    (onekit.http.query).name = "session_id",
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  // status is the current lifecycle state.
  string status = 2 [(onekit.http.query).name = "status"];
  // date_from is the date from value for this contract.
  string date_from = 3 [(onekit.http.query).name = "date_from"];
  // date_to is the date to value for this contract.
  string date_to = 4 [(onekit.http.query).name = "date_to"];
  // search filters orders by order number, customer, or matching text.
  string search = 5 [(onekit.http.query).name = "search"];
  // page is the one-based page number to return.
  int64 page = 6 [(onekit.http.query).name = "page"];
  // page_size is the maximum number of orders to return.
  int64 page_size = 7 [(onekit.http.query).name = "page_size"];
}

message ListOrdersResponse {
  // orders is the orders value for this contract.
  repeated Order orders = 1;
  // total is the total number of matching records.
  int64 total = 2;
  // has_more indicates another page is available.
  bool has_more = 3;
  // page is the one-based page number returned.
  int64 page = 4;
  // page_size is the page size returned.
  int64 page_size = 5;
}
