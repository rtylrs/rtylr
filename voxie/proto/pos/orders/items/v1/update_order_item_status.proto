syntax = "proto3";

package pos.orders.items.v1;

option go_package = "github.com/voxire/voxie/gen/go/pos/orders/items/v1";

// ── Update Order Item Status ──────────────────────────────────────

message UpdateOrderItemStatusRequest {
  // order_id is the order id value for this contract.
  int64 order_id = 1;
  // item_id is the item id value for this contract.
  int64 item_id = 2;
  // status is the current lifecycle state.
  string status = 3;
}

message UpdateOrderItemStatusResponse {
  // message is a human-readable result message.
  string message = 1;
}
