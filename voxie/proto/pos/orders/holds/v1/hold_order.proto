syntax = "proto3";

package pos.orders.holds.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/orders/holds/v1";

// ── Hold Order ────────────────────────────────────────────────────

message HoldOrderRequest {
  // order_id is the order id value for this contract.
  int64 order_id = 1 [(buf.validate.field).int64.gt = 0];
  // reason is the reason value for this contract.
  string reason = 2;
}

message HoldOrderResponse {
  // message is a human-readable result message.
  string message = 1;
}
