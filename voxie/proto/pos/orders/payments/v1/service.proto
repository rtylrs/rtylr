syntax = "proto3";

package pos.orders.payments.v1;

import "onekit/http/annotations.proto";
import "pos/orders/payments/v1/process_payment.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/orders/payments/v1";

service OrderPaymentService {
  option (onekit.http.service_config) = {base_path: "/pos"};

  rpc ProcessPayment(ProcessPaymentRequest) returns (ProcessPaymentResponse) {
    option (onekit.http.config) = {
      path: "/orders/{order_id}/payment"
      method: HTTP_METHOD_POST
    };
  }
}
