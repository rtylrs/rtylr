syntax = "proto3";

package pos.orders.payments.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/orders/payments/v1";

// ── Process Payment ───────────────────────────────────────────────

message ProcessPaymentRequest {
  // order_id is the order id value for this contract.
  int64 order_id = 1 [(buf.validate.field).int64.gt = 0];
  // payment_method is the payment method value for this contract.
  string payment_method = 2;
  // amount_paid is the amount paid value for this contract.
  double amount_paid = 3;
}

message ProcessPaymentResponse {
  // message is a human-readable result message.
  string message = 1;
}
