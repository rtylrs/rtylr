syntax = "proto3";

package pos.customer.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/customer/v1";

// ── Customer ──────────────────────────────────────────────────────

message Customer {
  // id is the unique identifier for the resource.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // first_name is the first name value for this contract.
  string first_name = 2;
  // last_name is the last name value for this contract.
  string last_name = 3;
  // email is the email address used for lookup or contact.
  string email = 4;
  // phone is the phone value for this contract.
  string phone = 5;
}
