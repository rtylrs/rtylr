syntax = "proto3";

package pos.customer.v1;

import "onekit/http/annotations.proto";
import "pos/customer/v1/search_customers.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/customer/v1";

service CustomerService {
  option (onekit.http.service_config) = {base_path: "/pos"};

  rpc SearchCustomers(SearchCustomersRequest) returns (SearchCustomersResponse) {
    option (onekit.http.config) = {
      path: "/customers"
      method: HTTP_METHOD_GET
    };
  }
}
