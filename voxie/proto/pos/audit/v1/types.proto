syntax = "proto3";

package pos.audit.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/audit/v1";

// ── AuditLog ──────────────────────────────────────────────────────

message AuditLog {
  // id is the unique identifier for the resource.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // business_id is the business id value for this contract.
  int64 business_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // branch_id is the branch id value for this contract.
  int64 branch_id = 3 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // terminal_id is the terminal id value for this contract.
  optional int64 terminal_id = 4 [(onekit.http.nullable) = true, (onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // employee_id is the employee id value for this contract.
  int64 employee_id = 5 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // action is the action value for this contract.
  string action = 6;
  // entity_type is the entity type value for this contract.
  string entity_type = 7;
  // entity_id is the entity id value for this contract.
  optional int64 entity_id = 8 [(onekit.http.nullable) = true, (onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // details is the details value for this contract.
  optional string details = 9 [(onekit.http.nullable) = true];
  // ip_address is the ip address value for this contract.
  optional string ip_address = 10 [(onekit.http.nullable) = true];
  // created_at is when the record was created.
  string created_at = 11;
}
