syntax = "proto3";

package pos.gift_card.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/gift_card/v1";

// ── Create ────────────────────────────────────────────────────────

message CreateGiftCardRequest {
  // code is the code value for this contract.
  string code = 1 [(buf.validate.field).string.min_len = 1];
  // initial_amount is the initial amount value for this contract.
  double initial_amount = 2 [(buf.validate.field).double.gte = 0];
  // customer_name is the customer name value for this contract.
  string customer_name = 3 [(buf.validate.field).string.min_len = 1];
  // customer_email is the customer email value for this contract.
  string customer_email = 4 [(buf.validate.field).string = {
    min_len: 1
    email: true
  }];
  // expires_at is the expires at value for this contract.
  string expires_at = 5 [(buf.validate.field).string.min_len = 1];
}

message CreateGiftCardResponse {
  // gift_card_id is the gift card id value for this contract.
  int64 gift_card_id = 1;
  // message is a human-readable result message.
  string message = 2;
}
