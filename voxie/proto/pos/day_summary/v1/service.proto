syntax = "proto3";

package pos.day_summary.v1;

import "onekit/http/annotations.proto";
import "pos/day_summary/v1/day_summary.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/day_summary/v1";

service DaySummaryService {
  option (onekit.http.service_config) = {base_path: "/pos"};

  rpc DaySummary(DaySummaryRequest) returns (DaySummaryResponse) {
    option (onekit.http.config) = {
      path: "/day-summary"
      method: HTTP_METHOD_GET
    };
  }
}
