syntax = "proto3";

package pos.day_summary.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/day_summary/v1";

// ── DaySummary ────────────────────────────────────────────────────

message DaySummaryRequest {
  // date is the date value for this contract.
  string date = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message DaySummaryResponse {
  // total_sales is the total sales value for this contract.
  double total_sales = 1;
  // total_tax is the total tax value for this contract.
  double total_tax = 2;
  // total_tips is the total tips value for this contract.
  double total_tips = 3;
  // total_refunds is the total refunds value for this contract.
  double total_refunds = 4;
  // total_orders is the total orders value for this contract.
  int32 total_orders = 5;
  // payment_breakdown is the payment breakdown value for this contract.
  map<string, double> payment_breakdown = 6;
}
