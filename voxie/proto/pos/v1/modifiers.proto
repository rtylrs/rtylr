syntax = "proto3";

package pos;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

// ── Modifier ───────────────────────────────────────────────────────

message ModifierGroup {
  int64 id = 1;
  int64 location_id = 2;
  string name = 3;
  bool is_required = 4;
  int32 min_select = 5;
  int32 max_select = 6;
  repeated Modifier modifiers = 7;
  string created_at = 8;
  string updated_at = 9;
}

message Modifier {
  int64 id = 1;
  int64 group_id = 2;
  string name = 3;
  double price = 4;
  bool is_default = 5;
  int32 sort_order = 6;
}

// ── List ───────────────────────────────────────────────────────────

message ListModifiersRequest {}

message ListModifiersResponse {
  repeated ModifierGroup groups = 1;
}

// ── Create ─────────────────────────────────────────────────────────

message CreateModifierGroupRequest {
  string name = 1;
  bool is_required = 2;
  int32 min_select = 3;
  int32 max_select = 4;
  repeated CreateModifierInput modifiers = 5;
}

message CreateModifierInput {
  string name = 1;
  double price = 2;
  bool is_default = 3;
  int32 sort_order = 4;
}

message CreateModifierGroupResponse {
  ModifierGroup group = 1;
}

// ── Update ─────────────────────────────────────────────────────────

message UpdateModifierGroupRequest {
  int64 id = 1;
  string name = 2;
  bool is_required = 3;
  int32 min_select = 4;
  int32 max_select = 5;
  repeated CreateModifierInput modifiers = 6;
}

message UpdateModifierGroupResponse {
  ModifierGroup group = 1;
}

// ── Delete ─────────────────────────────────────────────────────────

message DeleteModifierGroupRequest {
  int64 id = 1;
}

message DeleteModifierGroupResponse {
  bool success = 1;
}
