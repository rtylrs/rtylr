syntax = "proto3";

package pos.v1;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

// ── Modifier ──────────────────────────────────────────────────────

message Modifier {
  int64 id = 1;
  int64 owner_id = 2;
  string name = 3;
  double price_delta = 4;
  string group_name = 5;
  bool is_required = 6;
  string created_at = 7;
  string updated_at = 8;
}

// ── List ──────────────────────────────────────────────────────────

message ListModifiersRequest {}

message ListModifiersResponse {
  repeated Modifier modifiers = 1;
}

// ── Create ────────────────────────────────────────────────────────

message CreateModifierRequest {
  string name = 1;
  double price_delta = 2;
  string group_name = 3;
  bool is_required = 4;
}

message CreateModifierResponse {
  int64 modifier_id = 1;
  string message = 2;
}

// ── Update ────────────────────────────────────────────────────────

message UpdateModifierRequest {
  string name = 1;
  double price_delta = 2;
  string group_name = 3;
  bool is_required = 4;
}

message UpdateModifierResponse {
  string message = 1;
}

// ── Delete ────────────────────────────────────────────────────────

message DeleteModifierRequest {}

message DeleteModifierResponse {
  string message = 1;
}
