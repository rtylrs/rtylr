syntax = "proto3";

package pos.v1;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

// ── GiftCard ──────────────────────────────────────────────────────

message GiftCard {
  int64 id = 1;
  int64 owner_id = 2;
  string code = 3;
  double initial_amount = 4;
  double current_balance = 5;
  string customer_name = 6;
  string customer_email = 7;
  bool is_active = 8;
  string expires_at = 9;
  string created_at = 10;
}

// ── List ──────────────────────────────────────────────────────────

message ListGiftCardsRequest {}

message ListGiftCardsResponse {
  repeated GiftCard gift_cards = 1;
}

// ── Create ────────────────────────────────────────────────────────

message CreateGiftCardRequest {
  string code = 1;
  double initial_amount = 2;
  string customer_name = 3;
  string customer_email = 4;
  string expires_at = 5;
}

message CreateGiftCardResponse {
  int64 gift_card_id = 1;
  string message = 2;
}

// ── Redeem ────────────────────────────────────────────────────────

message RedeemGiftCardRequest {
  string code = 1;
  double amount = 2;
}

message RedeemGiftCardResponse {
  GiftCard gift_card = 1;
  string message = 2;
}
