syntax = "proto3";

package pos;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

// ── Table ──────────────────────────────────────────────────────────

message Table {
  int64 id = 1;
  int64 location_id = 2;
  int64 floor_id = 3;
  string name = 4;
  int32 capacity = 5;
  string status = 6; // available, occupied, reserved, dirty
  int64 current_order_id = 7;
  int32 position_x = 8;
  int32 position_y = 9;
  string shape = 10; // square, round, rectangle
  string created_at = 11;
  string updated_at = 12;
}

// ── List ───────────────────────────────────────────────────────────

message ListTablesRequest {
  int64 floor_id = 1;
  string status = 2;
}

message ListTablesResponse {
  repeated Table tables = 1;
}

// ── Create ─────────────────────────────────────────────────────────

message CreateTableRequest {
  int64 floor_id = 1;
  string name = 2;
  int32 capacity = 3;
  int32 position_x = 4;
  int32 position_y = 5;
  string shape = 6;
}

message CreateTableResponse {
  Table table = 1;
}

// ── Update ─────────────────────────────────────────────────────────

message UpdateTableRequest {
  int64 id = 1;
  string name = 2;
  int32 capacity = 3;
  int32 position_x = 4;
  int32 position_y = 5;
  string shape = 6;
}

message UpdateTableResponse {
  Table table = 1;
}

// ── Update Status ──────────────────────────────────────────────────

message UpdateTableStatusRequest {
  int64 id = 1;
  string status = 2;
}

message UpdateTableStatusResponse {
  Table table = 1;
}
