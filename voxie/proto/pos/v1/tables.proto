syntax = "proto3";

package pos;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

// ── Table ─────────────────────────────────────────────────────────

message Table {
  int64 id = 1;
  int64 owner_id = 2;
  optional int64 location_id = 3;
  string label = 4;
  int32 seats = 5;
  string status = 6;
  string created_at = 7;
  string updated_at = 8;
}

// ── List ──────────────────────────────────────────────────────────

message ListTablesRequest {}

message ListTablesResponse {
  repeated Table tables = 1;
}

// ── Create ────────────────────────────────────────────────────────

message CreateTableRequest {
  optional int64 location_id = 1;
  string label = 2;
  int32 seats = 3;
}

message CreateTableResponse {
  int64 table_id = 1;
  string message = 2;
}

// ── Update ────────────────────────────────────────────────────────

message UpdateTableRequest {
  optional int64 location_id = 1;
  string label = 2;
  int32 seats = 3;
  string status = 4;
}

message UpdateTableResponse {
  string message = 1;
}

// ── Delete ────────────────────────────────────────────────────────

message DeleteTableRequest {}

message DeleteTableResponse {
  string message = 1;
}
