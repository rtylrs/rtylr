syntax = "proto3";

package pos;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

// ── Shared Payloads ───────────────────────────────────────────────

message OrderItem {
  int64 id = 1;
  int64 order_id = 2;
  int64 menu_item_id = 3;
  string name = 4;
  string sku = 5;
  double quantity = 6;
  double unit_price = 7;
  double discount_pct = 8;
  double discount_amount = 9;
  double tax_rate = 10;
  double total = 11;
  string notes = 12;
  string status = 13;
  string created_at = 14;
}

message Order {
  int64 id = 1;
  int64 owner_id = 2;
  int64 session_id = 3;
  int64 table_id = 4;
  int64 location_id = 5;
  string order_number = 6;
  string type = 7;
  string status = 8;
  int64 customer_id = 9;
  string customer_name = 10;
  int64 staff_id = 11;
  double subtotal = 12;
  double discount_amount = 13;
  double tax_amount = 14;
  double total = 15;
  string payment_method = 16;
  string payment_status = 17;
  double amount_paid = 18;
  double change_due = 19;
  string notes = 20;
  string kitchen_notes = 21;
  string created_at = 22;
  string updated_at = 23;
  string paid_at = 24;
  repeated OrderItem items = 25;
}

// ── List Orders ───────────────────────────────────────────────────

message ListOrdersRequest {
  int64 session_id = 1;
  string status = 2;
  string date_from = 3;
  string date_to = 4;
}

message ListOrdersResponse {
  repeated Order orders = 1;
}

// ── Create Order ──────────────────────────────────────────────────

message CreateOrderItemInput {
  int64 menu_item_id = 1;
  string name = 2;
  string sku = 3;
  double quantity = 4;
  double unit_price = 5;
  double discount_pct = 6;
  double tax_rate = 7;
  string notes = 8;
}

message CreateOrderRequest {
  int64 session_id = 1;
  int64 table_id = 2;
  int64 location_id = 3;
  string type = 4;
  int64 customer_id = 5;
  string customer_name = 6;
  string payment_method = 7;
  string notes = 8;
  string kitchen_notes = 9;
  repeated CreateOrderItemInput items = 10;
}

message CreateOrderResponse {
  int64 order_id = 1;
  string order_number = 2;
  string message = 3;
}

// ── Get Order Detail ──────────────────────────────────────────────

message GetOrderDetailRequest {
  int64 order_id = 1;
}

message GetOrderDetailResponse {
  Order order = 1;
}

// ── Update Order Status ───────────────────────────────────────────

message UpdateOrderStatusRequest {
  int64 order_id = 1;
  string status = 2;
}

message UpdateOrderStatusResponse {
  string message = 1;
}

// ── Update Order Item Status ──────────────────────────────────────

message UpdateOrderItemStatusRequest {
  int64 order_id = 1;
  int64 item_id = 2;
  string status = 3;
}

message UpdateOrderItemStatusResponse {
  string message = 1;
}

// ── Process Payment ───────────────────────────────────────────────

message ProcessPaymentRequest {
  int64 order_id = 1;
  string payment_method = 2;
  double amount_paid = 3;
}

message ProcessPaymentResponse {
  string message = 1;
}

// ── Process Refund ────────────────────────────────────────────────

message ProcessRefundRequest {
  int64 order_id = 1;
  double amount = 2;
  string reason = 3;
}

message ProcessRefundResponse {
  int64 refund_id = 1;
  string message = 2;
}

// ── Split Order ───────────────────────────────────────────────────

message SplitOrderRequest {
  int64 order_id = 1;
  repeated SplitGroup splits = 2;
}

message SplitGroup {
  repeated int64 item_ids = 1;
}

message SplitOrderResponse {
  repeated int64 order_ids = 1;
  string message = 2;
}

// ── Apply Discount ────────────────────────────────────────────────

message DiscountOrderRequest {
  int64 order_id = 1;
  string discount_type = 2;
  double discount_value = 3;
  string reason = 4;
}

message DiscountOrderResponse {
  string message = 1;
}

// ── Void Order ────────────────────────────────────────────────────

message VoidOrderRequest {
  int64 order_id = 1;
  string reason = 2;
}

message VoidOrderResponse {
  string message = 1;
}

// ── Hold Order ────────────────────────────────────────────────────

message HoldOrderRequest {
  int64 order_id = 1;
  string reason = 2;
}

message HoldOrderResponse {
  string message = 1;
}

// ── List Held Orders ──────────────────────────────────────────────

message ListHeldOrdersRequest {}

message ListHeldOrdersResponse {
  repeated Order orders = 1;
}

// ── Dashboard ─────────────────────────────────────────────────────

message DashboardRequest {}

message DashboardResponse {
  double total_sales = 1;
  int32 order_count = 2;
  double avg_order = 3;
  double table_turnover = 4;
}
