syntax = "proto3";

package pos;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

import "common/v1/pagination.proto";

// ── Order ──────────────────────────────────────────────────────────

message OrderItem {
  int64 id = 1;
  int64 order_id = 2;
  int64 menu_item_id = 3;
  string name = 4;
  int32 quantity = 5;
  double unit_price = 6;
  double total_price = 7;
  string notes = 8;
  repeated OrderItemModifier modifiers = 9;
  string status = 10; // pending, preparing, ready, served
  string sent_at = 11;
  string created_at = 12;
}

message OrderItemModifier {
  int64 id = 1;
  int64 modifier_id = 2;
  string name = 3;
  double price = 4;
  int32 quantity = 5;
}

message OrderDiscount {
  int64 id = 1;
  string type = 2; // percentage, fixed
  double value = 3;
  string reason = 4;
  string applied_by = 5;
}

message OrderPayment {
  int64 id = 1;
  string method = 2; // cash, card, gift_card
  double amount = 3;
  string reference = 4;
  string status = 5;
  string created_at = 6;
}

message Order {
  int64 id = 1;
  string order_number = 2;
  int64 location_id = 3;
  int64 session_id = 4;
  int64 table_id = 5;
  int64 customer_id = 6;
  string order_type = 7; // dine_in, takeout, delivery
  string status = 8; // open, held, closed, voided, refunded
  repeated OrderItem items = 9;
  repeated OrderDiscount discounts = 10;
  repeated OrderPayment payments = 11;
  double subtotal = 12;
  double tax_amount = 13;
  double discount_amount = 14;
  double tip_amount = 15;
  double total = 16;
  string notes = 17;
  string created_by = 18;
  string created_at = 19;
  string updated_at = 20;
}

// ── Create ─────────────────────────────────────────────────────────

message CreateOrderRequest {
  int64 location_id = 1;
  int64 table_id = 2;
  int64 customer_id = 3;
  string order_type = 4;
  repeated CreateOrderItemInput items = 5;
  string notes = 6;
}

message CreateOrderItemInput {
  int64 menu_item_id = 1;
  int32 quantity = 2;
  string notes = 3;
  repeated int64 modifier_ids = 4;
}

message CreateOrderResponse {
  Order order = 1;
}

// ── List ───────────────────────────────────────────────────────────

message ListOrdersRequest {
  common.PaginationRequest pagination = 1;
  string status = 2;
  string order_type = 3;
  int64 table_id = 4;
  string date_from = 5;
  string date_to = 6;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  common.PaginationResponse pagination = 2;
}

// ── Update Status ──────────────────────────────────────────────────

message UpdateOrderStatusRequest {
  int64 id = 1;
  string status = 2;
}

message UpdateOrderStatusResponse {
  Order order = 1;
}

// ── Charge ─────────────────────────────────────────────────────────

message ChargeOrderRequest {
  int64 id = 1;
  string payment_method = 2;
  double amount = 3;
  double tip_amount = 4;
  string reference = 5;
}

message ChargeOrderResponse {
  Order order = 1;
  OrderPayment payment = 2;
}

// ── Void ───────────────────────────────────────────────────────────

message VoidOrderRequest {
  int64 id = 1;
  string reason = 2;
  string manager_pin = 3;
}

message VoidOrderResponse {
  Order order = 1;
}

// ── Refund ─────────────────────────────────────────────────────────

message RefundOrderRequest {
  int64 id = 1;
  double amount = 2;
  string reason = 3;
  string manager_pin = 4;
}

message RefundOrderResponse {
  Order order = 1;
  double refunded_amount = 2;
}

// ── Discount ───────────────────────────────────────────────────────

message ApplyDiscountRequest {
  int64 order_id = 1;
  string type = 2; // percentage, fixed
  double value = 3;
  string reason = 4;
}

message ApplyDiscountResponse {
  Order order = 1;
}

// ── Split ──────────────────────────────────────────────────────────

message SplitOrderRequest {
  int64 order_id = 1;
  int32 ways = 2; // number of ways to split
  repeated SplitGroup groups = 3; // or explicit item groups
}

message SplitGroup {
  repeated int64 item_ids = 1;
}

message SplitOrderResponse {
  repeated Order orders = 1;
}

// ── Hold ───────────────────────────────────────────────────────────

message HoldOrderRequest {
  int64 id = 1;
  string reason = 2;
}

message HoldOrderResponse {
  Order order = 1;
}
