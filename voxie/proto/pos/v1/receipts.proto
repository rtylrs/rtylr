syntax = "proto3";

package pos;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

// ── Receipt ───────────────────────────────────────────────────────

message Receipt {
  int64 id = 1;
  string order_number = 2;
  string customer_name = 3;
  double total = 4;
  string payment_method = 5;
  string paid_at = 6;
}

// ── List ──────────────────────────────────────────────────────────

message ListReceiptsRequest {
  string from = 1;
  string to = 2;
}

message ListReceiptsResponse {
  repeated Receipt receipts = 1;
}
