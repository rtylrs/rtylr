syntax = "proto3";

package pos;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

import "common/v1/pagination.proto";

// ── AuditEntry ─────────────────────────────────────────────────────

message AuditEntry {
  int64 id = 1;
  int64 location_id = 2;
  string action = 3;
  string entity_type = 4; // order, session, user, menu_item
  int64 entity_id = 5;
  string actor_name = 6;
  int64 actor_id = 7;
  string description = 8;
  string ip_address = 9;
  string metadata = 10; // JSON string of extra details
  string created_at = 11;
}

// ── List ───────────────────────────────────────────────────────────

message ListAuditEntriesRequest {
  common.PaginationRequest pagination = 1;
  string action = 2;
  string entity_type = 3;
  int64 actor_id = 4;
  string date_from = 5;
  string date_to = 6;
}

message ListAuditEntriesResponse {
  repeated AuditEntry entries = 1;
  common.PaginationResponse pagination = 2;
}

// ── Create ─────────────────────────────────────────────────────────

message CreateAuditEntryRequest {
  string action = 1;
  string entity_type = 2;
  int64 entity_id = 3;
  string description = 4;
  string metadata = 5;
}

message CreateAuditEntryResponse {
  AuditEntry entry = 1;
}
