syntax = "proto3";

package pos;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

// ── AuditLog ──────────────────────────────────────────────────────

message AuditLog {
  int64 id = 1;
  int64 business_id = 2;
  int64 branch_id = 3;
  optional int64 terminal_id = 4;
  int64 employee_id = 5;
  string action = 6;
  string entity_type = 7;
  optional int64 entity_id = 8;
  optional string details = 9;
  optional string ip_address = 10;
  string created_at = 11;
}

// ── List ──────────────────────────────────────────────────────────

message ListAuditRequest {
  string action = 1;
  string entity_type = 2;
  int64 employee_id = 3;
  string start_date = 4;
  string end_date = 5;
}

message ListAuditResponse {
  repeated AuditLog logs = 1;
}

// ── Create ────────────────────────────────────────────────────────

message CreateAuditRequest {
  int64 branch_id = 1;
  int64 terminal_id = 2;
  int64 employee_id = 3;
  string action = 4;
  string entity_type = 5;
  int64 entity_id = 6;
  string details = 7;
  string ip_address = 8;
}

message CreateAuditResponse {
  int64 audit_log_id = 1;
  string message = 2;
}
