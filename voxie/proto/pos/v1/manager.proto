syntax = "proto3";

package pos;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

// ── Manager ───────────────────────────────────────────────────────

message VerifyPINRequest {
  string pin = 1;
}

message VerifyPINResponse {
  bool valid = 1;
  int64 staff_id = 2;
  string message = 3;
}
