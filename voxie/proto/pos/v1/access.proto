syntax = "proto3";

package pos.v1;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

// ── MyLocation ────────────────────────────────────────────────────

message MyLocation {
  int64 location_id = 1;
  string name = 2;
  string address = 3;
  string phone = 4;
}

// ── Get My Locations ──────────────────────────────────────────────

message GetMyLocationsRequest {}

message GetMyLocationsResponse {
  repeated MyLocation locations = 1;
}

// ── Assign ────────────────────────────────────────────────────────

message AssignLocationRequest {
  int64 user_id = 1;
  int64 location_id = 2;
  bool can_manage_pos_users = 3;
  bool can_manage_terminals = 4;
  bool can_view_reports = 5;
}

message AssignLocationResponse {
  int64 id = 1;
}

// ── Remove ────────────────────────────────────────────────────────

message RemoveLocationRequest {
  int64 id = 1;
}

message RemoveLocationResponse {
  bool success = 1;
}
