syntax = "proto3";

package pos.v1;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

// ── CashMovement ──────────────────────────────────────────────────

message CashMovement {
  int64 id = 1;
  int64 business_id = 2;
  int64 branch_id = 3;
  optional int64 terminal_id = 4;
  int64 session_id = 5;
  int64 employee_id = 6;
  string type = 7;
  double amount = 8;
  optional string reason = 9;
  optional int64 approved_by = 10;
  string created_at = 11;
}

// ── List ──────────────────────────────────────────────────────────

message ListCashMovementsRequest {
  int64 session_id = 1;
}

message ListCashMovementsResponse {
  repeated CashMovement movements = 1;
}

// ── Cash Drop ─────────────────────────────────────────────────────

message CashDropRequest {
  int64 branch_id = 1;
  int64 terminal_id = 2;
  int64 session_id = 3;
  int64 employee_id = 4;
  double amount = 5;
  string reason = 6;
}

message CashDropResponse {
  int64 movement_id = 1;
  string message = 2;
}

// ── Cash Pickup ───────────────────────────────────────────────────

message CashPickupRequest {
  int64 branch_id = 1;
  int64 terminal_id = 2;
  int64 session_id = 3;
  int64 employee_id = 4;
  double amount = 5;
  string reason = 6;
}

message CashPickupResponse {
  int64 movement_id = 1;
  string message = 2;
}

// ── Cash Adjust ───────────────────────────────────────────────────

message CashAdjustRequest {
  int64 branch_id = 1;
  int64 terminal_id = 2;
  int64 session_id = 3;
  int64 employee_id = 4;
  double amount = 5;
  string reason = 6;
}

message CashAdjustResponse {
  int64 movement_id = 1;
  string message = 2;
}
