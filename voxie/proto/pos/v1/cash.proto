syntax = "proto3";

package pos;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

import "common/v1/pagination.proto";

// ── CashMovement ───────────────────────────────────────────────────

message CashMovement {
  int64 id = 1;
  int64 session_id = 2;
  int64 location_id = 3;
  string type = 4; // drop, pickup, adjustment
  double amount = 5;
  string reason = 6;
  string performed_by = 7;
  string created_at = 8;
}

// ── List ───────────────────────────────────────────────────────────

message ListCashMovementsRequest {
  common.PaginationRequest pagination = 1;
  int64 session_id = 2;
  string type = 3;
}

message ListCashMovementsResponse {
  repeated CashMovement movements = 1;
  common.PaginationResponse pagination = 2;
}

// ── Drop ───────────────────────────────────────────────────────────

message CashDropRequest {
  double amount = 1;
  string reason = 2;
}

message CashDropResponse {
  CashMovement movement = 1;
}

// ── Pickup ─────────────────────────────────────────────────────────

message CashPickupRequest {
  double amount = 1;
  string reason = 2;
}

message CashPickupResponse {
  CashMovement movement = 1;
}

// ── Adjust ─────────────────────────────────────────────────────────

message CashAdjustRequest {
  double amount = 1;
  string reason = 2;
}

message CashAdjustResponse {
  CashMovement movement = 1;
}
