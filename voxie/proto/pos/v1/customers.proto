syntax = "proto3";

package pos;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

// ── Customer ──────────────────────────────────────────────────────

message Customer {
  int64 id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
}

// ── Search ────────────────────────────────────────────────────────

message SearchCustomersRequest {
  string query = 1;
}

message SearchCustomersResponse {
  repeated Customer customers = 1;
}
