syntax = "proto3";

package pos;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

import "common/v1/pagination.proto";

// ── POSCustomer ────────────────────────────────────────────────────

message POSCustomer {
  int64 id = 1;
  int64 location_id = 2;
  string name = 3;
  string email = 4;
  string phone = 5;
  string notes = 6;
  int32 total_orders = 7;
  double total_spent = 8;
  int32 loyalty_points = 9;
  string last_visit_at = 10;
  string created_at = 11;
  string updated_at = 12;
}

// ── Search ─────────────────────────────────────────────────────────

message SearchCustomersRequest {
  string query = 1;
  common.PaginationRequest pagination = 2;
}

message SearchCustomersResponse {
  repeated POSCustomer customers = 1;
  common.PaginationResponse pagination = 2;
}

// ── Create ─────────────────────────────────────────────────────────

message CreateCustomerRequest {
  string name = 1;
  string email = 2;
  string phone = 3;
  string notes = 4;
}

message CreateCustomerResponse {
  POSCustomer customer = 1;
}

// ── Get ────────────────────────────────────────────────────────────

message GetCustomerRequest {
  int64 id = 1;
}

message GetCustomerResponse {
  POSCustomer customer = 1;
}
