syntax = "proto3";

package pos;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

// ── Session ───────────────────────────────────────────────────────

message Session {
  int64 id = 1;
  int64 owner_id = 2;
  int64 location_id = 3;
  int64 staff_id = 4;
  double opening_float = 5;
  double closing_float = 6;
  double total_sales = 7;
  string status = 8;
  string opened_at = 9;
  string closed_at = 10;
  string created_at = 11;
}

// ── List ──────────────────────────────────────────────────────────

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

// ── Open ──────────────────────────────────────────────────────────

message OpenSessionRequest {
  int64 location_id = 1;
  int64 staff_id = 2;
  double opening_float = 3;
}

message OpenSessionResponse {
  int64 session_id = 1;
  string message = 2;
}

// ── Close ─────────────────────────────────────────────────────────

message CloseSessionRequest {
  double closing_float = 1;
}

message CloseSessionResponse {
  string message = 1;
}
