syntax = "proto3";

package pos;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

// ── KDS ───────────────────────────────────────────────────────────

message KDSItem {
  int64 id = 1;
  int64 order_id = 2;
  string name = 3;
  double quantity = 4;
  string notes = 5;
  string status = 6;
}

message KDSOrder {
  int64 id = 1;
  string order_number = 2;
  string type = 3;
  string status = 4;
  int64 table_id = 5;
  string customer_name = 6;
  string kitchen_notes = 7;
  string created_at = 8;
  repeated KDSItem items = 9;
}

// ── List ──────────────────────────────────────────────────────────

message ListKDSOrdersRequest {}

message ListKDSOrdersResponse {
  repeated KDSOrder orders = 1;
}

// ── Update Item Status ────────────────────────────────────────────

message UpdateKDSItemStatusRequest {
  string status = 1;
}

message UpdateKDSItemStatusResponse {
  string message = 1;
}
