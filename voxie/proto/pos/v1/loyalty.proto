syntax = "proto3";

package pos;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

// ── LoyaltyConfig ─────────────────────────────────────────────────

message LoyaltyConfig {
  int64 id = 1;
  int64 business_id = 2;
  bool is_enabled = 3;
  double points_per_dollar = 4;
  double redemption_rate = 5;
  int32 min_redeem_points = 6;
  string created_at = 7;
  string updated_at = 8;
}

// ── Get Config ────────────────────────────────────────────────────

message GetLoyaltyConfigRequest {}

message GetLoyaltyConfigResponse {
  LoyaltyConfig config = 1;
}

// ── Update Config ─────────────────────────────────────────────────

message UpdateLoyaltyConfigRequest {
  bool is_enabled = 1;
  double points_per_dollar = 2;
  double redemption_rate = 3;
  int32 min_redeem_points = 4;
}

message UpdateLoyaltyConfigResponse {
  string message = 1;
}

// ── Loyalty Transaction ───────────────────────────────────────────

message LoyaltyTransaction {
  int64 id = 1;
  int64 business_id = 2;
  int64 customer_id = 3;
  int64 order_id = 4;
  string type = 5;
  int32 points = 6;
  int32 balance_after = 7;
  string note = 8;
  string created_at = 9;
}

// ── List Transactions ─────────────────────────────────────────────

message ListLoyaltyTransactionsRequest {
  int64 customer_id = 1;
}

message ListLoyaltyTransactionsResponse {
  repeated LoyaltyTransaction transactions = 1;
}

// ── Earn Points ───────────────────────────────────────────────────

message EarnPointsRequest {
  int64 customer_id = 1;
  int64 order_id = 2;
  int32 points = 3;
}

message EarnPointsResponse {
  int64 transaction_id = 1;
  string message = 2;
}

// ── Redeem Points ─────────────────────────────────────────────────

message RedeemPointsRequest {
  int64 customer_id = 1;
  int32 points = 2;
}

message RedeemPointsResponse {
  int64 transaction_id = 1;
  string message = 2;
}

// ── Get Balance ───────────────────────────────────────────────────

message GetLoyaltyBalanceRequest {
  int64 customer_id = 1;
}

message GetLoyaltyBalanceResponse {
  int64 customer_id = 1;
  int32 balance = 2;
}
