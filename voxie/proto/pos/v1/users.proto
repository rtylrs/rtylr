syntax = "proto3";

package pos;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

// ── POSUser ───────────────────────────────────────────────────────

message POSUser {
  int64 id = 1;
  int64 business_id = 2;
  int64 location_id = 3;
  string name = 4;
  string role = 5;
  bool is_active = 6;
  double max_discount_pct = 7;
  bool can_void = 8;
  bool can_refund = 9;
  bool can_open_drawer = 10;
  bool can_apply_discount = 11;
}

// ── List ──────────────────────────────────────────────────────────

message ListPOSUsersRequest {
  int64 location_id = 1;
}

message ListPOSUsersResponse {
  repeated POSUser users = 1;
}

// ── Create ────────────────────────────────────────────────────────

message CreatePOSUserRequest {
  int64 location_id = 1;
  string name = 2;
  string pin = 3;
  string role = 4;
  double hourly_rate = 5;
  double max_discount_pct = 6;
  bool can_void = 7;
  bool can_refund = 8;
  bool can_open_drawer = 9;
  bool can_apply_discount = 10;
}

message CreatePOSUserResponse {
  int64 id = 1;
}

// ── Update ────────────────────────────────────────────────────────

message UpdatePOSUserRequest {
  int64 id = 1;
  string name = 2;
  string pin = 3;
  string role = 4;
  bool is_active = 5;
  double hourly_rate = 6;
  double max_discount_pct = 7;
  bool can_void = 8;
  bool can_refund = 9;
  bool can_open_drawer = 10;
  bool can_apply_discount = 11;
}

message UpdatePOSUserResponse {
  bool success = 1;
}

// ── Deactivate ────────────────────────────────────────────────────

message DeactivatePOSUserRequest {
  int64 id = 1;
}

message DeactivatePOSUserResponse {
  bool success = 1;
}

// ── Verify PIN ────────────────────────────────────────────────────

message VerifyPOSUserPINRequest {
  string pin = 1;
}

message VerifyPOSUserPINResponse {
  POSUser user = 1;
}
