syntax = "proto3";

package pos;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

import "common/v1/pagination.proto";

// ── POSUser ────────────────────────────────────────────────────────

message POSUser {
  int64 id = 1;
  int64 location_id = 2;
  string name = 3;
  string email = 4;
  string role = 5; // cashier, server, manager, admin
  string pin = 6;
  bool is_active = 7;
  string last_login_at = 8;
  string created_at = 9;
  string updated_at = 10;
}

// ── List ───────────────────────────────────────────────────────────

message ListPOSUsersRequest {
  common.PaginationRequest pagination = 1;
  string role = 2;
  bool active_only = 3;
}

message ListPOSUsersResponse {
  repeated POSUser users = 1;
  common.PaginationResponse pagination = 2;
}

// ── Create ─────────────────────────────────────────────────────────

message CreatePOSUserRequest {
  string name = 1;
  string email = 2;
  string role = 3;
  string pin = 4;
}

message CreatePOSUserResponse {
  POSUser user = 1;
}

// ── Update ─────────────────────────────────────────────────────────

message UpdatePOSUserRequest {
  int64 id = 1;
  string name = 2;
  string email = 3;
  string role = 4;
  bool is_active = 5;
}

message UpdatePOSUserResponse {
  POSUser user = 1;
}

// ── Delete ─────────────────────────────────────────────────────────

message DeletePOSUserRequest {
  int64 id = 1;
}

message DeletePOSUserResponse {
  bool success = 1;
}

// ── Verify Pin ─────────────────────────────────────────────────────

message VerifyPOSUserPinRequest {
  string pin = 1;
}

message VerifyPOSUserPinResponse {
  bool valid = 1;
  POSUser user = 2;
}
