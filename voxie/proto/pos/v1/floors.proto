syntax = "proto3";

package pos.v1;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

// ── Floor ─────────────────────────────────────────────────────────

message Floor {
  int64 id = 1;
  int64 business_id = 2;
  int64 branch_id = 3;
  string name = 4;
  int32 sort_order = 5;
  bool is_active = 6;
  string created_at = 7;
}

// ── List ──────────────────────────────────────────────────────────

message ListFloorsRequest {
  int64 branch_id = 1;
}

message ListFloorsResponse {
  repeated Floor floors = 1;
}

// ── Create ────────────────────────────────────────────────────────

message CreateFloorRequest {
  int64 branch_id = 1;
  string name = 2;
  int32 sort_order = 3;
}

message CreateFloorResponse {
  int64 floor_id = 1;
  string message = 2;
}

// ── Update ────────────────────────────────────────────────────────

message UpdateFloorRequest {
  string name = 1;
  int32 sort_order = 2;
}

message UpdateFloorResponse {
  string message = 1;
}

// ── Delete ────────────────────────────────────────────────────────

message DeleteFloorRequest {}

message DeleteFloorResponse {
  string message = 1;
}
