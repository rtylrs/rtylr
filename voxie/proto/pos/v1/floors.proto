syntax = "proto3";

package pos;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

// ── Floor ──────────────────────────────────────────────────────────

message Floor {
  int64 id = 1;
  int64 location_id = 2;
  string name = 3;
  int32 sort_order = 4;
  int32 table_count = 5;
  string created_at = 6;
  string updated_at = 7;
}

// ── List ───────────────────────────────────────────────────────────

message ListFloorsRequest {}

message ListFloorsResponse {
  repeated Floor floors = 1;
}

// ── Create ─────────────────────────────────────────────────────────

message CreateFloorRequest {
  string name = 1;
  int32 sort_order = 2;
}

message CreateFloorResponse {
  Floor floor = 1;
}

// ── Update ─────────────────────────────────────────────────────────

message UpdateFloorRequest {
  int64 id = 1;
  string name = 2;
  int32 sort_order = 3;
}

message UpdateFloorResponse {
  Floor floor = 1;
}

// ── Delete ─────────────────────────────────────────────────────────

message DeleteFloorRequest {
  int64 id = 1;
}

message DeleteFloorResponse {
  bool success = 1;
}
