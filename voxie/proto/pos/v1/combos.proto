syntax = "proto3";

package pos.v1;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

// ── Combo ─────────────────────────────────────────────────────────

message Combo {
  int64 id = 1;
  int64 owner_id = 2;
  string name = 3;
  string description = 4;
  double price = 5;
  string items = 6;
  bool is_active = 7;
  string created_at = 8;
  string updated_at = 9;
}

// ── List ──────────────────────────────────────────────────────────

message ListCombosRequest {}

message ListCombosResponse {
  repeated Combo combos = 1;
}

// ── Create ────────────────────────────────────────────────────────

message CreateComboRequest {
  string name = 1;
  string description = 2;
  double price = 3;
  string items = 4;
  bool is_active = 5;
}

message CreateComboResponse {
  int64 combo_id = 1;
  string message = 2;
}

// ── Update ────────────────────────────────────────────────────────

message UpdateComboRequest {
  string name = 1;
  string description = 2;
  double price = 3;
  string items = 4;
  bool is_active = 5;
}

message UpdateComboResponse {
  string message = 1;
}

// ── Delete ────────────────────────────────────────────────────────

message DeleteComboRequest {}

message DeleteComboResponse {
  string message = 1;
}
