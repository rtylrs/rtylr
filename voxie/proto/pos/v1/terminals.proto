syntax = "proto3";

package pos.v1;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

// ── Terminal ──────────────────────────────────────────────────────

message Terminal {
  int64 id = 1;
  int64 business_id = 2;
  int64 branch_id = 3;
  string name = 4;
  optional string device_id = 5;
  bool is_active = 6;
  optional string last_seen_at = 7;
  string created_at = 8;
}

// ── List ──────────────────────────────────────────────────────────

message ListTerminalsRequest {}

message ListTerminalsResponse {
  repeated Terminal terminals = 1;
}

// ── Create ────────────────────────────────────────────────────────

message CreateTerminalRequest {
  int64 branch_id = 1;
  string name = 2;
  string device_id = 3;
}

message CreateTerminalResponse {
  int64 terminal_id = 1;
  string message = 2;
}

// ── Update ────────────────────────────────────────────────────────

message UpdateTerminalRequest {
  int64 branch_id = 1;
  string name = 2;
  string device_id = 3;
  bool is_active = 4;
}

message UpdateTerminalResponse {
  string message = 1;
}

// ── Heartbeat ─────────────────────────────────────────────────────

message HeartbeatTerminalRequest {
  int64 terminal_id = 1;
}

message HeartbeatTerminalResponse {
  string message = 1;
}
