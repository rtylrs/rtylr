syntax = "proto3";

package pos;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

// ── MenuItem ──────────────────────────────────────────────────────

message MenuItem {
  int64 id = 1;
  int64 owner_id = 2;
  int64 category_id = 3;
  string name = 4;
  string sku = 5;
  double sale_price = 6;
  bool is_active = 7;
  string created_at = 8;
  string updated_at = 9;
}

// ── List ──────────────────────────────────────────────────────────

message ListMenuItemsRequest {}

message ListMenuItemsResponse {
  repeated MenuItem items = 1;
}

// ── Create ────────────────────────────────────────────────────────

message CreateMenuItemRequest {
  string name = 1;
  string sku = 2;
  double sale_price = 3;
}

message CreateMenuItemResponse {
  int64 item_id = 1;
  string message = 2;
}
