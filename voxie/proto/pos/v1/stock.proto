syntax = "proto3";

package pos.v1;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

// ── StockMovement ─────────────────────────────────────────────────

message StockMovement {
  int64 id = 1;
  int64 business_id = 2;
  int64 branch_id = 3;
  int64 product_id = 4;
  string type = 5;
  double quantity = 6;
  optional int64 reference_id = 7;
  optional string reference_type = 8;
  optional string note = 9;
  optional int64 employee_id = 10;
  string created_at = 11;
}

// ── BranchInventory ───────────────────────────────────────────────

message BranchInventory {
  int64 id = 1;
  int64 business_id = 2;
  int64 branch_id = 3;
  int64 product_id = 4;
  double quantity = 5;
  double reorder_point = 6;
  double reorder_quantity = 7;
  string updated_at = 8;
}

// ── List Movements ────────────────────────────────────────────────

message ListStockMovementsRequest {
  int64 branch_id = 1;
  int64 product_id = 2;
}

message ListStockMovementsResponse {
  repeated StockMovement movements = 1;
}

// ── Receive Stock ─────────────────────────────────────────────────

message ReceiveStockRequest {
  int64 branch_id = 1;
  int64 product_id = 2;
  double quantity = 3;
  string note = 4;
  int64 employee_id = 5;
}

message ReceiveStockResponse {
  int64 movement_id = 1;
  string message = 2;
}

// ── Adjust Stock ──────────────────────────────────────────────────

message AdjustStockRequest {
  int64 branch_id = 1;
  int64 product_id = 2;
  double quantity = 3;
  string note = 4;
  int64 employee_id = 5;
}

message AdjustStockResponse {
  int64 movement_id = 1;
  string message = 2;
}

// ── Waste Stock ───────────────────────────────────────────────────

message WasteStockRequest {
  int64 branch_id = 1;
  int64 product_id = 2;
  double quantity = 3;
  string note = 4;
  int64 employee_id = 5;
}

message WasteStockResponse {
  int64 movement_id = 1;
  string message = 2;
}

// ── Transfer Stock ────────────────────────────────────────────────

message TransferStockRequest {
  int64 from_branch_id = 1;
  int64 to_branch_id = 2;
  int64 product_id = 3;
  double quantity = 4;
  string note = 5;
  int64 employee_id = 6;
}

message TransferStockResponse {
  int64 movement_id = 1;
  string message = 2;
}

// ── List Inventory ────────────────────────────────────────────────

message ListInventoryRequest {
  int64 branch_id = 1;
}

message ListInventoryResponse {
  repeated BranchInventory inventory = 1;
}

// ── Low Stock ─────────────────────────────────────────────────────

message LowStockRequest {
  int64 branch_id = 1;
}

message LowStockResponse {
  repeated BranchInventory items = 1;
}
