syntax = "proto3";

package pos;

option go_package = "github.com/voxire/voxie/gen/go/pos/v1";

import "common/v1/pagination.proto";

// ── Stock ──────────────────────────────────────────────────────────

message StockMovement {
  int64 id = 1;
  int64 location_id = 2;
  int64 menu_item_id = 3;
  string item_name = 4;
  string type = 5; // receive, adjust, waste, transfer
  int32 quantity = 6;
  int32 quantity_before = 7;
  int32 quantity_after = 8;
  string reason = 9;
  int64 destination_location_id = 10;
  string performed_by = 11;
  string created_at = 12;
}

message BranchInventory {
  int64 menu_item_id = 1;
  string item_name = 2;
  string sku = 3;
  int32 quantity = 4;
  int32 low_stock_threshold = 5;
  bool is_low_stock = 6;
  string last_updated_at = 7;
}

// ── Receive ────────────────────────────────────────────────────────

message ReceiveStockRequest {
  int64 menu_item_id = 1;
  int32 quantity = 2;
  string reason = 3;
}

message ReceiveStockResponse {
  StockMovement movement = 1;
}

// ── Adjust ─────────────────────────────────────────────────────────

message AdjustStockRequest {
  int64 menu_item_id = 1;
  int32 quantity = 2;
  string reason = 3;
}

message AdjustStockResponse {
  StockMovement movement = 1;
}

// ── Waste ──────────────────────────────────────────────────────────

message WasteStockRequest {
  int64 menu_item_id = 1;
  int32 quantity = 2;
  string reason = 3;
}

message WasteStockResponse {
  StockMovement movement = 1;
}

// ── Transfer ───────────────────────────────────────────────────────

message TransferStockRequest {
  int64 menu_item_id = 1;
  int32 quantity = 2;
  int64 destination_location_id = 3;
  string reason = 4;
}

message TransferStockResponse {
  StockMovement movement = 1;
}

// ── Low Stock ──────────────────────────────────────────────────────

message ListLowStockRequest {
  common.PaginationRequest pagination = 1;
}

message ListLowStockResponse {
  repeated BranchInventory items = 1;
  common.PaginationResponse pagination = 2;
}

// ── List Movements ─────────────────────────────────────────────────

message ListStockMovementsRequest {
  common.PaginationRequest pagination = 1;
  int64 menu_item_id = 2;
  string type = 3;
}

message ListStockMovementsResponse {
  repeated StockMovement movements = 1;
  common.PaginationResponse pagination = 2;
}
