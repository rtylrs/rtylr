syntax = "proto3";

package pos.receipt.v1;

option go_package = "github.com/voxire/voxie/gen/go/pos/receipt/v1";

// ── Receipt ───────────────────────────────────────────────────────

message Receipt {
  // id is the unique identifier for the resource.
  int64 id = 1;
  // order_number is the order number value for this contract.
  string order_number = 2;
  // customer_name is the customer name value for this contract.
  string customer_name = 3;
  // total is the total number of matching records.
  double total = 4;
  // payment_method is the payment method value for this contract.
  string payment_method = 5;
  // paid_at is the paid at value for this contract.
  string paid_at = 6;
}
