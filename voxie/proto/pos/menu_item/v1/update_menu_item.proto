syntax = "proto3";

package pos.menu_item.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/menu_item/v1";

// ── Update ────────────────────────────────────────────────────────

message UpdateMenuItemBody {
  // name is the display name for the menu item.
  string name = 1;
  // sale_price is the sell price for the menu item.
  double sale_price = 2 [(buf.validate.field).double.gte = 0];
  // is_active controls whether the item can be sold.
  bool is_active = 3;
  // stock is the current tracked stock quantity for the menu item.
  double stock = 4 [(buf.validate.field).double.gte = 0];
}

message UpdateMenuItemRequest {
  // id is the unique identifier for the menu item.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // body carries updatable menu item fields bound from the HTTP payload.
  UpdateMenuItemBody body = 2;
}

message UpdateMenuItemResponse {
  // message is a human-readable result message.
  string message = 1;
}
