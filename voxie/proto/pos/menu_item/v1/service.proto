syntax = "proto3";

package pos.menu_item.v1;

import "onekit/http/annotations.proto";
import "pos/menu_item/v1/create_menu_item.proto";
import "pos/menu_item/v1/list_public_menu_items.proto";
import "pos/menu_item/v1/list_menu_items.proto";
import "pos/menu_item/v1/update_menu_item.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/menu_item/v1";

service MenuItemService {
  option (onekit.http.service_config) = {base_path: "/api/pos/menu-item/v1"};

  rpc ListMenuItems(ListMenuItemsRequest) returns (ListMenuItemsResponse) {
    option (onekit.http.config) = {
      path: "/menu-items"
      method: HTTP_METHOD_GET
    };
  }

  rpc ListPublicMenuItems(ListPublicMenuItemsRequest) returns (ListPublicMenuItemsResponse) {
    option (onekit.http.config) = {
      path: "/menu-items/public"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateMenuItem(CreateMenuItemRequest) returns (CreateMenuItemResponse) {
    option (onekit.http.config) = {
      path: "/menu-items"
      method: HTTP_METHOD_POST
    };
  }

  rpc UpdateMenuItem(UpdateMenuItemRequest) returns (UpdateMenuItemResponse) {
    option (onekit.http.config) = {
      path: "/menu-items/{id}"
      method: HTTP_METHOD_PUT
      body: "body"
    };
  }
}
