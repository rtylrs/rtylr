syntax = "proto3";

package pos.table.v1;

import "onekit/http/annotations.proto";
import "pos/table/v1/create_table.proto";
import "pos/table/v1/delete_table.proto";
import "pos/table/v1/list_tables.proto";
import "pos/table/v1/update_table.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/table/v1";

service TableService {
  option (onekit.http.service_config) = {base_path: "/api/pos/table/v1"};

  rpc ListTables(ListTablesRequest) returns (ListTablesResponse) {
    option (onekit.http.config) = {
      path: "/tables"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateTable(CreateTableRequest) returns (CreateTableResponse) {
    option (onekit.http.config) = {
      path: "/tables"
      method: HTTP_METHOD_POST
    };
  }

  rpc UpdateTable(UpdateTableRequest) returns (UpdateTableResponse) {
    option (onekit.http.config) = {
      path: "/tables/{id}"
      method: HTTP_METHOD_PUT
    };
  }

  rpc DeleteTable(DeleteTableRequest) returns (DeleteTableResponse) {
    option (onekit.http.config) = {
      path: "/tables/{id}"
      method: HTTP_METHOD_DELETE
    };
  }
}
