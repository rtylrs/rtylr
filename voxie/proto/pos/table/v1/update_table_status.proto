syntax = "proto3";

package pos.table.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/table/v1";

// ── Update Status ─────────────────────────────────────────────────

message UpdateTableStatusBody {
  // status is the current lifecycle state.
  string status = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message UpdateTableStatusRequest {
  // id is the unique identifier for the table.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // body carries the new table status bound from the HTTP payload.
  UpdateTableStatusBody body = 2;
}

message UpdateTableStatusResponse {
  // message is a human-readable result message.
  string message = 1;
}
