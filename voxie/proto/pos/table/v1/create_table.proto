syntax = "proto3";

package pos.table.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/table/v1";

// ── Create ────────────────────────────────────────────────────────

message CreateTableRequest {
  // location_id is the location id value for this contract.
  optional int64 location_id = 1;
  // label is the label value for this contract.
  string label = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // seats is the seats value for this contract.
  int32 seats = 3;
}

message CreateTableResponse {
  // table_id is the table id value for this contract.
  int64 table_id = 1;
  // message is a human-readable result message.
  string message = 2;
}
