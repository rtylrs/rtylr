syntax = "proto3";

package pos.combo.v1;

import "onekit/http/annotations.proto";
import "pos/combo/v1/create_combo.proto";
import "pos/combo/v1/delete_combo.proto";
import "pos/combo/v1/list_combos.proto";
import "pos/combo/v1/update_combo.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/combo/v1";

service ComboService {
  option (onekit.http.service_config) = {base_path: "/api/pos/combo/v1"};

  rpc ListCombos(ListCombosRequest) returns (ListCombosResponse) {
    option (onekit.http.config) = {
      path: "/combos"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateCombo(CreateComboRequest) returns (CreateComboResponse) {
    option (onekit.http.config) = {
      path: "/combos"
      method: HTTP_METHOD_POST
    };
  }

  rpc UpdateCombo(UpdateComboRequest) returns (UpdateComboResponse) {
    option (onekit.http.config) = {
      path: "/combos/{id}"
      method: HTTP_METHOD_PUT
    };
  }

  rpc DeleteCombo(DeleteComboRequest) returns (DeleteComboResponse) {
    option (onekit.http.config) = {
      path: "/combos/{id}"
      method: HTTP_METHOD_DELETE
    };
  }
}
