syntax = "proto3";

package pos.combo.v1;

import "pos/combo/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/combo/v1";

// ── List ──────────────────────────────────────────────────────────

message ListCombosRequest {}

message ListCombosResponse {
  // combos is the combos value for this contract.
  repeated Combo combos = 1;
}
