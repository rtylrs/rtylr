syntax = "proto3";

package pos.combo.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/combo/v1";

// ── Update ────────────────────────────────────────────────────────

message UpdateComboBody {
  // name is the name value for this contract.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // description is the description value for this contract.
  string description = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // price is the price value for this contract.
  double price = 3 [(buf.validate.field).double.gte = 0];
  // items is the items value for this contract.
  string items = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // is_active is the is active value for this contract.
  bool is_active = 5;
}

message UpdateComboRequest {
  // id is the unique identifier for the combo.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // body carries updatable combo fields bound from the HTTP payload.
  UpdateComboBody body = 2;
}

message UpdateComboResponse {
  // message is a human-readable result message.
  string message = 1;
}
