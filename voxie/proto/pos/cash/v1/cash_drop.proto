syntax = "proto3";

package pos.cash.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/cash/v1";

// ── Cash Drop ─────────────────────────────────────────────────────

message CashDropRequest {
  // branch_id is the branch id value for this contract.
  int64 branch_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  // terminal_id is the terminal id value for this contract.
  int64 terminal_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  // session_id is the session id value for this contract.
  int64 session_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  // employee_id is the employee id value for this contract.
  int64 employee_id = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  // amount is the amount value for this contract.
  double amount = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).double.gt = 0
  ];
  // reason is the reason value for this contract.
  string reason = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message CashDropResponse {
  // movement_id is the movement id value for this contract.
  int64 movement_id = 1;
  // message is a human-readable result message.
  string message = 2;
}
