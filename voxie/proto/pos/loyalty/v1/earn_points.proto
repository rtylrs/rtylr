syntax = "proto3";

package pos.loyalty.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/loyalty/v1";

// ── Earn Points ───────────────────────────────────────────────────

message EarnPointsRequest {
  // customer_id is the customer id value for this contract.
  int64 customer_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  , (onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // order_id is the order id value for this contract.
  int64 order_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  , (onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // points is the points value for this contract.
  int32 points = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32.gt = 0
  ];
}

message EarnPointsResponse {
  // transaction_id is the transaction id value for this contract.
  int64 transaction_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // message is a human-readable result message.
  string message = 2;
}
