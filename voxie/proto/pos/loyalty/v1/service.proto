syntax = "proto3";

package pos.loyalty.v1;

import "onekit/http/annotations.proto";
import "pos/loyalty/v1/earn_points.proto";
import "pos/loyalty/v1/get_loyalty_balance.proto";
import "pos/loyalty/v1/get_loyalty_config.proto";
import "pos/loyalty/v1/list_loyalty_transactions.proto";
import "pos/loyalty/v1/redeem_points.proto";
import "pos/loyalty/v1/update_loyalty_config.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/loyalty/v1";

service LoyaltyService {
  option (onekit.http.service_config) = {base_path: "/api/pos/loyalty/v1"};

  rpc GetLoyaltyConfig(GetLoyaltyConfigRequest) returns (GetLoyaltyConfigResponse) {
    option (onekit.http.config) = {
      path: "/config"
      method: HTTP_METHOD_GET
    };
  }

  rpc UpdateLoyaltyConfig(UpdateLoyaltyConfigRequest) returns (UpdateLoyaltyConfigResponse) {
    option (onekit.http.config) = {
      path: "/config"
      method: HTTP_METHOD_PUT
    };
  }

  rpc ListLoyaltyTransactions(ListLoyaltyTransactionsRequest) returns (ListLoyaltyTransactionsResponse) {
    option (onekit.http.config) = {
      path: "/transactions"
      method: HTTP_METHOD_GET
    };
  }

  rpc EarnPoints(EarnPointsRequest) returns (EarnPointsResponse) {
    option (onekit.http.config) = {
      path: "/earn"
      method: HTTP_METHOD_POST
    };
  }

  rpc RedeemPoints(RedeemPointsRequest) returns (RedeemPointsResponse) {
    option (onekit.http.config) = {
      path: "/redeem"
      method: HTTP_METHOD_POST
    };
  }

  rpc GetLoyaltyBalance(GetLoyaltyBalanceRequest) returns (GetLoyaltyBalanceResponse) {
    option (onekit.http.config) = {
      path: "/balance"
      method: HTTP_METHOD_GET
    };
  }
}
