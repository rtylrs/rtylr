syntax = "proto3";

package pos.floor.v1;

import "onekit/http/annotations.proto";
import "pos/floor/v1/create_floor.proto";
import "pos/floor/v1/delete_floor.proto";
import "pos/floor/v1/list_floors.proto";
import "pos/floor/v1/update_floor.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/floor/v1";

service FloorService {
  option (onekit.http.service_config) = {base_path: "/api/pos/floor/v1"};

  rpc ListFloors(ListFloorsRequest) returns (ListFloorsResponse) {
    option (onekit.http.config) = {
      path: "/floors"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateFloor(CreateFloorRequest) returns (CreateFloorResponse) {
    option (onekit.http.config) = {
      path: "/floors"
      method: HTTP_METHOD_POST
    };
  }

  rpc UpdateFloor(UpdateFloorRequest) returns (UpdateFloorResponse) {
    option (onekit.http.config) = {
      path: "/floors/{id}"
      method: HTTP_METHOD_PUT
    };
  }

  rpc DeleteFloor(DeleteFloorRequest) returns (DeleteFloorResponse) {
    option (onekit.http.config) = {
      path: "/floors/{id}"
      method: HTTP_METHOD_DELETE
    };
  }
}
