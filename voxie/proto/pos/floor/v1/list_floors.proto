syntax = "proto3";

package pos.floor.v1;

import "onekit/http/annotations.proto";
import "pos/floor/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/floor/v1";

// ── List ──────────────────────────────────────────────────────────

message ListFloorsRequest {
  // branch_id is the branch id value for this contract.
  int64 branch_id = 1 [(onekit.http.query).name = "branch_id"];
}

message ListFloorsResponse {
  // floors is the floors value for this contract.
  repeated Floor floors = 1;
}
