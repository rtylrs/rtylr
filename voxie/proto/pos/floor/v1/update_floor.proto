syntax = "proto3";

package pos.floor.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/floor/v1";

// ── Update ────────────────────────────────────────────────────────

message UpdateFloorRequest {
  // name is the name value for this contract.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // sort_order is the sort order value for this contract.
  int32 sort_order = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32.gt = 0
  ];
  // id is the unique identifier for the floor.
  int64 id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  , (onekit.http.int64_encoding) = INT64_ENCODING_STRING];
}

message UpdateFloorResponse {
  // message is a human-readable result message.
  string message = 1;
}
