syntax = "proto3";

package pos.floor.v1;

option go_package = "github.com/voxire/voxie/gen/go/pos/floor/v1";

// ── Create ────────────────────────────────────────────────────────

message CreateFloorRequest {
  // branch_id is the branch id value for this contract.
  int64 branch_id = 1;
  // name is the name value for this contract.
  string name = 2;
  // sort_order is the sort order value for this contract.
  int32 sort_order = 3;
}

message CreateFloorResponse {
  // floor_id is the floor id value for this contract.
  int64 floor_id = 1;
  // message is a human-readable result message.
  string message = 2;
}
