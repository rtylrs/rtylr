syntax = "proto3";

package insights.report.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/insights/report/v1";

message DeleteScheduledReportRequest {
  // id is the scheduled report identifier.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}

message DeleteScheduledReportResponse {
  // deleted confirms the schedule was removed.
  bool deleted = 1;
}
