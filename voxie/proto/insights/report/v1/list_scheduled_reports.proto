syntax = "proto3";

package insights.report.v1;

import "common/pagination/v1/pagination.proto";
import "insights/report/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/insights/report/v1";

message ListScheduledReportsRequest {
  // pagination is the pagination value for this contract.
  common.pagination.v1.PaginationRequest pagination = 1 [(onekit.http.flatten) = true];
}

message ListScheduledReportsResponse {
  // reports is the reports value for this contract.
  repeated ScheduledReport reports = 1;
  // pagination is the pagination value for this contract.
  common.pagination.v1.PaginationResponse pagination = 2;
}
