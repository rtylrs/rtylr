syntax = "proto3";

package insights.report.v1;

import "buf/validate/validate.proto";
import "insights/report/v1/types.proto";
import "onekit/http/annotations.proto";


option go_package = "github.com/voxire/voxie/gen/go/insights/report/v1";

message GetReportTemplateRequest {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}

message GetReportTemplateResponse {
  // template is the template value for this contract.
  ReportTemplate template = 1;
}
