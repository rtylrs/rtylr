syntax = "proto3";

package insights.report.v1;

import "buf/validate/validate.proto";
import "insights/report/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/insights/report/v1";

message UpdateScheduledReportRequest {
  // id is the scheduled report identifier.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // template_slug is the template slug (e.g. revenue-monthly).
  string template_slug = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // frequency is the delivery frequency (daily, weekly, monthly).
  string frequency = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // channel is the delivery channel (email, slack).
  string channel = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // recipient_email is the delivery recipient.
  string recipient_email = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      email: true
    }
  ];
  // is_active toggles whether the schedule is active.
  bool is_active = 6;
}

message UpdateScheduledReportResponse {
  // report is the updated scheduled report.
  ScheduledReport report = 1;
}
