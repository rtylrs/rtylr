syntax = "proto3";

package insights.customer.v1;

import "common/pagination/v1/pagination.proto";
import "insights/customer/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/insights/customer/v1";

message GetTopCustomersRequest {
  // page is the current result page.
  int32 page = 1 [(onekit.http.query).name = "page"];
  // limit is the maximum number of records to return.
  int32 limit = 2 [(onekit.http.query).name = "limit"];
  // sort_by is the sort field (total_spent, order_count).
  string sort_by = 3 [(onekit.http.query).name = "sort_by"];
  // sort_dir is the sort direction ("asc" or "desc").
  string sort_dir = 4 [(onekit.http.query).name = "sort_dir"];
  // period is the period value for this contract.
  string period = 5 [(onekit.http.query).name = "period"];
}

message GetTopCustomersResponse {
  // customers is the customers value for this contract.
  repeated TopCustomerEntry customers = 1;
  // pagination is the pagination value for this contract.
  common.pagination.v1.PaginationResponse pagination = 2;
}
