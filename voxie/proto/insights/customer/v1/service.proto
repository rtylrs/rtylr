syntax = "proto3";

package insights.customer.v1;

import "insights/customer/v1/get_churn_analysis.proto";
import "insights/customer/v1/get_customer_analytics.proto";
import "insights/customer/v1/get_ltv_analysis.proto";
import "insights/customer/v1/get_top_customers.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/insights/customer/v1";

// CustomerService defines insights customer analytics endpoints.
service CustomerService {
  option (onekit.http.service_config) = {base_path: "/api/insights/customer/v1"};

  // GetCustomerAnalytics returns customer analytics for a period.
  rpc GetCustomerAnalytics(GetCustomerAnalyticsRequest) returns (GetCustomerAnalyticsResponse) {
    option (onekit.http.config) = {
      path: "/analytics"
      method: HTTP_METHOD_GET
    };
  }

  // GetChurnAnalysis returns churn analysis for a period.
  rpc GetChurnAnalysis(GetChurnAnalysisRequest) returns (GetChurnAnalysisResponse) {
    option (onekit.http.config) = {
      path: "/churn"
      method: HTTP_METHOD_GET
    };
  }

  // GetLTVAnalysis returns lifetime value analysis.
  rpc GetLTVAnalysis(GetLTVAnalysisRequest) returns (GetLTVAnalysisResponse) {
    option (onekit.http.config) = {
      path: "/ltv"
      method: HTTP_METHOD_GET
    };
  }

  // GetTopCustomers returns top customers by spend or order count.
  rpc GetTopCustomers(GetTopCustomersRequest) returns (GetTopCustomersResponse) {
    option (onekit.http.config) = {
      path: "/top"
      method: HTTP_METHOD_GET
    };
  }
}
