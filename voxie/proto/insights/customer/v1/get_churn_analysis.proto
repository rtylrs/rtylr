syntax = "proto3";

package insights.customer.v1;

import "insights/customer/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/insights/customer/v1";

message GetChurnAnalysisRequest {
  // period is the period value for this contract.
  string period = 1 [(onekit.http.query).name = "period"];
}

message GetChurnAnalysisResponse {
  // analysis is the analysis value for this contract.
  ChurnAnalysis analysis = 1;
}
