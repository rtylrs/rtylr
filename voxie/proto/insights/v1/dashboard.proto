syntax = "proto3";

package insights.v1;

option go_package = "github.com/voxire/voxie/gen/go/insights/v1";

// ── Flow Insights ──────────────────────────────────────────────────

message GetInsightsRequest {}

message GetInsightsResponse {
  int64 total_tasks = 1;
  int64 completed_tasks = 2;
  int64 in_progress_tasks = 3;
  int64 overdue_tasks = 4;
  double avg_cycle_time_days = 5;
  int64 velocity = 6;
  int64 velocity_change = 7;
}

// ── Team Workload ──────────────────────────────────────────────────

message WorkloadEntry {
  int64 user_id = 1;
  int64 open_tasks = 2;
  int64 in_progress_tasks = 3;
  int64 completed_tasks = 4;
  int64 overdue_tasks = 5;
  int64 total_active = 6;
}

message GetWorkloadRequest {}

message GetWorkloadResponse {
  repeated WorkloadEntry workload = 1;
}

// ── Roadmap ────────────────────────────────────────────────────────

message RoadmapProject {
  int64 project_id = 1;
  string project_name = 2;
  string status = 3;
  int64 total_tasks = 4;
  int64 completed_tasks = 5;
  double progress_percent = 6;
  string start_date = 7;
  string due_date = 8;
}

message GetRoadmapRequest {}

message GetRoadmapResponse {
  repeated RoadmapProject projects = 1;
}

// ── Hub KPIs ───────────────────────────────────────────────────────

message GetKPIsRequest {}

message GetKPIsResponse {
  double revenue = 1;
  int64 order_count = 2;
  int64 staff_count = 3;
  int64 customer_count = 4;
  int64 low_stock_count = 5;
  int64 active_apps = 6;
}
