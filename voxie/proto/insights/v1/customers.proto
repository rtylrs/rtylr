syntax = "proto3";

package insights;

option go_package = "github.com/voxire/voxie/gen/go/insights/v1";

import "common/v1/pagination.proto";

// ── Customer Analytics ──────────────────────────────────────────────

message CustomerAnalytics {
  int32 total = 1;
  int32 new_this_period = 2;
  double retention_rate = 3;
  double avg_lifetime_value = 4;
  double churn_rate = 5;
  repeated CustomerGrowthPoint growth = 6;
}

message CustomerGrowthPoint {
  string date = 1;
  int32 new_customers = 2;
  int32 total = 3;
}

message TopCustomerEntry {
  int64 id = 1;
  string name = 2;
  double total_spent = 3;
  int32 order_count = 4;
  string last_order_at = 5;
}

message ChurnAnalysis {
  double churn_rate = 1;
  int32 churned_count = 2;
  repeated ChurnReason reasons = 3;
}

message ChurnReason {
  string reason = 1;
  int32 count = 2;
  double percentage = 3;
}

message LTVAnalysis {
  double average = 1;
  double median = 2;
  repeated LTVSegment segments = 3;
}

message LTVSegment {
  string segment = 1;
  double avg_ltv = 2;
  int32 customer_count = 3;
}

message GetCustomerAnalyticsRequest {
  string period = 1;
}

message GetCustomerAnalyticsResponse {
  CustomerAnalytics analytics = 1;
}

message GetTopCustomersRequest {
  common.PaginationRequest pagination = 1;
  string period = 2;
  string sort_by = 3; // total_spent, order_count
}

message GetTopCustomersResponse {
  repeated TopCustomerEntry customers = 1;
  common.PaginationResponse pagination = 2;
}

message GetChurnAnalysisRequest {
  string period = 1;
}

message GetChurnAnalysisResponse {
  ChurnAnalysis analysis = 1;
}

message GetLTVAnalysisRequest {}

message GetLTVAnalysisResponse {
  LTVAnalysis analysis = 1;
}
