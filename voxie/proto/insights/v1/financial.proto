syntax = "proto3";

package insights.v1;

option go_package = "github.com/voxire/voxie/gen/go/insights/v1";

// ── Financial Analytics ─────────────────────────────────────────────

message ExpenseAnalytics {
  double total = 1;
  double change = 2;
  repeated ExpenseByCategory by_category = 3;
  repeated ExpensePoint trend = 4;
}

message ExpenseByCategory {
  string category = 1;
  double amount = 2;
  double percentage = 3;
  double budget = 4;
  double utilization = 5;
}

message ExpensePoint {
  string date = 1;
  double amount = 2;
}

message InvoiceAgingBucket {
  string bucket = 1; // current, 1-30, 31-60, 61-90, 90+
  int32 count = 2;
  double amount = 3;
}

message InvoiceAging {
  double total_outstanding = 1;
  repeated InvoiceAgingBucket buckets = 2;
}

message CashFlowAnalytics {
  double inflows = 1;
  double outflows = 2;
  double net = 3;
  repeated CashFlowPoint trend = 4;
}

message CashFlowPoint {
  string date = 1;
  double inflow = 2;
  double outflow = 3;
  double net = 4;
}

message GetExpenseAnalyticsRequest {
  string period = 1;
}

message GetExpenseAnalyticsResponse {
  ExpenseAnalytics analytics = 1;
}

message GetInvoiceAgingRequest {}

message GetInvoiceAgingResponse {
  InvoiceAging aging = 1;
}

message GetCashFlowAnalyticsRequest {
  string period = 1;
}

message GetCashFlowAnalyticsResponse {
  CashFlowAnalytics analytics = 1;
}
