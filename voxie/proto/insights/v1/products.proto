syntax = "proto3";

package insights.v1;

option go_package = "github.com/voxire/voxie/gen/go/insights/v1";

import "common/v1/pagination.proto";

// ── Product Analytics ───────────────────────────────────────────────

message BestSeller {
  int64 product_id = 1;
  string name = 2;
  int32 units_sold = 3;
  double revenue = 4;
  string category = 5;
}

message SlowMover {
  int64 product_id = 1;
  string name = 2;
  int32 units_sold = 3;
  int32 days_in_stock = 4;
  double stock_value = 5;
}

message ProductMargin {
  int64 product_id = 1;
  string name = 2;
  double revenue = 3;
  double cost = 4;
  double margin = 5;
  double margin_percentage = 6;
}

message CategoryPerformance {
  string category = 1;
  double revenue = 2;
  int32 units_sold = 3;
  double avg_margin = 4;
  int32 product_count = 5;
}

message GetBestSellersRequest {
  common.v1.PaginationRequest pagination = 1;
  string period = 2;
}

message GetBestSellersResponse {
  repeated BestSeller products = 1;
  common.v1.PaginationResponse pagination = 2;
}

message GetSlowMoversRequest {
  common.v1.PaginationRequest pagination = 1;
}

message GetSlowMoversResponse {
  repeated SlowMover products = 1;
  common.v1.PaginationResponse pagination = 2;
}

message GetProductMarginsRequest {
  common.v1.PaginationRequest pagination = 1;
  string period = 2;
}

message GetProductMarginsResponse {
  repeated ProductMargin products = 1;
  common.v1.PaginationResponse pagination = 2;
}

message GetCategoryPerformanceRequest {
  string period = 1;
}

message GetCategoryPerformanceResponse {
  repeated CategoryPerformance categories = 1;
}
