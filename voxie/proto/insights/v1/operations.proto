syntax = "proto3";

package insights.v1;

option go_package = "github.com/voxire/voxie/gen/go/insights/v1";

// ── Operations Analytics ────────────────────────────────────────────

message UtilizationMetrics {
  double avg_utilization = 1;
  int32 total_staff = 2;
  int32 active_today = 3;
  double total_hours = 4;
  double overtime_hours = 5;
  repeated StaffUtilization by_staff = 6;
}

message StaffUtilization {
  int64 staff_id = 1;
  string name = 2;
  double hours_worked = 3;
  double hours_scheduled = 4;
  double utilization = 5;
}

message ShiftMetrics {
  int32 total_shifts = 1;
  int32 covered = 2;
  int32 missed = 3;
  double coverage_rate = 4;
  repeated ShiftsByDay by_day = 5;
}

message ShiftsByDay {
  string day = 1;
  int32 scheduled = 2;
  int32 completed = 3;
}

message TimeOffMetrics {
  int32 total_requests = 1;
  int32 approved = 2;
  int32 pending = 3;
  int32 rejected = 4;
  repeated TimeOffByType by_type = 5;
}

message TimeOffByType {
  string type = 1;
  int32 days = 2;
  int32 requests = 3;
}

message HeadcountMetrics {
  int32 current = 1;
  int32 hired_this_period = 2;
  int32 departed_this_period = 3;
  double turnover_rate = 4;
  repeated HeadcountPoint trend = 5;
}

message HeadcountPoint {
  string date = 1;
  int32 count = 2;
}

message GetUtilizationRequest {
  string period = 1;
}

message GetUtilizationResponse {
  UtilizationMetrics metrics = 1;
}

message GetShiftMetricsRequest {
  string period = 1;
}

message GetShiftMetricsResponse {
  ShiftMetrics metrics = 1;
}

message GetTimeOffMetricsRequest {
  string period = 1;
}

message GetTimeOffMetricsResponse {
  TimeOffMetrics metrics = 1;
}

message GetHeadcountMetricsRequest {
  string period = 1;
}

message GetHeadcountMetricsResponse {
  HeadcountMetrics metrics = 1;
}
