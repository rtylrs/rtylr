syntax = "proto3";

package insights.dashboard.v1;

import "insights/dashboard/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/insights/dashboard/v1";

message GetWorkloadRequest {}

message GetWorkloadResponse {
  // workload is the workload value for this contract.
  repeated WorkloadEntry workload = 1;
}
