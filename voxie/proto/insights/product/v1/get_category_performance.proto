syntax = "proto3";

package insights.product.v1;

import "insights/product/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/insights/product/v1";

message GetCategoryPerformanceRequest {
  // period is the period value for this contract.
  string period = 1;
}

message GetCategoryPerformanceResponse {
  // categories is the categories value for this contract.
  repeated CategoryPerformance categories = 1;
}
