syntax = "proto3";

package insights.product.v1;

import "insights/product/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/insights/product/v1";

message GetSlowMoversRequest {
  // days is the trailing sales window used to detect slow movers.
  int32 days = 1;
}

message GetSlowMoversResponse {
  // products is the products value for this contract.
  repeated SlowMover products = 1;
}
