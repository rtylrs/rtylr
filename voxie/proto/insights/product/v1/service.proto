syntax = "proto3";

package insights.product.v1;

import "insights/product/v1/get_best_sellers.proto";
import "insights/product/v1/get_category_performance.proto";
import "insights/product/v1/get_product_margins.proto";
import "insights/product/v1/get_slow_movers.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/insights/product/v1";

// ProductService defines insights product analytics endpoints.
service ProductService {
  option (onekit.http.service_config) = {base_path: "/api/insights/product/v1"};

  // GetBestSellers returns top-selling products.
  rpc GetBestSellers(GetBestSellersRequest) returns (GetBestSellersResponse) {
    option (onekit.http.config) = {
      path: "/best-sellers"
      method: HTTP_METHOD_GET
    };
  }

  // GetCategoryPerformance returns performance by category.
  rpc GetCategoryPerformance(GetCategoryPerformanceRequest) returns (GetCategoryPerformanceResponse) {
    option (onekit.http.config) = {
      path: "/categories"
      method: HTTP_METHOD_GET
    };
  }

  // GetProductMargins returns product margin analysis.
  rpc GetProductMargins(GetProductMarginsRequest) returns (GetProductMarginsResponse) {
    option (onekit.http.config) = {
      path: "/margins"
      method: HTTP_METHOD_GET
    };
  }

  // GetSlowMovers returns slow-moving products.
  rpc GetSlowMovers(GetSlowMoversRequest) returns (GetSlowMoversResponse) {
    option (onekit.http.config) = {
      path: "/slow-movers"
      method: HTTP_METHOD_GET
    };
  }
}
