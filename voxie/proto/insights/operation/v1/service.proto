syntax = "proto3";

package insights.operation.v1;

import "insights/operation/v1/get_headcount_metrics.proto";
import "insights/operation/v1/get_shift_metrics.proto";
import "insights/operation/v1/get_time_off_metrics.proto";
import "insights/operation/v1/get_utilization.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/insights/operation/v1";

// OperationService defines insights operations analytics endpoints.
service OperationService {
  option (onekit.http.service_config) = {base_path: "/api/insights/operation/v1"};

  // GetHeadcountMetrics returns headcount metrics for a period.
  rpc GetHeadcountMetrics(GetHeadcountMetricsRequest) returns (GetHeadcountMetricsResponse) {
    option (onekit.http.config) = {
      path: "/headcount"
      method: HTTP_METHOD_GET
    };
  }

  // GetShiftMetrics returns shift metrics for a period.
  rpc GetShiftMetrics(GetShiftMetricsRequest) returns (GetShiftMetricsResponse) {
    option (onekit.http.config) = {
      path: "/shifts"
      method: HTTP_METHOD_GET
    };
  }

  // GetTimeOffMetrics returns time-off metrics for a period.
  rpc GetTimeOffMetrics(GetTimeOffMetricsRequest) returns (GetTimeOffMetricsResponse) {
    option (onekit.http.config) = {
      path: "/time-off"
      method: HTTP_METHOD_GET
    };
  }

  // GetUtilization returns utilization metrics for a period.
  rpc GetUtilization(GetUtilizationRequest) returns (GetUtilizationResponse) {
    option (onekit.http.config) = {
      path: "/utilization"
      method: HTTP_METHOD_GET
    };
  }
}
