syntax = "proto3";

package insights.financial.v1;

import "insights/financial/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/insights/financial/v1";

message GetCashFlowAnalyticsRequest {
  // period is the period value for this contract.
  string period = 1 [(onekit.http.query).name = "period"];
}

message GetCashFlowAnalyticsResponse {
  // analytics is the analytics value for this contract.
  CashFlowAnalytics analytics = 1;
}
