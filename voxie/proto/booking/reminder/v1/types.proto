syntax = "proto3";

package booking.reminder.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/booking/reminder/v1";

message Reminder {
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  int64 owner_id = 2 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  int64 business_id = 3 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  int64 appointment_id = 4 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  string type = 5;
  string scheduled_at = 6;
  string sent_at = 7;
  string created_at = 8;
}
