syntax = "proto3";

package booking.waitlist.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/booking/waitlist/v1";

message WaitlistEntry {
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  int64 owner_id = 2 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  int64 business_id = 3 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  int64 service_id = 4 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  string customer_name = 5;
  string customer_email = 6;
  string customer_phone = 7;
  string preferred_date = 8;
  string preferred_time = 9;
  string status = 10;
  string created_at = 11;
}
