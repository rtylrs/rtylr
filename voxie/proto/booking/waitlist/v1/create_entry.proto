syntax = "proto3";

package booking.waitlist.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/booking/waitlist/v1";

message CreateEntryRequest {
  int64 service_id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  string customer_name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string customer_email = 3;
  string customer_phone = 4;
  string preferred_date = 5;
  string preferred_time = 6;
}

message CreateEntryResponse {
  int64 id = 1;
  string message = 2;
}
