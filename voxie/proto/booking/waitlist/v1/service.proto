syntax = "proto3";

package booking.waitlist.v1;

import "booking/waitlist/v1/create_entry.proto";
import "booking/waitlist/v1/list_entries.proto";
import "booking/waitlist/v1/update_entry.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/booking/waitlist/v1";

service WaitlistService {
  option (onekit.http.service_config) = {base_path: "/api/booking/waitlist/v1"};

  rpc ListEntries(ListEntriesRequest) returns (ListEntriesResponse) {
    option (onekit.http.config) = {
      path: "/entries"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateEntry(CreateEntryRequest) returns (CreateEntryResponse) {
    option (onekit.http.config) = {
      path: "/entries"
      method: HTTP_METHOD_POST
      body: "*"
    };
  }

  rpc UpdateEntry(UpdateEntryRequest) returns (UpdateEntryResponse) {
    option (onekit.http.config) = {
      path: "/entries/{id}"
      method: HTTP_METHOD_PUT
      body: "*"
    };
  }
}
