syntax = "proto3";

package booking.calendar.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/booking/calendar/v1";

message CalendarAppointment {
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  int64 business_id = 2 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  int64 service_id = 3 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  string customer_name = 4;
  string start_time = 5;
  string end_time = 6;
  string status = 7;
}

message CalendarDay {
  string date = 1;
  repeated CalendarAppointment appointments = 2;
}
