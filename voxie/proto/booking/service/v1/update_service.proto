syntax = "proto3";

package booking.service.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/booking/service/v1";

message UpdateServiceRequest {
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING,
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string description = 3;
  int32 duration_minutes = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32.gt = 0
  ];
  double price = 5 [
    (buf.validate.field).double.gte = 0
  ];
  string color = 6;
  bool is_active = 7;
}

message UpdateServiceResponse {
  string message = 1;
}
