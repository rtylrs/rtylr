syntax = "proto3";

package support.customer.v1;

import "onekit/http/annotations.proto";
import "support/customer/v1/get_customer.proto";
import "support/customer/v1/list_customers.proto";

option go_package = "github.com/voxire/voxie/gen/go/support/customer/v1";

service CustomerService {
  option (onekit.http.service_config) = {base_path: "/api/support/customer/v1"};

  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse) {
    option (onekit.http.config) = {
      path: "/customers"
      method: HTTP_METHOD_GET
    };
  }

  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse) {
    option (onekit.http.config) = {
      path: "/customers/{id}"
      method: HTTP_METHOD_GET
    };
  }
}
