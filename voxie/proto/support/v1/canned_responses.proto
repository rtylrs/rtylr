syntax = "proto3";

package support;

option go_package = "github.com/voxire/voxie/gen/go/support/v1";

import "common/v1/pagination.proto";

// ── Canned Responses ────────────────────────────────────────────────

message CannedResponse {
  int64 id = 1;
  string title = 2;
  string body = 3;
  string category = 4;
  string shortcut = 5; // e.g. /greet, /refund
  int32 usage_count = 6;
  string created_at = 7;
  string updated_at = 8;
}

message ListCannedResponsesRequest {
  common.PaginationRequest pagination = 1;
  string category = 2;
  string search = 3;
}

message ListCannedResponsesResponse {
  repeated CannedResponse responses = 1;
  common.PaginationResponse pagination = 2;
}

message GetCannedResponseRequest {
  int64 id = 1;
}

message GetCannedResponseResponse {
  CannedResponse response = 1;
}

message CreateCannedResponseRequest {
  string title = 1;
  string body = 2;
  string category = 3;
  string shortcut = 4;
}

message CreateCannedResponseResponse {
  CannedResponse response = 1;
}

message UpdateCannedResponseRequest {
  int64 id = 1;
  string title = 2;
  string body = 3;
  string category = 4;
  string shortcut = 5;
}

message UpdateCannedResponseResponse {
  CannedResponse response = 1;
}

message DeleteCannedResponseRequest {
  int64 id = 1;
}

message DeleteCannedResponseResponse {
  bool success = 1;
}
