syntax = "proto3";

package support;

option go_package = "github.com/voxire/voxie/gen/go/support/v1";

// ── Canned Responses ────────────────────────────────────────────────

message CannedResponse {
  int64 id = 1;
  int64 business_id = 2;
  string name = 3;
  string body = 4;
  string category = 5;
  string shortcut = 6;
  string created_at = 7;
}

message ListCannedResponsesRequest {}

message ListCannedResponsesResponse {
  repeated CannedResponse canned_responses = 1;
}

message CreateCannedResponseRequest {
  string name = 1;
  string body = 2;
  string category = 3;
  string shortcut = 4;
}

message CreateCannedResponseResponse {
  int64 canned_response_id = 1;
  string message = 2;
}

message UpdateCannedResponseRequest {
  int64 id = 1;
  string name = 2;
  string body = 3;
  string category = 4;
  string shortcut = 5;
}

message UpdateCannedResponseResponse {
  string message = 1;
}

message DeleteCannedResponseRequest {
  int64 id = 1;
}

message DeleteCannedResponseResponse {
  string message = 1;
}
