syntax = "proto3";

package support;

option go_package = "github.com/voxire/voxie/gen/go/support/v1";

// ── Knowledge Base ──────────────────────────────────────────────────

message Article {
  int64 id = 1;
  int64 business_id = 2;
  string title = 3;
  string slug = 4;
  string body = 5;
  string category = 6;
  bool is_published = 7;
  int64 views = 8;
  string created_at = 9;
  string updated_at = 10;
}

message ListArticlesRequest {
  int64 page = 1;
  int64 page_size = 2;
}

message ListArticlesResponse {
  repeated Article articles = 1;
  int64 total = 2;
  int64 page = 3;
  int64 page_size = 4;
}

message CreateArticleRequest {
  string title = 1;
  string slug = 2;
  string body = 3;
  string category = 4;
  bool is_published = 5;
}

message CreateArticleResponse {
  int64 article_id = 1;
  string message = 2;
}

message UpdateArticleRequest {
  int64 id = 1;
  string title = 2;
  string slug = 3;
  string body = 4;
  string category = 5;
  bool is_published = 6;
}

message UpdateArticleResponse {
  string message = 1;
}

message DeleteArticleRequest {
  int64 id = 1;
}

message DeleteArticleResponse {
  string message = 1;
}
