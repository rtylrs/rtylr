syntax = "proto3";

package support;

option go_package = "github.com/voxire/voxie/gen/go/support/v1";

// ── Inbox / Conversations ──────────────────────────────────────────

message InboxItem {
  int64 ticket_id = 1;
  string customer_name = 2;
  string customer_email = 3;
  string subject = 4;
  string status = 5;
  string priority = 6;
  string channel = 7;
  string last_message = 8;
  string last_message_at = 9;
  int32 message_count = 10;
}

message ListInboxRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListInboxResponse {
  repeated InboxItem inbox = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetUnreadCountRequest {}

message GetUnreadCountResponse {
  int32 count = 1;
}
