syntax = "proto3";

package support;

option go_package = "github.com/voxire/voxie/gen/go/support/v1";

import "common/v1/pagination.proto";

// ── Conversations ───────────────────────────────────────────────────

message Conversation {
  int64 id = 1;
  string channel = 2; // live_chat, email, whatsapp
  string status = 3; // active, waiting, closed
  int64 customer_id = 4;
  string customer_name = 5;
  int64 assignee_id = 6;
  string assignee_name = 7;
  string last_message = 8;
  string last_message_at = 9;
  int32 unread_count = 10;
  string created_at = 11;
}

message ListConversationsRequest {
  common.PaginationRequest pagination = 1;
  string status = 2;
  string channel = 3;
  int64 assignee_id = 4;
}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
  common.PaginationResponse pagination = 2;
}

message GetConversationRequest {
  int64 id = 1;
}

message GetConversationResponse {
  Conversation conversation = 1;
}

message AssignConversationRequest {
  int64 id = 1;
  int64 assignee_id = 2;
}

message AssignConversationResponse {
  Conversation conversation = 1;
}
