syntax = "proto3";

package support;

option go_package = "github.com/voxire/voxie/gen/go/support/v1";

// ── Tickets ─────────────────────────────────────────────────────────

message Ticket {
  int64 id = 1;
  int64 business_id = 2;
  string customer_name = 3;
  string customer_email = 4;
  string subject = 5;
  string status = 6;
  string priority = 7;
  optional int64 assigned_to = 8;
  string channel = 9;
  string created_at = 10;
  string updated_at = 11;
}

message TicketMessage {
  int64 id = 1;
  int64 ticket_id = 2;
  string sender_type = 3;
  string sender_name = 4;
  string body = 5;
  bool is_internal = 6;
  string created_at = 7;
}

message ListTicketsRequest {
  string status = 1;
  int64 page = 2;
  int64 page_size = 3;
}

message ListTicketsResponse {
  repeated Ticket tickets = 1;
  int64 total = 2;
  int64 page = 3;
  int64 page_size = 4;
}

message GetTicketRequest {
  int64 id = 1;
}

message GetTicketResponse {
  Ticket ticket = 1;
  repeated TicketMessage messages = 2;
}

message CreateTicketRequest {
  string customer_name = 1;
  string customer_email = 2;
  string subject = 3;
  string priority = 4;
  string channel = 5;
  optional int64 assigned_to = 6;
  string body = 7;
  string sender_name = 8;
}

message CreateTicketResponse {
  int64 ticket_id = 1;
  string message = 2;
}

message UpdateTicketRequest {
  int64 id = 1;
  string subject = 2;
  string status = 3;
  string priority = 4;
  optional int64 assigned_to = 5;
  string channel = 6;
}

message UpdateTicketResponse {
  string message = 1;
}
