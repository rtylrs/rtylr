syntax = "proto3";

package support;

option go_package = "github.com/voxire/voxie/gen/go/support/v1";

// ── Support Settings ────────────────────────────────────────────────

message SupportSettings {
  int64 id = 1;
  int64 business_id = 2;
  bool auto_assign = 3;
  int32 sla_hours = 4;
  string business_hours = 5;
  string notification_email = 6;
  string created_at = 7;
  string updated_at = 8;
}

message GetSupportSettingsRequest {}

message GetSupportSettingsResponse {
  SupportSettings settings = 1;
}

message UpdateSupportSettingsRequest {
  bool auto_assign = 1;
  int32 sla_hours = 2;
  string business_hours = 3;
  string notification_email = 4;
}

message UpdateSupportSettingsResponse {
  string message = 1;
}
