syntax = "proto3";

package support.knowledge.v1;

import "onekit/http/annotations.proto";
import "support/knowledge/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/support/knowledge/v1";

message ListArticlesRequest {
  int32 page = 1 [
    (onekit.http.query).name = "page"
  ];
  int32 page_size = 2 [
    (onekit.http.query).name = "page_size"
  ];
}

message ListArticlesResponse {
  repeated Article articles = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}
