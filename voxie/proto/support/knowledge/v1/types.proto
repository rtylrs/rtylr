syntax = "proto3";

package support.knowledge.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/support/knowledge/v1";

message Article {
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  int64 business_id = 2 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  string title = 3;
  string slug = 4;
  string body = 5;
  string category = 6;
  bool is_published = 7;
  int32 views = 8;
  string created_at = 9;
  string updated_at = 10;
}
