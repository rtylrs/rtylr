syntax = "proto3";

package support.knowledge.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/support/knowledge/v1";

message CreateArticleRequest {
  string title = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string slug = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string body = 3;
  string category = 4;
  bool is_published = 5;
}

message CreateArticleResponse {
  int64 article_id = 1;
  string message = 2;
}
