syntax = "proto3";

package store;

option go_package = "github.com/voxire/voxie/gen/go/store/v1";

// ── PaymentMethod ─────────────────────────────────────────────────

message PaymentMethod {
  int64 id = 1;
  int64 owner_id = 2;
  string provider = 3;
  string config = 4;
  bool is_active = 5;
  string created_at = 6;
}

// ── List ──────────────────────────────────────────────────────────

message ListPaymentMethodsRequest {}

message ListPaymentMethodsResponse {
  repeated PaymentMethod methods = 1;
}

// ── Create ────────────────────────────────────────────────────────

message CreatePaymentMethodRequest {
  string provider = 1;
  string config = 2;
  bool is_active = 3;
}

message CreatePaymentMethodResponse {
  int64 id = 1;
  string message = 2;
}

// ── Update ────────────────────────────────────────────────────────

message UpdatePaymentMethodRequest {
  int64 id = 1;
  string provider = 2;
  string config = 3;
  bool is_active = 4;
}

message UpdatePaymentMethodResponse {
  string message = 1;
}
