syntax = "proto3";

package store;

option go_package = "github.com/voxire/voxie/gen/go/store/v1";

// ── PaymentMethod ──────────────────────────────────────────────────

message PaymentMethod {
  int64 id = 1;
  int64 store_id = 2;
  string provider = 3; // stripe, paypal, square, cash_on_delivery
  string display_name = 4;
  bool is_enabled = 5;
  bool is_default = 6;
  bool test_mode = 7;
  map<string, string> config = 8;
  string created_at = 9;
  string updated_at = 10;
}

// ── List ───────────────────────────────────────────────────────────

message ListPaymentMethodsRequest {}

message ListPaymentMethodsResponse {
  repeated PaymentMethod methods = 1;
}

// ── Update ─────────────────────────────────────────────────────────

message UpdatePaymentMethodRequest {
  int64 id = 1;
  string display_name = 2;
  bool is_enabled = 3;
  bool is_default = 4;
  bool test_mode = 5;
  map<string, string> config = 6;
}

message UpdatePaymentMethodResponse {
  PaymentMethod method = 1;
}
