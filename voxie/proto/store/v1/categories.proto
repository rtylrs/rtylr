syntax = "proto3";

package store;

option go_package = "github.com/voxire/voxie/gen/go/store/v1";

// ── StoreCategory ─────────────────────────────────────────────────

message StoreCategory {
  int64 id = 1;
  int64 owner_id = 2;
  string name = 3;
  string slug = 4;
  string description = 5;
  string image_url = 6;
  int64 parent_id = 7;
  int32 sort_order = 8;
  string created_at = 9;
}

// ── List ──────────────────────────────────────────────────────────

message ListStoreCategoriesRequest {}

message ListStoreCategoriesResponse {
  repeated StoreCategory categories = 1;
}

// ── Create ────────────────────────────────────────────────────────

message CreateStoreCategoryRequest {
  string name = 1;
  string slug = 2;
  string description = 3;
  string image_url = 4;
  int64 parent_id = 5;
  int32 sort_order = 6;
}

message CreateStoreCategoryResponse {
  int64 id = 1;
  string message = 2;
}

// ── Update ────────────────────────────────────────────────────────

message UpdateStoreCategoryRequest {
  int64 id = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  string image_url = 5;
  int64 parent_id = 6;
  int32 sort_order = 7;
}

message UpdateStoreCategoryResponse {
  string message = 1;
}

// ── Delete ────────────────────────────────────────────────────────

message DeleteStoreCategoryRequest {
  int64 id = 1;
}

message DeleteStoreCategoryResponse {
  string message = 1;
}
