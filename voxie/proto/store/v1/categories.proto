syntax = "proto3";

package store;

option go_package = "github.com/voxire/voxie/gen/go/store/v1";

// ── Category ───────────────────────────────────────────────────────

message Category {
  int64 id = 1;
  int64 store_id = 2;
  string name = 3;
  string slug = 4;
  string description = 5;
  int64 parent_id = 6;
  string image_url = 7;
  int32 sort_order = 8;
  int32 product_count = 9;
  bool is_active = 10;
  string created_at = 11;
  string updated_at = 12;
}

// ── List ───────────────────────────────────────────────────────────

message ListCategoriesRequest {
  bool include_inactive = 1;
}

message ListCategoriesResponse {
  repeated Category categories = 1;
}

// ── Get ────────────────────────────────────────────────────────────

message GetCategoryRequest {
  int64 id = 1;
}

message GetCategoryResponse {
  Category category = 1;
}

// ── Create ─────────────────────────────────────────────────────────

message CreateCategoryRequest {
  string name = 1;
  string description = 2;
  int64 parent_id = 3;
  string image_url = 4;
  int32 sort_order = 5;
}

message CreateCategoryResponse {
  Category category = 1;
}

// ── Update ─────────────────────────────────────────────────────────

message UpdateCategoryRequest {
  int64 id = 1;
  string name = 2;
  string description = 3;
  int64 parent_id = 4;
  string image_url = 5;
  int32 sort_order = 6;
  bool is_active = 7;
}

message UpdateCategoryResponse {
  Category category = 1;
}

// ── Delete ─────────────────────────────────────────────────────────

message DeleteCategoryRequest {
  int64 id = 1;
}

message DeleteCategoryResponse {
  bool success = 1;
}
