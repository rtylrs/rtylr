syntax = "proto3";

package store;

option go_package = "github.com/voxire/voxie/gen/go/store/v1";

// ── ShippingMethod ────────────────────────────────────────────────

message ShippingMethod {
  int64 id = 1;
  int64 owner_id = 2;
  string name = 3;
  double price = 4;
  int32 estimated_days = 5;
  bool is_active = 6;
  string created_at = 7;
}

// ── List ──────────────────────────────────────────────────────────

message ListShippingMethodsRequest {}

message ListShippingMethodsResponse {
  repeated ShippingMethod methods = 1;
}

// ── Create ────────────────────────────────────────────────────────

message CreateShippingMethodRequest {
  string name = 1;
  double price = 2;
  int32 estimated_days = 3;
  bool is_active = 4;
}

message CreateShippingMethodResponse {
  int64 id = 1;
  string message = 2;
}

// ── Update ────────────────────────────────────────────────────────

message UpdateShippingMethodRequest {
  int64 id = 1;
  string name = 2;
  double price = 3;
  int32 estimated_days = 4;
  bool is_active = 5;
}

message UpdateShippingMethodResponse {
  string message = 1;
}

// ── Delete ────────────────────────────────────────────────────────

message DeleteShippingMethodRequest {
  int64 id = 1;
}

message DeleteShippingMethodResponse {
  string message = 1;
}
