syntax = "proto3";

package store;

option go_package = "github.com/voxire/voxie/gen/go/store/v1";

// ── StoreProduct ──────────────────────────────────────────────────

message StoreProduct {
  int64 id = 1;
  int64 owner_id = 2;
  int64 product_id = 3;
  string title = 4;
  string slug = 5;
  string description = 6;
  string images = 7;
  double price = 8;
  double compare_at_price = 9;
  bool is_published = 10;
  int32 sort_order = 11;
  string created_at = 12;
  string updated_at = 13;
}

// ── List ──────────────────────────────────────────────────────────

message ListStoreProductsRequest {}

message ListStoreProductsResponse {
  repeated StoreProduct products = 1;
}

// ── Create ────────────────────────────────────────────────────────

message CreateStoreProductRequest {
  int64 product_id = 1;
  string title = 2;
  string slug = 3;
  string description = 4;
  string images = 5;
  double price = 6;
  double compare_at_price = 7;
  bool is_published = 8;
  int32 sort_order = 9;
}

message CreateStoreProductResponse {
  int64 id = 1;
  string message = 2;
}

// ── Update ────────────────────────────────────────────────────────

message UpdateStoreProductRequest {
  int64 id = 1;
  int64 product_id = 2;
  string title = 3;
  string slug = 4;
  string description = 5;
  string images = 6;
  double price = 7;
  double compare_at_price = 8;
  bool is_published = 9;
  int32 sort_order = 10;
}

message UpdateStoreProductResponse {
  string message = 1;
}

// ── Delete ────────────────────────────────────────────────────────

message DeleteStoreProductRequest {
  int64 id = 1;
}

message DeleteStoreProductResponse {
  string message = 1;
}
