syntax = "proto3";

package store;

option go_package = "github.com/voxire/voxie/gen/go/store/v1";

// ── Checkout ──────────────────────────────────────────────────────

message CreateCheckoutRequest {
  string session_id = 1;
  string customer_email = 2;
  string items = 3;
  double subtotal = 4;
  double tax = 5;
  double total = 6;
}

message CreateCheckoutResponse {
  int64 id = 1;
  string message = 2;
}

message CompleteCheckoutRequest {
  int64 id = 1;
}

message CompleteCheckoutResponse {
  string message = 1;
}
