syntax = "proto3";

package store;

option go_package = "github.com/voxire/voxie/gen/go/store/v1";

// ── StoreOrder ────────────────────────────────────────────────────

message StoreOrder {
  int64 id = 1;
  int64 owner_id = 2;
  string customer_email = 3;
  string customer_name = 4;
  string customer_phone = 5;
  string status = 6;
  double subtotal = 7;
  double tax = 8;
  double shipping_cost = 9;
  double total = 10;
  string shipping_address = 11;
  string notes = 12;
  string created_at = 13;
  string updated_at = 14;
}

message StoreOrderItem {
  int64 id = 1;
  int64 order_id = 2;
  int64 product_id = 3;
  string name = 4;
  int32 quantity = 5;
  double price = 6;
  double total = 7;
  string created_at = 8;
}

// ── List ──────────────────────────────────────────────────────────

message ListStoreOrdersRequest {}

message ListStoreOrdersResponse {
  repeated StoreOrder orders = 1;
}

// ── Detail ────────────────────────────────────────────────────────

message GetStoreOrderDetailRequest {
  int64 id = 1;
}

message GetStoreOrderDetailResponse {
  StoreOrder order = 1;
  repeated StoreOrderItem items = 2;
}

// ── Create ────────────────────────────────────────────────────────

message OrderItemInput {
  int64 product_id = 1;
  string name = 2;
  int32 quantity = 3;
  double price = 4;
  double total = 5;
}

message CreateStoreOrderRequest {
  string customer_email = 1;
  string customer_name = 2;
  string customer_phone = 3;
  string status = 4;
  double subtotal = 5;
  double tax = 6;
  double shipping_cost = 7;
  double total = 8;
  string shipping_address = 9;
  string notes = 10;
  repeated OrderItemInput items = 11;
}

message CreateStoreOrderResponse {
  int64 id = 1;
  string message = 2;
}

// ── Update ────────────────────────────────────────────────────────

message UpdateStoreOrderRequest {
  int64 id = 1;
  string customer_email = 2;
  string customer_name = 3;
  string customer_phone = 4;
  string status = 5;
  double subtotal = 6;
  double tax = 7;
  double shipping_cost = 8;
  double total = 9;
  string shipping_address = 10;
  string notes = 11;
}

message UpdateStoreOrderResponse {
  string message = 1;
}
