syntax = "proto3";

package store;

option go_package = "github.com/voxire/voxie/gen/go/store/v1";

// ── Theme ─────────────────────────────────────────────────────────

message Theme {
  int64 id = 1;
  int64 owner_id = 2;
  string name = 3;
  string primary_color = 4;
  string font = 5;
  string header_style = 6;
  string footer_style = 7;
  string custom_css = 8;
  string created_at = 9;
  string updated_at = 10;
}

// ── List ──────────────────────────────────────────────────────────

message ListThemesRequest {}

message ListThemesResponse {
  repeated Theme themes = 1;
}

// ── Create ────────────────────────────────────────────────────────

message CreateThemeRequest {
  string name = 1;
  string primary_color = 2;
  string font = 3;
  string header_style = 4;
  string footer_style = 5;
  string custom_css = 6;
}

message CreateThemeResponse {
  int64 id = 1;
  string message = 2;
}

// ── Update ────────────────────────────────────────────────────────

message UpdateThemeRequest {
  int64 id = 1;
  string name = 2;
  string primary_color = 3;
  string font = 4;
  string header_style = 5;
  string footer_style = 6;
  string custom_css = 7;
}

message UpdateThemeResponse {
  string message = 1;
}
