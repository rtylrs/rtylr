syntax = "proto3";

package common.oauth.v1;

import "common/oauth/v1/issue.proto";
import "common/oauth/v1/me.proto";
import "common/oauth/v1/revoke.proto";
import "common/oauth/v1/token.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/common/oauth/v1";

// OauthService defines OAuth authorization endpoints.
service OauthService {
  option (onekit.http.service_config) = {base_path: "/api/common/oauth/v1"};

  // Issue starts the OAuth authorization redirect flow.
  rpc Issue(IssueRequest) returns (IssueResponse) {
    option (onekit.http.config) = {
      path: "/issue"
      method: HTTP_METHOD_POST
    };
  }

  rpc Token(TokenRequest) returns (TokenResponse) {
    option (onekit.http.config) = {
      path: "/token"
      method: HTTP_METHOD_POST
    };
  }

  rpc Revoke(RevokeRequest) returns (RevokeResponse) {
    option (onekit.http.config) = {
      path: "/revoke"
      method: HTTP_METHOD_POST
    };
  }

  rpc Me(MeRequest) returns (MeResponse) {
    option (onekit.http.config) = {
      path: "/me"
      method: HTTP_METHOD_GET
    };
  }
}
