syntax = "proto3";

package common.errors.v1;

option go_package = "github.com/voxire/voxie/gen/go/common/errors/v1";

// Standard API error response
message ErrorResponse {
  // code is the code value for this contract.
  int32 code = 1;
  // message is a human-readable result message.
  string message = 2;
  // error_code is the error code value for this contract.
  // Machine-readable: UNAUTHORIZED, VALIDATION, etc.
  string error_code = 3;
  // details is the details value for this contract.
  // Field-level validation errors
  map<string, string> details = 4;
}
