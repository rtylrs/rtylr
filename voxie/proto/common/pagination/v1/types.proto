syntax = "proto3";

package common.pagination.v1;

option go_package = "github.com/voxire/voxie/gen/go/common/pagination/v1";

// Standard timestamp wrapper
message Timestamp {
  // iso is the iso value for this contract.
  // ISO 8601 string
  string iso = 1;
  // unix is the unix value for this contract.
  // Unix timestamp in seconds
  int64 unix = 2;
}
