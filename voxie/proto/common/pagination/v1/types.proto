syntax = "proto3";

package common.pagination.v1;

import "google/protobuf/timestamp.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/common/pagination/v1";

// Standard timestamp wrapper for explicit RFC 3339 JSON encoding.
message Timestamp {
  google.protobuf.Timestamp value = 1 [
    (onekit.http.timestamp_format) = TIMESTAMP_FORMAT_RFC3339
  ];
}
