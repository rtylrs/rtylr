syntax = "proto3";

package flow.workspace.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/flow/workspace/v1";

message UpdateWorkspaceMemberRoleRequest {
  // workspace_id is the workspace id value for this contract.
  int64 workspace_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // user_id identifies the user associated with this request.
  int64 user_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // role is the role value for this contract.
  string role = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message UpdateWorkspaceMemberRoleResponse {
  // message is a human-readable result message.
  string message = 1;
}
