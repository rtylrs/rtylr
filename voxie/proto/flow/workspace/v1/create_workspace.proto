syntax = "proto3";

package flow.workspace.v1;

import "buf/validate/validate.proto";
import "flow/workspace/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/flow/workspace/v1";

message CreateWorkspaceRequest {
  // name is the name value for this contract.
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // description is the description value for this contract.
  string description = 2;
  // icon is the icon value for this contract.
  string icon = 3 [(buf.validate.field).string.min_len = 1];
  // color is the color value for this contract.
  string color = 4 [(buf.validate.field).string.min_len = 1];
}

message CreateWorkspaceResponse {
  // workspace is the workspace value for this contract.
  Workspace workspace = 1;
}
