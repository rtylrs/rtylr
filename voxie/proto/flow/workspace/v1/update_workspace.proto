syntax = "proto3";

package flow.workspace.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/flow/workspace/v1";

message UpdateWorkspaceRequest {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // name is the name value for this contract.
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // description is the description value for this contract.
  string description = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // icon is the icon value for this contract.
  string icon = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // color is the color value for this contract.
  string color = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message UpdateWorkspaceResponse {
  // message is a human-readable result message.
  string message = 1;
}
