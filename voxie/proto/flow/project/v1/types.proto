syntax = "proto3";

package flow.project.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/flow/project/v1";

// ── Projects ────────────────────────────────────────────────────────

message Project {
  // id is the unique identifier for the resource.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // workspace_id is the workspace id value for this contract.
  int64 workspace_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // owner_id identifies the tenant that owns the resource.
  int64 owner_id = 3 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // name is the name value for this contract.
  string name = 4;
  // description is the description value for this contract.
  string description = 5;
  // icon is the icon value for this contract.
  string icon = 6;
  // color is the color value for this contract.
  string color = 7;
  // status is the current lifecycle state.
  string status = 8;
  // start_date is the start date value for this contract.
  string start_date = 9;
  // due_date is the due date value for this contract.
  string due_date = 10;
  // created_by is the created by value for this contract.
  int64 created_by = 11;
  // created_at is when the record was created.
  string created_at = 12;
  // updated_at is when the record was last updated.
  string updated_at = 13;

  // ── Display projections — populated by list/detail responses.
  // Ignored on writes.

  // Total task count for this project.
  int32 task_count = 14;
  // Number of tasks with status="done".
  int32 completed_count = 15;
  // Count of project members, for the "+N" avatar stack.
  int32 member_count = 16;
  // Short project code used to build Task.identifier (e.g. "FLW" → "FLW-42").
  string code = 17;
}

message ProjectColumn {
  // id is the unique identifier for the column.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // project_id is the project id value for this contract.
  int64 project_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // workspace_id is the workspace id value for this contract.
  int64 workspace_id = 3 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // name is the column name.
  string name = 4;
  // color is the column color.
  string color = 5;
  // sort_order is the column sort order.
  int32 sort_order = 6;
  // created_at is when the record was created.
  string created_at = 7;
  // updated_at is when the record was last updated.
  string updated_at = 8;
}

message ProjectMember {
  // id is the unique identifier for the membership record.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // project_id is the project id value for this contract.
  int64 project_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // user_id identifies the user associated with this request.
  int64 user_id = 3 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // name is the member display name.
  string name = 4;
  // email is the member email address.
  string email = 5;
  // role is the role value for this contract.
  string role = 6;
  // added_by is the user id of the inviter, if any.
  int64 added_by = 7 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // added_at is when the member joined the project.
  string added_at = 8;
}
