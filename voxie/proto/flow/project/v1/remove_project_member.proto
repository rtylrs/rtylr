syntax = "proto3";

package flow.project.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/flow/project/v1";

message RemoveProjectMemberRequest {
  // project_id is the project id value for this contract.
  int64 project_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.query).name = "project_id",
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // user_id identifies the user associated with this request.
  int64 user_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.query).name = "user_id",
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}

message RemoveProjectMemberResponse {
  // message is a human-readable result message.
  string message = 1;
}
