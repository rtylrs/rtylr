syntax = "proto3";

package flow.project.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/flow/project/v1";

message UpdateProjectColumnRequest {
  // id is the column identifier.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // name is the column name.
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // color is the column color.
  string color = 3;
  // sort_order is the column sort order.
  int32 sort_order = 4;
}

message UpdateProjectColumnResponse {
  // message is a human-readable result message.
  string message = 1;
}
