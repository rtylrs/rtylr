syntax = "proto3";

package flow.project.v1;

import "flow/project/v1/add_project_member.proto";
import "flow/project/v1/create_project.proto";
import "flow/project/v1/create_project_column.proto";
import "flow/project/v1/delete_project.proto";
import "flow/project/v1/delete_project_column.proto";
import "flow/project/v1/invite_project_member.proto";
import "flow/project/v1/list_project_columns.proto";
import "flow/project/v1/list_project_members.proto";
import "flow/project/v1/list_projects.proto";
import "flow/project/v1/move_project.proto";
import "flow/project/v1/move_task_to_column.proto";
import "flow/project/v1/remove_project_member.proto";
import "flow/project/v1/transfer_project_ownership.proto";
import "flow/project/v1/update_project.proto";
import "flow/project/v1/update_project_column.proto";
import "flow/project/v1/update_project_member_role.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/flow/project/v1";

service ProjectService {
  option (onekit.http.service_config) = {base_path: "/api/flow/project/v1"};

  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (onekit.http.config) = {
      path: "/projects"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse) {
    option (onekit.http.config) = {
      path: "/projects"
      method: HTTP_METHOD_POST
    };
  }

  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse) {
    option (onekit.http.config) = {
      path: "/projects/{id}"
      method: HTTP_METHOD_PUT
      body: "body"
    };
  }

  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse) {
    option (onekit.http.config) = {
      path: "/projects/{id}"
      method: HTTP_METHOD_DELETE
    };
  }

  rpc ListProjectColumns(ListProjectColumnsRequest) returns (ListProjectColumnsResponse) {
    option (onekit.http.config) = {
      path: "/projects/columns"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateProjectColumn(CreateProjectColumnRequest) returns (CreateProjectColumnResponse) {
    option (onekit.http.config) = {
      path: "/projects/columns"
      method: HTTP_METHOD_POST
    };
  }

  rpc UpdateProjectColumn(UpdateProjectColumnRequest) returns (UpdateProjectColumnResponse) {
    option (onekit.http.config) = {
      path: "/projects/columns/{id}"
      method: HTTP_METHOD_PUT
    };
  }

  rpc DeleteProjectColumn(DeleteProjectColumnRequest) returns (DeleteProjectColumnResponse) {
    option (onekit.http.config) = {
      path: "/projects/columns/{id}"
      method: HTTP_METHOD_DELETE
    };
  }

  rpc MoveTaskToColumn(MoveTaskToColumnRequest) returns (MoveTaskToColumnResponse) {
    option (onekit.http.config) = {
      path: "/projects/columns/move"
      method: HTTP_METHOD_PUT
    };
  }

  rpc ListProjectMembers(ListProjectMembersRequest) returns (ListProjectMembersResponse) {
    option (onekit.http.config) = {
      path: "/projects/members"
      method: HTTP_METHOD_GET
    };
  }

  rpc AddProjectMember(AddProjectMemberRequest) returns (AddProjectMemberResponse) {
    option (onekit.http.config) = {
      path: "/projects/members"
      method: HTTP_METHOD_POST
    };
  }

  rpc RemoveProjectMember(RemoveProjectMemberRequest) returns (RemoveProjectMemberResponse) {
    option (onekit.http.config) = {
      path: "/projects/members"
      method: HTTP_METHOD_DELETE
    };
  }

  rpc UpdateProjectMemberRole(UpdateProjectMemberRoleRequest) returns (UpdateProjectMemberRoleResponse) {
    option (onekit.http.config) = {
      path: "/projects/members/role"
      method: HTTP_METHOD_PUT
    };
  }

  rpc InviteProjectMember(InviteProjectMemberRequest) returns (InviteProjectMemberResponse) {
    option (onekit.http.config) = {
      path: "/projects/members/invite"
      method: HTTP_METHOD_POST
    };
  }

  rpc TransferProjectOwnership(TransferProjectOwnershipRequest) returns (TransferProjectOwnershipResponse) {
    option (onekit.http.config) = {
      path: "/projects/transfer"
      method: HTTP_METHOD_PUT
    };
  }

  rpc MoveProject(MoveProjectRequest) returns (MoveProjectResponse) {
    option (onekit.http.config) = {
      path: "/projects/move"
      method: HTTP_METHOD_PUT
    };
  }
}
