syntax = "proto3";

package flow.task.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/flow/task/v1";

message UpdateTaskBody {
  // title is the title value for this contract.
  string title = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // description is the description value for this contract.
  string description = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // status is the current lifecycle state.
  string status = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // priority is the priority value for this contract.
  string priority = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // assignee_id is the assignee id value for this contract.
  optional int64 assignee_id = 5 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING, (onekit.http.nullable) = true];
  // due_date is the due date value for this contract.
  string due_date = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // start_date is the start date value for this contract.
  string start_date = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // labels is the labels value for this contract.
  repeated int64 labels = 8 [(buf.validate.field).repeated.min_items = 1];
}

message UpdateTaskRequest {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // body carries updatable task fields bound from the HTTP payload.
  UpdateTaskBody body = 2;
}

message UpdateTaskResponse {
  // message is a human-readable result message.
  string message = 1;
}
