syntax = "proto3";

package flow.task.v1;

import "buf/validate/validate.proto";
import "flow/task/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/flow/task/v1";

message GetTaskDetailRequest {
  // id is the unique identifier for the resource.
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetTaskDetailResponse {
  // task is the task value for this contract.
  Task task = 1;
  // subtasks is the subtasks value for this contract.
  repeated Task subtasks = 2;
  // comments is the comments value for this contract.
  repeated TaskComment comments = 3;
  // activity is the activity value for this contract.
  repeated TaskActivity activity = 4;
}
