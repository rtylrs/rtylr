syntax = "proto3";

package flow.task.v1;

import "buf/validate/validate.proto";
import "flow/task/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/flow/task/v1";

message AddCommentRequest {
  // task_id is the task id value for this contract.
  int64 task_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  // content is the content value for this contract.
  string content = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message AddCommentResponse {
  // comment is the comment value for this contract.
  TaskComment comment = 1;
}
