syntax = "proto3";

package flow.task.v1;

import "flow/task/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/flow/task/v1";

message ListTasksRequest {
  // project_id is the project id value for this contract.
  int64 project_id = 1;
  // status is the current lifecycle state.
  string status = 2;
  // assignee_id is the assignee id value for this contract.
  optional int64 assignee_id = 3;
  // priority is the priority value for this contract.
  string priority = 4;
}

message ListTasksResponse {
  // tasks is the tasks value for this contract.
  repeated Task tasks = 1;
}
