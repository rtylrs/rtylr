syntax = "proto3";

package flow.task.v1;

import "flow/task/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/flow/task/v1";

message GetTimeLogsRequest {
  // task_id is the task id value for this contract.
  int64 task_id = 1;
}

message GetTimeLogsResponse {
  // time_logs is the time logs value for this contract.
  repeated TimeLog time_logs = 1;
}
