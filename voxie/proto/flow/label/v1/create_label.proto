syntax = "proto3";

package flow.label.v1;

import "buf/validate/validate.proto";
import "flow/label/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/flow/label/v1";

message CreateLabelRequest {
  // workspace_id is the workspace id value for this contract.
  int64 workspace_id = 1 [(buf.validate.field).int64.gt = 0];
  // name is the name value for this contract.
  string name = 2 [(buf.validate.field).string.min_len = 1];
  // color is the color value for this contract.
  string color = 3 [(buf.validate.field).string.min_len = 1];
}

message CreateLabelResponse {
  // label is the label value for this contract.
  Label label = 1;
}
