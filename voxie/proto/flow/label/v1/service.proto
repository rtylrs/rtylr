syntax = "proto3";

package flow.label.v1;

import "flow/label/v1/create_label.proto";
import "flow/label/v1/list_labels.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/flow/label/v1";

service LabelService {
  option (onekit.http.service_config) = {base_path: "/api/flow/label/v1"};

  rpc ListLabels(ListLabelsRequest) returns (ListLabelsResponse) {
    option (onekit.http.config) = {
      path: "/labels"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateLabel(CreateLabelRequest) returns (CreateLabelResponse) {
    option (onekit.http.config) = {
      path: "/labels"
      method: HTTP_METHOD_POST
    };
  }
}
