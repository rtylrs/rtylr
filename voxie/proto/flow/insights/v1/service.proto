syntax = "proto3";
package flow.insights.v1;
import "flow/insights/v1/get_insights.proto";
import "flow/insights/v1/get_roadmap.proto";
import "flow/insights/v1/get_team_workload.proto";
import "onekit/http/annotations.proto";
option go_package = "github.com/voxire/voxie/gen/go/flow/insights/v1";
service InsightsService {
  option (onekit.http.service_config) = {base_path: "/api/flow/insights/v1"};
  rpc GetInsights(GetInsightsRequest) returns (GetInsightsResponse) {
    option (onekit.http.config) = { path: "/overview" method: HTTP_METHOD_GET };
  }
  rpc GetTeamWorkload(GetTeamWorkloadRequest) returns (GetTeamWorkloadResponse) {
    option (onekit.http.config) = { path: "/team/workload" method: HTTP_METHOD_GET };
  }
  rpc GetRoadmap(GetRoadmapRequest) returns (GetRoadmapResponse) {
    option (onekit.http.config) = { path: "/roadmap" method: HTTP_METHOD_GET };
  }
}
