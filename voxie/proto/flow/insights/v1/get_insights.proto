syntax = "proto3";
package flow.insights.v1;
import "flow/insights/v1/types.proto";
import "onekit/http/annotations.proto";
option go_package = "github.com/voxire/voxie/gen/go/flow/insights/v1";
message GetInsightsRequest {
  string workspace_id = 1 [(onekit.http.query).name = "workspace_id"];
}
message GetInsightsResponse {
  repeated VelocityPoint velocity = 1;
  repeated BurndownPoint burndown = 2;
  double cycle_time = 3;
  repeated MemberTime time_by_member = 4;
  repeated ThroughputPoint throughput = 5;
  int32 total_tasks = 6;
  int32 done_tasks = 7;
}
