syntax = "proto3";

package flow;

option go_package = "github.com/voxire/voxie/gen/go/flow/v1";

import "common/v1/pagination.proto";

// ── Workspaces ──────────────────────────────────────────────────────

message Workspace {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string color = 4;
  int32 project_count = 5;
  int32 member_count = 6;
  repeated WorkspaceMember members = 7;
  string created_at = 8;
}

message WorkspaceMember {
  int64 user_id = 1;
  string name = 2;
  string role = 3; // owner, member
  string avatar_url = 4;
}

message ListWorkspacesRequest {
  common.PaginationRequest pagination = 1;
}

message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
  common.PaginationResponse pagination = 2;
}

message GetWorkspaceRequest {
  int64 id = 1;
}

message GetWorkspaceResponse {
  Workspace workspace = 1;
}

message CreateWorkspaceRequest {
  string name = 1;
  string description = 2;
  string color = 3;
}

message CreateWorkspaceResponse {
  Workspace workspace = 1;
}

message AddWorkspaceMemberRequest {
  int64 workspace_id = 1;
  int64 user_id = 2;
  string role = 3;
}

message AddWorkspaceMemberResponse {
  bool success = 1;
}
