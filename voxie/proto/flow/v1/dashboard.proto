syntax = "proto3";

package flow.v1;

option go_package = "github.com/voxire/voxie/gen/go/flow/v1";

import "flow/v1/tasks.proto";

// ── Flow Dashboard ──────────────────────────────────────────────────

message GetFlowDashboardRequest {
  int64 workspace_id = 1;
}

message GetFlowDashboardResponse {
  int64 open_tasks = 1;
  int64 in_progress_tasks = 2;
  int64 completed_this_week = 3;
  int64 overdue_tasks = 4;
  repeated Task my_tasks = 5;
}
