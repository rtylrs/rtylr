syntax = "proto3";

package flow;

option go_package = "github.com/voxire/voxie/gen/go/flow/v1";

// ── Projects ────────────────────────────────────────────────────────

message Project {
  int64 id = 1;
  int64 workspace_id = 2;
  int64 owner_id = 3;
  string name = 4;
  string description = 5;
  string icon = 6;
  string color = 7;
  string status = 8;
  string start_date = 9;
  string due_date = 10;
  int64 created_by = 11;
  string created_at = 12;
  string updated_at = 13;
}

message ListProjectsRequest {
  int64 workspace_id = 1;
}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message CreateProjectRequest {
  int64 workspace_id = 1;
  string name = 2;
  string description = 3;
  string icon = 4;
  string color = 5;
  string start_date = 6;
  string due_date = 7;
}

message CreateProjectResponse {
  Project project = 1;
}

message UpdateProjectRequest {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string icon = 4;
  string color = 5;
  string status = 6;
  string start_date = 7;
  string due_date = 8;
}

message UpdateProjectResponse {
  string message = 1;
}

message DeleteProjectRequest {
  int64 id = 1;
}

message DeleteProjectResponse {
  string message = 1;
}
