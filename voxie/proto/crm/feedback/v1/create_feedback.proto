syntax = "proto3";

package crm.feedback.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/crm/feedback/v1";

message CreateFeedbackRequest {
  int64 customer_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  string type = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  int32 score = 3;
  string comment = 4;
  string source = 5;
}

message CreateFeedbackResponse {
  int64 feedback_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  string message = 2;
}
