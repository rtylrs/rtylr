syntax = "proto3";

package crm.feedback.v1;

import "crm/feedback/v1/create_feedback.proto";
import "crm/feedback/v1/list_feedback.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/crm/feedback/v1";

service FeedbackService {
  option (onekit.http.service_config) = {base_path: "/api/crm/feedback/v1"};

  rpc ListFeedback(ListFeedbackRequest) returns (ListFeedbackResponse) {
    option (onekit.http.config) = {
      path: "/feedback"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateFeedback(CreateFeedbackRequest) returns (CreateFeedbackResponse) {
    option (onekit.http.config) = {
      path: "/feedback"
      method: HTTP_METHOD_POST
      body: "*"
    };
  }
}
