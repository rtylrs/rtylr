syntax = "proto3";

package crm.feedback.v1;

import "crm/feedback/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/crm/feedback/v1";

message ListFeedbackRequest {
  string type = 1 [(onekit.http.query).name = "type"];
  string source = 2 [(onekit.http.query).name = "source"];
  optional int32 min_score = 3 [(onekit.http.query).name = "min_score"];
  optional int32 max_score = 4 [(onekit.http.query).name = "max_score"];
  int32 page = 5 [(onekit.http.query).name = "page"];
  int32 page_size = 6 [(onekit.http.query).name = "page_size"];
}

message ListFeedbackResponse {
  repeated Feedback feedback = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}
