syntax = "proto3";

package crm.template.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/crm/template/v1";

message CreateTemplateRequest {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string type = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string subject = 3;
  string body = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  google.protobuf.Value variables = 5;
  bool is_active = 6;
}

message CreateTemplateResponse {
  int64 template_id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  string message = 2;
}
