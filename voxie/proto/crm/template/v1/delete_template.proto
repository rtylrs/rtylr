syntax = "proto3";

package crm.template.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/crm/template/v1";

message DeleteTemplateRequest {
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING,
    (buf.validate.field).required = true
  ];
}

message DeleteTemplateResponse {
  string message = 1;
}
