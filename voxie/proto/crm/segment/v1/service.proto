syntax = "proto3";

package crm.segment.v1;

import "crm/segment/v1/create_segment.proto";
import "crm/segment/v1/delete_segment.proto";
import "crm/segment/v1/get_segment_customers.proto";
import "crm/segment/v1/get_segment_detail.proto";
import "crm/segment/v1/list_segments.proto";
import "crm/segment/v1/update_segment.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/crm/segment/v1";

// SegmentService defines CRM segment endpoints.
service SegmentService {
  option (onekit.http.service_config) = {base_path: "/api/crm/segment/v1"};

  // ListSegments returns all segments for the active business.
  rpc ListSegments(ListSegmentsRequest) returns (ListSegmentsResponse) {
    option (onekit.http.config) = {
      path: "/segments"
      method: HTTP_METHOD_GET
    };
  }

  // CreateSegment creates a new customer segment.
  rpc CreateSegment(CreateSegmentRequest) returns (CreateSegmentResponse) {
    option (onekit.http.config) = {
      path: "/segments"
      method: HTTP_METHOD_POST
    };
  }

  // GetSegmentDetail returns a segment and its member customers.
  rpc GetSegmentDetail(GetSegmentDetailRequest) returns (GetSegmentDetailResponse) {
    option (onekit.http.config) = {
      path: "/segments/{id}"
      method: HTTP_METHOD_GET
    };
  }

  // GetSegmentCustomers returns paginated customers in a segment.
  rpc GetSegmentCustomers(GetSegmentCustomersRequest) returns (GetSegmentCustomersResponse) {
    option (onekit.http.config) = {
      path: "/segments/{segment_id}/customers"
      method: HTTP_METHOD_GET
    };
  }

  // UpdateSegment updates an existing segment.
  rpc UpdateSegment(UpdateSegmentRequest) returns (UpdateSegmentResponse) {
    option (onekit.http.config) = {
      path: "/segments/{id}"
      method: HTTP_METHOD_PUT
      body: "body"
    };
  }

  // DeleteSegment removes a segment by ID.
  rpc DeleteSegment(DeleteSegmentRequest) returns (DeleteSegmentResponse) {
    option (onekit.http.config) = {
      path: "/segments/{id}"
      method: HTTP_METHOD_DELETE
    };
  }
}
