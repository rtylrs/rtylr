syntax = "proto3";

package crm.segment.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";
import "crm/customer/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/crm/segment/v1";

message GetSegmentCustomersRequest {
  // segment_id is the segment id value for this contract.
  int64 segment_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // page is the one-based page number to return.
  int64 page = 2 [
    (onekit.http.query).name = "page",
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ,
    (onekit.http.int64_encoding) = INT64_ENCODING_NUMBER
  ];
  // page_size is the maximum number of customers to return.
  int64 page_size = 3 [
    (onekit.http.query).name = "page_size",
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ,
    (onekit.http.int64_encoding) = INT64_ENCODING_NUMBER
  ];
}

message GetSegmentCustomersResponse {
  // customers is the customers value for this contract. Uses the full
  // crm.customer.v1.Customer (not pos.customer.v1's minimal projection) so
  // consumers can render loyalty tier/points without a second lookup.
  repeated .crm.customer.v1.Customer customers = 1;
  // total is the total number of matching records.
  int64 total = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_NUMBER];
  // page is the current result page.
  int64 page = 3 [(onekit.http.int64_encoding) = INT64_ENCODING_NUMBER];
  // page_size is the number of records requested per page.
  int64 page_size = 4 [(onekit.http.int64_encoding) = INT64_ENCODING_NUMBER];
}
