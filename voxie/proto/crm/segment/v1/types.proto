syntax = "proto3";

package crm.segment.v1;

option go_package = "github.com/voxire/voxie/gen/go/crm/segment/v1";

// ── Segments ────────────────────────────────────────────────────────

message Segment {
  // id is the unique identifier for the resource.
  int64 id = 1;
  // owner_id identifies the tenant that owns the resource.
  int64 owner_id = 2;
  // name is the name value for this contract.
  string name = 3;
  // description is the description value for this contract.
  string description = 4;
  // rules is the rules value for this contract.
  string rules = 5;
  // customer_count is the customer count value for this contract.
  int64 customer_count = 6;
  // last_calculated_at is the last calculated at value for this contract.
  optional string last_calculated_at = 7;
  // created_at is when the record was created.
  string created_at = 8;
  // updated_at is when the record was last updated.
  string updated_at = 9;
}
