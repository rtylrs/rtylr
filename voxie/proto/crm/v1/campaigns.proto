syntax = "proto3";

package crm.v1;

option go_package = "github.com/voxire/voxie/gen/go/crm/v1";

// ── Campaigns ─────────────────────────────────────────────────────

message Campaign {
  int64 id = 1;
  int64 owner_id = 2;
  string name = 3;
  string description = 4;
  string channel = 5;
  string status = 6;
  optional int64 segment_id = 7;
  string subject = 8;
  string content = 9;
  optional string scheduled_at = 10;
  optional string sent_at = 11;
  int64 audience_count = 12;
  int64 sent_count = 13;
  int64 delivered_count = 14;
  int64 opened_count = 15;
  int64 clicked_count = 16;
  string created_at = 17;
  string updated_at = 18;
}

message ListCampaignsRequest {
  string status = 1;
}

message ListCampaignsResponse {
  repeated Campaign campaigns = 1;
}

message CreateCampaignRequest {
  string name = 1;
  string description = 2;
  string channel = 3;
  optional int64 segment_id = 4;
  string subject = 5;
  string content = 6;
  string scheduled_at = 7;
}

message CreateCampaignResponse {
  int64 campaign_id = 1;
  string message = 2;
}

message UpdateCampaignRequest {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string channel = 4;
  optional int64 segment_id = 5;
  string subject = 6;
  string content = 7;
  string scheduled_at = 8;
}

message UpdateCampaignResponse {
  string message = 1;
}

message UpdateCampaignStatusRequest {
  int64 id = 1;
  string status = 2;
}

message UpdateCampaignStatusResponse {
  string message = 1;
}

// ── Campaign Stats ─────────────────────────────────────────────────

message CampaignStats {
  int64 campaign_id = 1;
  int64 audience_count = 2;
  int64 sent_count = 3;
  int64 delivered_count = 4;
  int64 opened_count = 5;
  int64 clicked_count = 6;
  int64 bounced_count = 7;
  int64 failed_count = 8;
}

message GetCampaignStatsRequest {
  int64 campaign_id = 1;
}

message GetCampaignStatsResponse {
  CampaignStats stats = 1;
}

message GetCampaignDetailRequest {
  int64 id = 1;
}

message GetCampaignDetailResponse {
  Campaign campaign = 1;
  CampaignStats stats = 2;
}
