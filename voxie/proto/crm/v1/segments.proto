syntax = "proto3";

package crm;

option go_package = "github.com/voxire/voxie/gen/go/crm/v1";

// ── Segments ────────────────────────────────────────────────────────

message Segment {
  int64 id = 1;
  int64 owner_id = 2;
  string name = 3;
  string description = 4;
  string filters = 5;
  int32 customer_count = 6;
  string created_at = 7;
  string updated_at = 8;
}

message ListSegmentsRequest {}

message ListSegmentsResponse {
  repeated Segment segments = 1;
}

message CreateSegmentRequest {
  string name = 1;
  string description = 2;
  string filters = 3;
}

message CreateSegmentResponse {
  int64 segment_id = 1;
  string message = 2;
}

message UpdateSegmentRequest {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string filters = 4;
}

message UpdateSegmentResponse {
  string message = 1;
}

message DeleteSegmentRequest {
  int64 id = 1;
}

message DeleteSegmentResponse {
  string message = 1;
}
