syntax = "proto3";

package crm;

option go_package = "github.com/voxire/voxie/gen/go/crm/v1";

import "common/v1/pagination.proto";

// ── Customers ───────────────────────────────────────────────────────

message Customer {
  int64 id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  string company = 6;
  string status = 7; // active, inactive, lead
  string source = 8; // walk-in, web, referral, import
  string segment = 9;
  int32 total_orders = 10;
  double total_spent = 11;
  double loyalty_points = 12;
  string notes = 13;
  map<string, string> custom_fields = 14;
  string created_at = 15;
  string updated_at = 16;
  string last_visit_at = 17;
}

message ListCustomersRequest {
  common.PaginationRequest pagination = 1;
  string search = 2;
  string status = 3;
  string segment = 4;
  string source = 5;
}

message ListCustomersResponse {
  repeated Customer customers = 1;
  common.PaginationResponse pagination = 2;
}

message GetCustomerRequest {
  int64 id = 1;
}

message GetCustomerResponse {
  Customer customer = 1;
}

message CreateCustomerRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string phone = 4;
  string company = 5;
  string source = 6;
  string segment = 7;
  string notes = 8;
  map<string, string> custom_fields = 9;
}

message CreateCustomerResponse {
  Customer customer = 1;
}

message UpdateCustomerRequest {
  int64 id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  string company = 6;
  string status = 7;
  string segment = 8;
  string notes = 9;
  map<string, string> custom_fields = 10;
}

message UpdateCustomerResponse {
  Customer customer = 1;
}

message DeleteCustomerRequest {
  int64 id = 1;
}

message DeleteCustomerResponse {
  bool success = 1;
}

message ImportCustomersRequest {
  bytes csv_data = 1;
  string mapping = 2; // JSON field mapping
}

message ImportCustomersResponse {
  int32 imported = 1;
  int32 skipped = 2;
  repeated string errors = 3;
}

message MergeCustomersRequest {
  int64 primary_id = 1;
  int64 secondary_id = 2;
}

message MergeCustomersResponse {
  Customer customer = 1;
}

message ExportCustomersRequest {
  string format = 1; // csv, xlsx
  string status = 2;
  string segment = 3;
}

message ExportCustomersResponse {
  bytes data = 1;
  string filename = 2;
}

message RecordVisitRequest {
  int64 customer_id = 1;
  string notes = 2;
}

message RecordVisitResponse {
  bool success = 1;
}
