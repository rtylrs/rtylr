syntax = "proto3";

package crm;

option go_package = "github.com/voxire/voxie/gen/go/crm/v1";

import "crm/v1/segments.proto";

// ── Customers ───────────────────────────────────────────────────────

message Customer {
  int64 id = 1;
  int64 owner_id = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  string phone = 6;
  optional string date_of_birth = 7;
  string gender = 8;
  string address = 9;
  string city = 10;
  string country = 11;
  int64 loyalty_points = 12;
  double total_spent = 13;
  int64 visit_count = 14;
  optional string last_visit_at = 15;
  string loyalty_tier = 16;
  repeated string tags = 17;
  string notes = 18;
  bool is_active = 19;
  string created_at = 20;
  string updated_at = 21;
}

message ListCustomersRequest {
  string search = 1;
  string tier = 2;
  string tag = 3;
  int64 page = 4;
  int64 page_size = 5;
}

message ListCustomersResponse {
  repeated Customer customers = 1;
  int64 total = 2;
  int64 page = 3;
  int64 page_size = 4;
}

message CreateCustomerRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string phone = 4;
  string date_of_birth = 5;
  string gender = 6;
  string address = 7;
  string city = 8;
  string country = 9;
  repeated string tags = 10;
  string notes = 11;
}

message CreateCustomerResponse {
  int64 customer_id = 1;
  string message = 2;
}

message UpdateCustomerRequest {
  int64 id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  string date_of_birth = 6;
  string gender = 7;
  string address = 8;
  string city = 9;
  string country = 10;
  repeated string tags = 11;
  string notes = 12;
  optional bool is_active = 13;
}

message UpdateCustomerResponse {
  string message = 1;
}

message DeleteCustomerRequest {
  int64 id = 1;
}

message DeleteCustomerResponse {
  string message = 1;
}

// ── Segment Detail ─────────────────────────────────────────────────

message GetSegmentDetailRequest {
  int64 id = 1;
}

message GetSegmentDetailResponse {
  Segment segment = 1;
  repeated Customer customers = 2;
}

message GetSegmentCustomersRequest {
  int64 segment_id = 1;
  int64 page = 2;
  int64 page_size = 3;
}

message GetSegmentCustomersResponse {
  repeated Customer customers = 1;
  int64 total = 2;
  int64 page = 3;
  int64 page_size = 4;
}

// ── Get Customer Detail ────────────────────────────────────────────

message GetCustomerRequest {
  int64 id = 1;
}

message GetCustomerResponse {
  Customer customer = 1;
}
