syntax = "proto3";

package crm;

option go_package = "github.com/voxire/voxie/gen/go/crm/v1";

// ── Dashboard ───────────────────────────────────────────────────────

message TopCustomer {
  int64 id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  double total_spent = 5;
  int64 loyalty_points = 6;
  string loyalty_tier = 7;
}

message GetDashboardRequest {}

message GetDashboardResponse {
  int64 total_customers = 1;
  int64 new_this_month = 2;
  int64 active_loyalty_members = 3;
  repeated TopCustomer top_customers = 4;
}
