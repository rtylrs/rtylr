syntax = "proto3";

package crm;

option go_package = "github.com/voxire/voxie/gen/go/crm/v1";

import "common/v1/pagination.proto";

// ── Loyalty ─────────────────────────────────────────────────────────

message LoyaltyConfig {
  bool enabled = 1;
  double points_per_dollar = 2;
  double redemption_rate = 3; // points per $1 discount
  int32 min_redeem_points = 4;
  bool auto_enroll = 5;
}

message GetLoyaltyConfigRequest {}

message GetLoyaltyConfigResponse {
  LoyaltyConfig config = 1;
}

message UpdateLoyaltyConfigRequest {
  LoyaltyConfig config = 1;
}

message UpdateLoyaltyConfigResponse {
  LoyaltyConfig config = 1;
}

message LoyaltyTransaction {
  int64 id = 1;
  int64 customer_id = 2;
  string type = 3; // earn, redeem, adjust
  double points = 4;
  double balance_after = 5;
  string description = 6;
  string created_at = 7;
}

message ListLoyaltyTransactionsRequest {
  int64 customer_id = 1;
  common.PaginationRequest pagination = 2;
}

message ListLoyaltyTransactionsResponse {
  repeated LoyaltyTransaction transactions = 1;
  common.PaginationResponse pagination = 2;
}

message AwardPointsRequest {
  int64 customer_id = 1;
  double points = 2;
  string description = 3;
}

message AwardPointsResponse {
  double new_balance = 1;
}

message RedeemPointsRequest {
  int64 customer_id = 1;
  double points = 2;
  string description = 3;
}

message RedeemPointsResponse {
  double new_balance = 1;
  double discount_amount = 2;
}
