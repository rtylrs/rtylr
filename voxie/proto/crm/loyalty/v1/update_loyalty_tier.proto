syntax = "proto3";

package crm.loyalty.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/crm/loyalty/v1";

message UpdateLoyaltyTierBody {
  // name is the name value for this contract.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // min_points is the min points value for this contract.
  int64 min_points = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  // discount_pct is the discount pct value for this contract.
  double discount_pct = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).double.gt = 0
  ];
  // perks is the perks value for this contract.
  string perks = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // sort_order is the sort order value for this contract.
  int64 sort_order = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
}

message UpdateLoyaltyTierRequest {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // body carries updatable loyalty tier fields bound from the HTTP payload.
  UpdateLoyaltyTierBody body = 2;
}

message UpdateLoyaltyTierResponse {
  // message is a human-readable result message.
  string message = 1;
}
