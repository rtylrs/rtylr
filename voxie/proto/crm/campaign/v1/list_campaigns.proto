syntax = "proto3";

package crm.campaign.v1;

import "crm/campaign/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/crm/campaign/v1";

message ListCampaignsRequest {
  // status is the current lifecycle state.
  string status = 1;
}

message ListCampaignsResponse {
  // campaigns is the campaigns value for this contract.
  repeated Campaign campaigns = 1;
}
