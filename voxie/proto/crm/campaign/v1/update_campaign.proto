syntax = "proto3";

package crm.campaign.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/crm/campaign/v1";

message UpdateCampaignBody {
  // name is the name value for this contract.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // description is the description value for this contract.
  string description = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // channel is the channel value for this contract.
  string channel = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // segment_id is the segment id value for this contract.
  optional int64 segment_id = 4 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING, (onekit.http.nullable) = true];
  // subject is the subject value for this contract.
  string subject = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // content is the content value for this contract.
  string content = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // scheduled_at is the scheduled at value for this contract.
  string scheduled_at = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message UpdateCampaignRequest {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // body carries updatable campaign fields bound from the HTTP payload.
  UpdateCampaignBody body = 2;
}

message UpdateCampaignResponse {
  // message is a human-readable result message.
  string message = 1;
}
