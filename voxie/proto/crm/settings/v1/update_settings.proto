syntax = "proto3";

package crm.settings.v1;

option go_package = "github.com/voxire/voxie/gen/go/crm/settings/v1";

message UpdateSettingsRequest {
  bool default_consent = 1;
  string from_email = 2;
  string from_name = 3;
  string sms_sender_id = 4;
  string timezone = 5;
}

message UpdateSettingsResponse {
  string message = 1;
}
