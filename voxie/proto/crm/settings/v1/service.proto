syntax = "proto3";

package crm.settings.v1;

import "crm/settings/v1/get_settings.proto";
import "crm/settings/v1/update_settings.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/crm/settings/v1";

service SettingsService {
  option (onekit.http.service_config) = {base_path: "/api/crm/settings/v1"};

  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse) {
    option (onekit.http.config) = {
      path: "/settings"
      method: HTTP_METHOD_GET
    };
  }

  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse) {
    option (onekit.http.config) = {
      path: "/settings"
      method: HTTP_METHOD_PUT
      body: "*"
    };
  }
}
