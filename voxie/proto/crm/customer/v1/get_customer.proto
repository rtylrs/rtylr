syntax = "proto3";

package crm.customer.v1;

import "buf/validate/validate.proto";
import "pos/customer/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/crm/customer/v1";

// ── Get Customer Detail ────────────────────────────────────────────

message GetCustomerRequest {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
}

message GetCustomerResponse {
  // customer is the customer value for this contract.
  .pos.customer.v1.Customer customer = 1;
}
