syntax = "proto3";

package crm.customer.v1;

import "crm/customer/v1/create_customer.proto";
import "crm/customer/v1/delete_customer.proto";
import "crm/customer/v1/get_customer.proto";
import "crm/customer/v1/list_customers.proto";
import "crm/customer/v1/update_customer.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/crm/customer/v1";

// CustomerService defines CRM customer endpoints.
service CustomerService {
  option (onekit.http.service_config) = {base_path: "/api/crm/customer/v1"};

  // ListCustomers returns customers for the active business with optional filters.
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse) {
    option (onekit.http.config) = {
      path: "/customers"
      method: HTTP_METHOD_GET
    };
  }

  // CreateCustomer creates a new customer record.
  rpc CreateCustomer(CreateCustomerRequest) returns (CreateCustomerResponse) {
    option (onekit.http.config) = {
      path: "/customers"
      method: HTTP_METHOD_POST
    };
  }

  // GetCustomer returns a single customer by ID.
  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse) {
    option (onekit.http.config) = {
      path: "/customers/{id}"
      method: HTTP_METHOD_GET
    };
  }

  // UpdateCustomer updates an existing customer.
  rpc UpdateCustomer(UpdateCustomerRequest) returns (UpdateCustomerResponse) {
    option (onekit.http.config) = {
      path: "/customers/{id}"
      method: HTTP_METHOD_PUT
    };
  }

  // DeleteCustomer removes a customer by ID.
  rpc DeleteCustomer(DeleteCustomerRequest) returns (DeleteCustomerResponse) {
    option (onekit.http.config) = {
      path: "/customers/{id}"
      method: HTTP_METHOD_DELETE
    };
  }
}
