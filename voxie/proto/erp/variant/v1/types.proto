syntax = "proto3";

package erp.variant.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/variant/v1";

message Variant {
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  int64 owner_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  int64 business_id = 3 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  int64 product_id = 4 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  string name = 5;
  string sku = 6;
  string barcode = 7;
  double cost_price = 8;
  double sale_price = 9;
  double stock_quantity = 10;
  string attributes = 11;
  bool is_active = 12;
  string created_at = 13;
  string updated_at = 14;
}
