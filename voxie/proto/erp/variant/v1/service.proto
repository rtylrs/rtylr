syntax = "proto3";

package erp.variant.v1;

import "erp/variant/v1/create_variant.proto";
import "erp/variant/v1/delete_variant.proto";
import "erp/variant/v1/list_variants.proto";
import "erp/variant/v1/update_variant.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/variant/v1";

service VariantService {
  option (onekit.http.service_config) = {base_path: "/api/erp/variant/v1"};

  rpc ListVariants(ListVariantsRequest) returns (ListVariantsResponse) {
    option (onekit.http.config) = {
      path: "/variants"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateVariant(CreateVariantRequest) returns (CreateVariantResponse) {
    option (onekit.http.config) = {
      path: "/variants"
      method: HTTP_METHOD_POST
    };
  }

  rpc UpdateVariant(UpdateVariantRequest) returns (UpdateVariantResponse) {
    option (onekit.http.config) = {
      path: "/variants/{id}"
      method: HTTP_METHOD_PUT
      body: "body"
    };
  }

  rpc DeleteVariant(DeleteVariantRequest) returns (DeleteVariantResponse) {
    option (onekit.http.config) = {
      path: "/variants/{id}"
      method: HTTP_METHOD_DELETE
    };
  }
}
