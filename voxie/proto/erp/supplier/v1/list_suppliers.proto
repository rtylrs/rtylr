syntax = "proto3";

package erp.supplier.v1;

import "erp/supplier/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/supplier/v1";

message ListSuppliersRequest {
  // page is the 1-based page number.
  int32 page = 1 [(onekit.http.query).name = "page"];
  // page_size is the number of rows to return.
  int32 page_size = 2 [(onekit.http.query).name = "page_size"];
}

message ListSuppliersResponse {
  // suppliers is the suppliers value for this contract.
  repeated Supplier suppliers = 1;
  // has_more is true when another page is available.
  bool has_more = 2;
  // page is the returned 1-based page number.
  int32 page = 3;
  // page_size is the returned page size.
  int32 page_size = 4;
}
