syntax = "proto3";

package erp.supplier.v1;

import "erp/supplier/v1/create_supplier.proto";
import "erp/supplier/v1/list_suppliers.proto";
import "erp/supplier/v1/update_supplier.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/supplier/v1";

// SupplierService defines ERP supplier endpoints.
service SupplierService {
  option (onekit.http.service_config) = {base_path: "/api/erp/supplier/v1"};

  rpc ListSuppliers(ListSuppliersRequest) returns (ListSuppliersResponse) {
    option (onekit.http.config) = {
      path: "/suppliers"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateSupplier(CreateSupplierRequest) returns (CreateSupplierResponse) {
    option (onekit.http.config) = {
      path: "/suppliers"
      method: HTTP_METHOD_POST
    };
  }

  rpc UpdateSupplier(UpdateSupplierRequest) returns (UpdateSupplierResponse) {
    option (onekit.http.config) = {
      path: "/suppliers/{id}"
      method: HTTP_METHOD_PUT
    };
  }
}
