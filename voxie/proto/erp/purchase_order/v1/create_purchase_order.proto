syntax = "proto3";

package erp.purchase_order.v1;

import "buf/validate/validate.proto";
import "erp/purchase_order/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/purchase_order/v1";

message CreatePurchaseOrderRequest {
  // supplier_id is the supplier id value for this contract.
  int64 supplier_id = 1 [(buf.validate.field).int64.gt = 0];
  // po_number is the po number value for this contract.
  string po_number = 2 [(buf.validate.field).string.min_len = 1];
  // tax_amount is the tax amount value for this contract.
  double tax_amount = 3 [(buf.validate.field).double.gte = 0];
  // expected_delivery is the expected delivery value for this contract.
  string expected_delivery = 4 [(buf.validate.field).string.min_len = 1];
  // notes is the notes value for this contract.
  string notes = 5;
  // items is the items value for this contract.
  repeated CreatePurchaseOrderItemRequest items = 6 [(buf.validate.field).repeated.min_items = 1];
}

message CreatePurchaseOrderResponse {
  // purchase_order_id is the purchase order id value for this contract.
  int64 purchase_order_id = 1;
  // message is a human-readable result message.
  string message = 2;
}
