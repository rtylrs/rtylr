syntax = "proto3";

package erp.purchase_order.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/purchase_order/v1";

// ── Purchase Orders ─────────────────────────────────────────────────

message PurchaseOrderItem {
  // id is the unique identifier for the resource.
  int64 id = 1;
  // purchase_order_id is the purchase order id value for this contract.
  int64 purchase_order_id = 2;
  // product_id is the product id value for this contract.
  int64 product_id = 3;
  // quantity_ordered is the quantity ordered value for this contract.
  double quantity_ordered = 4;
  // quantity_received is the quantity received value for this contract.
  double quantity_received = 5;
  // unit_cost is the unit cost value for this contract.
  double unit_cost = 6;
  // total_cost is the total cost value for this contract.
  double total_cost = 7;
}

message PurchaseOrder {
  // id is the unique identifier for the resource.
  int64 id = 1;
  // owner_id identifies the tenant that owns the resource.
  int64 owner_id = 2;
  // supplier_id is the supplier id value for this contract.
  int64 supplier_id = 3;
  // po_number is the po number value for this contract.
  string po_number = 4;
  // status is the current lifecycle state.
  string status = 5;
  // subtotal is the subtotal value for this contract.
  double subtotal = 6;
  // tax_amount is the tax amount value for this contract.
  double tax_amount = 7;
  // total is the total number of matching records.
  double total = 8;
  // expected_delivery is the expected delivery value for this contract.
  optional string expected_delivery = 9;
  // received_at is the received at value for this contract.
  optional string received_at = 10;
  // notes is the notes value for this contract.
  string notes = 11;
  // created_by is the created by value for this contract.
  int64 created_by = 12;
  // created_at is when the record was created.
  string created_at = 13;
  // updated_at is when the record was last updated.
  string updated_at = 14;
  // items is the items value for this contract.
  repeated PurchaseOrderItem items = 15;
}

message CreatePurchaseOrderItemRequest {
  // product_id is the product id value for this contract.
  int64 product_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  // quantity_ordered is the quantity ordered value for this contract.
  double quantity_ordered = 2 [(buf.validate.field).double.gte = 0];
  // unit_cost is the unit cost value for this contract.
  double unit_cost = 3 [(buf.validate.field).double.gte = 0];
}
