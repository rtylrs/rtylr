syntax = "proto3";

package erp.purchase_order.v1;

import "buf/validate/validate.proto";
import "erp/purchase_order/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/purchase_order/v1";

message GetPurchaseOrderRequest {
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}

message GetPurchaseOrderResponse {
  PurchaseOrder purchase_order = 1;
}
