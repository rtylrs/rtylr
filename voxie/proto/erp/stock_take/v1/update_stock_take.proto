syntax = "proto3";

package erp.stock_take.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/stock_take/v1";

message UpdateStockTakeItemBody {
  int64 product_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  double expected_qty = 2;
  double counted_qty = 3;
}

message UpdateStockTakeBody {
  string status = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string notes = 2;
  repeated UpdateStockTakeItemBody items = 3;
}

message UpdateStockTakeRequest {
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  UpdateStockTakeBody body = 2;
}

message UpdateStockTakeResponse {
  string message = 1;
}
