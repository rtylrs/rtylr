syntax = "proto3";

package erp.product.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/product/v1";

// ── Products ────────────────────────────────────────────────────────

message Product {
  // id is the unique identifier for the resource.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // owner_id identifies the tenant that owns the resource.
  int64 owner_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // category_id is the category id value for this contract.
  int64 category_id = 3 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // supplier_id is the supplier id value for this contract.
  int64 supplier_id = 4 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // name is the name value for this contract.
  string name = 5;
  // sku is the sku value for this contract.
  string sku = 6;
  // barcode is the barcode value for this contract.
  string barcode = 7;
  // description is the description value for this contract.
  string description = 8;
  // unit is the unit value for this contract.
  string unit = 9;
  // cost_price is the cost price value for this contract.
  double cost_price = 10;
  // sale_price is the sale price value for this contract.
  double sale_price = 11;
  // stock_quantity is the stock quantity value for this contract.
  double stock_quantity = 12;
  // low_stock_threshold is the low stock threshold value for this contract.
  double low_stock_threshold = 13;
  // reorder_quantity is the reorder quantity value for this contract.
  double reorder_quantity = 14;
  // is_active is the is active value for this contract.
  bool is_active = 15;
  // track_inventory is the track inventory value for this contract.
  bool track_inventory = 16;
  // created_at is when the record was created.
  string created_at = 17;
  // updated_at is when the record was last updated.
  string updated_at = 18;
}

message FullProduct {
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  int64 owner_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  int64 business_id = 3 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  int64 category_id = 4 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  int64 supplier_id = 5 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  string name = 6;
  string sku = 7;
  string barcode = 8;
  string description = 9;
  string unit = 10;
  double cost_price = 11;
  double sale_price = 12;
  double stock_quantity = 13;
  double low_stock_threshold = 14;
  double reorder_quantity = 15;
  bool is_active = 16;
  bool track_inventory = 17;
  int64 brand_id = 18 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  double compare_at_price = 19;
  double tax_rate = 20;
  string currency = 21;
  double weight = 22;
  string weight_unit = 23;
  double length = 24;
  double width = 25;
  double height = 26;
  string dimension_unit = 27;
  string country_of_origin = 28;
  string hs_code = 29;
  bool allow_backorder = 30;
  int32 lead_time_days = 31;
  string image_url = 32;
  string created_at = 33;
  string updated_at = 34;
}

message ProductAttribute {
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  string name = 2;
  string value = 3;
  int32 position = 4;
}
