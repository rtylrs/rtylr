syntax = "proto3";

package erp.product.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/product/v1";

message DashboardLowStockItem {
  int64 product_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  string name = 2;
  string sku = 3;
  double current_stock = 4;
  double reorder_point = 5;
  string warehouse_name = 6;
}

message DashboardRecentOrder {
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  string po_number = 2;
  string supplier_name = 3;
  string status = 4;
  double total = 5;
  string created_at = 6;
}

message DashboardTopCategory {
  string name = 1;
  int32 product_count = 2;
}

message GetDashboardRequest {}

message GetDashboardResponse {
  int32 total_products = 1;
  int32 low_stock_count = 2;
  int32 pending_orders = 3;
  int32 total_suppliers = 4;
  double inventory_value = 5;
  repeated DashboardLowStockItem low_stock_items = 6;
  repeated DashboardRecentOrder recent_orders = 7;
  repeated DashboardTopCategory top_categories = 8;
}
