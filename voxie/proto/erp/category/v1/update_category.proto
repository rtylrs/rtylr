syntax = "proto3";

package erp.category.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/category/v1";

message UpdateCategoryBody {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string description = 2;
}

message UpdateCategoryRequest {
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  UpdateCategoryBody body = 2;
}

message UpdateCategoryResponse {
  string message = 1;
}
