syntax = "proto3";

package erp.category.v1;

import "erp/category/v1/create_category.proto";
import "erp/category/v1/delete_category.proto";
import "erp/category/v1/list_categories.proto";
import "erp/category/v1/update_category.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/category/v1";

service CategoryService {
  option (onekit.http.service_config) = {base_path: "/api/erp/category/v1"};

  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse) {
    option (onekit.http.config) = {
      path: "/categories"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse) {
    option (onekit.http.config) = {
      path: "/categories"
      method: HTTP_METHOD_POST
    };
  }

  rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse) {
    option (onekit.http.config) = {
      path: "/categories/{id}"
      method: HTTP_METHOD_PUT
      body: "body"
    };
  }

  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse) {
    option (onekit.http.config) = {
      path: "/categories/{id}"
      method: HTTP_METHOD_DELETE
    };
  }
}
