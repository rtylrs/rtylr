syntax = "proto3";

package erp.v1;

option go_package = "github.com/voxire/voxie/gen/go/erp/v1";

// ── Inventory ───────────────────────────────────────────────────────

// -- Adjust Inventory --

message AdjustInventoryRequest {
  int64 product_id = 1;
  double change = 2;
  string type = 3;
  string notes = 4;
}

message AdjustInventoryResponse {
  string message = 1;
}

// -- Inventory Report --

message InventoryReportItem {
  int64 product_id = 1;
  string product_name = 2;
  string sku = 3;
  string unit = 4;
  double stock_quantity = 5;
  double low_stock_threshold = 6;
  double reorder_quantity = 7;
  double cost_price = 8;
  double sale_price = 9;
  double stock_value = 10;
  bool is_low_stock = 11;
}

message GetInventoryReportRequest {}

message GetInventoryReportResponse {
  repeated InventoryReportItem items = 1;
  double total_value = 2;
}

// -- Low Stock --

message GetLowStockRequest {}

message GetLowStockResponse {
  repeated InventoryReportItem items = 1;
  int64 count = 2;
}

// -- Valuation --

message ValuationItem {
  string category_name = 1;
  string warehouse_name = 2;
  int64 total_items = 3;
  double total_value = 4;
  double total_cost = 5;
}

message GetValuationRequest {}

message GetValuationResponse {
  repeated ValuationItem items = 1;
  double total_value = 2;
}
