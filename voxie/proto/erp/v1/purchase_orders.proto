syntax = "proto3";

package erp.v1;

option go_package = "github.com/voxire/voxie/gen/go/erp/v1";

// ── Purchase Orders ─────────────────────────────────────────────────

message PurchaseOrderItem {
  int64 id = 1;
  int64 purchase_order_id = 2;
  int64 product_id = 3;
  double quantity_ordered = 4;
  double quantity_received = 5;
  double unit_cost = 6;
  double total_cost = 7;
}

message PurchaseOrder {
  int64 id = 1;
  int64 owner_id = 2;
  int64 supplier_id = 3;
  string po_number = 4;
  string status = 5;
  double subtotal = 6;
  double tax_amount = 7;
  double total = 8;
  optional string expected_delivery = 9;
  optional string received_at = 10;
  string notes = 11;
  int64 created_by = 12;
  string created_at = 13;
  string updated_at = 14;
  repeated PurchaseOrderItem items = 15;
}

message ListPurchaseOrdersRequest {
  string status = 1;
}

message ListPurchaseOrdersResponse {
  repeated PurchaseOrder purchase_orders = 1;
}

message CreatePurchaseOrderItemRequest {
  int64 product_id = 1;
  double quantity_ordered = 2;
  double unit_cost = 3;
}

message CreatePurchaseOrderRequest {
  int64 supplier_id = 1;
  string po_number = 2;
  double tax_amount = 3;
  string expected_delivery = 4;
  string notes = 5;
  repeated CreatePurchaseOrderItemRequest items = 6;
}

message CreatePurchaseOrderResponse {
  int64 purchase_order_id = 1;
  string message = 2;
}

message UpdatePurchaseOrderStatusRequest {
  int64 id = 1;
  string status = 2;
}

message UpdatePurchaseOrderStatusResponse {
  string message = 1;
}
