syntax = "proto3";

package erp.v1;

option go_package = "github.com/voxire/voxie/gen/go/erp/v1";

// ── Suppliers ───────────────────────────────────────────────────────

message Supplier {
  int64 id = 1;
  int64 owner_id = 2;
  string name = 3;
  string email = 4;
  string phone = 5;
  string address = 6;
  string city = 7;
  string country = 8;
  string tax_id = 9;
  string payment_terms = 10;
  string notes = 11;
  bool is_active = 12;
  string created_at = 13;
  string updated_at = 14;
}

message ListSuppliersRequest {}

message ListSuppliersResponse {
  repeated Supplier suppliers = 1;
}

message CreateSupplierRequest {
  string name = 1;
  string email = 2;
  string phone = 3;
  string address = 4;
  string city = 5;
  string country = 6;
  string tax_id = 7;
  string payment_terms = 8;
  string notes = 9;
  bool is_active = 10;
}

message CreateSupplierResponse {
  int64 supplier_id = 1;
  string message = 2;
}

message UpdateSupplierRequest {
  int64 id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  string address = 5;
  string city = 6;
  string country = 7;
  string tax_id = 8;
  string payment_terms = 9;
  string notes = 10;
  bool is_active = 11;
}

message UpdateSupplierResponse {
  string message = 1;
}
