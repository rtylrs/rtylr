syntax = "proto3";

package erp;

option go_package = "github.com/voxire/voxie/gen/go/erp/v1";

import "common/v1/pagination.proto";

// ── Products ────────────────────────────────────────────────────────

message Product {
  int64 id = 1;
  string name = 2;
  string sku = 3;
  string description = 4;
  string category = 5;
  double price = 6;
  double cost = 7;
  int32 quantity = 8;
  int32 low_stock_threshold = 9;
  string unit = 10; // pcs, kg, ltr, etc.
  string status = 11; // active, inactive, discontinued
  string image_url = 12;
  string barcode = 13;
  map<string, string> attributes = 14;
  string created_at = 15;
  string updated_at = 16;
}

message ListProductsRequest {
  common.PaginationRequest pagination = 1;
  string search = 2;
  string category = 3;
  string status = 4;
}

message ListProductsResponse {
  repeated Product products = 1;
  common.PaginationResponse pagination = 2;
}

message GetProductRequest {
  int64 id = 1;
}

message GetProductResponse {
  Product product = 1;
}

message CreateProductRequest {
  string name = 1;
  string sku = 2;
  string description = 3;
  string category = 4;
  double price = 5;
  double cost = 6;
  int32 quantity = 7;
  int32 low_stock_threshold = 8;
  string unit = 9;
  string barcode = 10;
  map<string, string> attributes = 11;
}

message CreateProductResponse {
  Product product = 1;
}

message UpdateProductRequest {
  int64 id = 1;
  string name = 2;
  string sku = 3;
  string description = 4;
  string category = 5;
  double price = 6;
  double cost = 7;
  int32 low_stock_threshold = 8;
  string unit = 9;
  string status = 10;
  string barcode = 11;
  map<string, string> attributes = 12;
}

message UpdateProductResponse {
  Product product = 1;
}

message DeleteProductRequest {
  int64 id = 1;
}

message DeleteProductResponse {
  bool success = 1;
}
