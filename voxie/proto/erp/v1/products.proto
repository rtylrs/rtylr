syntax = "proto3";

package erp;

option go_package = "github.com/voxire/voxie/gen/go/erp/v1";

// ── Products ────────────────────────────────────────────────────────

message Product {
  int64 id = 1;
  int64 owner_id = 2;
  int64 category_id = 3;
  int64 supplier_id = 4;
  string name = 5;
  string sku = 6;
  string barcode = 7;
  string description = 8;
  string unit = 9;
  double cost_price = 10;
  double sale_price = 11;
  double stock_quantity = 12;
  double low_stock_threshold = 13;
  double reorder_quantity = 14;
  bool is_active = 15;
  bool track_inventory = 16;
  string created_at = 17;
  string updated_at = 18;
}

message ListProductsRequest {
  string search = 1;
  int64 category_id = 2;
  int64 limit = 3;
  int64 offset = 4;
}

message ListProductsResponse {
  repeated Product products = 1;
}

message CreateProductRequest {
  int64 category_id = 1;
  int64 supplier_id = 2;
  string name = 3;
  string sku = 4;
  string barcode = 5;
  string description = 6;
  string unit = 7;
  double cost_price = 8;
  double sale_price = 9;
  double low_stock_threshold = 10;
  double reorder_quantity = 11;
  bool is_active = 12;
  bool track_inventory = 13;
}

message CreateProductResponse {
  int64 product_id = 1;
  string message = 2;
}

message UpdateProductRequest {
  int64 id = 1;
  int64 category_id = 2;
  int64 supplier_id = 3;
  string name = 4;
  string sku = 5;
  string barcode = 6;
  string description = 7;
  string unit = 8;
  double cost_price = 9;
  double sale_price = 10;
  double low_stock_threshold = 11;
  double reorder_quantity = 12;
  bool is_active = 13;
  bool track_inventory = 14;
}

message UpdateProductResponse {
  string message = 1;
}

message DeleteProductRequest {
  int64 id = 1;
}

message DeleteProductResponse {
  string message = 1;
}
