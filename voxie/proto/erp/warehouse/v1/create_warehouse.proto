syntax = "proto3";

package erp.warehouse.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/warehouse/v1";

message CreateWarehouseRequest {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string address = 2;
  string city = 3;
  string country = 4;
  string manager_name = 5;
  int64 capacity = 6;
  bool is_default = 7;
  bool is_active = 8;
}

message CreateWarehouseResponse {
  int64 warehouse_id = 1;
  string message = 2;
}
