syntax = "proto3";

package auth;

option go_package = "github.com/voxire/voxie/gen/go/auth/v1";

// ── Auth ────────────────────────────────────────────────────────────

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  string message = 2;
  int64 user_id = 3;
  string email = 4;
  string name = 5;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
  string business_name = 4;
}

message RegisterResponse {
  string token = 1;
  string message = 2;
  int64 user_id = 3;
  string email = 4;
  string name = 5;
}

message ResetPasswordRequest {
  string email = 1;
}

message ResetPasswordResponse {
  string message = 1;
}

message InviteAcceptRequest {
  string token = 1;
  string password = 2;
}

message InviteAcceptResponse {
  string message = 1;
}

message GoogleAuthRequest {
  string id_token = 1;
  string business_name = 2;
}

message GoogleAuthResponse {
  string token = 1;
  bool is_new = 2;
}
