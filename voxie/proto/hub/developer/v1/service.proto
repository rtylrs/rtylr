syntax = "proto3";

package hub.developer.v1;

import "hub/developer/v1/create_api_key.proto";
import "hub/developer/v1/create_webhook.proto";
import "hub/developer/v1/delete_webhook.proto";
import "hub/developer/v1/list_api_keys.proto";
import "hub/developer/v1/list_webhooks.proto";
import "hub/developer/v1/revoke_api_key.proto";
import "hub/developer/v1/update_webhook.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/developer/v1";

// DeveloperService defines hub developer API endpoints.
service DeveloperService {
  option (onekit.http.service_config) = {base_path: ""};

  // ListApiKeys returns API keys for the active business.
  rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse) {
    option (onekit.http.config) = {
      path: "/api-keys"
      method: HTTP_METHOD_GET
    };
  }

  // CreateApiKey creates a new API key.
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse) {
    option (onekit.http.config) = {
      path: "/api-keys"
      method: HTTP_METHOD_POST
    };
  }

  // RevokeApiKey revokes an existing API key.
  rpc RevokeApiKey(RevokeApiKeyRequest) returns (RevokeApiKeyResponse) {
    option (onekit.http.config) = {
      path: "/api-keys"
      method: HTTP_METHOD_DELETE
    };
  }

  // ListWebhooks returns configured webhooks.
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse) {
    option (onekit.http.config) = {
      path: "/webhooks"
      method: HTTP_METHOD_GET
    };
  }

  // CreateWebhook registers a new webhook endpoint.
  rpc CreateWebhook(CreateWebhookRequest) returns (CreateWebhookResponse) {
    option (onekit.http.config) = {
      path: "/webhooks"
      method: HTTP_METHOD_POST
    };
  }

  // UpdateWebhook updates an existing webhook.
  rpc UpdateWebhook(UpdateWebhookRequest) returns (UpdateWebhookResponse) {
    option (onekit.http.config) = {
      path: "/webhooks/{id}"
      method: HTTP_METHOD_PUT
      body: "body"
    };
  }

  // DeleteWebhook removes a webhook by ID.
  rpc DeleteWebhook(DeleteWebhookRequest) returns (DeleteWebhookResponse) {
    option (onekit.http.config) = {
      path: "/webhooks"
      method: HTTP_METHOD_DELETE
    };
  }
}
