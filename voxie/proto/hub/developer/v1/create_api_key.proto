syntax = "proto3";

package hub.developer.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/developer/v1";

message CreateApiKeyRequest {
  // name is the name value for this contract.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // scopes is the scopes value for this contract.
  repeated string scopes = 2 [(buf.validate.field).repeated.min_items = 1];
}

message CreateApiKeyResponse {
  // id is the unique identifier for the resource.
  int64 id = 1;
  // key is the key value for this contract.
  string key = 2;
  // message is a human-readable result message.
  string message = 3;
}
