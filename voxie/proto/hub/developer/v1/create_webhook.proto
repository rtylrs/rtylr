syntax = "proto3";

package hub.developer.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/developer/v1";

message CreateWebhookRequest {
  // url is the url value for this contract.
  string url = 1 [(buf.validate.field).string.min_len = 1];
  // events is the events value for this contract.
  repeated string events = 2;
}

message CreateWebhookResponse {
  // id is the unique identifier for the resource.
  int64 id = 1;
  // message is a human-readable result message.
  string message = 2;
}
