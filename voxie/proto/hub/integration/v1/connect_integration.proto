syntax = "proto3";

package hub.integration.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/integration/v1";

message ConnectIntegrationRequest {
  // provider is the provider value for this contract.
  string provider = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // config is the config value for this contract.
  bytes config = 2;
}

message ConnectIntegrationResponse {
  // id is the unique identifier for the resource.
  int64 id = 1;
  // message is a human-readable result message.
  string message = 2;
}
