syntax = "proto3";

package hub.integration.v1;

import "hub/integration/v1/connect_integration.proto";
import "hub/integration/v1/disconnect_integration.proto";
import "hub/integration/v1/list_integrations.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/integration/v1";

// IntegrationService defines hub integration endpoints.
service IntegrationService {
  option (onekit.http.service_config) = {base_path: "/api/hub/integration/v1"};

  // ListIntegrations returns connected integrations.
  rpc ListIntegrations(ListIntegrationsRequest) returns (ListIntegrationsResponse) {
    option (onekit.http.config) = {
      path: "/integrations"
      method: HTTP_METHOD_GET
    };
  }

  // ConnectIntegration connects a third-party integration.
  rpc ConnectIntegration(ConnectIntegrationRequest) returns (ConnectIntegrationResponse) {
    option (onekit.http.config) = {
      path: "/integrations/connect"
      method: HTTP_METHOD_POST
    };
  }

  // DisconnectIntegration disconnects a third-party integration.
  rpc DisconnectIntegration(DisconnectIntegrationRequest) returns (DisconnectIntegrationResponse) {
    option (onekit.http.config) = {
      path: "/integrations/disconnect"
      method: HTTP_METHOD_POST
    };
  }
}
