syntax = "proto3";

package hub.integration.v1;

option go_package = "github.com/voxire/voxie/gen/go/hub/integration/v1";

// ── Integrations ────────────────────────────────────────────────────

message Integration {
  // id is the unique identifier for the resource.
  int64 id = 1;
  // provider is the provider value for this contract.
  string provider = 2;
  // status is the current lifecycle state.
  string status = 3;
  // config is the config value for this contract.
  bytes config = 4;
  // connected_at is the connected at value for this contract.
  string connected_at = 5;
  // created_at is when the record was created.
  string created_at = 6;
}
