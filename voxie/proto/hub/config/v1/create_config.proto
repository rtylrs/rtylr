syntax = "proto3";

package hub.config.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/config/v1";

message CreateConfigRequest {
  // owner is accepted for legacy compatibility; the server derives the
  // owning business from the authenticated user.
  string owner = 1;
  // key is the key value for this contract.
  string key = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // value is the value value for this contract.
  string value = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // description is the description value for this contract.
  string description = 4;
}

message CreateConfigResponse {
  // config_id identifies the created config.
  int64 config_id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // message is a human-readable result message.
  string message = 2;
}
