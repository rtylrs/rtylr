syntax = "proto3";

package hub.config.v1;

import "hub/config/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/config/v1";

message UpdateConfigRequest {
  // site_name is the site name value for this contract. Absent means unchanged.
  optional string site_name = 1 [
    (onekit.http.nullable) = true
  ];
  // logo_url is the logo url value for this contract. Absent means unchanged.
  optional string logo_url = 2 [
    (onekit.http.nullable) = true
  ];
  // favicon_url is the favicon url value for this contract. Absent means unchanged.
  optional string favicon_url = 3 [
    (onekit.http.nullable) = true
  ];
  // contact_email is the contact email value for this contract. Absent means unchanged.
  optional string contact_email = 4 [
    (onekit.http.nullable) = true
  ];
  // contact_number is the contact number value for this contract. Absent means unchanged.
  optional string contact_number = 5 [
    (onekit.http.nullable) = true
  ];
  // sender_email is the sender email value for this contract. Absent means unchanged.
  optional string sender_email = 6 [
    (onekit.http.nullable) = true
  ];
  // website is the website value for this contract. Absent means unchanged.
  optional string website = 7 [
    (onekit.http.nullable) = true
  ];
  // maps_url is the maps url value for this contract. Absent means unchanged.
  optional string maps_url = 8 [
    (onekit.http.nullable) = true
  ];
  // address is the address value for this contract. Absent means unchanged.
  optional string address = 9 [
    (onekit.http.nullable) = true
  ];
  // city is the city value for this contract. Absent means unchanged.
  optional string city = 10 [
    (onekit.http.nullable) = true
  ];
  // zipcode is the zipcode value for this contract. Absent means unchanged.
  optional string zipcode = 11 [
    (onekit.http.nullable) = true
  ];
  // country is the country value for this contract. Absent means unchanged.
  optional string country = 12 [
    (onekit.http.nullable) = true
  ];
  // instagram is the instagram value for this contract. Absent means unchanged.
  optional string instagram = 13 [
    (onekit.http.nullable) = true
  ];
  // maintenance_mode is the maintenance mode value for this contract. Absent means unchanged.
  optional bool maintenance_mode = 14 [
    (onekit.http.nullable) = true
  ];
  // maintenance_notice is the maintenance notice value for this contract. Absent means unchanged.
  optional string maintenance_notice = 15 [
    (onekit.http.nullable) = true
  ];
  // addons_enabled is the addons enabled value for this contract. Absent means unchanged.
  optional bool addons_enabled = 16 [
    (onekit.http.nullable) = true
  ];
  // enable_reviews is the enable reviews value for this contract. Absent means unchanged.
  optional bool enable_reviews = 17 [
    (onekit.http.nullable) = true
  ];
  // enable_wishlist is the enable wishlist value for this contract. Absent means unchanged.
  optional bool enable_wishlist = 18 [
    (onekit.http.nullable) = true
  ];
  // enable_newsletter_signup is the enable newsletter signup value for this contract. Absent means unchanged.
  optional bool enable_newsletter_signup = 19 [
    (onekit.http.nullable) = true
  ];
  // about_content is the about content value for this contract. Absent means unchanged.
  optional string about_content = 20 [
    (onekit.http.nullable) = true
  ];
  // footer_sub_text is the footer sub text value for this contract. Absent means unchanged.
  optional string footer_sub_text = 21 [
    (onekit.http.nullable) = true
  ];
}

message UpdateConfigResponse {
  // message is a human-readable result message.
  string message = 1;
  // config is the updated configuration.
  ConfigPayload config = 2;
}
