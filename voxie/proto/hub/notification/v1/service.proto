syntax = "proto3";

package hub.notification.v1;

import "hub/notification/v1/list_notifications.proto";
import "hub/notification/v1/mark_all_read.proto";
import "hub/notification/v1/mark_notification_read.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/notification/v1";

// NotificationService defines hub notification endpoints.
service NotificationService {
  option (onekit.http.service_config) = {base_path: ""};

  // ListNotifications returns notifications for the current user.
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse) {
    option (onekit.http.config) = {
      path: "/notifications"
      method: HTTP_METHOD_GET
    };
  }

  // MarkAllRead marks all notifications as read.
  rpc MarkAllRead(MarkAllReadRequest) returns (MarkAllReadResponse) {
    option (onekit.http.config) = {
      path: "/notifications/read-all"
      method: HTTP_METHOD_POST
    };
  }

  // MarkNotificationRead marks a single notification as read.
  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (MarkNotificationReadResponse) {
    option (onekit.http.config) = {
      path: "/notifications/{id}/read"
      method: HTTP_METHOD_POST
    };
  }
}
