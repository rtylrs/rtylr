syntax = "proto3";

package hub.notification.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/notification/v1";

message MarkNotificationsReadRequest {
  // ids is the list of notification identifiers to mark as read.
  repeated int64 ids = 1 [(buf.validate.field).repeated.min_items = 1];
}

message MarkNotificationsReadResponse {
  // message is a human-readable result message.
  string message = 1;
}
