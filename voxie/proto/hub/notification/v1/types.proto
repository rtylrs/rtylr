syntax = "proto3";

package hub.notification.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/notification/v1";

// ── Notifications ───────────────────────────────────────────────────

message Notification {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // title is the title value for this contract.
  string title = 2;
  // body is the body value for this contract.
  string body = 3;
  // type is the type value for this contract.
  // info, warning, success, error
  string type = 4;
  // read is the read value for this contract.
  bool read = 5;
  // created_at is when the record was created.
  string created_at = 6;
  // link is the link value for this contract.
  string link = 7;
}
