syntax = "proto3";

package hub.v1;

option go_package = "github.com/voxire/voxie/gen/go/hub/v1";

// ── Billing ─────────────────────────────────────────────────────────

message BillingSummary {
  string plan = 1;
  string status = 2;
  double current_usage = 3;
  double usage_limit = 4;
  string next_billing_date = 5;
}

message GetBillingSummaryRequest {}

message GetBillingSummaryResponse {
  BillingSummary summary = 1;
}

message Invoice {
  int64 id = 1;
  double amount = 2;
  string currency = 3;
  string status = 4;
  string issued_at = 5;
  string paid_at = 6;
}

message ListInvoicesRequest {}

message ListInvoicesResponse {
  repeated Invoice invoices = 1;
}
