syntax = "proto3";

package hub;

option go_package = "github.com/voxire/voxie/gen/go/hub/v1";

// ── Activity ────────────────────────────────────────────────────────

message ActivityEntry {
  int64 id = 1;
  int64 owner_id = 2;
  string app = 3;
  string entity_type = 4;
  int64 entity_id = 5;
  string action = 6;
  string description = 7;
  int64 user_id = 8;
  string user_name = 9;
  string created_at = 10;
}

message ListActivityRequest {
  int32 limit = 1;
}

message ListActivityResponse {
  repeated ActivityEntry activities = 1;
}
