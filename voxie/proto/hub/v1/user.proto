syntax = "proto3";

package hub.v1;

option go_package = "github.com/voxire/voxie/gen/go/hub/v1";

// ── User / Auth ─────────────────────────────────────────────────────

message GetMeRequest {}

message GetMeResponse {
  int64 id = 1;
  string email = 2;
  string full_name = 3;
  repeated string apps = 4;
  string role = 5;
  int64 business_id = 6;
  string business_name = 7;
  bool is_owner = 8;
  bool onboarded = 9;
}

message UpdateProfileRequest {
  string name = 1;
  string email = 2;
}

message UpdateProfileResponse {
  GetMeResponse user = 1;
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}
