syntax = "proto3";

package hub;

option go_package = "github.com/voxire/voxie/gen/go/hub/v1";

// ── User / Auth ─────────────────────────────────────────────────────

message User {
  int64 id = 1;
  string email = 2;
  string name = 3;
  string first_name = 4;
  string last_name = 5;
  string role = 6; // owner, admin, operator, staff, viewer
  int64 business_id = 7;
  string business_name = 8;
  string avatar_url = 9;
  repeated string apps = 10; // App IDs the user has access to
  bool is_owner = 11;
  bool onboarded = 12;
  string theme = 13;
  string plan_type = 14;
}

message GetMeRequest {}
message GetMeResponse {
  User user = 1;
}
