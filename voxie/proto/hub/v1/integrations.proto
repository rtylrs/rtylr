syntax = "proto3";

package hub;

option go_package = "github.com/voxire/voxie/gen/go/hub/v1";

// ── Integrations ────────────────────────────────────────────────────

message Integration {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string provider = 4; // stripe, square, mailchimp, etc.
  string category = 5; // payment, marketing, accounting, etc.
  string icon = 6;
  bool is_connected = 7;
  string connected_at = 8;
  map<string, string> config = 9;
}

message ListIntegrationsRequest {}

message ListIntegrationsResponse {
  repeated Integration integrations = 1;
}

message ConnectIntegrationRequest {
  string provider = 1;
  map<string, string> credentials = 2;
}

message ConnectIntegrationResponse {
  Integration integration = 1;
}

message DisconnectIntegrationRequest {
  int64 id = 1;
}

message DisconnectIntegrationResponse {
  bool success = 1;
}
