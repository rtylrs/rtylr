syntax = "proto3";

package hub;

option go_package = "github.com/voxire/voxie/gen/go/hub/v1";

// ── Security ───────────────────────────────────────────────────────

message SecurityState {
  bool two_factor_enabled = 1;
  string two_factor_method = 2; // totp, sms
  string last_password_change = 3;
  repeated ActiveSession sessions = 4;
}

message ActiveSession {
  int64 id = 1;
  string device = 2;
  string ip_address = 3;
  string location = 4;
  string last_active_at = 5;
  bool is_current = 6;
}

message GetSecurityStateRequest {}

message GetSecurityStateResponse {
  SecurityState state = 1;
}

message Update2FARequest {
  bool enabled = 1;
  string method = 2; // totp, sms
  string verification_code = 3;
}

message Update2FAResponse {
  bool success = 1;
  string secret = 2; // TOTP secret (only on enable)
  string qr_code_url = 3; // QR code data URI (only on enable)
}

message RevokeSessionRequest {
  int64 session_id = 1;
}

message RevokeSessionResponse {
  bool success = 1;
}
