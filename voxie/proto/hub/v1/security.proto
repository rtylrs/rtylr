syntax = "proto3";

package hub;

option go_package = "github.com/voxire/voxie/gen/go/hub/v1";

// ── Security ───────────────────────────────────────────────────────

message SecurityState {
  bool two_factor_enabled = 1;
  repeated ActiveSession active_sessions = 2;
}

message ActiveSession {
  string id = 1;
  string ip = 2;
  string user_agent = 3;
  string created_at = 4;
  bool is_current = 5;
}

message GetSecurityStateRequest {}

message GetSecurityStateResponse {
  SecurityState state = 1;
}

message Update2FARequest {
  bool enabled = 1;
}

message Update2FAResponse {
  string message = 1;
}

message LoginEntry {
  string email = 1;
  string method = 2;
  string ip = 3;
  string user_agent = 4;
  bool success = 5;
  string created_at = 6;
}

message LoginHistoryRequest {}

message LoginHistoryResponse {
  repeated LoginEntry history = 1;
}

message InvalidateSessionsRequest {}

message InvalidateSessionsResponse {
  string message = 1;
}
