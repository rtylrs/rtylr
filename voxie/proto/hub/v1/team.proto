syntax = "proto3";

package hub;

option go_package = "github.com/voxire/voxie/gen/go/hub/v1";

// ── Team ────────────────────────────────────────────────────────────

message StaffUserPayload {
  int64 id = 1;
  string email = 2;
  string full_name = 3;
  string created_at = 4;
  repeated string apps = 5;
  string role = 6;
  bool is_active = 7;
}

message ListTeamRequest {}

message ListTeamResponse {
  repeated StaffUserPayload users = 1;
}

message InviteUserRequest {
  string email = 1;
  string full_name = 2;
  string role = 3;
  repeated string apps = 4;
  string password = 5;
}

message InviteUserResponse {
  int64 user_id = 1;
  string message = 2;
}

message UpdatePermissionsRequest {
  int64 user_id = 1;
  repeated string apps = 2;
  string role = 3;
}

message UpdatePermissionsResponse {}

message RemoveMemberRequest {
  int64 user_id = 1;
}

message RemoveMemberResponse {
  string message = 1;
}

message VerifyInviteRequest {
  string token = 1;
}

message VerifyInviteResponse {
  string email = 1;
  string full_name = 2;
  bool valid = 3;
}

message AcceptInviteRequest {
  string token = 1;
  string password = 2;
}

message AcceptInviteResponse {
  string message = 1;
}

message MarkOnboardedRequest {}

message MarkOnboardedResponse {
  string message = 1;
}

message RequestAccessRequest {
  string app = 1;
}

message RequestAccessResponse {
  string message = 1;
}
