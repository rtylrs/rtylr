syntax = "proto3";

package hub.v1;

option go_package = "github.com/voxire/voxie/gen/go/hub/v1";

// ── Business ────────────────────────────────────────────────────────

message Business {
  int64 id = 1;
  string name = 2;
  string type = 3; // restaurant, retail, services, etc.
  string logo_url = 4;
  string address = 5;
  string phone = 6;
  string email = 7;
  string website = 8;
  string timezone = 9;
  string currency = 10;
  string country = 11;
  string plan = 12;
  string created_at = 13;
  // URL-safe slug. Powers public surfaces like menu.rtylr.com/<slug>.
  string slug = 14;
}

message GetBusinessRequest {
  int64 business_id = 1;
}

message GetBusinessResponse {
  Business business = 1;
}

message UpdateBusinessRequest {
  int64 business_id = 1;
  string name = 2;
  string type = 3;
  string address = 4;
  string phone = 5;
  string email = 6;
  string website = 7;
  string timezone = 8;
  string currency = 9;
  optional string slug = 10;
}

message UpdateBusinessResponse {
  Business business = 1;
}

// ── Public lookup ───────────────────────────────────────────────────
// Powers menu.rtylr.com/<slug>: resolves a public slug into a business
// summary plus its visible locations so the menu app can render a
// location picker before drilling into a specific menu.

message PublicLocation {
  int64 id = 1;
  string name = 2;
  string slug = 3;
  string address = 4;
  string timezone = 5;
  bool is_active = 6;
}

message PublicBusinessSummary {
  int64 id = 1;
  string name = 2;
  string slug = 3;
  string logo_url = 4;
  string currency = 5;
  string type = 6;
}

message LookupBusinessBySlugRequest {
  string slug = 1;
}

message LookupBusinessBySlugResponse {
  PublicBusinessSummary business = 1;
  repeated PublicLocation locations = 2;
}
