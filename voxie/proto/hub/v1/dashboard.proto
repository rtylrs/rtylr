syntax = "proto3";

package hub.v1;

option go_package = "github.com/voxire/voxie/gen/go/hub/v1";

// ── Dashboard KPIs ──────────────────────────────────────────────────

message GetKPIsRequest {}

message GetKPIsResponse {
  double revenue = 1;
  int64 order_count = 2;
  int64 staff_count = 3;
  int64 customer_count = 4;
  int64 low_stock_count = 5;
  int64 active_apps = 6;
}
