syntax = "proto3";

package hub.app.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/app/v1";

// ── Apps ────────────────────────────────────────────────────────────

message App {
  // id is the unique identifier for the resource.
  string id = 1;
  // name is the name value for this contract.
  string name = 2;
  // description is the description value for this contract.
  string description = 3;
  // icon is the icon value for this contract.
  string icon = 4;
  // is_enabled is the is enabled value for this contract.
  bool is_enabled = 5;
}

// ── Addons ──────────────────────────────────────────────────────────

message Addon {
  // id is the unique identifier for the resource.
  string id = 1;
  // name is the name value for this contract.
  string name = 2;
  // description is the description value for this contract.
  string description = 3;
  // icon is the icon value for this contract.
  string icon = 4;
  // price is the price value for this contract.
  double price = 5;
  // is_free is the is free value for this contract.
  bool is_free = 6;
  // is_enabled is the is enabled value for this contract.
  bool is_enabled = 7;
  // enabled_at is the enabled at value for this contract.
  optional string enabled_at = 8 [
    (onekit.http.nullable) = true
  ];
  // disabled_at is the disabled at value for this contract.
  optional string disabled_at = 9 [
    (onekit.http.nullable) = true
  ];
}
