syntax = "proto3";

package hub.app.v1;

option go_package = "github.com/voxire/voxie/gen/go/hub/app/v1";

message EnableAddonRequest {
  // addon_id is the addon id value for this contract.
  string addon_id = 1;
}

message EnableAddonResponse {
  // message is a human-readable result message.
  string message = 1;
}
