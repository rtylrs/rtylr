syntax = "proto3";

package hub.app.v1;

option go_package = "github.com/voxire/voxie/gen/go/hub/app/v1";

message AddonStatusRequest {
  // addon_id is the addon id value for this contract.
  string addon_id = 1;
}

message AddonStatusResponse {
  // is_enabled is the is enabled value for this contract.
  bool is_enabled = 1;
}
