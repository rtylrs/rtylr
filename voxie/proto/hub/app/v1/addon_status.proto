syntax = "proto3";

package hub.app.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/app/v1";

message AddonStatusRequest {
  // addon_id identifies the addon whose status is requested.
  string addon_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (onekit.http.query).name = "addon_id"
  ];
}

message AddonStatusResponse {
  // is_enabled is the is enabled value for this contract.
  bool is_enabled = 1;
}
