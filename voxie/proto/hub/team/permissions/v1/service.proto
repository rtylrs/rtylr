syntax = "proto3";

package hub.team.permissions.v1;

import "hub/team/permissions/v1/update_permissions.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/team/permissions/v1";

// PermissionsService defines hub team permission endpoints.
service PermissionsService {
  option (onekit.http.service_config) = {base_path: "/api/hub/team/permissions/v1"};

  // UpdatePermissions assigns apps and role for a team member.
  rpc UpdatePermissions(UpdatePermissionsRequest) returns (UpdatePermissionsResponse) {
    option (onekit.http.config) = {
      path: "/permissions/{user_id}"
      method: HTTP_METHOD_PUT
    };
  }
}
