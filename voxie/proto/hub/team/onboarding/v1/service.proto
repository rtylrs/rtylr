syntax = "proto3";

package hub.team.onboarding.v1;

import "hub/team/onboarding/v1/mark_onboarded.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/team/onboarding/v1";

// OnboardingService defines hub team onboarding endpoints.
service OnboardingService {
  option (onekit.http.service_config) = {base_path: ""};

  // MarkOnboarded marks the current user as onboarded.
  rpc MarkOnboarded(MarkOnboardedRequest) returns (MarkOnboardedResponse) {
    option (onekit.http.config) = {
      path: "/user/onboarded"
      method: HTTP_METHOD_GET
    };
  }
}
