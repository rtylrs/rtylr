syntax = "proto3";

package hub.team.members.v1;

import "buf/validate/validate.proto";
import "hub/team/members/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/team/members/v1";

message GetMemberRequest {
  // user_id identifies the member to fetch.
  int64 user_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}

message GetMemberResponse {
  // user is the user value for this contract.
  StaffUserWithGroups user = 1;
}
