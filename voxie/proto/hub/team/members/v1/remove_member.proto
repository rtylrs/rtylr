syntax = "proto3";

package hub.team.members.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/team/members/v1";

message RemoveMemberRequest {
  // id is the team member user id to deactivate.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}

message RemoveMemberResponse {
  // message is a human-readable result message.
  string message = 1;
}
