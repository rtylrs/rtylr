syntax = "proto3";

package hub.team.members.v1;

import "hub/team/members/v1/get_member.proto";
import "hub/team/members/v1/list_members.proto";
import "hub/team/members/v1/remove_member.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/team/members/v1";

// MembersService defines hub team member endpoints.
service MembersService {
  option (onekit.http.service_config) = {base_path: "/api/hub/team/members/v1"};

  // ListTeam returns team members for the active business.
  rpc ListTeam(ListTeamRequest) returns (ListTeamResponse) {
    option (onekit.http.config) = {
      path: "/members"
      method: HTTP_METHOD_GET
    };
  }

  // GetMember returns a single team member with their groups.
  rpc GetMember(GetMemberRequest) returns (GetMemberResponse) {
    option (onekit.http.config) = {
      path: "/members/{user_id}"
      method: HTTP_METHOD_GET
    };
  }

  // RemoveMember removes a member from the team.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse) {
    option (onekit.http.config) = {
      path: "/members/{user_id}"
      method: HTTP_METHOD_DELETE
    };
  }
}
