syntax = "proto3";

package hub.team.access.v1;

import "hub/team/access/v1/request_access.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/team/access/v1";

// AccessService defines hub team access request endpoints.
service AccessService {
  option (onekit.http.service_config) = {base_path: ""};

  // RequestAccess submits a request for app access.
  rpc RequestAccess(RequestAccessRequest) returns (RequestAccessResponse) {
    option (onekit.http.config) = {
      path: "/team/request-access"
      method: HTTP_METHOD_POST
    };
  }
}
