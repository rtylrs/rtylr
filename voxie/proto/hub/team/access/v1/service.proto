syntax = "proto3";

package hub.team.access.v1;

import "hub/team/access/v1/approve_access_request.proto";
import "hub/team/access/v1/list_access_requests.proto";
import "hub/team/access/v1/request_access.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/team/access/v1";

// AccessService defines hub team access request endpoints.
service AccessService {
  option (onekit.http.service_config) = {base_path: "/api/hub/team/access/v1"};

  // RequestAccess submits a request for app access.
  rpc RequestAccess(RequestAccessRequest) returns (RequestAccessResponse) {
    option (onekit.http.config) = {
      path: "/requests"
      method: HTTP_METHOD_POST
    };
  }

  // ListAccessRequests returns pending access requests for the business.
  rpc ListAccessRequests(ListAccessRequestsRequest) returns (ListAccessRequestsResponse) {
    option (onekit.http.config) = {
      path: "/requests"
      method: HTTP_METHOD_GET
    };
  }

  // ApproveAccessRequest grants the requested app access.
  rpc ApproveAccessRequest(ApproveAccessRequestRequest) returns (ApproveAccessRequestResponse) {
    option (onekit.http.config) = {
      path: "/requests/{id}/approve"
      method: HTTP_METHOD_POST
    };
  }
}
