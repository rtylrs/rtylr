syntax = "proto3";

package hub.team.access.v1;

option go_package = "github.com/voxire/voxie/gen/go/hub/team/access/v1";

message RequestAccessRequest {
  // app is the app value for this contract.
  string app = 1;
}

message RequestAccessResponse {
  // message is a human-readable result message.
  string message = 1;
}
