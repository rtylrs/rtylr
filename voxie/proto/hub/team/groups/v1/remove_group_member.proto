syntax = "proto3";

package hub.team.groups.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/team/groups/v1";

message RemoveGroupMemberRequest {
  // id is the unique identifier for the group.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // user_id identifies the user associated with this request.
  int64 user_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}

message RemoveGroupMemberResponse {
  // message is a human-readable result message.
  string message = 1;
}
