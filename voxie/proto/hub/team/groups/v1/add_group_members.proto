syntax = "proto3";

package hub.team.groups.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/team/groups/v1";

message AddGroupMembersRequest {
  // id is the unique identifier for the group.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // user_ids is the user ids value for this contract.
  repeated int64 user_ids = 2 [(buf.validate.field).repeated.min_items = 1];
}

message AddGroupMembersResponse {
  // added is the number of members added.
  int32 added = 1;
  // message is a human-readable result message.
  string message = 2;
}
