syntax = "proto3";

package hub.team.groups.v1;

import "buf/validate/validate.proto";
import "hub/team/groups/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/team/groups/v1";

message UpdateGroupRequest {
  // id is the unique identifier for the group.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // name is the name value for this contract.
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // description is the description value for this contract.
  string description = 3;
  // color is the color value for this contract.
  string color = 4;
  // resource_permissions is the resource permissions value for this contract.
  repeated ResourcePermission resource_permissions = 5;
}

message UpdateGroupResponse {
  // group is the group value for this contract.
  Group group = 1;
}
