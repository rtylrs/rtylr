syntax = "proto3";

package hub.team.groups.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/team/groups/v1";

// ── Groups ──────────────────────────────────────────────────────────

message ResourcePermission {
  // resource_key is the resource key value for this contract.
  string resource_key = 1;
  // permission_level is the permission level value for this contract.
  string permission_level = 2;
}

message GroupSummary {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // name is the name value for this contract.
  string name = 2;
  // color is the color value for this contract.
  string color = 3;
}

message Group {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // owner_id identifies the owner of the group.
  int64 owner_id = 2 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // name is the name value for this contract.
  string name = 3;
  // description is the description value for this contract.
  string description = 4;
  // color is the color value for this contract.
  string color = 5;
  // resource_permissions is the resource permissions value for this contract.
  repeated ResourcePermission resource_permissions = 6;
  // member_count is the member count value for this contract.
  int32 member_count = 7;
  // created_at is when the record was created.
  string created_at = 8;
  // updated_at is when the record was last updated.
  string updated_at = 9;
}

message GroupMember {
  // user_id identifies the member user.
  int64 user_id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // email is the email address used for lookup or contact.
  string email = 2;
  // full_name is the full name value for this contract.
  string full_name = 3;
  // added_at is when the member was added to the group.
  string added_at = 4;
}

// GroupDetail mirrors Group with the member list flattened alongside it
// (the legacy payload embeds the group fields at the top level).
message GroupDetail {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // owner_id identifies the owner of the group.
  int64 owner_id = 2 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // name is the name value for this contract.
  string name = 3;
  // description is the description value for this contract.
  string description = 4;
  // color is the color value for this contract.
  string color = 5;
  // resource_permissions is the resource permissions value for this contract.
  repeated ResourcePermission resource_permissions = 6;
  // member_count is the member count value for this contract.
  int32 member_count = 7;
  // created_at is when the record was created.
  string created_at = 8;
  // updated_at is when the record was last updated.
  string updated_at = 9;
  // members is the members value for this contract.
  repeated GroupMember members = 10;
}
