syntax = "proto3";

package hub.team.invitations.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/team/invitations/v1";

message InviteUserRequest {
  // email is the email address used for lookup or contact.
  string email = 1 [(buf.validate.field).string = {
    min_len: 1
    email: true
  }];
  // full_name is the full name value for this contract.
  string full_name = 2 [(buf.validate.field).string.min_len = 1];
  // role is the role value for this contract.
  string role = 3 [(buf.validate.field).string.min_len = 1];
  // apps is the apps value for this contract.
  repeated string apps = 4;
  // password is the user-provided secret for authentication.
  string password = 5 [(buf.validate.field).string.min_len = 1];
}

message InviteUserResponse {
  // user_id identifies the user associated with this request.
  int64 user_id = 1;
  // message is a human-readable result message.
  string message = 2;
}
