syntax = "proto3";

package hub.team.invitations.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/team/invitations/v1";

message BulkInviteRequest {
  // emails is the list of email addresses to invite.
  repeated string emails = 1 [(buf.validate.field).repeated.min_items = 1];
  // role is the role value for this contract.
  string role = 2;
  // apps is the apps value for this contract.
  repeated string apps = 3;
  // group_id identifies an optional group to add invitees to.
  int64 group_id = 4 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}

message BulkInviteResult {
  // email is the email address used for lookup or contact.
  string email = 1;
  // user_id identifies the user associated with this request.
  int64 user_id = 2 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // status is the status value for this contract.
  string status = 3;
  // message is a human-readable result message.
  string message = 4;
}

message BulkInviteResponse {
  // results is the per-email invite outcome list.
  repeated BulkInviteResult results = 1;
  // message is a human-readable result message.
  string message = 2;
}
