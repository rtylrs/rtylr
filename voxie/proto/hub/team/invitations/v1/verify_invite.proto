syntax = "proto3";

package hub.team.invitations.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/team/invitations/v1";

message VerifyInviteRequest {
  // token is the opaque token used to complete the operation.
  string token = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (onekit.http.query).name = "token"
  ];
}

message VerifyInviteResponse {
  // email is the email address used for lookup or contact.
  string email = 1;
  // full_name is the full name value for this contract.
  string full_name = 2;
  // apps is the apps granted by the invitation.
  repeated string apps = 3;
  // valid is the valid value for this contract.
  bool valid = 4;
}
