syntax = "proto3";

package hub.dashboard.v1;

import "hub/dashboard/v1/get_kpis.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/dashboard/v1";

// DashboardService defines hub dashboard endpoints.
service DashboardService {
  option (onekit.http.service_config) = {base_path: ""};

  // GetKPIs returns key performance indicators for the active business.
  rpc GetKPIs(GetKPIsRequest) returns (GetKPIsResponse) {
    option (onekit.http.config) = {
      path: "/hub/kpis"
      method: HTTP_METHOD_GET
    };
  }
}
