syntax = "proto3";

package hub;

option go_package = "github.com/voxire/voxie/gen/go/hub";

// ── Business ────────────────────────────────────────────────────────

message Business {
  int64 id = 1;
  string name = 2;
  string type = 3; // restaurant, retail, services, etc.
  string logo_url = 4;
  string address = 5;
  string phone = 6;
  string email = 7;
  string website = 8;
  string timezone = 9;
  string currency = 10;
  string country = 11;
  string plan = 12;
  string created_at = 13;
}

message GetBusinessRequest {
  int64 business_id = 1;
}

message GetBusinessResponse {
  Business business = 1;
}

message UpdateBusinessRequest {
  int64 business_id = 1;
  string name = 2;
  string type = 3;
  string address = 4;
  string phone = 5;
  string email = 6;
  string website = 7;
  string timezone = 8;
  string currency = 9;
}

message UpdateBusinessResponse {
  Business business = 1;
}

// ── Config ──────────────────────────────────────────────────────────

message GetConfigRequest {}

message GetConfigResponse {
  Business business = 1;
  bool maintenance = 2;
}
