syntax = "proto3";

package hub.business.v1;

import "buf/validate/validate.proto";
import "hub/business/v1/types.proto";
import "onekit/http/annotations.proto";


option go_package = "github.com/voxire/voxie/gen/go/hub/business/v1";

message UpdateBusinessBody {
  // name is the name value for this contract.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // type is the type value for this contract.
  string type = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // address is the address value for this contract.
  string address = 3;
  // phone is the phone value for this contract.
  string phone = 4;
  // email is the email address used for lookup or contact.
  string email = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      email: true
    }
  ];
  // website is the website value for this contract.
  string website = 6;
  // timezone is the timezone value for this contract.
  string timezone = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // currency is the currency value for this contract.
  string currency = 8 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // slug is the slug value for this contract.
  optional string slug = 9 [
    (onekit.http.nullable) = true
  ];
}

message UpdateBusinessRequest {
  // business_id is the business id value for this contract.
  int64 business_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // body carries updatable business fields bound from the HTTP payload.
  UpdateBusinessBody body = 2;
}

message UpdateBusinessResponse {
  // business is the business value for this contract.
  Business business = 1;
}
