syntax = "proto3";

package hub.business.v1;

import "hub/business/v1/get_business.proto";
import "hub/business/v1/lookup_business_by_slug.proto";
import "hub/business/v1/set_slug.proto";
import "hub/business/v1/update_business.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/business/v1";

// BusinessService defines hub business endpoints.
service BusinessService {
  option (onekit.http.service_config) = {base_path: "/api/hub/business/v1"};

  // GetBusiness returns a business by ID.
  rpc GetBusiness(GetBusinessRequest) returns (GetBusinessResponse) {
    option (onekit.http.config) = {
      path: "/businesses/{business_id}"
      method: HTTP_METHOD_GET
    };
  }

  // LookupBusinessBySlug resolves a business by public slug.
  rpc LookupBusinessBySlug(LookupBusinessBySlugRequest) returns (LookupBusinessBySlugResponse) {
    option (onekit.http.config) = {
      path: "/businesses/by-slug"
      method: HTTP_METHOD_GET
    };
  }

  // SetSlug updates only the business slug.
  rpc SetSlug(SetSlugRequest) returns (SetSlugResponse) {
    option (onekit.http.config) = {
      path: "/businesses/slug"
      method: HTTP_METHOD_PATCH
    };
  }

  // UpdateBusiness updates an existing business.
  rpc UpdateBusiness(UpdateBusinessRequest) returns (UpdateBusinessResponse) {
    option (onekit.http.config) = {
      path: "/businesses/{business_id}"
      method: HTTP_METHOD_PUT
    };
  }
}
