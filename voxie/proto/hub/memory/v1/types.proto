syntax = "proto3";

package hub.memory.v1;

option go_package = "github.com/voxire/voxie/gen/go/hub/memory/v1";

message ChatSummary {
  string id = 1;
  string title = 2;
  string summary = 3;
  string updated_at = 4;
  bool pinned = 5;
  bool archived = 6;
}

message ChatMessage {
  string id = 1;
  string role = 2;
  string content = 3;
  string created_at = 4;
  int32 tokens_used = 5;
}
