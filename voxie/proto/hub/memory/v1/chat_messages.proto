syntax = "proto3";

package hub.memory.v1;

import "hub/memory/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/memory/v1";

message ListChatsRequest {
  int32 limit = 1 [(onekit.http.query).name = "limit"];
  int32 offset = 2 [(onekit.http.query).name = "offset"];
}

message ListChatsResponse {
  repeated ChatSummary chats = 1;
}

message GetChatMessagesRequest {
  string session_id = 1;
}

message GetChatMessagesResponse {
  repeated ChatMessage messages = 1;
}

message DeleteChatRequest {
  string session_id = 1;
}

message DeleteChatResponse {
  bool deleted = 1;
}

message RenameChatRequest {
  string session_id = 1;
  string title = 2;
}

message RenameChatResponse {
  bool updated = 1;
}

message PinChatRequest {
  string session_id = 1;
  bool pinned = 2;
}

message PinChatResponse {
  bool updated = 1;
}
