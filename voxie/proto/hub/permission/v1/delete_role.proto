syntax = "proto3";

package hub.permission.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/permission/v1";

message DeleteRoleRequest {
  // id is the unique identifier for the role.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING,
    (onekit.http.query).name = "id"
  ];
}

message DeleteRoleResponse {
  // message is a human-readable result message.
  string message = 1;
}
