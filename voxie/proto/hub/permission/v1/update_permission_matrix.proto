syntax = "proto3";

package hub.permission.v1;

option go_package = "github.com/voxire/voxie/gen/go/hub/permission/v1";

message UpdatePermissionMatrixRequest {
  // role is the role value for this contract.
  string role = 1;
  // permission_key is the permission key value for this contract.
  string permission_key = 2;
  // enabled is the enabled value for this contract.
  bool enabled = 3;
}

message UpdatePermissionMatrixResponse {
  // success is the success value for this contract.
  bool success = 1;
}
