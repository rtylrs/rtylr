syntax = "proto3";

package hub.permission.v1;

import "hub/permission/v1/create_role.proto";
import "hub/permission/v1/delete_role.proto";
import "hub/permission/v1/get_permissions.proto";
import "hub/permission/v1/list_roles.proto";
import "hub/permission/v1/update_permission_matrix.proto";
import "hub/permission/v1/update_role.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/permission/v1";

// PermissionService defines hub permission and role endpoints.
service PermissionService {
  option (onekit.http.service_config) = {base_path: "/api/hub/permission/v1"};

  // GetPermissions returns the permission matrix.
  rpc GetPermissions(GetPermissionsRequest) returns (GetPermissionsResponse) {
    option (onekit.http.config) = {
      path: "/permissions"
      method: HTTP_METHOD_GET
    };
  }

  // ListRoles returns defined roles.
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (onekit.http.config) = {
      path: "/roles"
      method: HTTP_METHOD_GET
    };
  }

  // CreateRole creates a new role.
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {
    option (onekit.http.config) = {
      path: "/roles"
      method: HTTP_METHOD_POST
    };
  }

  // UpdateRole updates an existing role.
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse) {
    option (onekit.http.config) = {
      path: "/roles/{id}"
      method: HTTP_METHOD_PUT
    };
  }

  // DeleteRole deletes a role.
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse) {
    option (onekit.http.config) = {
      path: "/roles/{id}"
      method: HTTP_METHOD_DELETE
    };
  }

  // UpdatePermissionMatrix toggles a single permission cell.
  rpc UpdatePermissionMatrix(UpdatePermissionMatrixRequest) returns (UpdatePermissionMatrixResponse) {
    option (onekit.http.config) = {
      path: "/matrix"
      method: HTTP_METHOD_PATCH
    };
  }
}
