syntax = "proto3";

package hub.ai.v1;

import "hub/ai/v1/get_ai_usage.proto";
import "hub/ai/v1/quota_settings.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/ai/v1";

service AiService {
  option (onekit.http.service_config) = {base_path: "/api/hub/ai/v1"};

  rpc GetAiUsage(GetAiUsageRequest) returns (GetAiUsageResponse) {
    option (onekit.http.config) = {
      path: "/usage"
      method: HTTP_METHOD_GET
    };
  }

  rpc GetAiQuotaSettings(GetAiQuotaSettingsRequest) returns (GetAiQuotaSettingsResponse) {
    option (onekit.http.config) = {
      path: "/quota-settings"
      method: HTTP_METHOD_GET
    };
  }

  rpc UpdateAiQuotaSettings(UpdateAiQuotaSettingsRequest) returns (UpdateAiQuotaSettingsResponse) {
    option (onekit.http.config) = {
      path: "/quota-settings"
      method: HTTP_METHOD_PUT
    };
  }
}
