syntax = "proto3";

package hub.user.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/user/v1";

message ChangePasswordRequest {
  // current_password is the current password value for this contract.
  string current_password = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // new_password is the new password value for this contract.
  string new_password = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message ChangePasswordResponse {}
