syntax = "proto3";

package hr.approval_chain.v1;

import "buf/validate/validate.proto";
import "hr/approval_chain/v1/types.proto";
import "onekit/http/annotations.proto";


option go_package = "github.com/voxire/voxie/gen/go/hr/approval_chain/v1";

// ── Upsert Approval Chain ─────────────────────────────────────────

message UpsertApprovalChainRequest {
  // Chain ID for update; absent (zero) to create a new chain.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // Type of request this chain governs (timesheet | leave | overtime | equipment | payroll).
  string request_type = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // Human-readable name for the chain.
  string name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // Whether approvers can delegate their approval authority.
  bool delegation_enabled = 4;
  // Ordered levels to set on the chain; replaces all existing levels.
  repeated ApprovalChainLevelPayload levels = 5 [(buf.validate.field).repeated.min_items = 1];
}

message UpsertApprovalChainResponse {
  // The created or updated approval chain.
  ApprovalChainPayload chain = 1;
}
