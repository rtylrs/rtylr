syntax = "proto3";

package hr.time_entry.v1;

import "hr/time_entry/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/time_entry/v1";

// ── List Timesheets ───────────────────────────────────────────────

message ListTimesheetsRequest {
  // Filter by employee; absent to include all employees.
  optional int64 employee_id = 1 [(onekit.http.query).name = "employee_id"];
  // Filter by status; absent to include all statuses.
  optional string status = 2 [(onekit.http.query).name = "status"];
}

message ListTimesheetsResponse {
  // Page of timesheets matching the filters.
  repeated TimesheetPayload timesheets = 1;
  // Total number of matching timesheets across all pages.
  int64 total = 2;
  // Page size used for this request.
  int32 limit = 3;
  // Offset used for this request.
  int32 offset = 4;
}
