syntax = "proto3";

package hr.time_entry.v1;

import "hr/time_entry/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/time_entry/v1";

// ── List Time Entries ─────────────────────────────────────────────

message ListTimeEntriesRequest {
  // Filter by employee; absent to include all employees.
  optional int64 employee_id = 1 [(onekit.http.query).name = "employee_id"];
  // Filter by date; absent to include all dates.
  optional string date = 2 [(onekit.http.query).name = "date"];
}

message ListTimeEntriesResponse {
  // Time entries matching the filters.
  repeated TimeEntryPayload entries = 1;
  // Total number of matching time entries across all pages.
  int64 total = 2;
  // Page size used for this request.
  int32 limit = 3;
  // Offset used for this request.
  int32 offset = 4;
}
