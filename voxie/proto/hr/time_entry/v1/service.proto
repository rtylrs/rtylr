syntax = "proto3";

package hr.time_entry.v1;

import "hr/time_entry/v1/approve_timesheet.proto";
import "hr/time_entry/v1/create_time_entry.proto";
import "hr/time_entry/v1/list_time_entries.proto";
import "hr/time_entry/v1/list_timesheets.proto";
import "hr/time_entry/v1/submit_timesheet.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/time_entry/v1";

// TimeEntryService defines HR time entry and timesheet endpoints.
service TimeEntryService {
  option (onekit.http.service_config) = {base_path: "/api/hr/time-entry/v1"};

  // ListTimeEntries returns time entries with optional filters.
  rpc ListTimeEntries(ListTimeEntriesRequest) returns (ListTimeEntriesResponse) {
    option (onekit.http.config) = {
      path: "/time-entries"
      method: HTTP_METHOD_GET
    };
  }

  // CreateTimeEntry creates a new time entry.
  rpc CreateTimeEntry(CreateTimeEntryRequest) returns (CreateTimeEntryResponse) {
    option (onekit.http.config) = {
      path: "/time-entries"
      method: HTTP_METHOD_POST
    };
  }

  // ListTimesheets returns timesheets with optional filters.
  rpc ListTimesheets(ListTimesheetsRequest) returns (ListTimesheetsResponse) {
    option (onekit.http.config) = {
      path: "/timesheets"
      method: HTTP_METHOD_GET
    };
  }

  // SubmitTimesheet submits a timesheet for approval.
  rpc SubmitTimesheet(SubmitTimesheetRequest) returns (SubmitTimesheetResponse) {
    option (onekit.http.config) = {
      path: "/timesheets"
      method: HTTP_METHOD_POST
    };
  }

  // ApproveTimesheet approves a submitted timesheet.
  rpc ApproveTimesheet(ApproveTimesheetRequest) returns (ApproveTimesheetResponse) {
    option (onekit.http.config) = {
      path: "/timesheets/{id}/approve"
      method: HTTP_METHOD_PATCH
      body: "body"
    };
  }
}
