syntax = "proto3";

package hr.employees.payroll.runs.v1;

import "buf/validate/validate.proto";
import "hr/employees/payroll/runs/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/employees/payroll/runs/v1";

// ── Trigger Payroll Run ──────────────────────────────────────────────

message TriggerPayrollRunRequest {
  // Start of the pay period to process (ISO-8601 date).
  string period_start = 1 [(buf.validate.field).string.min_len = 1];
  // End of the pay period to process (ISO-8601 date).
  string period_end = 2 [(buf.validate.field).string.min_len = 1];
}

message TriggerPayrollRunResponse {
  // The newly created payroll run with computed entries.
  PayrollRunPayload run = 1;
}
