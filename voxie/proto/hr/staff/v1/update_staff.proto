syntax = "proto3";

package hr.staff.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/staff/v1";

message UpdateStaffRequest {
  // id is the unique identifier for the resource.
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
  // department_id is the department id value for this contract.
  int64 department_id = 2 [(buf.validate.field).int64.gt = 0];
  // first_name is the first name value for this contract.
  string first_name = 3 [(buf.validate.field).string.min_len = 1];
  // last_name is the last name value for this contract.
  string last_name = 4 [(buf.validate.field).string.min_len = 1];
  // email is the email address used for lookup or contact.
  string email = 5 [(buf.validate.field).string = {
    min_len: 1
    email: true
  }];
  // phone is the phone value for this contract.
  string phone = 6;
  // role is the role value for this contract.
  string role = 7 [(buf.validate.field).string.min_len = 1];
  // employment_type is the employment type value for this contract.
  string employment_type = 8 [(buf.validate.field).string.min_len = 1];
  // status is the current lifecycle state.
  string status = 9 [(buf.validate.field).string.min_len = 1];
  // salary is the salary value for this contract.
  double salary = 10 [(buf.validate.field).double.gte = 0];
  // hourly_rate is the hourly rate value for this contract.
  double hourly_rate = 11 [(buf.validate.field).double.gte = 0];
  // overtime_rate is the overtime rate value for this contract.
  double overtime_rate = 12 [(buf.validate.field).double.gte = 0];
  // end_date is the end date value for this contract.
  string end_date = 13 [(buf.validate.field).string.min_len = 1];
  // address is the address value for this contract.
  string address = 14;
  // emergency_contact_name is the emergency contact name value for this contract.
  string emergency_contact_name = 15 [(buf.validate.field).string.min_len = 1];
  // emergency_contact_phone is the emergency contact phone value for this contract.
  string emergency_contact_phone = 16 [(buf.validate.field).string.min_len = 1];
  // apps is the apps value for this contract.
  string apps = 17 [(buf.validate.field).string.min_len = 1];
  // notes is the notes value for this contract.
  string notes = 18;
}

message UpdateStaffResponse {
  // success is the success value for this contract.
  bool success = 1;
}
