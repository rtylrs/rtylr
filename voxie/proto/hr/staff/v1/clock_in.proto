syntax = "proto3";

package hr.staff.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/staff/v1";

message ClockInRequest {
  // staff_id is the staff id value for this contract.
  int64 staff_id = 1 [(buf.validate.field).int64.gt = 0];
}

message ClockInResponse {
  // success is the success value for this contract.
  bool success = 1;
}
