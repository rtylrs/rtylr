syntax = "proto3";

package hr.staff.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";


option go_package = "github.com/voxire/voxie/gen/go/hr/staff/v1";

message ClockInRequest {
  // staff_id is the staff id value for this contract.
  int64 staff_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}

message ClockInResponse {
  // success is the success value for this contract.
  bool success = 1;
}
