syntax = "proto3";

package hr.staff.v1;

option go_package = "github.com/voxire/voxie/gen/go/hr/staff/v1";

message DeleteStaffRequest {
  // id is the unique identifier for the resource.
  int64 id = 1;
}

message DeleteStaffResponse {
  // success is the success value for this contract.
  bool success = 1;
}
