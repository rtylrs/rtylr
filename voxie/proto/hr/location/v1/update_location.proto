syntax = "proto3";

package hr.location.v1;

import "buf/validate/validate.proto";
import "hr/location/v1/types.proto";
import "onekit/http/annotations.proto";


option go_package = "github.com/voxire/voxie/gen/go/hr/location/v1";

// ── Update ─────────────────────────────────────────────────────────

message UpdateLocationRequest {
  // ID of the location to update.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // New name; absent to keep current.
  optional string name = 2 [
    (onekit.http.nullable) = true
  ];
  // New address; absent to keep current.
  optional string address = 3 [
    (onekit.http.nullable) = true
  ];
  // New timezone; absent to keep current.
  optional string timezone = 4 [
    (onekit.http.nullable) = true
  ];
  // New active status; absent to keep current.
  optional bool is_active = 5 [
    (onekit.http.nullable) = true
  ];
  // New slug; absent to keep current.
  optional string slug = 6 [
    (onekit.http.nullable) = true
  ];
}

message UpdateLocationResponse {
  // The updated location.
  LocationPayload location = 1;
}
