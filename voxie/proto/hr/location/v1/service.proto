syntax = "proto3";

package hr.location.v1;

import "hr/location/v1/create_location.proto";
import "hr/location/v1/update_location.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/location/v1";

// LocationService defines HR location endpoints.
service LocationService {
  option (onekit.http.service_config) = {base_path: "/api/hr/location/v1"};

  // CreateLocation creates a new location.
  rpc CreateLocation(CreateLocationRequest) returns (CreateLocationResponse) {
    option (onekit.http.config) = {
      path: "/locations"
      method: HTTP_METHOD_POST
    };
  }

  // UpdateLocation updates an existing location.
  rpc UpdateLocation(UpdateLocationRequest) returns (UpdateLocationResponse) {
    option (onekit.http.config) = {
      path: "/locations/{id}"
      method: HTTP_METHOD_PUT
    };
  }
}
