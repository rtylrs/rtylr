syntax = "proto3";

package hr.attendance.v1;

import "hr/attendance/v1/attendance_clock_in.proto";
import "hr/attendance/v1/attendance_clock_out.proto";
import "hr/attendance/v1/list_attendance.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/attendance/v1";

// AttendanceService defines HR attendance endpoints.
service AttendanceService {
  option (onekit.http.service_config) = {base_path: "/api/hr/attendance/v1"};

  // ListAttendance returns attendance records with optional filters.
  rpc ListAttendance(ListAttendanceRequest) returns (ListAttendanceResponse) {
    option (onekit.http.config) = {
      path: "/attendance"
      method: HTTP_METHOD_GET
    };
  }

  // AttendanceClockIn records an attendance clock-in.
  rpc AttendanceClockIn(AttendanceClockInRequest) returns (AttendanceClockInResponse) {
    option (onekit.http.config) = {
      path: "/attendance/clock-in"
      method: HTTP_METHOD_POST
    };
  }

  // AttendanceClockOut records an attendance clock-out.
  rpc AttendanceClockOut(AttendanceClockOutRequest) returns (AttendanceClockOutResponse) {
    option (onekit.http.config) = {
      path: "/attendance/clock-out"
      method: HTTP_METHOD_POST
    };
  }
}
