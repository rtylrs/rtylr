syntax = "proto3";

package hr.benefit.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/benefit/v1";

message CreateBenefitRequest {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string type = 2;
  string provider = 3;
  double cost_employer = 4;
  double cost_employee = 5;
  bool is_active = 6;
}

message CreateBenefitResponse {
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  string message = 2;
}
