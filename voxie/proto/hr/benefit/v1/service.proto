syntax = "proto3";

package hr.benefit.v1;

import "hr/benefit/v1/create_benefit.proto";
import "hr/benefit/v1/list_benefits.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/benefit/v1";

service BenefitService {
  option (onekit.http.service_config) = {base_path: "/api/hr/benefit/v1"};

  rpc ListBenefits(ListBenefitsRequest) returns (ListBenefitsResponse) {
    option (onekit.http.config) = {
      path: "/benefits"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateBenefit(CreateBenefitRequest) returns (CreateBenefitResponse) {
    option (onekit.http.config) = {
      path: "/benefits"
      method: HTTP_METHOD_POST
      body: "*"
    };
  }
}
