syntax = "proto3";

package hr.training.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/training/v1";

message CreateTrainingCourseRequest {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string description = 2;
  double duration_hours = 3;
  bool is_required = 4;
}

message CreateTrainingCourseResponse {
  int64 id = 1;
  string message = 2;
}
