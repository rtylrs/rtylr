syntax = "proto3";

package hr.training.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/training/v1";

message TrainingCourse {
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  int64 owner_id = 2 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  string name = 3;
  string description = 4;
  double duration_hours = 5;
  bool is_required = 6;
  string created_at = 7;
}
