syntax = "proto3";

package hr.time_off.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/time_off/v1";

// ── Time Off ────────────────────────────────────────────────────────

message TimeOffRequest {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  // owner_id identifies the tenant that owns the resource.
  int64 owner_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  // staff_id is the staff id value for this contract.
  int64 staff_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  // type is the type value for this contract.
  string type = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // start_date is the start date value for this contract.
  string start_date = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // end_date is the end date value for this contract.
  string end_date = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // days_count is the days count value for this contract.
  double days_count = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).double.gt = 0
  ];
  // status is the current lifecycle state.
  string status = 8 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // reason is the reason value for this contract.
  string reason = 9 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // approved_by is the approved by value for this contract.
  int64 approved_by = 10;
  // approved_at is the approved at value for this contract.
  string approved_at = 11;
  // notes is the notes value for this contract.
  string notes = 12;
  // created_at is when the record was created.
  string created_at = 13;
  // updated_at is when the record was last updated.
  string updated_at = 14;
}

message ApproveTimeOffRequestMsg {
  // id is the unique identifier for the resource.
  int64 id = 1;
  // status is the current lifecycle state.
  string status = 2;
  // notes is the notes value for this contract.
  string notes = 3;
}

message ApproveTimeOffResponse {
  // success is the success value for this contract.
  bool success = 1;
}
