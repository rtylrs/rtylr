syntax = "proto3";

package hr.shift.v1;

import "buf/validate/validate.proto";
import "hr/shift/v1/types.proto";
import "onekit/http/annotations.proto";


option go_package = "github.com/voxire/voxie/gen/go/hr/shift/v1";

// ── Create Shift ──────────────────────────────────────────────────

message CreateShiftRequest {
  // Location where this shift takes place.
  int64 location_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // Human-readable shift name.
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // Shift start time (HH:MM 24-hour format).
  string start_time = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // Shift end time (HH:MM 24-hour format).
  string end_time = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // Hex colour code for roster display.
  string color = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message CreateShiftResponse {
  // The newly created shift.
  ShiftPayload shift = 1;
}
