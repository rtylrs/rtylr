syntax = "proto3";

package hr.shift.v1;

import "hr/shift/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/shift/v1";

// ── List Shifts ───────────────────────────────────────────────────

message ListShiftsRequest {
  // Filter by location; absent to include all locations.
  optional int64 location_id = 1 [(onekit.http.query).name = "location_id"];
}

message ListShiftsResponse {
  // Shift templates matching the filter.
  repeated ShiftPayload shifts = 1;
  // Total number of matching shifts across all pages.
  int64 total = 2;
  // Page size used for this request.
  int32 limit = 3;
  // Offset used for this request.
  int32 offset = 4;
}
