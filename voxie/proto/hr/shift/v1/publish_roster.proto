syntax = "proto3";

package hr.shift.v1;

option go_package = "github.com/voxire/voxie/gen/go/hr/shift/v1";

// ── Publish Roster ────────────────────────────────────────────────

message PublishRosterRequest {
  // Location to publish the roster for.
  int64 location_id = 1;
  // Monday of the week being published (ISO-8601 date).
  string week_start = 2;
}

message PublishRosterResponse {
  // Whether the roster was successfully published.
  bool success = 1;
}
