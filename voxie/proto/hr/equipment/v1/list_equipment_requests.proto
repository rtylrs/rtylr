syntax = "proto3";

package hr.equipment.v1;

import "hr/equipment/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/equipment/v1";

// ── List Equipment Requests ──────────────────────────────────────

message ListEquipmentRequestsRequest {
  // Filter by employee; absent to include all employees.
  optional int64 employee_id = 1 [
    (onekit.http.query).name = "employee_id",
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING,
    (onekit.http.nullable) = true
  ];
  // Filter by status; absent to include all statuses.
  optional string status = 2 [
    (onekit.http.query).name = "status",
    (onekit.http.nullable) = true
  ];
}

message ListEquipmentRequestsResponse {
  // Page of equipment requests matching the filters.
  repeated EquipmentRequestPayload requests = 1;
  // Total number of matching equipment requests across all pages.
  int64 total = 2 [
    (onekit.http.int64_encoding) = INT64_ENCODING_NUMBER
  ];
  // Page size used for this request.
  int32 limit = 3;
  // Offset used for this request.
  int32 offset = 4;
}
