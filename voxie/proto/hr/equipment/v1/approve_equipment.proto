syntax = "proto3";

package hr.equipment.v1;

option go_package = "github.com/voxire/voxie/gen/go/hr/equipment/v1";

// ── Approve Equipment Request ────────────────────────────────────

message ApproveEquipmentRequest {
  // ID of the equipment request being reviewed.
  int64 equipment_request_id = 1;
  // True to approve, false to reject.
  bool approved = 2;
}

message ApproveEquipmentResponse {
  // Whether the approval action was processed.
  bool success = 1;
}
