syntax = "proto3";

package hr.payroll.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/payroll/v1";

message MarkPayrollPaidRequest {
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_NUMBER
  ];
}

message MarkPayrollPaidResponse {
  bool success = 1;
}
