syntax = "proto3";

package hr.payroll.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/payroll/v1";

message PayrollRecord {
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_NUMBER];
  int64 owner_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_NUMBER];
  int64 staff_id = 3 [(onekit.http.int64_encoding) = INT64_ENCODING_NUMBER];
  string period_start = 4;
  string period_end = 5;
  string period_label = 6;
  double regular_hours = 7;
  double overtime_hours = 8;
  double base_pay = 9;
  double overtime_pay = 10;
  double bonuses = 11;
  double deductions = 12;
  double tax_withheld = 13;
  double net_pay = 14;
  string status = 15;
  string paid_at = 16;
  string notes = 17;
  string created_at = 18;
}
