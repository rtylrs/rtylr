syntax = "proto3";

package hr.overtime.v1;

import "hr/overtime/v1/approve_overtime.proto";
import "hr/overtime/v1/create_overtime_request.proto";
import "hr/overtime/v1/list_overtime_requests.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/overtime/v1";

// OvertimeService defines HR overtime request endpoints.
service OvertimeService {
  option (onekit.http.service_config) = {base_path: "/api/hr/overtime/v1"};

  // ListOvertimeRequests returns overtime requests with optional filters.
  rpc ListOvertimeRequests(ListOvertimeRequestsRequest) returns (ListOvertimeRequestsResponse) {
    option (onekit.http.config) = {
      path: "/requests"
      method: HTTP_METHOD_GET
    };
  }

  // CreateOvertimeRequest submits an overtime request.
  rpc CreateOvertimeRequest(CreateOvertimeRequestRequest) returns (CreateOvertimeRequestResponse) {
    option (onekit.http.config) = {
      path: "/requests"
      method: HTTP_METHOD_POST
    };
  }

  // ApproveOvertime approves an overtime request.
  rpc ApproveOvertime(ApproveOvertimeRequest) returns (ApproveOvertimeResponse) {
    option (onekit.http.config) = {
      path: "/requests/{overtime_request_id}/approve"
      method: HTTP_METHOD_PATCH
    };
  }
}
