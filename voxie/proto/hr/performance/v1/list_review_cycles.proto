syntax = "proto3";

package hr.performance.v1;

import "hr/performance/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/performance/v1";

// ── List Review Cycles ───────────────────────────────────────────────

message ListReviewCyclesRequest {}

message ListReviewCyclesResponse {
  // Page of review cycles.
  repeated ReviewCyclePayload cycles = 1;
  // Total number of review cycles across all pages.
  int64 total = 2;
  // Page size used for this request.
  int32 limit = 3;
  // Offset used for this request.
  int32 offset = 4;
}
