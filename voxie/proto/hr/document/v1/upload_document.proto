syntax = "proto3";

package hr.document.v1;

import "buf/validate/validate.proto";
import "hr/document/v1/types.proto";
import "onekit/http/annotations.proto";


option go_package = "github.com/voxire/voxie/gen/go/hr/document/v1";

// ── Upload Document ──────────────────────────────────────────────

message UploadDocumentRequest {
  // Employee this document is associated with.
  int64 employee_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // Category of document (e.g. "id_card", "contract", "certificate", "visa").
  string document_type = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // Human-readable name for the document.
  string name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // How the document is stored (stored | linked).
  string storage_mode = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // URL to access the document file.
  string file_url = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // Date the document expires (ISO-8601 date); absent if no expiry.
  optional string expiry_date = 6 [
    (onekit.http.nullable) = true
  ];
}

message UploadDocumentResponse {
  // The newly created document record.
  EmployeeDocumentPayload document = 1;
}
