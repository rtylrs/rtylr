syntax = "proto3";

package hr.employee.v1;

import "hr/employee/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/employee/v1";

// ── List ───────────────────────────────────────────────────────────

message ListEmployeesRequest {
  // Filter by department; absent to include all departments.
  optional int64 department_id = 1 [
    (onekit.http.query).name = "department_id",
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING,
    (onekit.http.nullable) = true
  ];
  // Filter by location; absent to include all locations.
  optional int64 location_id = 2 [
    (onekit.http.query).name = "location_id",
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING,
    (onekit.http.nullable) = true
  ];
  // Filter by employment status; absent to include all statuses.
  optional string status = 3 [
    (onekit.http.query).name = "status",
    (onekit.http.nullable) = true
  ];
  // Maximum number of records to return.
  int32 limit = 4 [(onekit.http.query).name = "limit"];
  // Number of records to skip for pagination.
  int32 offset = 5 [(onekit.http.query).name = "offset"];
}

message ListEmployeesResponse {
  // Page of employee records matching the filters.
  repeated EmployeePayload employees = 1;
  // Total number of employees matching the filters.
  int64 total = 2 [
    (onekit.http.int64_encoding) = INT64_ENCODING_NUMBER
  ];
  // Limit that was applied.
  int32 limit = 3;
  // Offset that was applied.
  int32 offset = 4;
}
