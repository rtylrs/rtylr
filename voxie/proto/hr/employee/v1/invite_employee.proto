syntax = "proto3";

package hr.employee.v1;

option go_package = "github.com/voxire/voxie/gen/go/hr/employee/v1";

// ── Invite ─────────────────────────────────────────────────────────

message InviteEmployeeRequest {
  // ID of the employee to invite.
  int64 employee_id = 1;
  // Channel to deliver the invite (email | sms).
  string send_via = 2;
}

message InviteEmployeeResponse {
  // Sensitive: do not log this field. One-time invite token for the employee.
  string invite_token = 1;
  // Unix timestamp when the invite expires.
  int64 expires_at = 2;
}
