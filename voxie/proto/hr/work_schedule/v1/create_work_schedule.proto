syntax = "proto3";

package hr.work_schedule.v1;

import "buf/validate/validate.proto";
import "hr/work_schedule/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/work_schedule/v1";

// ── Create ─────────────────────────────────────────────────────────

message CreateWorkScheduleRequest {
  // Display name of the schedule.
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // Days of the week this schedule applies to.
  repeated string working_days = 2;
  // Shift start time in HH:MM 24-hour format.
  string start_time = 3 [(buf.validate.field).string.min_len = 1];
  // Shift end time in HH:MM 24-hour format.
  string end_time = 4 [(buf.validate.field).string.min_len = 1];
  // Duration of the daily break in minutes.
  int32 break_minutes = 5;
  // Total contracted hours per week.
  double contracted_hours_per_week = 6 [(buf.validate.field).double.gte = 0];
  // Daily overtime threshold in minutes.
  int32 daily_ot_threshold_minutes = 7;
  // Weekly overtime threshold in minutes.
  int32 weekly_ot_threshold_minutes = 8;
}

message CreateWorkScheduleResponse {
  // The newly created work schedule.
  WorkSchedulePayload schedule = 1;
}
