syntax = "proto3";

package hr.work_schedule.v1;

import "buf/validate/validate.proto";
import "hr/work_schedule/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/work_schedule/v1";

// ── Update ─────────────────────────────────────────────────────────

message UpdateWorkScheduleRequest {
  // ID of the schedule to update.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  // New name; absent to keep current.
  optional string name = 2;
  // New working days; if provided, replaces all existing days.
  repeated string working_days = 3;
  // New start time; absent to keep current.
  optional string start_time = 4;
  // New end time; absent to keep current.
  optional string end_time = 5;
  // New break duration in minutes; absent to keep current.
  optional int32 break_minutes = 6;
  // New contracted hours per week; absent to keep current.
  optional double contracted_hours_per_week = 7;
  // New daily OT threshold; absent to keep current.
  optional int32 daily_ot_threshold_minutes = 8;
  // New weekly OT threshold; absent to keep current.
  optional int32 weekly_ot_threshold_minutes = 9;
}

message UpdateWorkScheduleResponse {
  // The updated work schedule.
  WorkSchedulePayload schedule = 1;
}
