syntax = "proto3";

package hr.timesheet.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/timesheet/v1";

message TimesheetEntry {
  int64 staff_id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_NUMBER
  ];
  string staff_name = 2;
  string week_start = 3;
  double total_hours = 4;
  double regular_hours = 5;
  double overtime_hours = 6;
}
