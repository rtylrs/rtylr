syntax = "proto3";

package hr.timesheet.v1;

import "hr/timesheet/v1/list_timesheets.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/timesheet/v1";

service TimesheetService {
  option (onekit.http.service_config) = {base_path: "/api/hr/timesheet/v1"};

  rpc ListTimesheets(ListTimesheetsRequest) returns (ListTimesheetsResponse) {
    option (onekit.http.config) = {
      path: "/timesheets"
      method: HTTP_METHOD_GET
    };
  }
}
