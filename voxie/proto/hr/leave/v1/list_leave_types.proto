syntax = "proto3";

package hr.leave.v1;

import "hr/leave/v1/types.proto";
import "onekit/http/annotations.proto";


option go_package = "github.com/voxire/voxie/gen/go/hr/leave/v1";

// ── List Leave Types ──────────────────────────────────────────────

message ListLeaveTypesRequest {}

message ListLeaveTypesResponse {
  // All leave types configured for the tenant.
  repeated LeaveTypePayload leave_types = 1;
  // Total number of leave types.
  int64 total = 2 [
    (onekit.http.int64_encoding) = INT64_ENCODING_NUMBER
  ];
  // Page size used for this request.
  int32 limit = 3;
  // Offset used for this request.
  int32 offset = 4;
}
