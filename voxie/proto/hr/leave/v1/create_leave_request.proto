syntax = "proto3";

package hr.leave.v1;

import "hr/leave/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/leave/v1";

// ── Create Leave Request ──────────────────────────────────────────

message CreateLeaveRequestRequest {
  // Employee requesting leave.
  int64 employee_id = 1;
  // Leave type being requested.
  int64 leave_type_id = 2;
  // First day of leave (ISO-8601 date).
  string start_date = 3;
  // Last day of leave (ISO-8601 date).
  string end_date = 4;
  // Total number of working days requested.
  double total_days = 5;
  // Additional context from the employee; absent if none provided.
  optional string notes = 6;
}

message CreateLeaveRequestResponse {
  // The newly created leave request.
  LeaveRequestPayload request = 1;
}
