syntax = "proto3";

package hr.leave.v1;

import "buf/validate/validate.proto";
import "hr/leave/v1/types.proto";
import "onekit/http/annotations.proto";


option go_package = "github.com/voxire/voxie/gen/go/hr/leave/v1";

// ── Update Leave Type ─────────────────────────────────────────────

message UpdateLeaveTypeRequest {
  // ID of the leave type to update.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // Updated name; absent to keep current value.
  optional string name = 2 [
    (onekit.http.nullable) = true
  ];
  // Updated paid status; absent to keep current value.
  optional bool is_paid = 3 [
    (onekit.http.nullable) = true
  ];
  // Updated approval requirement; absent to keep current value.
  optional bool requires_approval = 4 [
    (onekit.http.nullable) = true
  ];
  // Updated accrual rule; absent to keep current value.
  optional string accrual_rule = 5 [
    (onekit.http.nullable) = true
  ];
  // Updated max carryover days; absent to keep current value.
  optional int32 max_carryover_days = 6 [
    (onekit.http.nullable) = true
  ];
  // Updated min notice days; absent to keep current value.
  optional int32 min_notice_days = 7 [
    (onekit.http.nullable) = true
  ];
  // Updated documentation threshold; absent to keep current value.
  optional int32 requires_documentation_after_days = 8 [
    (onekit.http.nullable) = true
  ];
  // Updated active status; absent to keep current value.
  optional bool is_active = 9 [
    (onekit.http.nullable) = true
  ];
}

message UpdateLeaveTypeResponse {
  // The updated leave type.
  LeaveTypePayload leave_type = 1;
}
