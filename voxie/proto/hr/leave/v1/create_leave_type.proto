syntax = "proto3";

package hr.leave.v1;

import "buf/validate/validate.proto";
import "hr/leave/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/leave/v1";

// ── Create Leave Type ─────────────────────────────────────────────

message CreateLeaveTypeRequest {
  // Human-readable name (e.g. "Annual Leave", "Sick Leave").
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // Whether days taken under this type are paid.
  bool is_paid = 2;
  // Whether leave requests of this type require manager approval.
  bool requires_approval = 3;
  // Accrual rule; absent if entitlement is fixed.
  optional string accrual_rule = 4;
  // Maximum unused days that may carry over to the next year.
  int32 max_carryover_days = 5;
  // Minimum calendar days of notice required.
  int32 min_notice_days = 6;
  // Consecutive days after which documentation is required; absent if never.
  optional int32 requires_documentation_after_days = 7;
}

message CreateLeaveTypeResponse {
  // The newly created leave type.
  LeaveTypePayload leave_type = 1;
}
