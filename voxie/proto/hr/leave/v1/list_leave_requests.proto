syntax = "proto3";

package hr.leave.v1;

import "hr/leave/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/leave/v1";

// ── List Leave Requests ───────────────────────────────────────────

message ListLeaveRequestsRequest {
  // Filter by employee; absent to include all employees.
  optional int64 employee_id = 1;
  // Filter by status; absent to include all statuses.
  optional string status = 2;
}

message ListLeaveRequestsResponse {
  // Page of leave requests matching the filters.
  repeated LeaveRequestPayload requests = 1;
  // Total number of matching leave requests across all pages.
  int64 total = 2;
  // Page size used for this request.
  int32 limit = 3;
  // Offset used for this request.
  int32 offset = 4;
}
