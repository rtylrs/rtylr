syntax = "proto3";

package hr.onboarding.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/onboarding/v1";

// ── Update Checklist Template ────────────────────────────────────

message UpdateChecklistTemplateRequest {
  // name is the human-readable name for the template.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // trigger_type is the event that triggers this checklist (onboarding | offboarding).
  optional string trigger_type = 2;
  // role_id is the role this template applies to; absent if it applies to all roles.
  optional int64 role_id = 3;
}

message UpdateChecklistTemplateResponse {
  // success indicates the checklist template was updated.
  bool success = 1;
}
