syntax = "proto3";

package hr.onboarding.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";


option go_package = "github.com/voxire/voxie/gen/go/hr/onboarding/v1";

// ── Update Checklist Template ────────────────────────────────────

message UpdateChecklistTemplateBody {
  // name is the human-readable name for the template.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // trigger_type is the event that triggers this checklist (onboarding | offboarding).
  optional string trigger_type = 2 [
    (onekit.http.nullable) = true
  ];
}

message UpdateChecklistTemplateRequest {
  // role_id is the checklist template role identifier from the path.
  int64 role_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // body carries updatable checklist template fields bound from the HTTP payload.
  UpdateChecklistTemplateBody body = 2;
}

message UpdateChecklistTemplateResponse {
  // success indicates the checklist template was updated.
  bool success = 1;
}
