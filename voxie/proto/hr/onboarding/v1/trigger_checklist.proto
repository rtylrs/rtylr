syntax = "proto3";

package hr.onboarding.v1;

import "hr/onboarding/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/onboarding/v1";

// ── Trigger Checklist ────────────────────────────────────────────

message TriggerChecklistRequest {
  // Employee to trigger the checklist for.
  int64 employee_id = 1;
  // Event type that is triggering (onboarding | offboarding).
  string trigger_type = 2;
}

message TriggerChecklistResponse {
  // The employee checklist that was created.
  EmployeeChecklistPayload checklist = 1;
}
