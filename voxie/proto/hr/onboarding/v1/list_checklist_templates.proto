syntax = "proto3";

package hr.onboarding.v1;

import "hr/onboarding/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/onboarding/v1";

// ── List Checklist Templates ─────────────────────────────────────

message ListChecklistTemplatesRequest {
  // Filter by trigger type; absent to include all types.
  optional string trigger_type = 1 [
    (onekit.http.query).name = "trigger_type",
    (onekit.http.nullable) = true
  ];
}

message ListChecklistTemplatesResponse {
  // Page of checklist templates matching the filters.
  repeated ChecklistTemplatePayload templates = 1;
  // Total number of matching templates across all pages.
  int64 total = 2 [
    (onekit.http.int64_encoding) = INT64_ENCODING_NUMBER
  ];
  // Page size used for this request.
  int32 limit = 3;
  // Offset used for this request.
  int32 offset = 4;
}
