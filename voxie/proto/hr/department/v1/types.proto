syntax = "proto3";

package hr.department.v1;

option go_package = "github.com/voxire/voxie/gen/go/hr/department/v1";

// ── Department ─────────────────────────────────────────────────────

message DepartmentPayload {
  // Unique identifier for the department.
  int64 id = 1;
  // Tenant owner this department belongs to.
  int64 owner_id = 2;
  // Location this department operates from.
  int64 location_id = 3;
  // Parent department for org-chart hierarchy; absent if top-level.
  optional int64 parent_department_id = 4;
  // Display name of the department.
  string name = 5;
  // Work schedule applied to employees in this department by default; absent if none.
  optional int64 default_work_schedule_id = 6;
  // Unix timestamp when this department was created.
  int64 created_at = 7;
  // Unix timestamp when this department was last updated.
  int64 updated_at = 8;
}

// ── List ───────────────────────────────────────────────────────────

message ListDepartmentsResponse {
  // All departments for the tenant.
  repeated DepartmentPayload departments = 1;
}
