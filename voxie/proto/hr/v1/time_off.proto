syntax = "proto3";

package hr;

option go_package = "github.com/voxire/voxie/gen/go/hr/v1";

import "common/v1/pagination.proto";

// ── Time Off ────────────────────────────────────────────────────────

message TimeOffRequest {
  int64 id = 1;
  int64 staff_id = 2;
  string staff_name = 3;
  string type = 4; // vacation, sick, personal, other
  string status = 5; // pending, approved, rejected
  string start_date = 6;
  string end_date = 7;
  int32 days = 8;
  string reason = 9;
  string reviewer_name = 10;
  string reviewed_at = 11;
  string created_at = 12;
}

message ListTimeOffRequestsRequest {
  common.PaginationRequest pagination = 1;
  int64 staff_id = 2;
  string status = 3;
  string type = 4;
}

message ListTimeOffRequestsResponse {
  repeated TimeOffRequest requests = 1;
  common.PaginationResponse pagination = 2;
}

message GetTimeOffRequestRequest {
  int64 id = 1;
}

message GetTimeOffRequestResponse {
  TimeOffRequest request = 1;
}

message CreateTimeOffRequestRequest {
  int64 staff_id = 1;
  string type = 2;
  string start_date = 3;
  string end_date = 4;
  string reason = 5;
}

message CreateTimeOffRequestResponse {
  TimeOffRequest request = 1;
}

message ApproveTimeOffRequest {
  int64 id = 1;
  bool approved = 2;
  string reason = 3;
}

message ApproveTimeOffResponse {
  TimeOffRequest request = 1;
}
