syntax = "proto3";

package hr;

option go_package = "github.com/voxire/voxie/gen/go/hr/v1";

// ── Time Off ────────────────────────────────────────────────────────

message TimeOffRequest {
  int64 id = 1;
  int64 owner_id = 2;
  int64 staff_id = 3;
  string type = 4;
  string start_date = 5;
  string end_date = 6;
  double days_count = 7;
  string status = 8;
  string reason = 9;
  int64 approved_by = 10;
  string approved_at = 11;
  string notes = 12;
  string created_at = 13;
  string updated_at = 14;
}

message ListTimeOffRequest {}

message ListTimeOffResponse {
  repeated TimeOffRequest requests = 1;
}

message SubmitTimeOffRequest {
  int64 staff_id = 1;
  string type = 2;
  string start_date = 3;
  string end_date = 4;
  double days_count = 5;
  string reason = 6;
  string notes = 7;
}

message SubmitTimeOffResponse {
  int64 id = 1;
}

message ApproveTimeOffRequestMsg {
  int64 id = 1;
  string status = 2;
  string notes = 3;
}

message ApproveTimeOffResponse {
  bool success = 1;
}
