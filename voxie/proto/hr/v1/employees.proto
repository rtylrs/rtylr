syntax = "proto3";

package hr.v1;

option go_package = "github.com/voxire/voxie/gen/go/hr/v1;hrv1";

// ── Employee ───────────────────────────────────────────────────────

message EmployeePayload {
  // Unique identifier for the employee record.
  int64 id = 1;
  // Tenant owner this employee belongs to.
  int64 owner_id = 2;
  // Linked user account ID.
  int64 user_id = 3;
  // Department the employee is assigned to.
  int64 department_id = 4;
  // Work location the employee reports to.
  int64 location_id = 5;
  // Direct manager; absent if top-level.
  optional int64 manager_id = 6;
  // Employment arrangement (full_time | part_time | freelancer).
  string contract_type = 7;
  // Current employment status (active | probation | inactive | terminated).
  string status = 8;
  // Date the employee was hired (ISO-8601 format).
  string hire_date = 9;
  // End of probation period; absent if no probation (ISO-8601 format).
  optional string probation_end_date = 10;
  // Date employment was terminated; absent if still employed (ISO-8601 format).
  optional string termination_date = 11;
  // Pay rate per hour for hourly employees; absent if salaried only.
  optional double hourly_rate = 12;
  // Monthly gross salary; absent if hourly only.
  optional double monthly_salary = 13;
  // ISO-4217 currency code for compensation (e.g. "USD").
  string currency = 14;
  // Assigned work schedule; absent if using department default.
  optional int64 work_schedule_id = 15;
  // How the employee account was created (hr_created | invite_link).
  string account_creation_mode = 16;
  // Employee's job title or position name.
  string job_title = 17;
  // Unix timestamp when this record was created.
  int64 created_at = 18;
  // Unix timestamp when this record was last updated.
  int64 updated_at = 19;
}

// ── Create ─────────────────────────────────────────────────────────

message CreateEmployeeRequest {
  // Linked user account ID.
  int64 user_id = 1;
  // Department to assign the employee to.
  int64 department_id = 2;
  // Work location the employee reports to.
  int64 location_id = 3;
  // Direct manager; absent if top-level.
  optional int64 manager_id = 4;
  // Employment arrangement (full_time | part_time | freelancer).
  string contract_type = 5;
  // Initial employment status (active | probation | inactive | terminated).
  string status = 6;
  // Date the employee was hired (ISO-8601 format).
  string hire_date = 7;
  // End of probation period; absent if no probation (ISO-8601 format).
  optional string probation_end_date = 8;
  // Date employment was terminated; absent if still employed (ISO-8601 format).
  optional string termination_date = 9;
  // Pay rate per hour for hourly employees; absent if salaried only.
  optional double hourly_rate = 10;
  // Monthly gross salary; absent if hourly only.
  optional double monthly_salary = 11;
  // ISO-4217 currency code for compensation (e.g. "USD").
  string currency = 12;
  // Assigned work schedule; absent if using department default.
  optional int64 work_schedule_id = 13;
  // How the employee account was created (hr_created | invite_link).
  string account_creation_mode = 14;
  // Employee's job title or position name.
  string job_title = 15;
}

message CreateEmployeeResponse {
  // The newly created employee record.
  EmployeePayload employee = 1;
}

// ── Update ─────────────────────────────────────────────────────────

message UpdateEmployeeRequest {
  // ID of the employee to update.
  int64 id = 1;
  // New department assignment; absent to keep current.
  optional int64 department_id = 2;
  // New work location; absent to keep current.
  optional int64 location_id = 3;
  // New direct manager; absent to keep current.
  optional int64 manager_id = 4;
  // New employment arrangement; absent to keep current.
  optional string contract_type = 5;
  // New employment status; absent to keep current.
  optional string status = 6;
  // New hire date (ISO-8601); absent to keep current.
  optional string hire_date = 7;
  // New probation end date (ISO-8601); absent to keep current.
  optional string probation_end_date = 8;
  // New termination date (ISO-8601); absent to keep current.
  optional string termination_date = 9;
  // New hourly rate; absent to keep current.
  optional double hourly_rate = 10;
  // New monthly salary; absent to keep current.
  optional double monthly_salary = 11;
  // New currency code; absent to keep current.
  optional string currency = 12;
  // New work schedule; absent to keep current.
  optional int64 work_schedule_id = 13;
  // New account creation mode; absent to keep current.
  optional string account_creation_mode = 14;
  // New job title; absent to keep current.
  optional string job_title = 15;
}

message UpdateEmployeeResponse {
  // The updated employee record.
  EmployeePayload employee = 1;
}

// ── Invite ─────────────────────────────────────────────────────────

message InviteEmployeeRequest {
  // ID of the employee to invite.
  int64 employee_id = 1;
  // Channel to deliver the invite (email | sms).
  string send_via = 2;
}

message InviteEmployeeResponse {
  // Sensitive: do not log this field. One-time invite token for the employee.
  string invite_token = 1;
  // Unix timestamp when the invite expires.
  int64 expires_at = 2;
}

// ── Accept Invite ──────────────────────────────────────────────────

message AcceptInviteRequest {
  // Sensitive: do not log this field. The invite token received by the employee.
  string token = 1;
  // Sensitive: do not log this field. Password chosen by the employee.
  string password = 2;
}

message AcceptInviteResponse {
  // Whether the invite was accepted successfully.
  bool success = 1;
}

// ── List ───────────────────────────────────────────────────────────

message ListEmployeesRequest {
  // Filter by department; absent to include all departments.
  optional int64 department_id = 1;
  // Filter by location; absent to include all locations.
  optional int64 location_id = 2;
  // Filter by employment status; absent to include all statuses.
  optional string status = 3;
  // Maximum number of records to return.
  int32 limit = 4;
  // Number of records to skip for pagination.
  int32 offset = 5;
}

message ListEmployeesResponse {
  // Page of employee records matching the filters.
  repeated EmployeePayload employees = 1;
  // Total number of employees matching the filters.
  int64 total = 2;
  // Limit that was applied.
  int32 limit = 3;
  // Offset that was applied.
  int32 offset = 4;
}
