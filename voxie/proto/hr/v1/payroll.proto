syntax = "proto3";

package hr.v1;

option go_package = "github.com/voxire/voxie/gen/go/hr/v1;hrv1";

// ── Payroll ─────────────────────────────────────────────────────────

message PayrollRecord {
  int64 id = 1;
  int64 owner_id = 2;
  int64 staff_id = 3;
  string period_start = 4;
  string period_end = 5;
  string period_label = 6;
  double regular_hours = 7;
  double overtime_hours = 8;
  double base_pay = 9;
  double overtime_pay = 10;
  double bonuses = 11;
  double deductions = 12;
  double tax_withheld = 13;
  double net_pay = 14;
  string status = 15;
  string paid_at = 16;
  string notes = 17;
  string created_at = 18;
}

message ListPayrollRequest {
  string period_label = 1;
}

message ListPayrollResponse {
  repeated PayrollRecord records = 1;
}

message RunPayrollRequest {
  string period_start = 1;
  string period_end = 2;
  string period_label = 3;
}

message RunPayrollResponse {
  int64 records_created = 1;
}

message MarkPayrollPaidRequest {
  int64 id = 1;
}

message MarkPayrollPaidResponse {
  bool success = 1;
}
