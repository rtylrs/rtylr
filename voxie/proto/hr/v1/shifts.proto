syntax = "proto3";

package hr;

option go_package = "github.com/voxire/voxie/gen/go/hr/v1";

import "common/v1/pagination.proto";

// ── Shifts ──────────────────────────────────────────────────────────

message Shift {
  int64 id = 1;
  int64 staff_id = 2;
  string staff_name = 3;
  string date = 4;
  string start_time = 5;
  string end_time = 6;
  double hours = 7;
  string status = 8; // scheduled, in_progress, completed, missed
  string notes = 9;
  string created_at = 10;
}

message ListShiftsRequest {
  common.PaginationRequest pagination = 1;
  int64 staff_id = 2;
  string from_date = 3;
  string to_date = 4;
  string status = 5;
}

message ListShiftsResponse {
  repeated Shift shifts = 1;
  common.PaginationResponse pagination = 2;
}

message GetShiftRequest {
  int64 id = 1;
}

message GetShiftResponse {
  Shift shift = 1;
}

message CreateShiftRequest {
  int64 staff_id = 1;
  string date = 2;
  string start_time = 3;
  string end_time = 4;
  string notes = 5;
}

message CreateShiftResponse {
  Shift shift = 1;
}
