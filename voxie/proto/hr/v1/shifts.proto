syntax = "proto3";

package hr.v1;

option go_package = "github.com/voxire/voxie/gen/go/hr/v1;hrv1";

// ── Shifts ──────────────────────────────────────────────────────────

message Shift {
  int64 id = 1;
  int64 owner_id = 2;
  int64 staff_id = 3;
  string date = 4;
  string start_time = 5;
  string end_time = 6;
  int64 break_minutes = 7;
  string status = 8;
  string notes = 9;
  string created_at = 10;
  string updated_at = 11;
}

message ListShiftsRequest {
  int64 staff_id = 1;
  string date = 2;
}

message ListShiftsResponse {
  repeated Shift shifts = 1;
}

message CreateShiftRequest {
  int64 staff_id = 1;
  string date = 2;
  string start_time = 3;
  string end_time = 4;
  int64 break_minutes = 5;
  string status = 6;
  string notes = 7;
}

message CreateShiftResponse {
  int64 id = 1;
}

message UpdateShiftRequest {
  int64 id = 1;
  string date = 2;
  string start_time = 3;
  string end_time = 4;
  int64 break_minutes = 5;
  string status = 6;
  string notes = 7;
}

message UpdateShiftResponse {
  bool success = 1;
}

message DeleteShiftRequest {
  int64 id = 1;
}

message DeleteShiftResponse {
  bool success = 1;
}
