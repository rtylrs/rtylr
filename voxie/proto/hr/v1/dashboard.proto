syntax = "proto3";

package hr;

option go_package = "github.com/voxire/voxie/gen/go/hr/v1";

// ── HR Dashboard ────────────────────────────────────────────────────

message DashboardStats {
  int32 total_staff = 1;
  int32 on_shift_today = 2;
  int32 pending_time_off = 3;
  int32 payroll_draft = 4;
}

message GetHRDashboardRequest {}

message GetHRDashboardResponse {
  DashboardStats stats = 1;
}
