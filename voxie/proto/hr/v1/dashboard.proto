syntax = "proto3";

package hr.v1;

option go_package = "github.com/voxire/voxie/gen/go/hr/v1;hrv1";

// ── HR Dashboard ────────────────────────────────────────────────────

message DashboardStats {
  int64 total_staff = 1;
  int64 on_shift_today = 2;
  int64 pending_time_off = 3;
  int64 payroll_draft = 4;
}

message GetHRDashboardRequest {}

message GetHRDashboardResponse {
  DashboardStats stats = 1;
}
