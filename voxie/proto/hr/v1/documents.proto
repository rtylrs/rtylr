syntax = "proto3";

package hr.v1;

option go_package = "github.com/voxire/voxie/gen/go/hr/v1;hrv1";

// ── Employee Document ────────────────────────────────────────────

message EmployeeDocumentPayload {
  // Unique identifier for the document.
  int64 id = 1;
  // Tenant owner this document belongs to.
  int64 owner_id = 2;
  // Employee this document is associated with.
  int64 employee_id = 3;
  // Category of document (e.g. "id_card", "contract", "certificate", "visa").
  string document_type = 4;
  // Human-readable name for the document.
  string name = 5;
  // How the document is stored (stored | linked).
  string storage_mode = 6;
  // URL to access the document file.
  string file_url = 7;
  // Date the document expires (ISO-8601 date); absent if no expiry.
  optional string expiry_date = 8;
  // Employee who uploaded or linked the document.
  int64 uploaded_by = 9;
  // Unix timestamp when the document was uploaded.
  int64 uploaded_at = 10;
  // Unix timestamp when this record was created.
  int64 created_at = 11;
  // Unix timestamp when this record was last updated.
  int64 updated_at = 12;
}

// ── Upload Document ──────────────────────────────────────────────

message UploadDocumentRequest {
  // Employee this document is associated with.
  int64 employee_id = 1;
  // Category of document (e.g. "id_card", "contract", "certificate", "visa").
  string document_type = 2;
  // Human-readable name for the document.
  string name = 3;
  // How the document is stored (stored | linked).
  string storage_mode = 4;
  // URL to access the document file.
  string file_url = 5;
  // Date the document expires (ISO-8601 date); absent if no expiry.
  optional string expiry_date = 6;
}

message UploadDocumentResponse {
  // The newly created document record.
  EmployeeDocumentPayload document = 1;
}

// ── List Employee Documents ──────────────────────────────────────

message ListEmployeeDocumentsRequest {
  // Filter by employee; absent to include all employees.
  optional int64 employee_id = 1;
  // Filter by document type; absent to include all types.
  optional string document_type = 2;
}

message ListEmployeeDocumentsResponse {
  // Page of documents matching the filters.
  repeated EmployeeDocumentPayload documents = 1;
  // Total number of matching documents across all pages.
  int64 total = 2;
  // Page size used for this request.
  int32 limit = 3;
  // Offset used for this request.
  int32 offset = 4;
}
