syntax = "proto3";

package hr;

option go_package = "github.com/voxire/voxie/gen/go/hr/v1";

import "common/v1/pagination.proto";

// ── Staff ───────────────────────────────────────────────────────────

message Staff {
  int64 id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  string role = 6;
  int64 department_id = 7;
  string department_name = 8;
  string status = 9; // active, inactive, on_leave
  double hourly_rate = 10;
  double salary = 11;
  string hire_date = 12;
  string avatar_url = 13;
  string clock_status = 14; // clocked_in, clocked_out
  string last_clock_in = 15;
  string created_at = 16;
  string updated_at = 17;
}

message ListStaffRequest {
  common.PaginationRequest pagination = 1;
  string search = 2;
  string status = 3;
  int64 department_id = 4;
}

message ListStaffResponse {
  repeated Staff staff = 1;
  common.PaginationResponse pagination = 2;
}

message GetStaffRequest {
  int64 id = 1;
}

message GetStaffResponse {
  Staff staff = 1;
}

message CreateStaffRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string phone = 4;
  string role = 5;
  int64 department_id = 6;
  double hourly_rate = 7;
  double salary = 8;
  string hire_date = 9;
}

message CreateStaffResponse {
  Staff staff = 1;
}

message UpdateStaffRequest {
  int64 id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  string role = 6;
  int64 department_id = 7;
  double hourly_rate = 8;
  double salary = 9;
  string status = 10;
}

message UpdateStaffResponse {
  Staff staff = 1;
}

message DeleteStaffRequest {
  int64 id = 1;
}

message DeleteStaffResponse {
  bool success = 1;
}

message ClockInRequest {
  int64 staff_id = 1;
}

message ClockInResponse {
  string clocked_in_at = 1;
}

message ClockOutRequest {
  int64 staff_id = 1;
}

message ClockOutResponse {
  string clocked_out_at = 1;
  double hours_worked = 2;
}
