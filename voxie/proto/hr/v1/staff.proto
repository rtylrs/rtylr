syntax = "proto3";

package hr;

option go_package = "github.com/voxire/voxie/gen/go/hr/v1";

// ── Staff ───────────────────────────────────────────────────────────

message Staff {
  int64 id = 1;
  int64 owner_id = 2;
  int64 user_id = 3;
  int64 department_id = 4;
  string first_name = 5;
  string last_name = 6;
  string email = 7;
  string phone = 8;
  string role = 9;
  string employment_type = 10;
  string status = 11;
  double salary = 12;
  double hourly_rate = 13;
  double overtime_rate = 14;
  string start_date = 15;
  string end_date = 16;
  string address = 17;
  string emergency_contact_name = 18;
  string emergency_contact_phone = 19;
  string apps = 20;
  string notes = 21;
  string created_at = 22;
  string updated_at = 23;
}

message ListStaffRequest {
  string search = 1;
  string department_id = 2;
  string status = 3;
}

message ListStaffResponse {
  repeated Staff staff = 1;
}

message GetStaffRequest {
  int64 id = 1;
}

message GetStaffResponse {
  Staff staff = 1;
}

message CreateStaffRequest {
  int64 user_id = 1;
  int64 department_id = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  string phone = 6;
  string role = 7;
  string employment_type = 8;
  string status = 9;
  double salary = 10;
  double hourly_rate = 11;
  double overtime_rate = 12;
  string start_date = 13;
  string end_date = 14;
  string address = 15;
  string emergency_contact_name = 16;
  string emergency_contact_phone = 17;
  string apps = 18;
  string notes = 19;
}

message CreateStaffResponse {
  int64 id = 1;
}

message UpdateStaffRequest {
  int64 id = 1;
  int64 department_id = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  string phone = 6;
  string role = 7;
  string employment_type = 8;
  string status = 9;
  double salary = 10;
  double hourly_rate = 11;
  double overtime_rate = 12;
  string end_date = 13;
  string address = 14;
  string emergency_contact_name = 15;
  string emergency_contact_phone = 16;
  string apps = 17;
  string notes = 18;
}

message UpdateStaffResponse {
  bool success = 1;
}

message DeleteStaffRequest {
  int64 id = 1;
}

message DeleteStaffResponse {
  bool success = 1;
}

message ClockInRequest {
  int64 staff_id = 1;
}

message ClockInResponse {
  bool success = 1;
}

message ClockOutRequest {
  int64 staff_id = 1;
}

message ClockOutResponse {
  bool success = 1;
}
