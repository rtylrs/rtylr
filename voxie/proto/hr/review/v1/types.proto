syntax = "proto3";

package hr.review.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/review/v1";

message Review {
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  int64 owner_id = 2 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  int64 staff_id = 3 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  int64 reviewer_id = 4 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  string period = 5;
  double rating = 6;
  double goals_rating = 7;
  double values_rating = 8;
  double skills_rating = 9;
  string notes = 10;
  string status = 11;
  string created_at = 12;
  string updated_at = 13;
}
