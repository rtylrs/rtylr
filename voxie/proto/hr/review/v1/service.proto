syntax = "proto3";

package hr.review.v1;

import "hr/review/v1/create_review.proto";
import "hr/review/v1/list_reviews.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/review/v1";

service ReviewService {
  option (onekit.http.service_config) = {base_path: "/api/hr/review/v1"};

  rpc ListReviews(ListReviewsRequest) returns (ListReviewsResponse) {
    option (onekit.http.config) = {
      path: "/reviews"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateReview(CreateReviewRequest) returns (CreateReviewResponse) {
    option (onekit.http.config) = {
      path: "/reviews"
      method: HTTP_METHOD_POST
      body: "*"
    };
  }
}
