syntax = "proto3";

package book;

option go_package = "github.com/voxire/voxie/gen/go/book/v1";

// ── WaitlistEntry ─────────────────────────────────────────────────

message WaitlistEntry {
  int64 id = 1;
  int64 owner_id = 2;
  int64 service_id = 3;
  string customer_name = 4;
  string customer_email = 5;
  string customer_phone = 6;
  string preferred_date = 7;
  string preferred_time = 8;
  string status = 9;
  string created_at = 10;
}

// ── List ──────────────────────────────────────────────────────────

message ListWaitlistRequest {}

message ListWaitlistResponse {
  repeated WaitlistEntry entries = 1;
}

// ── Create ────────────────────────────────────────────────────────

message CreateWaitlistEntryRequest {
  int64 service_id = 1;
  string customer_name = 2;
  string customer_email = 3;
  string customer_phone = 4;
  string preferred_date = 5;
  string preferred_time = 6;
}

message CreateWaitlistEntryResponse {
  int64 id = 1;
  string message = 2;
}

// ── Update ────────────────────────────────────────────────────────

message UpdateWaitlistEntryRequest {
  int64 id = 1;
  int64 service_id = 2;
  string customer_name = 3;
  string customer_email = 4;
  string customer_phone = 5;
  string preferred_date = 6;
  string preferred_time = 7;
  string status = 8;
}

message UpdateWaitlistEntryResponse {
  string message = 1;
}
