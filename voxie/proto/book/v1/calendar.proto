syntax = "proto3";

package book;

option go_package = "github.com/voxire/voxie/gen/go/book/v1";

// ── Calendar ──────────────────────────────────────────────────────

message CalendarAppointment {
  int64 id = 1;
  int64 service_id = 2;
  string customer_name = 3;
  string start_time = 4;
  string end_time = 5;
  string status = 6;
}

message CalendarDay {
  string date = 1;
  repeated CalendarAppointment appointments = 2;
}

// ── Get Calendar ──────────────────────────────────────────────────

message GetCalendarRequest {
  string from = 1;
  string to = 2;
}

message GetCalendarResponse {
  repeated CalendarDay days = 1;
}
