syntax = "proto3";

package book;

option go_package = "github.com/voxire/voxie/gen/go/book/v1";

import "common/v1/pagination.proto";

// ── BookCustomer ───────────────────────────────────────────────────

message BookCustomer {
  int64 id = 1;
  int64 business_id = 2;
  string name = 3;
  string email = 4;
  string phone = 5;
  string notes = 6;
  int32 total_appointments = 7;
  int32 no_show_count = 8;
  int32 cancelled_count = 9;
  string last_visit_at = 10;
  string created_at = 11;
  string updated_at = 12;
}

// ── List ───────────────────────────────────────────────────────────

message ListBookCustomersRequest {
  common.PaginationRequest pagination = 1;
  string search = 2;
}

message ListBookCustomersResponse {
  repeated BookCustomer customers = 1;
  common.PaginationResponse pagination = 2;
}

// ── Get ────────────────────────────────────────────────────────────

message GetBookCustomerRequest {
  int64 id = 1;
}

message GetBookCustomerResponse {
  BookCustomer customer = 1;
}
