syntax = "proto3";

package book;

option go_package = "github.com/voxire/voxie/gen/go/book/v1";

// ── Appointment ───────────────────────────────────────────────────

message Appointment {
  int64 id = 1;
  int64 owner_id = 2;
  int64 service_id = 3;
  int64 resource_id = 4;
  int64 staff_id = 5;
  string customer_name = 6;
  string customer_email = 7;
  string customer_phone = 8;
  string start_time = 9;
  string end_time = 10;
  string status = 11;
  string notes = 12;
  string created_at = 13;
  string updated_at = 14;
}

// ── List ──────────────────────────────────────────────────────────

message ListAppointmentsRequest {}

message ListAppointmentsResponse {
  repeated Appointment appointments = 1;
}

// ── Today ─────────────────────────────────────────────────────────

message TodayAppointmentsRequest {}

message TodayAppointmentsResponse {
  repeated Appointment appointments = 1;
}

// ── Create ────────────────────────────────────────────────────────

message CreateAppointmentRequest {
  int64 service_id = 1;
  int64 resource_id = 2;
  int64 staff_id = 3;
  string customer_name = 4;
  string customer_email = 5;
  string customer_phone = 6;
  string start_time = 7;
  string end_time = 8;
  string status = 9;
  string notes = 10;
}

message CreateAppointmentResponse {
  int64 id = 1;
  string message = 2;
}

// ── Update ────────────────────────────────────────────────────────

message UpdateAppointmentRequest {
  int64 id = 1;
  int64 service_id = 2;
  int64 resource_id = 3;
  int64 staff_id = 4;
  string customer_name = 5;
  string customer_email = 6;
  string customer_phone = 7;
  string start_time = 8;
  string end_time = 9;
  string status = 10;
  string notes = 11;
}

message UpdateAppointmentResponse {
  string message = 1;
}

// ── Delete ────────────────────────────────────────────────────────

message DeleteAppointmentRequest {
  int64 id = 1;
}

message DeleteAppointmentResponse {
  string message = 1;
}
