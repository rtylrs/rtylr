syntax = "proto3";

package book;

option go_package = "github.com/voxire/voxie/gen/go/book/v1";

// ── BookingService ────────────────────────────────────────────────

message BookingService {
  int64 id = 1;
  int64 owner_id = 2;
  string name = 3;
  string description = 4;
  int32 duration_minutes = 5;
  double price = 6;
  string color = 7;
  bool is_active = 8;
  string created_at = 9;
  string updated_at = 10;
}

// ── List ──────────────────────────────────────────────────────────

message ListBookingServicesRequest {}

message ListBookingServicesResponse {
  repeated BookingService services = 1;
}

// ── Create ────────────────────────────────────────────────────────

message CreateBookingServiceRequest {
  string name = 1;
  string description = 2;
  int32 duration_minutes = 3;
  double price = 4;
  string color = 5;
  bool is_active = 6;
}

message CreateBookingServiceResponse {
  int64 id = 1;
  string message = 2;
}

// ── Update ────────────────────────────────────────────────────────

message UpdateBookingServiceRequest {
  int64 id = 1;
  string name = 2;
  string description = 3;
  int32 duration_minutes = 4;
  double price = 5;
  string color = 6;
  bool is_active = 7;
}

message UpdateBookingServiceResponse {
  string message = 1;
}

// ── Delete ────────────────────────────────────────────────────────

message DeleteBookingServiceRequest {
  int64 id = 1;
}

message DeleteBookingServiceResponse {
  string message = 1;
}
