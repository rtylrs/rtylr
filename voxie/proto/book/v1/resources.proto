syntax = "proto3";

package book;

option go_package = "github.com/voxire/voxie/gen/go/book/v1";

// ── Resource ──────────────────────────────────────────────────────

message Resource {
  int64 id = 1;
  int64 owner_id = 2;
  string name = 3;
  string type = 4;
  int32 capacity = 5;
  bool is_active = 6;
  string created_at = 7;
}

// ── List ──────────────────────────────────────────────────────────

message ListResourcesRequest {}

message ListResourcesResponse {
  repeated Resource resources = 1;
}

// ── Create ────────────────────────────────────────────────────────

message CreateResourceRequest {
  string name = 1;
  string type = 2;
  int32 capacity = 3;
  bool is_active = 4;
}

message CreateResourceResponse {
  int64 id = 1;
  string message = 2;
}

// ── Update ────────────────────────────────────────────────────────

message UpdateResourceRequest {
  int64 id = 1;
  string name = 2;
  string type = 3;
  int32 capacity = 4;
  bool is_active = 5;
}

message UpdateResourceResponse {
  string message = 1;
}

// ── Delete ────────────────────────────────────────────────────────

message DeleteResourceRequest {
  int64 id = 1;
}

message DeleteResourceResponse {
  string message = 1;
}
