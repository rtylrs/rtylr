openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /support/customer/v1/customers:
        get:
            tags:
                - CustomerService
            summary: listCustomers
            operationId: CustomerService_listCustomers
            parameters:
                - name: page
                  in: query
                  required: false
                  schema:
                    type: integer
                    format: int32
                - name: page_size
                  in: query
                  required: false
                  schema:
                    type: integer
                    format: int32
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/support.customer.v1.ListCustomersResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /support/customer/v1/customers/{id}:
        get:
            tags:
                - CustomerService
            summary: getCustomer
            operationId: CustomerService_getCustomer
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/support.customer.v1.GetCustomerResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        support.customer.v1.ListCustomersRequest:
            type: object
            properties:
                page:
                    type: integer
                    format: int32
                page_size:
                    type: integer
                    format: int32
            required:
                - page
                - page_size
        support.customer.v1.ListCustomersResponse:
            type: object
            properties:
                customers:
                    type: array
                    items:
                        $ref: '#/components/schemas/support.customer.v1.Customer'
                total:
                    type: integer
                    format: int32
                page:
                    type: integer
                    format: int32
                page_size:
                    type: integer
                    format: int32
            required:
                - customers
                - total
                - page
                - page_size
        support.customer.v1.Customer:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                business_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                email:
                    type: string
                phone:
                    type: string
                customer_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: |-
                        customer_id is the CRM customer this support record refers to; absent
                        when the party has not been matched to one. It is nullable because
                        support conversations arrive by email from people who may not be
                        customers yet: matching on email alone is not reliable enough to assert
                        the link, so the server sets it only on a confident match or when a human
                        confirms one.
                total_tickets:
                    type: integer
                    format: int32
                last_ticket_at:
                    type: string
                created_at:
                    type: string
            required:
                - id
                - business_id
                - name
                - email
                - phone
                - total_tickets
                - last_ticket_at
                - created_at
        support.customer.v1.GetCustomerRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - id
        support.customer.v1.GetCustomerResponse:
            type: object
            properties:
                customer:
                    allOf:
                        - $ref: '#/components/schemas/support.customer.v1.Customer'
            required:
                - customer
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: CustomerService
