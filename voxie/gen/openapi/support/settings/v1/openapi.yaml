openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /support/settings/v1/settings:
        get:
            tags:
                - SettingsService
            summary: getSettings
            operationId: SettingsService_getSettings
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/support.settings.v1.GetSettingsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        put:
            tags:
                - SettingsService
            summary: updateSettings
            operationId: SettingsService_updateSettings
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/support.settings.v1.UpdateSettingsRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/support.settings.v1.UpdateSettingsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        support.settings.v1.GetSettingsRequest:
            type: object
        support.settings.v1.GetSettingsResponse:
            type: object
            properties:
                settings:
                    allOf:
                        - $ref: '#/components/schemas/support.settings.v1.Settings'
            required:
                - settings
        support.settings.v1.Settings:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                business_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                auto_assign:
                    type: boolean
                sla_hours:
                    type: integer
                    format: int32
                business_hours:
                    type: string
                notification_email:
                    type: string
                created_at:
                    type: string
                updated_at:
                    type: string
            required:
                - id
                - business_id
                - auto_assign
                - sla_hours
                - business_hours
                - notification_email
                - created_at
                - updated_at
        support.settings.v1.UpdateSettingsRequest:
            type: object
            properties:
                auto_assign:
                    type: boolean
                sla_hours:
                    exclusiveMinimum: 0
                    type: integer
                    maximum: 1000
                    format: int32
                business_hours:
                    type: string
                notification_email:
                    type: string
            required:
                - auto_assign
                - sla_hours
                - business_hours
                - notification_email
        support.settings.v1.UpdateSettingsResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: SettingsService
