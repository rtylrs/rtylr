openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /support/knowledge/v1/articles:
        get:
            tags:
                - KnowledgeService
            summary: listArticles
            operationId: KnowledgeService_listArticles
            parameters:
                - name: page
                  in: query
                  required: false
                  schema:
                    type: integer
                    format: int32
                - name: page_size
                  in: query
                  required: false
                  schema:
                    type: integer
                    format: int32
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/support.knowledge.v1.ListArticlesResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        post:
            tags:
                - KnowledgeService
            summary: createArticle
            operationId: KnowledgeService_createArticle
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/support.knowledge.v1.CreateArticleRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/support.knowledge.v1.CreateArticleResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /support/knowledge/v1/articles/{id}:
        put:
            tags:
                - KnowledgeService
            summary: updateArticle
            operationId: KnowledgeService_updateArticle
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                title:
                                    type: string
                                slug:
                                    type: string
                                body:
                                    type: string
                                category:
                                    type: string
                                is_published:
                                    type: boolean
                            required:
                                - title
                                - slug
                                - body
                                - category
                                - is_published
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/support.knowledge.v1.UpdateArticleResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        delete:
            tags:
                - KnowledgeService
            summary: deleteArticle
            operationId: KnowledgeService_deleteArticle
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/support.knowledge.v1.DeleteArticleResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        support.knowledge.v1.ListArticlesRequest:
            type: object
            properties:
                page:
                    type: integer
                    format: int32
                page_size:
                    type: integer
                    format: int32
            required:
                - page
                - page_size
        support.knowledge.v1.ListArticlesResponse:
            type: object
            properties:
                articles:
                    type: array
                    items:
                        $ref: '#/components/schemas/support.knowledge.v1.Article'
                total:
                    type: integer
                    format: int32
                page:
                    type: integer
                    format: int32
                page_size:
                    type: integer
                    format: int32
            required:
                - articles
                - total
                - page
                - page_size
        support.knowledge.v1.Article:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                business_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                title:
                    type: string
                slug:
                    type: string
                body:
                    type: string
                category:
                    type: string
                is_published:
                    type: boolean
                views:
                    type: integer
                    format: int32
                created_at:
                    type: string
                updated_at:
                    type: string
            required:
                - id
                - business_id
                - title
                - slug
                - body
                - category
                - is_published
                - views
                - created_at
                - updated_at
        support.knowledge.v1.CreateArticleRequest:
            type: object
            properties:
                title:
                    type: string
                slug:
                    type: string
                body:
                    type: string
                category:
                    type: string
                is_published:
                    type: boolean
            required:
                - title
                - slug
                - body
                - category
                - is_published
        support.knowledge.v1.CreateArticleResponse:
            type: object
            properties:
                article_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                message:
                    type: string
            required:
                - article_id
                - message
        support.knowledge.v1.UpdateArticleRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                title:
                    type: string
                slug:
                    type: string
                body:
                    type: string
                category:
                    type: string
                is_published:
                    type: boolean
            required:
                - id
                - title
                - slug
                - body
                - category
                - is_published
        support.knowledge.v1.UpdateArticleResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        support.knowledge.v1.DeleteArticleRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - id
        support.knowledge.v1.DeleteArticleResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: KnowledgeService
