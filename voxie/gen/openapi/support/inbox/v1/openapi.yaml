openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /support/inbox/v1/inbox:
        get:
            tags:
                - InboxService
            summary: listInbox
            operationId: InboxService_listInbox
            parameters:
                - name: page
                  in: query
                  required: false
                  schema:
                    type: integer
                    format: int32
                - name: page_size
                  in: query
                  required: false
                  schema:
                    type: integer
                    format: int32
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/support.inbox.v1.ListInboxResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /support/inbox/v1/inbox/unread-count:
        get:
            tags:
                - InboxService
            summary: getUnreadCount
            operationId: InboxService_getUnreadCount
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/support.inbox.v1.GetUnreadCountResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        support.inbox.v1.ListInboxRequest:
            type: object
            properties:
                page:
                    type: integer
                    format: int32
                page_size:
                    type: integer
                    format: int32
            required:
                - page
                - page_size
        support.inbox.v1.ListInboxResponse:
            type: object
            properties:
                inbox:
                    type: array
                    items:
                        $ref: '#/components/schemas/support.inbox.v1.InboxItem'
                total:
                    type: integer
                    format: int32
                page:
                    type: integer
                    format: int32
                page_size:
                    type: integer
                    format: int32
            required:
                - inbox
                - total
                - page
                - page_size
        support.inbox.v1.InboxItem:
            type: object
            properties:
                ticket_id:
                    type: integer
                    format: int64
                customer_name:
                    type: string
                customer_email:
                    type: string
                subject:
                    type: string
                status:
                    type: string
                priority:
                    type: string
                channel:
                    type: string
                last_message:
                    type: string
                last_message_at:
                    type: string
                message_count:
                    type: integer
                    format: int32
            required:
                - ticket_id
                - customer_name
                - customer_email
                - subject
                - status
                - priority
                - channel
                - last_message
                - last_message_at
                - message_count
        support.inbox.v1.GetUnreadCountRequest:
            type: object
        support.inbox.v1.GetUnreadCountResponse:
            type: object
            properties:
                count:
                    type: integer
                    format: int32
            required:
                - count
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: InboxService
