openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /support/canned/v1/canned-responses:
        get:
            tags:
                - CannedResponseService
            summary: listCannedResponses
            operationId: CannedResponseService_listCannedResponses
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/support.canned.v1.ListCannedResponsesResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        post:
            tags:
                - CannedResponseService
            summary: createCannedResponse
            operationId: CannedResponseService_createCannedResponse
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/support.canned.v1.CreateCannedResponseRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/support.canned.v1.CreateCannedResponseResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /support/canned/v1/canned-responses/{id}:
        put:
            tags:
                - CannedResponseService
            summary: updateCannedResponse
            operationId: CannedResponseService_updateCannedResponse
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
                                body:
                                    type: string
                                category:
                                    type: string
                                shortcut:
                                    type: string
                            required:
                                - name
                                - body
                                - category
                                - shortcut
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/support.canned.v1.UpdateCannedResponseResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        delete:
            tags:
                - CannedResponseService
            summary: deleteCannedResponse
            operationId: CannedResponseService_deleteCannedResponse
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/support.canned.v1.DeleteCannedResponseResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        support.canned.v1.ListCannedResponsesRequest:
            type: object
        support.canned.v1.ListCannedResponsesResponse:
            type: object
            properties:
                canned_responses:
                    type: array
                    items:
                        $ref: '#/components/schemas/support.canned.v1.CannedResponse'
            required:
                - canned_responses
        support.canned.v1.CannedResponse:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                business_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                body:
                    type: string
                category:
                    type: string
                shortcut:
                    type: string
                created_at:
                    type: string
            required:
                - id
                - business_id
                - name
                - body
                - category
                - shortcut
                - created_at
        support.canned.v1.CreateCannedResponseRequest:
            type: object
            properties:
                name:
                    type: string
                body:
                    type: string
                category:
                    type: string
                shortcut:
                    type: string
            required:
                - name
                - body
                - category
                - shortcut
        support.canned.v1.CreateCannedResponseResponse:
            type: object
            properties:
                canned_response_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                message:
                    type: string
            required:
                - canned_response_id
                - message
        support.canned.v1.UpdateCannedResponseRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                body:
                    type: string
                category:
                    type: string
                shortcut:
                    type: string
            required:
                - id
                - name
                - body
                - category
                - shortcut
        support.canned.v1.UpdateCannedResponseResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        support.canned.v1.DeleteCannedResponseRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - id
        support.canned.v1.DeleteCannedResponseResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: CannedResponseService
