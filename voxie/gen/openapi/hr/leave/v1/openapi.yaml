openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /hr/leave/v1/requests:
        get:
            tags:
                - LeaveService
            summary: listLeaveRequests
            description: ListLeaveRequests returns leave requests with optional filters.
            operationId: LeaveService_listLeaveRequests
            parameters:
                - name: employee_id
                  in: query
                  required: false
                  schema:
                    type: string
                    format: int64
                    description: Filter by employee; absent to include all employees.
                - name: status
                  in: query
                  required: false
                  schema:
                    type: string
                    description: Filter by status; absent to include all statuses.
                - name: from_date
                  in: query
                  required: false
                  schema:
                    type: string
                    description: |-
                        Include requests overlapping this day or later (ISO-8601 date); absent
                        to leave the range open at the start. A request overlaps when it starts
                        on or before to_date and ends on or after from_date.
                - name: to_date
                  in: query
                  required: false
                  schema:
                    type: string
                    description: |-
                        Include requests overlapping this day or earlier (ISO-8601 date); absent
                        to leave the range open at the end.
                - name: limit
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                    description: Maximum number of records to return.
                - name: offset
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                    description: Number of records to skip for pagination.
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.leave.v1.ListLeaveRequestsResponse'
        post:
            tags:
                - LeaveService
            summary: createLeaveRequest
            description: CreateLeaveRequest submits a leave request.
            operationId: LeaveService_createLeaveRequest
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hr.leave.v1.CreateLeaveRequestRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.leave.v1.CreateLeaveRequestResponse'
    /hr/leave/v1/requests/{request_id}/approve:
        patch:
            tags:
                - LeaveService
            summary: approveLeave
            description: ApproveLeave approves a leave request.
            operationId: LeaveService_approveLeave
            parameters:
                - name: request_id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/hr.leave.v1.ApproveLeaveBody'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.leave.v1.ApproveLeaveResponse'
    /hr/leave/v1/requests/{request_id}/cancel:
        patch:
            tags:
                - LeaveService
            summary: cancelLeaveRequest
            description: CancelLeaveRequest withdraws the caller's own pending leave request.
            operationId: LeaveService_cancelLeaveRequest
            parameters:
                - name: request_id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hr.leave.v1.CancelLeaveRequestRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.leave.v1.CancelLeaveResponse'
    /hr/leave/v1/types:
        get:
            tags:
                - LeaveService
            summary: listLeaveTypes
            description: ListLeaveTypes returns configured leave types.
            operationId: LeaveService_listLeaveTypes
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.leave.v1.ListLeaveTypesResponse'
        post:
            tags:
                - LeaveService
            summary: createLeaveType
            description: CreateLeaveType creates a leave type.
            operationId: LeaveService_createLeaveType
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hr.leave.v1.CreateLeaveTypeRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.leave.v1.CreateLeaveTypeResponse'
    /hr/leave/v1/types/{id}:
        put:
            tags:
                - LeaveService
            summary: updateLeaveType
            description: UpdateLeaveType updates an existing leave type.
            operationId: LeaveService_updateLeaveType
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/hr.leave.v1.UpdateLeaveTypeBody'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.leave.v1.UpdateLeaveTypeResponse'
    /hr/leave/v1/balances:
        get:
            tags:
                - LeaveService
            summary: listLeaveBalances
            description: ListLeaveBalances returns leave balances with optional filters.
            operationId: LeaveService_listLeaveBalances
            parameters:
                - name: employee_id
                  in: query
                  required: false
                  schema:
                    type: string
                    format: int64
                    description: Filter by employee; absent to include all employees.
                - name: year
                  in: query
                  required: false
                  schema:
                    type: integer
                    format: int32
                    description: Filter by year; absent to return current year.
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.leave.v1.ListLeaveBalancesResponse'
components:
    schemas:
        hr.leave.v1.ListLeaveRequestsRequest:
            type: object
            properties:
                employee_id:
                    type: string
                    format: int64
                    description: Filter by employee; absent to include all employees.
                status:
                    type: string
                    description: Filter by status; absent to include all statuses.
                from_date:
                    type: string
                    description: |-
                        Include requests overlapping this day or later (ISO-8601 date); absent
                        to leave the range open at the start. A request overlaps when it starts
                        on or before to_date and ends on or after from_date.
                to_date:
                    type: string
                    description: |-
                        Include requests overlapping this day or earlier (ISO-8601 date); absent
                        to leave the range open at the end.
                limit:
                    type: integer
                    format: int32
                    description: Maximum number of records to return.
                offset:
                    type: integer
                    format: int32
                    description: Number of records to skip for pagination.
        hr.leave.v1.ListLeaveRequestsResponse:
            type: object
            properties:
                requests:
                    type: array
                    items:
                        $ref: '#/components/schemas/hr.leave.v1.LeaveRequestPayload'
                    description: Page of leave requests matching the filters.
                total:
                    type: integer
                    format: int64
                    description: Total number of matching leave requests across all pages.
                limit:
                    type: integer
                    format: int32
                    description: Page size used for this request.
                offset:
                    type: integer
                    format: int32
                    description: Offset used for this request.
        hr.leave.v1.LeaveRequestPayload:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: Unique identifier for the leave request.
                owner_id:
                    type: string
                    format: int64
                    description: Tenant owner this request belongs to.
                employee_id:
                    type: string
                    format: int64
                    description: Employee who is requesting leave.
                leave_type_id:
                    type: string
                    format: int64
                    description: Leave type being requested.
                start_date:
                    type: string
                    description: First day of leave (ISO-8601 date).
                end_date:
                    type: string
                    description: Last day of leave (ISO-8601 date).
                total_days:
                    type: number
                    format: double
                    description: Total number of working days requested (may be fractional for half-days).
                notes:
                    type: string
                    description: Additional context from the employee; absent if none provided.
                status:
                    type: string
                    description: Workflow status (pending | approved | rejected | cancelled).
                current_approval_level:
                    type: integer
                    format: int32
                    description: Current step in a multi-level approval chain.
                rejection_reason:
                    type: string
                    description: Reason the request was rejected; absent unless status is rejected.
                created_at:
                    type: string
                    format: int64
                    description: Unix timestamp when this record was created.
                updated_at:
                    type: string
                    format: int64
                    description: Unix timestamp when this record was last updated.
            description: LeaveRequestPayload is a single employee's request for time off.
        hr.leave.v1.CreateLeaveRequestRequest:
            type: object
            properties:
                employee_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: Employee requesting leave.
                leave_type_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: Leave type being requested.
                start_date:
                    type: string
                    description: First day of leave (ISO-8601 date).
                end_date:
                    type: string
                    description: Last day of leave (ISO-8601 date).
                total_days:
                    exclusiveMinimum: 0
                    type: number
                    format: double
                    description: Total number of working days requested.
                notes:
                    type: string
                    description: Additional context from the employee; absent if none provided.
            required:
                - employee_id
                - leave_type_id
                - start_date
                - end_date
                - total_days
        hr.leave.v1.CreateLeaveRequestResponse:
            type: object
            properties:
                request:
                    allOf:
                        - $ref: '#/components/schemas/hr.leave.v1.LeaveRequestPayload'
                    description: The newly created leave request.
        hr.leave.v1.ApproveLeaveRequest:
            type: object
            properties:
                request_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: request_id is the leave request being reviewed.
                body:
                    allOf:
                        - $ref: '#/components/schemas/hr.leave.v1.ApproveLeaveBody'
        hr.leave.v1.ApproveLeaveBody:
            type: object
            properties:
                approved:
                    type: boolean
                    description: True to approve, false to reject.
                rejection_reason:
                    type: string
                    description: Reason for rejection; absent if approving.
            description: ApproveLeaveBody carries approval decision fields bound from the HTTP payload.
        hr.leave.v1.ApproveLeaveResponse:
            type: object
            properties:
                success:
                    type: boolean
                    description: Whether the approval action was processed.
        hr.leave.v1.CancelLeaveRequestRequest:
            type: object
            properties:
                request_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: |-
                        request_id is the leave request being withdrawn. Only the request's own
                        subject may cancel it, and only while it is still pending - the leave
                        approval permission grants no override here.
        hr.leave.v1.CancelLeaveResponse:
            type: object
            properties:
                success:
                    type: boolean
                    description: Whether the request was still pending and is now canceled.
        hr.leave.v1.ListLeaveTypesRequest:
            type: object
        hr.leave.v1.ListLeaveTypesResponse:
            type: object
            properties:
                leave_types:
                    type: array
                    items:
                        $ref: '#/components/schemas/hr.leave.v1.LeaveTypePayload'
                    description: All leave types configured for the tenant.
                total:
                    type: integer
                    format: int64
                    description: Total number of leave types.
                limit:
                    type: integer
                    format: int32
                    description: Page size used for this request.
                offset:
                    type: integer
                    format: int32
                    description: Offset used for this request.
        hr.leave.v1.LeaveTypePayload:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    description: Unique identifier for the leave type.
                owner_id:
                    type: string
                    format: int64
                    description: Tenant owner this leave type belongs to.
                name:
                    type: string
                    description: Human-readable name (e.g. "Annual Leave", "Sick Leave").
                is_paid:
                    type: boolean
                    description: Whether days taken under this type are paid.
                requires_approval:
                    type: boolean
                    description: Whether leave requests of this type require manager approval.
                accrual_rule:
                    type: string
                    description: Rule describing how entitlement accrues (e.g. "monthly", "yearly"); absent if entitlement is fixed.
                max_carryover_days:
                    type: integer
                    format: int32
                    description: Maximum unused days that may carry over to the next year.
                min_notice_days:
                    type: integer
                    format: int32
                    description: Minimum calendar days of notice required before the leave starts.
                requires_documentation_after_days:
                    type: integer
                    format: int32
                    description: Number of consecutive days after which supporting documentation is required; absent if never required.
                is_active:
                    type: boolean
                    description: Whether this leave type is currently available for new requests.
                created_at:
                    type: string
                    format: int64
                    description: Unix timestamp when this record was created.
                updated_at:
                    type: string
                    format: int64
                    description: Unix timestamp when this record was last updated.
            description: LeaveTypePayload defines a category of leave employees can request.
        hr.leave.v1.CreateLeaveTypeRequest:
            type: object
            properties:
                name:
                    type: string
                    description: Human-readable name (e.g. "Annual Leave", "Sick Leave").
                is_paid:
                    type: boolean
                    description: Whether days taken under this type are paid.
                requires_approval:
                    type: boolean
                    description: Whether leave requests of this type require manager approval.
                accrual_rule:
                    type: string
                    description: Accrual rule; absent if entitlement is fixed.
                max_carryover_days:
                    exclusiveMinimum: 0
                    type: integer
                    format: int32
                    description: Maximum unused days that may carry over to the next year.
                min_notice_days:
                    exclusiveMinimum: 0
                    type: integer
                    format: int32
                    description: Minimum calendar days of notice required.
                requires_documentation_after_days:
                    type: integer
                    format: int32
                    description: Consecutive days after which documentation is required; absent if never.
            required:
                - name
                - max_carryover_days
                - min_notice_days
        hr.leave.v1.CreateLeaveTypeResponse:
            type: object
            properties:
                leave_type:
                    allOf:
                        - $ref: '#/components/schemas/hr.leave.v1.LeaveTypePayload'
                    description: The newly created leave type.
        hr.leave.v1.UpdateLeaveTypeRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: ID of the leave type to update.
                body:
                    allOf:
                        - $ref: '#/components/schemas/hr.leave.v1.UpdateLeaveTypeBody'
        hr.leave.v1.UpdateLeaveTypeBody:
            type: object
            properties:
                name:
                    type: string
                    description: Updated name; absent to keep current value.
                is_paid:
                    type: boolean
                    description: Updated paid status; absent to keep current value.
                requires_approval:
                    type: boolean
                    description: Updated approval requirement; absent to keep current value.
                accrual_rule:
                    type: string
                    description: Updated accrual rule; absent to keep current value.
                max_carryover_days:
                    type: integer
                    format: int32
                    description: Updated max carryover days; absent to keep current value.
                min_notice_days:
                    type: integer
                    format: int32
                    description: Updated min notice days; absent to keep current value.
                requires_documentation_after_days:
                    type: integer
                    format: int32
                    description: Updated documentation threshold; absent to keep current value.
                is_active:
                    type: boolean
                    description: Updated active status; absent to keep current value.
            description: UpdateLeaveTypeBody carries updatable leave type fields bound from the HTTP payload.
        hr.leave.v1.UpdateLeaveTypeResponse:
            type: object
            properties:
                leave_type:
                    allOf:
                        - $ref: '#/components/schemas/hr.leave.v1.LeaveTypePayload'
                    description: The updated leave type.
        hr.leave.v1.ListLeaveBalancesRequest:
            type: object
            properties:
                employee_id:
                    type: string
                    format: int64
                    description: Filter by employee; absent to include all employees.
                year:
                    type: integer
                    format: int32
                    description: Filter by year; absent to return current year.
        hr.leave.v1.ListLeaveBalancesResponse:
            type: object
            properties:
                balances:
                    type: array
                    items:
                        $ref: '#/components/schemas/hr.leave.v1.LeaveBalancePayload'
                    description: Leave balances matching the filters.
                total:
                    type: integer
                    format: int64
                    description: Total number of matching balances across all pages.
                limit:
                    type: integer
                    format: int32
                    description: Page size used for this request.
                offset:
                    type: integer
                    format: int32
                    description: Offset used for this request.
        hr.leave.v1.LeaveBalancePayload:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    description: Unique identifier for the balance record.
                owner_id:
                    type: string
                    format: int64
                    description: Tenant owner this balance belongs to.
                employee_id:
                    type: string
                    format: int64
                    description: Employee this balance is for.
                leave_type_id:
                    type: string
                    format: int64
                    description: Leave type this balance tracks.
                year:
                    type: integer
                    format: int32
                    description: Calendar year this balance applies to.
                entitled_days:
                    type: number
                    format: double
                    description: Total entitled days for the year (including carryover).
                used_days:
                    type: number
                    format: double
                    description: Days already consumed by approved requests.
                pending_days:
                    type: number
                    format: double
                    description: Days reserved by pending (not yet approved) requests.
                remaining_days:
                    type: number
                    format: double
                    description: Days still available (entitled - used - pending).
                created_at:
                    type: string
                    format: int64
                    description: Unix timestamp when this record was created.
                updated_at:
                    type: string
                    format: int64
                    description: Unix timestamp when this record was last updated.
            description: LeaveBalancePayload tracks an employee's remaining entitlement for a leave type and year.
