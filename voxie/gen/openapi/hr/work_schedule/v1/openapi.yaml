openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /hr/work-schedule/v1/work-schedules:
        get:
            tags:
                - WorkScheduleService
            summary: listWorkSchedules
            description: Lists work schedules for the tenant.
            operationId: WorkScheduleService_listWorkSchedules
            parameters:
                - name: limit
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                    description: The maximum number of records to return.
                - name: offset
                  in: query
                  required: false
                  schema:
                    type: integer
                    format: int32
                    description: offset is the number of records to skip, for paging through the list.
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.work_schedule.v1.ListWorkSchedulesResponse'
        post:
            tags:
                - WorkScheduleService
            summary: createWorkSchedule
            description: Creates a new work schedule.
            operationId: WorkScheduleService_createWorkSchedule
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hr.work_schedule.v1.CreateWorkScheduleRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.work_schedule.v1.CreateWorkScheduleResponse'
    /hr/work-schedule/v1/work-schedules/{id}:
        put:
            tags:
                - WorkScheduleService
            summary: updateWorkSchedule
            description: Updates an existing work schedule.
            operationId: WorkScheduleService_updateWorkSchedule
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/hr.work_schedule.v1.UpdateWorkScheduleBody'
                            description: body carries updatable work schedule fields bound from the HTTP payload.
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.work_schedule.v1.UpdateWorkScheduleResponse'
components:
    schemas:
        hr.work_schedule.v1.ListWorkSchedulesRequest:
            type: object
            properties:
                limit:
                    type: integer
                    format: int32
                    description: The maximum number of records to return.
                offset:
                    type: integer
                    format: int32
                    description: offset is the number of records to skip, for paging through the list.
            required:
                - limit
        hr.work_schedule.v1.ListWorkSchedulesResponse:
            type: object
            properties:
                schedules:
                    type: array
                    items:
                        $ref: '#/components/schemas/hr.work_schedule.v1.WorkSchedulePayload'
                    description: All work schedules for the tenant.
                total:
                    type: integer
                    format: int32
                    description: total is the total number of schedules for the tenant, for pagination math.
            required:
                - schedules
                - total
            description: |-
                ListWorkSchedulesResponse lists work schedules for the tenant.

                Read by Flow to size a member's workload bar against the hours they are
                actually contracted for, resolved through Employee.work_schedule_id. Before
                this had an RPC, Flow hardcoded 40 hours for everyone, which reads a
                part-timer as under-loaded and a four-day week as a shortfall.
        hr.work_schedule.v1.WorkSchedulePayload:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    description: Unique identifier for the work schedule.
                owner_id:
                    type: string
                    format: int64
                    description: Tenant owner this schedule belongs to.
                name:
                    type: string
                    description: Display name of the schedule (e.g. "Standard 9-5").
                working_days:
                    type: array
                    items:
                        type: string
                    description: Days of the week this schedule applies to (e.g. ["monday", "tuesday"]).
                start_time:
                    type: string
                    description: Shift start time in HH:MM 24-hour format.
                end_time:
                    type: string
                    description: Shift end time in HH:MM 24-hour format.
                break_minutes:
                    type: integer
                    format: int32
                    description: Duration of the daily break in minutes.
                contracted_hours_per_week:
                    type: number
                    format: double
                    description: Total contracted hours per week (e.g. 40.0).
                daily_ot_threshold_minutes:
                    type: integer
                    format: int32
                    description: Daily overtime threshold in minutes; hours beyond this count as OT.
                weekly_ot_threshold_minutes:
                    type: integer
                    format: int32
                    description: Weekly overtime threshold in minutes; hours beyond this count as OT.
                created_at:
                    type: string
                    format: int64
                    description: Unix timestamp when this schedule was created.
                updated_at:
                    type: string
                    format: int64
                    description: Unix timestamp when this schedule was last updated.
            required:
                - id
                - owner_id
                - name
                - working_days
                - start_time
                - end_time
                - break_minutes
                - contracted_hours_per_week
                - daily_ot_threshold_minutes
                - weekly_ot_threshold_minutes
                - created_at
                - updated_at
            description: WorkSchedulePayload is a recurring staff work schedule.
        hr.work_schedule.v1.CreateWorkScheduleRequest:
            type: object
            properties:
                name:
                    type: string
                    description: Display name of the schedule.
                working_days:
                    type: array
                    items:
                        type: string
                    minItems: 1
                    description: Days of the week this schedule applies to.
                start_time:
                    type: string
                    description: Shift start time in HH:MM 24-hour format.
                end_time:
                    type: string
                    description: Shift end time in HH:MM 24-hour format.
                break_minutes:
                    type: integer
                    minimum: 0
                    format: int32
                    description: Duration of the daily break in minutes.
                contracted_hours_per_week:
                    type: number
                    minimum: 0
                    format: double
                    description: Total contracted hours per week.
                daily_ot_threshold_minutes:
                    type: integer
                    minimum: 0
                    format: int32
                    description: Daily overtime threshold in minutes.
                weekly_ot_threshold_minutes:
                    type: integer
                    minimum: 0
                    format: int32
                    description: Weekly overtime threshold in minutes.
            required:
                - name
                - working_days
                - start_time
                - end_time
                - break_minutes
                - contracted_hours_per_week
                - daily_ot_threshold_minutes
                - weekly_ot_threshold_minutes
        hr.work_schedule.v1.CreateWorkScheduleResponse:
            type: object
            properties:
                schedule:
                    allOf:
                        - $ref: '#/components/schemas/hr.work_schedule.v1.WorkSchedulePayload'
                    description: The newly created work schedule.
            required:
                - schedule
        hr.work_schedule.v1.UpdateWorkScheduleRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: ID of the schedule to update.
                body:
                    allOf:
                        - $ref: '#/components/schemas/hr.work_schedule.v1.UpdateWorkScheduleBody'
                    description: body carries updatable work schedule fields bound from the HTTP payload.
            required:
                - id
                - body
        hr.work_schedule.v1.UpdateWorkScheduleBody:
            type: object
            properties:
                name:
                    type: string
                    description: New name; absent to keep current.
                working_days:
                    type: array
                    items:
                        type: string
                    minItems: 1
                    description: New working days; if provided, replaces all existing days.
                start_time:
                    type: string
                    description: New start time; absent to keep current.
                end_time:
                    type: string
                    description: New end time; absent to keep current.
                break_minutes:
                    type: integer
                    format: int32
                    description: New break duration in minutes; absent to keep current.
                contracted_hours_per_week:
                    type: number
                    format: double
                    description: New contracted hours per week; absent to keep current.
                daily_ot_threshold_minutes:
                    type: integer
                    format: int32
                    description: New daily OT threshold; absent to keep current.
                weekly_ot_threshold_minutes:
                    type: integer
                    format: int32
                    description: New weekly OT threshold; absent to keep current.
            required:
                - working_days
        hr.work_schedule.v1.UpdateWorkScheduleResponse:
            type: object
            properties:
                schedule:
                    allOf:
                        - $ref: '#/components/schemas/hr.work_schedule.v1.WorkSchedulePayload'
                    description: The updated work schedule.
            required:
                - schedule
