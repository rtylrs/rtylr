openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /hr/benefit/v1/benefits:
        get:
            tags:
                - BenefitService
            summary: listBenefits
            operationId: BenefitService_listBenefits
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.benefit.v1.ListBenefitsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        post:
            tags:
                - BenefitService
            summary: createBenefit
            operationId: BenefitService_createBenefit
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hr.benefit.v1.CreateBenefitRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.benefit.v1.CreateBenefitResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /hr/benefit/v1/benefits/enrollments:
        post:
            tags:
                - BenefitService
            summary: enrollInBenefit
            description: Enrolls the calling employee in a benefit plan.
            operationId: BenefitService_enrollInBenefit
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hr.benefit.v1.EnrollInBenefitRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.benefit.v1.EnrollInBenefitResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /hr/benefit/v1/benefits/enrollments/mine:
        get:
            tags:
                - BenefitService
            summary: listMyBenefitEnrollments
            description: Returns the calling employee's own benefit enrollments.
            operationId: BenefitService_listMyBenefitEnrollments
            parameters:
                - name: page
                  in: query
                  description: page is the current result page.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    description: page is the current result page.
                - name: limit
                  in: query
                  description: limit is the maximum number of records to return.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    description: limit is the maximum number of records to return.
                - name: sort_by
                  in: query
                  description: sort_by is the field to sort results by.
                  required: false
                  schema:
                    type: string
                    description: sort_by is the field to sort results by.
                - name: sort_dir
                  in: query
                  description: sort_dir is the sort direction ("asc" or "desc").
                  required: false
                  schema:
                    type: string
                    description: sort_dir is the sort direction ("asc" or "desc").
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.benefit.v1.ListMyBenefitEnrollmentsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        hr.benefit.v1.ListBenefitsRequest:
            type: object
        hr.benefit.v1.ListBenefitsResponse:
            type: object
            properties:
                plans:
                    type: array
                    items:
                        $ref: '#/components/schemas/hr.benefit.v1.BenefitPlan'
            required:
                - plans
        hr.benefit.v1.BenefitPlan:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                owner_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                type:
                    type: string
                provider:
                    type: string
                cost_employer:
                    type: number
                    format: double
                cost_employee:
                    type: number
                    format: double
                is_active:
                    type: boolean
                created_at:
                    type: string
            required:
                - id
                - owner_id
                - name
                - type
                - provider
                - cost_employer
                - cost_employee
                - is_active
                - created_at
        hr.benefit.v1.CreateBenefitRequest:
            type: object
            properties:
                name:
                    type: string
                type:
                    type: string
                provider:
                    type: string
                cost_employer:
                    type: number
                    format: double
                cost_employee:
                    type: number
                    format: double
                is_active:
                    type: boolean
            required:
                - name
                - type
                - provider
                - cost_employer
                - cost_employee
                - is_active
        hr.benefit.v1.CreateBenefitResponse:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                message:
                    type: string
            required:
                - id
                - message
        hr.benefit.v1.EnrollInBenefitRequest:
            type: object
            properties:
                plan_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: plan_id is the BenefitPlan to enroll in. The employee is resolved from auth context, not client-supplied.
            required:
                - plan_id
        hr.benefit.v1.EnrollInBenefitResponse:
            type: object
            properties:
                enrollment:
                    allOf:
                        - $ref: '#/components/schemas/hr.benefit.v1.BenefitEnrollment'
                    description: enrollment is the created BenefitEnrollment record.
            required:
                - enrollment
        hr.benefit.v1.BenefitEnrollment:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: id is the enrollment record's unique identifier.
                owner_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: owner_id is the business that owns the underlying BenefitPlan.
                employee_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: employee_id is the enrolled employee; always resolved from auth context, never client-supplied.
                plan_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: plan_id references the BenefitPlan this enrollment is for.
                status:
                    type: string
                    description: status is the enrollment lifecycle state (active | cancelled).
                enrolled_at:
                    type: string
                    description: enrolled_at is when the employee enrolled, in ISO-8601 format.
                cancelled_at:
                    type: string
                    description: cancelled_at is when the enrollment was cancelled, in ISO-8601 format; absent while the enrollment is active.
            required:
                - id
                - owner_id
                - employee_id
                - plan_id
                - status
                - enrolled_at
        hr.benefit.v1.ListMyBenefitEnrollmentsRequest:
            type: object
            properties:
                page:
                    type: integer
                    format: int32
                    description: page is the current result page.
                limit:
                    type: integer
                    format: int32
                    description: limit is the maximum number of records to return.
                sort_by:
                    type: string
                    description: sort_by is the field to sort results by.
                sort_dir:
                    type: string
                    description: sort_dir is the sort direction ("asc" or "desc").
            required:
                - page
                - limit
                - sort_by
                - sort_dir
        hr.benefit.v1.ListMyBenefitEnrollmentsResponse:
            type: object
            properties:
                enrollments:
                    type: array
                    items:
                        $ref: '#/components/schemas/hr.benefit.v1.BenefitEnrollment'
                    description: enrollments are the caller's own BenefitEnrollment records.
                pagination:
                    allOf:
                        - $ref: '#/components/schemas/common.pagination.v1.PaginationResponse'
            required:
                - enrollments
                - pagination
        common.pagination.v1.PaginationResponse:
            type: object
            properties:
                page:
                    type: integer
                    format: int32
                    description: page is the current result page.
                limit:
                    type: integer
                    format: int32
                    description: limit is the maximum number of records to return.
                total:
                    type: integer
                    format: int32
                    description: total is the total number of matching records.
                total_pages:
                    type: integer
                    format: int32
                    description: total_pages is the total pages value for this contract.
                has_next:
                    type: boolean
                    description: has_next is the has next value for this contract.
                has_prev:
                    type: boolean
                    description: has_prev is the has prev value for this contract.
            required:
                - page
                - limit
                - total
                - total_pages
                - has_next
                - has_prev
            description: Standard pagination response metadata.
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: BenefitService
