openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /hr/setup/v1/steps:
        post:
            tags:
                - SetupService
            summary: completeSetupStep
            description: Marks a setup step complete.
            operationId: SetupService_completeSetupStep
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hr.setup.v1.CompleteSetupStepRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.setup.v1.CompleteSetupStepResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        hr.setup.v1.CompleteSetupStepRequest:
            type: object
            properties:
                step_key:
                    type: string
                    description: The step to mark as completed (must match a valid step_key).
            required:
                - step_key
        hr.setup.v1.CompleteSetupStepResponse:
            type: object
            properties:
                step:
                    allOf:
                        - $ref: '#/components/schemas/hr.setup.v1.SetupWizardStepPayload'
                    description: The step after being marked complete.
            required:
                - step
        hr.setup.v1.SetupWizardStepPayload:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: Unique identifier for the setup step record.
                owner_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: Tenant owner this step belongs to.
                step_key:
                    type: string
                    description: Which setup step this represents (company_profile | work_schedule | leave_policy | org_structure | locations | roles_permissions | payroll | notifications | employees).
                completed_at:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: Unix timestamp when this step was completed; absent if not yet completed.
                created_at:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: Unix timestamp when this step record was created.
                updated_at:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: Unix timestamp when this step record was last updated.
            required:
                - id
                - owner_id
                - step_key
                - created_at
                - updated_at
            description: SetupWizardStepPayload is a single step in the HR setup wizard.
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: SetupService
      description: SetupService defines HR setup wizard endpoints.
