openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /hr/department/v1/departments:
        get:
            tags:
                - DepartmentService
            summary: listDepartments
            description: ListDepartments returns departments for the active business.
            operationId: DepartmentService_listDepartments
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.department.v1.ListDepartmentsResponse'
        post:
            tags:
                - DepartmentService
            summary: createDepartment
            description: CreateDepartment creates a new department.
            operationId: DepartmentService_createDepartment
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hr.department.v1.CreateDepartmentRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.department.v1.CreateDepartmentResponse'
    /hr/department/v1/departments/{id}:
        put:
            tags:
                - DepartmentService
            summary: updateDepartment
            description: UpdateDepartment updates an existing department.
            operationId: DepartmentService_updateDepartment
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/hr.department.v1.UpdateDepartmentBody'
                            description: body carries updatable department fields bound from the HTTP payload.
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.department.v1.UpdateDepartmentResponse'
        delete:
            tags:
                - DepartmentService
            summary: deleteDepartment
            description: DeleteDepartment deletes a department.
            operationId: DepartmentService_deleteDepartment
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.department.v1.DeleteDepartmentResponse'
components:
    schemas:
        hr.department.v1.ListDepartmentsRequest:
            type: object
        hr.department.v1.ListDepartmentsResponse:
            type: object
            properties:
                departments:
                    type: array
                    items:
                        $ref: '#/components/schemas/hr.department.v1.DepartmentPayload'
        hr.department.v1.DepartmentPayload:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    description: Unique identifier for the department.
                owner_id:
                    type: string
                    format: int64
                    description: Tenant owner this department belongs to.
                business_id:
                    type: string
                    format: int64
                name:
                    type: string
                    description: Display name of the department.
                description:
                    type: string
                manager_staff_id:
                    type: string
                    format: int64
                created_at:
                    type: string
                    format: int64
                    description: Unix timestamp when this department was created.
                updated_at:
                    type: string
                    format: int64
                    description: Unix timestamp when this department was last updated.
            description: DepartmentPayload is an HR department record.
        hr.department.v1.CreateDepartmentRequest:
            type: object
            properties:
                name:
                    type: string
                    description: Display name of the department.
                description:
                    type: string
                manager_staff_id:
                    type: string
                    format: int64
            required:
                - name
        hr.department.v1.CreateDepartmentResponse:
            type: object
            properties:
                id:
                    type: string
                    format: int64
        hr.department.v1.UpdateDepartmentRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: ID of the department to update.
                body:
                    allOf:
                        - $ref: '#/components/schemas/hr.department.v1.UpdateDepartmentBody'
                    description: body carries updatable department fields bound from the HTTP payload.
        hr.department.v1.UpdateDepartmentBody:
            type: object
            properties:
                name:
                    type: string
                    description: name is the updated department name.
                description:
                    type: string
                manager_staff_id:
                    type: string
                    format: int64
            required:
                - name
        hr.department.v1.UpdateDepartmentResponse:
            type: object
            properties:
                success:
                    type: boolean
        hr.department.v1.DeleteDepartmentRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
        hr.department.v1.DeleteDepartmentResponse:
            type: object
            properties:
                success:
                    type: boolean
