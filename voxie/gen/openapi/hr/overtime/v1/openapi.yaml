openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /hr/overtime/v1/requests:
        get:
            tags:
                - OvertimeService
            summary: listOvertimeRequests
            description: ListOvertimeRequests returns overtime requests with optional filters.
            operationId: OvertimeService_listOvertimeRequests
            parameters:
                - name: employee_id
                  in: query
                  required: false
                  schema:
                    type: string
                    format: int64
                    description: Filter by employee; absent to include all employees.
                - name: status
                  in: query
                  required: false
                  schema:
                    type: string
                    description: Filter by status; absent to include all statuses.
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.overtime.v1.ListOvertimeRequestsResponse'
        post:
            tags:
                - OvertimeService
            summary: createOvertimeRequest
            description: CreateOvertimeRequest submits an overtime request.
            operationId: OvertimeService_createOvertimeRequest
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hr.overtime.v1.CreateOvertimeRequestRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.overtime.v1.CreateOvertimeRequestResponse'
    /hr/overtime/v1/requests/{overtime_request_id}/approve:
        patch:
            tags:
                - OvertimeService
            summary: approveOvertime
            description: ApproveOvertime approves an overtime request.
            operationId: OvertimeService_approveOvertime
            parameters:
                - name: overtime_request_id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/hr.overtime.v1.ApproveOvertimeBody'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.overtime.v1.ApproveOvertimeResponse'
components:
    schemas:
        hr.overtime.v1.ListOvertimeRequestsRequest:
            type: object
            properties:
                employee_id:
                    type: string
                    format: int64
                    description: Filter by employee; absent to include all employees.
                status:
                    type: string
                    description: Filter by status; absent to include all statuses.
        hr.overtime.v1.ListOvertimeRequestsResponse:
            type: object
            properties:
                requests:
                    type: array
                    items:
                        $ref: '#/components/schemas/hr.overtime.v1.OvertimeRequestPayload'
                    description: Page of overtime requests matching the filters.
                total:
                    type: integer
                    format: int64
                    description: Total number of matching overtime requests across all pages.
                limit:
                    type: integer
                    format: int32
                    description: Page size used for this request.
                offset:
                    type: integer
                    format: int32
                    description: Offset used for this request.
        hr.overtime.v1.OvertimeRequestPayload:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: Unique identifier for the overtime request.
                owner_id:
                    type: string
                    format: int64
                    description: Tenant owner this request belongs to.
                employee_id:
                    type: string
                    format: int64
                    description: Employee requesting overtime.
                date:
                    type: string
                    description: Date the overtime is planned for (ISO-8601 date).
                planned_extra_minutes:
                    type: integer
                    format: int32
                    description: Number of extra minutes planned beyond the regular shift.
                reason:
                    type: string
                    description: Justification for the overtime work.
                status:
                    type: string
                    description: Workflow status (pending | approved | rejected | cancelled).
                current_approval_level:
                    type: integer
                    format: int32
                    description: Current step in a multi-level approval chain.
                approved_by:
                    type: string
                    format: int64
                    description: Employee ID of the approver; absent if not yet approved.
                multiplier_applied:
                    type: number
                    format: double
                    description: Pay multiplier applied to the overtime hours (e.g. 1.5); absent if not yet calculated.
                created_at:
                    type: string
                    format: int64
                    description: Unix timestamp when this record was created.
                updated_at:
                    type: string
                    format: int64
                    description: Unix timestamp when this record was last updated.
            required:
                - id
            description: OvertimeRequestPayload is a single employee's request to work overtime.
        hr.overtime.v1.CreateOvertimeRequestRequest:
            type: object
            properties:
                employee_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: Employee requesting overtime.
                date:
                    type: string
                    description: Date the overtime is planned for (ISO-8601 date).
                planned_extra_minutes:
                    exclusiveMinimum: 0
                    type: integer
                    format: int32
                    description: Number of extra minutes planned beyond the regular shift.
                reason:
                    type: string
                    description: Justification for the overtime work.
            required:
                - employee_id
                - date
                - planned_extra_minutes
                - reason
        hr.overtime.v1.CreateOvertimeRequestResponse:
            type: object
            properties:
                request:
                    allOf:
                        - $ref: '#/components/schemas/hr.overtime.v1.OvertimeRequestPayload'
                    description: The newly created overtime request.
        hr.overtime.v1.ApproveOvertimeRequest:
            type: object
            properties:
                overtime_request_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: ID of the overtime request being reviewed.
                body:
                    allOf:
                        - $ref: '#/components/schemas/hr.overtime.v1.ApproveOvertimeBody'
        hr.overtime.v1.ApproveOvertimeBody:
            type: object
            properties:
                approved:
                    type: boolean
                    description: True to approve, false to reject.
                multiplier_applied:
                    type: number
                    format: double
                    description: Pay multiplier to apply (e.g. 1.5); absent to use the default rate.
                rejection_reason:
                    type: string
                    description: Reason for rejection; absent if approving.
            description: ApproveOvertimeBody carries approval decision fields bound from the HTTP payload.
        hr.overtime.v1.ApproveOvertimeResponse:
            type: object
            properties:
                success:
                    type: boolean
                    description: Whether the approval action was processed.
