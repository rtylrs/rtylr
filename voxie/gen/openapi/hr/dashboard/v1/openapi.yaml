openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /hr/dashboard/v1/dashboard:
        get:
            tags:
                - DashboardService
            summary: getHRDashboard
            description: GetHRDashboard returns the HR dashboard summary.
            operationId: DashboardService_getHRDashboard
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.dashboard.v1.GetHRDashboardResponse'
    /hr/dashboard/v1/dashboard/widgets:
        get:
            tags:
                - DashboardService
            summary: getDashboardWidgets
            description: GetDashboardWidgets returns widget layout and preloaded data.
            operationId: DashboardService_getDashboardWidgets
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.dashboard.v1.GetDashboardWidgetsResponse'
        put:
            tags:
                - DashboardService
            summary: updateDashboardWidgets
            description: UpdateDashboardWidgets saves widget layout for the current business.
            operationId: DashboardService_updateDashboardWidgets
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hr.dashboard.v1.UpdateDashboardWidgetsRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.dashboard.v1.UpdateDashboardWidgetsResponse'
components:
    schemas:
        hr.dashboard.v1.GetHRDashboardRequest:
            type: object
        hr.dashboard.v1.GetHRDashboardResponse:
            type: object
            properties:
                stats:
                    allOf:
                        - $ref: '#/components/schemas/hr.dashboard.v1.DashboardStats'
        hr.dashboard.v1.DashboardStats:
            type: object
            properties:
                total_staff:
                    type: string
                    format: int64
                    description: total_staff is the total staff value for this contract.
                on_shift_today:
                    type: string
                    format: int64
                    description: on_shift_today is the on shift today value for this contract.
                pending_time_off:
                    type: string
                    format: int64
                    description: pending_time_off is the pending time off value for this contract.
                payroll_draft:
                    type: string
                    format: int64
                    description: payroll_draft is the payroll draft value for this contract.
        hr.dashboard.v1.GetDashboardWidgetsRequest:
            type: object
        hr.dashboard.v1.GetDashboardWidgetsResponse:
            type: object
            properties:
                widgets:
                    type: array
                    items:
                        $ref: '#/components/schemas/hr.dashboard.v1.DashboardWidgetPayload'
                    description: Widget layout definitions for the requesting user's dashboard.
                data:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/hr.dashboard.v1.DashboardDataPayload'
                    description: Pre-loaded data keyed by widget type.
        hr.dashboard.v1.DashboardWidgetPayload:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    description: Unique identifier for the widget.
                owner_id:
                    type: string
                    format: int64
                    description: Tenant owner this widget belongs to.
                role_id:
                    type: string
                    format: int64
                    description: Role that owns this widget layout.
                widget_type:
                    type: string
                    description: Widget type identifier (e.g. headcount_chart, leave_summary).
                position_x:
                    type: integer
                    format: int32
                    description: Horizontal grid position.
                position_y:
                    type: integer
                    format: int32
                    description: Vertical grid position.
                width:
                    type: integer
                    format: int32
                    description: Widget width in grid units.
                height:
                    type: integer
                    format: int32
                    description: Widget height in grid units.
                config:
                    type: string
                    format: byte
                    description: Widget-specific configuration serialised as JSON.
                created_at:
                    type: string
                    format: int64
                    description: Unix timestamp when this widget was created.
                updated_at:
                    type: string
                    format: int64
                    description: Unix timestamp when this widget was last updated.
            description: DashboardWidgetPayload is a widget layout definition on the HR dashboard.
        hr.dashboard.v1.DashboardDataPayload:
            type: object
            properties:
                widget_type:
                    type: string
                    description: Widget type this data corresponds to.
                data:
                    type: string
                    format: byte
                    description: Serialised widget data as JSON.
            description: DashboardDataPayload is pre-loaded widget data keyed by widget type.
        hr.dashboard.v1.UpdateDashboardWidgetsRequest:
            type: object
            properties:
                widgets:
                    type: array
                    items:
                        $ref: '#/components/schemas/hr.dashboard.v1.DashboardWidgetPayload'
                    minItems: 1
                    description: Updated widget positions and sizes.
        hr.dashboard.v1.UpdateDashboardWidgetsResponse:
            type: object
            properties:
                success:
                    type: boolean
                    description: success indicates whether the operation completed.
