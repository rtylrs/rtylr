openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /hr/staff/v1/staff:
        get:
            tags:
                - StaffService
            summary: listStaff
            description: Returns staff members with optional filters.
            operationId: StaffService_listStaff
            parameters:
                - name: search
                  in: query
                  required: false
                  schema:
                    type: string
                - name: department_id
                  in: query
                  required: false
                  schema:
                    type: string
                - name: status
                  in: query
                  description: The current lifecycle state.
                  required: false
                  schema:
                    type: string
                    description: The current lifecycle state.
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.staff.v1.ListStaffResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        post:
            tags:
                - StaffService
            summary: createStaff
            description: Creates a new staff member.
            operationId: StaffService_createStaff
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hr.staff.v1.CreateStaffRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.staff.v1.CreateStaffResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /hr/staff/v1/staff/{id}:
        get:
            tags:
                - StaffService
            summary: getStaff
            description: Returns a staff member by ID.
            operationId: StaffService_getStaff
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.staff.v1.GetStaffResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        put:
            tags:
                - StaffService
            summary: updateStaff
            description: Updates an existing staff member.
            operationId: StaffService_updateStaff
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/hr.staff.v1.UpdateStaffBody'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.staff.v1.UpdateStaffResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        delete:
            tags:
                - StaffService
            summary: deleteStaff
            description: Removes a staff member by ID.
            operationId: StaffService_deleteStaff
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.staff.v1.DeleteStaffResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /hr/staff/v1/staff/clock-in:
        post:
            tags:
                - StaffService
            summary: clockIn
            description: Records a staff clock-in event.
            operationId: StaffService_clockIn
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hr.staff.v1.ClockInRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.staff.v1.ClockInResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /hr/staff/v1/staff/clock-out:
        post:
            tags:
                - StaffService
            summary: clockOut
            description: Records a staff clock-out event.
            operationId: StaffService_clockOut
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hr.staff.v1.ClockOutRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.staff.v1.ClockOutResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /hr/staff/v1/staff/directory:
        get:
            tags:
                - StaffService
            summary: listStaffDirectory
            description: |-
                Returns the paginated, business-wide staff directory. Gated by both
                the business's directory_enabled config flag and the caller's
                view_directory permission; distinct from listStaff, which serves
                HR's own admin screens with the full Staff shape.
            operationId: StaffService_listStaffDirectory
            parameters:
                - name: page
                  in: query
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                - name: page_size
                  in: query
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hr.staff.v1.ListStaffDirectoryResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        hr.staff.v1.ListStaffRequest:
            type: object
            properties:
                search:
                    type: string
                department_id:
                    type: string
                status:
                    type: string
                    description: The current lifecycle state.
            required:
                - search
                - department_id
                - status
        hr.staff.v1.ListStaffResponse:
            type: object
            properties:
                staff:
                    type: array
                    items:
                        $ref: '#/components/schemas/hr.staff.v1.Staff'
            required:
                - staff
        hr.staff.v1.Staff:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                owner_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                user_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                department_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                manager_staff_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: |-
                        manager_staff_id is this person's direct manager, as a STAFF id (not a
                        user id). Zero means no direct line, which is the common case: a
                        department manager is resolved separately from hr_departments.

                        Flow's dept-manager visibility proxy unions this with the department
                        relationship, so setting it widens what that manager can see.
                first_name:
                    type: string
                last_name:
                    type: string
                email:
                    type: string
                phone:
                    type: string
                role:
                    type: string
                employment_type:
                    type: string
                status:
                    type: string
                    description: The current lifecycle state.
                salary:
                    type: number
                    format: double
                hourly_rate:
                    type: number
                    format: double
                overtime_rate:
                    type: number
                    format: double
                start_date:
                    type: string
                end_date:
                    type: string
                address:
                    type: string
                emergency_contact_name:
                    type: string
                emergency_contact_phone:
                    type: string
                apps:
                    type: string
                notes:
                    type: string
                photo_url:
                    type: string
                    description: |-
                        A URL to the staff member's profile photo. Optional and unset by default:
                        consumers fall back to the hub account avatar, which is what Flow's profile
                        screen already does.
                bio:
                    type: string
                    description: |-
                        A short self-description shown on a profile screen.

                        Deliberately separate from `notes`. `notes` is HR-admin commentary about a
                        person and must never be rendered as an "About" section; a dead write path
                        in the HR app mapped bio onto notes, and that mapping was wrong. See
                        tryrtylr/rtylr#875.
                created_at:
                    type: string
                    description: When the record was created.
                updated_at:
                    type: string
                    description: When the record was last updated.
            required:
                - id
                - owner_id
                - user_id
                - department_id
                - manager_staff_id
                - first_name
                - last_name
                - email
                - phone
                - role
                - employment_type
                - status
                - salary
                - hourly_rate
                - overtime_rate
                - start_date
                - end_date
                - address
                - emergency_contact_name
                - emergency_contact_phone
                - apps
                - notes
                - photo_url
                - bio
                - created_at
                - updated_at
            description: Staff is an HR staff member record.
        hr.staff.v1.CreateStaffRequest:
            type: object
            properties:
                user_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                department_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                manager_staff_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: |-
                        Optional, unlike department_id: most staff have no explicit manager, and
                        @required @gt(0) would force callers to invent one.
                first_name:
                    type: string
                last_name:
                    type: string
                email:
                    type: string
                    format: email
                phone:
                    type: string
                role:
                    type: string
                employment_type:
                    type: string
                status:
                    type: string
                    description: The current lifecycle state.
                salary:
                    type: number
                    minimum: 0
                    format: double
                hourly_rate:
                    type: number
                    minimum: 0
                    format: double
                overtime_rate:
                    type: number
                    minimum: 0
                    format: double
                start_date:
                    type: string
                end_date:
                    type: string
                    description: |-
                        Empty for anyone still employed, which is why this is not @required.
                        Requiring it made every update to an active employee invalid, and the
                        rejection happened client side, so the write vanished with no error.
                address:
                    type: string
                emergency_contact_name:
                    type: string
                    description: |-
                        Optional HR detail. Not every record has next of kin on file, and
                        blocking an unrelated field update over it is not the way to collect it.
                emergency_contact_phone:
                    type: string
                apps:
                    type: string
                    description: |-
                        App access, empty meaning none. Optional for the same reason: a caller
                        changing one field should not have to assert app access to do it.
                notes:
                    type: string
                photo_url:
                    type: string
                    description: |-
                        A URL to the staff member's profile photo. Optional and unset by default:
                        consumers fall back to the hub account avatar, which is what Flow's profile
                        screen already does.
                bio:
                    type: string
                    description: |-
                        A short self-description shown on a profile screen.

                        Deliberately separate from `notes`. `notes` is HR-admin commentary about a
                        person and must never be rendered as an "About" section; a dead write path
                        in the HR app mapped bio onto notes, and that mapping was wrong. See
                        tryrtylr/rtylr#875.
            required:
                - user_id
                - department_id
                - manager_staff_id
                - first_name
                - last_name
                - email
                - phone
                - role
                - employment_type
                - status
                - salary
                - hourly_rate
                - overtime_rate
                - start_date
                - end_date
                - address
                - emergency_contact_name
                - emergency_contact_phone
                - apps
                - notes
                - photo_url
                - bio
        hr.staff.v1.CreateStaffResponse:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - id
        hr.staff.v1.GetStaffRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - id
        hr.staff.v1.GetStaffResponse:
            type: object
            properties:
                staff:
                    allOf:
                        - $ref: '#/components/schemas/hr.staff.v1.Staff'
            required:
                - staff
        hr.staff.v1.UpdateStaffRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                body:
                    allOf:
                        - $ref: '#/components/schemas/hr.staff.v1.UpdateStaffBody'
            required:
                - id
                - body
        hr.staff.v1.UpdateStaffBody:
            type: object
            properties:
                department_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                manager_staff_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: Optional for the same reason as on create. Zero clears the reporting line.
                first_name:
                    type: string
                last_name:
                    type: string
                email:
                    type: string
                    format: email
                phone:
                    type: string
                role:
                    type: string
                employment_type:
                    type: string
                status:
                    type: string
                    description: The current lifecycle state.
                salary:
                    type: number
                    minimum: 0
                    format: double
                hourly_rate:
                    type: number
                    minimum: 0
                    format: double
                overtime_rate:
                    type: number
                    minimum: 0
                    format: double
                end_date:
                    type: string
                    description: |-
                        Empty for anyone still employed, which is why this is not @required.
                        Requiring it made every update to an active employee invalid, and the
                        rejection happened client side, so the write vanished with no error.
                address:
                    type: string
                emergency_contact_name:
                    type: string
                    description: |-
                        Optional HR detail. Not every record has next of kin on file, and
                        blocking an unrelated field update over it is not the way to collect it.
                emergency_contact_phone:
                    type: string
                apps:
                    type: string
                    description: |-
                        App access, empty meaning none. Optional for the same reason: a caller
                        changing one field should not have to assert app access to do it.
                notes:
                    type: string
                photo_url:
                    type: string
                    description: |-
                        A URL to the staff member's profile photo. Optional and unset by default:
                        consumers fall back to the hub account avatar, which is what Flow's profile
                        screen already does.
                bio:
                    type: string
                    description: |-
                        A short self-description shown on a profile screen.

                        Deliberately separate from `notes`. `notes` is HR-admin commentary about a
                        person and must never be rendered as an "About" section; a dead write path
                        in the HR app mapped bio onto notes, and that mapping was wrong. See
                        tryrtylr/rtylr#875.
            required:
                - department_id
                - manager_staff_id
                - first_name
                - last_name
                - email
                - phone
                - role
                - employment_type
                - status
                - salary
                - hourly_rate
                - overtime_rate
                - end_date
                - address
                - emergency_contact_name
                - emergency_contact_phone
                - apps
                - notes
                - photo_url
                - bio
        hr.staff.v1.UpdateStaffResponse:
            type: object
            properties:
                success:
                    type: boolean
            required:
                - success
        hr.staff.v1.DeleteStaffRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - id
        hr.staff.v1.DeleteStaffResponse:
            type: object
            properties:
                success:
                    type: boolean
            required:
                - success
        hr.staff.v1.ClockInRequest:
            type: object
            properties:
                staff_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - staff_id
        hr.staff.v1.ClockInResponse:
            type: object
            properties:
                success:
                    type: boolean
            required:
                - success
        hr.staff.v1.ClockOutRequest:
            type: object
            properties:
                staff_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - staff_id
        hr.staff.v1.ClockOutResponse:
            type: object
            properties:
                success:
                    type: boolean
            required:
                - success
        hr.staff.v1.ListStaffDirectoryRequest:
            type: object
            properties:
                page:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                page_size:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - page
                - page_size
        hr.staff.v1.ListStaffDirectoryResponse:
            type: object
            properties:
                staff:
                    type: array
                    items:
                        $ref: '#/components/schemas/hr.staff.v1.DirectoryStaffEntry'
                total:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                page:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                page_size:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - staff
                - total
                - page
                - page_size
        hr.staff.v1.DirectoryStaffEntry:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                first_name:
                    type: string
                last_name:
                    type: string
                department_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                role:
                    type: string
                employment_type:
                    type: string
                status:
                    type: string
                    description: The current lifecycle state.
                email:
                    type: string
                phone:
                    type: string
            required:
                - id
                - first_name
                - last_name
                - department_id
                - role
                - employment_type
                - status
                - email
                - phone
            description: |-
                DirectoryStaffEntry is the deliberately minimal projection of Staff shown
                in the company-wide directory. It never carries salary, hourly_rate,
                overtime_rate, address, or emergency_contact_* - those stay HR-admin-only
                regardless of caller, enforced here at the contract level rather than
                relying solely on runtime field-zeroing.
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: StaffService
      description: StaffService defines HR staff endpoints.
