openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /crm/sales/v1/contracts:
        get:
            tags:
                - ContractService
            summary: listContracts
            description: Returns one page of contracts for this business.
            operationId: ContractService_listContracts
            parameters:
                - name: signed
                  in: query
                  description: |-
                    signed filters to contracts whose signing is complete when true, or
                    incomplete when false; absent to include both.
                  required: false
                  schema:
                    type: boolean
                    description: |-
                        signed filters to contracts whose signing is complete when true, or
                        incomplete when false; absent to include both.
                - name: limit
                  in: query
                  description: Maximum number of records to return, capped by the server.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    description: Maximum number of records to return, capped by the server.
                - name: offset
                  in: query
                  description: Number of records to skip for pagination.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    description: Number of records to skip for pagination.
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/crm.sales.v1.ListContractsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        post:
            tags:
                - ContractService
            summary: createContract
            description: Stages a new contract from a won lead.
            operationId: ContractService_createContract
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/crm.sales.v1.CreateContractRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/crm.sales.v1.CreateContractResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /crm/sales/v1/contracts/{id}:
        get:
            tags:
                - ContractService
            summary: getContract
            description: Returns a single contract by id.
            operationId: ContractService_getContract
            parameters:
                - name: id
                  in: path
                  description: id is the contract id path parameter.
                  required: true
                  schema:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: id is the contract id path parameter.
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/crm.sales.v1.GetContractResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        put:
            tags:
                - ContractService
            summary: updateContract
            description: Amends an existing contract.
            operationId: ContractService_updateContract
            parameters:
                - name: id
                  in: path
                  description: id is the contract id path parameter.
                  required: true
                  schema:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: id is the contract id path parameter.
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                body:
                                    allOf:
                                        - $ref: '#/components/schemas/crm.sales.v1.UpdateContractBody'
                                    description: body carries the amendable fields bound from the HTTP payload.
                            required:
                                - body
                            description: |-
                                UpdateContractRequest amends an existing contract. Fields left absent keep
                                their current values, except status-bearing fields which replace outright.
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/crm.sales.v1.UpdateContractResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        crm.sales.v1.ListContractsRequest:
            type: object
            properties:
                signed:
                    type: boolean
                    description: |-
                        signed filters to contracts whose signing is complete when true, or
                        incomplete when false; absent to include both.
                limit:
                    type: integer
                    format: int32
                    description: Maximum number of records to return, capped by the server.
                offset:
                    type: integer
                    format: int32
                    description: Number of records to skip for pagination.
            required:
                - limit
                - offset
            description: |-
                ListContractsRequest selects contracts for this business. Filters combine
                with AND. The response is always a page: follow offset until total is
                reached.
        crm.sales.v1.ListContractsResponse:
            type: object
            properties:
                contracts:
                    type: array
                    items:
                        $ref: '#/components/schemas/crm.sales.v1.Contract'
                    description: contracts is the page of contracts matching the filters.
                total:
                    type: integer
                    format: int64
                    description: total is the number of contracts across all pages.
                limit:
                    type: integer
                    format: int32
                    description: limit echoes the applied page size.
                offset:
                    type: integer
                    format: int32
                    description: offset echoes the applied skip.
            required:
                - contracts
                - total
                - limit
                - offset
            description: |-
                ListContractsResponse returns one page of contracts with paging echoes,
                matching the rest of this module's list surfaces.
        crm.sales.v1.Contract:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: id is the unique identifier for the resource.
                lead_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: |-
                        lead_id is the CRM lead this contract closes; absent for contracts
                        recorded without a lead.
                plan:
                    type: string
                    description: plan is what was bought, as CRM displays it (e.g. "pro", "enterprise").
                mrr:
                    type: string
                    description: |-
                        mrr is monthly recurring revenue as a decimal string, because money
                        crosses the wire as text to avoid float drift. Currency is the
                        business's reporting currency.
                seats:
                    type: integer
                    format: int32
                    description: seats is how many users the contract covers.
                signed_at:
                    type: string
                    description: |-
                        signed_at is when the customer signed (ISO-8601); absent on unsigned
                        drafts. Presence of this field is what makes a contract billable.
                signed_by_name:
                    type: string
                    description: signed_by_name is the customer-side signer as written at signature time.
                notes:
                    type: string
                    description: notes are free-text sales notes; not for invoice prefill.
                created_at:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: created_at is when the record was created.
                updated_at:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: updated_at is when the record was last updated.
            required:
                - id
                - plan
                - mrr
                - seats
                - signed_by_name
                - notes
                - created_at
                - updated_at
            description: |-
                Contract is a signed sales agreement: the plan a customer bought, what it
                costs monthly, and who signed. This domain contracts the read surface that
                other apps need; create/update stay on CRM's legacy surface until that
                migration happens.

                A contract is "signed" when signed_at is present. Unsigned drafts exist so
                sales can stage terms before signature, and callers must treat the two
                states differently.
        crm.sales.v1.GetContractRequest:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: id is the contract id path parameter.
            required:
                - id
            description: GetContractRequest selects one contract by id.
        crm.sales.v1.GetContractResponse:
            type: object
            properties:
                contract:
                    allOf:
                        - $ref: '#/components/schemas/crm.sales.v1.Contract'
                    description: contract is the full record.
            required:
                - contract
            description: |-
                GetContractResponse returns the requested contract, or a 404 error when it
                does not exist in the caller's business.
        crm.sales.v1.CreateContractRequest:
            type: object
            properties:
                lead_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: lead_id links the contract to its winning lead.
                plan:
                    type: string
                    description: plan is what was bought, as CRM displays it.
                mrr:
                    type: string
                    description: mrr is monthly recurring revenue as a decimal string.
                seats:
                    type: integer
                    minimum: 0
                    format: int32
                    description: seats is how many users the contract covers.
                signed_at:
                    type: string
                    description: |-
                        signed_at completes the signature at creation time; absent means an
                        unsigned draft.
                signed_by_name:
                    type: string
                    description: signed_by_name names the customer-side signer.
                notes:
                    type: string
                    description: notes are free-text sales notes.
            required:
                - lead_id
                - plan
                - mrr
                - seats
                - signed_by_name
                - notes
            description: |-
                CreateContractRequest stages a new contract from a won lead. Signing can
                happen now or later via update.
        crm.sales.v1.CreateContractResponse:
            type: object
            properties:
                contract:
                    allOf:
                        - $ref: '#/components/schemas/crm.sales.v1.Contract'
                    description: contract is the record as stored.
            required:
                - contract
            description: CreateContractResponse returns the newly staged contract.
        crm.sales.v1.UpdateContractRequest:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: id is the contract id path parameter.
                body:
                    allOf:
                        - $ref: '#/components/schemas/crm.sales.v1.UpdateContractBody'
                    description: body carries the amendable fields bound from the HTTP payload.
            required:
                - id
                - body
            description: |-
                UpdateContractRequest amends an existing contract. Fields left absent keep
                their current values, except status-bearing fields which replace outright.
        crm.sales.v1.UpdateContractBody:
            type: object
            properties:
                plan:
                    type: string
                    description: plan replaces what the contract says was bought.
                mrr:
                    type: string
                    description: mrr replaces monthly recurring revenue (decimal string).
                seats:
                    type: integer
                    format: int32
                    description: seats replaces the covered user count.
                signed_at:
                    type: string
                    description: |-
                        signed_at records the signature; setting it on an unsigned draft makes
                        the contract billable. Already-signed contracts keep their original
                        timestamp unless explicitly replaced here.
                signed_by_name:
                    type: string
                    description: signed_by_name replaces the customer-side signer.
                notes:
                    type: string
                    description: notes replace the free-text sales notes.
            required:
                - plan
                - mrr
                - seats
                - signed_by_name
                - notes
            description: UpdateContractBody is the amendable surface of a contract.
        crm.sales.v1.UpdateContractResponse:
            type: object
            properties:
                contract:
                    allOf:
                        - $ref: '#/components/schemas/crm.sales.v1.Contract'
                    description: contract is the record after amendment.
            required:
                - contract
            description: UpdateContractResponse returns the amended contract.
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: ContractService
      description: |-
        ContractService defines CRM sales contract endpoints: the read surface
        other apps need (Finance prefills invoices from signed contracts), plus
        create/update so the legacy routes have a contract to migrate onto.
