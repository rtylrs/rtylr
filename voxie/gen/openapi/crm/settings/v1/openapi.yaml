openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /crm/settings/v1/settings:
        get:
            tags:
                - SettingsService
            summary: getSettings
            operationId: SettingsService_getSettings
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/crm.settings.v1.GetSettingsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        put:
            tags:
                - SettingsService
            summary: updateSettings
            operationId: SettingsService_updateSettings
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/crm.settings.v1.UpdateSettingsRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/crm.settings.v1.UpdateSettingsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        crm.settings.v1.GetSettingsRequest:
            type: object
        crm.settings.v1.GetSettingsResponse:
            type: object
            properties:
                settings:
                    allOf:
                        - $ref: '#/components/schemas/crm.settings.v1.Settings'
            required:
                - settings
        crm.settings.v1.Settings:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                owner_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                default_consent:
                    type: boolean
                from_email:
                    type: string
                from_name:
                    type: string
                sms_sender_id:
                    type: string
                timezone:
                    type: string
                created_at:
                    type: string
                updated_at:
                    type: string
            required:
                - id
                - owner_id
                - default_consent
                - from_email
                - from_name
                - sms_sender_id
                - timezone
                - created_at
                - updated_at
            description: Settings holds CRM-wide messaging defaults for a business.
        crm.settings.v1.UpdateSettingsRequest:
            type: object
            properties:
                default_consent:
                    type: boolean
                from_email:
                    type: string
                from_name:
                    type: string
                sms_sender_id:
                    type: string
                timezone:
                    type: string
            required:
                - default_consent
                - from_email
                - from_name
                - sms_sender_id
                - timezone
        crm.settings.v1.UpdateSettingsResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: SettingsService
