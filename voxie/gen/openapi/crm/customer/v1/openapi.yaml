openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /crm/customer/v1/customers:
        get:
            tags:
                - CustomerService
            summary: listCustomers
            description: Returns customers for the active business with optional filters.
            operationId: CustomerService_listCustomers
            parameters:
                - name: search
                  in: query
                  required: true
                  schema:
                    type: string
                    description: Filters customers by name, email, or phone.
                - name: tier
                  in: query
                  required: true
                  schema:
                    type: string
                    description: Filters by loyalty tier.
                - name: tag
                  in: query
                  required: true
                  schema:
                    type: string
                    description: Filters by customer tag.
                - name: page
                  in: query
                  required: true
                  schema:
                    type: string
                    format: int64
                - name: page_size
                  in: query
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/crm.customer.v1.ListCustomersResponse'
        post:
            tags:
                - CustomerService
            summary: createCustomer
            description: Creates a new customer record.
            operationId: CustomerService_createCustomer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/crm.customer.v1.CreateCustomerRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/crm.customer.v1.CreateCustomerResponse'
    /crm/customer/v1/customers/{id}:
        get:
            tags:
                - CustomerService
            summary: getCustomer
            description: Returns a single customer by ID.
            operationId: CustomerService_getCustomer
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/crm.customer.v1.GetCustomerResponse'
        put:
            tags:
                - CustomerService
            summary: updateCustomer
            description: Updates an existing customer.
            operationId: CustomerService_updateCustomer
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/crm.customer.v1.UpdateCustomerBody'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/crm.customer.v1.UpdateCustomerResponse'
        delete:
            tags:
                - CustomerService
            summary: deleteCustomer
            description: Removes a customer by ID.
            operationId: CustomerService_deleteCustomer
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/crm.customer.v1.DeleteCustomerResponse'
components:
    schemas:
        crm.customer.v1.ListCustomersRequest:
            type: object
            properties:
                search:
                    type: string
                    description: Filters customers by name, email, or phone.
                tier:
                    type: string
                    description: Filters by loyalty tier.
                tag:
                    type: string
                    description: Filters by customer tag.
                page:
                    type: string
                    format: int64
                page_size:
                    type: string
                    format: int64
        crm.customer.v1.ListCustomersResponse:
            type: object
            properties:
                customers:
                    type: array
                    items:
                        $ref: '#/components/schemas/crm.customer.v1.Customer'
                total:
                    type: string
                    format: int64
                page:
                    type: string
                    format: int64
                page_size:
                    type: string
                    format: int64
        crm.customer.v1.Customer:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                owner_id:
                    type: string
                    format: int64
                first_name:
                    type: string
                last_name:
                    type: string
                email:
                    type: string
                phone:
                    type: string
                date_of_birth:
                    type: string
                gender:
                    type: string
                address:
                    type: string
                city:
                    type: string
                country:
                    type: string
                loyalty_points:
                    type: string
                    format: int64
                total_spent:
                    type: number
                    format: double
                visit_count:
                    type: string
                    format: int64
                last_visit_at:
                    type: string
                loyalty_tier:
                    type: string
                tags:
                    type: array
                    items:
                        type: string
                notes:
                    type: string
                consent:
                    type: object
                    additionalProperties:
                        type: boolean
                    description: Explicit communication consent captured at customer creation/update.
                is_active:
                    type: boolean
                created_at:
                    type: string
                updated_at:
                    type: string
            description: Customer is a CRM customer profile with loyalty and engagement data.
        crm.customer.v1.CreateCustomerRequest:
            type: object
            properties:
                first_name:
                    type: string
                last_name:
                    type: string
                email:
                    type: string
                    description: Not yet enforced server-side; clients may send "".
                phone:
                    type: string
                date_of_birth:
                    type: string
                gender:
                    type: string
                address:
                    type: string
                city:
                    type: string
                country:
                    type: string
                tags:
                    type: array
                    items:
                        type: string
                notes:
                    type: string
                consent:
                    type: object
                    additionalProperties:
                        type: boolean
            required:
                - first_name
        crm.customer.v1.CreateCustomerResponse:
            type: object
            properties:
                customer_id:
                    type: string
                    format: int64
                message:
                    type: string
        crm.customer.v1.GetCustomerRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
        crm.customer.v1.GetCustomerResponse:
            type: object
            properties:
                customer:
                    allOf:
                        - $ref: '#/components/schemas/crm.customer.v1.Customer'
        crm.customer.v1.UpdateCustomerRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                body:
                    allOf:
                        - $ref: '#/components/schemas/crm.customer.v1.UpdateCustomerBody'
        crm.customer.v1.UpdateCustomerBody:
            type: object
            properties:
                first_name:
                    type: string
                last_name:
                    type: string
                email:
                    type: string
                    description: Not yet enforced server-side; clients may send "".
                phone:
                    type: string
                date_of_birth:
                    type: string
                gender:
                    type: string
                address:
                    type: string
                city:
                    type: string
                country:
                    type: string
                tags:
                    type: array
                    items:
                        type: string
                notes:
                    type: string
                consent:
                    type: object
                    additionalProperties:
                        type: boolean
                is_active:
                    type: boolean
            required:
                - first_name
        crm.customer.v1.UpdateCustomerResponse:
            type: object
            properties:
                message:
                    type: string
        crm.customer.v1.DeleteCustomerRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
        crm.customer.v1.DeleteCustomerResponse:
            type: object
            properties:
                message:
                    type: string
