openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /crm/customer/v1/customers:
        get:
            tags:
                - CustomerService
            summary: listCustomers
            description: Returns customers for the active business with optional filters.
            operationId: CustomerService_listCustomers
            parameters:
                - name: search
                  in: query
                  description: Filters customers by name, email, or phone.
                  required: false
                  schema:
                    type: string
                    description: Filters customers by name, email, or phone.
                - name: tier
                  in: query
                  description: Filters by loyalty tier.
                  required: false
                  schema:
                    type: string
                    description: Filters by loyalty tier.
                - name: tag
                  in: query
                  description: Filters by customer tag.
                  required: false
                  schema:
                    type: string
                    description: Filters by customer tag.
                - name: page
                  in: query
                  required: false
                  schema:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                - name: page_size
                  in: query
                  required: false
                  schema:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/crm.customer.v1.ListCustomersResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        post:
            tags:
                - CustomerService
            summary: createCustomer
            description: Creates a new customer record.
            operationId: CustomerService_createCustomer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/crm.customer.v1.CreateCustomerRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/crm.customer.v1.CreateCustomerResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /crm/customer/v1/customers/{id}:
        get:
            tags:
                - CustomerService
            summary: getCustomer
            description: Returns a single customer by ID.
            operationId: CustomerService_getCustomer
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/crm.customer.v1.GetCustomerResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        put:
            tags:
                - CustomerService
            summary: updateCustomer
            description: Updates an existing customer.
            operationId: CustomerService_updateCustomer
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/crm.customer.v1.UpdateCustomerBody'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/crm.customer.v1.UpdateCustomerResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        delete:
            tags:
                - CustomerService
            summary: deleteCustomer
            description: Removes a customer by ID.
            operationId: CustomerService_deleteCustomer
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/crm.customer.v1.DeleteCustomerResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        crm.customer.v1.ListCustomersRequest:
            type: object
            properties:
                search:
                    type: string
                    description: Filters customers by name, email, or phone.
                tier:
                    type: string
                    description: Filters by loyalty tier.
                tag:
                    type: string
                    description: Filters by customer tag.
                page:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                page_size:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - search
                - tier
                - tag
                - page
                - page_size
        crm.customer.v1.ListCustomersResponse:
            type: object
            properties:
                customers:
                    type: array
                    items:
                        $ref: '#/components/schemas/crm.customer.v1.Customer'
                total:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                page:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                page_size:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - customers
                - total
                - page
                - page_size
        crm.customer.v1.Customer:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                owner_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                first_name:
                    type: string
                last_name:
                    type: string
                email:
                    type: string
                phone:
                    type: string
                date_of_birth:
                    type: string
                gender:
                    type: string
                address:
                    type: string
                city:
                    type: string
                country:
                    type: string
                loyalty_points:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                total_spent:
                    type: number
                    format: double
                visit_count:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                last_visit_at:
                    type: string
                loyalty_tier:
                    type: string
                tags:
                    type: array
                    items:
                        type: string
                notes:
                    type: string
                consent:
                    type: object
                    additionalProperties:
                        type: boolean
                    description: Explicit communication consent captured at customer creation/update.
                is_active:
                    type: boolean
                created_at:
                    type: string
                updated_at:
                    type: string
            required:
                - id
                - owner_id
                - first_name
                - last_name
                - email
                - phone
                - gender
                - address
                - city
                - country
                - loyalty_points
                - total_spent
                - visit_count
                - loyalty_tier
                - tags
                - notes
                - consent
                - is_active
                - created_at
                - updated_at
            description: Customer is a CRM customer profile with loyalty and engagement data.
        crm.customer.v1.CreateCustomerRequest:
            type: object
            properties:
                first_name:
                    type: string
                last_name:
                    type: string
                email:
                    type: string
                    description: Not yet enforced server-side; clients may send "".
                phone:
                    type: string
                date_of_birth:
                    type: string
                gender:
                    type: string
                address:
                    type: string
                city:
                    type: string
                country:
                    type: string
                tags:
                    type: array
                    items:
                        type: string
                notes:
                    type: string
                consent:
                    type: object
                    additionalProperties:
                        type: boolean
            required:
                - first_name
                - last_name
                - email
                - phone
                - date_of_birth
                - gender
                - address
                - city
                - country
                - tags
                - notes
                - consent
        crm.customer.v1.CreateCustomerResponse:
            type: object
            properties:
                customer_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                message:
                    type: string
            required:
                - customer_id
                - message
        crm.customer.v1.GetCustomerRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - id
        crm.customer.v1.GetCustomerResponse:
            type: object
            properties:
                customer:
                    allOf:
                        - $ref: '#/components/schemas/crm.customer.v1.Customer'
            required:
                - customer
        crm.customer.v1.UpdateCustomerRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                body:
                    allOf:
                        - $ref: '#/components/schemas/crm.customer.v1.UpdateCustomerBody'
            required:
                - id
                - body
        crm.customer.v1.UpdateCustomerBody:
            type: object
            properties:
                first_name:
                    type: string
                last_name:
                    type: string
                email:
                    type: string
                    description: Not yet enforced server-side; clients may send "".
                phone:
                    type: string
                date_of_birth:
                    type: string
                gender:
                    type: string
                address:
                    type: string
                city:
                    type: string
                country:
                    type: string
                tags:
                    type: array
                    items:
                        type: string
                notes:
                    type: string
                consent:
                    type: object
                    additionalProperties:
                        type: boolean
                is_active:
                    type: boolean
            required:
                - first_name
                - last_name
                - email
                - phone
                - date_of_birth
                - gender
                - address
                - city
                - country
                - tags
                - notes
                - consent
        crm.customer.v1.UpdateCustomerResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        crm.customer.v1.DeleteCustomerRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - id
        crm.customer.v1.DeleteCustomerResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: CustomerService
      description: CustomerService defines CRM customer endpoints.
