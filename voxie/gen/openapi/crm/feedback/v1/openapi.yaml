openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /crm/feedback/v1/feedback:
        get:
            tags:
                - FeedbackService
            summary: listFeedback
            operationId: FeedbackService_listFeedback
            parameters:
                - name: type
                  in: query
                  required: true
                  schema:
                    type: string
                - name: source
                  in: query
                  required: true
                  schema:
                    type: string
                - name: min_score
                  in: query
                  required: false
                  schema:
                    type: integer
                    format: int32
                - name: max_score
                  in: query
                  required: false
                  schema:
                    type: integer
                    format: int32
                - name: page
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                - name: page_size
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/crm.feedback.v1.ListFeedbackResponse'
        post:
            tags:
                - FeedbackService
            summary: createFeedback
            operationId: FeedbackService_createFeedback
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/crm.feedback.v1.CreateFeedbackRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/crm.feedback.v1.CreateFeedbackResponse'
components:
    schemas:
        crm.feedback.v1.ListFeedbackRequest:
            type: object
            properties:
                type:
                    type: string
                source:
                    type: string
                min_score:
                    type: integer
                    format: int32
                max_score:
                    type: integer
                    format: int32
                page:
                    type: integer
                    format: int32
                page_size:
                    type: integer
                    format: int32
            required:
                - type
                - source
                - page
                - page_size
        crm.feedback.v1.ListFeedbackResponse:
            type: object
            properties:
                feedback:
                    type: array
                    items:
                        $ref: '#/components/schemas/crm.feedback.v1.Feedback'
                total:
                    type: integer
                    format: int32
                page:
                    type: integer
                    format: int32
                page_size:
                    type: integer
                    format: int32
            required:
                - feedback
                - total
                - page
                - page_size
        crm.feedback.v1.Feedback:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                owner_id:
                    type: string
                    format: int64
                customer_id:
                    type: string
                    format: int64
                type:
                    type: string
                    description: '"nps" or "review" — score''s scale and meaning depend on this.'
                score:
                    type: integer
                    format: int32
                    description: NPS score (0-10) when type is "nps"; star rating (1-5) when type is "review".
                comment:
                    type: string
                source:
                    type: string
                created_at:
                    type: string
                customer_name:
                    type: string
                    description: Display name of the customer this feedback belongs to.
            required:
                - id
                - owner_id
                - customer_id
                - type
                - score
                - comment
                - source
                - created_at
                - customer_name
            description: Feedback is a single NPS score or written review from a customer.
        crm.feedback.v1.CreateFeedbackRequest:
            type: object
            properties:
                customer_id:
                    type: string
                    format: int64
                type:
                    type: string
                score:
                    type: integer
                    format: int32
                comment:
                    type: string
                source:
                    type: string
            required:
                - customer_id
                - type
                - score
                - comment
                - source
        crm.feedback.v1.CreateFeedbackResponse:
            type: object
            properties:
                feedback_id:
                    type: string
                    format: int64
                message:
                    type: string
            required:
                - feedback_id
                - message
