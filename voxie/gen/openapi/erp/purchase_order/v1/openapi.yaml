openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /erp/purchase-order/v1/purchase-orders:
        get:
            tags:
                - PurchaseOrderService
            summary: listPurchaseOrders
            operationId: PurchaseOrderService_listPurchaseOrders
            parameters:
                - name: status
                  in: query
                  required: true
                  schema:
                    type: string
                    description: Filters purchase orders by lifecycle state.
                - name: page
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                    description: The 1-based page number.
                - name: page_size
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                    description: The number of rows to return.
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.purchase_order.v1.ListPurchaseOrdersResponse'
        post:
            tags:
                - PurchaseOrderService
            summary: createPurchaseOrder
            operationId: PurchaseOrderService_createPurchaseOrder
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/erp.purchase_order.v1.CreatePurchaseOrderRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.purchase_order.v1.CreatePurchaseOrderResponse'
    /erp/purchase-order/v1/purchase-orders/{id}:
        get:
            tags:
                - PurchaseOrderService
            summary: getPurchaseOrder
            operationId: PurchaseOrderService_getPurchaseOrder
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.purchase_order.v1.GetPurchaseOrderResponse'
    /erp/purchase-order/v1/purchase-orders/{id}/status:
        patch:
            tags:
                - PurchaseOrderService
            summary: updatePurchaseOrderStatus
            operationId: PurchaseOrderService_updatePurchaseOrderStatus
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/erp.purchase_order.v1.UpdatePurchaseOrderStatusBody'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.purchase_order.v1.UpdatePurchaseOrderStatusResponse'
    /erp/purchase-order/v1/purchase-orders/{id}/approve:
        post:
            tags:
                - PurchaseOrderService
            summary: approvePurchaseOrder
            operationId: PurchaseOrderService_approvePurchaseOrder
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/erp.purchase_order.v1.ApprovePurchaseOrderRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.purchase_order.v1.ApprovePurchaseOrderResponse'
components:
    schemas:
        erp.purchase_order.v1.ListPurchaseOrdersRequest:
            type: object
            properties:
                status:
                    type: string
                    description: Filters purchase orders by lifecycle state.
                page:
                    type: integer
                    format: int32
                    description: The 1-based page number.
                page_size:
                    type: integer
                    format: int32
                    description: The number of rows to return.
            required:
                - status
                - page
                - page_size
        erp.purchase_order.v1.ListPurchaseOrdersResponse:
            type: object
            properties:
                purchase_orders:
                    type: array
                    items:
                        $ref: '#/components/schemas/erp.purchase_order.v1.PurchaseOrder'
                has_more:
                    type: boolean
                    description: True when another page is available.
                page:
                    type: integer
                    format: int32
                    description: The returned 1-based page number.
                page_size:
                    type: integer
                    format: int32
                    description: The returned page size.
            required:
                - purchase_orders
                - has_more
                - page
                - page_size
        erp.purchase_order.v1.PurchaseOrder:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                owner_id:
                    type: string
                    format: int64
                supplier_id:
                    type: string
                    format: int64
                po_number:
                    type: string
                status:
                    type: string
                    description: Current lifecycle state.
                subtotal:
                    type: number
                    format: double
                tax_amount:
                    type: number
                    format: double
                total:
                    type: number
                    format: double
                expected_delivery:
                    type: string
                received_at:
                    type: string
                notes:
                    type: string
                created_by:
                    type: string
                    format: int64
                created_at:
                    type: string
                    description: When the record was created.
                updated_at:
                    type: string
                    description: When the record was last updated.
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/erp.purchase_order.v1.PurchaseOrderItem'
            required:
                - id
                - owner_id
                - supplier_id
                - po_number
                - status
                - subtotal
                - tax_amount
                - total
                - notes
                - created_by
                - created_at
                - updated_at
                - items
        erp.purchase_order.v1.PurchaseOrderItem:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                purchase_order_id:
                    type: string
                    format: int64
                product_id:
                    type: string
                    format: int64
                quantity_ordered:
                    type: number
                    format: double
                quantity_received:
                    type: number
                    format: double
                unit_cost:
                    type: number
                    format: double
                total_cost:
                    type: number
                    format: double
            required:
                - id
                - purchase_order_id
                - product_id
                - quantity_ordered
                - quantity_received
                - unit_cost
                - total_cost
        erp.purchase_order.v1.CreatePurchaseOrderRequest:
            type: object
            properties:
                supplier_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                po_number:
                    type: string
                tax_amount:
                    type: number
                    minimum: 0
                    format: double
                expected_delivery:
                    type: string
                notes:
                    type: string
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/erp.purchase_order.v1.CreatePurchaseOrderItemRequest'
                    minItems: 1
            required:
                - supplier_id
                - po_number
                - tax_amount
                - expected_delivery
                - notes
                - items
        erp.purchase_order.v1.CreatePurchaseOrderItemRequest:
            type: object
            properties:
                product_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                quantity_ordered:
                    type: number
                    minimum: 0
                    format: double
                unit_cost:
                    type: number
                    minimum: 0
                    format: double
            required:
                - product_id
                - quantity_ordered
                - unit_cost
        erp.purchase_order.v1.CreatePurchaseOrderResponse:
            type: object
            properties:
                purchase_order_id:
                    type: string
                    format: int64
                message:
                    type: string
                    description: A human-readable result message.
            required:
                - purchase_order_id
                - message
        erp.purchase_order.v1.GetPurchaseOrderRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
            required:
                - id
        erp.purchase_order.v1.GetPurchaseOrderResponse:
            type: object
            properties:
                purchase_order:
                    allOf:
                        - $ref: '#/components/schemas/erp.purchase_order.v1.PurchaseOrder'
            required:
                - purchase_order
        erp.purchase_order.v1.UpdatePurchaseOrderStatusRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                body:
                    allOf:
                        - $ref: '#/components/schemas/erp.purchase_order.v1.UpdatePurchaseOrderStatusBody'
            required:
                - id
                - body
        erp.purchase_order.v1.UpdatePurchaseOrderStatusBody:
            type: object
            properties:
                status:
                    type: string
                    description: Current lifecycle state.
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/erp.purchase_order.v1.PurchaseOrderItem'
                    description: Per-line quantities submitted by the receiving operator.
            required:
                - status
                - items
        erp.purchase_order.v1.UpdatePurchaseOrderStatusResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        erp.purchase_order.v1.ApprovePurchaseOrderRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
            required:
                - id
        erp.purchase_order.v1.ApprovePurchaseOrderResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
