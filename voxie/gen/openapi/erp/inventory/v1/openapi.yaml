openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /erp/inventory/v1/report:
        get:
            tags:
                - InventoryService
            summary: getInventoryReport
            operationId: InventoryService_getInventoryReport
            parameters:
                - name: limit
                  in: query
                  description: Maximum number of inventory rows to return.
                  required: false
                  schema:
                    type: integer
                    format: int64
                    description: Maximum number of inventory rows to return.
                - name: offset
                  in: query
                  description: Number of inventory rows to skip.
                  required: false
                  schema:
                    type: integer
                    format: int64
                    description: Number of inventory rows to skip.
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.inventory.v1.GetInventoryReportResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /erp/inventory/v1/low-stock:
        get:
            tags:
                - InventoryService
            summary: getLowStock
            operationId: InventoryService_getLowStock
            parameters:
                - name: limit
                  in: query
                  description: Maximum number of low-stock rows to return.
                  required: false
                  schema:
                    type: integer
                    format: int64
                    description: Maximum number of low-stock rows to return.
                - name: offset
                  in: query
                  description: Number of low-stock rows to skip.
                  required: false
                  schema:
                    type: integer
                    format: int64
                    description: Number of low-stock rows to skip.
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.inventory.v1.GetLowStockResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /erp/inventory/v1/valuation:
        get:
            tags:
                - InventoryService
            summary: getValuation
            operationId: InventoryService_getValuation
            parameters:
                - name: limit
                  in: query
                  description: Maximum number of valuation rows to return.
                  required: false
                  schema:
                    type: integer
                    format: int64
                    description: Maximum number of valuation rows to return.
                - name: offset
                  in: query
                  description: Number of valuation rows to skip.
                  required: false
                  schema:
                    type: integer
                    format: int64
                    description: Number of valuation rows to skip.
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.inventory.v1.GetValuationResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /erp/inventory/v1/adjust:
        post:
            tags:
                - InventoryService
            summary: adjustInventory
            operationId: InventoryService_adjustInventory
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/erp.inventory.v1.AdjustInventoryRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.inventory.v1.AdjustInventoryResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        erp.inventory.v1.GetInventoryReportRequest:
            type: object
            properties:
                limit:
                    type: integer
                    format: int64
                    description: Maximum number of inventory rows to return.
                offset:
                    type: integer
                    format: int64
                    description: Number of inventory rows to skip.
            required:
                - limit
                - offset
        erp.inventory.v1.GetInventoryReportResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/erp.inventory.v1.InventoryReportItem'
                total_value:
                    type: number
                    format: double
                has_more:
                    type: boolean
                limit:
                    type: integer
                    format: int64
                offset:
                    type: integer
                    format: int64
                total:
                    type: integer
                    format: int64
            required:
                - items
                - total_value
                - has_more
                - limit
                - offset
                - total
        erp.inventory.v1.InventoryReportItem:
            type: object
            properties:
                product_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                product_name:
                    type: string
                sku:
                    type: string
                unit:
                    type: string
                stock_quantity:
                    type: number
                    format: double
                low_stock_threshold:
                    type: number
                    format: double
                reorder_quantity:
                    type: number
                    format: double
                cost_price:
                    type: number
                    format: double
                sale_price:
                    type: number
                    format: double
                stock_value:
                    type: number
                    format: double
                is_low_stock:
                    type: boolean
            required:
                - product_id
                - product_name
                - sku
                - unit
                - stock_quantity
                - low_stock_threshold
                - reorder_quantity
                - cost_price
                - sale_price
                - stock_value
                - is_low_stock
        erp.inventory.v1.GetLowStockRequest:
            type: object
            properties:
                limit:
                    type: integer
                    format: int64
                    description: Maximum number of low-stock rows to return.
                offset:
                    type: integer
                    format: int64
                    description: Number of low-stock rows to skip.
            required:
                - limit
                - offset
        erp.inventory.v1.GetLowStockResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/erp.inventory.v1.InventoryReportItem'
                count:
                    type: integer
                    format: int64
                has_more:
                    type: boolean
                limit:
                    type: integer
                    format: int64
                offset:
                    type: integer
                    format: int64
                total:
                    type: integer
                    format: int64
            required:
                - items
                - count
                - has_more
                - limit
                - offset
                - total
        erp.inventory.v1.GetValuationRequest:
            type: object
            properties:
                limit:
                    type: integer
                    format: int64
                    description: Maximum number of valuation rows to return.
                offset:
                    type: integer
                    format: int64
                    description: Number of valuation rows to skip.
            required:
                - limit
                - offset
        erp.inventory.v1.GetValuationResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/erp.inventory.v1.ValuationItem'
                total_value:
                    type: number
                    format: double
                has_more:
                    type: boolean
                limit:
                    type: integer
                    format: int64
                offset:
                    type: integer
                    format: int64
                total:
                    type: integer
                    format: int64
            required:
                - items
                - total_value
                - has_more
                - limit
                - offset
                - total
        erp.inventory.v1.ValuationItem:
            type: object
            properties:
                category_name:
                    type: string
                warehouse_name:
                    type: string
                total_items:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                total_value:
                    type: number
                    format: double
                total_cost:
                    type: number
                    format: double
            required:
                - category_name
                - warehouse_name
                - total_items
                - total_value
                - total_cost
        erp.inventory.v1.AdjustInventoryRequest:
            type: object
            properties:
                product_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                change:
                    exclusiveMinimum: 0
                    type: number
                    format: double
                type:
                    type: string
                notes:
                    type: string
            required:
                - product_id
                - change
                - type
                - notes
        erp.inventory.v1.AdjustInventoryResponse:
            type: object
            properties:
                message:
                    type: string
                    description: A human-readable result message.
            required:
                - message
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: InventoryService
      description: InventoryService defines ERP inventory endpoints.
