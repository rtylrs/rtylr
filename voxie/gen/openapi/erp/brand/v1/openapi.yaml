openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /erp/brand/v1/brands:
        get:
            tags:
                - BrandService
            summary: listBrands
            operationId: BrandService_listBrands
            parameters:
                - name: limit
                  in: query
                  description: Maximum number of brands to return.
                  required: false
                  schema:
                    type: integer
                    format: int64
                    description: Maximum number of brands to return.
                - name: offset
                  in: query
                  description: Number of brands to skip.
                  required: false
                  schema:
                    type: integer
                    format: int64
                    description: Number of brands to skip.
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.brand.v1.ListBrandsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        post:
            tags:
                - BrandService
            summary: createBrand
            operationId: BrandService_createBrand
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/erp.brand.v1.CreateBrandRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.brand.v1.CreateBrandResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /erp/brand/v1/brands/{id}:
        put:
            tags:
                - BrandService
            summary: updateBrand
            operationId: BrandService_updateBrand
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/erp.brand.v1.UpdateBrandBody'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.brand.v1.UpdateBrandResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        delete:
            tags:
                - BrandService
            summary: deleteBrand
            operationId: BrandService_deleteBrand
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.brand.v1.DeleteBrandResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        erp.brand.v1.ListBrandsRequest:
            type: object
            properties:
                limit:
                    type: integer
                    format: int64
                    description: Maximum number of brands to return.
                offset:
                    type: integer
                    format: int64
                    description: Number of brands to skip.
            required:
                - limit
                - offset
        erp.brand.v1.ListBrandsResponse:
            type: object
            properties:
                brands:
                    type: array
                    items:
                        $ref: '#/components/schemas/erp.brand.v1.Brand'
                has_more:
                    type: boolean
                limit:
                    type: integer
                    format: int64
                offset:
                    type: integer
                    format: int64
                total:
                    type: integer
                    format: int64
            required:
                - brands
                - has_more
                - limit
                - offset
                - total
        erp.brand.v1.Brand:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                owner_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                logo_url:
                    type: string
                description:
                    type: string
                product_count:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                created_at:
                    type: string
                updated_at:
                    type: string
            required:
                - id
                - owner_id
                - name
                - logo_url
                - description
                - product_count
                - created_at
                - updated_at
        erp.brand.v1.CreateBrandRequest:
            type: object
            properties:
                name:
                    type: string
                logo_url:
                    type: string
                description:
                    type: string
            required:
                - name
                - logo_url
                - description
        erp.brand.v1.CreateBrandResponse:
            type: object
            properties:
                brand_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                message:
                    type: string
            required:
                - brand_id
                - message
        erp.brand.v1.UpdateBrandRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                body:
                    allOf:
                        - $ref: '#/components/schemas/erp.brand.v1.UpdateBrandBody'
            required:
                - id
                - body
        erp.brand.v1.UpdateBrandBody:
            type: object
            properties:
                name:
                    type: string
                logo_url:
                    type: string
                description:
                    type: string
            required:
                - name
                - logo_url
                - description
        erp.brand.v1.UpdateBrandResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        erp.brand.v1.DeleteBrandRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - id
        erp.brand.v1.DeleteBrandResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: BrandService
