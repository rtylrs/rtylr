openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /erp/stock-transfer/v1/stock-transfers:
        get:
            tags:
                - StockTransferService
            summary: listStockTransfers
            operationId: StockTransferService_listStockTransfers
            parameters:
                - name: page
                  in: query
                  required: false
                  schema:
                    type: integer
                    format: int64
                - name: page_size
                  in: query
                  required: false
                  schema:
                    type: integer
                    format: int64
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.stock_transfer.v1.ListStockTransfersResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        post:
            tags:
                - StockTransferService
            summary: createStockTransfer
            operationId: StockTransferService_createStockTransfer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/erp.stock_transfer.v1.CreateStockTransferRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.stock_transfer.v1.CreateStockTransferResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /erp/stock-transfer/v1/stock-transfers/{id}/status:
        patch:
            tags:
                - StockTransferService
            summary: updateStockTransferStatus
            operationId: StockTransferService_updateStockTransferStatus
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                body:
                                    allOf:
                                        - $ref: '#/components/schemas/erp.stock_transfer.v1.UpdateStockTransferStatusBody'
                            required:
                                - body
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.stock_transfer.v1.UpdateStockTransferStatusResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        erp.stock_transfer.v1.ListStockTransfersRequest:
            type: object
            properties:
                page:
                    type: integer
                    format: int64
                page_size:
                    type: integer
                    format: int64
            required:
                - page
                - page_size
        erp.stock_transfer.v1.ListStockTransfersResponse:
            type: object
            properties:
                stock_transfers:
                    type: array
                    items:
                        $ref: '#/components/schemas/erp.stock_transfer.v1.StockTransfer'
                has_more:
                    type: boolean
                page:
                    type: integer
                    format: int64
                page_size:
                    type: integer
                    format: int64
            required:
                - stock_transfers
                - has_more
                - page
                - page_size
        erp.stock_transfer.v1.StockTransfer:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                owner_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                from_warehouse_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                to_warehouse_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                status:
                    type: string
                notes:
                    type: string
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/erp.stock_transfer.v1.StockTransferItem'
                created_at:
                    type: string
                updated_at:
                    type: string
            required:
                - id
                - owner_id
                - from_warehouse_id
                - to_warehouse_id
                - status
                - notes
                - items
                - created_at
                - updated_at
        erp.stock_transfer.v1.StockTransferItem:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                transfer_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                product_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                quantity:
                    type: number
                    format: double
                created_at:
                    type: string
            required:
                - id
                - transfer_id
                - product_id
                - quantity
                - created_at
        erp.stock_transfer.v1.CreateStockTransferRequest:
            type: object
            properties:
                from_warehouse_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                to_warehouse_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                notes:
                    type: string
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/erp.stock_transfer.v1.CreateStockTransferItemRequest'
                    minItems: 1
            required:
                - from_warehouse_id
                - to_warehouse_id
                - notes
                - items
        erp.stock_transfer.v1.CreateStockTransferItemRequest:
            type: object
            properties:
                product_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                quantity:
                    exclusiveMinimum: 0
                    type: number
                    format: double
            required:
                - product_id
                - quantity
        erp.stock_transfer.v1.CreateStockTransferResponse:
            type: object
            properties:
                transfer_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                message:
                    type: string
            required:
                - transfer_id
                - message
        erp.stock_transfer.v1.UpdateStockTransferStatusRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                body:
                    allOf:
                        - $ref: '#/components/schemas/erp.stock_transfer.v1.UpdateStockTransferStatusBody'
            required:
                - id
                - body
        erp.stock_transfer.v1.UpdateStockTransferStatusBody:
            type: object
            properties:
                status:
                    type: string
            required:
                - status
        erp.stock_transfer.v1.UpdateStockTransferStatusResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: StockTransferService
      description: StockTransferService defines ERP stock transfer endpoints.
