openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /erp/price-list/v1/price-lists:
        get:
            tags:
                - PriceListService
            summary: listPriceLists
            operationId: PriceListService_listPriceLists
            parameters:
                - name: limit
                  in: query
                  description: Maximum number of price lists to return.
                  required: false
                  schema:
                    type: integer
                    format: int64
                    description: Maximum number of price lists to return.
                - name: offset
                  in: query
                  description: Number of price lists to skip.
                  required: false
                  schema:
                    type: integer
                    format: int64
                    description: Number of price lists to skip.
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.price_list.v1.ListPriceListsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        post:
            tags:
                - PriceListService
            summary: createPriceList
            operationId: PriceListService_createPriceList
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/erp.price_list.v1.CreatePriceListRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.price_list.v1.CreatePriceListResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        erp.price_list.v1.ListPriceListsRequest:
            type: object
            properties:
                limit:
                    type: integer
                    format: int64
                    description: Maximum number of price lists to return.
                offset:
                    type: integer
                    format: int64
                    description: Number of price lists to skip.
            required:
                - limit
                - offset
        erp.price_list.v1.ListPriceListsResponse:
            type: object
            properties:
                price_lists:
                    type: array
                    items:
                        $ref: '#/components/schemas/erp.price_list.v1.PriceList'
                has_more:
                    type: boolean
                limit:
                    type: integer
                    format: int64
                offset:
                    type: integer
                    format: int64
                total:
                    type: integer
                    format: int64
            required:
                - price_lists
                - has_more
                - limit
                - offset
                - total
        erp.price_list.v1.PriceList:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                owner_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                currency:
                    type: string
                is_default:
                    type: boolean
                created_at:
                    type: string
                updated_at:
                    type: string
            required:
                - id
                - owner_id
                - name
                - currency
                - is_default
                - created_at
                - updated_at
        erp.price_list.v1.CreatePriceListRequest:
            type: object
            properties:
                name:
                    type: string
                currency:
                    type: string
                is_default:
                    type: boolean
            required:
                - name
                - currency
                - is_default
        erp.price_list.v1.CreatePriceListResponse:
            type: object
            properties:
                price_list_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                message:
                    type: string
            required:
                - price_list_id
                - message
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: PriceListService
