openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /erp/product/v1/products:
        get:
            tags:
                - ProductService
            summary: listProducts
            operationId: ProductService_listProducts
            parameters:
                - name: search
                  in: query
                  description: Filters products by name or SKU.
                  required: false
                  schema:
                    type: string
                    description: Filters products by name or SKU.
                - name: category_id
                  in: query
                  description: Filters products by category.
                  required: false
                  schema:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: Filters products by category.
                - name: limit
                  in: query
                  description: The maximum number of products to return.
                  required: false
                  schema:
                    type: integer
                    format: int64
                    description: The maximum number of products to return.
                - name: offset
                  in: query
                  description: The number of records to skip.
                  required: false
                  schema:
                    type: integer
                    format: int64
                    description: The number of records to skip.
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.product.v1.ListProductsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        post:
            tags:
                - ProductService
            summary: createProduct
            operationId: ProductService_createProduct
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/erp.product.v1.CreateProductRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.product.v1.CreateProductResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /erp/product/v1/barcodes/{code}/product:
        get:
            tags:
                - ProductService
            summary: getProductByBarcode
            operationId: ProductService_getProductByBarcode
            parameters:
                - name: code
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.product.v1.GetProductByBarcodeResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /erp/product/v1/products/{id}:
        get:
            tags:
                - ProductService
            summary: getProduct
            operationId: ProductService_getProduct
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.product.v1.GetProductResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        put:
            tags:
                - ProductService
            summary: updateProduct
            operationId: ProductService_updateProduct
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/erp.product.v1.UpdateProductBody'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.product.v1.UpdateProductResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        delete:
            tags:
                - ProductService
            summary: deleteProduct
            operationId: ProductService_deleteProduct
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.product.v1.DeleteProductResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /erp/product/v1/products/{id}/full:
        get:
            tags:
                - ProductService
            summary: getProductFull
            operationId: ProductService_getProductFull
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.product.v1.GetProductFullResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /erp/product/v1/products/{id}/attributes:
        get:
            tags:
                - ProductService
            summary: listProductAttributes
            operationId: ProductService_listProductAttributes
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.product.v1.ListProductAttributesResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /erp/product/v1/dashboard:
        get:
            tags:
                - ProductService
            summary: getDashboard
            operationId: ProductService_getDashboard
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.product.v1.GetDashboardResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /erp/product/v1/reorder-suggestions:
        get:
            tags:
                - ProductService
            summary: listReorderSuggestions
            operationId: ProductService_listReorderSuggestions
            parameters:
                - name: limit
                  in: query
                  description: Maximum number of reorder suggestions to return.
                  required: false
                  schema:
                    type: integer
                    format: int64
                    description: Maximum number of reorder suggestions to return.
                - name: offset
                  in: query
                  description: Number of reorder suggestions to skip.
                  required: false
                  schema:
                    type: integer
                    format: int64
                    description: Number of reorder suggestions to skip.
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.product.v1.ListReorderSuggestionsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /erp/product/v1/expiry:
        get:
            tags:
                - ProductService
            summary: listExpiringItems
            operationId: ProductService_listExpiringItems
            parameters:
                - name: days_ahead
                  in: query
                  required: false
                  schema:
                    type: integer
                    format: int32
                - name: limit
                  in: query
                  description: Maximum number of expiring items to return.
                  required: false
                  schema:
                    type: integer
                    format: int64
                    description: Maximum number of expiring items to return.
                - name: offset
                  in: query
                  description: Number of expiring items to skip.
                  required: false
                  schema:
                    type: integer
                    format: int64
                    description: Number of expiring items to skip.
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/erp.product.v1.ListExpiringItemsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        erp.product.v1.ListProductsRequest:
            type: object
            properties:
                search:
                    type: string
                    description: Filters products by name or SKU.
                category_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: Filters products by category.
                limit:
                    type: integer
                    format: int64
                    description: The maximum number of products to return.
                offset:
                    type: integer
                    format: int64
                    description: The number of records to skip.
            required:
                - search
                - category_id
                - limit
                - offset
        erp.product.v1.ListProductsResponse:
            type: object
            properties:
                products:
                    type: array
                    items:
                        $ref: '#/components/schemas/erp.product.v1.Product'
                has_more:
                    type: boolean
                page:
                    type: integer
                    format: int64
                page_size:
                    type: integer
                    format: int64
                total:
                    type: integer
                    format: int64
            required:
                - products
                - has_more
                - page
                - page_size
                - total
        erp.product.v1.Product:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                owner_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                category_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                supplier_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                sku:
                    type: string
                barcode:
                    type: string
                description:
                    type: string
                unit:
                    type: string
                cost_price:
                    type: number
                    format: double
                sale_price:
                    type: number
                    format: double
                stock_quantity:
                    type: number
                    format: double
                low_stock_threshold:
                    type: number
                    format: double
                reorder_quantity:
                    type: number
                    format: double
                is_active:
                    type: boolean
                track_inventory:
                    type: boolean
                created_at:
                    type: string
                    description: When the record was created.
                updated_at:
                    type: string
                    description: When the record was last updated.
                business_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                brand_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                compare_at_price:
                    type: number
                    format: double
                tax_rate:
                    type: number
                    format: double
                currency:
                    type: string
                weight:
                    type: number
                    format: double
                weight_unit:
                    type: string
                length:
                    type: number
                    format: double
                width:
                    type: number
                    format: double
                height:
                    type: number
                    format: double
                dimension_unit:
                    type: string
                country_of_origin:
                    type: string
                hs_code:
                    type: string
                allow_backorder:
                    type: boolean
                lead_time_days:
                    type: integer
                    format: int32
                image_url:
                    type: string
            required:
                - id
                - owner_id
                - category_id
                - supplier_id
                - name
                - sku
                - barcode
                - description
                - unit
                - cost_price
                - sale_price
                - stock_quantity
                - low_stock_threshold
                - reorder_quantity
                - is_active
                - track_inventory
                - created_at
                - updated_at
                - business_id
                - brand_id
                - compare_at_price
                - tax_rate
                - currency
                - weight
                - weight_unit
                - length
                - width
                - height
                - dimension_unit
                - country_of_origin
                - hs_code
                - allow_backorder
                - lead_time_days
                - image_url
        erp.product.v1.CreateProductRequest:
            type: object
            properties:
                category_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                supplier_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                sku:
                    type: string
                barcode:
                    type: string
                description:
                    type: string
                unit:
                    type: string
                cost_price:
                    type: number
                    minimum: 0
                    format: double
                sale_price:
                    type: number
                    minimum: 0
                    format: double
                low_stock_threshold:
                    type: number
                    minimum: 0
                    format: double
                reorder_quantity:
                    type: number
                    minimum: 0
                    format: double
                is_active:
                    type: boolean
                track_inventory:
                    type: boolean
                stock_quantity:
                    type: number
                    minimum: 0
                    format: double
                    description: The opening tracked quantity for this product.
                brand_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: Links the product to a brand when present.
                compare_at_price:
                    type: number
                    minimum: 0
                    format: double
                tax_rate:
                    type: number
                    minimum: 0
                    format: double
                currency:
                    type: string
                weight:
                    type: number
                    minimum: 0
                    format: double
                weight_unit:
                    type: string
                length:
                    type: number
                    minimum: 0
                    format: double
                width:
                    type: number
                    minimum: 0
                    format: double
                height:
                    type: number
                    minimum: 0
                    format: double
                dimension_unit:
                    type: string
                country_of_origin:
                    type: string
                hs_code:
                    type: string
                allow_backorder:
                    type: boolean
                lead_time_days:
                    type: integer
                    minimum: 0
                    format: int32
                image_url:
                    type: string
            required:
                - category_id
                - supplier_id
                - name
                - sku
                - barcode
                - description
                - unit
                - cost_price
                - sale_price
                - low_stock_threshold
                - reorder_quantity
                - is_active
                - track_inventory
                - stock_quantity
                - brand_id
                - compare_at_price
                - tax_rate
                - currency
                - weight
                - weight_unit
                - length
                - width
                - height
                - dimension_unit
                - country_of_origin
                - hs_code
                - allow_backorder
                - lead_time_days
                - image_url
        erp.product.v1.CreateProductResponse:
            type: object
            properties:
                product_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                message:
                    type: string
                    description: A human-readable result message.
            required:
                - product_id
                - message
        erp.product.v1.GetProductByBarcodeRequest:
            type: object
            properties:
                code:
                    type: string
            required:
                - code
        erp.product.v1.GetProductByBarcodeResponse:
            type: object
            properties:
                product:
                    allOf:
                        - $ref: '#/components/schemas/erp.product.v1.Product'
            required:
                - product
        erp.product.v1.GetProductRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - id
        erp.product.v1.GetProductResponse:
            type: object
            properties:
                product:
                    allOf:
                        - $ref: '#/components/schemas/erp.product.v1.Product'
            required:
                - product
        erp.product.v1.GetProductFullRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - id
        erp.product.v1.GetProductFullResponse:
            type: object
            properties:
                product:
                    allOf:
                        - $ref: '#/components/schemas/erp.product.v1.FullProduct'
            required:
                - product
        erp.product.v1.FullProduct:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                owner_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                business_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                category_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                supplier_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                sku:
                    type: string
                barcode:
                    type: string
                description:
                    type: string
                unit:
                    type: string
                cost_price:
                    type: number
                    format: double
                sale_price:
                    type: number
                    format: double
                stock_quantity:
                    type: number
                    format: double
                low_stock_threshold:
                    type: number
                    format: double
                reorder_quantity:
                    type: number
                    format: double
                is_active:
                    type: boolean
                track_inventory:
                    type: boolean
                brand_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                compare_at_price:
                    type: number
                    format: double
                tax_rate:
                    type: number
                    format: double
                currency:
                    type: string
                weight:
                    type: number
                    format: double
                weight_unit:
                    type: string
                length:
                    type: number
                    format: double
                width:
                    type: number
                    format: double
                height:
                    type: number
                    format: double
                dimension_unit:
                    type: string
                country_of_origin:
                    type: string
                hs_code:
                    type: string
                allow_backorder:
                    type: boolean
                lead_time_days:
                    type: integer
                    format: int32
                image_url:
                    type: string
                created_at:
                    type: string
                updated_at:
                    type: string
            required:
                - id
                - owner_id
                - business_id
                - category_id
                - supplier_id
                - name
                - sku
                - barcode
                - description
                - unit
                - cost_price
                - sale_price
                - stock_quantity
                - low_stock_threshold
                - reorder_quantity
                - is_active
                - track_inventory
                - brand_id
                - compare_at_price
                - tax_rate
                - currency
                - weight
                - weight_unit
                - length
                - width
                - height
                - dimension_unit
                - country_of_origin
                - hs_code
                - allow_backorder
                - lead_time_days
                - image_url
                - created_at
                - updated_at
        erp.product.v1.ListProductAttributesRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - id
        erp.product.v1.ListProductAttributesResponse:
            type: object
            properties:
                attributes:
                    type: array
                    items:
                        $ref: '#/components/schemas/erp.product.v1.ProductAttribute'
            required:
                - attributes
        erp.product.v1.ProductAttribute:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                value:
                    type: string
                position:
                    type: integer
                    format: int32
            required:
                - id
                - name
                - value
                - position
        erp.product.v1.UpdateProductRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                body:
                    allOf:
                        - $ref: '#/components/schemas/erp.product.v1.UpdateProductBody'
            required:
                - id
                - body
        erp.product.v1.UpdateProductBody:
            type: object
            properties:
                category_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                supplier_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                sku:
                    type: string
                barcode:
                    type: string
                description:
                    type: string
                unit:
                    type: string
                cost_price:
                    type: number
                    minimum: 0
                    format: double
                sale_price:
                    type: number
                    minimum: 0
                    format: double
                low_stock_threshold:
                    type: number
                    minimum: 0
                    format: double
                reorder_quantity:
                    type: number
                    minimum: 0
                    format: double
                is_active:
                    type: boolean
                track_inventory:
                    type: boolean
                stock_quantity:
                    type: number
                    minimum: 0
                    format: double
                    description: The tracked quantity to store for this product.
                brand_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: Links the product to a brand when present.
                compare_at_price:
                    type: number
                    minimum: 0
                    format: double
                tax_rate:
                    type: number
                    minimum: 0
                    format: double
                currency:
                    type: string
                weight:
                    type: number
                    minimum: 0
                    format: double
                weight_unit:
                    type: string
                length:
                    type: number
                    minimum: 0
                    format: double
                width:
                    type: number
                    minimum: 0
                    format: double
                height:
                    type: number
                    minimum: 0
                    format: double
                dimension_unit:
                    type: string
                country_of_origin:
                    type: string
                hs_code:
                    type: string
                allow_backorder:
                    type: boolean
                lead_time_days:
                    type: integer
                    minimum: 0
                    format: int32
                image_url:
                    type: string
            required:
                - category_id
                - supplier_id
                - name
                - sku
                - barcode
                - description
                - unit
                - cost_price
                - sale_price
                - low_stock_threshold
                - reorder_quantity
                - is_active
                - track_inventory
                - stock_quantity
                - brand_id
                - compare_at_price
                - tax_rate
                - currency
                - weight
                - weight_unit
                - length
                - width
                - height
                - dimension_unit
                - country_of_origin
                - hs_code
                - allow_backorder
                - lead_time_days
                - image_url
        erp.product.v1.UpdateProductResponse:
            type: object
            properties:
                message:
                    type: string
