openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /booking/appointment/v1/appointments:
        get:
            tags:
                - AppointmentService
            summary: listAppointments
            operationId: AppointmentService_listAppointments
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/booking.appointment.v1.ListAppointmentsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        post:
            tags:
                - AppointmentService
            summary: createAppointment
            operationId: AppointmentService_createAppointment
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/booking.appointment.v1.CreateAppointmentRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/booking.appointment.v1.CreateAppointmentResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /booking/appointment/v1/appointments/today:
        get:
            tags:
                - AppointmentService
            summary: listTodayAppointments
            operationId: AppointmentService_listTodayAppointments
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/booking.appointment.v1.ListTodayAppointmentsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /booking/appointment/v1/appointments/{id}:
        put:
            tags:
                - AppointmentService
            summary: updateAppointment
            operationId: AppointmentService_updateAppointment
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                service_id:
                                    type: string
                                    pattern: ^-?[0-9]+$
                                    format: int64
                                resource_id:
                                    type: string
                                    pattern: ^-?[0-9]+$
                                    format: int64
                                staff_id:
                                    type: string
                                    pattern: ^-?[0-9]+$
                                    format: int64
                                customer_name:
                                    type: string
                                customer_email:
                                    type: string
                                customer_phone:
                                    type: string
                                start_time:
                                    type: string
                                end_time:
                                    type: string
                                status:
                                    type: string
                                notes:
                                    type: string
                            required:
                                - service_id
                                - resource_id
                                - staff_id
                                - customer_name
                                - customer_email
                                - customer_phone
                                - start_time
                                - end_time
                                - status
                                - notes
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/booking.appointment.v1.UpdateAppointmentResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        delete:
            tags:
                - AppointmentService
            summary: deleteAppointment
            operationId: AppointmentService_deleteAppointment
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/booking.appointment.v1.DeleteAppointmentResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        booking.appointment.v1.ListAppointmentsRequest:
            type: object
        booking.appointment.v1.ListAppointmentsResponse:
            type: object
            properties:
                appointments:
                    type: array
                    items:
                        $ref: '#/components/schemas/booking.appointment.v1.Appointment'
            required:
                - appointments
        booking.appointment.v1.Appointment:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                owner_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                business_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                service_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                resource_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                staff_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                customer_name:
                    type: string
                customer_email:
                    type: string
                customer_phone:
                    type: string
                start_time:
                    type: string
                end_time:
                    type: string
                status:
                    type: string
                notes:
                    type: string
                created_at:
                    type: string
                updated_at:
                    type: string
            required:
                - id
                - owner_id
                - business_id
                - service_id
                - resource_id
                - staff_id
                - customer_name
                - customer_email
                - customer_phone
                - start_time
                - end_time
                - status
                - notes
                - created_at
                - updated_at
        booking.appointment.v1.ListTodayAppointmentsRequest:
            type: object
        booking.appointment.v1.ListTodayAppointmentsResponse:
            type: object
            properties:
                appointments:
                    type: array
                    items:
                        $ref: '#/components/schemas/booking.appointment.v1.Appointment'
            required:
                - appointments
        booking.appointment.v1.CreateAppointmentRequest:
            type: object
            properties:
                service_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                resource_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                staff_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                customer_name:
                    type: string
                customer_email:
                    type: string
                customer_phone:
                    type: string
                start_time:
                    type: string
                end_time:
                    type: string
                status:
                    type: string
                notes:
                    type: string
            required:
                - service_id
                - resource_id
                - staff_id
                - customer_name
                - customer_email
                - customer_phone
                - start_time
                - end_time
                - status
                - notes
        booking.appointment.v1.CreateAppointmentResponse:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                message:
                    type: string
            required:
                - id
                - message
        booking.appointment.v1.UpdateAppointmentRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                service_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                resource_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                staff_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                customer_name:
                    type: string
                customer_email:
                    type: string
                customer_phone:
                    type: string
                start_time:
                    type: string
                end_time:
                    type: string
                status:
                    type: string
                notes:
                    type: string
            required:
                - id
                - service_id
                - resource_id
                - staff_id
                - customer_name
                - customer_email
                - customer_phone
                - start_time
                - end_time
                - status
                - notes
        booking.appointment.v1.UpdateAppointmentResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        booking.appointment.v1.DeleteAppointmentRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - id
        booking.appointment.v1.DeleteAppointmentResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: AppointmentService
