openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /booking/calendar/v1/calendar:
        get:
            tags:
                - CalendarService
            summary: getCalendar
            operationId: CalendarService_getCalendar
            parameters:
                - name: from
                  in: query
                  required: true
                  schema:
                    type: string
                - name: to
                  in: query
                  required: true
                  schema:
                    type: string
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/booking.calendar.v1.GetCalendarResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        booking.calendar.v1.GetCalendarRequest:
            type: object
            properties:
                from_date:
                    type: string
                to_date:
                    type: string
            required:
                - from_date
                - to_date
        booking.calendar.v1.GetCalendarResponse:
            type: object
            properties:
                days:
                    type: array
                    items:
                        $ref: '#/components/schemas/booking.calendar.v1.CalendarDay'
            required:
                - days
        booking.calendar.v1.CalendarDay:
            type: object
            properties:
                date:
                    type: string
                appointments:
                    type: array
                    items:
                        $ref: '#/components/schemas/booking.calendar.v1.CalendarAppointment'
            required:
                - date
                - appointments
        booking.calendar.v1.CalendarAppointment:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                business_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                service_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                customer_name:
                    type: string
                start_time:
                    type: string
                end_time:
                    type: string
                status:
                    type: string
            required:
                - id
                - business_id
                - service_id
                - customer_name
                - start_time
                - end_time
                - status
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: CalendarService
