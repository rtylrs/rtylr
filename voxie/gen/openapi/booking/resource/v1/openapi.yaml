openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /booking/resource/v1/resources:
        get:
            tags:
                - ResourceService
            summary: listResources
            operationId: ResourceService_listResources
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/booking.resource.v1.ListResourcesResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        post:
            tags:
                - ResourceService
            summary: createResource
            operationId: ResourceService_createResource
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/booking.resource.v1.CreateResourceRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/booking.resource.v1.CreateResourceResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /booking/resource/v1/resources/{id}:
        put:
            tags:
                - ResourceService
            summary: updateResource
            operationId: ResourceService_updateResource
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
                                type:
                                    type: string
                                capacity:
                                    type: integer
                                    format: int32
                                is_active:
                                    type: boolean
                            required:
                                - name
                                - type
                                - capacity
                                - is_active
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/booking.resource.v1.UpdateResourceResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        delete:
            tags:
                - ResourceService
            summary: deleteResource
            operationId: ResourceService_deleteResource
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/booking.resource.v1.DeleteResourceResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        booking.resource.v1.ListResourcesRequest:
            type: object
        booking.resource.v1.ListResourcesResponse:
            type: object
            properties:
                resources:
                    type: array
                    items:
                        $ref: '#/components/schemas/booking.resource.v1.Resource'
            required:
                - resources
        booking.resource.v1.Resource:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                owner_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                business_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                type:
                    type: string
                capacity:
                    type: integer
                    format: int32
                is_active:
                    type: boolean
                created_at:
                    type: string
            required:
                - id
                - owner_id
                - business_id
                - name
                - type
                - capacity
                - is_active
                - created_at
        booking.resource.v1.CreateResourceRequest:
            type: object
            properties:
                name:
                    type: string
                type:
                    type: string
                capacity:
                    type: integer
                    format: int32
                is_active:
                    type: boolean
            required:
                - name
                - type
                - capacity
                - is_active
        booking.resource.v1.CreateResourceResponse:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                message:
                    type: string
            required:
                - id
                - message
        booking.resource.v1.UpdateResourceRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                type:
                    type: string
                capacity:
                    type: integer
                    format: int32
                is_active:
                    type: boolean
            required:
                - id
                - name
                - type
                - capacity
                - is_active
        booking.resource.v1.UpdateResourceResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        booking.resource.v1.DeleteResourceRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - id
        booking.resource.v1.DeleteResourceResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: ResourceService
