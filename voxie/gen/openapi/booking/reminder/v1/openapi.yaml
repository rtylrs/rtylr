openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /booking/reminder/v1/reminders:
        get:
            tags:
                - ReminderService
            summary: listReminders
            operationId: ReminderService_listReminders
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/booking.reminder.v1.ListRemindersResponse'
        post:
            tags:
                - ReminderService
            summary: createReminder
            operationId: ReminderService_createReminder
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/booking.reminder.v1.CreateReminderRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/booking.reminder.v1.CreateReminderResponse'
components:
    schemas:
        booking.reminder.v1.ListRemindersRequest:
            type: object
        booking.reminder.v1.ListRemindersResponse:
            type: object
            properties:
                reminders:
                    type: array
                    items:
                        $ref: '#/components/schemas/booking.reminder.v1.Reminder'
            required:
                - reminders
        booking.reminder.v1.Reminder:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                owner_id:
                    type: string
                    format: int64
                business_id:
                    type: string
                    format: int64
                appointment_id:
                    type: string
                    format: int64
                type:
                    type: string
                scheduled_at:
                    type: string
                sent_at:
                    type: string
                created_at:
                    type: string
            required:
                - id
                - owner_id
                - business_id
                - appointment_id
                - type
                - scheduled_at
                - sent_at
                - created_at
        booking.reminder.v1.CreateReminderRequest:
            type: object
            properties:
                appointment_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                type:
                    type: string
                scheduled_at:
                    type: string
            required:
                - appointment_id
                - type
                - scheduled_at
        booking.reminder.v1.CreateReminderResponse:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                message:
                    type: string
            required:
                - id
                - message
