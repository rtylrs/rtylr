openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /booking/waitlist/v1/entries:
        get:
            tags:
                - WaitlistService
            summary: listEntries
            operationId: WaitlistService_listEntries
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/booking.waitlist.v1.ListEntriesResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        post:
            tags:
                - WaitlistService
            summary: createEntry
            operationId: WaitlistService_createEntry
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/booking.waitlist.v1.CreateEntryRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/booking.waitlist.v1.CreateEntryResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /booking/waitlist/v1/entries/{id}:
        put:
            tags:
                - WaitlistService
            summary: updateEntry
            operationId: WaitlistService_updateEntry
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                service_id:
                                    type: string
                                    pattern: ^-?[0-9]+$
                                    format: int64
                                customer_name:
                                    type: string
                                customer_email:
                                    type: string
                                customer_phone:
                                    type: string
                                preferred_date:
                                    type: string
                                preferred_time:
                                    type: string
                                status:
                                    type: string
                            required:
                                - service_id
                                - customer_name
                                - customer_email
                                - customer_phone
                                - preferred_date
                                - preferred_time
                                - status
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/booking.waitlist.v1.UpdateEntryResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        booking.waitlist.v1.ListEntriesRequest:
            type: object
        booking.waitlist.v1.ListEntriesResponse:
            type: object
            properties:
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/booking.waitlist.v1.WaitlistEntry'
            required:
                - entries
        booking.waitlist.v1.WaitlistEntry:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                owner_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                business_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                service_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                customer_name:
                    type: string
                customer_email:
                    type: string
                customer_phone:
                    type: string
                preferred_date:
                    type: string
                preferred_time:
                    type: string
                status:
                    type: string
                created_at:
                    type: string
            required:
                - id
                - owner_id
                - business_id
                - service_id
                - customer_name
                - customer_email
                - customer_phone
                - preferred_date
                - preferred_time
                - status
                - created_at
        booking.waitlist.v1.CreateEntryRequest:
            type: object
            properties:
                service_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                customer_name:
                    type: string
                customer_email:
                    type: string
                customer_phone:
                    type: string
                preferred_date:
                    type: string
                preferred_time:
                    type: string
            required:
                - service_id
                - customer_name
                - customer_email
                - customer_phone
                - preferred_date
                - preferred_time
        booking.waitlist.v1.CreateEntryResponse:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                message:
                    type: string
            required:
                - id
                - message
        booking.waitlist.v1.UpdateEntryRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                service_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                customer_name:
                    type: string
                customer_email:
                    type: string
                customer_phone:
                    type: string
                preferred_date:
                    type: string
                preferred_time:
                    type: string
                status:
                    type: string
            required:
                - id
                - service_id
                - customer_name
                - customer_email
                - customer_phone
                - preferred_date
                - preferred_time
                - status
        booking.waitlist.v1.UpdateEntryResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: WaitlistService
