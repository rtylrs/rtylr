openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /common/oauth/v1/issue:
        post:
            tags:
                - OauthService
            summary: issue
            description: Issue starts the OAuth authorization redirect flow.
            operationId: OauthService_issue
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/common.oauth.v1.IssueRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/common.oauth.v1.IssueResponse'
    /common/oauth/v1/token:
        post:
            tags:
                - OauthService
            summary: token
            operationId: OauthService_token
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/common.oauth.v1.TokenRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/common.oauth.v1.TokenResponse'
    /common/oauth/v1/revoke:
        post:
            tags:
                - OauthService
            summary: revoke
            operationId: OauthService_revoke
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/common.oauth.v1.RevokeRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/common.oauth.v1.RevokeResponse'
    /common/oauth/v1/me:
        get:
            tags:
                - OauthService
            summary: me
            operationId: OauthService_me
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/common.oauth.v1.MeResponse'
components:
    schemas:
        common.oauth.v1.IssueRequest:
            type: object
            properties:
                client_id:
                    type: string
                    description: client_id identifies the OAuth client requesting authorization.
                redirect_uri:
                    type: string
                    format: uri
                    description: redirect_uri is the callback URI that receives the authorization code.
                scope:
                    type: string
                    description: scope contains the requested OAuth scopes.
                state:
                    type: string
                    description: state is echoed back to the redirect URI.
                code_challenge:
                    type: string
                    description: code_challenge is the PKCE challenge for the authorization code.
                code_challenge_method:
                    type: string
                    description: code_challenge_method is the PKCE challenge method.
            required:
                - client_id
                - redirect_uri
                - scope
                - state
                - code_challenge
                - code_challenge_method
            description: IssueRequest creates an OAuth authorization redirect for the signed-in user.
        common.oauth.v1.IssueResponse:
            type: object
            properties:
                redirect_url:
                    type: string
                    description: redirect_url is the URL the browser should navigate to.
            description: IssueResponse returns the authorization redirect URL.
        common.oauth.v1.TokenRequest:
            type: object
            properties:
                grant_type:
                    type: string
                code:
                    type: string
                code_verifier:
                    type: string
                redirect_uri:
                    type: string
                client_id:
                    type: string
                refresh_token:
                    type: string
            required:
                - grant_type
                - client_id
        common.oauth.v1.TokenResponse:
            type: object
            properties:
                access_token:
                    type: string
                refresh_token:
                    type: string
                token_type:
                    type: string
                expires_in:
                    type: integer
                    format: int32
        common.oauth.v1.RevokeRequest:
            type: object
            properties:
                token:
                    type: string
                client_id:
                    type: string
            required:
                - token
        common.oauth.v1.RevokeResponse:
            type: object
            properties:
                ok:
                    type: boolean
        common.oauth.v1.MeRequest:
            type: object
        common.oauth.v1.MeResponse:
            type: object
            properties:
                user_id:
                    type: string
                    format: int64
                business_id:
                    type: string
                    format: int64
                role:
                    type: string
                effective_access:
                    allOf:
                        - $ref: '#/components/schemas/hub.user.v1.EffectiveAccess'
                    description: Server-resolved authorization for the active business.
        hub.user.v1.EffectiveAccess:
            type: object
            properties:
                business_id:
                    type: string
                    description: Active business scope for this authorization snapshot.
                dash_role:
                    type: string
                    description: Effective Dash role key.
                dash_role_id:
                    type: string
                    description: Effective Dash role identifier.
                dash_permissions:
                    type: array
                    items:
                        type: string
                    description: Effective Dash permission keys.
                subscribed_apps:
                    type: array
                    items:
                        type: string
                    description: Business applications subscribed for this snapshot.
                licenses:
                    type: array
                    items:
                        $ref: '#/components/schemas/hub.user.v1.LicenseAssignment'
                    description: Active and historical license assignments.
                apps:
                    type: array
                    items:
                        $ref: '#/components/schemas/hub.user.v1.EffectiveAppAccess'
                    description: Effective application access entries.
                is_owner:
                    type: boolean
                    description: Whether the user is the business owner.
                is_admin:
                    type: boolean
                    description: Whether the user has the Dash Admin override.
                authorization_version:
                    type: string
                    format: int64
                    description: Monotonic authorization version for cache refresh.
        hub.user.v1.LicenseAssignment:
            type: object
            properties:
                app_id:
                    type: string
                    description: Licensed application identifier.
                status:
                    type: string
                    description: License lifecycle status.
                assignment_source:
                    type: string
                    description: Server-owned license source.
                group_id:
                    type: string
                    description: Group target when the license is group-derived.
                granted_at:
                    type: string
                    description: Time the license was granted.
                revoked_at:
                    type: string
                    description: Time the license was revoked, when revoked.
        hub.user.v1.EffectiveAppAccess:
            type: object
            properties:
                app_id:
                    type: string
                    description: Application represented by this access entry.
                licensed:
                    type: boolean
                    description: Whether an active user or group license exists.
                has_access:
                    type: boolean
                    description: Whether the user has an active role assignment.
                role_ids:
                    type: array
                    items:
                        type: string
                    description: Effective canonical role identifiers.
                primary_role_id:
                    type: string
                    description: Primary role used for display and app entry.
                display_role:
                    type: string
                    description: Server-resolved display role.
                permissions:
                    type: array
                    items:
                        type: string
                    description: Effective permission keys for this application.
                scopes:
                    type: array
                    items:
                        $ref: '#/components/schemas/hub.user.v1.RoleScope'
                    description: Resource scopes attached to effective assignments.
                sources:
                    type: array
                    items:
                        type: string
                    description: Sources contributing to effective access.
                permission_sources:
                    type: object
                    additionalProperties:
                        type: string
                    description: Permission-to-role source explanation.
        hub.user.v1.RoleScope:
            type: object
            properties:
                scope_type:
                    type: string
                    description: Scope resource type, such as location, department, or project.
                scope_id:
                    type: string
                    description: Tenant-owned resource identifier.
