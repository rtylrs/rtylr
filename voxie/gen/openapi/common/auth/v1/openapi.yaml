openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /common/auth/v1/register:
        post:
            tags:
                - AuthService
            summary: register
            description: Register creates a new owner account and optional first business.
            operationId: AuthService_register
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/common.auth.v1.RegisterRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/common.auth.v1.RegisterResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /common/auth/v1/login:
        post:
            tags:
                - AuthService
            summary: login
            description: Login authenticates an email and password pair.
            operationId: AuthService_login
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/common.auth.v1.LoginRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/common.auth.v1.LoginResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /common/auth/v1/register/google:
        post:
            tags:
                - AuthService
            summary: googleAuth
            description: GoogleAuth completes social authentication with an OAuth code.
            operationId: AuthService_googleAuth
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/common.auth.v1.GoogleAuthRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/common.auth.v1.GoogleAuthResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /common/auth/v1/password-reset/request:
        post:
            tags:
                - AuthService
            summary: resetPassword
            description: ResetPassword starts a password reset flow.
            operationId: AuthService_resetPassword
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/common.auth.v1.ResetPasswordRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/common.auth.v1.ResetPasswordResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /common/auth/v1/password-reset/confirm:
        post:
            tags:
                - AuthService
            summary: resetPasswordConfirm
            description: ResetPasswordConfirm completes a password reset flow.
            operationId: AuthService_resetPasswordConfirm
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/common.auth.v1.ResetPasswordConfirmRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/common.auth.v1.ResetPasswordConfirmResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /common/auth/v1/verify-email:
        post:
            tags:
                - AuthService
            summary: verifyEmail
            description: VerifyEmail verifies an account email using a token.
            operationId: AuthService_verifyEmail
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/common.auth.v1.VerifyEmailRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/common.auth.v1.VerifyEmailResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /common/auth/v1/resend-verification:
        post:
            tags:
                - AuthService
            summary: resendVerification
            description: ResendVerification sends a fresh email verification message.
            operationId: AuthService_resendVerification
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/common.auth.v1.ResendVerificationRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/common.auth.v1.ResendVerificationResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /common/auth/v1/invite/accept:
        post:
            tags:
                - AuthService
            summary: inviteAccept
            description: InviteAccept lets an invited user activate their account.
            operationId: AuthService_inviteAccept
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/common.auth.v1.InviteAcceptRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/common.auth.v1.InviteAcceptResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /common/auth/v1/email-exists:
        get:
            tags:
                - AuthService
            summary: checkEmailExists
            description: CheckEmailExists probes whether an email is already registered.
            operationId: AuthService_checkEmailExists
            parameters:
                - name: email
                  in: query
                  description: email is the address to probe during inline registration/login validation.
                  required: true
                  schema:
                    type: string
                    format: email
                    description: email is the address to probe during inline registration/login validation.
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/common.auth.v1.CheckEmailExistsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /common/auth/v1/social/authorize:
        get:
            tags:
                - AuthService
            summary: socialAuthorize
            description: SocialAuthorize returns the WorkOS-hosted consent URL for a provider.
            operationId: AuthService_socialAuthorize
            parameters:
                - name: provider
                  in: query
                  description: provider is the social login provider (google, github, microsoft, apple).
                  required: false
                  schema:
                    type: string
                    enum:
                        - google
                        - github
                        - microsoft
                        - apple
                        - ""
                    description: provider is the social login provider (google, github, microsoft, apple).
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/common.auth.v1.SocialAuthorizeResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        common.auth.v1.RegisterRequest:
            type: object
            properties:
                email:
                    type: string
                    format: email
                    description: email is the email address used for lookup or contact.
                password:
                    type: string
                    description: password is the user-provided secret for authentication.
                name:
                    type: string
                    description: name is the name value for this contract.
                business_name:
                    type: string
                    description: business_name is the optional business name to create for the user.
                plan_slug:
                    type: string
                    description: plan_slug optionally selects the subscription plan to assign after registration.
            required:
                - email
                - password
                - name
        common.auth.v1.RegisterResponse:
            type: object
            properties:
                token:
                    type: string
                    description: token is the opaque token used to complete the operation.
                message:
                    type: string
                    description: message is a human-readable result message.
                user_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: user_id identifies the user associated with this request.
                email:
                    type: string
                    description: email is the email address used for lookup or contact.
                name:
                    type: string
                    description: name is the name value for this contract.
            required:
                - token
                - message
                - user_id
                - email
                - name
        common.auth.v1.LoginRequest:
            type: object
            properties:
                email:
                    type: string
                    format: email
                    description: email is the email address used for lookup or contact.
                password:
                    type: string
                    description: password is the user-provided secret for authentication.
            required:
                - email
                - password
        common.auth.v1.LoginResponse:
            type: object
            properties:
                token:
                    type: string
                    description: token is the opaque token used to complete the operation.
                message:
                    type: string
                    description: message is a human-readable result message.
                user_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: user_id identifies the user associated with this request.
                email:
                    type: string
                    description: email is the email address used for lookup or contact.
                name:
                    type: string
                    description: name is the name value for this contract.
                is_console_admin:
                    type: boolean
                    description: is_console_admin indicates the user can access the internal console.
            required:
                - token
                - message
                - user_id
                - email
                - name
                - is_console_admin
        common.auth.v1.GoogleAuthRequest:
            type: object
            properties:
                business_name:
                    type: string
                    description: business_name is the optional business name to create for the user.
                code:
                    type: string
                    description: code is the OAuth authorization code returned by the provider callback.
            required:
                - code
        common.auth.v1.GoogleAuthResponse:
            type: object
            properties:
                token:
                    type: string
                    description: token is the opaque token used to complete the operation.
                is_new:
                    type: boolean
                    description: is_new is the is new value for this contract.
            required:
                - token
                - is_new
        common.auth.v1.ResetPasswordRequest:
            type: object
            properties:
                email:
                    type: string
                    format: email
                    description: email is the email address used for lookup or contact.
            required:
                - email
        common.auth.v1.ResetPasswordResponse:
            type: object
            properties:
                message:
                    type: string
                    description: message is a human-readable result message.
            required:
                - message
        common.auth.v1.ResetPasswordConfirmRequest:
            type: object
            properties:
                token:
                    type: string
                    description: token is the opaque reset token from the password reset link.
                password:
                    type: string
                    description: password is the new password selected by the user.
            required:
                - token
                - password
        common.auth.v1.ResetPasswordConfirmResponse:
            type: object
            properties:
                message:
                    type: string
                    description: message is a human-readable result message.
            required:
                - message
        common.auth.v1.VerifyEmailRequest:
            type: object
            properties:
                token:
                    type: string
                    description: token is the opaque email verification token.
            required:
                - token
        common.auth.v1.VerifyEmailResponse:
            type: object
            properties:
                verified:
                    type: boolean
                    description: verified indicates the email was verified successfully.
                message:
                    type: string
                    description: message is a human-readable result message.
            required:
                - verified
                - message
        common.auth.v1.ResendVerificationRequest:
            type: object
            properties:
                email:
                    type: string
                    format: email
                    description: email is the address that should receive a verification email.
            required:
                - email
        common.auth.v1.ResendVerificationResponse:
            type: object
            properties:
                ok:
                    type: boolean
                    description: ok indicates the request was accepted.
                message:
                    type: string
                    description: message is a human-readable result message.
            required:
                - ok
                - message
        common.auth.v1.InviteAcceptRequest:
            type: object
            properties:
                token:
                    type: string
                    description: token is the opaque token used to complete the operation.
                password:
                    type: string
                    description: password is the user-provided secret for authentication.
            required:
                - token
                - password
        common.auth.v1.InviteAcceptResponse:
            type: object
            properties:
                message:
                    type: string
                    description: message is a human-readable result message.
            required:
                - message
        common.auth.v1.CheckEmailExistsRequest:
            type: object
            properties:
                email:
                    type: string
                    format: email
                    description: email is the address to probe during inline registration/login validation.
            required:
                - email
        common.auth.v1.CheckEmailExistsResponse:
            type: object
            properties:
                exists:
                    type: boolean
                    description: exists is true when an account with this email is already registered.
            required:
                - exists
        common.auth.v1.SocialAuthorizeRequest:
            type: object
            properties:
                provider:
                    type: string
                    enum:
                        - google
                        - github
                        - microsoft
                        - apple
                        - ""
                    description: provider is the social login provider (google, github, microsoft, apple).
            required:
                - provider
        common.auth.v1.SocialAuthorizeResponse:
            type: object
            properties:
                url:
                    type: string
                    description: url is the provider-hosted consent URL to redirect the browser to.
            required:
                - url
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: AuthService
      description: AuthService defines the public authentication endpoints.
