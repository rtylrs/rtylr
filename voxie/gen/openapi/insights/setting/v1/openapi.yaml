openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /insights/setting/v1/settings:
        get:
            tags:
                - SettingService
            summary: getInsightsSettings
            description: Returns insights configuration.
            operationId: SettingService_getInsightsSettings
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/insights.setting.v1.GetInsightsSettingsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        put:
            tags:
                - SettingService
            summary: updateInsightsSettings
            description: Replaces insights configuration.
            operationId: SettingService_updateInsightsSettings
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/insights.setting.v1.UpdateInsightsSettingsRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/insights.setting.v1.UpdateInsightsSettingsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        insights.setting.v1.GetInsightsSettingsRequest:
            type: object
        insights.setting.v1.GetInsightsSettingsResponse:
            type: object
            properties:
                settings:
                    allOf:
                        - $ref: '#/components/schemas/insights.setting.v1.InsightsSettings'
                    description: settings is the settings value for this contract.
            required:
                - settings
        insights.setting.v1.InsightsSettings:
            type: object
            properties:
                default_period:
                    type: string
                    description: |-
                        default_period is the default period value for this contract.
                        this_month, this_quarter, this_year
                currency:
                    type: string
                    description: currency is the currency value for this contract.
                compare_previous:
                    type: boolean
                    description: compare_previous is the compare previous value for this contract.
                dashboard_widgets:
                    type: array
                    items:
                        type: string
                    description: dashboard_widgets is the dashboard widgets value for this contract.
                favorite_reports:
                    type: array
                    items:
                        type: string
                    description: favorite_reports is the favorite reports value for this contract.
            required:
                - default_period
                - currency
                - compare_previous
                - dashboard_widgets
                - favorite_reports
        insights.setting.v1.UpdateInsightsSettingsRequest:
            type: object
            properties:
                settings:
                    allOf:
                        - $ref: '#/components/schemas/insights.setting.v1.InsightsSettings'
                    description: settings is the settings value for this contract.
            required:
                - settings
        insights.setting.v1.UpdateInsightsSettingsResponse:
            type: object
            properties:
                settings:
                    allOf:
                        - $ref: '#/components/schemas/insights.setting.v1.InsightsSettings'
                    description: settings is the settings value for this contract.
            required:
                - settings
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: SettingService
      description: SettingService defines insights settings endpoints.
