openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /insights/financial/v1/cash-flow:
        get:
            tags:
                - FinancialService
            summary: getCashFlowAnalytics
            description: Returns cash flow analytics for a period.
            operationId: FinancialService_getCashFlowAnalytics
            parameters:
                - name: period
                  in: query
                  required: true
                  schema:
                    type: string
                    description: period is the period value for this contract.
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/insights.financial.v1.GetCashFlowAnalyticsResponse'
    /insights/financial/v1/expenses:
        get:
            tags:
                - FinancialService
            summary: getExpenseAnalytics
            description: Returns expense analytics for a period.
            operationId: FinancialService_getExpenseAnalytics
            parameters:
                - name: period
                  in: query
                  required: true
                  schema:
                    type: string
                    description: period is the period value for this contract.
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/insights.financial.v1.GetExpenseAnalyticsResponse'
    /insights/financial/v1/invoice-aging:
        get:
            tags:
                - FinancialService
            summary: getInvoiceAging
            description: Returns invoice aging analysis.
            operationId: FinancialService_getInvoiceAging
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/insights.financial.v1.GetInvoiceAgingResponse'
components:
    schemas:
        insights.financial.v1.GetCashFlowAnalyticsRequest:
            type: object
            properties:
                period:
                    type: string
                    description: period is the period value for this contract.
            required:
                - period
        insights.financial.v1.GetCashFlowAnalyticsResponse:
            type: object
            properties:
                analytics:
                    allOf:
                        - $ref: '#/components/schemas/insights.financial.v1.CashFlowAnalytics'
                    description: analytics is the analytics value for this contract.
            required:
                - analytics
        insights.financial.v1.CashFlowAnalytics:
            type: object
            properties:
                inflows:
                    type: number
                    format: double
                    description: inflows is the inflows value for this contract.
                outflows:
                    type: number
                    format: double
                    description: outflows is the outflows value for this contract.
                net:
                    type: number
                    format: double
                    description: net is the net value for this contract.
                trend:
                    type: array
                    items:
                        $ref: '#/components/schemas/insights.financial.v1.CashFlowPoint'
                    description: trend is the trend value for this contract.
            required:
                - inflows
                - outflows
                - net
                - trend
        insights.financial.v1.CashFlowPoint:
            type: object
            properties:
                date:
                    type: string
                    description: date is the date value for this contract.
                inflow:
                    type: number
                    format: double
                    description: inflow is the inflow value for this contract.
                outflow:
                    type: number
                    format: double
                    description: outflow is the outflow value for this contract.
                net:
                    type: number
                    format: double
                    description: net is the net value for this contract.
            required:
                - date
                - inflow
                - outflow
                - net
        insights.financial.v1.GetExpenseAnalyticsRequest:
            type: object
            properties:
                period:
                    type: string
                    description: period is the period value for this contract.
            required:
                - period
        insights.financial.v1.GetExpenseAnalyticsResponse:
            type: object
            properties:
                analytics:
                    allOf:
                        - $ref: '#/components/schemas/insights.financial.v1.ExpenseAnalytics'
                    description: analytics is the analytics value for this contract.
            required:
                - analytics
        insights.financial.v1.ExpenseAnalytics:
            type: object
            properties:
                total:
                    type: number
                    format: double
                    description: total is the total number of matching records.
                change:
                    type: number
                    format: double
                    description: change is the change value for this contract.
                by_category:
                    type: array
                    items:
                        $ref: '#/components/schemas/insights.financial.v1.ExpenseByCategory'
                    description: by_category is the by category value for this contract.
                trend:
                    type: array
                    items:
                        $ref: '#/components/schemas/insights.financial.v1.ExpensePoint'
                    description: trend is the trend value for this contract.
            required:
                - total
                - change
                - by_category
                - trend
        insights.financial.v1.ExpenseByCategory:
            type: object
            properties:
                category:
                    type: string
                    description: category is the category value for this contract.
                amount:
                    type: number
                    format: double
                    description: amount is the amount value for this contract.
                percentage:
                    type: number
                    format: double
                    description: percentage is the percentage value for this contract.
                budget:
                    type: number
                    format: double
                    description: budget is the budget value for this contract.
                utilization:
                    type: number
                    format: double
                    description: utilization is the utilization value for this contract.
            required:
                - category
                - amount
                - percentage
                - budget
                - utilization
        insights.financial.v1.ExpensePoint:
            type: object
            properties:
                date:
                    type: string
                    description: date is the date value for this contract.
                amount:
                    type: number
                    format: double
                    description: amount is the amount value for this contract.
            required:
                - date
                - amount
        insights.financial.v1.GetInvoiceAgingRequest:
            type: object
        insights.financial.v1.GetInvoiceAgingResponse:
            type: object
            properties:
                aging:
                    allOf:
                        - $ref: '#/components/schemas/insights.financial.v1.InvoiceAging'
                    description: aging is the aging value for this contract.
            required:
                - aging
        insights.financial.v1.InvoiceAging:
            type: object
            properties:
                total_outstanding:
                    type: number
                    format: double
                    description: total_outstanding is the total outstanding value for this contract.
                buckets:
                    type: array
                    items:
                        $ref: '#/components/schemas/insights.financial.v1.InvoiceAgingBucket'
                    description: buckets is the buckets value for this contract.
            required:
                - total_outstanding
                - buckets
        insights.financial.v1.InvoiceAgingBucket:
            type: object
            properties:
                bucket:
                    type: string
                    description: |-
                        bucket is the bucket value for this contract.
                        current, 1-30, 31-60, 61-90, 90+
                count:
                    type: integer
                    format: int32
                    description: count is the count value for this contract.
                amount:
                    type: number
                    format: double
                    description: amount is the amount value for this contract.
            required:
                - bucket
                - count
                - amount
