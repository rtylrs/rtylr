openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /insights/revenue/v1/overview:
        get:
            tags:
                - RevenueService
            summary: getRevenueOverview
            description: Returns revenue overview for a period.
            operationId: RevenueService_getRevenueOverview
            parameters:
                - name: period
                  in: query
                  required: true
                  schema:
                    type: string
                    description: period is the period value for this contract.
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/insights.revenue.v1.GetRevenueOverviewResponse'
    /insights/revenue/v1/by-app:
        get:
            tags:
                - RevenueService
            summary: getRevenueByApp
            description: Returns revenue broken down by app.
            operationId: RevenueService_getRevenueByApp
            parameters:
                - name: period
                  in: query
                  required: true
                  schema:
                    type: string
                    description: period is the period value for this contract.
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/insights.revenue.v1.GetRevenueByAppResponse'
    /insights/revenue/v1/comparison:
        get:
            tags:
                - RevenueService
            summary: getRevenueComparison
            description: Compares revenue across periods.
            operationId: RevenueService_getRevenueComparison
            parameters:
                - name: period
                  in: query
                  required: true
                  schema:
                    type: string
                    description: period is the period value for this contract.
                - name: compare_to
                  in: query
                  required: true
                  schema:
                    type: string
                    description: |-
                        compare_to is the compare to value for this contract.
                        previous_period, same_period_last_year
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/insights.revenue.v1.GetRevenueComparisonResponse'
components:
    schemas:
        insights.revenue.v1.GetRevenueOverviewRequest:
            type: object
            properties:
                period:
                    type: string
                    description: period is the period value for this contract.
            required:
                - period
        insights.revenue.v1.GetRevenueOverviewResponse:
            type: object
            properties:
                overview:
                    allOf:
                        - $ref: '#/components/schemas/insights.revenue.v1.RevenueOverview'
                    description: overview is the overview value for this contract.
            required:
                - overview
        insights.revenue.v1.RevenueOverview:
            type: object
            properties:
                total:
                    type: number
                    format: double
                    description: total is the total number of matching records.
                change:
                    type: number
                    format: double
                    description: change is the change value for this contract.
                trend:
                    type: array
                    items:
                        $ref: '#/components/schemas/insights.revenue.v1.RevenuePoint'
                    description: trend is the trend value for this contract.
            required:
                - total
                - change
                - trend
        insights.revenue.v1.RevenuePoint:
            type: object
            properties:
                date:
                    type: string
                    description: date is the date value for this contract.
                amount:
                    type: number
                    format: double
                    description: amount is the amount value for this contract.
            required:
                - date
                - amount
        insights.revenue.v1.GetRevenueByAppRequest:
            type: object
            properties:
                period:
                    type: string
                    description: period is the period value for this contract.
            required:
                - period
        insights.revenue.v1.GetRevenueByAppResponse:
            type: object
            properties:
                apps:
                    type: array
                    items:
                        $ref: '#/components/schemas/insights.revenue.v1.RevenueByApp'
                    description: apps is the apps value for this contract.
            required:
                - apps
        insights.revenue.v1.RevenueByApp:
            type: object
            properties:
                app:
                    type: string
                    description: app is the app value for this contract.
                amount:
                    type: number
                    format: double
                    description: amount is the amount value for this contract.
                percentage:
                    type: number
                    format: double
                    description: percentage is the percentage value for this contract.
            required:
                - app
                - amount
                - percentage
        insights.revenue.v1.GetRevenueComparisonRequest:
            type: object
            properties:
                period:
                    type: string
                    description: period is the period value for this contract.
                compare_to:
                    type: string
                    description: |-
                        compare_to is the compare to value for this contract.
                        previous_period, same_period_last_year
            required:
                - period
                - compare_to
        insights.revenue.v1.GetRevenueComparisonResponse:
            type: object
            properties:
                comparisons:
                    type: array
                    items:
                        $ref: '#/components/schemas/insights.revenue.v1.RevenueComparison'
                    description: comparisons is the comparisons value for this contract.
            required:
                - comparisons
        insights.revenue.v1.RevenueComparison:
            type: object
            properties:
                period:
                    type: string
                    description: period is the period value for this contract.
                current:
                    type: number
                    format: double
                    description: current is the current value for this contract.
                previous:
                    type: number
                    format: double
                    description: previous is the previous value for this contract.
                change:
                    type: number
                    format: double
                    description: change is the change value for this contract.
            required:
                - period
                - current
                - previous
                - change
