openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /insights/dashboard/v1/insights:
        get:
            tags:
                - DashboardService
            summary: getInsights
            description: Returns high-level insights summary.
            operationId: DashboardService_getInsights
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/insights.dashboard.v1.GetInsightsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /insights/dashboard/v1/roadmap:
        get:
            tags:
                - DashboardService
            summary: getRoadmap
            description: Returns the product roadmap view.
            operationId: DashboardService_getRoadmap
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/insights.dashboard.v1.GetRoadmapResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /insights/dashboard/v1/workload:
        get:
            tags:
                - DashboardService
            summary: getWorkload
            description: Returns team workload metrics.
            operationId: DashboardService_getWorkload
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/insights.dashboard.v1.GetWorkloadResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /insights/dashboard/v1/summary:
        get:
            tags:
                - DashboardService
            summary: getDashboardSummary
            description: Returns MTD headline KPI cards for the insights home dashboard.
            operationId: DashboardService_getDashboardSummary
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/insights.dashboard.v1.GetDashboardSummaryResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        insights.dashboard.v1.GetInsightsRequest:
            type: object
        insights.dashboard.v1.GetInsightsResponse:
            type: object
            properties:
                total_tasks:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: total_tasks is the total tasks value for this contract.
                completed_tasks:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: completed_tasks is the completed tasks value for this contract.
                in_progress_tasks:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: in_progress_tasks is the in progress tasks value for this contract.
                overdue_tasks:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: overdue_tasks is the overdue tasks value for this contract.
                avg_cycle_time_days:
                    type: number
                    format: double
                    description: avg_cycle_time_days is the avg cycle time days value for this contract.
                velocity:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: velocity is the velocity value for this contract.
                velocity_change:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: velocity_change is the velocity change value for this contract.
            required:
                - total_tasks
                - completed_tasks
                - in_progress_tasks
                - overdue_tasks
                - avg_cycle_time_days
                - velocity
                - velocity_change
        insights.dashboard.v1.GetRoadmapRequest:
            type: object
        insights.dashboard.v1.GetRoadmapResponse:
            type: object
            properties:
                projects:
                    type: array
                    items:
                        $ref: '#/components/schemas/insights.dashboard.v1.RoadmapProject'
                    description: projects is the projects value for this contract.
            required:
                - projects
        insights.dashboard.v1.RoadmapProject:
            type: object
            properties:
                project_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: project_id is the project id value for this contract.
                project_name:
                    type: string
                    description: project_name is the project name value for this contract.
                status:
                    type: string
                    description: status is the current lifecycle state.
                total_tasks:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: total_tasks is the total tasks value for this contract.
                completed_tasks:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: completed_tasks is the completed tasks value for this contract.
                progress_percent:
                    type: number
                    format: double
                    description: progress_percent is the progress percent value for this contract.
                start_date:
                    type: string
                    description: start_date is the start date value for this contract.
                due_date:
                    type: string
                    description: due_date is the due date value for this contract.
            required:
                - project_id
                - project_name
                - status
                - total_tasks
                - completed_tasks
                - progress_percent
                - start_date
                - due_date
        insights.dashboard.v1.GetWorkloadRequest:
            type: object
        insights.dashboard.v1.GetWorkloadResponse:
            type: object
            properties:
                workload:
                    type: array
                    items:
                        $ref: '#/components/schemas/insights.dashboard.v1.WorkloadEntry'
                    description: workload is the workload value for this contract.
            required:
                - workload
        insights.dashboard.v1.WorkloadEntry:
            type: object
            properties:
                user_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: user_id identifies the user associated with this request.
                open_tasks:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: open_tasks is the open tasks value for this contract.
                in_progress_tasks:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: in_progress_tasks is the in progress tasks value for this contract.
                completed_tasks:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: completed_tasks is the completed tasks value for this contract.
                overdue_tasks:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: overdue_tasks is the overdue tasks value for this contract.
                total_active:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: total_active is the total active value for this contract.
            required:
                - user_id
                - open_tasks
                - in_progress_tasks
                - completed_tasks
                - overdue_tasks
                - total_active
        insights.dashboard.v1.GetDashboardSummaryRequest:
            type: object
        insights.dashboard.v1.GetDashboardSummaryResponse:
            type: object
            properties:
                revenue:
                    allOf:
                        - $ref: '#/components/schemas/insights.dashboard.v1.InsightsMetricCard'
                    description: revenue is MTD revenue in minor units with delta.
                customers:
                    allOf:
                        - $ref: '#/components/schemas/insights.dashboard.v1.InsightsMetricCard'
                    description: customers is MTD customer count with delta.
                orders:
                    allOf:
                        - $ref: '#/components/schemas/insights.dashboard.v1.InsightsMetricCard'
                    description: orders is MTD order count with delta.
                margin:
                    allOf:
                        - $ref: '#/components/schemas/insights.dashboard.v1.InsightsPctCard'
                    description: margin is MTD margin percentage with delta.
            required:
                - revenue
                - customers
                - orders
                - margin
        insights.dashboard.v1.InsightsMetricCard:
            type: object
            properties:
                value:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: value is the headline metric value.
                delta_pct:
                    type: number
                    format: double
                    description: delta_pct is the period-over-period change percentage.
            required:
                - value
                - delta_pct
        insights.dashboard.v1.InsightsPctCard:
            type: object
            properties:
                value:
                    type: number
                    format: double
                    description: value is the percentage metric value.
                delta_pct:
                    type: number
                    format: double
                    description: delta_pct is the period-over-period change percentage.
            required:
                - value
                - delta_pct
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: DashboardService
      description: DashboardService defines insights dashboard endpoints.
