openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /finance/bill/v1/bills:
        get:
            tags:
                - BillService
            summary: listBills
            operationId: BillService_listBills
            parameters:
                - name: supplier_id
                  in: query
                  required: false
                  schema:
                    type: string
                    format: int64
                    description: |-
                        supplier_id filters to one ERP supplier's bills; absent to include all.
                        Absent supplier links are excluded when this filter is supplied.
                - name: purchase_order_id
                  in: query
                  required: false
                  schema:
                    type: string
                    format: int64
                    description: |-
                        purchase_order_id filters to bills settling one purchase order; absent
                        to include all.
                - name: page
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int64
                - name: page_size
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/finance.bill.v1.ListBillsResponse'
        post:
            tags:
                - BillService
            summary: createBill
            operationId: BillService_createBill
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/finance.bill.v1.CreateBillRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/finance.bill.v1.CreateBillResponse'
    /finance/bill/v1/bills/{id}:
        get:
            tags:
                - BillService
            summary: getBill
            operationId: BillService_getBill
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/finance.bill.v1.GetBillResponse'
        put:
            tags:
                - BillService
            summary: updateBill
            operationId: BillService_updateBill
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/finance.bill.v1.UpdateBillBody'
                            description: body carries updatable bill fields bound from the HTTP payload.
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/finance.bill.v1.UpdateBillResponse'
        delete:
            tags:
                - BillService
            summary: deleteBill
            operationId: BillService_deleteBill
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/finance.bill.v1.DeleteBillResponse'
components:
    schemas:
        finance.bill.v1.ListBillsRequest:
            type: object
            properties:
                supplier_id:
                    type: string
                    format: int64
                    description: |-
                        supplier_id filters to one ERP supplier's bills; absent to include all.
                        Absent supplier links are excluded when this filter is supplied.
                purchase_order_id:
                    type: string
                    format: int64
                    description: |-
                        purchase_order_id filters to bills settling one purchase order; absent
                        to include all.
                page:
                    type: integer
                    format: int64
                page_size:
                    type: integer
                    format: int64
        finance.bill.v1.ListBillsResponse:
            type: object
            properties:
                bills:
                    type: array
                    items:
                        $ref: '#/components/schemas/finance.bill.v1.Bill'
                    description: bills is the bills value for this contract.
                page:
                    type: integer
                    format: int64
                page_size:
                    type: integer
                    format: int64
                has_more:
                    type: boolean
        finance.bill.v1.Bill:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    description: id is the unique identifier for the resource.
                owner_id:
                    type: string
                    format: int64
                    description: owner_id identifies the tenant that owns the resource.
                supplier_id:
                    type: string
                    format: int64
                    description: |-
                        supplier_id is the ERP supplier this bill is owed to; absent on bills
                        entered before suppliers were linked, and on one-off bills for a party
                        with no supplier record. Callers must not invent a value: a bill with no
                        known supplier records none.
                supplier_name:
                    type: string
                    description: |-
                        supplier_name is the supplier's name as it stood when the bill was
                        entered, so a bill list reads correctly without a second request and a
                        renamed supplier does not rewrite history. Required: every bill records
                        who it is owed to, by reference or by snapshot.
                purchase_order_id:
                    type: string
                    format: int64
                    description: |-
                        purchase_order_id is the ERP purchase order this bill settles; absent for
                        bills that did not originate from a purchase order.
                amount:
                    type: number
                    format: double
                    description: amount is the amount value for this contract.
                currency:
                    type: string
                    description: currency is the currency value for this contract.
                due_date:
                    type: string
                    description: due_date is the due date value for this contract.
                status:
                    type: string
                    description: status is the current lifecycle state.
                description:
                    type: string
                    description: description is the description value for this contract.
                created_at:
                    type: string
                    description: created_at is when the record was created.
                updated_at:
                    type: string
                    description: updated_at is when the record was last updated.
            required:
                - supplier_name
            description: Bill is an accounts-payable bill owed to a supplier.
        finance.bill.v1.CreateBillRequest:
            type: object
            properties:
                supplier_id:
                    type: string
                    format: int64
                    description: |-
                        supplier_id is the ERP supplier this bill is owed to. Optional: supply it
                        from ERP's supplier list when the party has a record, and omit it for a
                        one-off bill. Callers must never send a derived or placeholder value.
                supplier_name:
                    type: string
                    description: |-
                        supplier_name is the vendor name as typed or picked at entry time. It is
                        the display snapshot for the bill and must always be present even when
                        supplier_id is set, so history survives a later rename.
                purchase_order_id:
                    type: string
                    format: int64
                    description: |-
                        purchase_order_id links this bill to the ERP purchase order it settles;
                        absent when the bill did not originate from a purchase order. The server
                        must verify the referenced order belongs to the caller's business.
                amount:
                    type: number
                    minimum: 0
                    format: double
                    description: amount is the amount value for this contract.
                currency:
                    type: string
                    description: currency is the currency value for this contract.
                due_date:
                    type: string
                    description: due_date is the due date value for this contract.
                status:
                    type: string
                    description: status is the current lifecycle state.
                description:
                    type: string
                    description: description is the description value for this contract.
            required:
                - supplier_name
                - currency
                - due_date
                - status
                - description
        finance.bill.v1.CreateBillResponse:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    description: id is the unique identifier for the resource.
                message:
                    type: string
                    description: message is a human-readable result message.
        finance.bill.v1.UpdateBillRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: id is the unique identifier for the resource.
                body:
                    allOf:
                        - $ref: '#/components/schemas/finance.bill.v1.UpdateBillBody'
                    description: body carries updatable bill fields bound from the HTTP payload.
        finance.bill.v1.UpdateBillBody:
            type: object
            properties:
                supplier_id:
                    type: string
                    format: int64
                    description: |-
                        supplier_id is the ERP supplier this bill is owed to; absent keeps the
                        stored value, and a one-off bill may clear it by sending nothing here.
                supplier_name:
                    type: string
                    description: supplier_name replaces the vendor snapshot; absent means unchanged.
                purchase_order_id:
                    type: string
                    format: int64
                    description: |-
                        purchase_order_id re-links this bill to an ERP purchase order; absent
                        keeps the stored link.
                amount:
                    type: number
                    minimum: 0
                    format: double
                    description: amount is the amount value for this contract.
                currency:
                    type: string
                    description: currency is the currency value for this contract.
                due_date:
                    type: string
                    description: due_date is the due date value for this contract.
                status:
                    type: string
                    description: status is the current lifecycle state.
                description:
                    type: string
                    description: description is the description value for this contract.
            required:
                - currency
                - due_date
                - status
                - description
        finance.bill.v1.UpdateBillResponse:
            type: object
            properties:
                message:
                    type: string
                    description: message is a human-readable result message.
        finance.bill.v1.GetBillRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
        finance.bill.v1.GetBillResponse:
            type: object
            properties:
                bill:
                    allOf:
                        - $ref: '#/components/schemas/finance.bill.v1.Bill'
        finance.bill.v1.DeleteBillRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
        finance.bill.v1.DeleteBillResponse:
            type: object
            properties:
                message:
                    type: string
