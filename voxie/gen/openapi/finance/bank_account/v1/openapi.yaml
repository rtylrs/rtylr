openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /finance/bank-account/v1/bank-accounts:
        get:
            tags:
                - BankAccountService
            summary: listBankAccounts
            operationId: BankAccountService_listBankAccounts
            parameters:
                - name: page
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                    description: page is the current result page.
                - name: limit
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                    description: limit is the maximum number of records to return.
                - name: sort_by
                  in: query
                  required: true
                  schema:
                    type: string
                    description: sort_by is the field to sort results by.
                - name: sort_dir
                  in: query
                  required: true
                  schema:
                    type: string
                    description: sort_dir is the sort direction ("asc" or "desc").
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/finance.bank_account.v1.ListBankAccountsResponse'
        post:
            tags:
                - BankAccountService
            summary: createBankAccount
            operationId: BankAccountService_createBankAccount
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/finance.bank_account.v1.CreateBankAccountRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/finance.bank_account.v1.CreateBankAccountResponse'
    /finance/bank-account/v1/bank-accounts/{id}:
        get:
            tags:
                - BankAccountService
            summary: getBankAccount
            operationId: BankAccountService_getBankAccount
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/finance.bank_account.v1.GetBankAccountResponse'
components:
    schemas:
        finance.bank_account.v1.ListBankAccountsRequest:
            type: object
            properties:
                page:
                    type: integer
                    format: int32
                    description: page is the current result page.
                limit:
                    type: integer
                    format: int32
                    description: limit is the maximum number of records to return.
                sort_by:
                    type: string
                    description: sort_by is the field to sort results by.
                sort_dir:
                    type: string
                    description: sort_dir is the sort direction ("asc" or "desc").
        finance.bank_account.v1.ListBankAccountsResponse:
            type: object
            properties:
                accounts:
                    type: array
                    items:
                        $ref: '#/components/schemas/finance.bank_account.v1.BankAccount'
                    description: accounts is the accounts value for this contract.
                pagination:
                    allOf:
                        - $ref: '#/components/schemas/common.pagination.v1.PaginationResponse'
                    description: pagination is the pagination value for this contract.
        finance.bank_account.v1.BankAccount:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    description: id is the unique identifier for the resource.
                name:
                    type: string
                    description: name is the name value for this contract.
                bank_name:
                    type: string
                    description: bank_name is the bank name value for this contract.
                account_type:
                    type: string
                    description: |-
                        account_type is the account type value for this contract.
                        checking, savings
                last_four:
                    type: string
                    description: last_four is the last four value for this contract.
                balance:
                    type: number
                    format: double
                    description: balance is the balance value for this contract.
                currency:
                    type: string
                    description: currency is the currency value for this contract.
                is_primary:
                    type: boolean
                    description: is_primary is the is primary value for this contract.
                created_at:
                    type: string
                    description: created_at is when the record was created.
            description: BankAccount is a business's linked bank account.
        common.pagination.v1.PaginationResponse:
            type: object
            properties:
                page:
                    type: integer
                    format: int32
                    description: page is the current result page.
                limit:
                    type: integer
                    format: int32
                    description: limit is the maximum number of records to return.
                total:
                    type: integer
                    format: int32
                    description: total is the total number of matching records.
                total_pages:
                    type: integer
                    format: int32
                    description: total_pages is the total pages value for this contract.
                has_next:
                    type: boolean
                    description: has_next is the has next value for this contract.
                has_prev:
                    type: boolean
                    description: has_prev is the has prev value for this contract.
            description: Standard pagination response metadata.
        finance.bank_account.v1.CreateBankAccountRequest:
            type: object
            properties:
                name:
                    type: string
                    description: name is the name value for this contract.
                bank_name:
                    type: string
                    description: bank_name is the bank name value for this contract.
                account_type:
                    type: string
                    description: account_type is the account type value for this contract.
                last_four:
                    type: string
                    description: last_four is the last four value for this contract.
                balance:
                    type: number
                    minimum: 0
                    format: double
                    description: balance is the balance value for this contract.
                currency:
                    type: string
                    description: currency is the currency value for this contract.
                is_primary:
                    type: boolean
                    description: is_primary is the is primary value for this contract.
            required:
                - name
                - bank_name
                - account_type
                - last_four
                - balance
                - currency
        finance.bank_account.v1.CreateBankAccountResponse:
            type: object
            properties:
                account:
                    allOf:
                        - $ref: '#/components/schemas/finance.bank_account.v1.BankAccount'
                    description: account is the account value for this contract.
        finance.bank_account.v1.GetBankAccountRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: id is the unique identifier for the resource.
        finance.bank_account.v1.GetBankAccountResponse:
            type: object
            properties:
                account:
                    allOf:
                        - $ref: '#/components/schemas/finance.bank_account.v1.BankAccount'
                    description: account is the account value for this contract.
