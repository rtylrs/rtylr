openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /finance/expenses/v1/expenses:
        get:
            tags:
                - ExpensesService
            summary: listExpenses
            operationId: ExpensesService_listExpenses
            parameters:
                - name: page
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int64
                - name: page_size
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/finance.expenses.v1.ListExpensesResponse'
        post:
            tags:
                - ExpensesService
            summary: createExpense
            operationId: ExpensesService_createExpense
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/finance.expenses.v1.CreateExpenseRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/finance.expenses.v1.CreateExpenseResponse'
    /finance/expenses/v1/expenses/{id}:
        get:
            tags:
                - ExpensesService
            summary: getExpense
            operationId: ExpensesService_getExpense
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/finance.expenses.v1.GetExpenseResponse'
        put:
            tags:
                - ExpensesService
            summary: updateExpense
            operationId: ExpensesService_updateExpense
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/finance.expenses.v1.UpdateExpenseBody'
                            description: body carries updatable expense fields bound from the HTTP payload.
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/finance.expenses.v1.UpdateExpenseResponse'
        delete:
            tags:
                - ExpensesService
            summary: deleteExpense
            operationId: ExpensesService_deleteExpense
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/finance.expenses.v1.DeleteExpenseResponse'
    /finance/expenses/v1/expenses/{id}/status:
        patch:
            tags:
                - ExpensesService
            summary: updateExpenseStatus
            operationId: ExpensesService_updateExpenseStatus
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/finance.expenses.v1.UpdateExpenseStatusBody'
                            description: body carries status update fields bound from the HTTP payload.
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/finance.expenses.v1.UpdateExpenseStatusResponse'
    /finance/expenses/v1/categories:
        get:
            tags:
                - ExpensesService
            summary: listExpenseCategories
            operationId: ExpensesService_listExpenseCategories
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/finance.expenses.v1.ListExpenseCategoriesResponse'
components:
    schemas:
        finance.expenses.v1.ListExpensesRequest:
            type: object
            properties:
                page:
                    type: integer
                    format: int64
                page_size:
                    type: integer
                    format: int64
        finance.expenses.v1.ListExpensesResponse:
            type: object
            properties:
                expenses:
                    type: array
                    items:
                        $ref: '#/components/schemas/finance.expenses.v1.Expense'
                    description: expenses is the expenses value for this contract.
                page:
                    type: integer
                    format: int64
                page_size:
                    type: integer
                    format: int64
                has_more:
                    type: boolean
        finance.expenses.v1.Expense:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    description: id is the unique identifier for the resource.
                owner_id:
                    type: string
                    format: int64
                    description: owner_id identifies the tenant that owns the resource.
                category_id:
                    type: string
                    format: int64
                    description: category_id is the category id value for this contract.
                amount:
                    type: number
                    format: double
                    description: amount is the amount value for this contract.
                currency:
                    type: string
                    description: currency is the currency value for this contract.
                description:
                    type: string
                    description: description is the description value for this contract.
                vendor:
                    type: string
                    description: vendor is the vendor value for this contract.
                receipt_url:
                    type: string
                    description: receipt_url is the receipt url value for this contract.
                payment_method:
                    type: string
                    description: payment_method is the canonical payment method for accounting.
                is_tax_deductible:
                    type: boolean
                    description: is_tax_deductible indicates whether the expense is tax deductible.
                tax_amount:
                    type: number
                    format: double
                    description: tax_amount is the tax amount recorded for the expense.
                notes:
                    type: string
                    description: notes contains accounting notes for the expense.
                expense_date:
                    type: string
                    description: expense_date is the expense date value for this contract.
                status:
                    type: string
                    description: status is the current lifecycle state.
                created_at:
                    type: string
                    description: created_at is when the record was created.
                updated_at:
                    type: string
                    description: updated_at is when the record was last updated.
            description: Expense is a recorded business expense.
        finance.expenses.v1.CreateExpenseRequest:
            type: object
            properties:
                category_id:
                    type: string
                    format: int64
                    description: category_id is the category id value for this contract.
                amount:
                    type: number
                    minimum: 0
                    format: double
                    description: amount is the amount value for this contract.
                currency:
                    type: string
                    description: currency is the currency value for this contract.
                description:
                    type: string
                    description: description is the description value for this contract.
                vendor:
                    type: string
                    description: vendor is the vendor value for this contract.
                receipt_url:
                    type: string
                    description: receipt_url is the receipt url value for this contract.
                payment_method:
                    type: string
                    description: payment_method is the canonical payment method for accounting.
                is_tax_deductible:
                    type: boolean
                    description: is_tax_deductible indicates whether the expense is tax deductible.
                tax_amount:
                    type: number
                    format: double
                    description: tax_amount is the tax amount recorded for the expense.
                notes:
                    type: string
                    description: notes contains accounting notes for the expense.
                expense_date:
                    type: string
                    description: expense_date is the expense date value for this contract.
            required:
                - currency
                - description
                - vendor
                - receipt_url
                - expense_date
        finance.expenses.v1.CreateExpenseResponse:
            type: object
            properties:
                expense_id:
                    type: string
                    format: int64
                    description: expense_id is the expense id value for this contract.
                message:
                    type: string
                    description: message is a human-readable result message.
        finance.expenses.v1.UpdateExpenseRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: id is the unique identifier for the expense.
                body:
                    allOf:
                        - $ref: '#/components/schemas/finance.expenses.v1.UpdateExpenseBody'
                    description: body carries updatable expense fields bound from the HTTP payload.
        finance.expenses.v1.UpdateExpenseBody:
            type: object
            properties:
                category_id:
                    type: string
                    format: int64
                    description: category_id is the category id value for this contract.
                amount:
                    type: number
                    minimum: 0
                    format: double
                    description: amount is the amount value for this contract.
                currency:
                    type: string
                    description: currency is the currency value for this contract.
                description:
                    type: string
                    description: description is the description value for this contract.
                vendor:
                    type: string
                    description: vendor is the vendor value for this contract.
                receipt_url:
                    type: string
                    description: receipt_url is the receipt url value for this contract.
                payment_method:
                    type: string
                    description: payment_method is the canonical payment method for accounting.
                is_tax_deductible:
                    type: boolean
                    description: is_tax_deductible indicates whether the expense is tax deductible.
                tax_amount:
                    type: number
                    format: double
                    description: tax_amount is the tax amount recorded for the expense.
                notes:
                    type: string
                    description: notes contains accounting notes for the expense.
                expense_date:
                    type: string
                    description: expense_date is the expense date value for this contract.
            required:
                - currency
                - description
                - vendor
                - receipt_url
                - expense_date
        finance.expenses.v1.UpdateExpenseResponse:
            type: object
            properties:
                message:
                    type: string
                    description: message is a human-readable result message.
        finance.expenses.v1.DeleteExpenseRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: id is the unique identifier for the expense.
        finance.expenses.v1.DeleteExpenseResponse:
            type: object
            properties:
                message:
                    type: string
                    description: message is a human-readable result message.
        finance.expenses.v1.GetExpenseRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: id is the unique identifier for the resource.
        finance.expenses.v1.GetExpenseResponse:
            type: object
            properties:
                expense:
                    allOf:
                        - $ref: '#/components/schemas/finance.expenses.v1.Expense'
                    description: expense is the expense value for this contract.
        finance.expenses.v1.UpdateExpenseStatusRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: id is the unique identifier for the resource.
                body:
                    allOf:
                        - $ref: '#/components/schemas/finance.expenses.v1.UpdateExpenseStatusBody'
                    description: body carries status update fields bound from the HTTP payload.
        finance.expenses.v1.UpdateExpenseStatusBody:
            type: object
            properties:
                status:
                    type: string
                    description: status is the current lifecycle state - "pending", "approved", or "rejected".
            required:
                - status
        finance.expenses.v1.UpdateExpenseStatusResponse:
            type: object
            properties:
                message:
                    type: string
                    description: message is a human-readable result message.
        finance.expenses.v1.ListExpenseCategoriesRequest:
            type: object
        finance.expenses.v1.ListExpenseCategoriesResponse:
            type: object
            properties:
                categories:
                    type: array
                    items:
                        $ref: '#/components/schemas/finance.expenses.v1.ExpenseCategory'
                    description: categories is the categories value for this contract.
        finance.expenses.v1.ExpenseCategory:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    description: id is the unique identifier for the resource.
                owner_id:
                    type: string
                    format: int64
                    description: owner_id identifies the tenant that owns the resource.
                name:
                    type: string
                    description: name is the name value for this contract.
                color:
                    type: string
                    description: color is the color value for this contract.
                created_at:
                    type: string
                    description: created_at is when the record was created.
            description: ExpenseCategory groups expenses for reporting.
