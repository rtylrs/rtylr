openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /hub/team/permissions/v1/permissions/{user_id}:
        put:
            tags:
                - PermissionsService
            summary: updatePermissions
            description: Assigns apps and role for a team member.
            operationId: PermissionsService_updatePermissions
            parameters:
                - name: user_id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hub.team.permissions.v1.UpdatePermissionsRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.team.permissions.v1.UpdatePermissionsResponse'
components:
    schemas:
        hub.team.permissions.v1.UpdatePermissionsRequest:
            type: object
            properties:
                user_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                apps:
                    type: array
                    items:
                        type: string
                role:
                    type: string
                full_name:
                    type: string
                dash_role:
                    type: string
                    description: Independent Dash role assignment.
                app_assignments:
                    type: array
                    items:
                        $ref: '#/components/schemas/hub.user.v1.AppRoleAssignment'
                    description: Independent application role assignments.
                group_ids:
                    type: array
                    items:
                        type: string
                        format: int64
                    description: Groups that provide inherited access.
            required:
                - user_id
                - apps
                - app_assignments
                - group_ids
        hub.user.v1.AppRoleAssignment:
            type: object
            properties:
                app_id:
                    type: string
                    description: Application receiving the role assignment.
                role_ids:
                    type: array
                    items:
                        type: string
                    description: Canonical role identifiers.
                primary_role_id:
                    type: string
                    description: Primary display role identifier.
                assignment_source:
                    type: string
                    description: Server-owned assignment source.
                status:
                    type: string
                    description: Assignment lifecycle status.
                scopes:
                    type: array
                    items:
                        $ref: '#/components/schemas/hub.user.v1.RoleScope'
                    description: Resource scopes attached to the assignment.
                group_id:
                    type: string
                    description: Group target when the assignment is group-derived.
            required:
                - app_id
                - role_ids
                - assignment_source
                - status
                - scopes
        hub.user.v1.RoleScope:
            type: object
            properties:
                scope_type:
                    type: string
                    description: Scope resource type, such as location, department, or project.
                scope_id:
                    type: string
                    description: Tenant-owned resource identifier.
            required:
                - scope_type
                - scope_id
        hub.team.permissions.v1.UpdatePermissionsResponse:
            type: object
            properties:
                effective_access:
                    allOf:
                        - $ref: '#/components/schemas/hub.user.v1.EffectiveAccess'
                    description: Effective access after the update.
        hub.user.v1.EffectiveAccess:
            type: object
            properties:
                business_id:
                    type: string
                    description: Active business scope for this authorization snapshot.
                dash_role:
                    type: string
                    description: Effective Dash role key.
                dash_role_id:
                    type: string
                    description: Effective Dash role identifier.
                dash_permissions:
                    type: array
                    items:
                        type: string
                    description: Effective Dash permission keys.
                subscribed_apps:
                    type: array
                    items:
                        type: string
                    description: Business applications subscribed for this snapshot.
                licenses:
                    type: array
                    items:
                        $ref: '#/components/schemas/hub.user.v1.LicenseAssignment'
                    description: Active and historical license assignments.
                apps:
                    type: array
                    items:
                        $ref: '#/components/schemas/hub.user.v1.EffectiveAppAccess'
                    description: Effective application access entries.
                is_owner:
                    type: boolean
                    description: Whether the user is the business owner.
                is_admin:
                    type: boolean
                    description: Whether the user has the Dash Admin override.
                authorization_version:
                    type: string
                    format: int64
                    description: Monotonic authorization version for cache refresh.
            required:
                - business_id
                - dash_permissions
                - subscribed_apps
                - licenses
                - apps
                - is_owner
                - is_admin
                - authorization_version
        hub.user.v1.LicenseAssignment:
            type: object
            properties:
                app_id:
                    type: string
                    description: Licensed application identifier.
                status:
                    type: string
                    description: License lifecycle status.
                assignment_source:
                    type: string
                    description: Server-owned license source.
                group_id:
                    type: string
                    description: Group target when the license is group-derived.
                granted_at:
                    type: string
                    description: Time the license was granted.
                revoked_at:
                    type: string
                    description: Time the license was revoked, when revoked.
            required:
                - app_id
                - status
                - assignment_source
                - granted_at
        hub.user.v1.EffectiveAppAccess:
            type: object
            properties:
                app_id:
                    type: string
                    description: Application represented by this access entry.
                licensed:
                    type: boolean
                    description: Whether an active user or group license exists.
                has_access:
                    type: boolean
                    description: Whether the user has an active role assignment.
                role_ids:
                    type: array
                    items:
                        type: string
                    description: Effective canonical role identifiers.
                primary_role_id:
                    type: string
                    description: Primary role used for display and app entry.
                display_role:
                    type: string
                    description: Server-resolved display role.
                permissions:
                    type: array
                    items:
                        type: string
                    description: Effective permission keys for this application.
                scopes:
                    type: array
                    items:
                        $ref: '#/components/schemas/hub.user.v1.RoleScope'
                    description: Resource scopes attached to effective assignments.
                sources:
                    type: array
                    items:
                        type: string
                    description: Sources contributing to effective access.
                permission_sources:
                    type: object
                    additionalProperties:
                        type: string
                    description: Permission-to-role source explanation.
            required:
                - app_id
                - licensed
                - has_access
                - role_ids
                - permissions
                - scopes
                - sources
                - permission_sources
