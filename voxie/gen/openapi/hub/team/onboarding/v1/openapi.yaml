openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /hub/team/onboarding/v1/onboarded:
        patch:
            tags:
                - OnboardingService
            summary: markOnboarded
            description: Marks the current user as onboarded.
            operationId: OnboardingService_markOnboarded
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hub.team.onboarding.v1.MarkOnboardedRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.team.onboarding.v1.MarkOnboardedResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        hub.team.onboarding.v1.MarkOnboardedRequest:
            type: object
        hub.team.onboarding.v1.MarkOnboardedResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: OnboardingService
      description: OnboardingService defines hub team onboarding endpoints.
