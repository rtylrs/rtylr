openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /hub/team/access/v1/requests:
        get:
            tags:
                - AccessService
            summary: listAccessRequests
            description: Returns pending access requests for the business.
            operationId: AccessService_listAccessRequests
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.team.access.v1.ListAccessRequestsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        post:
            tags:
                - AccessService
            summary: requestAccess
            description: Submits a request for app access.
            operationId: AccessService_requestAccess
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hub.team.access.v1.RequestAccessRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.team.access.v1.RequestAccessResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /hub/team/access/v1/requests/{id}/approve:
        post:
            tags:
                - AccessService
            summary: approveAccessRequest
            description: Grants the requested app access.
            operationId: AccessService_approveAccessRequest
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                user_id:
                                    exclusiveMinimum: 0
                                    type: string
                                    pattern: ^-?[0-9]+$
                                    format: int64
                                    description: Identifies the user being granted access.
                                app:
                                    type: string
                                role_ids:
                                    type: array
                                    items:
                                        type: string
                                    description: Approved normalized role identifiers.
                                scopes:
                                    type: array
                                    items:
                                        $ref: '#/components/schemas/hub.user.v1.RoleScope'
                                    description: Approved resource scopes.
                            required:
                                - user_id
                                - app
                                - role_ids
                                - scopes
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.team.access.v1.ApproveAccessRequestResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        hub.team.access.v1.RequestAccessRequest:
            type: object
            properties:
                app:
                    type: string
                role_ids:
                    type: array
                    items:
                        type: string
                    description: Requested normalized role identifiers.
                scopes:
                    type: array
                    items:
                        $ref: '#/components/schemas/hub.user.v1.RoleScope'
                    description: Requested resource scopes.
                reason:
                    type: string
                    description: Optional business reason for the request.
            required:
                - app
                - role_ids
                - scopes
        hub.user.v1.RoleScope:
            type: object
            properties:
                scope_type:
                    type: string
                    description: Scope resource type, such as location, department, or project.
                scope_id:
                    type: string
                    description: Tenant-owned resource identifier.
            required:
                - scope_type
                - scope_id
        hub.team.access.v1.RequestAccessResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        hub.team.access.v1.ListAccessRequestsRequest:
            type: object
        hub.team.access.v1.ListAccessRequestsResponse:
            type: object
            properties:
                requests:
                    type: array
                    items:
                        $ref: '#/components/schemas/hub.team.access.v1.AccessRequest'
            required:
                - requests
        hub.team.access.v1.AccessRequest:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                user_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: Identifies the user who requested access.
                app:
                    type: string
                role_ids:
                    type: array
                    items:
                        type: string
                    description: Requested normalized role identifiers.
                scopes:
                    type: array
                    items:
                        $ref: '#/components/schemas/hub.user.v1.RoleScope'
                    description: Requested resource scopes.
                reason:
                    type: string
                    description: Optional business reason for the request.
                status:
                    type: string
                    description: Current request lifecycle status.
                approver_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: User who approved the request, when approved.
                approved_at:
                    type: string
                    description: Approval timestamp, when approved.
                requester_name:
                    type: string
                requester_email:
                    type: string
                created_at:
                    type: string
                    description: When the record was created.
            required:
                - id
                - user_id
                - app
                - role_ids
                - scopes
                - status
                - requester_name
                - requester_email
                - created_at
        hub.team.access.v1.ApproveAccessRequestRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                user_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: Identifies the user being granted access.
                app:
                    type: string
                role_ids:
                    type: array
                    items:
                        type: string
                    description: Approved normalized role identifiers.
                scopes:
                    type: array
                    items:
                        $ref: '#/components/schemas/hub.user.v1.RoleScope'
                    description: Approved resource scopes.
            required:
                - id
                - user_id
                - app
                - role_ids
                - scopes
        hub.team.access.v1.ApproveAccessRequestResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: AccessService
      description: AccessService defines hub team access request endpoints.
