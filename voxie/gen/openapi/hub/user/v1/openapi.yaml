openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /hub/user/v1/users/me:
        get:
            tags:
                - UserService
            summary: getMe
            description: Returns the authenticated user profile.
            operationId: UserService_getMe
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.user.v1.GetMeResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        patch:
            tags:
                - UserService
            summary: updateProfile
            description: Updates the authenticated user profile.
            operationId: UserService_updateProfile
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hub.user.v1.UpdateProfileRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.user.v1.UpdateProfileResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /hub/user/v1/users/password:
        post:
            tags:
                - UserService
            summary: changePassword
            description: Changes the authenticated user password.
            operationId: UserService_changePassword
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hub.user.v1.ChangePasswordRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.user.v1.ChangePasswordResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /hub/user/v1/users/switch-business:
        post:
            tags:
                - UserService
            summary: switchBusiness
            description: Issues a fresh JWT scoped to the selected business.
            operationId: UserService_switchBusiness
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hub.user.v1.SwitchBusinessRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.user.v1.SwitchBusinessResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        hub.user.v1.GetMeRequest:
            type: object
        hub.user.v1.GetMeResponse:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                email:
                    type: string
                    description: Email address used for lookup or contact.
                full_name:
                    type: string
                apps:
                    type: array
                    items:
                        type: string
                role:
                    type: string
                business_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                business_name:
                    type: string
                is_owner:
                    type: boolean
                is_console_admin:
                    type: boolean
                    description: is_console_admin indicates the user can access the internal console.
                onboarded:
                    type: boolean
                dash_role:
                    type: string
                    description: Effective Dash role for the active business.
                effective_access:
                    allOf:
                        - $ref: '#/components/schemas/hub.user.v1.EffectiveAccess'
                    description: Server-resolved authorization snapshot.
                provisioning_status:
                    allOf:
                        - $ref: '#/components/schemas/hub.user.v1.ProvisioningStatus'
                    description: Account provisioning and security state.
            required:
                - id
                - email
                - full_name
                - apps
                - role
                - business_id
                - business_name
                - is_owner
                - is_console_admin
                - onboarded
        hub.user.v1.EffectiveAccess:
            type: object
            properties:
                business_id:
                    type: string
                    description: Active business scope for this authorization snapshot.
                dash_role:
                    type: string
                    description: Effective Dash role key.
                dash_role_id:
                    type: string
                    description: Effective Dash role identifier.
                dash_permissions:
                    type: array
                    items:
                        type: string
                    description: Effective Dash permission keys.
                subscribed_apps:
                    type: array
                    items:
                        type: string
                    description: Business applications subscribed for this snapshot.
                licenses:
                    type: array
                    items:
                        $ref: '#/components/schemas/hub.user.v1.LicenseAssignment'
                    description: Active and historical license assignments.
                apps:
                    type: array
                    items:
                        $ref: '#/components/schemas/hub.user.v1.EffectiveAppAccess'
                    description: Effective application access entries.
                is_owner:
                    type: boolean
                    description: Whether the user is the business owner.
                is_admin:
                    type: boolean
                    description: Whether the user has the Dash Admin override.
                authorization_version:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: Monotonic authorization version for cache refresh.
            required:
                - business_id
                - dash_permissions
                - subscribed_apps
                - licenses
                - apps
                - is_owner
                - is_admin
                - authorization_version
        hub.user.v1.LicenseAssignment:
            type: object
            properties:
                app_id:
                    type: string
                    description: Licensed application identifier.
                status:
                    type: string
                    description: License lifecycle status.
                assignment_source:
                    type: string
                    description: Server-owned license source.
                group_id:
                    type: string
                    description: Group target when the license is group-derived.
                granted_at:
                    type: string
                    description: Time the license was granted.
                revoked_at:
                    type: string
                    description: Time the license was revoked, when revoked.
            required:
                - app_id
                - status
                - assignment_source
                - granted_at
        hub.user.v1.EffectiveAppAccess:
            type: object
            properties:
                app_id:
                    type: string
                    description: Application represented by this access entry.
                licensed:
                    type: boolean
                    description: Whether an active user or group license exists.
                has_access:
                    type: boolean
                    description: Whether the user has an active role assignment.
                role_ids:
                    type: array
                    items:
                        type: string
                    description: Effective canonical role identifiers.
                primary_role_id:
                    type: string
                    description: Primary role used for display and app entry.
                display_role:
                    type: string
                    description: Server-resolved display role.
                permissions:
                    type: array
                    items:
                        type: string
                    description: Effective permission keys for this application.
                scopes:
                    type: array
                    items:
                        $ref: '#/components/schemas/hub.user.v1.RoleScope'
                    description: Resource scopes attached to effective assignments.
                sources:
                    type: array
                    items:
                        type: string
                    description: Sources contributing to effective access.
                permission_sources:
                    type: object
                    additionalProperties:
                        type: string
                    description: Permission-to-role source explanation.
            required:
                - app_id
                - licensed
                - has_access
                - role_ids
                - permissions
                - scopes
                - sources
                - permission_sources
        hub.user.v1.RoleScope:
            type: object
            properties:
                scope_type:
                    type: string
                    description: Scope resource type, such as location, department, or project.
                scope_id:
                    type: string
                    description: Tenant-owned resource identifier.
            required:
                - scope_type
                - scope_id
        hub.user.v1.ProvisioningStatus:
            type: object
            properties:
                mode:
                    type: string
                    description: Provisioning mode used for the account.
                state:
                    type: string
                    description: Current provisioning lifecycle state.
                email_verified:
                    type: boolean
                    description: Whether the work email is verified.
                password_change_required:
                    type: boolean
                    description: Whether a first-login password change is required.
                mfa_required:
                    type: boolean
                    description: Whether MFA is required before sensitive access.
                mfa_enrolled:
                    type: boolean
                    description: Whether MFA enrollment is complete.
                mfa_verified:
                    type: boolean
                    description: Whether the current MFA verification window is valid.
                recovery_available:
                    type: boolean
                    description: Whether account recovery is available.
        hub.user.v1.UpdateProfileRequest:
            type: object
            properties:
                name:
                    type: string
                email:
                    type: string
                    format: email
                    description: Reserved for future profile email changes.
            required:
                - name
        hub.user.v1.UpdateProfileResponse:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/hub.user.v1.GetMeResponse'
            required:
                - user
        hub.user.v1.ChangePasswordRequest:
            type: object
            properties:
                current_password:
                    type: string
                new_password:
                    type: string
            required:
                - current_password
                - new_password
        hub.user.v1.ChangePasswordResponse:
            type: object
        hub.user.v1.SwitchBusinessRequest:
            type: object
            properties:
                business_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: Business to activate in the current session.
            required:
                - business_id
        hub.user.v1.SwitchBusinessResponse:
            type: object
            properties:
                token:
                    type: string
                    description: Fresh JWT scoped to the selected business.
            required:
                - token
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: UserService
      description: UserService defines hub user profile endpoints.
