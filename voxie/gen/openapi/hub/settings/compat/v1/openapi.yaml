openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /hub/settings/email/test:
        post:
            tags:
                - CompatibilityService
            summary: testEmail
            operationId: CompatibilityService_testEmail
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/hub.settings.compat.v1.TestEmailBody'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.settings.compat.v1.TestEmailResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        hub.settings.compat.v1.TestEmailRequest:
            type: object
            properties:
                body:
                    allOf:
                        - $ref: '#/components/schemas/hub.settings.compat.v1.TestEmailBody'
            required:
                - body
        hub.settings.compat.v1.TestEmailBody:
            type: object
            properties:
                host:
                    type: string
                port:
                    type: integer
                    format: int32
                username:
                    type: string
            required:
                - host
                - port
                - username
        hub.settings.compat.v1.TestEmailResponse: {}
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: CompatibilityService
      description: Compatibility contract for the SMTP connection test used by Dash.
