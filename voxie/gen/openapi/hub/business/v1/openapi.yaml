openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /hub/business/v1/businesses/mine:
        get:
            tags:
                - BusinessService
            summary: listMyBusinesses
            description: Returns the businesses owned by the current user.
            operationId: BusinessService_listMyBusinesses
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.business.v1.ListMyBusinessesResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /hub/business/v1/businesses:
        post:
            tags:
                - BusinessService
            summary: createSubBusiness
            description: Creates a sub-business under a parent business.
            operationId: BusinessService_createSubBusiness
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hub.business.v1.CreateSubBusinessRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.business.v1.CreateSubBusinessResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /hub/business/v1/businesses/onboard:
        post:
            tags:
                - BusinessService
            summary: onboardBusiness
            description: Creates the owner's first business during onboarding.
            operationId: BusinessService_onboardBusiness
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hub.business.v1.OnboardBusinessRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.business.v1.OnboardBusinessResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /hub/business/v1/businesses/name-exists:
        get:
            tags:
                - BusinessService
            summary: checkBusinessNameExists
            description: Probes whether a business name is already taken.
            operationId: BusinessService_checkBusinessNameExists
            parameters:
                - name: name
                  in: query
                  required: true
                  schema:
                    type: string
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.business.v1.CheckBusinessNameExistsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /hub/business/v1/businesses/{business_id}:
        get:
            tags:
                - BusinessService
            summary: getBusiness
            description: Returns a business by ID.
            operationId: BusinessService_getBusiness
            parameters:
                - name: business_id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.business.v1.GetBusinessResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        put:
            tags:
                - BusinessService
            summary: updateBusiness
            description: Updates an existing business.
            operationId: BusinessService_updateBusiness
            parameters:
                - name: business_id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
                                type:
                                    type: string
                                address:
                                    type: string
                                phone:
                                    type: string
                                email:
                                    type: string
                                    format: email
                                website:
                                    type: string
                                timezone:
                                    type: string
                                currency:
                                    type: string
                                slug:
                                    type: string
                            required:
                                - name
                                - type
                                - address
                                - phone
                                - email
                                - website
                                - timezone
                                - currency
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.business.v1.UpdateBusinessResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        delete:
            tags:
                - BusinessService
            summary: deleteBusiness
            description: Removes an active business owned by the current user.
            operationId: BusinessService_deleteBusiness
            parameters:
                - name: business_id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.business.v1.DeleteBusinessResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /hub/business/v1/businesses/by-slug:
        get:
            tags:
                - BusinessService
            summary: lookupBusinessBySlug
            description: Resolves a business by public slug.
            operationId: BusinessService_lookupBusinessBySlug
            parameters:
                - name: slug
                  in: query
                  required: true
                  schema:
                    type: string
                    pattern: ^[a-z0-9]$|^[a-z0-9][a-z0-9-]{0,78}[a-z0-9]$
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.business.v1.LookupBusinessBySlugResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /hub/business/v1/businesses/public:
        get:
            tags:
                - BusinessService
            summary: getPublicBusiness
            description: Returns public-safe business branding for anonymous menu surfaces.
            operationId: BusinessService_getPublicBusiness
            parameters:
                - name: business_id
                  in: query
                  required: false
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.business.v1.GetPublicBusinessResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /hub/business/v1/businesses/slug:
        patch:
            tags:
                - BusinessService
            summary: setSlug
            description: Updates only the business slug.
            operationId: BusinessService_setSlug
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hub.business.v1.SetSlugRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.business.v1.SetSlugResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /hub/business/v1/businesses/{business_id}/name:
        patch:
            tags:
                - BusinessService
            summary: renameBusiness
            description: Renames an active business owned by the current user.
            operationId: BusinessService_renameBusiness
            parameters:
                - name: business_id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
                            required:
                                - name
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.business.v1.RenameBusinessResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /hub/business/v1/businesses/{business_id}/logo:
        patch:
            tags:
                - BusinessService
            summary: setLogo
            description: Sets the logo for an active business owned by the current user.
            operationId: BusinessService_setLogo
            parameters:
                - name: business_id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                logo_url:
                                    type: string
                                    description: Public URL of an already-uploaded asset (see @voxire/api uploadAsset).
                            required:
                                - logo_url
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.business.v1.SetLogoResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        hub.business.v1.ListMyBusinessesRequest:
            type: object
        hub.business.v1.ListMyBusinessesResponse:
            type: object
            properties:
                businesses:
                    type: array
                    items:
                        $ref: '#/components/schemas/hub.business.v1.BusinessEntry'
            required:
                - businesses
        hub.business.v1.BusinessEntry:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                logo_url:
                    type: string
                parent_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: Identifies the parent business, zero for top-level businesses.
                is_active:
                    type: boolean
                is_owned:
                    type: boolean
                    description: True when the current user owns the business; false for team access.
            required:
                - id
                - name
                - logo_url
                - parent_id
                - is_active
                - is_owned
            description: BusinessEntry is a compact business row for ownership listings.
        hub.business.v1.CreateSubBusinessRequest:
            type: object
            properties:
                name:
                    type: string
                parent_business_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - name
                - parent_business_id
        hub.business.v1.CreateSubBusinessResponse:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - id
        hub.business.v1.OnboardBusinessRequest:
            type: object
            properties:
                name:
                    type: string
                    description: The first business name created during owner onboarding.
            required:
                - name
        hub.business.v1.OnboardBusinessResponse:
            type: object
            properties:
                token:
                    type: string
                    description: A fresh JWT carrying the new business_id.
            required:
                - token
        hub.business.v1.CheckBusinessNameExistsRequest:
            type: object
            properties:
                name:
                    type: string
            required:
                - name
        hub.business.v1.CheckBusinessNameExistsResponse:
            type: object
            properties:
                exists:
                    type: boolean
            required:
                - exists
        hub.business.v1.GetBusinessRequest:
            type: object
            properties:
                business_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - business_id
        hub.business.v1.GetBusinessResponse:
            type: object
            properties:
                business:
                    allOf:
                        - $ref: '#/components/schemas/hub.business.v1.Business'
            required:
                - business
        hub.business.v1.Business:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                type:
                    type: string
                    description: restaurant, retail, services, etc.
                logo_url:
                    type: string
                address:
                    type: string
                phone:
                    type: string
                email:
                    type: string
                    description: Email address used for lookup or contact.
                website:
                    type: string
                timezone:
                    type: string
                currency:
                    type: string
                country:
                    type: string
                plan:
                    type: string
                created_at:
                    type: string
                    description: When the record was created.
                slug:
                    type: string
                    description: URL-safe slug. Powers public surfaces like menu.rtylr.com/<slug>.
            required:
                - id
                - name
                - type
                - logo_url
                - address
                - phone
                - email
                - website
                - timezone
                - currency
                - country
                - plan
                - created_at
                - slug
            description: Business is a merchant's top-level business entity.
        hub.business.v1.LookupBusinessBySlugRequest:
            type: object
            properties:
                slug:
                    type: string
                    pattern: ^[a-z0-9]$|^[a-z0-9][a-z0-9-]{0,78}[a-z0-9]$
            required:
                - slug
        hub.business.v1.LookupBusinessBySlugResponse:
            type: object
            properties:
                business:
                    allOf:
                        - $ref: '#/components/schemas/hub.business.v1.PublicBusinessSummary'
                locations:
                    type: array
                    items:
                        $ref: '#/components/schemas/hub.business.v1.PublicLocation'
            required:
                - business
                - locations
        hub.business.v1.PublicBusinessSummary:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                slug:
                    type: string
                logo_url:
                    type: string
                currency:
                    type: string
                type:
                    type: string
                timezone:
                    type: string
            required:
                - id
                - name
                - slug
                - logo_url
                - currency
                - type
                - timezone
            description: PublicBusinessSummary resolves a public slug into a business summary.
        hub.business.v1.PublicLocation:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                slug:
                    type: string
                address:
                    type: string
                timezone:
                    type: string
                is_active:
                    type: boolean
            required:
                - id
                - name
                - slug
                - address
                - timezone
                - is_active
            description: PublicLocation is a location entry for public menu surfaces.
        hub.business.v1.GetPublicBusinessRequest:
            type: object
            properties:
                business_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - business_id
        hub.business.v1.GetPublicBusinessResponse:
            type: object
            properties:
                business:
                    allOf:
                        - $ref: '#/components/schemas/hub.business.v1.PublicBusinessProfile'
            required:
                - business
        hub.business.v1.PublicBusinessProfile:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                logo_url:
                    type: string
                currency:
                    type: string
                timezone:
                    type: string
            required:
                - id
                - name
                - logo_url
                - currency
                - timezone
            description: PublicBusinessProfile is public-safe business branding for anonymous menu surfaces.
        hub.business.v1.SetSlugRequest:
            type: object
            properties:
                slug:
                    type: string
                    pattern: ^[a-z0-9]$|^[a-z0-9][a-z0-9-]{0,78}[a-z0-9]$
            required:
                - slug
        hub.business.v1.SetSlugResponse:
            type: object
            properties:
                slug:
                    type: string
            required:
                - slug
        hub.business.v1.UpdateBusinessRequest:
            type: object
            properties:
                business_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                type:
                    type: string
                address:
                    type: string
                phone:
                    type: string
                email:
                    type: string
                    format: email
                website:
                    type: string
                timezone:
                    type: string
                currency:
                    type: string
                slug:
                    type: string
            required:
                - business_id
                - name
                - type
                - address
                - phone
                - email
                - website
                - timezone
                - currency
        hub.business.v1.UpdateBusinessResponse:
            type: object
            properties:
                business:
                    allOf:
                        - $ref: '#/components/schemas/hub.business.v1.Business'
            required:
                - business
        hub.business.v1.RenameBusinessRequest:
            type: object
            properties:
                business_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
            required:
                - business_id
                - name
        hub.business.v1.RenameBusinessResponse:
            type: object
            properties:
                business:
                    allOf:
                        - $ref: '#/components/schemas/hub.business.v1.Business'
            required:
                - business
        hub.business.v1.SetLogoRequest:
            type: object
            properties:
                business_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                logo_url:
                    type: string
                    description: Public URL of an already-uploaded asset (see @voxire/api uploadAsset).
            required:
                - business_id
                - logo_url
        hub.business.v1.SetLogoResponse:
            type: object
            properties:
                business:
                    allOf:
                        - $ref: '#/components/schemas/hub.business.v1.Business'
            required:
                - business
        hub.business.v1.DeleteBusinessRequest:
            type: object
            properties:
                business_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - business_id
        hub.business.v1.DeleteBusinessResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: BusinessService
      description: BusinessService defines hub business endpoints.
