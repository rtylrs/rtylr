openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /hub/dashboard/v1/kpis:
        get:
            tags:
                - DashboardService
            summary: getKPIs
            description: Returns key performance indicators for the active business.
            operationId: DashboardService_getKPIs
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.dashboard.v1.GetKPIsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        hub.dashboard.v1.GetKPIsRequest:
            type: object
        hub.dashboard.v1.GetKPIsResponse:
            type: object
            properties:
                revenue:
                    type: number
                    format: double
                order_count:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                staff_count:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                customer_count:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                low_stock_count:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                active_apps:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - revenue
                - order_count
                - staff_count
                - customer_count
                - low_stock_count
                - active_apps
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: DashboardService
      description: DashboardService defines hub dashboard endpoints.
