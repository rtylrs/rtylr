openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /hub/integration/v1/integrations:
        get:
            tags:
                - IntegrationService
            summary: listIntegrations
            description: Returns connected integrations.
            operationId: IntegrationService_listIntegrations
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.integration.v1.ListIntegrationsResponse'
    /hub/integration/v1/integrations/connect:
        post:
            tags:
                - IntegrationService
            summary: connectIntegration
            description: Connects a third-party integration.
            operationId: IntegrationService_connectIntegration
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hub.integration.v1.ConnectIntegrationRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.integration.v1.ConnectIntegrationResponse'
    /hub/integration/v1/integrations/disconnect:
        post:
            tags:
                - IntegrationService
            summary: disconnectIntegration
            description: Disconnects a third-party integration.
            operationId: IntegrationService_disconnectIntegration
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hub.integration.v1.DisconnectIntegrationRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.integration.v1.DisconnectIntegrationResponse'
components:
    schemas:
        hub.integration.v1.ListIntegrationsRequest:
            type: object
        hub.integration.v1.ListIntegrationsResponse:
            type: object
            properties:
                integrations:
                    type: array
                    items:
                        $ref: '#/components/schemas/hub.integration.v1.Integration'
        hub.integration.v1.Integration:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                provider:
                    type: string
                status:
                    type: string
                    description: The current lifecycle state.
                config:
                    type: string
                    format: byte
                connected_at:
                    type: string
                created_at:
                    type: string
                    description: When the record was created.
            description: Integration is a connected third-party integration.
        hub.integration.v1.ConnectIntegrationRequest:
            type: object
            properties:
                provider:
                    type: string
                config:
                    type: string
                    format: byte
            required:
                - provider
        hub.integration.v1.ConnectIntegrationResponse:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                message:
                    type: string
        hub.integration.v1.DisconnectIntegrationRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
            required:
                - id
        hub.integration.v1.DisconnectIntegrationResponse:
            type: object
            properties:
                message:
                    type: string
