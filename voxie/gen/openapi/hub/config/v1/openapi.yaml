openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /hub/config/v1/config:
        get:
            tags:
                - ConfigService
            summary: getConfig
            description: Returns the active business configuration.
            operationId: ConfigService_getConfig
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.config.v1.GetConfigResponse'
        put:
            tags:
                - ConfigService
            summary: updateConfig
            description: Updates the business configuration.
            operationId: ConfigService_updateConfig
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hub.config.v1.UpdateConfigRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.config.v1.UpdateConfigResponse'
        post:
            tags:
                - ConfigService
            summary: createConfig
            description: Creates the business configuration.
            operationId: ConfigService_createConfig
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hub.config.v1.CreateConfigRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.config.v1.CreateConfigResponse'
    /hub/config/v1/config/custom-domain:
        get:
            tags:
                - ConfigService
            summary: getCustomDomain
            operationId: ConfigService_getCustomDomain
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.config.v1.GetCustomDomainResponse'
        post:
            tags:
                - ConfigService
            summary: registerCustomDomain
            operationId: ConfigService_registerCustomDomain
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hub.config.v1.RegisterCustomDomainRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.config.v1.RegisterCustomDomainResponse'
        delete:
            tags:
                - ConfigService
            summary: removeCustomDomain
            operationId: ConfigService_removeCustomDomain
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.config.v1.RemoveCustomDomainResponse'
    /hub/config/v1/config/custom-domain/verify:
        post:
            tags:
                - ConfigService
            summary: verifyCustomDomain
            operationId: ConfigService_verifyCustomDomain
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hub.config.v1.VerifyCustomDomainRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.config.v1.VerifyCustomDomainResponse'
    /hub/config/v1/config/test-email:
        post:
            tags:
                - ConfigService
            summary: sendTestEmail
            description: Queues a test email using the configured tenant sender settings.
            operationId: ConfigService_sendTestEmail
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hub.config.v1.SendTestEmailRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.config.v1.SendTestEmailResponse'
    /hub/config/v1/industries:
        get:
            tags:
                - ConfigService
            summary: getIndustries
            description: Returns the industry catalog grouped by category.
            operationId: ConfigService_getIndustries
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.config.v1.GetIndustriesResponse'
components:
    schemas:
        hub.config.v1.GetConfigRequest:
            type: object
        hub.config.v1.GetConfigResponse:
            type: object
            properties:
                business:
                    allOf:
                        - $ref: '#/components/schemas/hub.business.v1.Business'
                    description: business is declared in hub.business.v1 - a cross-package reference.
                maintenance:
                    type: boolean
            required:
                - business
                - maintenance
        hub.business.v1.Business:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                name:
                    type: string
                type:
                    type: string
                    description: restaurant, retail, services, etc.
                logo_url:
                    type: string
                address:
                    type: string
                phone:
                    type: string
                email:
                    type: string
                    description: Email address used for lookup or contact.
                website:
                    type: string
                timezone:
                    type: string
                currency:
                    type: string
                country:
                    type: string
                plan:
                    type: string
                created_at:
                    type: string
                    description: When the record was created.
                slug:
                    type: string
                    description: URL-safe slug. Powers public surfaces like menu.rtylr.com/<slug>.
            required:
                - id
                - name
                - type
                - logo_url
                - address
                - phone
                - email
                - website
                - timezone
                - currency
                - country
                - plan
                - created_at
                - slug
            description: Business is a merchant's top-level business entity.
        hub.config.v1.CreateConfigRequest:
            type: object
            properties:
                owner:
                    type: string
                    description: |-
                        Accepted for legacy compatibility; the server derives the owning
                        business from the authenticated user.
                key:
                    type: string
                value:
                    type: string
                description:
                    type: string
            required:
                - owner
                - key
                - value
                - description
        hub.config.v1.CreateConfigResponse:
            type: object
            properties:
                config_id:
                    type: string
                    format: int64
                    description: Identifies the created config.
                message:
                    type: string
            required:
                - config_id
                - message
        hub.config.v1.UpdateConfigRequest:
            type: object
            properties:
                site_name:
                    type: string
                    description: Absent means unchanged.
                logo_url:
                    type: string
                favicon_url:
                    type: string
                contact_email:
                    type: string
                contact_number:
                    type: string
                sender_email:
                    type: string
                email_provider:
                    type: string
                sender_name:
                    type: string
                reply_to_email:
                    type: string
                email_notifications_enabled:
                    type: boolean
                smtp_host:
                    type: string
                smtp_port:
                    type: integer
                    format: int32
                smtp_username:
                    type: string
                smtp_password:
                    type: string
                website:
                    type: string
                maps_url:
                    type: string
                address:
                    type: string
                city:
                    type: string
                zipcode:
                    type: string
                country:
                    type: string
                instagram:
                    type: string
                maintenance_mode:
                    type: boolean
                maintenance_notice:
                    type: string
                addons_enabled:
                    type: boolean
                enable_reviews:
                    type: boolean
                enable_wishlist:
                    type: boolean
                enable_newsletter_signup:
                    type: boolean
                about_content:
                    type: string
                footer_sub_text:
                    type: string
        hub.config.v1.UpdateConfigResponse:
            type: object
            properties:
                message:
                    type: string
                config:
                    allOf:
                        - $ref: '#/components/schemas/hub.config.v1.ConfigPayload'
            required:
                - message
                - config
        hub.config.v1.ConfigPayload:
            type: object
            properties:
                owner_id:
                    type: string
                    description: |-
                        Identifies the business that owns this config. Serialized as a string
                        in the legacy payload.
                site_name:
                    type: string
                logo_url:
                    type: string
                favicon_url:
                    type: string
                meta_tags:
                    type: array
                    items:
                        type: string
                contact_email:
                    type: string
                contact_number:
                    type: string
                sender_email:
                    type: string
                email_provider:
                    type: string
                sender_name:
                    type: string
                reply_to_email:
                    type: string
                email_notifications_enabled:
                    type: boolean
                smtp_host:
                    type: string
                smtp_port:
                    type: integer
                    format: int32
                smtp_username:
                    type: string
                smtp_password_configured:
                    type: boolean
                website:
                    type: string
                maps_url:
                    type: string
                address:
                    type: string
                city:
                    type: string
                zipcode:
                    type: string
                country:
                    type: string
                instagram:
                    type: string
                maintenance_mode:
                    type: boolean
                maintenance_notice:
                    type: string
                addons_enabled:
                    type: boolean
                enable_reviews:
                    type: boolean
                enable_wishlist:
                    type: boolean
                enable_newsletter_signup:
                    type: boolean
                about_content:
                    type: string
                footer_sub_text:
                    type: string
                slug:
                    type: string
            required:
                - owner_id
                - site_name
                - logo_url
                - favicon_url
                - meta_tags
                - contact_email
                - contact_number
                - sender_email
                - email_provider
                - sender_name
                - reply_to_email
                - email_notifications_enabled
                - smtp_host
                - smtp_port
                - smtp_username
                - smtp_password_configured
                - website
                - maps_url
                - address
                - city
                - zipcode
                - country
                - instagram
                - maintenance_mode
                - maintenance_notice
                - addons_enabled
                - enable_reviews
                - enable_wishlist
                - enable_newsletter_signup
                - about_content
                - footer_sub_text
                - slug
        hub.config.v1.GetCustomDomainRequest:
            type: object
        hub.config.v1.GetCustomDomainResponse:
            type: object
            properties:
                domain:
                    allOf:
                        - $ref: '#/components/schemas/hub.config.v1.CustomDomain'
            required:
                - domain
        hub.config.v1.CustomDomain:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                business_id:
                    type: string
                    format: int64
                domain:
                    type: string
                status:
                    type: string
                verification_token:
                    type: string
                ssl_status:
                    type: string
                verified_at:
                    type: string
                created_at:
                    type: string
                updated_at:
                    type: string
            required:
                - id
                - business_id
                - domain
                - status
                - verification_token
                - ssl_status
                - verified_at
                - created_at
                - updated_at
        hub.config.v1.RegisterCustomDomainRequest:
            type: object
            properties:
                domain:
                    type: string
            required:
                - domain
        hub.config.v1.RegisterCustomDomainResponse:
            type: object
            properties:
                domain:
                    allOf:
                        - $ref: '#/components/schemas/hub.config.v1.CustomDomain'
            required:
                - domain
        hub.config.v1.VerifyCustomDomainRequest:
            type: object
            properties:
                verification_token:
                    type: string
            required:
                - verification_token
        hub.config.v1.VerifyCustomDomainResponse:
            type: object
            properties:
                domain:
                    allOf:
                        - $ref: '#/components/schemas/hub.config.v1.CustomDomain'
            required:
                - domain
        hub.config.v1.RemoveCustomDomainRequest:
            type: object
        hub.config.v1.RemoveCustomDomainResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        hub.config.v1.SendTestEmailRequest:
            type: object
            properties:
                recipient:
                    type: string
            required:
                - recipient
        hub.config.v1.SendTestEmailResponse:
            type: object
            properties:
                message:
                    type: string
                queued:
                    type: boolean
            required:
                - message
                - queued
        hub.config.v1.GetIndustriesRequest:
            type: object
        hub.config.v1.GetIndustriesResponse:
            type: object
            properties:
                groups:
                    type: array
                    items:
                        $ref: '#/components/schemas/hub.config.v1.IndustryGroup'
            required:
                - groups
        hub.config.v1.IndustryGroup:
            type: object
            properties:
                category:
                    type: string
                types:
                    type: array
                    items:
                        $ref: '#/components/schemas/hub.config.v1.IndustryType'
            required:
                - category
                - types
        hub.config.v1.IndustryType:
            type: object
            properties:
                slug:
                    type: string
                label:
                    type: string
                icon:
                    type: string
            required:
                - slug
                - label
                - icon
