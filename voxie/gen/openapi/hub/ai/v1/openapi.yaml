openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /hub/ai/v1/usage:
        get:
            tags:
                - AiService
            summary: getAiUsage
            operationId: AiService_getAiUsage
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.ai.v1.GetAiUsageResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /hub/ai/v1/quota-settings:
        get:
            tags:
                - AiService
            summary: getAiQuotaSettings
            operationId: AiService_getAiQuotaSettings
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.ai.v1.GetAiQuotaSettingsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        put:
            tags:
                - AiService
            summary: updateAiQuotaSettings
            operationId: AiService_updateAiQuotaSettings
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/hub.ai.v1.UpdateAiQuotaSettingsRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/hub.ai.v1.UpdateAiQuotaSettingsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        hub.ai.v1.GetAiUsageRequest:
            type: object
        hub.ai.v1.GetAiUsageResponse:
            type: object
            properties:
                usage:
                    allOf:
                        - $ref: '#/components/schemas/hub.ai.v1.AiQuotaStatus'
            required:
                - usage
        hub.ai.v1.AiQuotaStatus:
            type: object
            properties:
                plan_slug:
                    type: string
                mode:
                    type: string
                allowance_tokens:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                used_tokens:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                remaining_tokens:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                overage_tokens:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                allow_overage:
                    type: boolean
                blocked:
                    type: boolean
                period_end:
                    type: string
            required:
                - plan_slug
                - mode
                - allowance_tokens
                - used_tokens
                - remaining_tokens
                - overage_tokens
                - allow_overage
                - blocked
                - period_end
        hub.ai.v1.GetAiQuotaSettingsRequest:
            type: object
        hub.ai.v1.GetAiQuotaSettingsResponse:
            type: object
            properties:
                settings:
                    allOf:
                        - $ref: '#/components/schemas/hub.ai.v1.AiQuotaSettings'
            required:
                - settings
        hub.ai.v1.AiQuotaSettings:
            type: object
            properties:
                mode:
                    type: string
            required:
                - mode
        hub.ai.v1.UpdateAiQuotaSettingsRequest:
            type: object
            properties:
                mode:
                    type: string
            required:
                - mode
        hub.ai.v1.UpdateAiQuotaSettingsResponse:
            type: object
            properties:
                settings:
                    allOf:
                        - $ref: '#/components/schemas/hub.ai.v1.AiQuotaSettings'
            required:
                - settings
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: AiService
