openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /flow/milestone/v1/milestones:
        get:
            tags:
                - MilestoneService
            summary: listMilestones
            operationId: MilestoneService_listMilestones
            parameters:
                - name: project_id
                  in: query
                  required: false
                  schema:
                    type: string
                - name: workspace_id
                  in: query
                  required: false
                  schema:
                    type: string
                - name: page
                  in: query
                  description: The current result page.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    description: The current result page.
                - name: limit
                  in: query
                  description: The maximum number of records to return.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    description: The maximum number of records to return.
                - name: sort_by
                  in: query
                  description: The field to sort results by.
                  required: false
                  schema:
                    type: string
                    description: The field to sort results by.
                - name: sort_dir
                  in: query
                  description: The sort direction ("asc" or "desc").
                  required: false
                  schema:
                    type: string
                    description: The sort direction ("asc" or "desc").
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.milestone.v1.ListMilestonesResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        post:
            tags:
                - MilestoneService
            summary: createMilestone
            operationId: MilestoneService_createMilestone
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/flow.milestone.v1.CreateMilestoneRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.milestone.v1.CreateMilestoneResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /flow/milestone/v1/milestones/{id}:
        put:
            tags:
                - MilestoneService
            summary: updateMilestone
            operationId: MilestoneService_updateMilestone
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
                                description:
                                    type: string
                                status:
                                    type: string
                                target_date:
                                    type: string
                            required:
                                - name
                                - description
                                - status
                                - target_date
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.milestone.v1.UpdateMilestoneResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        flow.milestone.v1.ListMilestonesRequest:
            type: object
            properties:
                project_id:
                    type: string
                workspace_id:
                    type: string
                page:
                    type: integer
                    format: int32
                    description: The current result page.
                limit:
                    type: integer
                    format: int32
                    description: The maximum number of records to return.
                sort_by:
                    type: string
                    description: The field to sort results by.
                sort_dir:
                    type: string
                    description: The sort direction ("asc" or "desc").
            required:
                - project_id
                - workspace_id
                - page
                - limit
                - sort_by
                - sort_dir
        flow.milestone.v1.ListMilestonesResponse:
            type: object
            properties:
                milestones:
                    type: array
                    items:
                        $ref: '#/components/schemas/flow.milestone.v1.Milestone'
                pagination:
                    allOf:
                        - $ref: '#/components/schemas/common.pagination.v1.PaginationResponse'
            required:
                - milestones
                - pagination
        flow.milestone.v1.Milestone:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                project_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                target_date:
                    type: string
                progress:
                    type: integer
                    format: int32
                computed_progress:
                    type: integer
                    format: int32
                done_count:
                    type: integer
                    format: int32
                task_count:
                    type: integer
                    format: int32
                status:
                    type: string
                description:
                    type: string
                project:
                    allOf:
                        - $ref: '#/components/schemas/flow.milestone.v1.MilestoneProject'
            required:
                - id
                - project_id
                - name
                - target_date
                - progress
                - computed_progress
                - done_count
                - task_count
                - status
                - description
                - project
        flow.milestone.v1.MilestoneProject:
            type: object
            properties:
                name:
                    type: string
                color:
                    type: string
            required:
                - name
                - color
        common.pagination.v1.PaginationResponse:
            type: object
            properties:
                page:
                    type: integer
                    format: int32
                    description: page is the current result page.
                limit:
                    type: integer
                    format: int32
                    description: limit is the maximum number of records to return.
                total:
                    type: integer
                    format: int32
                    description: total is the total number of matching records.
                total_pages:
                    type: integer
                    format: int32
                    description: total_pages is the total pages value for this contract.
                has_next:
                    type: boolean
                    description: has_next is the has next value for this contract.
                has_prev:
                    type: boolean
                    description: has_prev is the has prev value for this contract.
            required:
                - page
                - limit
                - total
                - total_pages
                - has_next
                - has_prev
            description: Standard pagination response metadata.
        flow.milestone.v1.CreateMilestoneRequest:
            type: object
            properties:
                project_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                workspace_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                description:
                    type: string
                target_date:
                    type: string
            required:
                - project_id
                - workspace_id
                - name
                - description
                - target_date
        flow.milestone.v1.CreateMilestoneResponse:
            type: object
            properties:
                milestone:
                    allOf:
                        - $ref: '#/components/schemas/flow.milestone.v1.Milestone'
            required:
                - milestone
        flow.milestone.v1.UpdateMilestoneRequest:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                description:
                    type: string
                status:
                    type: string
                target_date:
                    type: string
            required:
                - id
                - name
                - description
                - status
                - target_date
        flow.milestone.v1.UpdateMilestoneResponse:
            type: object
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: MilestoneService
