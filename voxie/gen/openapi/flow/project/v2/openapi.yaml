        flow.project.v2.GetProjectLabourCostRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: id is the Flow project id path parameter.
        flow.project.v2.GetProjectLabourCostResponse:
            type: object
            properties:
                cost:
                    allOf:
                        - $ref: '#/components/schemas/flow.project.v2.ProjectLabourCost'
                    description: cost is the aggregate for the requested project.
        flow.project.v2.ProjectLabourCost:
            type: object
            properties:
                project_id:
                    type: string
                    format: int64
                    description: project_id is the project the cost was computed for.
                cost_minor_units:
                    type: string
                    format: int64
                    description: |-
                        cost_minor_units is the labour cost of billable logged time in the
                        smallest unit of the business currency, so no rounding happens before
                        the caller sees it.
                costed_minutes:
                    type: string
                    format: int64
                    description: |-
                        costed_minutes is billable logged time whose contributor had a rate on
                        record; it is the time included in cost_minor_units.
                uncosted_minutes:
                    type: string
                    format: int64
                    description: |-
                        uncosted_minutes is billable logged time whose contributor has no rate
                        on record. A total with uncosted_minutes above zero understates true
                        labour cost and must be labelled as partial where it is displayed.
                uncosted_employee_count:
                    type: integer
                    format: int32
                    description: |-
                        uncosted_employee_count is how many distinct contributors have no rate
                        on record.
