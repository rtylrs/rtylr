        flow.task.v1.UpdateTaskRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: id is the unique identifier for the resource.
                body:
                    allOf:
                        - $ref: '#/components/schemas/flow.task.v1.UpdateTaskBody'
                    description: body carries updatable task fields bound from the HTTP payload.
        flow.task.v1.UpdateTaskBody:
            type: object
            properties:
                title:
                    type: string
                    description: |-
                        Every field here is optional on purpose. This is a partial update: the
                        client sends only what changed, and the repository preserves omitted
                        columns with COALESCE(?, col). Marking a field @required here rejects a
                        single-field patch with a 400 before the handler ever runs, which is
                        exactly the defect this contract previously had.

                        title is the title value for this contract.
                description:
                    type: string
                    description: description is the description value for this contract.
                status:
                    type: string
                    description: status is the current lifecycle state.
                priority:
                    type: string
                    description: priority is the priority value for this contract.
                assignee_id:
                    type: string
                    format: int64
                    description: assignee_id is the assignee id value for this contract.
                due_date:
                    type: string
                    description: due_date is the due date value for this contract.
                start_date:
                    type: string
                    description: start_date is the start date value for this contract.
                labels:
                    type: array
                    items:
                        type: string
                        format: int64
                    description: |-
                        labels is the labels value for this contract. Absent leaves labels
                        untouched; @min_items is deliberately absent because requiring one label
                        made every task without labels permanently unupdatable.
                archived:
                    type: boolean
                    description: |-
                        Updated archived status; absent to keep current value. True archives the
                        task, false restores it.
                effort_minutes:
                    type: integer
                    format: int32
                    description: |-
                        Quick effort estimate in minutes for the effort chips. Absent leaves the
                        value untouched; 0 clears it. Zero minutes is meaningless as a stored
                        value, so it is safe as the clear sentinel, and it keeps this field out
                        of the COALESCE ambiguity that makes description impossible to clear.
                estimated_hours:
                    type: number
                    format: double
                    description: |-
                        Estimated hours. Absent leaves untouched; 0 clears. Same sentinel rule as
                        effort_minutes.
                waiting_on:
                    type: string
                    description: |-
                        Free-text blocker label: person, team or approval. Absent leaves
                        untouched; empty string clears.
                decision_note:
                    type: string
                    description: One-line decision log. Absent leaves untouched; empty string clears.
                focus_pin:
                    type: boolean
                    description: |-
                        Pin this task into the caller's own Today view. Absent leaves untouched;
                        true pins, false unpins. Per-caller, not per-task: Today is a personal
                        view, so this writes flow_task_focus_pins rather than a task column.
        flow.task.v1.UpdateTaskResponse:
            type: object
            properties:
                message:
                    type: string
                    description: message is a human-readable result message.
