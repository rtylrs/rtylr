openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /flow/task/v1/tasks:
        get:
            tags:
                - TaskService
            summary: listTasks
            operationId: TaskService_listTasks
            parameters:
                - name: project_id
                  in: query
                  required: false
                  schema:
                    type: string
                    format: int64
                    description: |-
                        project_id is the project id value for this contract.
                        NOTE: the original proto enforced a message-level "exactly one of
                        project_id, workspace_id required" constraint via
                        (buf.validate.message).oneof - onk has no decorator for this
                        cross-field constraint, so both fields are translated as plain
                        optional fields with no equivalent validation. Flagged for manual
                        follow-up.
                - name: status
                  in: query
                  required: true
                  schema:
                    type: string
                    description: status is the current lifecycle state.
                - name: assignee_id
                  in: query
                  required: false
                  schema:
                    type: string
                    format: int64
                    description: assignee_id is the assignee id value for this contract.
                - name: priority
                  in: query
                  required: true
                  schema:
                    type: string
                    description: priority is the priority value for this contract.
                - name: workspace_id
                  in: query
                  required: false
                  schema:
                    type: string
                    description: workspace_id filters tasks by workspace when project_id is absent.
                - name: page
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                    description: The current result page.
                - name: limit
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                    description: The maximum number of records to return.
                - name: sort_by
                  in: query
                  required: true
                  schema:
                    type: string
                    description: The field to sort results by.
                - name: sort_dir
                  in: query
                  required: true
                  schema:
                    type: string
                    description: The sort direction ("asc" or "desc").
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.task.v1.ListTasksResponse'
        post:
            tags:
                - TaskService
            summary: createTask
            operationId: TaskService_createTask
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/flow.task.v1.CreateTaskRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.task.v1.CreateTaskResponse'
    /flow/task/v1/tasks/my:
        get:
            tags:
                - TaskService
            summary: getMyTasks
            operationId: TaskService_getMyTasks
            parameters:
                - name: page
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                    description: The current result page.
                - name: limit
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                    description: The maximum number of records to return.
                - name: sort_by
                  in: query
                  required: true
                  schema:
                    type: string
                    description: The field to sort results by.
                - name: sort_dir
                  in: query
                  required: true
                  schema:
                    type: string
                    description: The sort direction ("asc" or "desc").
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.task.v1.GetMyTasksResponse'
    /flow/task/v1/tasks/my-project:
        get:
            tags:
                - TaskService
            summary: getMyTasksProject
            operationId: TaskService_getMyTasksProject
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.task.v1.GetMyTasksProjectResponse'
    /flow/task/v1/tasks/search:
        get:
            tags:
                - TaskService
            summary: searchTasks
            operationId: TaskService_searchTasks
            parameters:
                - name: q
                  in: query
                  required: true
                  schema:
                    type: string
                - name: workspace_id
                  in: query
                  required: true
                  schema:
                    type: string
                - name: page
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                    description: The current result page.
                - name: limit
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                    description: The maximum number of records to return.
                - name: sort_by
                  in: query
                  required: true
                  schema:
                    type: string
                    description: The field to sort results by.
                - name: sort_dir
                  in: query
                  required: true
                  schema:
                    type: string
                    description: The sort direction ("asc" or "desc").
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.task.v1.SearchTasksResponse'
    /flow/task/v1/tasks/{id}:
        get:
            tags:
                - TaskService
            summary: getTaskDetail
            operationId: TaskService_getTaskDetail
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.task.v1.GetTaskDetailResponse'
        put:
            tags:
                - TaskService
            summary: updateTask
            operationId: TaskService_updateTask
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/flow.task.v1.UpdateTaskBody'
                            description: body carries updatable task fields bound from the HTTP payload.
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.task.v1.UpdateTaskResponse'
        delete:
            tags:
                - TaskService
            summary: deleteTask
            operationId: TaskService_deleteTask
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.task.v1.DeleteTaskResponse'
    /flow/task/v1/tasks/{id}/status:
        patch:
            tags:
                - TaskService
            summary: updateTaskStatus
            operationId: TaskService_updateTaskStatus
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/flow.task.v1.UpdateTaskStatusBody'
                            description: body carries the new task status bound from the HTTP payload.
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.task.v1.UpdateTaskStatusResponse'
    /flow/task/v1/tasks/subtasks:
        post:
            tags:
                - TaskService
            summary: createSubtask
            operationId: TaskService_createSubtask
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/flow.task.v1.CreateSubtaskRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.task.v1.CreateSubtaskResponse'
    /flow/task/v1/tasks/{task_id}/subtasks:
        get:
            tags:
                - TaskService
            summary: getSubtasks
            operationId: TaskService_getSubtasks
            parameters:
                - name: task_id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
                - name: page
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                    description: The current result page.
                - name: limit
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                    description: The maximum number of records to return.
                - name: sort_by
                  in: query
                  required: true
                  schema:
                    type: string
                    description: The field to sort results by.
                - name: sort_dir
                  in: query
                  required: true
                  schema:
                    type: string
                    description: The sort direction ("asc" or "desc").
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.task.v1.GetSubtasksResponse'
    /flow/task/v1/tasks/{task_id}/comments:
        post:
            tags:
                - TaskService
            summary: addComment
            operationId: TaskService_addComment
            parameters:
                - name: task_id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/flow.task.v1.AddCommentRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.task.v1.AddCommentResponse'
    /flow/task/v1/tasks/comments/{id}:
        delete:
            tags:
                - TaskService
            summary: deleteComment
            operationId: TaskService_deleteComment
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.task.v1.DeleteCommentResponse'
    /flow/task/v1/tasks/{task_id}/activity:
        get:
            tags:
                - TaskService
            summary: getTaskActivity
            operationId: TaskService_getTaskActivity
            parameters:
                - name: task_id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.task.v1.GetTaskActivityResponse'
    /flow/task/v1/tasks/attachments:
        post:
            tags:
                - TaskService
            summary: createAttachment
            operationId: TaskService_createAttachment
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/flow.task.v1.CreateAttachmentRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.task.v1.CreateAttachmentResponse'
    /flow/task/v1/tasks/{task_id}/attachments:
        get:
            tags:
                - TaskService
            summary: getAttachments
            operationId: TaskService_getAttachments
            parameters:
                - name: task_id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.task.v1.GetAttachmentsResponse'
    /flow/task/v1/tasks/attachments/{id}:
        delete:
            tags:
                - TaskService
            summary: deleteAttachment
            operationId: TaskService_deleteAttachment
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.task.v1.DeleteAttachmentResponse'
    /flow/task/v1/tasks/{task_id}/time-logs:
        get:
            tags:
                - TaskService
            summary: getTimeLogs
            operationId: TaskService_getTimeLogs
            parameters:
                - name: task_id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.task.v1.GetTimeLogsResponse'
        post:
            tags:
                - TaskService
            summary: createTimeLog
            operationId: TaskService_createTimeLog
            parameters:
                - name: task_id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/flow.task.v1.CreateTimeLogRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.task.v1.CreateTimeLogResponse'
    /flow/task/v1/tasks/time-logs/{id}:
        delete:
            tags:
                - TaskService
            summary: deleteTimeLog
            operationId: TaskService_deleteTimeLog
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.task.v1.DeleteTimeLogResponse'
    /flow/task/v1/tasks/{task_id}/dependencies:
        post:
            tags:
                - TaskService
            summary: addTaskDependency
            operationId: TaskService_addTaskDependency
            parameters:
                - name: task_id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/flow.task.v1.AddTaskDependencyBody'
                            description: body carries the dependency target bound from the HTTP payload.
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.task.v1.AddTaskDependencyResponse'
    /flow/task/v1/tasks/{task_id}/dependencies/{depends_on_task_id}:
        delete:
            tags:
                - TaskService
            summary: removeTaskDependency
            operationId: TaskService_removeTaskDependency
            parameters:
                - name: task_id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
                - name: depends_on_task_id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.task.v1.RemoveTaskDependencyResponse'
components:
    schemas:
        flow.task.v1.ListTasksRequest:
            type: object
            properties:
                project_id:
                    type: string
                    format: int64
                    description: |-
                        project_id is the project id value for this contract.
                        NOTE: the original proto enforced a message-level "exactly one of
                        project_id, workspace_id required" constraint via
                        (buf.validate.message).oneof - onk has no decorator for this
                        cross-field constraint, so both fields are translated as plain
                        optional fields with no equivalent validation. Flagged for manual
                        follow-up.
                status:
                    type: string
                    description: status is the current lifecycle state.
                assignee_id:
                    type: string
                    format: int64
                    description: assignee_id is the assignee id value for this contract.
                priority:
                    type: string
                    description: priority is the priority value for this contract.
                workspace_id:
                    type: string
                    description: workspace_id filters tasks by workspace when project_id is absent.
                page:
                    type: integer
                    format: int32
                    description: The current result page.
                limit:
                    type: integer
                    format: int32
                    description: The maximum number of records to return.
                sort_by:
                    type: string
                    description: The field to sort results by.
                sort_dir:
                    type: string
                    description: The sort direction ("asc" or "desc").
        flow.task.v1.ListTasksResponse:
            type: object
            properties:
                tasks:
                    type: array
                    items:
                        $ref: '#/components/schemas/flow.task.v1.Task'
                    description: tasks is the tasks value for this contract.
                pagination:
                    allOf:
                        - $ref: '#/components/schemas/common.pagination.v1.PaginationResponse'
        flow.task.v1.Task:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    description: id is the unique identifier for the resource.
                project_id:
                    type: string
                    format: int64
                    description: project_id is the project id value for this contract.
                workspace_id:
                    type: string
                    format: int64
                    description: workspace_id is the workspace id value for this contract.
                owner_id:
                    type: string
                    format: int64
                    description: owner_id identifies the tenant that owns the resource.
                parent_task_id:
                    type: string
                    format: int64
                    description: parent_task_id is the parent task id value for this contract.
                title:
                    type: string
                    description: title is the title value for this contract.
                description:
                    type: string
                    description: description is the description value for this contract.
                status:
                    type: string
                    description: status is the current lifecycle state.
                priority:
                    type: string
                    description: priority is the priority value for this contract.
                assignee_id:
                    type: string
                    format: int64
                    description: assignee_id is the assignee id value for this contract.
                reporter_id:
                    type: string
                    format: int64
                    description: reporter_id is the reporter id value for this contract.
                due_date:
                    type: string
                    description: due_date is the due date value for this contract.
                start_date:
                    type: string
                    description: start_date is the start date value for this contract.
                completed_at:
                    type: string
                    description: completed_at is the completed at value for this contract.
                estimated_hours:
                    type: number
                    format: double
                    description: estimated_hours is the estimated hours value for this contract.
                actual_hours:
                    type: number
                    format: double
                    description: actual_hours is the actual hours value for this contract.
                sort_order:
                    type: string
                    format: int64
                    description: sort_order is the sort order value for this contract.
                labels:
                    type: array
                    items:
                        type: string
                        format: int64
                    description: labels is the labels value for this contract.
                created_at:
                    type: string
                    description: created_at is when the record was created.
                updated_at:
                    type: string
                    description: updated_at is when the record was last updated.
                identifier:
                    type: string
                    description: |-
                        Human-readable identifier like "FLOW-42" (project code + sequence).
                        Display projection populated by the backend on list/detail reads; safe
                        to leave at zero value on writes.
                project_name:
                    type: string
                    description: Project name (denormalised from flow_projects.name) for list views.
                project_color:
                    type: string
                    description: Project color hex for inline badges on cross-project lists.
                assignee_name:
                    type: string
                    description: Assignee display name. Empty if unassigned.
                assignee_initials:
                    type: string
                    description: Two-letter uppercase initials derived from assignee_name. Empty if unassigned.
                subtask_count:
                    type: integer
                    format: int32
                    description: Number of direct subtasks. Powers the "N subtasks" pill on task rows.
                section_id:
                    type: string
                    format: int64
                    description: Section bucket within a project (e.g. "Backlog", "Sprint 5"). Empty if unbucketed.
                cycle_id:
                    type: string
                    format: int64
                    description: Cycle (sprint) this task belongs to, if any.
                milestone_id:
                    type: string
                    format: int64
                    description: Milestone this task rolls up to, if any.
                archived:
                    type: boolean
                    description: |-
                        Whether the task is archived. Archived tasks are excluded from default
                        list and board views but stay readable by id. Absent means false, as
                        with every other non-nullable scalar in this message.
                effort_minutes:
                    type: integer
                    format: int32
                    description: |-
                        Quick effort estimate in minutes. Null when no estimate is set. The
                        write path treats 0 as a clear, so a stored 0 does not occur.
                waiting_on:
                    type: string
                    description: Free-text blocker label. Empty if nothing is blocking.
                decision_note:
                    type: string
                    description: One-line decision log. Empty if none recorded.
                focus_pin:
                    type: boolean
                    description: |-
                        Whether the *calling* user has pinned this task to their Today view.
                        Resolved per request from flow_task_focus_pins; never a shared task flag.
                dependencies:
                    type: array
                    items:
                        type: string
                        format: int64
                    description: |-
                        Task ids this task depends on. Read-only projection; write through the
                        addTaskDependency / removeTaskDependency RPCs.
        common.pagination.v1.PaginationResponse:
            type: object
            properties:
                page:
                    type: integer
                    format: int32
                    description: page is the current result page.
                limit:
                    type: integer
                    format: int32
                    description: limit is the maximum number of records to return.
                total:
                    type: integer
                    format: int32
                    description: total is the total number of matching records.
                total_pages:
                    type: integer
                    format: int32
                    description: total_pages is the total pages value for this contract.
                has_next:
                    type: boolean
                    description: has_next is the has next value for this contract.
                has_prev:
                    type: boolean
                    description: has_prev is the has prev value for this contract.
            description: Standard pagination response metadata.
        flow.task.v1.GetMyTasksRequest:
            type: object
            properties:
                page:
                    type: integer
                    format: int32
                    description: The current result page.
                limit:
                    type: integer
                    format: int32
                    description: The maximum number of records to return.
                sort_by:
                    type: string
                    description: The field to sort results by.
                sort_dir:
                    type: string
                    description: The sort direction ("asc" or "desc").
        flow.task.v1.GetMyTasksResponse:
            type: object
            properties:
                tasks:
                    type: array
                    items:
                        $ref: '#/components/schemas/flow.task.v1.Task'
                    description: tasks is the tasks value for this contract.
                pagination:
                    allOf:
                        - $ref: '#/components/schemas/common.pagination.v1.PaginationResponse'
        flow.task.v1.GetMyTasksProjectRequest:
            type: object
        flow.task.v1.GetMyTasksProjectResponse:
            type: object
            properties:
                project_id:
                    type: string
                    format: int64
                workspace_id:
                    type: string
                    format: int64
        flow.task.v1.SearchTasksRequest:
            type: object
            properties:
                q:
                    type: string
                workspace_id:
                    type: string
                page:
                    type: integer
                    format: int32
                    description: The current result page.
                limit:
                    type: integer
                    format: int32
                    description: The maximum number of records to return.
                sort_by:
                    type: string
                    description: The field to sort results by.
                sort_dir:
                    type: string
                    description: The sort direction ("asc" or "desc").
            required:
                - workspace_id
        flow.task.v1.SearchTasksResponse:
            type: object
            properties:
                tasks:
                    type: array
                    items:
                        $ref: '#/components/schemas/flow.task.v1.Task'
                pagination:
                    allOf:
                        - $ref: '#/components/schemas/common.pagination.v1.PaginationResponse'
        flow.task.v1.CreateTaskRequest:
            type: object
            properties:
                project_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: project_id is the project id value for this contract.
                workspace_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: workspace_id is the workspace id value for this contract.
                parent_task_id:
                    type: string
                    format: int64
                    description: parent_task_id is the parent task id value for this contract.
                title:
                    type: string
                    description: title is the title value for this contract.
                description:
                    type: string
                    description: description is the description value for this contract.
                priority:
                    type: string
                    description: priority is the priority value for this contract.
                assignee_id:
                    type: string
                    format: int64
                    description: assignee_id is the assignee id value for this contract.
                due_date:
                    type: string
                    description: due_date is the due date value for this contract.
                start_date:
                    type: string
                    description: start_date is the start date value for this contract.
                estimated_hours:
                    type: number
                    format: double
                    description: estimated_hours is the estimated hours value for this contract.
                labels:
                    type: array
                    items:
                        type: string
                        format: int64
                    minItems: 1
                    description: labels is the labels value for this contract.
            required:
                - project_id
                - workspace_id
                - title
                - description
                - priority
                - due_date
                - start_date
        flow.task.v1.CreateTaskResponse:
            type: object
            properties:
                task:
                    allOf:
                        - $ref: '#/components/schemas/flow.task.v1.Task'
                    description: task is the task value for this contract.
        flow.task.v1.GetTaskDetailRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
