openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /flow/label/v1/labels:
        get:
            tags:
                - LabelService
            summary: listLabels
            operationId: LabelService_listLabels
            parameters:
                - name: workspace_id
                  in: query
                  description: workspace_id is the workspace id value for this contract.
                  required: false
                  schema:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: workspace_id is the workspace id value for this contract.
                - name: page
                  in: query
                  description: The current result page.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    description: The current result page.
                - name: limit
                  in: query
                  description: The maximum number of records to return.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    description: The maximum number of records to return.
                - name: sort_by
                  in: query
                  description: The field to sort results by.
                  required: false
                  schema:
                    type: string
                    description: The field to sort results by.
                - name: sort_dir
                  in: query
                  description: The sort direction ("asc" or "desc").
                  required: false
                  schema:
                    type: string
                    description: The sort direction ("asc" or "desc").
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.label.v1.ListLabelsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        post:
            tags:
                - LabelService
            summary: createLabel
            operationId: LabelService_createLabel
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/flow.label.v1.CreateLabelRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.label.v1.CreateLabelResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /flow/label/v1/labels/{id}:
        put:
            tags:
                - LabelService
            summary: updateLabel
            operationId: LabelService_updateLabel
            parameters:
                - name: id
                  in: path
                  description: id is the label identifier.
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: id is the label identifier.
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
                                    description: name is the label name.
                                color:
                                    type: string
                                    description: color is the label color.
                            required:
                                - name
                                - color
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.label.v1.UpdateLabelResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        delete:
            tags:
                - LabelService
            summary: deleteLabel
            operationId: LabelService_deleteLabel
            parameters:
                - name: id
                  in: path
                  description: id is the label identifier.
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: id is the label identifier.
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.label.v1.DeleteLabelResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /flow/label/v1/tasks/labels:
        put:
            tags:
                - LabelService
            summary: setTaskLabels
            operationId: LabelService_setTaskLabels
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/flow.label.v1.SetTaskLabelsRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.label.v1.SetTaskLabelsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        flow.label.v1.ListLabelsRequest:
            type: object
            properties:
                workspace_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: workspace_id is the workspace id value for this contract.
                page:
                    type: integer
                    format: int32
                    description: The current result page.
                limit:
                    type: integer
                    format: int32
                    description: The maximum number of records to return.
                sort_by:
                    type: string
                    description: The field to sort results by.
                sort_dir:
                    type: string
                    description: The sort direction ("asc" or "desc").
            required:
                - workspace_id
                - page
                - limit
                - sort_by
                - sort_dir
        flow.label.v1.ListLabelsResponse:
            type: object
            properties:
                labels:
                    type: array
                    items:
                        $ref: '#/components/schemas/flow.label.v1.Label'
                    description: labels is the labels value for this contract.
                pagination:
                    allOf:
                        - $ref: '#/components/schemas/common.pagination.v1.PaginationResponse'
            required:
                - labels
                - pagination
        flow.label.v1.Label:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: id is the unique identifier for the resource.
                workspace_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: workspace_id is the workspace id value for this contract.
                name:
                    type: string
                    description: name is the name value for this contract.
                color:
                    type: string
                    description: color is the color value for this contract.
                created_at:
                    type: string
                    description: created_at is when the record was created.
            required:
                - id
                - workspace_id
                - name
                - color
                - created_at
        common.pagination.v1.PaginationResponse:
            type: object
            properties:
                page:
                    type: integer
                    format: int32
                    description: page is the current result page.
                limit:
                    type: integer
                    format: int32
                    description: limit is the maximum number of records to return.
                total:
                    type: integer
                    format: int32
                    description: total is the total number of matching records.
                total_pages:
                    type: integer
                    format: int32
                    description: total_pages is the total pages value for this contract.
                has_next:
                    type: boolean
                    description: has_next is the has next value for this contract.
                has_prev:
                    type: boolean
                    description: has_prev is the has prev value for this contract.
            required:
                - page
                - limit
                - total
                - total_pages
                - has_next
                - has_prev
            description: Standard pagination response metadata.
        flow.label.v1.CreateLabelRequest:
            type: object
            properties:
                workspace_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: workspace_id is the workspace id value for this contract.
                name:
                    type: string
                    description: name is the name value for this contract.
                color:
                    type: string
                    description: color is the color value for this contract.
            required:
                - workspace_id
                - name
                - color
        flow.label.v1.CreateLabelResponse:
            type: object
            properties:
                label:
                    allOf:
                        - $ref: '#/components/schemas/flow.label.v1.Label'
                    description: label is the label value for this contract.
            required:
                - label
        flow.label.v1.UpdateLabelRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: id is the label identifier.
                name:
                    type: string
                    description: name is the label name.
                color:
                    type: string
                    description: color is the label color.
            required:
                - id
                - name
                - color
        flow.label.v1.UpdateLabelResponse:
            type: object
            properties:
                message:
                    type: string
                    description: message is a human-readable result message.
            required:
                - message
        flow.label.v1.DeleteLabelRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: id is the label identifier.
            required:
                - id
        flow.label.v1.DeleteLabelResponse:
            type: object
            properties:
                message:
                    type: string
                    description: message is a human-readable result message.
            required:
                - message
        flow.label.v1.SetTaskLabelsRequest:
            type: object
            properties:
                task_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                label_ids:
                    type: array
                    items:
                        type: string
                        pattern: ^-?[0-9]+$
                        format: int64
            required:
                - task_id
                - label_ids
        flow.label.v1.SetTaskLabelsResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: LabelService
