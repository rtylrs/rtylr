openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /flow/label/v2/labels:
        get:
            tags:
                - LabelService
            summary: listLabels
            operationId: LabelService_listLabels
            parameters:
                - name: page
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                    description: The current result page.
                - name: limit
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                    description: The maximum number of records to return.
                - name: sort_by
                  in: query
                  required: true
                  schema:
                    type: string
                    description: The field to sort results by.
                - name: sort_dir
                  in: query
                  required: true
                  schema:
                    type: string
                    description: The sort direction ("asc" or "desc").
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.label.v2.ListLabelsResponse'
        post:
            tags:
                - LabelService
            summary: createLabel
            operationId: LabelService_createLabel
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/flow.label.v2.CreateLabelRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.label.v2.CreateLabelResponse'
    /flow/label/v2/labels/{id}:
        put:
            tags:
                - LabelService
            summary: updateLabel
            operationId: LabelService_updateLabel
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/flow.label.v2.UpdateLabelRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.label.v2.UpdateLabelResponse'
        delete:
            tags:
                - LabelService
            summary: deleteLabel
            operationId: LabelService_deleteLabel
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.label.v2.DeleteLabelResponse'
    /flow/label/v2/tasks/labels:
        put:
            tags:
                - LabelService
            summary: setTaskLabels
            operationId: LabelService_setTaskLabels
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/flow.label.v2.SetTaskLabelsRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.label.v2.SetTaskLabelsResponse'
components:
    schemas:
        flow.label.v2.ListLabelsRequest:
            type: object
            properties:
                page:
                    type: integer
                    format: int32
                    description: The current result page.
                limit:
                    type: integer
                    format: int32
                    description: The maximum number of records to return.
                sort_by:
                    type: string
                    description: The field to sort results by.
                sort_dir:
                    type: string
                    description: The sort direction ("asc" or "desc").
            required:
                - page
                - limit
                - sort_by
                - sort_dir
        flow.label.v2.ListLabelsResponse:
            type: object
            properties:
                labels:
                    type: array
                    items:
                        $ref: '#/components/schemas/flow.label.v2.Label'
                    description: labels is the labels value for this contract.
                pagination:
                    allOf:
                        - $ref: '#/components/schemas/common.pagination.v1.PaginationResponse'
            required:
                - labels
                - pagination
        flow.label.v2.Label:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    description: id is the unique identifier for the resource.
                name:
                    type: string
                    description: name is the name value for this contract.
                color:
                    type: string
                    description: color is the color value for this contract.
                created_at:
                    type: string
                    description: created_at is when the record was created.
            required:
                - id
                - name
                - color
                - created_at
            description: |-
                Label is business-scoped in v2: one pool shared by every project in the
                caller's business. Names are not unique by contract; duplicate names from
                the migration are tolerated and may be deduped later without a breaking
                change.
        common.pagination.v1.PaginationResponse:
            type: object
            properties:
                page:
                    type: integer
                    format: int32
                    description: page is the current result page.
                limit:
                    type: integer
                    format: int32
                    description: limit is the maximum number of records to return.
                total:
                    type: integer
                    format: int32
                    description: total is the total number of matching records.
                total_pages:
                    type: integer
                    format: int32
                    description: total_pages is the total pages value for this contract.
                has_next:
                    type: boolean
                    description: has_next is the has next value for this contract.
                has_prev:
                    type: boolean
                    description: has_prev is the has prev value for this contract.
            required:
                - page
                - limit
                - total
                - total_pages
                - has_next
                - has_prev
            description: Standard pagination response metadata.
        flow.label.v2.CreateLabelRequest:
            type: object
            properties:
                name:
                    type: string
                    description: name is the name value for this contract.
                color:
                    type: string
                    description: color is the color value for this contract.
            required:
                - name
                - color
        flow.label.v2.CreateLabelResponse:
            type: object
            properties:
                label:
                    allOf:
                        - $ref: '#/components/schemas/flow.label.v2.Label'
                    description: label is the label value for this contract.
            required:
                - label
        flow.label.v2.UpdateLabelRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: id is the label identifier.
                name:
                    type: string
                    description: name is the label name.
                color:
                    type: string
                    description: color is the label color.
            required:
                - id
                - name
                - color
        flow.label.v2.UpdateLabelResponse:
            type: object
            properties:
                message:
                    type: string
                    description: message is a human-readable result message.
            required:
                - message
        flow.label.v2.DeleteLabelRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: id is the label identifier.
            required:
                - id
        flow.label.v2.DeleteLabelResponse:
            type: object
            properties:
                message:
                    type: string
                    description: message is a human-readable result message.
            required:
                - message
        flow.label.v2.SetTaskLabelsRequest:
            type: object
            properties:
                task_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                label_ids:
                    type: array
                    items:
                        type: string
                        format: int64
            required:
                - task_id
                - label_ids
        flow.label.v2.SetTaskLabelsResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
