openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /flow/workspace/v1/workspaces:
        get:
            tags:
                - WorkspaceService
            summary: listWorkspaces
            operationId: WorkspaceService_listWorkspaces
            parameters:
                - name: page
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                    description: The current result page.
                - name: limit
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                    description: The maximum number of records to return.
                - name: sort_by
                  in: query
                  required: true
                  schema:
                    type: string
                    description: The field to sort results by.
                - name: sort_dir
                  in: query
                  required: true
                  schema:
                    type: string
                    description: The sort direction ("asc" or "desc").
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.workspace.v1.ListWorkspacesResponse'
        post:
            tags:
                - WorkspaceService
            summary: createWorkspace
            operationId: WorkspaceService_createWorkspace
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/flow.workspace.v1.CreateWorkspaceRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.workspace.v1.CreateWorkspaceResponse'
    /flow/workspace/v1/workspaces/{id}:
        put:
            tags:
                - WorkspaceService
            summary: updateWorkspace
            operationId: WorkspaceService_updateWorkspace
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/flow.workspace.v1.UpdateWorkspaceBody'
                            description: body carries updatable workspace fields bound from the HTTP payload.
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.workspace.v1.UpdateWorkspaceResponse'
        delete:
            tags:
                - WorkspaceService
            summary: deleteWorkspace
            operationId: WorkspaceService_deleteWorkspace
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.workspace.v1.DeleteWorkspaceResponse'
    /flow/workspace/v1/workspaces/members:
        get:
            tags:
                - WorkspaceService
            summary: listWorkspaceMembers
            operationId: WorkspaceService_listWorkspaceMembers
            parameters:
                - name: workspace_id
                  in: query
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: workspace_id is the workspace id value for this contract.
                - name: page
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                    description: The current result page.
                - name: limit
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                    description: The maximum number of records to return.
                - name: sort_by
                  in: query
                  required: true
                  schema:
                    type: string
                    description: The field to sort results by.
                - name: sort_dir
                  in: query
                  required: true
                  schema:
                    type: string
                    description: The sort direction ("asc" or "desc").
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.workspace.v1.ListWorkspaceMembersResponse'
        post:
            tags:
                - WorkspaceService
            summary: addWorkspaceMember
            operationId: WorkspaceService_addWorkspaceMember
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/flow.workspace.v1.AddWorkspaceMemberRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.workspace.v1.AddWorkspaceMemberResponse'
        delete:
            tags:
                - WorkspaceService
            summary: removeWorkspaceMember
            operationId: WorkspaceService_removeWorkspaceMember
            parameters:
                - name: workspace_id
                  in: query
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: workspace_id is the workspace id value for this contract.
                - name: user_id
                  in: query
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: user_id identifies the user associated with this request.
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.workspace.v1.RemoveWorkspaceMemberResponse'
    /flow/workspace/v1/workspaces/members/role:
        put:
            tags:
                - WorkspaceService
            summary: updateWorkspaceMemberRole
            operationId: WorkspaceService_updateWorkspaceMemberRole
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/flow.workspace.v1.UpdateWorkspaceMemberRoleRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.workspace.v1.UpdateWorkspaceMemberRoleResponse'
components:
    schemas:
        flow.workspace.v1.ListWorkspacesRequest:
            type: object
            properties:
                page:
                    type: integer
                    format: int32
                    description: The current result page.
                limit:
                    type: integer
                    format: int32
                    description: The maximum number of records to return.
                sort_by:
                    type: string
                    description: The field to sort results by.
                sort_dir:
                    type: string
                    description: The sort direction ("asc" or "desc").
        flow.workspace.v1.ListWorkspacesResponse:
            type: object
            properties:
                workspaces:
                    type: array
                    items:
                        $ref: '#/components/schemas/flow.workspace.v1.Workspace'
                    description: workspaces is the workspaces value for this contract.
                pagination:
                    allOf:
                        - $ref: '#/components/schemas/common.pagination.v1.PaginationResponse'
        flow.workspace.v1.Workspace:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    description: id is the unique identifier for the resource.
                owner_id:
                    type: string
                    format: int64
                    description: owner_id identifies the tenant that owns the resource.
                name:
                    type: string
                    description: name is the name value for this contract.
                description:
                    type: string
                    description: description is the description value for this contract.
                icon:
                    type: string
                    description: icon is the icon value for this contract.
                color:
                    type: string
                    description: color is the color value for this contract.
                is_default:
                    type: boolean
                    description: is_default is the is default value for this contract.
                created_by:
                    type: string
                    format: int64
                    description: created_by is the created by value for this contract.
                created_at:
                    type: string
                    description: created_at is when the record was created.
                updated_at:
                    type: string
                    description: updated_at is when the record was last updated.
                member_count:
                    type: integer
                    format: int32
                    description: |-
                        Count of members in this workspace, for sidebar / picker badges.
                        Display projection populated on list reads.
                is_personal:
                    type: boolean
                    description: True when this is the caller's auto-created Personal workspace.
        common.pagination.v1.PaginationResponse:
            type: object
            properties:
                page:
                    type: integer
                    format: int32
                    description: page is the current result page.
                limit:
                    type: integer
                    format: int32
                    description: limit is the maximum number of records to return.
                total:
                    type: integer
                    format: int32
                    description: total is the total number of matching records.
                total_pages:
                    type: integer
                    format: int32
                    description: total_pages is the total pages value for this contract.
                has_next:
                    type: boolean
                    description: has_next is the has next value for this contract.
                has_prev:
                    type: boolean
                    description: has_prev is the has prev value for this contract.
            description: Standard pagination response metadata.
        flow.workspace.v1.CreateWorkspaceRequest:
            type: object
            properties:
                name:
                    type: string
                    description: name is the name value for this contract.
                description:
                    type: string
                    description: description is the description value for this contract.
                icon:
                    type: string
                    description: icon is the icon value for this contract.
                color:
                    type: string
                    description: color is the color value for this contract.
            required:
                - name
                - description
                - icon
                - color
        flow.workspace.v1.CreateWorkspaceResponse:
            type: object
            properties:
                workspace:
                    allOf:
                        - $ref: '#/components/schemas/flow.workspace.v1.Workspace'
                    description: workspace is the workspace value for this contract.
        flow.workspace.v1.UpdateWorkspaceRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: id is the unique identifier for the resource.
                body:
                    allOf:
                        - $ref: '#/components/schemas/flow.workspace.v1.UpdateWorkspaceBody'
                    description: body carries updatable workspace fields bound from the HTTP payload.
        flow.workspace.v1.UpdateWorkspaceBody:
            type: object
            properties:
                name:
                    type: string
                    description: name is the name value for this contract.
                description:
                    type: string
                    description: description is the description value for this contract.
                icon:
                    type: string
                    description: icon is the icon value for this contract.
                color:
                    type: string
                    description: color is the color value for this contract.
            required:
                - name
                - description
                - icon
                - color
        flow.workspace.v1.UpdateWorkspaceResponse:
            type: object
            properties:
                message:
                    type: string
                    description: message is a human-readable result message.
        flow.workspace.v1.DeleteWorkspaceRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: id is the unique identifier for the resource.
        flow.workspace.v1.DeleteWorkspaceResponse:
            type: object
            properties:
                message:
                    type: string
                    description: message is a human-readable result message.
        flow.workspace.v1.ListWorkspaceMembersRequest:
            type: object
            properties:
                workspace_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: workspace_id is the workspace id value for this contract.
                page:
                    type: integer
                    format: int32
                    description: The current result page.
                limit:
                    type: integer
                    format: int32
                    description: The maximum number of records to return.
                sort_by:
                    type: string
                    description: The field to sort results by.
                sort_dir:
                    type: string
                    description: The sort direction ("asc" or "desc").
            required:
                - workspace_id
        flow.workspace.v1.ListWorkspaceMembersResponse:
            type: object
            properties:
                members:
                    type: array
                    items:
                        $ref: '#/components/schemas/flow.workspace.v1.WorkspaceMember'
                    description: members is the workspace members for this contract.
                pagination:
                    allOf:
                        - $ref: '#/components/schemas/common.pagination.v1.PaginationResponse'
        flow.workspace.v1.WorkspaceMember:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    description: id is the unique identifier for the membership record.
                workspace_id:
                    type: string
                    format: int64
                    description: workspace_id is the workspace id value for this contract.
                user_id:
                    type: string
                    format: int64
                    description: user_id identifies the user associated with this request.
                name:
                    type: string
                    description: name is the member display name.
                email:
                    type: string
                    description: email is the member email address.
                role:
                    type: string
                    description: role is the role value for this contract.
                invited_by:
                    type: string
                    format: int64
                    description: invited_by is the user id of the inviter, if any.
                joined_at:
                    type: string
                    description: joined_at is when the member joined the workspace.
        flow.workspace.v1.AddWorkspaceMemberRequest:
            type: object
            properties:
                workspace_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: workspace_id is the workspace id value for this contract.
                user_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: user_id identifies the user associated with this request.
                role:
                    type: string
                    description: role is the role value for this contract.
            required:
                - workspace_id
                - user_id
                - role
        flow.workspace.v1.AddWorkspaceMemberResponse:
            type: object
            properties:
                message:
                    type: string
                    description: message is a human-readable result message.
        flow.workspace.v1.RemoveWorkspaceMemberRequest:
            type: object
            properties:
                workspace_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: workspace_id is the workspace id value for this contract.
                user_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: user_id identifies the user associated with this request.
            required:
                - workspace_id
                - user_id
        flow.workspace.v1.RemoveWorkspaceMemberResponse:
            type: object
            properties:
                message:
                    type: string
                    description: message is a human-readable result message.
        flow.workspace.v1.UpdateWorkspaceMemberRoleRequest:
            type: object
            properties:
                workspace_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: workspace_id is the workspace id value for this contract.
                user_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: user_id identifies the user associated with this request.
                role:
                    type: string
                    description: role is the role value for this contract.
            required:
                - workspace_id
                - user_id
                - role
        flow.workspace.v1.UpdateWorkspaceMemberRoleResponse:
            type: object
            properties:
                message:
                    type: string
                    description: message is a human-readable result message.
