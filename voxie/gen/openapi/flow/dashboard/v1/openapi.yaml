openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /flow/dashboard/v1/dashboard:
        get:
            tags:
                - DashboardService
            summary: getFlowDashboard
            operationId: DashboardService_getFlowDashboard
            parameters:
                - name: workspace_id
                  in: query
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: workspace_id is the workspace id value for this contract.
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.dashboard.v1.GetFlowDashboardResponse'
components:
    schemas:
        flow.dashboard.v1.GetFlowDashboardRequest:
            type: object
            properties:
                workspace_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                    description: workspace_id is the workspace id value for this contract.
            required:
                - workspace_id
        flow.dashboard.v1.GetFlowDashboardResponse:
            type: object
            properties:
                open_tasks:
                    type: string
                    format: int64
                    description: open_tasks is the open tasks value for this contract.
                in_progress_tasks:
                    type: string
                    format: int64
                    description: in_progress_tasks is the in progress tasks value for this contract.
                completed_this_week:
                    type: string
                    format: int64
                    description: completed_this_week is the completed this week value for this contract.
                overdue_tasks:
                    type: string
                    format: int64
                    description: overdue_tasks is the overdue tasks value for this contract.
                my_tasks:
                    type: array
                    items:
                        $ref: '#/components/schemas/flow.task.v1.Task'
                    description: my_tasks is the my tasks value for this contract.
        flow.task.v1.Task:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                    description: id is the unique identifier for the resource.
                project_id:
                    type: string
                    format: int64
                    description: project_id is the project id value for this contract.
                workspace_id:
                    type: string
                    format: int64
                    description: workspace_id is the workspace id value for this contract.
                owner_id:
                    type: string
                    format: int64
                    description: owner_id identifies the tenant that owns the resource.
                parent_task_id:
                    type: string
                    format: int64
                    description: parent_task_id is the parent task id value for this contract.
                title:
                    type: string
                    description: title is the title value for this contract.
                description:
                    type: string
                    description: description is the description value for this contract.
                status:
                    type: string
                    description: status is the current lifecycle state.
                priority:
                    type: string
                    description: priority is the priority value for this contract.
                assignee_id:
                    type: string
                    format: int64
                    description: assignee_id is the assignee id value for this contract.
                reporter_id:
                    type: string
                    format: int64
                    description: reporter_id is the reporter id value for this contract.
                due_date:
                    type: string
                    description: due_date is the due date value for this contract.
                start_date:
                    type: string
                    description: start_date is the start date value for this contract.
                completed_at:
                    type: string
                    description: completed_at is the completed at value for this contract.
                estimated_hours:
                    type: number
                    format: double
                    description: estimated_hours is the estimated hours value for this contract.
                actual_hours:
                    type: number
                    format: double
                    description: actual_hours is the actual hours value for this contract.
                sort_order:
                    type: string
                    format: int64
                    description: sort_order is the sort order value for this contract.
                labels:
                    type: array
                    items:
                        type: string
                        format: int64
                    description: labels is the labels value for this contract.
                created_at:
                    type: string
                    description: created_at is when the record was created.
                updated_at:
                    type: string
                    description: updated_at is when the record was last updated.
                identifier:
                    type: string
                    description: |-
                        Human-readable identifier like "FLOW-42" (project code + sequence).
                        Display projection populated by the backend on list/detail reads; safe
                        to leave at zero value on writes.
                project_name:
                    type: string
                    description: Project name (denormalised from flow_projects.name) for list views.
                project_color:
                    type: string
                    description: Project color hex for inline badges on cross-project lists.
                assignee_name:
                    type: string
                    description: Assignee display name. Empty if unassigned.
                assignee_initials:
                    type: string
                    description: Two-letter uppercase initials derived from assignee_name. Empty if unassigned.
                subtask_count:
                    type: integer
                    format: int32
                    description: Number of direct subtasks. Powers the "N subtasks" pill on task rows.
                section_id:
                    type: string
                    format: int64
                    description: Section bucket within a project (e.g. "Backlog", "Sprint 5"). Empty if unbucketed.
                cycle_id:
                    type: string
                    format: int64
                    description: Cycle (sprint) this task belongs to, if any.
                milestone_id:
                    type: string
                    format: int64
                    description: Milestone this task rolls up to, if any.
                archived:
                    type: boolean
                    description: |-
                        Whether the task is archived. Archived tasks are excluded from default
                        list and board views but stay readable by id. Absent means false, as
                        with every other non-nullable scalar in this message.
                effort_minutes:
                    type: integer
                    format: int32
                    description: |-
                        Quick effort estimate in minutes. Null when no estimate is set. The
                        write path treats 0 as a clear, so a stored 0 does not occur.
                waiting_on:
                    type: string
                    description: Free-text blocker label. Empty if nothing is blocking.
                decision_note:
                    type: string
                    description: One-line decision log. Empty if none recorded.
                focus_pin:
                    type: boolean
                    description: |-
                        Whether the *calling* user has pinned this task to their Today view.
                        Resolved per request from flow_task_focus_pins; never a shared task flag.
                dependencies:
                    type: array
                    items:
                        type: string
                        format: int64
                    description: |-
                        Task ids this task depends on. Read-only projection; write through the
                        addTaskDependency / removeTaskDependency RPCs.
