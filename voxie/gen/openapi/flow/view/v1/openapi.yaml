openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /flow/view/v1/views:
        get:
            tags:
                - ViewService
            summary: listViews
            operationId: ViewService_listViews
            parameters:
                - name: workspace_id
                  in: query
                  required: false
                  schema:
                    type: string
                - name: page
                  in: query
                  description: The current result page.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    description: The current result page.
                - name: limit
                  in: query
                  description: The maximum number of records to return.
                  required: false
                  schema:
                    type: integer
                    format: int32
                    description: The maximum number of records to return.
                - name: sort_by
                  in: query
                  description: The field to sort results by.
                  required: false
                  schema:
                    type: string
                    description: The field to sort results by.
                - name: sort_dir
                  in: query
                  description: The sort direction ("asc" or "desc").
                  required: false
                  schema:
                    type: string
                    description: The sort direction ("asc" or "desc").
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.view.v1.ListViewsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        post:
            tags:
                - ViewService
            summary: createView
            operationId: ViewService_createView
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/flow.view.v1.CreateViewRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.view.v1.CreateViewResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /flow/view/v1/views/{id}:
        put:
            tags:
                - ViewService
            summary: updateView
            operationId: ViewService_updateView
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
                                icon:
                                    type: string
                                visibility:
                                    type: string
                                    description: |-
                                        visibility is "shared" (every colleague in the business can use this view)
                                        or "private" (only its creator). Empty on create means "shared", which is
                                        how every view behaved before this field existed, so an older client keeps
                                        its current behaviour rather than silently making views private.
                                filters:
                                    type: string
                                    description: JSON-encoded filter criteria for this saved view.
                                group_by:
                                    type: string
                                sort_by:
                                    type: string
                                sort_dir:
                                    type: string
                            required:
                                - name
                                - icon
                                - visibility
                                - filters
                                - group_by
                                - sort_by
                                - sort_dir
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.view.v1.UpdateViewResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        delete:
            tags:
                - ViewService
            summary: deleteView
            operationId: ViewService_deleteView
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.view.v1.DeleteViewResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        flow.view.v1.ListViewsRequest:
            type: object
            properties:
                workspace_id:
                    type: string
                page:
                    type: integer
                    format: int32
                    description: The current result page.
                limit:
                    type: integer
                    format: int32
                    description: The maximum number of records to return.
                sort_by:
                    type: string
                    description: The field to sort results by.
                sort_dir:
                    type: string
                    description: The sort direction ("asc" or "desc").
            required:
                - workspace_id
                - page
                - limit
                - sort_by
                - sort_dir
        flow.view.v1.ListViewsResponse:
            type: object
            properties:
                views:
                    type: array
                    items:
                        $ref: '#/components/schemas/flow.view.v1.View'
                pagination:
                    allOf:
                        - $ref: '#/components/schemas/common.pagination.v1.PaginationResponse'
            required:
                - views
                - pagination
        flow.view.v1.View:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                icon:
                    type: string
                visibility:
                    type: string
                    description: |-
                        visibility is "shared" (every colleague in the business can use this view)
                        or "private" (only its creator). Empty on create means "shared", which is
                        how every view behaved before this field existed, so an older client keeps
                        its current behaviour rather than silently making views private.
                filters:
                    type: string
                    description: JSON-encoded filter criteria for this saved view.
                group_by:
                    type: string
                sort_by:
                    type: string
                sort_dir:
                    type: string
            required:
                - id
                - name
                - icon
                - visibility
                - filters
                - group_by
                - sort_by
                - sort_dir
        common.pagination.v1.PaginationResponse:
            type: object
            properties:
                page:
                    type: integer
                    format: int32
                    description: page is the current result page.
                limit:
                    type: integer
                    format: int32
                    description: limit is the maximum number of records to return.
                total:
                    type: integer
                    format: int32
                    description: total is the total number of matching records.
                total_pages:
                    type: integer
                    format: int32
                    description: total_pages is the total pages value for this contract.
                has_next:
                    type: boolean
                    description: has_next is the has next value for this contract.
                has_prev:
                    type: boolean
                    description: has_prev is the has prev value for this contract.
            required:
                - page
                - limit
                - total
                - total_pages
                - has_next
                - has_prev
            description: Standard pagination response metadata.
        flow.view.v1.CreateViewRequest:
            type: object
            properties:
                workspace_id:
                    type: string
                name:
                    type: string
                icon:
                    type: string
                visibility:
                    type: string
                    description: |-
                        visibility is "shared" (every colleague in the business can use this view)
                        or "private" (only its creator). Empty on create means "shared", which is
                        how every view behaved before this field existed, so an older client keeps
                        its current behaviour rather than silently making views private.
                filters:
                    type: string
                    description: JSON-encoded filter criteria for this saved view.
                group_by:
                    type: string
                sort_by:
                    type: string
                sort_dir:
                    type: string
            required:
                - workspace_id
                - name
                - icon
                - visibility
                - filters
                - group_by
                - sort_by
                - sort_dir
        flow.view.v1.CreateViewResponse:
            type: object
            properties:
                view:
                    allOf:
                        - $ref: '#/components/schemas/flow.view.v1.View'
            required:
                - view
        flow.view.v1.UpdateViewRequest:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                icon:
                    type: string
                visibility:
                    type: string
                    description: |-
                        visibility is "shared" (every colleague in the business can use this view)
                        or "private" (only its creator). Empty on create means "shared", which is
                        how every view behaved before this field existed, so an older client keeps
                        its current behaviour rather than silently making views private.
                filters:
                    type: string
                    description: JSON-encoded filter criteria for this saved view.
                group_by:
                    type: string
                sort_by:
                    type: string
                sort_dir:
                    type: string
            required:
                - id
                - name
                - icon
                - visibility
                - filters
                - group_by
                - sort_by
                - sort_dir
        flow.view.v1.UpdateViewResponse:
            type: object
        flow.view.v1.DeleteViewRequest:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - id
        flow.view.v1.DeleteViewResponse:
            type: object
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: ViewService
