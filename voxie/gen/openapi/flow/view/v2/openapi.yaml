openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /flow/view/v2/views:
        get:
            tags:
                - ViewService
            summary: listViews
            operationId: ViewService_listViews
            parameters:
                - name: page
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                    description: The current result page.
                - name: limit
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int32
                    description: The maximum number of records to return.
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.view.v2.ListViewsResponse'
        post:
            tags:
                - ViewService
            summary: createView
            operationId: ViewService_createView
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/flow.view.v2.CreateViewRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.view.v2.CreateViewResponse'
    /flow/view/v2/views/{id}:
        put:
            tags:
                - ViewService
            summary: updateView
            operationId: ViewService_updateView
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/flow.view.v2.UpdateViewRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.view.v2.UpdateViewResponse'
        delete:
            tags:
                - ViewService
            summary: deleteView
            operationId: ViewService_deleteView
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.view.v2.DeleteViewResponse'
components:
    schemas:
        flow.view.v2.ListViewsRequest:
            type: object
            properties:
                page:
                    type: integer
                    format: int32
                    description: The current result page.
                limit:
                    type: integer
                    format: int32
                    description: The maximum number of records to return.
        flow.view.v2.ListViewsResponse:
            type: object
            properties:
                views:
                    type: array
                    items:
                        $ref: '#/components/schemas/flow.view.v2.View'
                pagination:
                    allOf:
                        - $ref: '#/components/schemas/common.pagination.v1.PaginationResponse'
        flow.view.v2.View:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                name:
                    type: string
                icon:
                    type: string
                filters:
                    type: string
                    description: JSON-encoded filter criteria for this saved view.
                group_by:
                    type: string
                sort_by:
                    type: string
                sort_dir:
                    type: string
                visibility:
                    type: string
                    description: |-
                        visibility is "shared" (every colleague in the business can use this view)
                        or "private" (only its creator). Empty means "shared", which is how every
                        view behaved before this field existed, so an older client keeps its
                        current reach rather than silently making views private.
            description: |-
                View is a saved filter/sort preset. Business-shared in v2: every member of
                the caller's business can list and use saved views, matching v1's
                workspace-sharing semantics, with a per-view visibility toggle: see
                `visibility` below.
        common.pagination.v1.PaginationResponse:
            type: object
            properties:
                page:
                    type: integer
                    format: int32
                    description: page is the current result page.
                limit:
                    type: integer
                    format: int32
                    description: limit is the maximum number of records to return.
                total:
                    type: integer
                    format: int32
                    description: total is the total number of matching records.
                total_pages:
                    type: integer
                    format: int32
                    description: total_pages is the total pages value for this contract.
                has_next:
                    type: boolean
                    description: has_next is the has next value for this contract.
                has_prev:
                    type: boolean
                    description: has_prev is the has prev value for this contract.
            description: Standard pagination response metadata.
        flow.view.v2.CreateViewRequest:
            type: object
            properties:
                name:
                    type: string
                icon:
                    type: string
                filters:
                    type: string
                    description: JSON-encoded filter criteria for this saved view.
                group_by:
                    type: string
                sort_by:
                    type: string
                sort_dir:
                    type: string
                visibility:
                    type: string
                    description: |-
                        visibility is "shared" (every colleague in the business can use this view)
                        or "private" (only its creator). Empty means "shared", which is how every
                        view behaved before this field existed, so an older client keeps its
                        current reach rather than silently making views private.
            required:
                - name
        flow.view.v2.CreateViewResponse:
            type: object
            properties:
                view:
                    allOf:
                        - $ref: '#/components/schemas/flow.view.v2.View'
        flow.view.v2.UpdateViewRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                name:
                    type: string
                icon:
                    type: string
                filters:
                    type: string
                    description: JSON-encoded filter criteria for this saved view.
                group_by:
                    type: string
                sort_by:
                    type: string
                sort_dir:
                    type: string
                visibility:
                    type: string
                    description: |-
                        visibility is "shared" (every colleague in the business can use this view)
                        or "private" (only its creator). Empty means "shared", which is how every
                        view behaved before this field existed, so an older client keeps its
                        current reach rather than silently making views private.
        flow.view.v2.UpdateViewResponse:
            type: object
        flow.view.v2.DeleteViewRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
        flow.view.v2.DeleteViewResponse:
            type: object
