openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /flow/status/v2/statuses:
        get:
            tags:
                - StatusService
            summary: listStatuses
            description: Returns one project's status set in sort order, empty when unconfigured.
            operationId: StatusService_listStatuses
            parameters:
                - name: project_id
                  in: query
                  description: |-
                    project_id scopes the listing to one project's set. Required: there is no
                    business-wide set to fall back on, and a listing across projects would
                    mix pipelines that have nothing to do with each other.
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: |-
                        project_id scopes the listing to one project's set. Required: there is no
                        business-wide set to fall back on, and a listing across projects would
                        mix pipelines that have nothing to do with each other.
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.status.v2.ListStatusesResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        post:
            tags:
                - StatusService
            summary: createStatus
            description: Creates a status in a project's set.
            operationId: StatusService_createStatus
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/flow.status.v2.CreateStatusRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.status.v2.CreateStatusResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /flow/status/v2/statuses/{id}:
        put:
            tags:
                - StatusService
            summary: updateStatus
            description: Replaces a status.
            operationId: StatusService_updateStatus
            parameters:
                - name: id
                  in: path
                  description: id is the status identifier.
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: id is the status identifier.
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/flow.status.v2.UpdateStatusBody'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.status.v2.UpdateStatusResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        delete:
            tags:
                - StatusService
            summary: deleteStatus
            description: Deletes a status, moving its tasks back to their built-in string status.
            operationId: StatusService_deleteStatus
            parameters:
                - name: id
                  in: path
                  description: id is the status identifier.
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: id is the status identifier.
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.status.v2.DeleteStatusResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /flow/status/v2/tasks/status:
        put:
            tags:
                - StatusService
            summary: setTaskStatus
            description: |-
                Applies a custom status to a task, or clears it with status_id zero.

                Lives here rather than on the task service, mirroring setTaskLabels in
                flow.label.v2: the capability that owns the concept owns the setter.
            operationId: StatusService_setTaskStatus
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/flow.status.v2.SetTaskStatusRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/flow.status.v2.SetTaskStatusResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        flow.status.v2.ListStatusesRequest:
            type: object
            properties:
                project_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: |-
                        project_id scopes the listing to one project's set. Required: there is no
                        business-wide set to fall back on, and a listing across projects would
                        mix pipelines that have nothing to do with each other.
            required:
                - project_id
        flow.status.v2.ListStatusesResponse:
            type: object
            properties:
                statuses:
                    type: array
                    items:
                        $ref: '#/components/schemas/flow.status.v2.Status'
                    description: |-
                        statuses is the project's set in `sort_order`, and is EMPTY for a project
                        that has not configured any. Empty means "use the built-ins", never
                        "this project has no statuses".
            required:
                - statuses
        flow.status.v2.Status:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: id is the unique identifier for the resource.
                project_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: |-
                        project_id is the project this status belongs to. Status sets are per
                        project by design: two projects in one business may run entirely different
                        pipelines.
                name:
                    type: string
                    description: name is what the user sees on the board. Unique within a project.
                bucket:
                    type: string
                    description: |-
                        bucket is the semantic meaning, one of "backlog", "active", "done" or
                        "cancelled".

                        It exists so a rollup can count across projects whose pipelines have
                        nothing in common: a project calling its in-flight state "Building" and
                        one calling it "Legal review" both report `active`.

                        The contract cannot express a closed set, so the server validates it and
                        rejects anything else with 400. Do not treat an unrecognised value as a
                        default; that is how a cancelled task would get counted as open.
                legacy_status:
                    type: string
                    description: |-
                        legacy_status is which of the six built-in values `Task.status` carries
                        while this status is applied: "backlog", "todo", "in_progress",
                        "in_review", "done" or "cancelled".

                        The string status column is not going away, so every existing query,
                        filter and index keeps working and no consumer has to learn about this
                        capability to stay correct. A custom status reports its nearest built-in.
                color:
                    type: string
                    description: color is the swatch shown on the board, as a hex string.
                sort_order:
                    type: integer
                    format: int32
                    description: sort_order is the position within the project's set, ascending.
                is_default:
                    type: boolean
                    description: |-
                        is_default marks the status a newly created task receives. At most one per
                        project, enforced by the server rather than by the schema, because MySQL
                        cannot express a partial unique index on it.
                created_at:
                    type: string
                    description: created_at is when the record was created.
            required:
                - id
                - project_id
                - name
                - bucket
                - legacy_status
                - color
                - sort_order
                - is_default
                - created_at
            description: |-
                Status is one entry in a project's own status set.

                Versioned v2 rather than v1 despite being a new capability. Every live flow
                capability is on v2 after the workspace removal, and v1 contracts are still
                being deleted, so a lone `flow/status/v1` would read as the older of two
                generations when it is the only one that exists. Nothing here has a v1
                history to be compatible with.

                A project with no statuses is the normal case, not an unconfigured one. It
                falls back to the six built-in string statuses, which is what makes the whole
                feature additive.
        flow.status.v2.CreateStatusRequest:
            type: object
            properties:
                project_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: project_id is the project to add the status to.
                name:
                    type: string
                    description: name must be unique within the project. A duplicate is rejected with 409.
                bucket:
                    type: string
                    description: bucket is one of "backlog", "active", "done", "cancelled".
                legacy_status:
                    type: string
                    description: |-
                        legacy_status is one of the six built-in values. Optional: when absent the
                        server derives it from the bucket, so a caller that does not care about
                        the compatibility column can leave it alone.
                color:
                    type: string
                    description: color is a hex string. Optional, server default applies.
                sort_order:
                    type: integer
                    format: int32
                    description: sort_order places the status in the set. Optional, appended when absent.
                is_default:
                    type: boolean
                    description: |-
                        is_default makes this the status new tasks receive, clearing the flag on
                        whichever status held it.
            required:
                - project_id
                - name
                - bucket
                - legacy_status
                - color
                - sort_order
                - is_default
        flow.status.v2.CreateStatusResponse:
            type: object
            properties:
                status:
                    allOf:
                        - $ref: '#/components/schemas/flow.status.v2.Status'
                    description: status is the created status, including the derived legacy_status.
            required:
                - status
        flow.status.v2.UpdateStatusRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: id is the status identifier.
                body:
                    allOf:
                        - $ref: '#/components/schemas/flow.status.v2.UpdateStatusBody'
            required:
                - id
                - body
        flow.status.v2.UpdateStatusBody:
            type: object
            properties:
                name:
                    type: string
                    description: name must remain unique within the project.
                bucket:
                    type: string
                    description: bucket is one of the four semantic buckets.
                color:
                    type: string
                    description: color is a hex string.
                legacy_status:
                    type: string
                    description: |-
                        legacy_status is one of the six built-in values, derived from the bucket
                        when absent.
                sort_order:
                    type: integer
                    format: int32
                    description: sort_order is the position within the set.
                is_default:
                    type: boolean
                    description: is_default makes this the status new tasks receive.
            required:
                - name
                - bucket
                - color
                - legacy_status
                - sort_order
                - is_default
            description: |-
                UpdateStatusBody is a replacement, so send the whole status.

                Only `name`, `bucket` and `color` are required. `legacy_status` stays
                optional for the same reason as on create, and nothing here is required
                merely because the row has a column for it: end_date on the HR staff body
                was @required for exactly that reason and it made every update to an active
                employee silently impossible.
        flow.status.v2.UpdateStatusResponse:
            type: object
            properties:
                status:
                    allOf:
                        - $ref: '#/components/schemas/flow.status.v2.Status'
                    description: status is the updated status.
            required:
                - status
        flow.status.v2.DeleteStatusRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: id is the status identifier.
            required:
                - id
        flow.status.v2.DeleteStatusResponse:
            type: object
            properties:
                message:
                    type: string
                    description: message is a human-readable result message.
                reassigned_task_count:
                    type: integer
                    format: int32
                    description: |-
                        reassigned_task_count is how many tasks fell back to their built-in string
                        status because they were on the deleted one.

                        Deleting a status never blocks on its tasks and never deletes them. The
                        server clears their status_id, and the string status they already carry
                        keeps them where the user left them.
            required:
                - message
                - reassigned_task_count
        flow.status.v2.SetTaskStatusRequest:
            type: object
            properties:
                task_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: task_id is the task to move.
                status_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: |-
                        status_id is the custom status to apply. Zero clears it, putting the task
                        back on its built-in string status.

                        Not @required @gt(0), because zero is the meaningful "no custom status"
                        value rather than a missing argument.
            required:
                - task_id
                - status_id
        flow.status.v2.SetTaskStatusResponse:
            type: object
            properties:
                message:
                    type: string
                    description: message is a human-readable result message.
                status:
                    type: string
                    description: |-
                        status is the resulting built-in string status the task now carries, so a
                        caller does not need a second request to keep its cached task correct.
            required:
                - message
                - status
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: StatusService
      description: |-
        StatusService manages per-project custom statuses.

        Board columns stay independent of statuses. T4 of the proposal preserves
        today's decoupling, so nothing here reads or writes flow_project_columns.
