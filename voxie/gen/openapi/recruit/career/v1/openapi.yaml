openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /recruit/career/v1/submissions:
        get:
            tags:
                - RecruitCareerService
            summary: listSubmissions
            description: Returns one page of submissions for this business.
            operationId: RecruitCareerService_listSubmissions
            parameters:
                - name: page
                  in: query
                  required: false
                  schema:
                    type: integer
                    format: int64
                - name: page_size
                  in: query
                  required: false
                  schema:
                    type: integer
                    format: int64
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/recruit.career.v1.ListSubmissionsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /recruit/career/v1/submissions/status:
        patch:
            tags:
                - RecruitCareerService
            summary: updateSubmissionStatus
            description: Advances a candidate through the hiring funnel.
            operationId: RecruitCareerService_updateSubmissionStatus
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/recruit.career.v1.UpdateSubmissionStatusBody'
                            description: body carries the submission id and new status bound from the HTTP payload.
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/recruit.career.v1.UpdateSubmissionStatusResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        recruit.career.v1.ListSubmissionsRequest:
            type: object
            properties:
                page:
                    type: integer
                    format: int64
                page_size:
                    type: integer
                    format: int64
            required:
                - page
                - page_size
            description: ListSubmissionsRequest selects submissions for this business.
        recruit.career.v1.ListSubmissionsResponse:
            type: object
            properties:
                submissions:
                    type: array
                    items:
                        $ref: '#/components/schemas/recruit.career.v1.Submission'
                total:
                    type: integer
                    format: int64
                page:
                    type: integer
                    format: int64
                page_size:
                    type: integer
                    format: int64
            required:
                - submissions
                - total
                - page
                - page_size
            description: ListSubmissionsResponse returns one page of submissions.
        recruit.career.v1.Submission:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                career_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                candidate_name:
                    type: string
                email:
                    type: string
                phone:
                    type: string
                resume_url:
                    type: string
                cover_letter:
                    type: string
                status:
                    type: string
                career_title:
                    type: string
                created_at:
                    type: string
                updated_at:
                    type: string
            required:
                - id
                - career_id
                - candidate_name
                - email
                - phone
                - resume_url
                - cover_letter
                - status
                - career_title
                - created_at
                - updated_at
            description: Submission is a candidate's application to one career.
        recruit.career.v1.UpdateSubmissionStatusRequest:
            type: object
            properties:
                body:
                    allOf:
                        - $ref: '#/components/schemas/recruit.career.v1.UpdateSubmissionStatusBody'
                    description: body carries the submission id and new status bound from the HTTP payload.
            required:
                - body
            description: UpdateSubmissionStatusRequest advances a candidate through the funnel.
        recruit.career.v1.UpdateSubmissionStatusBody:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: id identifies the submission to update.
                status:
                    type: string
                    description: 'status is one of: pending | reviewing | interview | offer | hired | rejected.'
            required:
                - id
                - status
            description: UpdateSubmissionStatusBody carries the status transition.
        recruit.career.v1.UpdateSubmissionStatusResponse:
            type: object
            properties:
                message:
                    type: string
                    description: message is a human-readable result.
            required:
                - message
            description: UpdateSubmissionStatusResponse confirms the transition.
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: RecruitCareerService
      description: |-
        RecruitCareerService defines the read surface for recruit submissions and
        the status transition endpoint. Create/update of careers and sections stay
        on legacy routes until that migration happens.
