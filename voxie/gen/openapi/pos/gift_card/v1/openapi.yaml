openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /pos/gift-card/v1/gift-cards:
        get:
            tags:
                - GiftCardService
            summary: listGiftCards
            description: Returns gift cards for the active business.
            operationId: GiftCardService_listGiftCards
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pos.gift_card.v1.ListGiftCardsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        post:
            tags:
                - GiftCardService
            summary: createGiftCard
            description: Issues a new gift card.
            operationId: GiftCardService_createGiftCard
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/pos.gift_card.v1.CreateGiftCardRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pos.gift_card.v1.CreateGiftCardResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /pos/gift-card/v1/gift-cards/{code}/redeem:
        post:
            tags:
                - GiftCardService
            summary: redeemGiftCard
            description: Redeems an amount from a gift card by code.
            operationId: GiftCardService_redeemGiftCard
            parameters:
                - name: code
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                order_id:
                                    exclusiveMinimum: 0
                                    type: string
                                    pattern: ^-?[0-9]+$
                                    format: int64
                                    description: order_id identifies the POS order receiving this gift-card tender.
                                amount:
                                    exclusiveMinimum: 0
                                    type: number
                                    format: double
                            required:
                                - order_id
                                - amount
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pos.gift_card.v1.RedeemGiftCardResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /pos/gift-card/v1/gift-cards/{code}:
        get:
            tags:
                - GiftCardService
            summary: getGiftCardByCode
            description: Returns a gift card by code.
            operationId: GiftCardService_getGiftCardByCode
            parameters:
                - name: code
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pos.gift_card.v1.GetGiftCardByCodeResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        pos.gift_card.v1.ListGiftCardsRequest:
            type: object
        pos.gift_card.v1.ListGiftCardsResponse:
            type: object
            properties:
                gift_cards:
                    type: array
                    items:
                        $ref: '#/components/schemas/pos.gift_card.v1.GiftCard'
            required:
                - gift_cards
        pos.gift_card.v1.GiftCard:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                owner_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: owner_id identifies the tenant that owns the resource.
                business_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: business_id identifies the active business.
                customer_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: customer_id identifies the linked customer when present.
                code:
                    type: string
                initial_amount:
                    type: number
                    format: double
                current_balance:
                    type: number
                    format: double
                customer_name:
                    type: string
                customer_email:
                    type: string
                is_active:
                    type: boolean
                expires_at:
                    type: string
                created_at:
                    type: string
                    description: created_at is when the record was created.
                updated_at:
                    type: string
                    description: updated_at is when the record was last updated.
            required:
                - id
                - owner_id
                - business_id
                - customer_id
                - code
                - initial_amount
                - current_balance
                - customer_name
                - customer_email
                - is_active
                - expires_at
                - created_at
                - updated_at
            description: GiftCard is a stored-value card that can be issued to and redeemed by a customer.
        pos.gift_card.v1.CreateGiftCardRequest:
            type: object
            properties:
                code:
                    type: string
                paid_order_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: |-
                        paid_order_id must identify a paid POS order for this business. The
                        server uses it as the tender reference for the liability entry.
                initial_amount:
                    exclusiveMinimum: 0
                    type: number
                    format: double
                customer_name:
                    type: string
                customer_email:
                    type: string
                    format: email
                expires_at:
                    type: string
            required:
                - code
                - paid_order_id
                - initial_amount
                - customer_name
                - customer_email
                - expires_at
        pos.gift_card.v1.CreateGiftCardResponse:
            type: object
            properties:
                gift_card_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                message:
                    type: string
            required:
                - gift_card_id
                - message
        pos.gift_card.v1.RedeemGiftCardRequest:
            type: object
            properties:
                code:
                    type: string
                order_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: order_id identifies the POS order receiving this gift-card tender.
                amount:
                    exclusiveMinimum: 0
                    type: number
                    format: double
            required:
                - code
                - order_id
                - amount
        pos.gift_card.v1.RedeemGiftCardResponse:
            type: object
            properties:
                gift_card:
                    allOf:
                        - $ref: '#/components/schemas/pos.gift_card.v1.GiftCard'
                message:
                    type: string
            required:
                - gift_card
                - message
        pos.gift_card.v1.GetGiftCardByCodeRequest:
            type: object
            properties:
                code:
                    type: string
            required:
                - code
        pos.gift_card.v1.GetGiftCardByCodeResponse:
            type: object
            properties:
                gift_card:
                    allOf:
                        - $ref: '#/components/schemas/pos.gift_card.v1.GiftCard'
            required:
                - gift_card
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: GiftCardService
      description: GiftCardService defines POS gift card endpoints.
