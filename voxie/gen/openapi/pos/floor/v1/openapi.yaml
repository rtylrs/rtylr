openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /pos/floor/v1/floors:
        get:
            tags:
                - FloorService
            summary: listFloors
            description: Returns floors, optionally filtered by branch.
            operationId: FloorService_listFloors
            parameters:
                - name: branch_id
                  in: query
                  required: false
                  schema:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pos.floor.v1.ListFloorsResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        post:
            tags:
                - FloorService
            summary: createFloor
            description: Creates a new floor.
            operationId: FloorService_createFloor
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/pos.floor.v1.CreateFloorRequest'
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pos.floor.v1.CreateFloorResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
    /pos/floor/v1/floors/{id}:
        put:
            tags:
                - FloorService
            summary: updateFloor
            description: Updates an existing floor.
            operationId: FloorService_updateFloor
            parameters:
                - name: id
                  in: path
                  description: id is the unique identifier for the floor.
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: id is the unique identifier for the floor.
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/pos.floor.v1.UpdateFloorBody'
                            description: body carries updatable floor fields bound from the HTTP payload.
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pos.floor.v1.UpdateFloorResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
        delete:
            tags:
                - FloorService
            summary: deleteFloor
            description: Removes a floor by ID.
            operationId: FloorService_deleteFloor
            parameters:
                - name: id
                  in: path
                  description: id is the unique identifier for the floor.
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: id is the unique identifier for the floor.
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pos.floor.v1.DeleteFloorResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        pos.floor.v1.ListFloorsRequest:
            type: object
            properties:
                branch_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            required:
                - branch_id
        pos.floor.v1.ListFloorsResponse:
            type: object
            properties:
                floors:
                    type: array
                    items:
                        $ref: '#/components/schemas/pos.floor.v1.Floor'
            required:
                - floors
        pos.floor.v1.Floor:
            type: object
            properties:
                id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                business_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                branch_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                sort_order:
                    type: integer
                    format: int32
                is_active:
                    type: boolean
                created_at:
                    type: string
                    description: created_at is when the record was created.
            required:
                - id
                - business_id
                - branch_id
                - name
                - sort_order
                - is_active
                - created_at
            description: Floor is a physical seating area within a branch.
        pos.floor.v1.CreateFloorRequest:
            type: object
            properties:
                branch_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                name:
                    type: string
                sort_order:
                    exclusiveMinimum: 0
                    type: integer
                    format: int32
            required:
                - branch_id
                - name
                - sort_order
        pos.floor.v1.CreateFloorResponse:
            type: object
            properties:
                floor_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                message:
                    type: string
            required:
                - floor_id
                - message
        pos.floor.v1.UpdateFloorRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: id is the unique identifier for the floor.
                body:
                    allOf:
                        - $ref: '#/components/schemas/pos.floor.v1.UpdateFloorBody'
                    description: body carries updatable floor fields bound from the HTTP payload.
            required:
                - id
                - body
        pos.floor.v1.UpdateFloorBody:
            type: object
            properties:
                name:
                    type: string
                sort_order:
                    exclusiveMinimum: 0
                    type: integer
                    format: int32
            required:
                - name
                - sort_order
        pos.floor.v1.UpdateFloorResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        pos.floor.v1.DeleteFloorRequest:
            type: object
            properties:
                id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                    description: id is the unique identifier for the floor.
            required:
                - id
        pos.floor.v1.DeleteFloorResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: FloorService
      description: FloorService defines POS floor plan endpoints.
