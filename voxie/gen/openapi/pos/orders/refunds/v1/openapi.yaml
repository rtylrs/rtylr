openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /pos/orders/refunds/v1/orders/{order_id}/refund:
        post:
            tags:
                - OrderRefundService
            summary: processRefund
            operationId: OrderRefundService_processRefund
            parameters:
                - name: order_id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                amount:
                                    exclusiveMinimum: 0
                                    type: number
                                    format: double
                                reason:
                                    type: string
                            required:
                                - amount
                                - reason
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pos.orders.refunds.v1.ProcessRefundResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        pos.orders.refunds.v1.ProcessRefundRequest:
            type: object
            properties:
                order_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                amount:
                    exclusiveMinimum: 0
                    type: number
                    format: double
                reason:
                    type: string
            required:
                - order_id
                - amount
                - reason
        pos.orders.refunds.v1.ProcessRefundResponse:
            type: object
            properties:
                refund_id:
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                message:
                    type: string
            required:
                - refund_id
                - message
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: OrderRefundService
