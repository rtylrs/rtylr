openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /pos/orders/items/v1/orders/{order_id}/items/{item_id}/status:
        put:
            tags:
                - OrderItemService
            summary: updateOrderItemStatus
            operationId: OrderItemService_updateOrderItemStatus
            parameters:
                - name: order_id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                - name: item_id
                  in: path
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/pos.orders.items.v1.UpdateOrderItemStatusBody'
                            description: body carries the new order item status bound from the HTTP payload.
                required: true
            responses:
                default:
                    description: Unexpected error
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pos.orders.items.v1.UpdateOrderItemStatusResponse'
                "400":
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/onekit.ErrorMessage'
components:
    schemas:
        pos.orders.items.v1.UpdateOrderItemStatusRequest:
            type: object
            properties:
                order_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                item_id:
                    exclusiveMinimum: 0
                    type: string
                    pattern: ^-?[0-9]+$
                    format: int64
                body:
                    allOf:
                        - $ref: '#/components/schemas/pos.orders.items.v1.UpdateOrderItemStatusBody'
                    description: body carries the new order item status bound from the HTTP payload.
            required:
                - order_id
                - item_id
                - body
        pos.orders.items.v1.UpdateOrderItemStatusBody:
            type: object
            properties:
                status:
                    type: string
                    description: status is the current lifecycle state.
            required:
                - status
        pos.orders.items.v1.UpdateOrderItemStatusResponse:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
        onekit.ErrorMessage:
            type: object
            properties:
                message:
                    type: string
            required:
                - message
tags:
    - name: OrderItemService
