openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /pos/orders/splits/v1/orders/{order_id}/split:
        post:
            tags:
                - OrderSplitService
            summary: splitOrder
            operationId: OrderSplitService_splitOrder
            parameters:
                - name: order_id
                  in: path
                  required: true
                  schema:
                    type: string
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/pos.orders.splits.v1.SplitOrderRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pos.orders.splits.v1.SplitOrderResponse'
components:
    schemas:
        pos.orders.splits.v1.SplitOrderRequest:
            type: object
            properties:
                order_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                splits:
                    type: array
                    items:
                        $ref: '#/components/schemas/pos.orders.v1.SplitGroup'
                    minItems: 1
        pos.orders.v1.SplitGroup:
            type: object
            properties:
                item_ids:
                    type: array
                    items:
                        type: string
                        format: int64
        pos.orders.splits.v1.SplitOrderResponse:
            type: object
            properties:
                order_ids:
                    type: array
                    items:
                        type: string
                        format: int64
                message:
                    type: string
