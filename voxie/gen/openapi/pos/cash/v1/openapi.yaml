openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /pos/cash/v1/movements:
        get:
            tags:
                - CashService
            summary: listCashMovements
            description: Returns cash movements for a given session.
            operationId: CashService_listCashMovements
            parameters:
                - name: session_id
                  in: query
                  required: true
                  schema:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pos.cash.v1.ListCashMovementsResponse'
    /pos/cash/v1/drop:
        post:
            tags:
                - CashService
            summary: cashDrop
            description: Records a cash drop.
            operationId: CashService_cashDrop
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/pos.cash.v1.CashDropRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pos.cash.v1.CashDropResponse'
    /pos/cash/v1/pickup:
        post:
            tags:
                - CashService
            summary: cashPickup
            description: Records a cash pickup.
            operationId: CashService_cashPickup
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/pos.cash.v1.CashPickupRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pos.cash.v1.CashPickupResponse'
    /pos/cash/v1/adjust:
        post:
            tags:
                - CashService
            summary: cashAdjust
            description: Records a cash drawer adjustment.
            operationId: CashService_cashAdjust
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/pos.cash.v1.CashAdjustRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pos.cash.v1.CashAdjustResponse'
components:
    schemas:
        pos.cash.v1.ListCashMovementsRequest:
            type: object
            properties:
                session_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
            required:
                - session_id
        pos.cash.v1.ListCashMovementsResponse:
            type: object
            properties:
                movements:
                    type: array
                    items:
                        $ref: '#/components/schemas/pos.cash.v1.CashMovement'
            required:
                - movements
        pos.cash.v1.CashMovement:
            type: object
            properties:
                id:
                    type: string
                    format: int64
                business_id:
                    type: string
                    format: int64
                branch_id:
                    type: string
                    format: int64
                terminal_id:
                    type: string
                    format: int64
                session_id:
                    type: string
                    format: int64
                employee_id:
                    type: string
                    format: int64
                type:
                    type: string
                amount:
                    type: number
                    format: double
                reason:
                    type: string
                approved_by:
                    type: string
                    format: int64
                created_at:
                    type: string
                    description: created_at is when the record was created.
            required:
                - id
                - business_id
                - branch_id
                - session_id
                - employee_id
                - type
                - amount
                - created_at
            description: CashMovement is a recorded cash drawer movement.
        pos.cash.v1.CashDropRequest:
            type: object
            properties:
                branch_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                terminal_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                session_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                employee_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                amount:
                    exclusiveMinimum: 0
                    type: number
                    format: double
                reason:
                    type: string
            required:
                - branch_id
                - terminal_id
                - session_id
                - employee_id
                - amount
                - reason
        pos.cash.v1.CashDropResponse:
            type: object
            properties:
                movement_id:
                    type: string
                    format: int64
                message:
                    type: string
            required:
                - movement_id
                - message
        pos.cash.v1.CashPickupRequest:
            type: object
            properties:
                branch_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                terminal_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                session_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                employee_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                amount:
                    exclusiveMinimum: 0
                    type: number
                    format: double
                reason:
                    type: string
            required:
                - branch_id
                - terminal_id
                - session_id
                - employee_id
                - amount
                - reason
        pos.cash.v1.CashPickupResponse:
            type: object
            properties:
                movement_id:
                    type: string
                    format: int64
                message:
                    type: string
            required:
                - movement_id
                - message
        pos.cash.v1.CashAdjustRequest:
            type: object
            properties:
                branch_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                terminal_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                session_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                employee_id:
                    exclusiveMinimum: 0
                    type: string
                    format: int64
                amount:
                    exclusiveMinimum: 0
                    type: number
                    format: double
                reason:
                    type: string
            required:
                - branch_id
                - terminal_id
                - session_id
                - employee_id
                - amount
                - reason
        pos.cash.v1.CashAdjustResponse:
            type: object
            properties:
                movement_id:
                    type: string
                    format: int64
                message:
                    type: string
            required:
                - movement_id
                - message
