openapi: 3.1.0
info:
    title: Voxie API
    version: 1.0.0
paths:
    /pos/day-summary/v1/day-summary:
        get:
            tags:
                - DaySummaryService
            summary: daySummary
            description: Returns aggregate sales, tax, tips, and payment breakdown for a given day.
            operationId: DaySummaryService_daySummary
            parameters:
                - name: date
                  in: query
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/pos.day_summary.v1.DaySummaryResponse'
components:
    schemas:
        pos.day_summary.v1.DaySummaryRequest:
            type: object
            properties:
                date:
                    type: string
            required:
                - date
        pos.day_summary.v1.DaySummaryResponse:
            type: object
            properties:
                total_sales:
                    type: number
                    format: double
                total_tax:
                    type: number
                    format: double
                total_tips:
                    type: number
                    format: double
                total_refunds:
                    type: number
                    format: double
                total_orders:
                    type: integer
                    format: int32
                payment_breakdown:
                    type: object
                    additionalProperties:
                        type: number
                        format: double
