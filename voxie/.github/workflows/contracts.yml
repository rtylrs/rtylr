name: Contracts

on:
  push:
    branches: [main]
    paths-ignore:
      - "gen/**"
      - "go.mod"
      - "go.sum"
      - "pnpm-lock.yaml"
  workflow_dispatch:

concurrency:
  group: contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Generate & Verify
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Generate from the PR source commit, not GitHub's synthetic merge
          # commit, so the generated commit contains only the PR's output.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Add GOPATH/bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Regenerate contracts
        run: |
          make generate
          go mod tidy

      - name: Build & vet generated Go code
        run: |
          go build ./...
          go vet ./...

      - name: Typecheck generated TypeScript code
        run: make typecheck

      - name: Commit regenerated contracts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "$(git status --porcelain -- gen/ go.mod go.sum pnpm-lock.yaml)" ]; then
            echo "Generated contracts are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- gen/ go.mod go.sum pnpm-lock.yaml
          git commit -m "chore: regenerate contracts"
          git push

      - name: Verify generated contracts are current
        run: |
          if [ -n "$(git status --porcelain -- gen/ go.mod go.sum pnpm-lock.yaml)" ]; then
            echo "::error::Generated contracts are out of date after regeneration."
            exit 1
          fi
          echo "Generated contracts are up to date."
