name: Contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "gen/**"

jobs:
  verify:
    name: Lint, Breaking & Generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Add GOPATH/bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.65.0

      - name: buf lint
        run: make lint

      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: make breaking

      - name: Regenerate contracts
        run: |
          make generate
          go mod tidy

      - name: Build & vet generated code
        run: |
          go build ./...
          go vet ./...

      - name: Fail PR on drift
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code -- gen/ go.mod go.sum || {
            echo "::error::gen/go is out of date with the proto sources. Run 'make generate' locally and commit gen/, go.mod, and go.sum."
            exit 1
          }

      - name: Commit regenerated contracts
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- gen/ go.mod go.sum; then
            echo "gen/go already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gen/ go.mod go.sum
          git commit -m "Regenerate contracts [skip ci]"
          git push
