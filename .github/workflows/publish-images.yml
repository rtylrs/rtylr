name: Publish public images

# Builds the PUBLIC self-host frontend images docker.io/rtylr/<app> for the 10
# rtylr apps. Triggered by a version bump in voxire/rtylr-version
# (repository_dispatch "rtylr-release") or manually with a version. NOT on normal
# pushes — day-to-day CI deploys to Cloudflare Pages and never publishes images.
on:
  repository_dispatch:
    types: [rtylr-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Suite version tag (e.g. 1.0.0)'
        required: true
        type: string

jobs:
  build:
    name: Build all apps
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Generate contracts
        run: pnpm contracts:sync

      - name: Build
        run: pnpm turbo build

      - name: Resolve version
        id: v
        env:
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${DISPATCH_VERSION:-$INPUT_VERSION}"
          if [ -z "$VERSION" ]; then echo "no version supplied"; exit 1; fi
          # Restrict to a safe Docker-tag charset (dispatch payload is trusted-org
          # but validate anyway — no shell metachars reach the build).
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z._-]{0,127}$'; then
            echo "invalid version tag: $VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload built dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
          include-hidden-files: true

  publish:
    name: Publish rtylr/${{ matrix.app }}
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        app: [auth, dash, erp, hr, crm, finance, flow, insights, recruit, menu]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push public image
        env:
          APP: ${{ matrix.app }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          PUB="docker.io/rtylr/${APP}"
          docker buildx build \
            -f docker/frontend.Dockerfile \
            --build-arg APP="$APP" \
            -t "$PUB:$VERSION" \
            -t "$PUB:latest" \
            --push \
            .
          echo "Published $PUB:$VERSION + :latest"
