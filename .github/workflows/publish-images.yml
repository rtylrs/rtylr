name: Publish public images

# Builds the PUBLIC self-host frontend images docker.io/rtylr/<app> for the 10
# rtylr apps. Triggered by a version bump in tryrtylr/rtylr-version
# (repository_dispatch "rtylr-release") or manually with a version. NOT on normal
# pushes — day-to-day CI deploys to Cloudflare Pages and never publishes images.
on:
  repository_dispatch:
    types: [rtylr-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Suite version tag (e.g. 1.0.0)'
        required: true
        type: string

jobs:
  build:
    name: Build all apps
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: voxie/go.mod

      - name: Generate contracts
        run: make -C voxie generate

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/rtylr/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/rtylr
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: apps/rtylr
        run: pnpm build

      - name: Resolve version
        id: v
        env:
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${DISPATCH_VERSION:-$INPUT_VERSION}"
          if [ -z "$VERSION" ]; then echo "no version supplied"; exit 1; fi
          # Restrict to a safe Docker-tag charset (dispatch payload is trusted-org
          # but validate anyway — no shell metachars reach the build).
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z._-]{0,127}$'; then
            echo "invalid version tag: $VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Hand dist/ to the publish matrix via S3 (the org's GitHub Actions
      # artifact storage is quota-blocked; voxire-ci-artifacts is the shared path).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Sync dist to S3
        working-directory: apps/rtylr
        run: aws s3 sync dist/ s3://voxire-ci-artifacts/${{ github.sha }}/dist/ --delete --no-progress

  publish:
    name: Publish rtylr/${{ matrix.app }}
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        app: [auth, dash, erp, hr, crm, finance, flow, insights, recruit, menu]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Download app dist from S3
        working-directory: apps/rtylr
        env:
          APP: ${{ matrix.app }}
        run: aws s3 sync "s3://voxire-ci-artifacts/${{ github.sha }}/dist/${APP}/" "dist/${APP}/" --no-progress

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push public image
        working-directory: apps/rtylr
        env:
          APP: ${{ matrix.app }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          PUB="docker.io/rtylr/${APP}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f docker/frontend.Dockerfile \
            --build-arg APP="$APP" \
            -t "$PUB:$VERSION" \
            -t "$PUB:latest" \
            --push \
            .
          echo "Published $PUB:$VERSION + :latest"
