name: Build a release ECS image

# Builds an exact source release and pushes it as an immutable ECR tag.
# deploy.yml runs this while the database migrates, then ships the tag with
# deploy-ecs-release.yml. Nothing in this workflow runs on a source push.
on:
  workflow_call:
    inputs:
      source_repository:
        description: Repository containing the release
        required: true
        type: string
      source_ref:
        description: GitHub release tag to checkout
        required: true
        type: string
      version:
        description: Immutable image tag
        required: true
        type: string
      dockerfile:
        description: Dockerfile relative to the source repository root
        required: true
        type: string
      image_repository:
        description: ECR repository path without the registry hostname
        required: true
        type: string
      go_package:
        description: >-
          Package (relative to the Dockerfile) that its builder stage compiles.
          When set, the runner compiles it with the cached Go state and the
          result replaces that stage.
        required: false
        default: ""
        type: string
      ecr_registry:
        description: ECR registry hostname
        required: false
        default: 101533649486.dkr.ecr.eu-west-1.amazonaws.com
        type: string
      runs_on:
        description: Runner label
        required: false
        default: ubuntu-24.04
        type: string
    secrets:
      PAT_TOKEN:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  build:
    name: Build ${{ inputs.image_repository }}:${{ inputs.version }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 45
    env:
      IMAGE_URI: ${{ inputs.ecr_registry }}/${{ inputs.image_repository }}:${{ inputs.version }}
    steps:
      - name: Verify GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: gh api "repos/$SOURCE_REPOSITORY/releases/tags/$SOURCE_REF" --silent

      - name: Require AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            exit 0
          fi
          echo 'AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY must be passed to the ECS image build' >&2
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        env:
          ECR_REGISTRY: ${{ inputs.ecr_registry }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      # A release tag always names the same commit, so a redeploy or a re-run
      # can ship the image an earlier run already pushed.
      - name: Check for an existing image
        id: existing
        run: |
          if docker buildx imagetools inspect "$IMAGE_URI" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE_URI is already pushed; not rebuilding it"
          fi

      - name: Checkout promoted source release
        if: steps.existing.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Verify generated contract reference
        if: steps.existing.outputs.exists != 'true'
        run: |
          if [ -x ./scripts/check-voxie-ref.sh ]; then
            ./scripts/check-voxie-ref.sh
          fi

      - name: Resolve source commit
        if: steps.existing.outputs.exists != 'true'
        id: source
        run: |
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # A builder stage starts cold on every fresh runner, so the binary is
      # compiled here, where the Go caches apply. A tag cut before this script
      # existed builds entirely in Docker.
      - name: Read the Go version from the Dockerfile
        id: go
        if: >-
          steps.existing.outputs.exists != 'true' && inputs.go_package != '' &&
          hashFiles('.github/scripts/build-onion-binaries.sh') != ''
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^FROM .*golang:\([0-9][0-9.]*\)-.*/\1/p' "$DOCKERFILE" | head -n 1)"
          if [ -z "$version" ]; then
            echo "$DOCKERFILE has no golang builder stage" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        id: setup-go
        if: steps.go.outputs.version != ''
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false

      # Both caches are saved by go-build-cache.yml after each push to main, so
      # the build cache holds the previous release's compiled packages. Keep
      # these keys in step with that workflow.
      - name: Restore the Go module cache
        if: steps.go.outputs.version != ''
        uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}

      - name: Restore the Go build cache
        if: steps.go.outputs.version != ''
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ github.sha }}
          restore-keys: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-

      - name: Compile the binary
        if: steps.go.outputs.version != ''
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          GO_PACKAGE: ${{ inputs.go_package }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ steps.source.outputs.sha }}
          BUILD_TIME: ${{ steps.source.outputs.build_time }}
        run: .github/scripts/build-onion-binaries.sh "$DOCKERFILE" "$RUNNER_TEMP/builder" "$GO_PACKAGE"

      - name: Set up Docker Buildx
        if: steps.existing.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3
        with:
          # The runner is discarded anyway; removing the builder took ~10s.
          cleanup: false

      # build-push-action hands buildx the Actions runtime token the gha cache
      # needs. A plain `docker buildx build` step never had it, so every build
      # started cold.
      - name: Build and push immutable image
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          build-contexts: ${{ steps.go.outputs.version != '' && format('builder={0}/builder', runner.temp) || '' }}
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ steps.source.outputs.sha }}
            BUILD_TIME=${{ steps.source.outputs.build_time }}
          tags: ${{ env.IMAGE_URI }}
          push: true
          cache-from: type=gha,scope=${{ inputs.image_repository }}
          cache-to: type=gha,scope=${{ inputs.image_repository }},mode=max
