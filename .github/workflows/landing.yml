name: Landing

# Two jobs, in order.
#
#   checks   every gate the landing has, run on pushes and on pull requests.
#   version  release metadata, only once checks is green and never on a PR.
#
# The gate is the tag. There is no branch protection on this repo, so nothing
# stops a red merge, but a red run produces no tag and tryrtylr/deploy can
# only promote a tag. A daily automated publish therefore cannot reach
# production on a broken build.
on:
  push:
    branches: [main]
    paths:
      - 'clients/web/landing/**'
      - 'clients/packages/**'
      - 'clients/pnpm-lock.yaml'
  pull_request:
    paths:
      - 'clients/web/landing/**'
      - 'clients/packages/**'
      - 'clients/pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  checks:
    name: checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: clients
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: clients/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: clients/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @rtylr/landing typecheck

      # build comes before test:unit, and it is not an ordering preference.
      # tests/unit reads the static export out of dist/landing and its before()
      # hook aborts when that directory is absent, so a unit run on a fresh
      # checkout fails for want of a build rather than for want of a bug. The
      # og-images check scans the same export.
      - name: Build
        run: pnpm --filter @rtylr/landing build

      - name: Unit tests
        run: pnpm --filter @rtylr/landing test:unit

      - name: Open Graph images are current
        run: node web/landing/scripts/generate-og-images.mjs --check

      - name: Install Playwright chromium
        run: pnpm --filter @rtylr/landing exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter @rtylr/landing test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: clients/web/landing/playwright-report
          retention-days: 7

  version:
    name: Calculate next landing version
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.next.outputs.version }}
      release_tag: ${{ steps.next.outputs.release_tag }}
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: next
        run: |
          set -euo pipefail
          version="$(.github/scripts/next-app-version.sh rtylr-landing 0.0.1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=rtylr-landing-v$version" >> "$GITHUB_OUTPUT"
          echo "Creating repository version rtylr-landing-v$version"

  release:
    name: Create landing version
    needs: version
    uses: tryrtylr/pipelines/.github/workflows/create-release.yml@main
    with:
      release_tag: ${{ needs.version.outputs.release_tag }}
      release_name: rtylr landing v${{ needs.version.outputs.version }}
      version: ${{ needs.version.outputs.version }}
      notes: 'Source version for landing at ${{ github.sha }}. Build and deployment are controlled by tryrtylr/deploy.'
