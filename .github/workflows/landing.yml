name: Landing

# Every gate the landing has, run on pushes and pull requests. Releases are
# cut and deployed by .github/workflows/release.yml.
on:
  push:
    branches: [main]
    paths:
      - 'clients/web/landing/**'
      - 'clients/packages/**'
      - 'clients/pnpm-lock.yaml'
  pull_request:
    paths:
      - 'clients/web/landing/**'
      - 'clients/packages/**'
      - 'clients/pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: clients
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: clients/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: clients/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @rtylr/landing typecheck

      # build comes before test:unit, and it is not an ordering preference.
      # tests/unit reads the static export out of dist/landing and its before()
      # hook aborts when that directory is absent, so a unit run on a fresh
      # checkout fails for want of a build rather than for want of a bug. The
      # og-images check scans the same export.
      - name: Build
        run: pnpm --filter @rtylr/landing build

      - name: Unit tests
        run: pnpm --filter @rtylr/landing test:unit

      - name: Library tests
        run: pnpm --filter @rtylr/landing test:lib

      - name: Open Graph images are current
        run: node web/landing/scripts/generate-og-images.mjs --check

      - name: Install Playwright chromium
        run: pnpm --filter @rtylr/landing exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter @rtylr/landing test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: clients/web/landing/playwright-report
          retention-days: 7

