name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      (contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')) &&
      contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout PR (inline review comment)
        if: github.event_name == 'pull_request_review_comment'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Checkout PR (issue comment on PR)
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/merge
          fetch-depth: 0

      - name: Checkout repository (plain issue)
        if: github.event_name == 'issue_comment' && !github.event.issue.pull_request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Configure OpenCode Go credentials
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: |
          if [ -z "$OPENCODE_GO_API_KEY" ]; then
            echo "OPENCODE_GO_API_KEY secret is not set" >&2
            exit 1
          fi
          mkdir -p ~/.local/share/opencode
          python3 - <<'EOF'
          import json, os
          p = os.path.expanduser('~/.local/share/opencode/auth.json')
          try:
              with open(p) as f:
                  data = json.load(f)
          except (FileNotFoundError, ValueError):
              data = {}
          data['opencode-go'] = {'type': 'api', 'key': os.environ['OPENCODE_GO_API_KEY']}
          with open(p, 'w') as f:
              json.dump(data, f)
          os.chmod(p, 0o600)
          EOF

      - name: Run OpenCode
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # latest
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/muse-spark-1.3-contributor
          use_github_token: true
