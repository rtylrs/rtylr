# Copied from rtylrs/pipelines@main on 2026-10-19. rtylr is public, and a public
# repository cannot call reusable workflows from a private one.

name: Deploy a promoted Pages release

# Builds and deploys one immutable source release. This workflow is only
# called by a deploy adapter after tryrtylr/deploy promotes a manifest.
on:
  workflow_call:
    inputs:
      source_repository:
        description: Private source repository containing the release
        required: true
        type: string
      source_ref:
        description: GitHub release tag to checkout
        required: true
        type: string
      app_filter:
        description: pnpm filter target
        required: false
        default: ""
        type: string
      build_script:
        description: pnpm script to run for the promoted build
        required: false
        default: build
        type: string
      dist_dir:
        description: Built distribution directory, resolved relative to working_directory
        required: true
        type: string
      working_directory:
        description: Directory holding the app's pnpm workspace, relative to the repository root
        required: false
        default: "."
        type: string
      project_name:
        description: Cloudflare Pages project name
        required: true
        type: string
      node_version:
        description: Node.js version used for the promoted build
        required: false
        default: "22"
        type: string
      runs_on:
        description: Runner label
        required: false
        default: ubuntu-24.04
        type: string
    secrets:
      PAT_TOKEN:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.151.3

jobs:
  deploy:
    name: Deploy ${{ inputs.project_name }} from ${{ inputs.source_ref }}
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: Verify GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: gh api "repos/$SOURCE_REPOSITORY/releases/tags/$SOURCE_REF" --silent

      - name: Checkout promoted source release
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.PAT_TOKEN || github.token }}
          # The build installs and runs npm packages; keep the token out of
          # .git/config.
          persist-credentials: false
          # Full history: the landing sitemap dates every URL from
          # `git log -1 -- <file>`, and a depth-1 clone collapses all 23 URLs
          # to the tip commit date (tryrtylr/rtylr#1358). That needs commits
          # and trees only, so old file contents stay on the server.
          fetch-depth: 0
          filter: blob:none

      # Generated contracts are gitignored, so they must be produced from the
      # release tag before the app builds. The prebuilt onek release generates
      # the same output as `go install`, which compiled onek on every deploy;
      # `make generate` skips its install when this version is on PATH.
      - name: Install onek
        if: hashFiles('voxie/onekit.toml') != ''
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ONK_VERSION := v//p' voxie/Makefile)"
          if [ -z "$version" ]; then
            echo "voxie/Makefile does not pin ONK_VERSION" >&2
            exit 1
          fi
          archive="onekit_${version}_Linux_x86_64.tar.gz"
          release="https://github.com/1homsi/onekit/releases/download/v$version"
          mkdir -p "$RUNNER_TEMP/onek"
          cd "$RUNNER_TEMP/onek"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors -O "$release/$archive" -O "$release/checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum --check --status
          tar -xzf "$archive" onek
          echo "$RUNNER_TEMP/onek" >> "$GITHUB_PATH"

      - name: Generate contracts
        if: hashFiles('voxie/onekit.toml') != ''
        run: make -C voxie generate

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ inputs.working_directory }}/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm
          # The lockfile may sit at the repository root even when the build runs
          # in a nested workspace, so glob rather than assume a directory.
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: pnpm install --frozen-lockfile

      - name: Build promoted app
        working-directory: ${{ inputs.working_directory }}
        env:
          APP_FILTER: ${{ inputs.app_filter }}
          BUILD_SCRIPT: ${{ inputs.build_script }}
        run: |
          set -euo pipefail
          if [ -n "$APP_FILTER" ]; then
            pnpm --filter "$APP_FILTER" run "$BUILD_SCRIPT"
          else
            pnpm run "$BUILD_SCRIPT"
          fi

      # A pinned wrangler, cached, instead of `npx wrangler` fetching the
      # latest release (and its ~200 MB of dependencies) on every deploy.
      - name: Restore wrangler
        id: wrangler-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/wrangler
          key: wrangler-${{ env.WRANGLER_VERSION }}-${{ runner.os }}-${{ runner.arch }}-node${{ inputs.node_version }}

      - name: Install wrangler
        if: steps.wrangler-cache.outputs.cache-hit != 'true'
        run: npm install --prefix "$RUNNER_TEMP/wrangler" --no-audit --no-fund "wrangler@$WRANGLER_VERSION"

      - name: Deploy promoted app to Cloudflare Pages
        working-directory: ${{ inputs.working_directory }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DIST_DIR: ${{ inputs.dist_dir }}
          PROJECT_NAME: ${{ inputs.project_name }}
        # The checked-out release is a tag, so git is in detached-HEAD state here
        # and wrangler can't infer a branch to attribute the deploy to - without
        # --branch it falls back to a "head" preview alias instead of production.
        # A target added to deploy-targets.json may not have its project yet, so
        # a failed deploy creates it and tries once more.
        run: |
          set -euo pipefail
          wrangler="$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler"
          deploy() { "$wrangler" pages deploy "$DIST_DIR" --project-name="$PROJECT_NAME" --branch=main; }
          if ! deploy; then
            "$wrangler" pages project create "$PROJECT_NAME" --production-branch=main || true
            deploy
          fi
