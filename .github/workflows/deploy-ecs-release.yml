# Copied from rtylrs/pipelines@main on 2026-10-19. rtylr is public, and a public
# repository cannot call reusable workflows from a private one.

name: Deploy a promoted ECS release

# Registers a new ECS task definition with the images build-ecs-image.yml already
# pushed for the service's released containers, rolls the service onto it, and
# returns once the new tasks serve.
# Nothing in this workflow runs on a source-repository push.
on:
  workflow_call:
    inputs:
      source_ref:
        description: GitHub release tag being deployed
        required: true
        type: string
      version:
        description: Immutable image tag
        required: true
        type: string
      cluster:
        description: ECS cluster name
        required: true
        type: string
      service:
        description: ECS service name
        required: true
        type: string
      containers:
        description: 'JSON array of {"container", "image_repository"} to update; repository paths exclude the registry hostname'
        required: true
        type: string
      desired_count:
        description: Desired ECS service count
        required: false
        default: "1"
        type: string
      health_url:
        description: Optional HTTP health endpoint checked after the rollout
        required: false
        default: ""
        type: string
      version_url:
        description: Optional endpoint whose JSON `version` must equal the deployed version
        required: false
        default: ""
        type: string
      ecr_registry:
        description: ECR registry hostname
        required: false
        default: 101533649486.dkr.ecr.eu-west-1.amazonaws.com
        type: string
      runs_on:
        description: Runner label
        required: false
        default: ubuntu-24.04
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1

jobs:
  deploy:
    name: Deploy ${{ inputs.service }} from ${{ inputs.source_ref }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 45
    steps:
      - name: Require AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            exit 0
          fi
          echo 'AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY must be passed to the ECS deploy workflow' >&2
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render task definition with promoted image
        id: task-definition
        env:
          ECR_REGISTRY: ${{ inputs.ecr_registry }}
          VERSION: ${{ inputs.version }}
          CLUSTER: ${{ inputs.cluster }}
          SERVICE: ${{ inputs.service }}
          CONTAINERS: ${{ inputs.containers }}
        run: |
          set -euo pipefail
          CURRENT_TASK_DEFINITION="$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --region "$AWS_REGION" \
            --query 'services[0].taskDefinition' \
            --output text)"
          if [ -z "$CURRENT_TASK_DEFINITION" ] || [ "$CURRENT_TASK_DEFINITION" = "None" ]; then
            echo "ECS service $SERVICE was not found in cluster $CLUSTER" >&2
            exit 1
          fi

          # Clone the newest active revision, not the one the service happens to
          # run: infra applies register revisions with new env/secrets, and when
          # a deploy starts before the service has rolled to them, cloning the
          # service's revision silently drops those changes (it lost
          # GEMINI_API_KEY and the CDN variables on 2026-09-20).
          TASK_DEFINITION_FAMILY="${CURRENT_TASK_DEFINITION##*/}"
          TASK_DEFINITION_FAMILY="${TASK_DEFINITION_FAMILY%%:*}"
          TASK_DEFINITION_ARN="$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_FAMILY" \
            --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_ARN" \
            --region "$AWS_REGION" \
            --query taskDefinition > "$RUNNER_TEMP/task-definition.json"

          # Sibling images come from the revision the tasks serve. While a
          # rollout is in progress the service's taskDefinition already names
          # the incoming revision, so prefer the deployment that completed.
          SERVING_TASK_DEFINITION="$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --region "$AWS_REGION" \
            --output json \
            | jq -r --arg fallback "$CURRENT_TASK_DEFINITION" \
                '[.services[0].deployments[] | select(.rolloutState == "COMPLETED")][0].taskDefinition // $fallback')"
          echo "Serving revision: $SERVING_TASK_DEFINITION"

          aws ecs describe-task-definition \
            --task-definition "$SERVING_TASK_DEFINITION" \
            --region "$AWS_REGION" \
            --query taskDefinition > "$RUNNER_TEMP/running-task-definition.json"

          # The newest revision supplies env, secrets and infra-pinned images
          # (cloudflared). Containers this release ships get the new tag. Other
          # containers built by this pipeline keep the image the service runs
          # now, so shipping one container never rolls a sibling back to
          # whatever image an infra apply recorded.
          jq --exit-status \
            --arg registry "$ECR_REGISTRY" \
            --arg version "$VERSION" \
            --argjson promote "$CONTAINERS" \
            --slurpfile running "$RUNNER_TEMP/running-task-definition.json" \
            '($promote | map({key: .container, value: "\($registry)/\(.image_repository):\($version)"}) | from_entries) as $images
             | ($running[0].containerDefinitions | map({key: .name, value: .image}) | from_entries) as $live
             | [.containerDefinitions[].name] as $names
             | ($promote | map(.container) - $names) as $missing
             | if ($missing | length) > 0
               then error("not in the active task definition: \($missing | join(", "))")
               else del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                        .compatibilities, .registeredAt, .registeredBy)
                    | .containerDefinitions |= map(
                        if $images[.name] then .image = $images[.name]
                        elif (.image | startswith($registry + "/")) and $live[.name] then .image = $live[.name]
                        else . end)
               end' \
            "$RUNNER_TEMP/task-definition.json" > "$RUNNER_TEMP/rendered-task-definition.json"
          jq -r '.containerDefinitions[] | "\(.name): \(.image)"' "$RUNNER_TEMP/rendered-task-definition.json"

          NEW_TASK_DEFINITION_ARN="$(aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/rendered-task-definition.json" \
            --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "arn=$NEW_TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"

      - name: Update ECS service
        id: update
        env:
          CLUSTER: ${{ inputs.cluster }}
          SERVICE: ${{ inputs.service }}
          DESIRED_COUNT: ${{ inputs.desired_count }}
          TASK_DEFINITION_ARN: ${{ steps.task-definition.outputs.arn }}
        run: |
          set -euo pipefail
          DEPLOYMENT_ID="$(aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --task-definition "$TASK_DEFINITION_ARN" \
            --desired-count "$DESIRED_COUNT" \
            --region "$AWS_REGION" \
            --output json \
            | jq -r --arg arn "$TASK_DEFINITION_ARN" \
                '.service.deployments[] | select(.status == "PRIMARY" and .taskDefinition == $arn) | .id')"
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "ECS did not start a deployment of $TASK_DEFINITION_ARN" >&2
            exit 1
          fi
          echo "deployment=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "Started $DEPLOYMENT_ID"

      # Returns once the new tasks run and ECS has begun stopping the old ones,
      # not after the old ones finish draining as services-stable did. With
      # minimumHealthyPercent 100, ECS stops old tasks only after new ones pass
      # their health checks. Below 100 that ordering does not hold, so it waits
      # for the rollout to complete.
      - name: Wait for the new tasks to take over
        env:
          CLUSTER: ${{ inputs.cluster }}
          SERVICE: ${{ inputs.service }}
          DEPLOYMENT_ID: ${{ steps.update.outputs.deployment }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))
          last=""
          while :; do
            aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --region "$AWS_REGION" --query 'services[0]' --output json > "$RUNNER_TEMP/service.json"
            if ! jq -e --arg id "$DEPLOYMENT_ID" 'any(.deployments[]; .id == $id)' "$RUNNER_TEMP/service.json" >/dev/null; then
              echo "Deployment $DEPLOYMENT_ID is no longer listed on $SERVICE" >&2
              exit 1
            fi
            IFS=$'\t' read -r status rollout reason running desired older min_healthy < <(
              jq -r --arg id "$DEPLOYMENT_ID" '
                (.deployments[] | select(.id == $id)) as $d
                | [$d.status, ($d.rolloutState // "UNKNOWN"), ($d.rolloutStateReason // ""),
                   $d.runningCount, $d.desiredCount,
                   ([.deployments[] | select(.id != $id) | .desiredCount] | add // 0),
                   (.deploymentConfiguration.minimumHealthyPercent // 100)]
                # read collapses adjacent tabs, so no field may be empty.
                | map(tostring | if . == "" then "-" else . end)
                | @tsv' "$RUNNER_TEMP/service.json")

            state="$status $rollout running=$running/$desired older-desired=$older"
            if [ "$state" != "$last" ]; then
              echo "$(date -u +%H:%M:%S) $state"
              last="$state"
            fi

            if [ "$rollout" = FAILED ]; then
              echo "Deployment failed: $reason" >&2
              exit 1
            fi
            if [ "$status" != PRIMARY ]; then
              echo "Deployment $DEPLOYMENT_ID was superseded (now $status); ECS may have rolled it back" >&2
              exit 1
            fi
            if [ "$rollout" = COMPLETED ]; then
              echo "Rollout completed"
              exit 0
            fi
            if [ "$min_healthy" -ge 100 ] && [ "$running" -ge "$desired" ] && [ "$older" -eq 0 ]; then
              echo "New tasks are serving; the old ones are draining"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for $DEPLOYMENT_ID: $reason" >&2
              exit 1
            fi
            sleep 3
          done

      # The tunnel can briefly route to both old and new tasks, so the new
      # version must answer three times in a row.
      - name: Confirm the new version is serving
        if: inputs.version_url != ''
        env:
          VERSION_URL: ${{ inputs.version_url }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          streak=0
          for attempt in $(seq 1 90); do
            served="$(curl --silent --max-time 5 -H 'Cache-Control: no-cache' "$VERSION_URL" \
              | jq -r '.version // empty' 2>/dev/null || true)"
            if [ "$served" = "$VERSION" ]; then
              streak=$((streak + 1))
              if [ "$streak" -ge 3 ]; then
                echo "$VERSION_URL serves $VERSION"
                exit 0
              fi
            else
              streak=0
              echo "Serving ${served:-no version} ($attempt/90), waiting for $VERSION"
            fi
            sleep 1
          done
          echo "$VERSION_URL never served $VERSION" >&2
          exit 1

      - name: Check promoted service health
        if: inputs.health_url != ''
        env:
          HEALTH_URL: ${{ inputs.health_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --max-time 10 "$HEALTH_URL" >/dev/null; then
              echo "Health check passed"
              exit 0
            fi
            echo "Health check not ready ($attempt/36); retrying"
            sleep 5
          done
          echo "Health check failed: $HEALTH_URL" >&2
          exit 1
