name: Image build probe (temporary)

# Runs the release image build's steps on GitHub-hosted runners without
# pushing: a cold job that saves the caches, then a warm job after a one-file
# change. Removed before this PR merges.
on:
  pull_request:
    paths:
      - '.github/workflows/zz-build-probe.yml'

permissions:
  contents: read

jobs:
  cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - id: go
        run: echo "version=$(sed -n 's/^FROM .*golang:\([0-9][0-9.]*\)-.*/\1/p' services/onion/Dockerfile | head -n 1)" >> "$GITHUB_OUTPUT"
      - id: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false
      - uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: probe-go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
      - name: Compile cold
        env: { VERSION: probe, COMMIT: probe, BUILD_TIME: now }
        run: |
          start=$SECONDS
          .github/scripts/build-onion-binaries.sh services/onion/Dockerfile "$RUNNER_TEMP/builder" ./cmd/api ./cmd/worker
          echo "COLD COMPILE: $((SECONDS - start))s"
          du -sh ~/.cache/go-build ~/go/pkg/mod
      - uses: actions/cache/save@v4
        with:
          path: ~/.cache/go-build
          key: probe-go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ github.run_id }}
      - uses: docker/setup-buildx-action@v3
        with:
          cleanup: false
      - name: Image cold
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: services/onion/Dockerfile
          build-contexts: builder=${{ runner.temp }}/builder
          build-args: VERSION=probe
          tags: probe/onion:cold
          push: false
          cache-from: type=gha,scope=probe/voxire/onion
          cache-to: type=gha,scope=probe/voxire/onion,mode=max

  warm:
    needs: cold
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - id: go
        run: echo "version=$(sed -n 's/^FROM .*golang:\([0-9][0-9.]*\)-.*/\1/p' services/onion/Dockerfile | head -n 1)" >> "$GITHUB_OUTPUT"
      - id: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: ~/go/pkg/mod
          key: probe-go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: probe-go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-none
          restore-keys: probe-go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-
      - name: Compile warm after a one-file change
        env: { VERSION: probe2, COMMIT: probe2, BUILD_TIME: later }
        run: |
          printf '\n// probe\n' >> services/onion/internal/platform/email/templates.go
          start=$SECONDS
          .github/scripts/build-onion-binaries.sh services/onion/Dockerfile "$RUNNER_TEMP/builder" ./cmd/api
          echo "WARM COMPILE: $((SECONDS - start))s"
      - uses: docker/setup-buildx-action@v3
        with:
          cleanup: false
      - name: Image warm
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: services/onion/Dockerfile
          build-contexts: builder=${{ runner.temp }}/builder
          build-args: VERSION=probe2
          tags: probe/onion:warm
          push: false
          cache-from: type=gha,scope=probe/voxire/onion
          cache-to: type=gha,scope=probe/voxire/onion,mode=max
