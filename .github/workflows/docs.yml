name: Version (docs)

# A source push creates release metadata only, exactly like the other Version
# workflows. Builds and production deployment happen later, and only for a
# release promoted in tryrtylr/deploy.
on:
  push:
    branches: [main]
    paths:
      - 'clients/web/docs/**'
      - 'clients/packages/**'
  workflow_dispatch:

concurrency:
  group: version-docs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Calculate next docs version
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.next.outputs.version }}
      release_tag: ${{ steps.next.outputs.release_tag }}
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: next
        run: |
          set -euo pipefail
          version="$(.github/scripts/next-app-version.sh rtylr-docs 0.0.1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=rtylr-docs-v$version" >> "$GITHUB_OUTPUT"
          echo "Creating repository version rtylr-docs-v$version"

  release:
    name: Create docs version
    needs: version
    uses: tryrtylr/pipelines/.github/workflows/create-release.yml@main
    with:
      release_tag: ${{ needs.version.outputs.release_tag }}
      release_name: rtylr docs v${{ needs.version.outputs.version }}
      version: ${{ needs.version.outputs.version }}
      notes: 'Source version for docs at ${{ github.sha }}. Build and deployment are controlled by tryrtylr/deploy.'
