name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6

      - name: Configure OpenCode Go credentials
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: |
          mkdir -p ~/.local/share/opencode
          python3 - <<'EOF'
          import json, os
          p = os.path.expanduser('~/.local/share/opencode/auth.json')
          try:
              with open(p) as f:
                  data = json.load(f)
          except (FileNotFoundError, ValueError):
              data = {}
          data['opencode-go'] = {'type': 'api', 'key': os.environ['OPENCODE_GO_API_KEY']}
          with open(p, 'w') as f:
              json.dump(data, f)
          EOF

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/muse-spark-1.3-contributor-free
          use_github_token: true
          prompt: |
            Review this pull request:
            - Check for code quality issues, potential bugs, and security concerns
            - Suggest concrete improvements with file:line references
            - Flag missing tests or edge cases
            - Be concise and avoid nitpicks unless they hint at a larger issue
            - If everything looks good, say LGTM with a brief summary
