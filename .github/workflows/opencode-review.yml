name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Configure OpenCode Go credentials
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: |
          if [ -z "$OPENCODE_GO_API_KEY" ]; then
            echo "OPENCODE_GO_API_KEY secret is not set" >&2
            exit 1
          fi
          mkdir -p ~/.local/share/opencode
          python3 - <<'EOF'
          import json, os
          p = os.path.expanduser('~/.local/share/opencode/auth.json')
          try:
              with open(p) as f:
                  data = json.load(f)
          except (FileNotFoundError, ValueError):
              data = {}
          data['opencode-go'] = {'type': 'api', 'key': os.environ['OPENCODE_GO_API_KEY']}
          with open(p, 'w') as f:
              json.dump(data, f)
          os.chmod(p, 0o600)
          EOF

      - uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # latest
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/muse-spark-1.3-contributor
          use_github_token: true
          prompt: |
            Review this pull request:
            - Check for code quality issues, potential bugs, and security concerns
            - Suggest concrete improvements with file:line references
            - Flag missing tests or edge cases
            - Be concise and avoid nitpicks unless they hint at a larger issue
            - If everything looks good, say LGTM with a brief summary
