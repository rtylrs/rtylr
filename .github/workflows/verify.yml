name: Verify

# Quality gate for pull requests. The existing ci.yml is a release/versioning
# workflow despite its name: it runs only on pushes to main and never
# typechecks, builds, lints or tests anything. Nothing checked buildability
# before this, which is how c6e4ce609 shipped nine apps that fail `vite build`
# on an import of a voxie module that has never existed (#894).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, lint and test
    runs-on: ubuntu-latest
    steps:
      # Submodules are recursive on purpose: packages/ carries packages/voxie
      # nested inside it, and the generated contracts every app imports live
      # there. Without recursive, typecheck fails on missing @voxire/voxie.
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # packages and its nested voxie are private, so the default
          # GITHUB_TOKEN cannot clone them: it is scoped to this repository
          # only. Same token the publish-images workflow uses.
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Verifies the packages submodule sits at the commit this repo records.
      # A drifted pointer produces confusing downstream failures, so it is
      # worth its own step and its own error message.
      - name: Check submodule pointer
        run: ./scripts/check-packages-ref.sh

      # `pnpm build` runs typecheck first, so this covers both. crm and finance
      # are excluded because they still import */compat/v1 contracts that do not
      # exist; see the known-broken job below. Every other app is a real gate.
      - name: Build every app that is expected to build
        run: pnpm exec turbo build --filter='!@rtylr/crm' --filter='!@rtylr/finance'

      - name: Lint
        run: pnpm lint

      # Scoped the same way as the build step and for the same reason: crm's and
      # finance's test files cannot even load while their imports do not
      # resolve, so including them would make this step red for a cause the
      # known-broken job already reports.
      - name: Test
        run: pnpm exec vitest run --exclude='apps/crm/**' --exclude='apps/finance/**'

  known-broken:
    name: Apps with missing contracts (non-blocking)
    runs-on: ubuntu-latest
    # Non-blocking on purpose. crm and finance cannot build until the
    # */compat/v1 contracts they import are either authored in voxie or their
    # callers are moved back to REST (#894). Reporting instead of blocking keeps
    # the gate above meaningful rather than permanently red, and this job turns
    # green by itself the moment they are fixed - at which point fold them into
    # the job above and delete this one.
    continue-on-error: true
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # packages and its nested voxie are private, so the default
          # GITHUB_TOKEN cannot clone them: it is scoped to this repository
          # only. Same token the publish-images workflow uses.
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build crm and finance
        run: pnpm exec turbo build --filter=@rtylr/crm --filter=@rtylr/finance
