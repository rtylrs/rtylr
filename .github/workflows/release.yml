name: Release

# One release per push to main: a single rtylr-v* tag whose assets contain only
# the components that changed since the previous release. The same run then
# deploys every target whose own paths changed (.github/deploy-targets.json),
# building the new tag through deploy.yml. redeploy.yml re-ships an
# existing tag by hand.

on:
  push:
    branches: [main]
    paths:
      - 'clients/**'
      - 'services/**'
      - 'voxie/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Cut rtylr release
    runs-on: ubuntu-24.04
    # Only the release itself is serialized; a slow ECS rollout must not hold
    # up the next release, and each target has its own deploy-<app> group.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      pages: ${{ steps.plan.outputs.pages }}
      ecs: ${{ steps.plan.outputs.ecs }}
      # 'false' only when this exact set of migrations already applied cleanly.
      migrate: ${{ steps.applied.outputs.cache-hit == 'true' && 'false' || 'true' }}
    steps:
      # Tags, commits and trees for the version and the changed paths; file
      # contents only for HEAD, which the release archives come from.
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Calculate next version
        id: version
        run: |
          set -euo pipefail
          version="$(.github/scripts/next-app-version.sh rtylr 0.1.0)"
          previous="$(git tag --list 'rtylr-v*' --sort=-v:refname | head -1 || true)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=rtylr-v$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Cutting rtylr-v$version after ${previous:-<first release>}"

      - name: Collect changed components
        id: components
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail

          if [ -n "$PREVIOUS" ]; then
            range="$PREVIOUS..HEAD"
          else
            range="HEAD"
          fi

          component_for() {
            case "$1" in
              clients/app|clients/app/*) echo rtylr ;;
              clients/web/landing|clients/web/landing/*) echo landing ;;
              clients/web/docs|clients/web/docs/*) echo docs ;;
              clients/mcp|clients/mcp/*) echo mcp ;;
              clients/pos|clients/pos/*) echo pos ;;
              clients/packages|clients/packages/*) echo packages ;;
              clients|clients/*) echo clients ;;
              services/onion|services/onion/*) echo onion ;;
              services/searxng|services/searxng/*) echo searxng ;;
              voxie|voxie/*) echo contracts ;;
              .github|.github/*) echo ci ;;
              *) echo repo ;;
            esac
          }

          files="$(mktemp)"
          if [ -n "$PREVIOUS" ]; then
            git diff --name-only "$range" > "$files"
          else
            git ls-files > "$files"
          fi

          changed="$(while IFS= read -r path; do component_for "$path"; done < "$files" | sort -u)"
          count="$(wc -l < "$files" | tr -d ' ')"

          echo "components=$(printf '%s' "$changed" | tr '\n' ' ' | sed 's/ *$//')" >> "$GITHUB_OUTPUT"
          echo "files_changed=$count" >> "$GITHUB_OUTPUT"

          echo "Changed components: $(printf '%s' "$changed" | tr '\n' ' ')"
          echo "$changed" | sed '/^$/d' > components.txt

      - name: Build release assets
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          mkdir -p release-assets

          component_path() {
            case "$1" in
              rtylr) echo clients/app ;;
              landing) echo clients/web/landing ;;
              docs) echo clients/web/docs ;;
              mcp) echo clients/mcp ;;
              pos) echo clients/pos ;;
              packages) echo clients/packages ;;
              clients) echo clients ;;
              onion) echo services/onion ;;
              searxng) echo services/searxng ;;
              contracts) echo voxie ;;
              *) echo "" ;;
            esac
          }

          while IFS= read -r component; do
            [ -n "$component" ] || continue
            path="$(component_path "$component")"
            if [ -n "$path" ]; then
              git archive --format=tar.gz --prefix="$component/" \
                -o "release-assets/$component.tar.gz" HEAD "$path"
            fi
          done < components.txt

          if [ -n "$PREVIOUS" ]; then
            git diff --name-only "$PREVIOUS..HEAD" > changed-files.txt
          else
            git ls-files > changed-files.txt
          fi

          jq -n \
            --arg version "${{ steps.version.outputs.version }}" \
            --arg tag "${{ steps.version.outputs.release_tag }}" \
            --arg sha "$GITHUB_SHA" \
            --arg previous "${PREVIOUS:-}" \
            --argjson files_changed "${{ steps.components.outputs.files_changed }}" \
            --rawfile files changed-files.txt \
            '{
              version: $version,
              tag: $tag,
              sha: $sha,
              previous_tag: (if $previous == "" then null else $previous end),
              files_changed: $files_changed,
              files: ($files | split("\n") | map(select(length > 0)))
            }' > release-assets/release.json

      - name: Plan deployments
        id: plan
        run: .github/scripts/plan-deploys.sh files changed-files.txt

      # migrate-onion-database.yml records each migration key it applies
      # cleanly. Most releases change no migration, so they skip the ~90s
      # migration job. Every failure here (no key, no record, an evicted
      # record, a cache error) means migrating, never skipping.
      - name: Compute the migration key
        id: migrations
        if: steps.plan.outputs.ecs != '[]'
        continue-on-error: true
        run: |
          set -euo pipefail
          key="$(.github/scripts/migration-key.sh HEAD)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Look up whether these migrations are applied
        id: applied
        if: steps.migrations.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .migrations-applied
          key: onion-migrations-applied-${{ steps.migrations.outputs.key }}
          lookup-only: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.release_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          notes="$(printf 'rtylr v%s\n\nChanged components:\n' "$VERSION")"
          notes="$notes$(sed 's/^/- /' components.txt)"
          notes="$notes
          $(if [ -n "$PREVIOUS" ]; then printf '\nFull diff: %s...%s' "$PREVIOUS" "$(git rev-parse --short HEAD)"; fi)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" \
              --title "rtylr v$VERSION" \
              --target "$GITHUB_SHA" \
              --notes "$notes" \
              release-assets/*
          fi

  deploy:
    name: Deploy ${{ needs.release.outputs.release_tag }}
    needs: release
    if: needs.release.outputs.pages != '[]' || needs.release.outputs.ecs != '[]'
    uses: ./.github/workflows/deploy.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
      version: ${{ needs.release.outputs.version }}
      pages: ${{ needs.release.outputs.pages }}
      ecs: ${{ needs.release.outputs.ecs }}
      migrate: ${{ needs.release.outputs.migrate }}
    secrets: inherit
