name: Publish backend images

# Builds the PUBLIC self-host backend images docker.io/rtylr/{api,worker,migrate}.
# The unified Release workflow dispatches rtylr-release; normal pushes do not
# publish. Internal ECR images are built by tryrtylr/deploy instead.
on:
  repository_dispatch:
    types: [rtylr-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'rtylr suite version tag (e.g. 5.0.1)'
        required: true
        type: string

jobs:
  publish:
    name: Publish rtylr/${{ matrix.name }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, dockerfile: services/onion/Dockerfile, context: ".", public_repo: rtylr/api }
          - { name: worker, dockerfile: services/onion/Dockerfile.worker, context: ".", public_repo: rtylr/worker }
          # migrate is a client+scripts+sql image (no compilation) for self-host
          # DB bootstrap, so it keeps the service directory as its context.
          - { name: migrate, dockerfile: Dockerfile.migrate, context: "services/onion", public_repo: rtylr/migrate }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve version
        id: v
        env:
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${DISPATCH_VERSION:-$INPUT_VERSION}"
          if [ -z "$VERSION" ]; then echo "no version supplied"; exit 1; fi
          # Restrict to a safe Docker-tag charset (dispatch payload is trusted-org
          # but validate anyway - no shell metachars reach the build).
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z._-]{0,127}$'; then
            echo "invalid version tag: $VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push public image
        env:
          PUBLIC_REPO: ${{ matrix.public_repo }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
          SCOPE: onion-${{ matrix.name }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          PUB="docker.io/${PUBLIC_REPO}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=gha,scope=${SCOPE} \
            --cache-to type=gha,scope=${SCOPE},mode=max \
            -f "${DOCKERFILE}" \
            --build-arg VERSION="$VERSION" \
            --build-arg COMMIT="${GITHUB_SHA::7}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$PUB:$VERSION" \
            -t "$PUB:latest" \
            --push \
            "${CONTEXT}"
          echo "Published $PUB:$VERSION + :latest"
