name: Library Updates Notification

on:
  push:
    branches:
      - main
    paths:
      - 'libs/**'

jobs:
  check-library-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Check for library changes
        id: library-check
        run: |
          echo "Checking for library changes..."

          LIBRARIES_CHANGED=""
          LIBRARY_CHANGES_DETECTED=false

          # Check each library for changes
          for lib in libs/@voxire/shared libs/@voxire/utils; do
            echo "Checking $lib..."
            
            # Check if the library directory changed in this commit
            if git diff --name-only HEAD~1 HEAD | grep -q "^$lib/"; then
              echo "✅ $lib has changes"
              LIBRARIES_CHANGED="$LIBRARIES_CHANGED$lib,"
              LIBRARY_CHANGES_DETECTED=true
              
              # Get specific files that changed
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep "^$lib/" | head -5)
              echo "Changed files in $lib:"
              echo "$CHANGED_FILES"
            else
              echo "ℹ️ $lib unchanged"
            fi
          done

          # Remove trailing comma
          LIBRARIES_CHANGED=$(echo "$LIBRARIES_CHANGED" | sed 's/,$//')

          if [ "$LIBRARY_CHANGES_DETECTED" = true ]; then
            echo "Libraries changed: $LIBRARIES_CHANGED"
            echo "library_changes_detected=true" >> "$GITHUB_OUTPUT"
            echo "changed_libraries=$LIBRARIES_CHANGED" >> "$GITHUB_OUTPUT"
          else
            echo "No library changes detected"
            echo "library_changes_detected=false" >> "$GITHUB_OUTPUT"
            echo "changed_libraries=" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Telegram Notification - Library Updates
        if: steps.library-check.outputs.library_changes_detected == 'true'
        run: |
          LIBRARIES="${{ steps.library-check.outputs.changed_libraries }}"
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_MESSAGE=$(git log -1 --pretty=format:"%s")

          # Get changed files for each library with change types
          CHANGED_FILES_DETAILS=""
          IFS=',' read -ra LIBS <<< "$LIBRARIES"
          for lib in "${LIBS[@]}"; do
            if [ -n "$lib" ]; then
              # Get files with their change status (last commit only)
              CHANGED_FILES=""
              
              # Get all changed files with their status
              CHANGED_STATUS=$(git diff --name-status HEAD~1 HEAD | grep "^$lib/")
              
              # Process each changed file based on its status
              while IFS=$'\t' read -r status file; do
                case $status in
                  A)
                    CHANGED_FILES="$CHANGED_FILES  • ➕ Added: $file\n"
                    ;;
                  M)
                    CHANGED_FILES="$CHANGED_FILES  • 📝 Updated: $file\n"
                    ;;
                  D)
                    CHANGED_FILES="$CHANGED_FILES  • ❌ Deleted: $file\n"
                    ;;
                  R)
                    # For renamed files, get the old name
                    OLD_NAME=$(git diff --name-status HEAD~1 HEAD | grep "^R.*$file" | awk '{print $2}')
                    CHANGED_FILES="$CHANGED_FILES  • 🔄 Renamed: $OLD_NAME → $file\n"
                    ;;
                esac
              done <<< "$CHANGED_STATUS"
              
              if [ -n "$CHANGED_FILES" ]; then
                CHANGED_FILES_DETAILS="$CHANGED_FILES_DETAILS\n📁 $lib:\n$CHANGED_FILES"
              fi
            fi
          done

          # Build the message
          MESSAGE="📚 Library Updates Detected"
          MESSAGE="$MESSAGE\n\n🔧 Libraries: $LIBRARIES"
          MESSAGE="$MESSAGE\n📝 Commit: $COMMIT_HASH"
          MESSAGE="$MESSAGE\n💬 Message: $COMMIT_MESSAGE"
          MESSAGE="$MESSAGE\n⏰ Time: $(date '+%Y-%m-%d %H:%M:%S UTC')"
          MESSAGE="$MESSAGE\n\n📄 Changed Files:$CHANGED_FILES_DETAILS"

          # Send to Telegram using shared script
          ./scripts/telegram-notify.sh "library-update" "$MESSAGE"
