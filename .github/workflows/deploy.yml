name: Deploy Vbitez Multi-App

on:
  push:
    branches:
      - main
    paths:
      - 'apps/*/version.json'
      - 'package.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      SLACK_BOT_TOKEN: xoxb-9396990793185-9382611271909-hV8yvb7g25cJia53GSYMN9FH
      SLACK_CHANNEL_ID: C09BC3LEQTY

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure Git for private repos
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          # Configure git to use Personal Access Token for private repositories
          git config --global url."https://x-access-token:${ACCESS_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${ACCESS_TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${ACCESS_TOKEN}@github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global url."https://x-access-token:${ACCESS_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          echo "✅ Git configured to use Personal Access Token for private repos"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Configure pnpm
        run: |
          # Configure pnpm for private repos
          pnpm config set git-checks false
          echo "✅ pnpm configured for private repos"

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Check which apps need deployment
        id: deployment-check
        run: |
          echo "Checking for app version changes..."

          APPS_TO_DEPLOY=""
          DEPLOYMENT_NEEDED=false

          # Check each app for version changes
          for app in landing dashboard menu auth; do
            echo "Checking $app..."
            
            APP_VERSION_FILE="apps/$app/version.json"
            
            if [ -f "$APP_VERSION_FILE" ]; then
              CURRENT_VERSION=$(node -p "require('./$APP_VERSION_FILE').version")
              echo "Current $app version: $CURRENT_VERSION"
              
              # Check if the app version.json changed in this commit
              if git diff --name-only HEAD~1 HEAD | grep -q "$APP_VERSION_FILE"; then
                PREVIOUS_VERSION=$(git show HEAD~1:$APP_VERSION_FILE 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" || echo "none")
                echo "Previous $app version: $PREVIOUS_VERSION"
                
                if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
                  echo "✅ $app version changed: $PREVIOUS_VERSION → $CURRENT_VERSION"
                  APPS_TO_DEPLOY="$APPS_TO_DEPLOY$app,"
                  DEPLOYMENT_NEEDED=true
                else
                  echo "ℹ️ $app version.json changed but version unchanged"
                fi
              else
                echo "ℹ️ $app version.json unchanged"
              fi
            else
              echo "❌ No version.json found for $app"
            fi
          done

          # Remove trailing comma
          APPS_TO_DEPLOY=$(echo "$APPS_TO_DEPLOY" | sed 's/,$//')

          # Fallback: Check root package.json for deployment metadata (backward compatibility)
          if [ "$DEPLOYMENT_NEEDED" = false ]; then
            echo "No app version changes detected, checking root package.json for deployment metadata..."
            DEPLOYMENT_INFO=$(node -p "require('./package.json').deployment || null")
            
            if [ "$DEPLOYMENT_INFO" != "null" ]; then
              echo "Deploy metadata found in root package.json"
              DEPLOY_APPS=$(node -p "require('./package.json').deployment.apps.join(',')")
              APPS_TO_DEPLOY="$DEPLOY_APPS"
              DEPLOYMENT_NEEDED=true
              echo "Using deployment metadata: $APPS_TO_DEPLOY"
            fi
          fi

          if [ "$DEPLOYMENT_NEEDED" = true ]; then
            echo "Apps to deploy: $APPS_TO_DEPLOY"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "deploy_apps=$APPS_TO_DEPLOY" >> "$GITHUB_OUTPUT"
          else
            echo "No deployment needed"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "deploy_apps=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Dependencies
        if: steps.deployment-check.outputs.should_deploy == 'true'
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GIT_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          # Delete lockfile to force fresh resolution with HTTPS URLs
          rm -f pnpm-lock.yaml
          
          # DEBUG: Show current git config
          echo "=== CURRENT GIT CONFIG ==="
          git config --global --list | grep url || echo "No URL configs found"
          
          # Configure git credentials for this session
          git config --global credential.helper store
          echo "https://x-access-token:${ACCESS_TOKEN}@github.com" > ~/.git-credentials
          
          # DEBUG: Test git access directly
          echo "=== TESTING GIT ACCESS ==="
          git ls-remote https://github.com/Voxire/shared.git HEAD || echo "HTTPS access failed"
          
          # Force pnpm to use HTTPS instead of SSH
          pnpm config set git-checks false
          
          # DEBUG: Show what pnpm is trying to resolve
          echo "=== PNPM RESOLUTION DEBUG ==="
          pnpm why @voxire/shared || echo "Not found in package.json"
          
          # Try with verbose logging
          pnpm install --reporter=append-only

      - name: Build Selected Apps
        if: steps.deployment-check.outputs.should_deploy == 'true'
        run: |
          DEPLOY_APPS="${{ steps.deployment-check.outputs.deploy_apps }}"
          echo "Building apps: $DEPLOY_APPS"

          IFS=',' read -ra APPS <<< "$DEPLOY_APPS"
          for app in "${APPS[@]}"; do
            if [ -n "$app" ]; then
              echo "Building $app..."
              npx nx build "$app"
              if [ $? -eq 0 ]; then
                echo "✅ $app built successfully"
              else
                echo "❌ Failed to build $app"
                exit 1
              fi
            fi
          done

      - name: Deploy Landing App
        if: steps.deployment-check.outputs.should_deploy == 'true' && contains(steps.deployment-check.outputs.deploy_apps, 'landing')
        uses: SamKirkland/FTP-Deploy-Action@v4.3.1
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/landing/
          server-dir: /subdomains/vbitez.voxire.com/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**

      - name: Deploy Dashboard App
        if: steps.deployment-check.outputs.should_deploy == 'true' && contains(steps.deployment-check.outputs.deploy_apps, 'dashboard')
        uses: SamKirkland/FTP-Deploy-Action@v4.3.1
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/dashboard/
          server-dir: /subdomains/dashboard.vbitez.voxire.com/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**

      - name: Deploy Menu App
        if: steps.deployment-check.outputs.should_deploy == 'true' && contains(steps.deployment-check.outputs.deploy_apps, 'menu')
        uses: SamKirkland/FTP-Deploy-Action@v4.3.1
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/menu/
          server-dir: /subdomains/menu.vbitez.voxire.com/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**

      - name: Deploy Auth App
        if: steps.deployment-check.outputs.should_deploy == 'true' && contains(steps.deployment-check.outputs.deploy_apps, 'auth')
        uses: SamKirkland/FTP-Deploy-Action@v4.3.1
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/auth/
          server-dir: /subdomains/auth.vbitez.voxire.com/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**

      - name: Skip deployment
        if: steps.deployment-check.outputs.should_deploy == 'false'
        run: echo "Skipping deployment - no app version changes detected"

      - name: Send Slack Notification - Success
        if: steps.deployment-check.outputs.should_deploy == 'true' && success()
        run: |
          DEPLOY_APPS="${{ steps.deployment-check.outputs.deploy_apps }}"

          # Send individual notifications for each deployed app
          IFS=',' read -ra APPS <<< "$DEPLOY_APPS"
          for app in "${APPS[@]}"; do
            if [ -n "$app" ] && [ -f "apps/$app/version.json" ]; then
              VERSION=$(node -p "require('./apps/$app/version.json').version")
              
              echo "Sending Slack notification for $app v$VERSION"
              
              # Build the Slack message
              SLACK_MESSAGE="🚀 *DEPLOYMENT COMPLETE*\n\n📱 *App:* ${app^}\n🏷️ *Version:* v$VERSION\n🌍 *Environment:* Production\n⏰ *Time:* $(date -u '+%m/%d/%Y, %I:%M:%S %p UTC')"
              
              # Send to Slack
              curl -s -X POST \
                "https://slack.com/api/chat.postMessage" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${{ env.SLACK_BOT_TOKEN }}" \
                -d "{\"channel\": \"${{ env.SLACK_CHANNEL_ID }}\", \"text\": \"$SLACK_MESSAGE\", \"mrkdwn\": true}"
              
              echo "✅ Slack notification sent for $app"
            fi
          done

      - name: Clean up deployment metadata
        if: steps.deployment-check.outputs.should_deploy == 'true' && success()
        run: |
          # Remove deployment metadata from root package.json after successful deployment (if it exists)
          node -e "
          const fs = require('fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (packageJson.deployment) {
            delete packageJson.deployment;
            fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');
            console.log('Cleaned up deployment metadata from root package.json');
          } else {
            console.log('No deployment metadata to clean up');
          }
          "

          if git diff --quiet; then
            echo "No changes to commit"
          else
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add package.json
            git commit -m "🧹 Clean up deployment metadata after app deployment"
            git push origin main
          fi
