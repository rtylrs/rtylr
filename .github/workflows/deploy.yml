name: Deploy Vbitez

on:
  push:
    branches:
      - main
    paths:
      - "package.json"

env:
  TELEGRAM_BOT_TOKEN: 7250945940:AAGxOe0ahPZy2UfzGjQfXR4XC5vjThrnvow
  TELEGRAM_CHAT_ID: -4810256950

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Set Up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Check if version changed
        id: version-check
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          PREVIOUS_VERSION=$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" || echo "none")
          echo "Previous version: $PREVIOUS_VERSION"

          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "Version changed"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version unchanged"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache pnpm dependencies
        if: steps.version-check.outputs.should_deploy == 'true'
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Configure pnpm
        if: steps.version-check.outputs.should_deploy == 'true'
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Install Dependencies with pnpm
        if: steps.version-check.outputs.should_deploy == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build Project
        if: steps.version-check.outputs.should_deploy == 'true'
        run: pnpm run build

      - name: Deploy Build Files
        if: steps.version-check.outputs.should_deploy == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.1
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: /subdomains/vbitez.voxire.com/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**

      - name: Skip deployment
        if: steps.version-check.outputs.should_deploy == 'false'
        run: echo "Skipping deployment - version unchanged"

      - name: Send Telegram Notification - Success
        if: steps.version-check.outputs.should_deploy == 'true' && success()
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)

          MESSAGE="🚀 *Deployment Successful!*

          📦 **Project:** Vbitez
          🔢 **Version:** $CURRENT_VERSION
          🔗 **Commit:** $COMMIT_HASH
          📝 **Message:** $COMMIT_MESSAGE
          ⏰ **Time:** $(date '+%Y-%m-%d %H:%M:%S UTC')"

          curl -s -X POST \
            "https://api.telegram.org/bot${{ env.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${{ env.TELEGRAM_CHAT_ID }}\",
              \"text\": \"$MESSAGE\",
              \"parse_mode\": \"Markdown\"
            }"
