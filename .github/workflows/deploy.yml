name: Deploy release

# Reusable: builds one immutable release tag and ships the selected targets
# through deploy-pages-release.yml and, for ECS, build-ecs-image.yml then
# deploy-ecs-release.yml. Pages apps and ECS services share this entrypoint.
# Callers (release.yml on a push to main, redeploy.yml by hand) pass the target
# lists produced by .github/scripts/plan-deploys.sh.
on:
  workflow_call:
    inputs:
      release_tag:
        description: GitHub release tag to build, for example rtylr-v6.1.2
        required: true
        type: string
      version:
        description: Release version without the tag prefix, used as the image tag
        required: true
        type: string
      pages:
        description: JSON array of Pages targets
        required: true
        type: string
      ecs:
        description: JSON array of ECS targets
        required: true
        type: string
      migrate:
        description: "'false' when the release's migrations are already applied; anything else migrates"
        required: false
        default: "true"
        type: string

permissions:
  contents: read

jobs:
  pages:
    name: Deploy ${{ matrix.app }}
    if: inputs.pages != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.pages) }}
    concurrency:
      group: deploy-${{ matrix.app }}
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-pages-release.yml
    with:
      source_repository: rtylrs/rtylr
      source_ref: ${{ inputs.release_tag }}
      app_filter: ${{ matrix.app_filter }}
      build_script: ${{ matrix.build_script }}
      dist_dir: ${{ matrix.dist_dir }}
      working_directory: ${{ matrix.working_directory }}
      project_name: ${{ matrix.project_name }}
      node_version: ${{ matrix.node_version }}
    secrets: inherit

  migrate:
    name: Migrate the database
    if: inputs.migrate != 'false' && (contains(inputs.ecs, '"app":"onion-api"') || contains(inputs.ecs, '"app":"onion-worker"'))
    uses: ./.github/workflows/migrate-onion-database.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      dry_run: false
    secrets: inherit

  # Images don't depend on the schema, so they build while the database migrates.
  images:
    name: Build ${{ matrix.app }}
    if: inputs.ecs != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.ecs) }}
    uses: ./.github/workflows/build-ecs-image.yml
    with:
      source_repository: rtylrs/rtylr
      source_ref: ${{ inputs.release_tag }}
      version: ${{ inputs.version }}
      dockerfile: ${{ matrix.dockerfile }}
      image_repository: ${{ matrix.image_repository }}
      go_package: ${{ matrix.go_package }}
    secrets: inherit

  # Several targets can ship containers of one ECS service (the api task runs
  # the api, worker and SearXNG containers). Deploying them as separate jobs
  # would roll the service once per container and race on its task
  # definition, so the deploy runs once per service with all of its containers.
  ecs_services:
    name: Group ECS targets by service
    if: inputs.ecs != '[]'
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.group.outputs.services }}
    steps:
      - name: Group targets
        id: group
        env:
          ECS: ${{ inputs.ecs }}
        run: |
          set -euo pipefail
          services="$(jq -c '
            group_by([.cluster, .service])
            | map({
                app: (map(.app) | join(" + ")),
                cluster: .[0].cluster,
                service: .[0].service,
                desired_count: (map(.desired_count // "1" | tonumber) | max | tostring),
                health_url: (map(.health_url // "" | select(. != "")) | first // ""),
                version_url: (map(.version_url // "" | select(. != "")) | first // ""),
                containers: map({container, image_repository})
              })' <<< "$ECS")"
          echo "services=$services" >> "$GITHUB_OUTPUT"
          jq . <<< "$services"

  # The API and the worker read the columns their release's migrations add, so
  # they ship only after the migration succeeded or was not needed. A failed
  # (or cancelled) migration stops their deploy: the running release keeps
  # working against the schema it knows. A failed image build stops every ECS
  # deploy of the release.
  ecs:
    name: Deploy ${{ matrix.app }}
    needs: [ecs_services, images, migrate]
    if: ${{ !cancelled() && inputs.ecs != '[]' && needs.ecs_services.result == 'success' && needs.images.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ecs_services.outputs.services) }}
    # Keyed by service, not app: two releases must not both clone and register
    # the same service's task definition at once.
    concurrency:
      group: deploy-ecs-${{ matrix.cluster }}-${{ matrix.service }}
      cancel-in-progress: false
    uses: ./.github/workflows/deploy-ecs-release.yml
    with:
      source_ref: ${{ inputs.release_tag }}
      version: ${{ inputs.version }}
      containers: ${{ toJSON(matrix.containers) }}
      cluster: ${{ matrix.cluster }}
      service: ${{ matrix.service }}
      desired_count: ${{ matrix.desired_count }}
      health_url: ${{ matrix.health_url }}
      version_url: ${{ matrix.version_url }}
    secrets: inherit
