name: Onion images

# Builds the ECS images on pull requests without pushing or touching AWS, so
# the Dockerfiles, in-tree contract generation and sqlc are exercised without
# credentials. On main, release.yml -> deploy.yml builds and pushes the same
# images, so this does not run there.

on:
  pull_request:
    paths:
      - 'services/onion/**'
      - 'voxie/**'
      - '.github/workflows/onion-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: services/onion/Dockerfile
          - name: worker
            dockerfile: services/onion/Dockerfile.worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          set -euo pipefail
          docker buildx build \
            --cache-from type=gha,scope=onion-${{ matrix.name }} \
            --cache-to type=gha,scope=onion-${{ matrix.name }},mode=max \
            -f "${{ matrix.dockerfile }}" \
            --build-arg VERSION=ci \
            --build-arg COMMIT="$(git rev-parse --short=7 HEAD)" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "onion-${{ matrix.name }}:ci" \
            --load \
            .
