name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Typecheck, Lint & Build
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Lint
        run: pnpm turbo lint

      - name: Build
        run: pnpm turbo build

  # ── Detect which apps changed ──────────────────────────────────────
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    outputs:
      landing: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.landing }}
      auth: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.auth }}
      dash: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.dash }}
      pos: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.pos }}
      erp: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.erp }}
      crm: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.crm }}
      hr: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.hr }}
      finance: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.finance }}
      flow: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.flow }}
      insights: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.insights }}
      menu: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.menu }}
      docs: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            landing:
              - 'apps/landing/**'
              - 'packages/**'
            auth:
              - 'apps/auth/**'
              - 'packages/**'
            dash:
              - 'apps/dash/**'
              - 'packages/**'
            pos:
              - 'apps/vbitez/**'
              - 'packages/**'
            erp:
              - 'apps/erp/**'
              - 'packages/**'
            crm:
              - 'apps/crm/**'
              - 'packages/**'
            hr:
              - 'apps/hr/**'
              - 'packages/**'
            finance:
              - 'apps/finance/**'
              - 'packages/**'
            flow:
              - 'apps/flow/**'
              - 'packages/**'
            insights:
              - 'apps/insights/**'
              - 'packages/**'
            menu:
              - 'apps/menu/**'
              - 'packages/**'
            docs:
              - 'apps/docs/**'
              - 'packages/**'

  # ── Deploy helpers ─────────────────────────────────────────────────
  # Each job: build the app, deploy via wrangler (direct upload = no CF build minutes used)

  deploy-landing:
    name: Deploy Landing
    needs: [check, changes]
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rtylr/landing run build
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist/landing --project-name=rtylr-landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-auth:
