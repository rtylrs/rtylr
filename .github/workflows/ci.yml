name: Version

# A source push creates release metadata only. Builds and production deploys
# happen later, and only for an app whose version is promoted in tryrtylr/deploy.
on:
  push:
    branches: [main]
    paths:
      - 'apps/rtylr/**'
      - 'packages/**'
  workflow_dispatch:

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Calculate next repository version
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.next.outputs.version }}
      release_tag: ${{ steps.next.outputs.release_tag }}
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: next
        run: |
          set -euo pipefail
          version="$(.github/scripts/next-app-version.sh rtylr 0.1.0)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=rtylr-v$version" >> "$GITHUB_OUTPUT"
          echo "Creating repository version rtylr-v$version"

  release:
    name: Create repository version
    needs: version
    uses: tryrtylr/pipelines/.github/workflows/create-release.yml@main
    with:
      release_tag: ${{ needs.version.outputs.release_tag }}
      release_name: rtylr v${{ needs.version.outputs.version }}
      version: ${{ needs.version.outputs.version }}
      notes: 'Source version for tryrtylr/rtylr at ${{ github.sha }}. Build and deployment are controlled by tryrtylr/deploy.'
