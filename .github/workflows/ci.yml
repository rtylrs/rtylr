name: Version

# A source push creates release metadata only. Builds and production deploys
# happen later, and only for an app whose version is promoted in tryrtylr/deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  APPS: auth dash erp crm hr finance flow insights menu recruit

jobs:
  changes:
    name: Select changed apps
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      apps: ${{ steps.select.outputs.apps }}
      has_apps: ${{ steps.select.outputs.has_apps }}
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select app releases
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          selected=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            selected="$APPS"
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- apps packages || true)"
            if printf '%s\n' "$changed_files" | grep -q '^packages/'; then
              selected="$APPS"
            else
              for app in $APPS; do
                if printf '%s\n' "$changed_files" | grep -q "^apps/$app/"; then
                  selected="$selected $app"
                fi
              done
            fi
          fi

          selected="$(printf '%s' "$selected" | xargs)"
          if [ -z "$selected" ]; then
            echo 'apps=[{"app":"none"}]' >> "$GITHUB_OUTPUT"
            echo 'has_apps=false' >> "$GITHUB_OUTPUT"
            echo 'No application source changed; no release was created.'
            exit 0
          fi

          matrix="$(jq -cn --arg apps "$selected" '$apps | split(" ") | map({app: .})')"
          echo "apps=$matrix" >> "$GITHUB_OUTPUT"
          echo 'has_apps=true' >> "$GITHUB_OUTPUT"
          echo "Creating versions for: $selected"

  release:
    name: Create ${{ matrix.app }} version
    needs: changes
    if: needs.changes.outputs.has_apps == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.apps) }}
    uses: tryrtylr/pipelines/.github/workflows/create-release.yml@main
    with:
      release_tag: ${{ matrix.app }}-v0.0.${{ github.run_number }}
      release_name: rtylr ${{ matrix.app }} v0.0.${{ github.run_number }}
      version: 0.0.${{ github.run_number }}
      notes: "Source version for ${{ matrix.app }} at ${{ github.sha }}. Build and deployment are controlled by tryrtylr/deploy."
