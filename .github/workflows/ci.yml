name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on PRs/branches so a new push doesn't wait behind a
# stale one. Never cancel main (its runs deploy — let them finish).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Quality gates ──────────────────────────────────────────────────
  # These stay in the calling repo - they reference this repo's scripts
  # (pnpm turbo typecheck/lint/build) and there's no duplication across
  # repos to extract.

  check:
    name: Typecheck, Lint & Build
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate contracts
        run: pnpm contracts:sync

      - name: Audit request contracts
        run: pnpm contracts:audit-requests

      # Persist Turbo's task cache across runs so unchanged packages skip
      # typecheck/build entirely. Keyed per-commit, falling back to the latest.
      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm turbo typecheck --cache-dir=.turbo

      - name: Lint
        run: pnpm lint

      # Unit tests run across every workspace via the root vitest
      # config. Gating here means a broken mapper or schema builder
      # blocks the merge instead of surfacing in prod.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm turbo build --cache-dir=.turbo

      - name: Upload dist artifacts
        # Only upload on main pushes — deploy jobs only run on main and they
        # download this artifact instead of rebuilding, saving ~3 min per app.
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 1

  # ── End-to-end (Playwright) ────────────────────────────────────────
  # Real browser, real Vite dev servers, API stubbed per-test via
  # page.route(). Runs in parallel with `check` (it doesn't need the build) to
  # cut wall-clock; the deploy jobs still gate on both. Hard-gated now that
  # specs are green - if a test goes flaky, tighten the selector rather than
  # re-enabling continue-on-error.
  e2e:
    name: Playwright E2E
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache the downloaded browsers; only re-download when the lockfile
      # (hence the Playwright version) changes. OS deps are cheap to reapply.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright (browsers + OS deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS deps (cached browsers)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run Playwright specs
        run: pnpm test:e2e
        env:
          # Point at a local port with nothing listening. page.route() stubs
          # intercept before the network layer so tests never make real calls.
          # If a stub is missing the request fails with ECONNREFUSED, not a prod hit.
          VITE_API_URL: 'http://localhost:9999/'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Detect which apps changed ──────────────────────────────────────
  # dorny/paths-filter emits one boolean per app. A change under
  # `packages/**` trips every app so shared-lib edits always reship.
  # A manual workflow_dispatch redeploys everything regardless of diff.

  changes:
    name: Detect changed apps
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    outputs:
      auth: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.auth }}
      dash: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.dash }}
      erp: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.erp }}
      crm: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.crm }}
      hr: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.hr }}
      finance: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.finance }}
      flow: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.flow }}
      insights: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.insights }}
      menu: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.menu }}
      docs: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs }}
      recruit: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.recruit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'apps/auth/**'
              - 'packages/**'
            dash:
              - 'apps/dash/**'
              - 'packages/**'
            erp:
              - 'apps/erp/**'
              - 'packages/**'
            crm:
              - 'apps/crm/**'
              - 'packages/**'
            hr:
              - 'apps/hr/**'
              - 'packages/**'
            finance:
              - 'apps/finance/**'
              - 'packages/**'
            flow:
              - 'apps/flow/**'
              - 'packages/**'
            insights:
              - 'apps/insights/**'
              - 'packages/**'
            menu:
              - 'apps/menu/**'
              - 'packages/**'
            docs:
              - 'apps/docs/**'
              - 'packages/**'
            recruit:
              - 'apps/recruit/**'
              - 'packages/**'

  # ── Deploy jobs ────────────────────────────────────────────────────
  # Each job is a thin call into voxire/pipelines. All app-identical
  # build + upload logic lives there; here we only declare the per-app
  # knobs (pnpm filter, dist dir, Cloudflare project name).

  deploy-auth:
    needs: [check, e2e, changes]
    if: needs.changes.outputs.auth == 'true'
    uses: voxire/pipelines/.github/workflows/deploy-pages.yml@main
    with:
      app_filter: '@rtylr/auth'
      dist_dir: dist/auth
      project_name: rtylr-auth
      artifact_name: dist-${{ github.sha }}
      runs_on: blacksmith-2vcpu-ubuntu-2404
    secrets: inherit

  deploy-dash:
    needs: [check, e2e, changes]
    if: needs.changes.outputs.dash == 'true'
    uses: voxire/pipelines/.github/workflows/deploy-pages.yml@main
    with:
      app_filter: dash
      dist_dir: dist/dash
      project_name: rtylr-hub
      artifact_name: dist-${{ github.sha }}
      runs_on: blacksmith-2vcpu-ubuntu-2404
    secrets: inherit

  deploy-erp:
    needs: [check, e2e, changes]
    if: needs.changes.outputs.erp == 'true'
    uses: voxire/pipelines/.github/workflows/deploy-pages.yml@main
    with:
      app_filter: '@rtylr/erp'
      dist_dir: dist/erp
      project_name: rtylr-erp
      artifact_name: dist-${{ github.sha }}
      runs_on: blacksmith-2vcpu-ubuntu-2404
    secrets: inherit

  deploy-crm:
    needs: [check, e2e, changes]
    if: needs.changes.outputs.crm == 'true'
    uses: voxire/pipelines/.github/workflows/deploy-pages.yml@main
    with:
      app_filter: '@rtylr/crm'
      dist_dir: dist/crm
      project_name: rtylr-crm
      artifact_name: dist-${{ github.sha }}
      runs_on: blacksmith-2vcpu-ubuntu-2404
    secrets: inherit

  deploy-hr:
    needs: [check, e2e, changes]
    if: needs.changes.outputs.hr == 'true'
    uses: voxire/pipelines/.github/workflows/deploy-pages.yml@main
    with:
      app_filter: '@rtylr/hr'
      dist_dir: dist/hr
      project_name: rtylr-hr
      artifact_name: dist-${{ github.sha }}
      runs_on: blacksmith-2vcpu-ubuntu-2404
    secrets: inherit

  deploy-finance:
    needs: [check, e2e, changes]
    if: needs.changes.outputs.finance == 'true'
    uses: voxire/pipelines/.github/workflows/deploy-pages.yml@main
    with:
      app_filter: '@rtylr/finance'
      dist_dir: dist/finance
      project_name: rtylr-finance
      artifact_name: dist-${{ github.sha }}
      runs_on: blacksmith-2vcpu-ubuntu-2404
    secrets: inherit

  deploy-flow:
    needs: [check, e2e, changes]
    if: needs.changes.outputs.flow == 'true'
    uses: voxire/pipelines/.github/workflows/deploy-pages.yml@main
    with:
      app_filter: '@rtylr/flow'
      dist_dir: dist/flow
      project_name: rtylr-flow
      artifact_name: dist-${{ github.sha }}
      runs_on: blacksmith-2vcpu-ubuntu-2404
    secrets: inherit

  deploy-insights:
    needs: [check, e2e, changes]
    if: needs.changes.outputs.insights == 'true'
    uses: voxire/pipelines/.github/workflows/deploy-pages.yml@main
    with:
      app_filter: '@rtylr/insights'
      dist_dir: dist/insights
      project_name: rtylr-insights
      artifact_name: dist-${{ github.sha }}
      runs_on: blacksmith-2vcpu-ubuntu-2404
    secrets: inherit

  deploy-menu:
    needs: [check, e2e, changes]
    if: needs.changes.outputs.menu == 'true'
    uses: voxire/pipelines/.github/workflows/deploy-pages.yml@main
    with:
      app_filter: '@rtylr/menu'
      dist_dir: dist/menu
      project_name: rtylr-menu
      artifact_name: dist-${{ github.sha }}
      runs_on: blacksmith-2vcpu-ubuntu-2404
    secrets: inherit

  deploy-docs:
    needs: [check, e2e, changes]
    if: needs.changes.outputs.docs == 'true'
    uses: voxire/pipelines/.github/workflows/deploy-pages.yml@main
    with:
      app_filter: '@rtylr/docs'
      dist_dir: dist/docs
      project_name: rtylr-docs
      artifact_name: dist-${{ github.sha }}
      runs_on: blacksmith-2vcpu-ubuntu-2404
    secrets: inherit

  deploy-recruit:
    needs: [check, e2e, changes]
    if: needs.changes.outputs.recruit == 'true'
    uses: voxire/pipelines/.github/workflows/deploy-pages.yml@main
    with:
      app_filter: '@rtylr/recruit'
      dist_dir: dist/recruit
      project_name: rtylr-recruit
      artifact_name: dist-${{ github.sha }}
      runs_on: blacksmith-2vcpu-ubuntu-2404
    secrets: inherit
