name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on PRs/branches so a new push doesn't wait behind a
# stale one. Never cancel main (its runs deploy — let them finish).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Build & upload ─────────────────────────────────────────────────
  check:
    name: Build
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build
        run: pnpm build

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Sync dist to S3
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: aws s3 sync dist/ s3://voxire-ci-artifacts/${{ github.sha }}/dist/ --delete --no-progress

  # ── Report PR status ──────────────────────────────────────────────
  # Keep one status comment up to date as new commits are pushed instead of
  # adding a new comment for every CI run.
  comment-pr:
    name: Comment CI result on PR
    needs: check
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Update PR status comment
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        with:
          script: |
            const marker = '<!-- rtylr-ci-status -->';
            const checkResult = process.env.CHECK_RESULT;
            const passed = checkResult === 'success';
            const status = passed ? 'passed' : 'failed';
            const emoji = passed ? '✅' : '❌';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const headSha = context.payload.pull_request.head.sha;
            const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${headSha}`;
            const body = [
              marker,
              `## ${emoji} CI ${status}`,
              '',
              `Build job: **${checkResult}**`,
              `Commit: [${headSha.slice(0, 7)}](${commitUrl})`,
              '',
              `[View workflow run](${runUrl})`,
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              },
            );
            const existing = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── Detect which apps changed ──────────────────────────────────────
  # dorny/paths-filter emits one boolean per app. A change under
  # `packages/**` trips every app so shared-lib edits always reship.
  # A manual workflow_dispatch redeploys everything regardless of diff.

  changes:
    name: Detect changed apps
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    outputs:
      auth: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.auth }}
      dash: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.dash }}
      erp: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.erp }}
      crm: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.crm }}
      hr: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.hr }}
      finance: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.finance }}
      flow: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.flow }}
      insights: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.insights }}
      menu: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.menu }}
      recruit: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.recruit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'apps/auth/**'
              - 'packages/**'
            dash:
              - 'apps/dash/**'
              - 'packages/**'
            erp:
              - 'apps/erp/**'
              - 'packages/**'
            crm:
              - 'apps/crm/**'
              - 'packages/**'
            hr:
              - 'apps/hr/**'
              - 'packages/**'
            finance:
              - 'apps/finance/**'
              - 'packages/**'
            flow:
              - 'apps/flow/**'
              - 'packages/**'
            insights:
              - 'apps/insights/**'
              - 'packages/**'
            menu:
              - 'apps/menu/**'
              - 'packages/**'
            recruit:
              - 'apps/recruit/**'
              - 'packages/**'

  # ── Deploy jobs ────────────────────────────────────────────────────
  # Each job is a thin call into tryrtylr/pipelines. All app-identical
  # build + upload logic lives there; here we only declare the per-app
  # knobs (pnpm filter, dist dir, Cloudflare project name).

  deploy-auth:
    needs: [check, changes]
    if: needs.changes.outputs.auth == 'true'
    uses: tryrtylr/pipelines/.github/workflows/deploy-pages.yml@main
    with:
      app_filter: '@rtylr/auth'
      dist_dir: dist/auth
      project_name: rtylr-auth
      artifact_name: dist-${{ github.sha }}
      runs_on: blacksmith-2vcpu-ubuntu-2404
    secrets: inherit

  deploy-dash:
    needs: [check, changes]
    if: needs.changes.outputs.dash == 'true'
    uses: tryrtylr/pipelines/.github/workflows/deploy-pages.yml@main
    with:
      app_filter: dash
      dist_dir: dist/dash
      project_name: rtylr-hub
      artifact_name: dist-${{ github.sha }}
      runs_on: blacksmith-2vcpu-ubuntu-2404
    secrets: inherit

  deploy-erp:
    needs: [check, changes]
    if: needs.changes.outputs.erp == 'true'
    uses: tryrtylr/pipelines/.github/workflows/deploy-pages.yml@main
    with:
      app_filter: '@rtylr/erp'
      dist_dir: dist/erp
      project_name: rtylr-erp
      artifact_name: dist-${{ github.sha }}
      runs_on: blacksmith-2vcpu-ubuntu-2404
    secrets: inherit

  deploy-crm:
    needs: [check, changes]
    if: needs.changes.outputs.crm == 'true'
    uses: tryrtylr/pipelines/.github/workflows/deploy-pages.yml@main
    with:
      app_filter: '@rtylr/crm'
      dist_dir: dist/crm
      project_name: rtylr-crm
      artifact_name: dist-${{ github.sha }}
      runs_on: blacksmith-2vcpu-ubuntu-2404
    secrets: inherit

  deploy-hr:
    needs: [check, changes]
    if: needs.changes.outputs.hr == 'true'
    uses: tryrtylr/pipelines/.github/workflows/deploy-pages.yml@main
    with:
      app_filter: '@rtylr/hr'
      dist_dir: dist/hr
      project_name: rtylr-hr
      artifact_name: dist-${{ github.sha }}
      runs_on: blacksmith-2vcpu-ubuntu-2404
    secrets: inherit

  deploy-finance:
    needs: [check, changes]
    if: needs.changes.outputs.finance == 'true'
    uses: tryrtylr/pipelines/.github/workflows/deploy-pages.yml@main
    with:
      app_filter: '@rtylr/finance'
      dist_dir: dist/finance
      project_name: rtylr-finance
      artifact_name: dist-${{ github.sha }}
      runs_on: blacksmith-2vcpu-ubuntu-2404
    secrets: inherit

  deploy-flow:
    needs: [check, changes]
    if: needs.changes.outputs.flow == 'true'
    uses: tryrtylr/pipelines/.github/workflows/deploy-pages.yml@main
    with:
      app_filter: '@rtylr/flow'
      dist_dir: dist/flow
      project_name: rtylr-flow
      artifact_name: dist-${{ github.sha }}
      runs_on: blacksmith-2vcpu-ubuntu-2404
    secrets: inherit

  deploy-insights:
    needs: [check, changes]
    if: needs.changes.outputs.insights == 'true'
    uses: tryrtylr/pipelines/.github/workflows/deploy-pages.yml@main
    with:
      app_filter: '@rtylr/insights'
      dist_dir: dist/insights
      project_name: rtylr-insights
      artifact_name: dist-${{ github.sha }}
      runs_on: blacksmith-2vcpu-ubuntu-2404
    secrets: inherit

  deploy-menu:
    needs: [check, changes]
    if: needs.changes.outputs.menu == 'true'
    uses: tryrtylr/pipelines/.github/workflows/deploy-pages.yml@main
    with:
      app_filter: '@rtylr/menu'
      dist_dir: dist/menu
      project_name: rtylr-menu
      artifact_name: dist-${{ github.sha }}
      runs_on: blacksmith-2vcpu-ubuntu-2404
    secrets: inherit

  deploy-recruit:
    needs: [check, changes]
    if: needs.changes.outputs.recruit == 'true'
    uses: tryrtylr/pipelines/.github/workflows/deploy-pages.yml@main
    with:
      app_filter: '@rtylr/recruit'
      dist_dir: dist/recruit
      project_name: rtylr-recruit
      artifact_name: dist-${{ github.sha }}
      runs_on: blacksmith-2vcpu-ubuntu-2404
    secrets: inherit

  # ── Slack notification ─────────────────────────────────────────────
  # Fires once after all deploys settle, only when at least one app
  # actually shipped (a CI-config-only commit deploys nothing → no ping).
  notify:
    needs:
      - changes
      - deploy-auth
      - deploy-dash
      - deploy-erp
      - deploy-crm
      - deploy-hr
      - deploy-finance
      - deploy-flow
      - deploy-insights
      - deploy-menu
      - deploy-recruit
    # Gate on the changes job's outputs (a normal job → reliable results).
    # Skipped reusable-workflow deploy jobs can falsely report success to
    # needs.*.result, so we don't key off that. Fire only when ≥1 app
    # actually changed and no deploy failed.
    if: >-
      ${{ always()
      && !contains(needs.*.result, 'failure')
      && ( needs.changes.outputs.auth == 'true'
        || needs.changes.outputs.dash == 'true'
        || needs.changes.outputs.erp == 'true'
        || needs.changes.outputs.crm == 'true'
        || needs.changes.outputs.hr == 'true'
        || needs.changes.outputs.finance == 'true'
        || needs.changes.outputs.flow == 'true'
        || needs.changes.outputs.insights == 'true'
        || needs.changes.outputs.menu == 'true'
        || needs.changes.outputs.recruit == 'true' ) }}
    uses: tryrtylr/pipelines/.github/workflows/notify-slack.yml@main
    with:
      message: ':rocket: *rtylr* — new version deployed to production'
    secrets: inherit
