name: Redeploy release

# Manual escape hatch: ships an existing rtylr-v* release again, for a rollback
# or a failed deploy. A push to main deploys on its own through release.yml.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to deploy, for example rtylr-v6.1.1
        required: true
        type: string
      app:
        description: Target from .github/deploy-targets.json, or all
        required: true
        default: all
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: Plan ${{ inputs.app }} from ${{ inputs.release_tag }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      pages: ${{ steps.plan.outputs.pages }}
      ecs: ${{ steps.plan.outputs.ecs }}
      # 'false' only when this release's migrations already applied cleanly.
      migrate: ${{ steps.applied.outputs.cache-hit == 'true' && 'false' || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh api "repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" --silent

      - name: Resolve version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            rtylr-v[0-9]*) echo "version=${RELEASE_TAG#rtylr-v}" >> "$GITHUB_OUTPUT" ;;
            *) echo 'release_tag must look like rtylr-v1.2.3' >&2; exit 1 ;;
          esac

      - name: Select targets
        id: plan
        env:
          APP: ${{ inputs.app }}
        run: .github/scripts/plan-deploys.sh app "$APP"

      # As in release.yml: a rollback or a re-ship skips migrations its release
      # already applied cleanly, and any failure here means migrating.
      - name: Compute the migration key
        id: migrations
        if: steps.plan.outputs.ecs != '[]'
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch --quiet --depth 1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          key="$(.github/scripts/migration-key.sh "$RELEASE_TAG")"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Look up whether these migrations are applied
        id: applied
        if: steps.migrations.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .migrations-applied
          key: onion-migrations-applied-${{ steps.migrations.outputs.key }}
          lookup-only: true

  deploy:
    name: Deploy
    needs: plan
    uses: ./.github/workflows/deploy.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      version: ${{ needs.plan.outputs.version }}
      pages: ${{ needs.plan.outputs.pages }}
      ecs: ${{ needs.plan.outputs.ecs }}
      migrate: ${{ needs.plan.outputs.migrate }}
    secrets: inherit
