name: Contract submodule

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Verify Voxie submodule
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - name: Verify Voxie submodule
        run: ./scripts/check-voxie-ref.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Voxie dependencies
        working-directory: voxie
        run: pnpm install --frozen-lockfile

      - name: Typecheck generated TypeScript
        working-directory: voxie
        run: pnpm exec tsc --noEmit
