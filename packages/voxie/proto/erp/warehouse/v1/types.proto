syntax = "proto3";

package erp.warehouse.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/warehouse/v1";

message Warehouse {
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  int64 owner_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  string name = 3;
  string address = 4;
  string city = 5;
  string country = 6;
  string manager_name = 7;
  int64 capacity = 8 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  bool is_default = 9;
  bool is_active = 10;
  string created_at = 11;
  string updated_at = 12;
}
