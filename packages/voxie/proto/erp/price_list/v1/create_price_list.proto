syntax = "proto3";

package erp.price_list.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/price_list/v1";

message CreatePriceListRequest {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string currency = 2;
  bool is_default = 3;
}

message CreatePriceListResponse {
  int64 price_list_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  string message = 2;
}
