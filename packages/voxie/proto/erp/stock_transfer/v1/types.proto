syntax = "proto3";

package erp.stock_transfer.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/stock_transfer/v1";

message StockTransferItem {
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  int64 transfer_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  int64 product_id = 3 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  double quantity = 4;
  string created_at = 5;
}

message StockTransfer {
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  int64 owner_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  int64 from_warehouse_id = 3 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  int64 to_warehouse_id = 4 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  string status = 5;
  string notes = 6;
  repeated StockTransferItem items = 7;
  string created_at = 8;
  string updated_at = 9;
}
