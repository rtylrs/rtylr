syntax = "proto3";

package erp.stock_transfer.v1;

import "erp/stock_transfer/v1/create_stock_transfer.proto";
import "erp/stock_transfer/v1/list_stock_transfers.proto";
import "erp/stock_transfer/v1/update_stock_transfer_status.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/stock_transfer/v1";

service StockTransferService {
  option (onekit.http.service_config) = {base_path: "/api/erp/stock-transfer/v1"};

  rpc ListStockTransfers(ListStockTransfersRequest) returns (ListStockTransfersResponse) {
    option (onekit.http.config) = {
      path: "/stock-transfers"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateStockTransfer(CreateStockTransferRequest) returns (CreateStockTransferResponse) {
    option (onekit.http.config) = {
      path: "/stock-transfers"
      method: HTTP_METHOD_POST
    };
  }

  rpc UpdateStockTransferStatus(UpdateStockTransferStatusRequest) returns (UpdateStockTransferStatusResponse) {
    option (onekit.http.config) = {
      path: "/stock-transfers/{id}/status"
      method: HTTP_METHOD_PATCH
      body: "body"
    };
  }
}
