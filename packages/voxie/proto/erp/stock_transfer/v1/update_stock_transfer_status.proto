syntax = "proto3";

package erp.stock_transfer.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/stock_transfer/v1";

message UpdateStockTransferStatusBody {
  string status = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message UpdateStockTransferStatusRequest {
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  UpdateStockTransferStatusBody body = 2;
}

message UpdateStockTransferStatusResponse {
  string message = 1;
}
