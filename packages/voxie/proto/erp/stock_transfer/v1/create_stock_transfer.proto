syntax = "proto3";

package erp.stock_transfer.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/stock_transfer/v1";

message CreateStockTransferItemRequest {
  int64 product_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  double quantity = 2;
}

message CreateStockTransferRequest {
  int64 from_warehouse_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  int64 to_warehouse_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  string notes = 3;
  repeated CreateStockTransferItemRequest items = 4;
}

message CreateStockTransferResponse {
  int64 transfer_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  string message = 2;
}
