syntax = "proto3";

package erp.stock_take.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/stock_take/v1";

message StockTakeItem {
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  int64 stock_take_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  int64 product_id = 3 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  double expected_qty = 4;
  double counted_qty = 5;
  double variance = 6;
  string created_at = 7;
}

message StockTake {
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  int64 owner_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  int64 warehouse_id = 3 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  string status = 4;
  string notes = 5;
  repeated StockTakeItem items = 6;
  string started_at = 7;
  string completed_at = 8;
  string created_at = 9;
}
