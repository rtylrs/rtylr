syntax = "proto3";

package erp.stock_take.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/stock_take/v1";

message CreateStockTakeItemRequest {
  int64 product_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  double expected_qty = 2;
  double counted_qty = 3;
}

message CreateStockTakeRequest {
  int64 warehouse_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  string notes = 2;
  repeated CreateStockTakeItemRequest items = 3;
}

message CreateStockTakeResponse {
  int64 stock_take_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  string message = 2;
}
