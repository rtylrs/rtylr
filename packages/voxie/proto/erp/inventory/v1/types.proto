syntax = "proto3";

package erp.inventory.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/inventory/v1";

// -- Inventory Report --

message InventoryReportItem {
  // product_id is the product id value for this contract.
  int64 product_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // product_name is the product name value for this contract.
  string product_name = 2;
  // sku is the sku value for this contract.
  string sku = 3;
  // unit is the unit value for this contract.
  string unit = 4;
  // stock_quantity is the stock quantity value for this contract.
  double stock_quantity = 5;
  // low_stock_threshold is the low stock threshold value for this contract.
  double low_stock_threshold = 6;
  // reorder_quantity is the reorder quantity value for this contract.
  double reorder_quantity = 7;
  // cost_price is the cost price value for this contract.
  double cost_price = 8;
  // sale_price is the sale price value for this contract.
  double sale_price = 9;
  // stock_value is the stock value value for this contract.
  double stock_value = 10;
  // is_low_stock is the is low stock value for this contract.
  bool is_low_stock = 11;
}

// -- Valuation --

message ValuationItem {
  // category_name is the category name value for this contract.
  string category_name = 1;
  // warehouse_name is the warehouse name value for this contract.
  string warehouse_name = 2;
  // total_items is the total items value for this contract.
  int64 total_items = 3;
  // total_value is the total value value for this contract.
  double total_value = 4;
  // total_cost is the total cost value for this contract.
  double total_cost = 5;
}
