syntax = "proto3";

package erp.inventory.v1;

import "erp/inventory/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/inventory/v1";

message GetValuationRequest {}

message GetValuationResponse {
  // items is the items value for this contract.
  repeated ValuationItem items = 1;
  // total_value is the total value value for this contract.
  double total_value = 2;
}
