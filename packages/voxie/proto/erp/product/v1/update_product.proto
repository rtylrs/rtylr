syntax = "proto3";

package erp.product.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/product/v1";

message UpdateProductBody {
  // category_id is the category id value for this contract.
  int64 category_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // supplier_id is the supplier id value for this contract.
  int64 supplier_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // name is the name value for this contract.
  string name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // sku is the sku value for this contract.
  string sku = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // barcode is the barcode value for this contract.
  string barcode = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // description is the description value for this contract.
  string description = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // unit is the unit value for this contract.
  string unit = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // cost_price is the cost price value for this contract.
  double cost_price = 8 [(buf.validate.field).double.gte = 0];
  // sale_price is the sale price value for this contract.
  double sale_price = 9 [(buf.validate.field).double.gte = 0];
  // low_stock_threshold is the low stock threshold value for this contract.
  double low_stock_threshold = 10 [(buf.validate.field).double.gte = 0];
  // reorder_quantity is the reorder quantity value for this contract.
  double reorder_quantity = 11 [(buf.validate.field).double.gte = 0];
  // is_active is the is active value for this contract.
  bool is_active = 12;
  // track_inventory is the track inventory value for this contract.
  bool track_inventory = 13;
  // stock_quantity is the tracked quantity to store for this product.
  double stock_quantity = 14 [(buf.validate.field).double.gte = 0];
  // brand_id links the product to a brand when present.
  int64 brand_id = 15 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  double compare_at_price = 16 [(buf.validate.field).double.gte = 0];
  double tax_rate = 17 [(buf.validate.field).double.gte = 0];
  string currency = 18;
  double weight = 19 [(buf.validate.field).double.gte = 0];
  string weight_unit = 20;
  double length = 21 [(buf.validate.field).double.gte = 0];
  double width = 22 [(buf.validate.field).double.gte = 0];
  double height = 23 [(buf.validate.field).double.gte = 0];
  string dimension_unit = 24;
  string country_of_origin = 25;
  string hs_code = 26;
  bool allow_backorder = 27;
  int32 lead_time_days = 28 [(buf.validate.field).int32.gte = 0];
  string image_url = 29;
}

message UpdateProductRequest {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // body carries updatable product fields bound from the HTTP payload.
  UpdateProductBody body = 2;
}

message UpdateProductResponse {
  // message is a human-readable result message.
  string message = 1;
}
