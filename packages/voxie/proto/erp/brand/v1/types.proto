syntax = "proto3";

package erp.brand.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/brand/v1";

message Brand {
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  int64 owner_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  string name = 3;
  string logo_url = 4;
  string description = 5;
  int64 product_count = 6 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  string created_at = 7;
  string updated_at = 8;
}
