syntax = "proto3";

package erp.brand.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/brand/v1";

message UpdateBrandBody {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string logo_url = 2;
  string description = 3;
}

message UpdateBrandRequest {
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  UpdateBrandBody body = 2;
}

message UpdateBrandResponse {
  string message = 1;
}
