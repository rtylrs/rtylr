syntax = "proto3";

package erp.variant.v1;

import "erp/variant/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/erp/variant/v1";

message ListVariantsRequest {
  int64 product_id = 1 [(onekit.http.query).name = "product_id",
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}

message ListVariantsResponse {
  repeated Variant variants = 1;
}
