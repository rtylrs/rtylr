syntax = "proto3";

package hub.team.groups.v1;

import "hub/team/groups/v1/add_group_members.proto";
import "hub/team/groups/v1/create_group.proto";
import "hub/team/groups/v1/delete_group.proto";
import "hub/team/groups/v1/get_group_detail.proto";
import "hub/team/groups/v1/get_user_groups.proto";
import "hub/team/groups/v1/list_groups.proto";
import "hub/team/groups/v1/remove_group_member.proto";
import "hub/team/groups/v1/update_group.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/team/groups/v1";

// GroupsService defines hub team group endpoints.
service GroupsService {
  option (onekit.http.service_config) = {base_path: "/api/hub/team/groups/v1"};

  // ListGroups returns groups for the active business.
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse) {
    option (onekit.http.config) = {
      path: "/groups"
      method: HTTP_METHOD_GET
    };
  }

  // CreateGroup creates a new group.
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse) {
    option (onekit.http.config) = {
      path: "/groups"
      method: HTTP_METHOD_POST
    };
  }

  // GetGroupDetail returns a group with its members.
  rpc GetGroupDetail(GetGroupDetailRequest) returns (GetGroupDetailResponse) {
    option (onekit.http.config) = {
      path: "/groups/{id}"
      method: HTTP_METHOD_GET
    };
  }

  // UpdateGroup updates an existing group.
  rpc UpdateGroup(UpdateGroupRequest) returns (UpdateGroupResponse) {
    option (onekit.http.config) = {
      path: "/groups/{id}"
      method: HTTP_METHOD_PUT
    };
  }

  // DeleteGroup deletes a group.
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse) {
    option (onekit.http.config) = {
      path: "/groups/{id}"
      method: HTTP_METHOD_DELETE
    };
  }

  // AddGroupMembers adds users to a group.
  rpc AddGroupMembers(AddGroupMembersRequest) returns (AddGroupMembersResponse) {
    option (onekit.http.config) = {
      path: "/groups/{id}/members"
      method: HTTP_METHOD_POST
    };
  }

  // RemoveGroupMember removes a user from a group.
  rpc RemoveGroupMember(RemoveGroupMemberRequest) returns (RemoveGroupMemberResponse) {
    option (onekit.http.config) = {
      path: "/groups/{id}/members/{user_id}"
      method: HTTP_METHOD_DELETE
    };
  }

  // GetUserGroups returns the groups a user belongs to.
  rpc GetUserGroups(GetUserGroupsRequest) returns (GetUserGroupsResponse) {
    option (onekit.http.config) = {
      path: "/users/{user_id}/groups"
      method: HTTP_METHOD_GET
    };
  }
}
