syntax = "proto3";

package hub.developer.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/developer/v1";

// ── API Keys ────────────────────────────────────────────────────────

message ApiKey {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // name is the name value for this contract.
  string name = 2;
  // key_prefix is the key prefix value for this contract.
  // First 8 chars shown
  string key_prefix = 3;
  // scopes is the scopes value for this contract.
  repeated string scopes = 4;
  // created_at is when the record was created.
  string created_at = 5;
  // last_used_at is the last used at value for this contract.
  string last_used_at = 6;
  // expires_at is the expires at value for this contract.
  string expires_at = 7;
  // is_active is the is active value for this contract.
  bool is_active = 8;
}

// ── Webhooks ────────────────────────────────────────────────────────

message Webhook {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // url is the url value for this contract.
  string url = 2;
  // events is the events value for this contract.
  repeated string events = 3;
  // is_active is the is active value for this contract.
  bool is_active = 4;
  // created_at is when the record was created.
  string created_at = 5;
  // last_triggered_at is the last triggered at value for this contract.
  string last_triggered_at = 6;
}
