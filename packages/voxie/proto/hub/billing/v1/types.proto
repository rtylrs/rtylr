syntax = "proto3";

package hub.billing.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/billing/v1";

// ── Billing ─────────────────────────────────────────────────────────

message BillingSummary {
  // plan is the plan value for this contract.
  string plan = 1;
  // status is the current lifecycle state.
  string status = 2;
  // current_usage is the current usage value for this contract.
  double current_usage = 3;
  // usage_limit is the usage limit value for this contract.
  double usage_limit = 4;
  // next_billing_date is the next billing date value for this contract.
  string next_billing_date = 5;
}

message Invoice {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // amount is the amount value for this contract.
  double amount = 2;
  // currency is the currency value for this contract.
  string currency = 3;
  // status is the current lifecycle state.
  string status = 4;
  // issued_at is the issued at value for this contract.
  string issued_at = 5;
  // paid_at is the paid at value for this contract.
  string paid_at = 6;
}
