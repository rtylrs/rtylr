syntax = "proto3";

package hub.security.v1;

option go_package = "github.com/voxire/voxie/gen/go/hub/security/v1";

// ── Security ───────────────────────────────────────────────────────

message SecurityState {
  // two_factor_enabled is the two factor enabled value for this contract.
  bool two_factor_enabled = 1;
  // active_sessions is the active sessions value for this contract.
  repeated ActiveSession active_sessions = 2;
}

message ActiveSession {
  // id is the unique identifier for the resource.
  string id = 1;
  // ip is the ip value for this contract.
  string ip = 2;
  // user_agent is the user agent value for this contract.
  string user_agent = 3;
  // created_at is when the record was created.
  string created_at = 4;
  // is_current is the is current value for this contract.
  bool is_current = 5;
}

message LoginEntry {
  // email is the email address used for lookup or contact.
  string email = 1;
  // method is the method value for this contract.
  string method = 2;
  // ip is the ip value for this contract.
  string ip = 3;
  // user_agent is the user agent value for this contract.
  string user_agent = 4;
  // success is the success value for this contract.
  bool success = 5;
  // created_at is when the record was created.
  string created_at = 6;
}
