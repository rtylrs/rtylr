syntax = "proto3";

package hub.subscription.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/subscription/v1";

message Subscription {
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  string plan_name = 2;
  string plan_slug = 3;
  repeated string apps = 4;
  int32 price_per_seat_cents = 5;
  string status = 6;
  bool is_granted = 7;
  int32 seat_count = 8;
  int32 included_seat_limit = 9;
  int32 included_seat_count = 10;
  int32 billable_seat_count = 11;
  optional string grant_expires_at = 12 [(onekit.http.nullable) = true];
  optional string trial_ends_at = 13 [(onekit.http.nullable) = true];
  optional string next_billing_date = 14 [(onekit.http.nullable) = true];
  string paddle_subscription_id = 15;
}

message Plan {
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  string name = 2;
  string slug = 3;
  repeated string apps = 4;
  int32 price_per_seat_cents = 5;
  int32 annual_price_per_seat_cents = 6;
  int32 trial_days = 7;
  string tagline = 8;
  optional int32 max_seats = 9 [(onekit.http.nullable) = true];
  optional int32 max_locations = 10 [(onekit.http.nullable) = true];
  int32 ai_credits_per_month = 11;
  repeated string features = 12;
  int32 tier_order = 13;
  bool is_solo = 14;
  bool is_featured = 15;
  bool is_active = 16;
}

message BillingLineItem {
  string period_start = 1;
  optional string period_end = 2 [(onekit.http.nullable) = true];
  int32 seat_count = 3;
  int32 included_seat_limit = 4;
  int32 included_seat_count = 5;
  int32 billable_seat_count = 6;
  int32 included_cents = 7;
  int32 price_per_seat_cents = 8;
  int32 amount_cents = 9;
  string type = 10;
  string description = 11;
  bool is_granted = 12;
  optional string grant_expires_at = 13 [(onekit.http.nullable) = true];
  string addon_id = 14;
  int32 quantity = 15;
  int32 unit_price_cents = 16;
}

message BillingDetail {
  string billing_month = 1;
  optional string next_billing_date = 2 [(onekit.http.nullable) = true];
  repeated BillingLineItem line_items = 3;
  int32 total_cents = 4;
  string plan_name = 5;
  int32 price_per_seat_cents = 6;
  int32 current_seat_count = 7;
  int32 included_seat_limit = 8;
  int32 included_seat_count = 9;
  int32 billable_seat_count = 10;
  int32 seat_discount_cents = 11;
  string status = 12;
  bool is_granted = 13;
  optional string grant_expires_at = 14 [(onekit.http.nullable) = true];
  optional string trial_ends_at = 15 [(onekit.http.nullable) = true];
  string paddle_subscription_id = 16;
}

message BillingHistoryMonth {
  string month = 1;
  int32 total_cents = 2;
  repeated BillingLineItem line_items = 3;
  string status = 4;
}
