syntax = "proto3";

package hub.config.v1;

option go_package = "github.com/voxire/voxie/gen/go/hub/config/v1";

// ── Industries ──────────────────────────────────────────────────────

message IndustryType {
  // slug is the slug value for this contract.
  string slug = 1;
  // label is the label value for this contract.
  string label = 2;
  // icon is the icon value for this contract.
  string icon = 3;
}

message IndustryGroup {
  // category is the category value for this contract.
  string category = 1;
  // types is the types value for this contract.
  repeated IndustryType types = 2;
}

message GetIndustriesRequest {}

message GetIndustriesResponse {
  // groups is the groups value for this contract.
  repeated IndustryGroup groups = 1;
}
