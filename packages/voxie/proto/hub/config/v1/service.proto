syntax = "proto3";

package hub.config.v1;

import "hub/config/v1/create_config.proto";
import "hub/config/v1/get_config.proto";
import "hub/config/v1/get_industries.proto";
import "hub/config/v1/update_config.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/config/v1";

// ConfigService defines hub configuration endpoints.
service ConfigService {
  option (onekit.http.service_config) = {base_path: "/api/hub/config/v1"};

  // GetConfig returns the active business configuration.
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse) {
    option (onekit.http.config) = {
      path: "/config"
      method: HTTP_METHOD_GET
    };
  }

  // CreateConfig creates the business configuration.
  rpc CreateConfig(CreateConfigRequest) returns (CreateConfigResponse) {
    option (onekit.http.config) = {
      path: "/config"
      method: HTTP_METHOD_POST
    };
  }

  // UpdateConfig updates the business configuration.
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse) {
    option (onekit.http.config) = {
      path: "/config"
      method: HTTP_METHOD_PUT
    };
  }

  // GetIndustries returns the industry catalog grouped by category.
  rpc GetIndustries(GetIndustriesRequest) returns (GetIndustriesResponse) {
    option (onekit.http.config) = {
      path: "/industries"
      method: HTTP_METHOD_GET
    };
  }
}
