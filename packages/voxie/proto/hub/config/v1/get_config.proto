syntax = "proto3";

package hub.config.v1;

import "hub/business/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/config/v1";

// ── Config ──────────────────────────────────────────────────────────

message GetConfigRequest {}

message GetConfigResponse {
  // business is the business value for this contract.
  .hub.business.v1.Business business = 1;
  // maintenance is the maintenance value for this contract.
  bool maintenance = 2;
}
