syntax = "proto3";

package hub.menu.v1;

import "buf/validate/validate.proto";
import "pos/menu_item/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/menu/v1";

message UpdateMenuRequest {
  // items is the items value for this contract.
  repeated .pos.menu_item.v1.MenuItem items = 1 [(buf.validate.field).repeated.min_items = 1];
}

message UpdateMenuResponse {
  // success is the success value for this contract.
  bool success = 1;
}
