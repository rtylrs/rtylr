syntax = "proto3";

package hub.menu.v1;

import "onekit/http/annotations.proto";
import "pos/menu_item/v1/types.proto";


option go_package = "github.com/voxire/voxie/gen/go/hub/menu/v1";

// ── Menu ────────────────────────────────────────────────────────────

message MenuItem {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // label is the label value for this contract.
  string label = 2;
  // icon is the icon value for this contract.
  string icon = 3;
  // path is the path value for this contract.
  string path = 4;
  // app is the app value for this contract.
  string app = 5;
  // position is the position value for this contract.
  int32 position = 6;
  // visible is the visible value for this contract.
  bool visible = 7;
  // children is the children value for this contract.
  repeated .pos.menu_item.v1.MenuItem children = 8;
}
