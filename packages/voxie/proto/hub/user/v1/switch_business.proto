syntax = "proto3";

package hub.user.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/user/v1";

message SwitchBusinessRequest {
  // business_id is the business to activate in the current session.
  int64 business_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}

message SwitchBusinessResponse {
  // token is a fresh JWT scoped to the selected business.
  string token = 1;
}
