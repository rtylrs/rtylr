syntax = "proto3";

package hub.ai.v1;

import "buf/validate/validate.proto";
import "hub/ai/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/ai/v1";

message GetAiQuotaSettingsRequest {}

message GetAiQuotaSettingsResponse {
  AiQuotaSettings settings = 1;
}

message UpdateAiQuotaSettingsRequest {
  string mode = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message UpdateAiQuotaSettingsResponse {
  AiQuotaSettings settings = 1;
}
