syntax = "proto3";

package hub.permission.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/permission/v1";

// ── Permissions ─────────────────────────────────────────────────────

message PermissionMatrix {
  // rows is the rows value for this contract.
  repeated PermissionRow rows = 1;
  // roles is the roles value for this contract.
  repeated string roles = 2;
}

message PermissionRow {
  // key is the key value for this contract.
  string key = 1;
  // category is the category value for this contract.
  string category = 2;
  // label is the label value for this contract.
  string label = 3;
  // role_values is the role values value for this contract.
  // role -> enabled
  map<string, bool> role_values = 4;
}

// ── Roles ───────────────────────────────────────────────────────────

message CustomRole {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // name is the name value for this contract.
  string name = 2;
  // description is the description value for this contract.
  string description = 3;
  // permissions is the permissions value for this contract.
  repeated string permissions = 4;
  // member_count is the member count value for this contract.
  int32 member_count = 5;
  // created_at is when the record was created.
  string created_at = 6;
}
