syntax = "proto3";

package hub.business.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/business/v1";

message CreateSubBusinessRequest {
  // name is the name value for this contract.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // parent_business_id identifies the parent business the sub-business belongs to.
  int64 parent_business_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}

message CreateSubBusinessResponse {
  // id is the unique identifier for the created business.
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}
