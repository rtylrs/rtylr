syntax = "proto3";

package hub.business.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/business/v1";

message CheckBusinessNameExistsRequest {
  // name is the business name to probe for global uniqueness.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (onekit.http.query).name = "name"
  ];
}

message CheckBusinessNameExistsResponse {
  // exists is true when a business with this name is already registered.
  bool exists = 1;
}
