syntax = "proto3";

package hub.feature.v1;

import "buf/validate/validate.proto";
import "hub/feature/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/feature/v1";

message ListRulesRequest {
  string feature_key = 1 [
    (onekit.http.query).name = "feature_key",
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message ListRulesResponse {
  repeated FeatureRule rules = 1;
}

message CreateRuleRequest {
  string feature_key = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  int32 priority = 2;
  string description = 3;
  string variant = 4;
  int32 rollout_percentage = 5;
  bool enabled = 6;
  repeated FeatureCondition conditions = 7;
}

message CreateRuleResponse {
  int64 rule_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  string message = 2;
}

message UpdateRuleRequest {
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  int32 priority = 2;
  string description = 3;
  string variant = 4;
  int32 rollout_percentage = 5;
  bool enabled = 6;
  repeated FeatureCondition conditions = 7;
}

message UpdateRuleResponse {
  string message = 1;
}

message DeleteRuleRequest {
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
}

message DeleteRuleResponse {
  string message = 1;
}
