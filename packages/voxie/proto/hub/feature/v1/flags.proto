syntax = "proto3";

package hub.feature.v1;

import "buf/validate/validate.proto";
import "hub/feature/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/feature/v1";

message ListFlagsRequest {}

message ListFlagsResponse {
  repeated FeatureFlag flags = 1;
}

message UpsertFlagRequest {
  string key = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string description = 2;
  bool enabled = 3;
  int32 rollout_percentage = 4;
  string variant_on = 5;
  string variant_off = 6;
}

message UpsertFlagResponse {
  string message = 1;
}

message DeleteFlagRequest {
  string key = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message DeleteFlagResponse {
  string message = 1;
}
