syntax = "proto3";

package hub.feature.v1;

import "hub/feature/v1/flags.proto";
import "hub/feature/v1/resolve_features.proto";
import "hub/feature/v1/rules.proto";
import "hub/feature/v1/targets.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hub/feature/v1";

service FeatureService {
  option (onekit.http.service_config) = {base_path: "/api/hub/feature/v1"};

  rpc ResolveFeatures(ResolveFeaturesRequest) returns (ResolveFeaturesResponse) {
    option (onekit.http.config) = {
      path: "/features"
      method: HTTP_METHOD_POST
      body: "*"
    };
  }

  rpc ResolveMyFeatures(ResolveMyFeaturesRequest) returns (ResolveMyFeaturesResponse) {
    option (onekit.http.config) = {
      path: "/features/me"
      method: HTTP_METHOD_POST
      body: "*"
    };
  }

  rpc ListFlags(ListFlagsRequest) returns (ListFlagsResponse) {
    option (onekit.http.config) = {
      path: "/features/admin/flags"
      method: HTTP_METHOD_GET
    };
  }

  rpc UpsertFlag(UpsertFlagRequest) returns (UpsertFlagResponse) {
    option (onekit.http.config) = {
      path: "/features/admin/flags"
      method: HTTP_METHOD_PUT
      body: "*"
    };
  }

  rpc DeleteFlag(DeleteFlagRequest) returns (DeleteFlagResponse) {
    option (onekit.http.config) = {
      path: "/features/admin/flags/{key}"
      method: HTTP_METHOD_DELETE
    };
  }

  rpc ListTargets(ListTargetsRequest) returns (ListTargetsResponse) {
    option (onekit.http.config) = {
      path: "/features/admin/targets"
      method: HTTP_METHOD_GET
    };
  }

  rpc UpsertTarget(UpsertTargetRequest) returns (UpsertTargetResponse) {
    option (onekit.http.config) = {
      path: "/features/admin/targets"
      method: HTTP_METHOD_PUT
      body: "*"
    };
  }

  rpc DeleteTarget(DeleteTargetRequest) returns (DeleteTargetResponse) {
    option (onekit.http.config) = {
      path: "/features/admin/targets/{feature_key}/{owner_id}"
      method: HTTP_METHOD_DELETE
    };
  }

  rpc ListRules(ListRulesRequest) returns (ListRulesResponse) {
    option (onekit.http.config) = {
      path: "/features/admin/rules"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateRule(CreateRuleRequest) returns (CreateRuleResponse) {
    option (onekit.http.config) = {
      path: "/features/admin/rules"
      method: HTTP_METHOD_POST
      body: "*"
    };
  }

  rpc UpdateRule(UpdateRuleRequest) returns (UpdateRuleResponse) {
    option (onekit.http.config) = {
      path: "/features/admin/rules"
      method: HTTP_METHOD_PUT
      body: "*"
    };
  }

  rpc DeleteRule(DeleteRuleRequest) returns (DeleteRuleResponse) {
    option (onekit.http.config) = {
      path: "/features/admin/rules/{id}"
      method: HTTP_METHOD_DELETE
    };
  }
}
