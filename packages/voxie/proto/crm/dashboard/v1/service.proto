syntax = "proto3";

package crm.dashboard.v1;

import "crm/dashboard/v1/get_dashboard.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/crm/dashboard/v1";

// DashboardService defines the CRM dashboard endpoint.
service DashboardService {
  option (onekit.http.service_config) = {base_path: "/api/crm/dashboard/v1"};

  // GetDashboard returns CRM summary metrics for the active business.
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse) {
    option (onekit.http.config) = {
      path: "/dashboard"
      method: HTTP_METHOD_GET
    };
  }
}
