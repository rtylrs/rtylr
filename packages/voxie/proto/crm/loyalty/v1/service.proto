syntax = "proto3";

package crm.loyalty.v1;

import "crm/loyalty/v1/award_points.proto";
import "crm/loyalty/v1/create_loyalty_tier.proto";
import "crm/loyalty/v1/get_loyalty_config.proto";
import "crm/loyalty/v1/list_loyalty_tiers.proto";
import "crm/loyalty/v1/list_loyalty_transactions.proto";
import "crm/loyalty/v1/redeem_points.proto";
import "crm/loyalty/v1/update_loyalty_config.proto";
import "crm/loyalty/v1/update_loyalty_tier.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/crm/loyalty/v1";

// LoyaltyService defines CRM loyalty program endpoints.
service LoyaltyService {
  option (onekit.http.service_config) = {base_path: "/api/crm/loyalty/v1"};

  // GetLoyaltyConfig returns the loyalty program configuration.
  rpc GetLoyaltyConfig(GetLoyaltyConfigRequest) returns (GetLoyaltyConfigResponse) {
    option (onekit.http.config) = {
      path: "/config"
      method: HTTP_METHOD_GET
    };
  }

  // UpdateLoyaltyConfig updates the loyalty program configuration.
  rpc UpdateLoyaltyConfig(UpdateLoyaltyConfigRequest) returns (UpdateLoyaltyConfigResponse) {
    option (onekit.http.config) = {
      path: "/config"
      method: HTTP_METHOD_PATCH
    };
  }

  // ListLoyaltyTiers returns all loyalty tiers.
  rpc ListLoyaltyTiers(ListLoyaltyTiersRequest) returns (ListLoyaltyTiersResponse) {
    option (onekit.http.config) = {
      path: "/tiers"
      method: HTTP_METHOD_GET
    };
  }

  // CreateLoyaltyTier creates a new loyalty tier.
  rpc CreateLoyaltyTier(CreateLoyaltyTierRequest) returns (CreateLoyaltyTierResponse) {
    option (onekit.http.config) = {
      path: "/tiers"
      method: HTTP_METHOD_POST
    };
  }

  // UpdateLoyaltyTier updates an existing loyalty tier.
  rpc UpdateLoyaltyTier(UpdateLoyaltyTierRequest) returns (UpdateLoyaltyTierResponse) {
    option (onekit.http.config) = {
      path: "/tiers/{id}"
      method: HTTP_METHOD_PUT
      body: "body"
    };
  }

  // ListLoyaltyTransactions returns paginated loyalty transactions.
  rpc ListLoyaltyTransactions(ListLoyaltyTransactionsRequest) returns (ListLoyaltyTransactionsResponse) {
    option (onekit.http.config) = {
      path: "/transactions"
      method: HTTP_METHOD_GET
    };
  }

  // AwardPoints awards loyalty points to a customer.
  rpc AwardPoints(AwardPointsRequest) returns (AwardPointsResponse) {
    option (onekit.http.config) = {
      path: "/award"
      method: HTTP_METHOD_POST
    };
  }

  // RedeemPoints redeems loyalty points for a customer.
  rpc RedeemPoints(RedeemPointsRequest) returns (RedeemPointsResponse) {
    option (onekit.http.config) = {
      path: "/redeem"
      method: HTTP_METHOD_POST
    };
  }
}
