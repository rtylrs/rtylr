syntax = "proto3";

package crm.loyalty.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/crm/loyalty/v1";

// ── Loyalty Config ─────────────────────────────────────────────────

message LoyaltyConfig {
  // id is the unique identifier for the resource.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // owner_id identifies the tenant that owns the resource.
  int64 owner_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // is_enabled is the is enabled value for this contract.
  bool is_enabled = 3;
  // points_per_currency_unit is the points per currency unit value for this contract.
  double points_per_currency_unit = 4;
  // currency_per_point is the currency per point value for this contract.
  double currency_per_point = 5;
  // bronze_min is the bronze min value for this contract.
  int64 bronze_min = 6;
  // silver_min is the silver min value for this contract.
  int64 silver_min = 7;
  // gold_min is the gold min value for this contract.
  int64 gold_min = 8;
  // platinum_min is the platinum min value for this contract.
  int64 platinum_min = 9;
  // bronze_discount_pct is the bronze discount pct value for this contract.
  double bronze_discount_pct = 10;
  // silver_discount_pct is the silver discount pct value for this contract.
  double silver_discount_pct = 11;
  // gold_discount_pct is the gold discount pct value for this contract.
  double gold_discount_pct = 12;
  // platinum_discount_pct is the platinum discount pct value for this contract.
  double platinum_discount_pct = 13;
  // points_expiry_days is the points expiry days value for this contract.
  int64 points_expiry_days = 14;
  // updated_at is when the record was last updated.
  string updated_at = 15;
}

// ── Loyalty Transactions ───────────────────────────────────────────

message LoyaltyTransaction {
  // id is the unique identifier for the resource.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // owner_id identifies the tenant that owns the resource.
  int64 owner_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // customer_id is the customer id value for this contract.
  int64 customer_id = 3 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // type is the type value for this contract.
  string type = 4;
  // points is the points value for this contract.
  int64 points = 5;
  // balance_before is the balance before value for this contract.
  int64 balance_before = 6;
  // balance_after is the balance after value for this contract.
  int64 balance_after = 7;
  // description is the description value for this contract.
  string description = 8;
  // reference_id is the reference id value for this contract.
  optional int64 reference_id = 9 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING, (onekit.http.nullable) = true];
  // reference_type is the reference type value for this contract.
  string reference_type = 10;
  // created_at is when the record was created.
  string created_at = 11;
}

// ── Loyalty Tiers ──────────────────────────────────────────────────

message LoyaltyTier {
  // id is the unique identifier for the resource.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // owner_id identifies the tenant that owns the resource.
  int64 owner_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // name is the name value for this contract.
  string name = 3;
  // min_points is the min points value for this contract.
  int64 min_points = 4;
  // discount_pct is the discount pct value for this contract.
  double discount_pct = 5;
  // perks is the perks value for this contract.
  string perks = 6;
  // sort_order is the sort order value for this contract.
  int64 sort_order = 7;
  // created_at is when the record was created.
  string created_at = 8;
  // updated_at is when the record was last updated.
  string updated_at = 9;
}
