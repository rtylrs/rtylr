syntax = "proto3";

package crm.segment.v1;

import "buf/validate/validate.proto";
import "crm/segment/v1/types.proto";
import "pos/customer/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/crm/segment/v1";

message GetSegmentDetailRequest {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}

message GetSegmentDetailResponse {
  // segment is the segment value for this contract.
  Segment segment = 1;
  // customers is the customers value for this contract.
  repeated .pos.customer.v1.Customer customers = 2;
}
