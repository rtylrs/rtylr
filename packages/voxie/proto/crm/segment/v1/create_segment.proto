syntax = "proto3";

package crm.segment.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/crm/segment/v1";

message CreateSegmentRequest {
  // name is the name value for this contract.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // description is the description value for this contract.
  string description = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // filters is the JSON filter definition for this segment.
  string filters = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message CreateSegmentResponse {
  // segment_id is the segment id value for this contract.
  int64 segment_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // message is a human-readable result message.
  string message = 2;
}
