syntax = "proto3";

package crm.template.v1;

import "google/protobuf/struct.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/crm/template/v1";

message Template {
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  int64 owner_id = 2 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  string name = 3;
  string type = 4;
  string subject = 5;
  string body = 6;
  google.protobuf.Value variables = 7;
  bool is_active = 8;
  string created_at = 9;
  string updated_at = 10;
}
