syntax = "proto3";

package finance.journal.v1;

import "finance/journal/v1/create_journal_entry.proto";
import "finance/journal/v1/get_journal_entry.proto";
import "finance/journal/v1/list_journal_entries.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/journal/v1";

// JournalService defines journal entry endpoints.
service JournalService {
  option (onekit.http.service_config) = {base_path: "/api/finance/journal/v1"};

  rpc ListJournalEntries(ListJournalEntriesRequest) returns (ListJournalEntriesResponse) {
    option (onekit.http.config) = {
      path: "/entries"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateJournalEntry(CreateJournalEntryRequest) returns (CreateJournalEntryResponse) {
    option (onekit.http.config) = {
      path: "/entries"
      method: HTTP_METHOD_POST
    };
  }

  rpc GetJournalEntry(GetJournalEntryRequest) returns (GetJournalEntryResponse) {
    option (onekit.http.config) = {
      path: "/entries/{id}"
      method: HTTP_METHOD_GET
    };
  }
}
