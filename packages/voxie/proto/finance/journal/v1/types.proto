syntax = "proto3";

package finance.journal.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/journal/v1";

// ── Journal Entries ─────────────────────────────────────────────────

message JournalEntry {
  // id is the unique identifier for the resource.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // number is the number value for this contract.
  string number = 2;
  // date is the date value for this contract.
  string date = 3;
  // description is the description value for this contract.
  string description = 4;
  // lines is the lines value for this contract.
  repeated JournalLine lines = 5;
  // status is the current lifecycle state.
  // draft, posted
  string status = 6;
  // created_at is when the record was created.
  string created_at = 7;
}

message JournalLine {
  // account_id is the account id value for this contract.
  int64 account_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // account_name is the account name value for this contract.
  string account_name = 2;
  // debit is the debit value for this contract.
  double debit = 3;
  // credit is the credit value for this contract.
  double credit = 4;
  // description is the description value for this contract.
  string description = 5;
}
