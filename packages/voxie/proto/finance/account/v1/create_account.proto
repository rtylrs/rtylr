syntax = "proto3";

package finance.account.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/account/v1";

message CreateAccountRequest {
  // name is the name value for this contract.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // type is the type value for this contract.
  string type = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // currency is the currency value for this contract.
  string currency = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // balance is the balance value for this contract.
  double balance = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).double.gte = 0
  ];
  // is_active is the is active value for this contract.
  bool is_active = 5;
}

message CreateAccountResponse {
  // id is the unique identifier for the resource.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // message is a human-readable result message.
  string message = 2;
}
