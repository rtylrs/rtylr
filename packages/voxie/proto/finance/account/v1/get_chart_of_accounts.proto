syntax = "proto3";

package finance.account.v1;

option go_package = "github.com/voxire/voxie/gen/go/finance/account/v1";

message GetChartOfAccountsRequest {}

message ChartOfAccountsNode {
  int64 id = 1;
  string name = 2;
  string code = 3;
  string type = 4;
  repeated ChartOfAccountsNode children = 5;
}

message GetChartOfAccountsResponse {
  repeated ChartOfAccountsNode tree = 1;
}
