syntax = "proto3";

package finance.expenses.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/expenses/v1";

// ── Expenses ────────────────────────────────────────────────────────

message Expense {
  // id is the unique identifier for the resource.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // owner_id identifies the tenant that owns the resource.
  int64 owner_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // category_id is the category id value for this contract.
  optional int64 category_id = 3 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING, (onekit.http.nullable) = true];
  // amount is the amount value for this contract.
  double amount = 4;
  // currency is the currency value for this contract.
  string currency = 5;
  // description is the description value for this contract.
  string description = 6;
  // vendor is the vendor value for this contract.
  string vendor = 7;
  // receipt_url is the receipt url value for this contract.
  string receipt_url = 8;
  // expense_date is the expense date value for this contract.
  string expense_date = 9;
  // status is the current lifecycle state.
  string status = 10;
  // created_at is when the record was created.
  string created_at = 11;
  // updated_at is when the record was last updated.
  string updated_at = 12;
}

// ── Expense Categories ─────────────────────────────────────────────

message ExpenseCategory {
  // id is the unique identifier for the resource.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // owner_id identifies the tenant that owns the resource.
  int64 owner_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // name is the name value for this contract.
  string name = 3;
  // color is the color value for this contract.
  string color = 4;
  // created_at is when the record was created.
  string created_at = 5;
}
