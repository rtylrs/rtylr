syntax = "proto3";

package finance.report.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/report/v1";

// -- Tax Config --

message TaxConfig {
  // id is the unique identifier for the resource.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // owner_id identifies the tenant that owns the resource.
  int64 owner_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // name is the name value for this contract.
  string name = 3;
  // rate is the rate value for this contract.
  double rate = 4;
  // type is the type value for this contract.
  string type = 5;
  // is_default is the is default value for this contract.
  bool is_default = 6;
  // is_active is the is active value for this contract.
  bool is_active = 7;
  // created_at is when the record was created.
  string created_at = 8;
}

// -- Expense Categories (from invoices module) --

message ExpenseCategoryDetail {
  // id is the unique identifier for the resource.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // owner_id identifies the tenant that owns the resource.
  int64 owner_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // name is the name value for this contract.
  string name = 3;
  // color is the color value for this contract.
  string color = 4;
  // icon is the icon value for this contract.
  string icon = 5;
  // created_at is when the record was created.
  string created_at = 6;
}
