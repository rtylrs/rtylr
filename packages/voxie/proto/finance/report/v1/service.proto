syntax = "proto3";

package finance.report.v1;

import "finance/report/v1/create_expense_category_detail.proto";
import "finance/report/v1/create_tax_config.proto";
import "finance/report/v1/get_pl_report.proto";
import "finance/report/v1/get_tax_report.proto";
import "finance/report/v1/list_expense_category_details.proto";
import "finance/report/v1/list_tax_config.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/report/v1";

// ReportService defines finance reporting endpoints.
service ReportService {
  option (onekit.http.service_config) = {base_path: "/api/finance/report/v1"};

  rpc GetPLReport(GetPLReportRequest) returns (GetPLReportResponse) {
    option (onekit.http.config) = {
      path: "/pl"
      method: HTTP_METHOD_GET
    };
  }

  rpc GetTaxReport(GetTaxReportRequest) returns (GetTaxReportResponse) {
    option (onekit.http.config) = {
      path: "/tax"
      method: HTTP_METHOD_GET
    };
  }

  rpc ListExpenseCategoryDetails(ListExpenseCategoryDetailsRequest) returns (ListExpenseCategoryDetailsResponse) {
    option (onekit.http.config) = {
      path: "/expense-categories"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateExpenseCategoryDetail(CreateExpenseCategoryDetailRequest) returns (CreateExpenseCategoryDetailResponse) {
    option (onekit.http.config) = {
      path: "/expense-categories"
      method: HTTP_METHOD_POST
    };
  }

  rpc ListTaxConfig(ListTaxConfigRequest) returns (ListTaxConfigResponse) {
    option (onekit.http.config) = {
      path: "/tax-config"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateTaxConfig(CreateTaxConfigRequest) returns (CreateTaxConfigResponse) {
    option (onekit.http.config) = {
      path: "/tax-config"
      method: HTTP_METHOD_POST
    };
  }
}
