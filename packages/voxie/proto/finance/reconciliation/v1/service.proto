syntax = "proto3";

package finance.reconciliation.v1;

import "finance/reconciliation/v1/get_overview.proto";
import "finance/reconciliation/v1/match.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/reconciliation/v1";

service ReconciliationService {
  option (onekit.http.service_config) = {base_path: "/api/finance/reconciliation/v1"};

  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse) {
    option (onekit.http.config) = {
      path: "/reconciliation"
      method: HTTP_METHOD_GET
    };
  }

  rpc Match(MatchRequest) returns (MatchResponse) {
    option (onekit.http.config) = {
      path: "/reconciliation/match"
      method: HTTP_METHOD_POST
      body: "*"
    };
  }
}
