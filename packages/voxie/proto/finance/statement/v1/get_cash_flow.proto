syntax = "proto3";

package finance.statement.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/statement/v1";

message GetCashFlowRequest {
  string period = 1 [(onekit.http.query).name = "period"];
}

message GetCashFlowResponse {
  string period = 1;
  double operating_inflow = 2;
  double operating_outflow = 3;
  double net_operating = 4;
  double net_cash_flow = 5;
}
