syntax = "proto3";

package finance.statement.v1;

option go_package = "github.com/voxire/voxie/gen/go/finance/statement/v1";

message GetBalanceSheetRequest {}

message GetBalanceSheetResponse {
  double total_assets = 1;
  double total_liabilities = 2;
  double total_equity = 3;
  double cash_balance = 4;
  double accounts_receivable = 5;
  double accounts_payable = 6;
}
