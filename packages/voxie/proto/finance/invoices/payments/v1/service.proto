syntax = "proto3";

package finance.invoices.payments.v1;

import "finance/invoices/payments/v1/record_payment.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/invoices/payments/v1";

// InvoicePaymentService records payments against invoices.
service InvoicePaymentService {
  option (onekit.http.service_config) = {base_path: "/api/finance/invoices/payments/v1"};

  rpc RecordPayment(RecordPaymentRequest) returns (RecordPaymentResponse) {
    option (onekit.http.config) = {
      path: "/invoices/{invoice_id}/payment"
      method: HTTP_METHOD_POST
    };
  }
}
