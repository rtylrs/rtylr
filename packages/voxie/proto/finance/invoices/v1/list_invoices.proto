syntax = "proto3";

package finance.invoices.v1;

import "finance/invoices/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/invoices/v1";

message ListInvoicesRequest {
  // status filters invoices by lifecycle state.
  string status = 1 [(onekit.http.query).name = "status"];
  // search filters by customer or invoice number.
  string search = 2 [(onekit.http.query).name = "search"];
  // date_from is the inclusive start date filter.
  string date_from = 3 [(onekit.http.query).name = "date_from"];
  // date_to is the inclusive end date filter.
  string date_to = 4 [(onekit.http.query).name = "date_to"];
  // page is the one-based page number to return.
  int64 page = 5 [
    (onekit.http.query).name = "page",
    (onekit.http.int64_encoding) = INT64_ENCODING_NUMBER
  ];
  // page_size is the maximum number of invoices to return.
  int64 page_size = 6 [
    (onekit.http.query).name = "page_size",
    (onekit.http.int64_encoding) = INT64_ENCODING_NUMBER
  ];
}

message ListInvoicesResponse {
  // invoices is the invoices value for this contract.
  repeated InvoiceSummary invoices = 1;
  // page is the current result page.
  int64 page = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_NUMBER];
  // page_size is the number of records requested per page.
  int64 page_size = 3 [(onekit.http.int64_encoding) = INT64_ENCODING_NUMBER];
  // has_more indicates whether additional pages are available.
  bool has_more = 4;
}
