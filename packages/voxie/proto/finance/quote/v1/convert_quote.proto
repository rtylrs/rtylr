syntax = "proto3";

package finance.quote.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/quote/v1";

message ConvertQuoteRequest {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}

message ConvertQuoteResponse {
  // invoice_id is the identifier of the invoice created from this quote.
  int64 invoice_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // message is a human-readable result message.
  string message = 2;
}
