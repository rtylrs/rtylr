syntax = "proto3";

package finance.bank_account.v1;

import "buf/validate/validate.proto";
import "finance/bank_account/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/bank_account/v1";

message GetBankAccountRequest {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}

message GetBankAccountResponse {
  // account is the account value for this contract.
  BankAccount account = 1;
}
