syntax = "proto3";

package finance.bill.v1;

import "buf/validate/validate.proto";
import "finance/bill/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/finance/bill/v1";

message GetBillRequest {
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}

message GetBillResponse {
  Bill bill = 1;
}
