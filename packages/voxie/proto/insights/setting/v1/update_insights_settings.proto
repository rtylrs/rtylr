syntax = "proto3";

package insights.setting.v1;

import "buf/validate/validate.proto";
import "insights/setting/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/insights/setting/v1";

message UpdateInsightsSettingsRequest {
  // settings is the settings value for this contract.
  InsightsSettings settings = 1 [(buf.validate.field).required = true];
}

message UpdateInsightsSettingsResponse {
  // settings is the settings value for this contract.
  InsightsSettings settings = 1;
}
