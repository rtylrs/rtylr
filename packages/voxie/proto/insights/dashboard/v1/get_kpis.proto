syntax = "proto3";

package insights.dashboard.v1;

option go_package = "github.com/voxire/voxie/gen/go/insights/dashboard/v1";

// ── Hub KPIs ───────────────────────────────────────────────────────

message GetKPIsRequest {}

message GetKPIsResponse {
  // revenue is the revenue value for this contract.
  double revenue = 1;
  // order_count is the order count value for this contract.
  int64 order_count = 2;
  // staff_count is the staff count value for this contract.
  int64 staff_count = 3;
  // customer_count is the customer count value for this contract.
  int64 customer_count = 4;
  // low_stock_count is the low stock count value for this contract.
  int64 low_stock_count = 5;
  // active_apps is the active apps value for this contract.
  int64 active_apps = 6;
}
