syntax = "proto3";

package insights.report.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/insights/report/v1";

message ExportRevenueReportRequest {
  // from is the inclusive start date (YYYY-MM-DD).
  string from = 1 [(onekit.http.query).name = "from"];
  // to is the inclusive end date (YYYY-MM-DD).
  string to = 2 [(onekit.http.query).name = "to"];
}

message ExportRevenueRow {
  // date is the revenue date (YYYY-MM-DD).
  string date = 1;
  // amount_minor_units is the revenue amount in minor units.
  int64 amount_minor_units = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
}

message ExportRevenueReportResponse {
  // filename is the suggested download filename.
  string filename = 1;
  // content_type is the MIME type for the export payload.
  string content_type = 2;
  // csv is the CSV document body.
  string csv = 3;
  // rows is the structured export rows.
  repeated ExportRevenueRow rows = 4;
}
