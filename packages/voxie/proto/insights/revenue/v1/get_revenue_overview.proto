syntax = "proto3";

package insights.revenue.v1;

import "insights/revenue/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/insights/revenue/v1";

message GetRevenueOverviewRequest {
  // period is the period value for this contract.
  string period = 1 [(onekit.http.query).name = "period"];
}

message GetRevenueOverviewResponse {
  // overview is the overview value for this contract.
  RevenueOverview overview = 1;
}
