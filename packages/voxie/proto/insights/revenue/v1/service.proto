syntax = "proto3";

package insights.revenue.v1;

import "insights/revenue/v1/get_revenue_by_app.proto";
import "insights/revenue/v1/get_revenue_comparison.proto";
import "insights/revenue/v1/get_revenue_overview.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/insights/revenue/v1";

// RevenueService defines insights revenue analytics endpoints.
service RevenueService {
  option (onekit.http.service_config) = {base_path: "/api/insights/revenue/v1"};

  // GetRevenueOverview returns revenue overview for a period.
  rpc GetRevenueOverview(GetRevenueOverviewRequest) returns (GetRevenueOverviewResponse) {
    option (onekit.http.config) = {
      path: "/overview"
      method: HTTP_METHOD_GET
    };
  }

  // GetRevenueByApp returns revenue broken down by app.
  rpc GetRevenueByApp(GetRevenueByAppRequest) returns (GetRevenueByAppResponse) {
    option (onekit.http.config) = {
      path: "/by-app"
      method: HTTP_METHOD_GET
    };
  }

  // GetRevenueComparison compares revenue across periods.
  rpc GetRevenueComparison(GetRevenueComparisonRequest) returns (GetRevenueComparisonResponse) {
    option (onekit.http.config) = {
      path: "/comparison"
      method: HTTP_METHOD_GET
    };
  }
}
