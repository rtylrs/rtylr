syntax = "proto3";

package flow.label.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/flow/label/v1";

// ── Labels ──────────────────────────────────────────────────────────

message Label {
  // id is the unique identifier for the resource.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // workspace_id is the workspace id value for this contract.
  int64 workspace_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // name is the name value for this contract.
  string name = 3;
  // color is the color value for this contract.
  string color = 4;
  // created_at is when the record was created.
  string created_at = 5;
}
