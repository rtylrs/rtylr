syntax = "proto3";
package flow.label.v1;
import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";
option go_package = "github.com/voxire/voxie/gen/go/flow/label/v1";
message SetTaskLabelsRequest {
  int64 task_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  repeated int64 label_ids = 2;
}
message SetTaskLabelsResponse {
  string message = 1;
}
