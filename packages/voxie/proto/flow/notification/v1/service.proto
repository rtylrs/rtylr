syntax = "proto3";
package flow.notification.v1;
import "flow/notification/v1/list_notifications.proto";
import "flow/notification/v1/mark_all_notifications_read.proto";
import "flow/notification/v1/mark_notification_read.proto";
import "onekit/http/annotations.proto";
option go_package = "github.com/voxire/voxie/gen/go/flow/notification/v1";
service NotificationService {
  option (onekit.http.service_config) = {base_path: "/api/flow/notification/v1"};
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse) {
    option (onekit.http.config) = { path: "/notifications" method: HTTP_METHOD_GET };
  }
  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (MarkNotificationReadResponse) {
    option (onekit.http.config) = { path: "/notifications/{id}/read" method: HTTP_METHOD_PUT };
  }
  rpc MarkAllNotificationsRead(MarkAllNotificationsReadRequest) returns (MarkAllNotificationsReadResponse) {
    option (onekit.http.config) = { path: "/notifications/read-all" method: HTTP_METHOD_PUT };
  }
}
