syntax = "proto3";
package flow.notification.v1;
option go_package = "github.com/voxire/voxie/gen/go/flow/notification/v1";
message Notification {
  int64 id = 1;
  string type = 2;
  string title = 3;
  string description = 4;
  string task_id = 5;
  string task_title = 6;
  string actor_initials = 7;
  string project = 8;
  string project_color = 9;
  bool read = 10;
  string timestamp = 11;
}
