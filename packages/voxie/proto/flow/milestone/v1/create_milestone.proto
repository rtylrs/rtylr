syntax = "proto3";
package flow.milestone.v1;
import "buf/validate/validate.proto";
import "flow/milestone/v1/types.proto";
import "onekit/http/annotations.proto";
option go_package = "github.com/voxire/voxie/gen/go/flow/milestone/v1";
message CreateMilestoneRequest {
  int64 project_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  int64 workspace_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  string name = 3 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
  string description = 4;
  string target_date = 5;
}
message CreateMilestoneResponse {
  Milestone milestone = 1;
}
