syntax = "proto3";
package flow.milestone.v1;
import "onekit/http/annotations.proto";
option go_package = "github.com/voxire/voxie/gen/go/flow/milestone/v1";
message UpdateMilestoneRequest {
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  string name = 2;
  string description = 3;
  string status = 4;
  string target_date = 5;
}
message UpdateMilestoneResponse {}
