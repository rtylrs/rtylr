syntax = "proto3";
package flow.milestone.v1;
import "flow/milestone/v1/types.proto";
import "onekit/http/annotations.proto";
option go_package = "github.com/voxire/voxie/gen/go/flow/milestone/v1";
message ListMilestonesRequest {
  string project_id = 1 [(onekit.http.query).name = "project_id"];
  string workspace_id = 2 [(onekit.http.query).name = "workspace_id"];
}
message ListMilestonesResponse {
  repeated Milestone milestones = 1;
}
