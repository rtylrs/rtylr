syntax = "proto3";
package flow.cycle.v1;
import "flow/cycle/v1/create_cycle.proto";
import "flow/cycle/v1/list_cycles.proto";
import "flow/cycle/v1/update_cycle.proto";
import "onekit/http/annotations.proto";
option go_package = "github.com/voxire/voxie/gen/go/flow/cycle/v1";
service CycleService {
  option (onekit.http.service_config) = {base_path: "/api/flow/cycle/v1"};
  rpc ListCycles(ListCyclesRequest) returns (ListCyclesResponse) {
    option (onekit.http.config) = { path: "/cycles" method: HTTP_METHOD_GET };
  }
  rpc CreateCycle(CreateCycleRequest) returns (CreateCycleResponse) {
    option (onekit.http.config) = { path: "/cycles" method: HTTP_METHOD_POST };
  }
  rpc UpdateCycle(UpdateCycleRequest) returns (UpdateCycleResponse) {
    option (onekit.http.config) = { path: "/cycles/{id}" method: HTTP_METHOD_PUT };
  }
}
