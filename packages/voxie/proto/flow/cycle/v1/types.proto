syntax = "proto3";
package flow.cycle.v1;
import "onekit/http/annotations.proto";
option go_package = "github.com/voxire/voxie/gen/go/flow/cycle/v1";
message Cycle {
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  int64 workspace_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  string name = 3;
  string start_date = 4;
  string end_date = 5;
  string status = 6;
  int32 scope = 7;
  int32 completed = 8;
}
