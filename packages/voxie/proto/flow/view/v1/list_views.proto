syntax = "proto3";
package flow.view.v1;
import "flow/view/v1/types.proto";
import "onekit/http/annotations.proto";
option go_package = "github.com/voxire/voxie/gen/go/flow/view/v1";
message ListViewsRequest {
  string workspace_id = 1 [(onekit.http.query).name = "workspace_id"];
}
message ListViewsResponse {
  repeated View views = 1;
}
