syntax = "proto3";
package flow.task.v1;
import "buf/validate/validate.proto";
import "flow/task/v1/types.proto";
import "onekit/http/annotations.proto";
option go_package = "github.com/voxire/voxie/gen/go/flow/task/v1";
message SearchTasksRequest {
  string q = 1 [(onekit.http.query).name = "q"];
  string workspace_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (onekit.http.query).name = "workspace_id"
  ];
}
message SearchTasksResponse {
  repeated Task tasks = 1;
}
