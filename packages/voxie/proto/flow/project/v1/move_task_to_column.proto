syntax = "proto3";

package flow.project.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/flow/project/v1";

message MoveTaskToColumnRequest {
  // task_id is the task identifier.
  int64 task_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // column_id is the destination column identifier.
  int64 column_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
}

message MoveTaskToColumnResponse {
  // message is a human-readable result message.
  string message = 1;
}
