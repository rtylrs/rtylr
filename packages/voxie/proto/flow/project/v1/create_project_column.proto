syntax = "proto3";

package flow.project.v1;

import "buf/validate/validate.proto";
import "flow/project/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/flow/project/v1";

message CreateProjectColumnRequest {
  // project_id is the project id value for this contract.
  int64 project_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // workspace_id is the workspace id value for this contract.
  int64 workspace_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // name is the column name.
  string name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // color is the column color.
  string color = 4;
  // sort_order is the column sort order.
  int32 sort_order = 5;
}

message CreateProjectColumnResponse {
  // column is the created column.
  ProjectColumn column = 1;
}
