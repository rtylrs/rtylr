syntax = "proto3";
package flow.insights.v1;

option go_package = "github.com/voxire/voxie/gen/go/flow/insights/v1";
message VelocityPoint {
  string cycle = 1;
  int32 completed = 2;
  int32 total = 3;
  double completion_rate = 4;
}
message BurndownPoint {
  int32 day = 1;
  double ideal = 2;
  double actual = 3;
}
message MemberTime {
  string id = 1;
  string name = 2;
  double hours = 3;
}
message ThroughputPoint {
  string week = 1;
  int32 completed = 2;
}
message TeamTaskSummary {
  string id = 1;
  string title = 2;
  string status = 3;
  string priority = 4;
  string due_date = 5;
}
message TeamMemberWorkload {
  string id = 1;
  string name = 2;
  string initials = 3;
  int32 capacity = 4;
  double assigned_hours = 5;
  double load = 6;
  repeated TeamTaskSummary tasks = 7;
}
message RoadmapProject {
  string id = 1;
  string name = 2;
  string color = 3;
  string start_date = 4;
  string target_date = 5;
  int32 progress = 6;
  int32 done_count = 7;
  int32 task_count = 8;
  string description = 9;
  string workspace_id = 10;
}
