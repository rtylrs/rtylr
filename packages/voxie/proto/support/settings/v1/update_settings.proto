syntax = "proto3";

package support.settings.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/support/settings/v1";

message UpdateSettingsRequest {
  bool auto_assign = 1;
  int32 sla_hours = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32.gt = 0,
    (buf.validate.field).int32.lte = 1000
  ];
  string business_hours = 3;
  string notification_email = 4;
}

message UpdateSettingsResponse {
  string message = 1;
}
