syntax = "proto3";

package support.canned.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/support/canned/v1";

message CreateCannedResponseRequest {
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string body = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string category = 3;
  string shortcut = 4;
}

message CreateCannedResponseResponse {
  int64 canned_response_id = 1;
  string message = 2;
}
