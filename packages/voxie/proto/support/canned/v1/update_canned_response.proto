syntax = "proto3";

package support.canned.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/support/canned/v1";

message UpdateCannedResponseRequest {
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING,
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  string name = 2;
  string body = 3;
  string category = 4;
  string shortcut = 5;
}

message UpdateCannedResponseResponse {
  string message = 1;
}
