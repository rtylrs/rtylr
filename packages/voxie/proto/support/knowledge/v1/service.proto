syntax = "proto3";

package support.knowledge.v1;

import "onekit/http/annotations.proto";
import "support/knowledge/v1/create_article.proto";
import "support/knowledge/v1/delete_article.proto";
import "support/knowledge/v1/list_articles.proto";
import "support/knowledge/v1/update_article.proto";

option go_package = "github.com/voxire/voxie/gen/go/support/knowledge/v1";

service KnowledgeService {
  option (onekit.http.service_config) = {base_path: "/api/support/knowledge/v1"};

  rpc ListArticles(ListArticlesRequest) returns (ListArticlesResponse) {
    option (onekit.http.config) = {
      path: "/articles"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateArticle(CreateArticleRequest) returns (CreateArticleResponse) {
    option (onekit.http.config) = {
      path: "/articles"
      method: HTTP_METHOD_POST
      body: "*"
    };
  }

  rpc UpdateArticle(UpdateArticleRequest) returns (UpdateArticleResponse) {
    option (onekit.http.config) = {
      path: "/articles/{id}"
      method: HTTP_METHOD_PUT
      body: "*"
    };
  }

  rpc DeleteArticle(DeleteArticleRequest) returns (DeleteArticleResponse) {
    option (onekit.http.config) = {
      path: "/articles/{id}"
      method: HTTP_METHOD_DELETE
    };
  }
}
