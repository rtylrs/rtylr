syntax = "proto3";

package support.inbox.v1;

import "support/inbox/v1/get_unread_count.proto";
import "support/inbox/v1/list_inbox.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/support/inbox/v1";

service InboxService {
  option (onekit.http.service_config) = {base_path: "/api/support/inbox/v1"};

  rpc ListInbox(ListInboxRequest) returns (ListInboxResponse) {
    option (onekit.http.config) = {
      path: "/inbox"
      method: HTTP_METHOD_GET
    };
  }

  rpc GetUnreadCount(GetUnreadCountRequest) returns (GetUnreadCountResponse) {
    option (onekit.http.config) = {
      path: "/inbox/unread-count"
      method: HTTP_METHOD_GET
    };
  }
}
