syntax = "proto3";

package support.inbox.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/support/inbox/v1";

message InboxItem {
  int64 ticket_id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_NUMBER
  ];
  string customer_name = 2;
  string customer_email = 3;
  string subject = 4;
  string status = 5;
  string priority = 6;
  string channel = 7;
  string last_message = 8;
  string last_message_at = 9;
  int32 message_count = 10;
}
