syntax = "proto3";

package booking.dashboard.v1;

import "booking/dashboard/v1/get_dashboard.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/booking/dashboard/v1";

service DashboardService {
  option (onekit.http.service_config) = {base_path: "/api/booking/dashboard/v1"};

  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse) {
    option (onekit.http.config) = {
      path: "/dashboard"
      method: HTTP_METHOD_GET
    };
  }
}
