syntax = "proto3";

package booking.service.v1;

import "booking/service/v1/create_service.proto";
import "booking/service/v1/delete_service.proto";
import "booking/service/v1/list_services.proto";
import "booking/service/v1/update_service.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/booking/service/v1";

service BookingServiceService {
  option (onekit.http.service_config) = {base_path: "/api/booking/service/v1"};

  rpc ListServices(ListServicesRequest) returns (ListServicesResponse) {
    option (onekit.http.config) = {
      path: "/services"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateService(CreateServiceRequest) returns (CreateServiceResponse) {
    option (onekit.http.config) = {
      path: "/services"
      method: HTTP_METHOD_POST
      body: "*"
    };
  }

  rpc UpdateService(UpdateServiceRequest) returns (UpdateServiceResponse) {
    option (onekit.http.config) = {
      path: "/services/{id}"
      method: HTTP_METHOD_PUT
      body: "*"
    };
  }

  rpc DeleteService(DeleteServiceRequest) returns (DeleteServiceResponse) {
    option (onekit.http.config) = {
      path: "/services/{id}"
      method: HTTP_METHOD_DELETE
    };
  }
}
