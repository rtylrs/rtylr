syntax = "proto3";

package booking.resource.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/booking/resource/v1";

message UpdateResourceRequest {
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING,
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  string name = 2;
  string type = 3;
  int32 capacity = 4;
  bool is_active = 5;
}

message UpdateResourceResponse {
  string message = 1;
}
