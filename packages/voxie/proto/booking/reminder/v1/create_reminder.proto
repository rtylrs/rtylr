syntax = "proto3";

package booking.reminder.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/booking/reminder/v1";

message CreateReminderRequest {
  int64 appointment_id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING,
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  string type = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string scheduled_at = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message CreateReminderResponse {
  int64 id = 1;
  string message = 2;
}
