syntax = "proto3";

package booking.calendar.v1;

import "booking/calendar/v1/get_calendar.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/booking/calendar/v1";

service CalendarService {
  option (onekit.http.service_config) = {base_path: "/api/booking/calendar/v1"};

  rpc GetCalendar(GetCalendarRequest) returns (GetCalendarResponse) {
    option (onekit.http.config) = {
      path: "/calendar"
      method: HTTP_METHOD_GET
    };
  }
}
