syntax = "proto3";

package booking.waitlist.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/booking/waitlist/v1";

message UpdateEntryRequest {
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING,
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  int64 service_id = 2 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  string customer_name = 3;
  string customer_email = 4;
  string customer_phone = 5;
  string preferred_date = 6;
  string preferred_time = 7;
  string status = 8;
}

message UpdateEntryResponse {
  string message = 1;
}
