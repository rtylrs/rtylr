syntax = "proto3";

package booking.appointment.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/booking/appointment/v1";

message Appointment {
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  int64 owner_id = 2 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  int64 business_id = 3 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  int64 service_id = 4 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  int64 resource_id = 5 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  int64 staff_id = 6 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  string customer_name = 7;
  string customer_email = 8;
  string customer_phone = 9;
  string start_time = 10;
  string end_time = 11;
  string status = 12;
  string notes = 13;
  string created_at = 14;
  string updated_at = 15;
}
