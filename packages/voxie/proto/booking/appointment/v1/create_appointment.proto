syntax = "proto3";

package booking.appointment.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/booking/appointment/v1";

message CreateAppointmentRequest {
  int64 service_id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING,
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  int64 resource_id = 2 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  int64 staff_id = 3 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  string customer_name = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string customer_email = 5;
  string customer_phone = 6;
  string start_time = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string end_time = 8 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string status = 9;
  string notes = 10;
}

message CreateAppointmentResponse {
  int64 id = 1;
  string message = 2;
}
