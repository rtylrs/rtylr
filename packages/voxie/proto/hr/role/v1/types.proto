syntax = "proto3";

package hr.role.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/role/v1";

// ── Permission ─────────────────────────────────────────────────────

message PermissionPayload {
  // Machine-readable permission identifier (e.g. "hr.employees.create").
  string key = 1;
  // Human-readable label shown in the UI.
  string label = 2;
  // Whether this permission is currently granted.
  bool is_granted = 3;
}

// ── Role ───────────────────────────────────────────────────────────

message RolePayload {
  // Unique identifier for the role.
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // Tenant owner this role belongs to.
  int64 owner_id = 2 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // Display name of the role.
  string name = 3;
  // Whether this role is the tenant default assigned to new employees.
  bool is_default = 4;
  // Full set of permissions attached to this role.
  repeated PermissionPayload permissions = 5;
  // Unix timestamp when this role was created.
  int64 created_at = 6;
  // Unix timestamp when this role was last updated.
  int64 updated_at = 7;
}

// ── List ───────────────────────────────────────────────────────────

message ListRolesResponse {
  // All roles for the tenant.
  repeated RolePayload roles = 1;
}
