syntax = "proto3";

package hr.time_off.v1;

import "hr/time_off/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/time_off/v1";

message ListTimeOffRequest {}

message ListTimeOffResponse {
  // requests is the requests value for this contract.
  repeated TimeOffRequest requests = 1;
}
