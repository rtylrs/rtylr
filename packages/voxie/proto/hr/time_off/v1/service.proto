syntax = "proto3";

package hr.time_off.v1;

import "hr/time_off/v1/list_time_off.proto";
import "hr/time_off/v1/submit_time_off.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/time_off/v1";

// TimeOffService defines HR time-off endpoints.
service TimeOffService {
  option (onekit.http.service_config) = {base_path: "/api/hr/time-off/v1"};

  // ListTimeOff returns time-off records.
  rpc ListTimeOff(ListTimeOffRequest) returns (ListTimeOffResponse) {
    option (onekit.http.config) = {
      path: "/requests"
      method: HTTP_METHOD_GET
    };
  }

  // SubmitTimeOff submits a time-off request.
  rpc SubmitTimeOff(SubmitTimeOffRequest) returns (SubmitTimeOffResponse) {
    option (onekit.http.config) = {
      path: "/requests"
      method: HTTP_METHOD_POST
    };
  }
}
