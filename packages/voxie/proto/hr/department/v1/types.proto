syntax = "proto3";

package hr.department.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/department/v1";

// ── Department ─────────────────────────────────────────────────────

message DepartmentPayload {
  // Unique identifier for the department.
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // Tenant owner this department belongs to.
  int64 owner_id = 2 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  int64 business_id = 3 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // Display name of the department.
  string name = 4;
  string description = 5;
  int64 manager_staff_id = 6 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // Unix timestamp when this department was created.
  int64 created_at = 7;
  // Unix timestamp when this department was last updated.
  int64 updated_at = 8;
}
