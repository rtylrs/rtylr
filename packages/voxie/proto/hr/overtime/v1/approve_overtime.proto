syntax = "proto3";

package hr.overtime.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";


option go_package = "github.com/voxire/voxie/gen/go/hr/overtime/v1";

// ── Approve Overtime Request ──────────────────────────────────────

message ApproveOvertimeBody {
  // True to approve, false to reject.
  bool approved = 1;
  // Pay multiplier to apply (e.g. 1.5); absent to use the default rate.
  optional double multiplier_applied = 2 [
    (onekit.http.nullable) = true
  ];
  // Reason for rejection; absent if approving.
  optional string rejection_reason = 3 [
    (onekit.http.nullable) = true
  ];
}

message ApproveOvertimeRequest {
  // ID of the overtime request being reviewed.
  int64 overtime_request_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // body carries approval decision fields bound from the HTTP payload.
  ApproveOvertimeBody body = 2;
}

message ApproveOvertimeResponse {
  // Whether the approval action was processed.
  bool success = 1;
}
