syntax = "proto3";

package hr.one_on_one.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/one_on_one/v1";

message CreateOneOnOneRequest {
  int64 manager_id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING,
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  int64 staff_id = 2 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING,
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  ];
  string scheduled_at = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string notes = 4;
  string action_items = 5;
  string status = 6;
}

message CreateOneOnOneResponse {
  int64 id = 1;
  string message = 2;
}
