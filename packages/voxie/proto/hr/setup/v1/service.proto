syntax = "proto3";

package hr.setup.v1;

import "hr/setup/v1/complete_setup_step.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/setup/v1";

// SetupService defines HR setup wizard endpoints.
service SetupService {
  option (onekit.http.service_config) = {base_path: "/api/hr/setup/v1"};

  // CompleteSetupStep marks a setup step complete.
  rpc CompleteSetupStep(CompleteSetupStepRequest) returns (CompleteSetupStepResponse) {
    option (onekit.http.config) = {
      path: "/steps"
      method: HTTP_METHOD_POST
    };
  }
}
