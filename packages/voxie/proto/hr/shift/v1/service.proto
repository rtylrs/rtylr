syntax = "proto3";

package hr.shift.v1;

import "hr/shift/v1/create_shift.proto";
import "hr/shift/v1/create_shift_assignment.proto";
import "hr/shift/v1/get_roster.proto";
import "hr/shift/v1/list_shifts.proto";
import "hr/shift/v1/publish_roster.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/shift/v1";

// ShiftService defines HR shift and roster endpoints.
service ShiftService {
  option (onekit.http.service_config) = {base_path: "/api/hr/shift/v1"};

  // ListShifts returns shifts with optional filters.
  rpc ListShifts(ListShiftsRequest) returns (ListShiftsResponse) {
    option (onekit.http.config) = {
      path: "/shifts"
      method: HTTP_METHOD_GET
    };
  }

  // CreateShift creates a new shift.
  rpc CreateShift(CreateShiftRequest) returns (CreateShiftResponse) {
    option (onekit.http.config) = {
      path: "/shifts"
      method: HTTP_METHOD_POST
    };
  }

  // CreateShiftAssignment assigns an employee to a shift.
  rpc CreateShiftAssignment(CreateShiftAssignmentRequest) returns (CreateShiftAssignmentResponse) {
    option (onekit.http.config) = {
      path: "/assignments"
      method: HTTP_METHOD_POST
    };
  }

  // GetRoster returns the shift roster for a location and week.
  rpc GetRoster(GetRosterRequest) returns (GetRosterResponse) {
    option (onekit.http.config) = {
      path: "/roster/{location_id}"
      method: HTTP_METHOD_GET
    };
  }

  // PublishRoster publishes the roster for a week.
  rpc PublishRoster(PublishRosterRequest) returns (PublishRosterResponse) {
    option (onekit.http.config) = {
      path: "/roster/publish"
      method: HTTP_METHOD_POST
    };
  }
}
