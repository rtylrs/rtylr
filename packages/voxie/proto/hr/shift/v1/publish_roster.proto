syntax = "proto3";

package hr.shift.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";


option go_package = "github.com/voxire/voxie/gen/go/hr/shift/v1";

// ── Publish Roster ────────────────────────────────────────────────

message PublishRosterRequest {
  // Location to publish the roster for.
  int64 location_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // Monday of the week being published (ISO-8601 date).
  string week_start = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message PublishRosterResponse {
  // Whether the roster was successfully published.
  bool success = 1;
}
