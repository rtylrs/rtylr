syntax = "proto3";

package hr.report.v1;

import "buf/validate/validate.proto";
import "hr/report/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/report/v1";

// ── Generate Report ─────────────────────────────────────────────────

message GenerateReportRequest {
  // Parameters describing the report to generate.
  ReportRequestPayload request = 1 [(buf.validate.field).required = true];
}

message GenerateReportResponse {
  // The generated report.
  ReportPayload report = 1;
}
