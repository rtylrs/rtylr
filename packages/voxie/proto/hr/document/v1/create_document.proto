syntax = "proto3";

package hr.document.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/document/v1";

message CreateDocumentRequest {
  int64 staff_id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  string name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string type = 3;
  string file_url = 4;
  string expiry_date = 5;
}

message CreateDocumentResponse {
  int64 id = 1;
  string message = 2;
}
