syntax = "proto3";

package hr.performance.v1;

import "buf/validate/validate.proto";
import "hr/performance/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/performance/v1";

// ── Create Review Cycle ──────────────────────────────────────────────

message CreateReviewCycleRequest {
  // Human-readable name for the cycle.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // Cycle type (annual | mid_year | probation | adhoc).
  string type = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // Start of the review period (ISO-8601 date).
  string period_start = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // End of the review period (ISO-8601 date).
  string period_end = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message CreateReviewCycleResponse {
  // The newly created review cycle.
  ReviewCyclePayload cycle = 1;
}
