syntax = "proto3";

package hr.staff.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/staff/v1";

// ── Staff ───────────────────────────────────────────────────────────

message Staff {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // owner_id identifies the tenant that owns the resource.
  int64 owner_id = 2 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // user_id identifies the user associated with this request.
  int64 user_id = 3 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // department_id is the department id value for this contract.
  int64 department_id = 4 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // first_name is the first name value for this contract.
  string first_name = 5;
  // last_name is the last name value for this contract.
  string last_name = 6;
  // email is the email address used for lookup or contact.
  string email = 7;
  // phone is the phone value for this contract.
  string phone = 8;
  // role is the role value for this contract.
  string role = 9;
  // employment_type is the employment type value for this contract.
  string employment_type = 10;
  // status is the current lifecycle state.
  string status = 11;
  // salary is the salary value for this contract.
  double salary = 12;
  // hourly_rate is the hourly rate value for this contract.
  double hourly_rate = 13;
  // overtime_rate is the overtime rate value for this contract.
  double overtime_rate = 14;
  // start_date is the start date value for this contract.
  string start_date = 15;
  // end_date is the end date value for this contract.
  string end_date = 16;
  // address is the address value for this contract.
  string address = 17;
  // emergency_contact_name is the emergency contact name value for this contract.
  string emergency_contact_name = 18;
  // emergency_contact_phone is the emergency contact phone value for this contract.
  string emergency_contact_phone = 19;
  // apps is the apps value for this contract.
  string apps = 20;
  // notes is the notes value for this contract.
  string notes = 21;
  // created_at is when the record was created.
  string created_at = 22;
  // updated_at is when the record was last updated.
  string updated_at = 23;
}
