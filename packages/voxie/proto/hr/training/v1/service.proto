syntax = "proto3";

package hr.training.v1;

import "hr/training/v1/create_training_course.proto";
import "hr/training/v1/list_training_courses.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/hr/training/v1";

service TrainingService {
  option (onekit.http.service_config) = {base_path: "/api/hr/training/v1"};

  rpc ListTrainingCourses(ListTrainingCoursesRequest) returns (ListTrainingCoursesResponse) {
    option (onekit.http.config) = {
      path: "/courses"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateTrainingCourse(CreateTrainingCourseRequest) returns (CreateTrainingCourseResponse) {
    option (onekit.http.config) = {
      path: "/courses"
      method: HTTP_METHOD_POST
      body: "*"
    };
  }
}
