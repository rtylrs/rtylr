syntax = "proto3";

package hr.onboarding.v1;

import "buf/validate/validate.proto";
import "hr/onboarding/v1/types.proto";
import "onekit/http/annotations.proto";


option go_package = "github.com/voxire/voxie/gen/go/hr/onboarding/v1";

// ── Get Employee Checklist ───────────────────────────────────────

message GetEmployeeChecklistRequest {
  // employee_id is the employee whose checklist should be fetched.
  int64 employee_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}

message GetEmployeeChecklistResponse {
  // checklist is the employee checklist returned for the path id.
  EmployeeChecklistPayload checklist = 1;
}
