syntax = "proto3";

package hr.onboarding.v1;

import "buf/validate/validate.proto";
import "hr/onboarding/v1/types.proto";
import "onekit/http/annotations.proto";


option go_package = "github.com/voxire/voxie/gen/go/hr/onboarding/v1";

// ── Create Checklist Template ────────────────────────────────────

message CreateChecklistTemplateRequest {
  // Human-readable name for the template.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // trigger_type is the event that triggers this checklist (onboarding | offboarding).
  optional string trigger_type = 2 [
    (onekit.http.nullable) = true
  ];
  // Role this template applies to; absent if it applies to all roles.
  optional int64 role_id = 3 [
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING,
    (onekit.http.nullable) = true
  ];
}

message CreateChecklistTemplateResponse {
  // The newly created checklist template.
  ChecklistTemplatePayload template = 1;
}
