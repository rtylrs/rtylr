syntax = "proto3";

package pos.orders.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/orders/v1";

// ── Shared Payloads ───────────────────────────────────────────────

message OrderItem {
  // id is the unique identifier for the resource.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // order_id is the order id value for this contract.
  int64 order_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // menu_item_id is the menu item id value for this contract.
  int64 menu_item_id = 3 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // name is the name value for this contract.
  string name = 4;
  // sku is the sku value for this contract.
  string sku = 5;
  // quantity is the quantity value for this contract.
  double quantity = 6;
  // unit_price is the unit price value for this contract.
  double unit_price = 7;
  // discount_pct is the discount pct value for this contract.
  double discount_pct = 8;
  // discount_amount is the discount amount value for this contract.
  double discount_amount = 9;
  // tax_rate is the tax rate value for this contract.
  double tax_rate = 10;
  // total is the total number of matching records.
  double total = 11;
  // notes is the notes value for this contract.
  string notes = 12;
  // status is the current lifecycle state.
  string status = 13;
  // created_at is when the record was created.
  string created_at = 14;
}

message Order {
  // id is the unique identifier for the resource.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // owner_id identifies the tenant that owns the resource.
  int64 owner_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // session_id is the session id value for this contract.
  int64 session_id = 3 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // table_id is the table id value for this contract.
  int64 table_id = 4 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // location_id is the location id value for this contract.
  int64 location_id = 5 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // order_number is the order number value for this contract.
  string order_number = 6;
  // type is the type value for this contract.
  string type = 7;
  // status is the current lifecycle state.
  string status = 8;
  // customer_id is the customer id value for this contract.
  int64 customer_id = 9 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // customer_name is the customer name value for this contract.
  string customer_name = 10;
  // staff_id is the staff id value for this contract.
  int64 staff_id = 11 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // subtotal is the subtotal value for this contract.
  double subtotal = 12;
  // discount_amount is the discount amount value for this contract.
  double discount_amount = 13;
  // tax_amount is the tax amount value for this contract.
  double tax_amount = 14;
  // total is the total number of matching records.
  double total = 15;
  // payment_method is the payment method value for this contract.
  string payment_method = 16;
  // payment_status is the payment status value for this contract.
  string payment_status = 17;
  // amount_paid is the amount paid value for this contract.
  double amount_paid = 18;
  // change_due is the change due value for this contract.
  double change_due = 19;
  // notes is the notes value for this contract.
  string notes = 20;
  // kitchen_notes is the kitchen notes value for this contract.
  string kitchen_notes = 21;
  // created_at is when the record was created.
  string created_at = 22;
  // updated_at is when the record was last updated.
  string updated_at = 23;
  // paid_at is the paid at value for this contract.
  string paid_at = 24;
  // items is the items value for this contract.
  repeated OrderItem items = 25;
}

// ── Create Order ──────────────────────────────────────────────────

message CreateOrderItemInput {
  // menu_item_id is the menu item id value for this contract.
  int64 menu_item_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // name is the name value for this contract.
  string name = 2;
  // sku is the sku value for this contract.
  string sku = 3;
  // quantity is the quantity value for this contract.
  double quantity = 4;
  // unit_price is the unit price value for this contract.
  double unit_price = 5;
  // discount_pct is the discount pct value for this contract.
  double discount_pct = 6;
  // tax_rate is the tax rate value for this contract.
  double tax_rate = 7;
  // notes is the notes value for this contract.
  string notes = 8;
}

message SplitGroup {
  // item_ids is the item ids value for this contract.
  repeated int64 item_ids = 1;
}
