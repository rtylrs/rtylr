syntax = "proto3";

package pos.orders.items.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/orders/items/v1";

// ── Void Order Item ───────────────────────────────────────────────

message VoidOrderItemRequest {
  // order_id is the order id value for this contract.
  int64 order_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // item_id is the item id value for this contract.
  int64 item_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}

message VoidOrderItemResponse {
  // success indicates whether the operation completed.
  bool success = 1;
}
