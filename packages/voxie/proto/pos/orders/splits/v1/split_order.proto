syntax = "proto3";

package pos.orders.splits.v1;

import "buf/validate/validate.proto";
import "pos/orders/v1/types.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/orders/splits/v1";

// ── Split Order ───────────────────────────────────────────────────

message SplitOrderRequest {
  // order_id is the order id value for this contract.
  int64 order_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  , (onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // splits is the splits value for this contract.
  repeated .pos.orders.v1.SplitGroup splits = 2 [(buf.validate.field).repeated.min_items = 1];
}

message SplitOrderResponse {
  // order_ids is the order ids value for this contract.
  repeated int64 order_ids = 1;
  // message is a human-readable result message.
  string message = 2;
}
