syntax = "proto3";

package pos.access.v1;

import "onekit/http/annotations.proto";
import "pos/access/v1/assign_location.proto";
import "pos/access/v1/get_my_locations.proto";
import "pos/access/v1/remove_location.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/access/v1";

service AccessService {
  option (onekit.http.service_config) = {base_path: "/api/pos/access/v1"};

  rpc GetMyLocations(GetMyLocationsRequest) returns (GetMyLocationsResponse) {
    option (onekit.http.config) = {
      path: "/my-locations"
      method: HTTP_METHOD_GET
    };
  }

  rpc AssignLocation(AssignLocationRequest) returns (AssignLocationResponse) {
    option (onekit.http.config) = {
      path: "/assign"
      method: HTTP_METHOD_POST
    };
  }

  rpc RemoveLocation(RemoveLocationRequest) returns (RemoveLocationResponse) {
    option (onekit.http.config) = {
      path: "/remove"
      method: HTTP_METHOD_POST
    };
  }
}
