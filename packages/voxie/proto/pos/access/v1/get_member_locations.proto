syntax = "proto3";

package pos.access.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";
import "pos/access/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/access/v1";

// ── Get Member Locations ──────────────────────────────────────────

message GetMemberLocationsRequest {
  // user_id is the user id value for this contract.
  int64 user_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.query).name = "user_id",
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}

message GetMemberLocationsResponse {
  // locations is the locations value for this contract.
  repeated MemberLocationEntry locations = 1;
}
