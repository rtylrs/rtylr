syntax = "proto3";

package pos.dashboard.v1;

option go_package = "github.com/voxire/voxie/gen/go/pos/dashboard/v1";

// ── Dashboard ─────────────────────────────────────────────────────

message DashboardRequest {}

message DashboardResponse {
  // total_sales is the total sales value for this contract.
  double total_sales = 1;
  // order_count is the order count value for this contract.
  int32 order_count = 2;
  // avg_order is the avg order value for this contract.
  double avg_order = 3;
  // table_turnover is the table turnover value for this contract.
  double table_turnover = 4;
}
