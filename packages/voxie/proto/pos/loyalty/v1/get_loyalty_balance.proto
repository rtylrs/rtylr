syntax = "proto3";

package pos.loyalty.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/loyalty/v1";

// ── Get Balance ───────────────────────────────────────────────────

message GetLoyaltyBalanceRequest {
  // customer_id is the customer id value for this contract.
  int64 customer_id = 1 [
    (onekit.http.query).name = "customer_id",
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  , (onekit.http.int64_encoding) = INT64_ENCODING_STRING];
}

message GetLoyaltyBalanceResponse {
  // customer_id is the customer id value for this contract.
  int64 customer_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // balance is the balance value for this contract.
  int32 balance = 2;
}
