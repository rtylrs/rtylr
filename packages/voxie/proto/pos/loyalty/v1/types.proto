syntax = "proto3";

package pos.loyalty.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/loyalty/v1";

// ── LoyaltyConfig ─────────────────────────────────────────────────

message LoyaltyConfig {
  // id is the unique identifier for the resource.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // business_id is the business id value for this contract.
  int64 business_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // is_enabled is the is enabled value for this contract.
  bool is_enabled = 3;
  // points_per_dollar is the points per dollar value for this contract.
  double points_per_dollar = 4;
  // redemption_rate is the redemption rate value for this contract.
  double redemption_rate = 5;
  // min_redeem_points is the min redeem points value for this contract.
  int32 min_redeem_points = 6;
  // created_at is when the record was created.
  string created_at = 7;
  // updated_at is when the record was last updated.
  string updated_at = 8;
}

// ── Loyalty Transaction ───────────────────────────────────────────

message LoyaltyTransaction {
  // id is the unique identifier for the resource.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // business_id is the business id value for this contract.
  int64 business_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // customer_id is the customer id value for this contract.
  int64 customer_id = 3 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // order_id is the order id value for this contract.
  int64 order_id = 4 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // type is the type value for this contract.
  string type = 5;
  // points is the points value for this contract.
  int32 points = 6;
  // balance_after is the balance after value for this contract.
  int32 balance_after = 7;
  // note is the note value for this contract.
  string note = 8;
  // created_at is when the record was created.
  string created_at = 9;
}
