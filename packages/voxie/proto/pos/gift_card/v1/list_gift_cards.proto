syntax = "proto3";

package pos.gift_card.v1;

import "pos/gift_card/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/gift_card/v1";

// ── List ──────────────────────────────────────────────────────────

message ListGiftCardsRequest {}

message ListGiftCardsResponse {
  // gift_cards is the gift cards value for this contract.
  repeated GiftCard gift_cards = 1;
}
