syntax = "proto3";

package pos.user.v1;

import "onekit/http/annotations.proto";
import "pos/user/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/user/v1";

// ── List ──────────────────────────────────────────────────────────

message ListPOSUsersRequest {
  // location_id is the location id value for this contract.
  int64 location_id = 1 [(onekit.http.query).name = "location_id", (onekit.http.int64_encoding) = INT64_ENCODING_STRING];
}

message ListPOSUsersResponse {
  // users is the users value for this contract.
  repeated POSUser users = 1;
}
