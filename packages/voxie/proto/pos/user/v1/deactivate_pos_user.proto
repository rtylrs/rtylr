syntax = "proto3";

package pos.user.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/user/v1";

// ── Deactivate ────────────────────────────────────────────────────

message DeactivatePOSUserRequest {
  // id is the unique identifier for the resource.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  , (onekit.http.int64_encoding) = INT64_ENCODING_STRING];
}

message DeactivatePOSUserResponse {
  // success is the success value for this contract.
  bool success = 1;
}
