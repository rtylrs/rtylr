syntax = "proto3";

package pos.location.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/location/v1";

// ── Create ────────────────────────────────────────────────────────

message CreateLocationRequest {
  // name is the name value for this contract.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // address is the address value for this contract.
  string address = 2;
  // phone is the phone value for this contract.
  string phone = 3;
  // is_active is the is active value for this contract; defaults to true when absent.
  optional bool is_active = 4 [(onekit.http.nullable) = true];
}

message CreateLocationResponse {
  // location_id is the location id value for this contract.
  int64 location_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // message is a human-readable result message.
  string message = 2;
}
