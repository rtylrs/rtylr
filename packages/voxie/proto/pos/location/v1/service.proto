syntax = "proto3";

package pos.location.v1;

import "onekit/http/annotations.proto";
import "pos/location/v1/create_location.proto";
import "pos/location/v1/list_locations.proto";
import "pos/location/v1/update_location.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/location/v1";

service LocationService {
  option (onekit.http.service_config) = {base_path: "/api/pos/location/v1"};

  rpc ListLocations(ListLocationsRequest) returns (ListLocationsResponse) {
    option (onekit.http.config) = {
      path: "/locations"
      method: HTTP_METHOD_GET
    };
  }

  rpc CreateLocation(CreateLocationRequest) returns (CreateLocationResponse) {
    option (onekit.http.config) = {
      path: "/locations"
      method: HTTP_METHOD_POST
    };
  }

  rpc UpdateLocation(UpdateLocationRequest) returns (UpdateLocationResponse) {
    option (onekit.http.config) = {
      path: "/locations/{id}"
      method: HTTP_METHOD_PUT
      body: "body"
    };
  }
}
