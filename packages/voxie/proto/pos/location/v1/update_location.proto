syntax = "proto3";

package pos.location.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/location/v1";

// ── Update ────────────────────────────────────────────────────────

message UpdateLocationBody {
  // name is the name value for this contract.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // address is the address value for this contract.
  string address = 2;
  // phone is the phone value for this contract.
  string phone = 3;
  // is_active is the is active value for this contract; unchanged when absent.
  optional bool is_active = 4 [(onekit.http.nullable) = true];
}

message UpdateLocationRequest {
  // id is the unique identifier for the location.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // body carries updatable location fields bound from the HTTP payload.
  UpdateLocationBody body = 2;
}

message UpdateLocationResponse {
  // message is a human-readable result message.
  string message = 1;
}
