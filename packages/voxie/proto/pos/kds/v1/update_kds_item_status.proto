syntax = "proto3";

package pos.kds.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/kds/v1";

// ── Update Item Status ────────────────────────────────────────────

message UpdateKDSItemStatusBody {
  // status is the current lifecycle state.
  string status = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message UpdateKDSItemStatusRequest {
  // order_id is the unique identifier for the order.
  int64 order_id = 1 [
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // item_id is the unique identifier for the order item.
  int64 item_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // body carries the new KDS item status bound from the HTTP payload.
  UpdateKDSItemStatusBody body = 3;
}

message UpdateKDSItemStatusResponse {
  // message is a human-readable result message.
  string message = 1;
}
