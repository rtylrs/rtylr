syntax = "proto3";

package pos.terminal.v1;

import "pos/terminal/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/terminal/v1";

// ── List ──────────────────────────────────────────────────────────

message ListTerminalsRequest {}

message ListTerminalsResponse {
  // terminals is the terminals value for this contract.
  repeated Terminal terminals = 1;
}
