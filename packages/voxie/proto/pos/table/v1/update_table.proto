syntax = "proto3";

package pos.table.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/table/v1";

// ── Update ────────────────────────────────────────────────────────

message UpdateTableBody {
  // location_id is the location id value for this contract.
  optional int64 location_id = 1 [(onekit.http.nullable) = true, (onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // label is the label value for this contract.
  string label = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // seats is the seats value for this contract.
  int32 seats = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32.gt = 0
  ];
  // status is the current lifecycle state.
  string status = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message UpdateTableRequest {
  // id is the unique identifier for the table.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // body carries updatable table fields bound from the HTTP payload.
  UpdateTableBody body = 2;
}

message UpdateTableResponse {
  // message is a human-readable result message.
  string message = 1;
}
