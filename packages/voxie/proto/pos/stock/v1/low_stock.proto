syntax = "proto3";

package pos.stock.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";
import "pos/stock/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/stock/v1";

// ── Low Stock ─────────────────────────────────────────────────────

message LowStockRequest {
  // branch_id is the branch id value for this contract.
  int64 branch_id = 1 [
    (onekit.http.query).name = "branch_id",
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  , (onekit.http.int64_encoding) = INT64_ENCODING_STRING];
}

message LowStockResponse {
  // items is the items value for this contract.
  repeated BranchInventory items = 1;
}
