syntax = "proto3";

package pos.session.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";
import "pos/session/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/session/v1";

// ── Get ───────────────────────────────────────────────────────────

message GetSessionRequest {
  // id is the unique identifier for the session.
  int64 id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0,
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}

message GetSessionResponse {
  // session is the session value for this contract.
  Session session = 1;
}
