syntax = "proto3";

package pos.audit.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/audit/v1";

// ── Create ────────────────────────────────────────────────────────

message CreateAuditRequest {
  // branch_id is the branch id value for this contract.
  int64 branch_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  , (onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // terminal_id is the terminal id value for this contract.
  int64 terminal_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  , (onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // employee_id is the employee id value for this contract.
  int64 employee_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  , (onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // action is the action value for this contract.
  string action = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // entity_type is the entity type value for this contract.
  string entity_type = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // entity_id is the entity id value for this contract.
  int64 entity_id = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).int64.gt = 0
  , (onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // details is the details value for this contract.
  string details = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // ip_address is the ip address value for this contract.
  string ip_address = 8 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message CreateAuditResponse {
  // audit_log_id is the audit log id value for this contract.
  int64 audit_log_id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // message is a human-readable result message.
  string message = 2;
}
