syntax = "proto3";

package pos.cash.v1;

import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/cash/v1";

// ── CashMovement ──────────────────────────────────────────────────

message CashMovement {
  // id is the unique identifier for the resource.
  int64 id = 1 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // business_id is the business id value for this contract.
  int64 business_id = 2 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // branch_id is the branch id value for this contract.
  int64 branch_id = 3 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // terminal_id is the terminal id value for this contract.
  optional int64 terminal_id = 4 [(onekit.http.nullable) = true, (onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // session_id is the session id value for this contract.
  int64 session_id = 5 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // employee_id is the employee id value for this contract.
  int64 employee_id = 6 [(onekit.http.int64_encoding) = INT64_ENCODING_STRING];
  // type is the type value for this contract.
  string type = 7;
  // amount is the amount value for this contract.
  double amount = 8;
  // reason is the reason value for this contract.
  optional string reason = 9 [(onekit.http.nullable) = true];
  // approved_by is the approved by value for this contract.
  optional int64 approved_by = 10 [(onekit.http.nullable) = true];
  // created_at is when the record was created.
  string created_at = 11;
}
