syntax = "proto3";

package pos.customer.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";
import "pos/customer/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/customer/v1";

// ── Search ────────────────────────────────────────────────────────

message SearchCustomersRequest {
  // query is the query value for this contract.
  string query = 1 [
    (onekit.http.query).name = "query",
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

message SearchCustomersResponse {
  // customers is the customers value for this contract.
  repeated Customer customers = 1;
}
