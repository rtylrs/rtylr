syntax = "proto3";

package pos.menu_item.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";
import "pos/menu_item/v1/types.proto";

option go_package = "github.com/voxire/voxie/gen/go/pos/menu_item/v1";

message ListPublicMenuItemsRequest {
  int64 business_id = 1 [
    (buf.validate.field).int64.gt = 0,
    (onekit.http.query).name = "business_id",
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
  // Optional. Accepted for multi-location menu URLs; ignored until per-location stock scoping ships.
  int64 location_id = 2 [
    (onekit.http.query).name = "location_id",
    (onekit.http.int64_encoding) = INT64_ENCODING_STRING
  ];
}

message ListPublicMenuItemsResponse {
  repeated MenuItem items = 1;
}
