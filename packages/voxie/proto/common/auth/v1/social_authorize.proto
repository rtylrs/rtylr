syntax = "proto3";

package common.auth.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/common/auth/v1";

message SocialAuthorizeRequest {
  // provider is the social login provider (google, github, microsoft, apple).
  string provider = 1 [
    (buf.validate.field).string = {
      in: [
        "google",
        "github",
        "microsoft",
        "apple",
        ""
      ]
    },
    (onekit.http.query).name = "provider"
  ];
}

message SocialAuthorizeResponse {
  // url is the provider-hosted consent URL to redirect the browser to.
  string url = 1;
}
