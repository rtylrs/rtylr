syntax = "proto3";

package common.auth.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/common/auth/v1";

// ResetPasswordConfirmRequest confirms a password reset using an emailed token.
message ResetPasswordConfirmRequest {
  // token is the opaque reset token from the password reset link.
  string token = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // password is the new password selected by the user.
  string password = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

// ResetPasswordConfirmResponse reports the password reset outcome.
message ResetPasswordConfirmResponse {
  // message is a human-readable result message.
  string message = 1;
}
