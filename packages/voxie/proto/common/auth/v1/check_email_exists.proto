syntax = "proto3";

package common.auth.v1;

import "buf/validate/validate.proto";
import "onekit/http/annotations.proto";

option go_package = "github.com/voxire/voxie/gen/go/common/auth/v1";

message CheckEmailExistsRequest {
  // email is the address to probe during inline registration/login validation.
  string email = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      email: true
    },
    (onekit.http.query).name = "email"
  ];
}

message CheckEmailExistsResponse {
  // exists is true when an account with this email is already registered.
  bool exists = 1;
}
