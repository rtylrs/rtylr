syntax = "proto3";

package common.auth.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/common/auth/v1";

// ResendVerificationRequest requests a fresh verification email.
message ResendVerificationRequest {
  // email is the address that should receive a verification email.
  string email = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      email: true
    }
  ];
}

// ResendVerificationResponse reports the resend request outcome.
message ResendVerificationResponse {
  // ok indicates the request was accepted.
  bool ok = 1;
  // message is a human-readable result message.
  string message = 2;
}
