syntax = "proto3";

package common.auth.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/voxire/voxie/gen/go/common/auth/v1";

// VerifyEmailRequest verifies an email address using an emailed token.
message VerifyEmailRequest {
  // token is the opaque email verification token.
  string token = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

// VerifyEmailResponse reports whether the email was verified.
message VerifyEmailResponse {
  // verified indicates the email was verified successfully.
  bool verified = 1;
  // message is a human-readable result message.
  string message = 2;
}
