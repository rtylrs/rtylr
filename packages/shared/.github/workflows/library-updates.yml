name: Build and Deploy Shared Library

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.json"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for library changes
        id: library-check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "^src/\|^package.json\|^vite.config.ts\|^tsconfig.json"; then
            echo "✅ @voxire/shared has changes - building library"
            echo "library_changes_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️ @voxire/shared unchanged - skipping build"
            echo "library_changes_detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.library-check.outputs.library_changes_detected == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        if: steps.library-check.outputs.library_changes_detected == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Build Library
        if: steps.library-check.outputs.library_changes_detected == 'true'
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Create Tag with Dist Files
        if: steps.library-check.outputs.library_changes_detected == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Tags already available with fetch-depth: 0

          # Get current version and increment
          if git tag -l | grep -q "[0-9]"; then
            LATEST_TAG=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            echo "Latest tag: $LATEST_TAG"

            # Parse version
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"

            # Increment logic: patch -> 99, then minor -> 99, then major
            if [ "$PATCH" -lt 99 ]; then
              PATCH=$((PATCH + 1))
            elif [ "$MINOR" -lt 99 ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            fi

            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          else
            NEW_VERSION="0.0.1"
          fi

          echo "New version: $NEW_VERSION"

          # Ensure dist folder exists (it should from the build step)
          if [ ! -d "dist" ]; then
            echo "Error: dist folder not found"
            exit 1
          fi

          # Create orphan branch for dist-only tag
          git checkout --orphan "dist-$NEW_VERSION"

          # Remove everything except what we need
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'dist' ! -name 'package.json' -exec rm -rf {} +

          # Move dist contents to root level
          cp -r dist/* .
          rm -rf dist
          
          # Add all files (now just package.json and dist contents at root)
          git add .

          # Create commit with only dist files
          git commit -m "Dist files for $NEW_VERSION"

          # Create tag from this commit
          git tag "$NEW_VERSION"

          # Switch back to main and cleanup
          git checkout main
          git branch -D "dist-$NEW_VERSION"

          # Push the tag only
          git push origin "$NEW_VERSION"
