<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Flow · rtylr</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Flow — plan work, track tasks, and ship with your team on rtylr."
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Resolve the theme before first paint. The body used to carry
      `background: #0a0a0a` inline, which meant light mode rendered a dark body:
      an inline style cannot follow a theme. Stamping data-theme here instead lets
      globals.css paint the right palette immediately, with no flash either way.

      This runs while the head is parsed, ahead of the module that calls
      initAppearance, so both keys have to be read here: `flow-appearance` is
      where the appearance store persists, and `flow-theme` is the retired
      themeStore entry the appearance store migrates from on first load.
      Preferring the retired key would show one frame of the wrong palette to
      anyone who has changed mode since the migration.
      Kept in step with APPEARANCE_DEFAULTS.mode in @voxire/utils.
    -->
    <script>
      (function () {
        function read(key, field) {
          try {
            var raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw).state?.[field] : null;
          } catch (e) {
            return null;
          }
        }
        try {
          var theme = read('flow-appearance', 'mode') || read('flow-theme', 'theme') || 'dark';
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
