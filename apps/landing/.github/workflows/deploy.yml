name: Deploy

# Deploy only after CI (typecheck + build + e2e) has passed on main.
# `workflow_run` fires when the CI workflow finishes; we gate on its
# conclusion so a red build never reaches Cloudflare. `workflow_dispatch`
# stays available for manual re-deploys.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy rtylr-landing
    runs-on: ubuntu-latest
    # Manual runs always deploy; automatic runs only when CI succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # PAT with read access to the private voxire/packages submodule
          token: ${{ secrets.PAT_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Ensure Cloudflare Pages project exists
        run: npx wrangler pages project create rtylr-landing --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist/landing --project-name=rtylr-landing --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
