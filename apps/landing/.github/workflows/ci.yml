name: Version

# Main pushes create release metadata only. Builds and production deployment
# happen later, after tryrtylr/deploy promotes one exact landing release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Create landing version
    uses: tryrtylr/pipelines/.github/workflows/create-release.yml@main
    with:
      release_tag: rtylr-landing-v0.0.${{ github.run_number }}
      release_name: rtylr landing v0.0.${{ github.run_number }}
      version: 0.0.${{ github.run_number }}
      notes: "Source version at ${{ github.sha }}. Build and deployment are controlled by tryrtylr/deploy."
