<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, nocache" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="slurp" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="ai" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="GPTBot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="CCBot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="anthropic-ai" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="Claude-Web" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="Omgilibot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Referrer-Policy" content="no-referrer" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()" />

    <title>Voxire</title>
    <link rel="stylesheet" href="/voxire/static/styles.css" />
  </head>

  <body>
    <div class="header">
      <div class="header-content">
        <div class="logo">Basal 🧅</div>
        <div class="header-right">
          <div class="memory-status">
            <div class="memory-indicator"></div>
            Memory Active
          </div>
          <div class="session-info" id="sessionInfo">Session: Not Started</div>
        </div>
      </div>
    </div>

    <div class="main-container">
      <div class="chat-container">
        <div class="chat-messages" id="chatMessages"></div>

        <div class="input-container">
          <div class="input-wrapper">
            <textarea id="promptInput" placeholder="Ask anything..." rows="1"></textarea>
            <button class="send-button" onclick="sendMessage()" id="sendButton">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M12 5l0 14M5 12l7 -7 7 7" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="/voxire/static/script.js"></script>
  </body>
</html>
