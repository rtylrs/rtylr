name: Version

# Main pushes create release metadata only. The deploy control plane decides
# when a promoted POS release is built and deployed.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Create POS version
    uses: tryrtylr/pipelines/.github/workflows/create-release.yml@main
    with:
      release_tag: pos-v0.0.${{ github.run_number }}
      release_name: rtylr POS v0.0.${{ github.run_number }}
      version: 0.0.${{ github.run_number }}
      notes: "Source version at ${{ github.sha }}. Build and deployment are controlled by tryrtylr/deploy."
