name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (web)
        run: pnpm build

  deploy:
    name: Deploy to Cloudflare Pages
    needs: check
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    uses: tryrtylr/pipelines/.github/workflows/deploy-pages.yml@main
    with:
      app_filter: 'rtylr-pos'
      dist_dir: 'dist'
      project_name: 'rtylr-pos'
      runs_on: 'ubuntu-latest'
    secrets: inherit

  notify:
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    uses: tryrtylr/pipelines/.github/workflows/notify-slack.yml@main
    with:
      message: ':rocket: *rtylr POS* — new version deployed to production'
    secrets: inherit
