name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'pos-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-14
            rust_targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - label: macOS Intel
            os: macos-13
            rust_targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - label: Windows
            os: windows-latest
            rust_targets: ''
            args: ''
          - label: Linux
            os: ubuntu-22.04
            rust_targets: ''
            args: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish desktop release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.voxire.com/' }}
          VITE_APP_ENV: production
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
        with:
          tagName: pos-v__VERSION__
          releaseName: rtylr POS v__VERSION__
          releaseBody: Internal staging release. Customer-facing desktop downloads are deployed to Cloudflare Pages.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-downloads:
    name: Publish Cloudflare downloads
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release tag
        id: release
        run: echo "tag=pos-v$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Download signed desktop assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ steps.release.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --dir desktop-downloads --clobber

      - name: Prepare public download site
        env:
          DOWNLOADS_BASE_URL: https://pos-downloads.rtylr.com
        run: node scripts/prepare-desktop-downloads.mjs desktop-downloads desktop-public

      - name: Deploy downloads to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm dlx wrangler@latest pages deploy desktop-public --project-name rtylr-pos-downloads --branch main

      - name: Delete private staging release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ steps.release.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --yes || true
