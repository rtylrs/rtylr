[package]
name = "rtylr-pos"
version = "0.1.0"
description = "rtylr POS Terminal"
authors = ["Voxire"]
license = "UNLICENSED"
repository = "https://github.com/voxire/rtylr"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winspool", "minwindef", "winerror"] }
