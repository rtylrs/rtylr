name: Deploy promoted release

# This adapter is reached only after tryrtylr/deploy promotes a docs version.
on:
  repository_dispatch:
    types: [deploy-release]
  workflow_dispatch:
    inputs:
      version:
        description: Promoted docs version
        required: true
        type: string
      release_tag:
        description: GitHub release tag
        required: true
        type: string
      build_script:
        description: pnpm script to run
        required: false
        default: docs:build
        type: string
      node_version:
        description: Node.js version
        required: false
        default: '22'
        type: string
      dist_dir:
        description: Built distribution directory
        required: true
        type: string
      project_name:
        description: Cloudflare Pages project
        required: true
        type: string
      runs_on:
        description: Runner label
        required: false
        default: blacksmith-2vcpu-ubuntu-2404
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve promoted docs release
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.values.outputs.version }}
      release_tag: ${{ steps.values.outputs.release_tag }}
      build_script: ${{ steps.values.outputs.build_script }}
      node_version: ${{ steps.values.outputs.node_version }}
      dist_dir: ${{ steps.values.outputs.dist_dir }}
      project_name: ${{ steps.values.outputs.project_name }}
      runs_on: ${{ steps.values.outputs.runs_on }}
    steps:
      - name: Read dispatch or manual inputs
        id: values
        env:
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ inputs.version }}
          PAYLOAD_RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          PAYLOAD_BUILD_SCRIPT: ${{ github.event.client_payload.build_script }}
          INPUT_BUILD_SCRIPT: ${{ inputs.build_script }}
          PAYLOAD_NODE_VERSION: ${{ github.event.client_payload.node_version }}
          INPUT_NODE_VERSION: ${{ inputs.node_version }}
          PAYLOAD_DIST_DIR: ${{ github.event.client_payload.dist_dir }}
          INPUT_DIST_DIR: ${{ inputs.dist_dir }}
          PAYLOAD_PROJECT_NAME: ${{ github.event.client_payload.project_name }}
          INPUT_PROJECT_NAME: ${{ inputs.project_name }}
          PAYLOAD_RUNS_ON: ${{ github.event.client_payload.runs_on }}
          INPUT_RUNS_ON: ${{ inputs.runs_on }}
        run: |
          set -euo pipefail
          version="${PAYLOAD_VERSION:-$INPUT_VERSION}"
          release_tag="${PAYLOAD_RELEASE_TAG:-$INPUT_RELEASE_TAG}"
          build_script="${PAYLOAD_BUILD_SCRIPT:-${INPUT_BUILD_SCRIPT:-docs:build}}"
          node_version="${PAYLOAD_NODE_VERSION:-${INPUT_NODE_VERSION:-22}}"
          dist_dir="${PAYLOAD_DIST_DIR:-$INPUT_DIST_DIR}"
          project_name="${PAYLOAD_PROJECT_NAME:-$INPUT_PROJECT_NAME}"
          runs_on="${PAYLOAD_RUNS_ON:-${INPUT_RUNS_ON:-blacksmith-2vcpu-ubuntu-2404}}"

          for value in "$version" "$release_tag" "$build_script" "$node_version" "$dist_dir" "$project_name"; do
            [ -n "$value" ] || { echo 'Missing deployment input' >&2; exit 1; }
          done

          {
            echo "version=$version"
            echo "release_tag=$release_tag"
            echo "build_script=$build_script"
            echo "node_version=$node_version"
            echo "dist_dir=$dist_dir"
            echo "project_name=$project_name"
            echo "runs_on=$runs_on"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy docs Pages release
    needs: resolve
    uses: tryrtylr/pipelines/.github/workflows/deploy-pages-release.yml@main
    with:
      source_repository: tryrtylr/rtylr-docs
      source_ref: ${{ needs.resolve.outputs.release_tag }}
      app_filter: ''
      build_script: ${{ needs.resolve.outputs.build_script }}
      node_version: ${{ needs.resolve.outputs.node_version }}
      dist_dir: ${{ needs.resolve.outputs.dist_dir }}
      project_name: ${{ needs.resolve.outputs.project_name }}
      runs_on: ${{ needs.resolve.outputs.runs_on }}
    secrets: inherit
